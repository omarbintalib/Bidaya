/* ---------- cited synopsis (files 6 and 7 of the data package) ---------- */
const SEQ_OF = {}; EV.forEach(e=>SEQ_OF[e.dorar]=e.seq);
function citeSources(p){
  // one numbered source per Dorar event or asbab row, in order of first use
  const list=[], idx={};
  const add=(key,mk)=>{ if(!(key in idx)){ idx[key]=list.length; list.push(mk()); } return idx[key]; };
  const facts=p.cited.facts.map(f=>{
    const key = f.dorar!=null ? 'd'+f.dorar : f.asb;
    const n = add(key,()=>({dorar:f.dorar, asb:f.asb, url:f.url, ref:f.ref, quotes:[]}));
    list[n].quotes.push(f.q);
    return {...f, n};
  });
  let death=null;
  if(p.cited.death){ const d=p.cited.death; death={...d, n:add('d'+d.dorar,()=>({dorar:d.dorar, url:`https://dorar.net/history/event/${d.dorar}`, ref:'', quotes:[]}))}; }
  return {list, facts, death};
}
const citeBtn = n => `<sup><button class="cite" data-c="${n+1}" aria-label="${escA(t('citeLbl')(ad(n+1)))}">${ad(n+1)}</button></sup>`;
function deathRow(p){
  if(!p.cited) return tx(p,'death') ? `<dt>${t('fDeath')}</dt><dd>${esc(ad(tx(p,'death')))}</dd>` : '';
  const c=citeSources(p);
  return `<dt>${t('fDeath')}</dt><dd>${c.death ? esc(EN()?c.death.en:ad(c.death.ar))+citeBtn(c.death.n) : `<span class="muted">${t('deathNA')}</span>`}</dd>`;
}
function bioBlock(p){
  if(!p.cited) return `<h3>${t('bioH')}</h3><p class="bio">${esc(tx(p,'bio'))}</p><div class="draft">${t('bioUncitedNote')}</div>`;
  const c=citeSources(p);
  const bio = c.facts.map(f=>esc(EN()?f.en:ad(f.ar))+citeBtn(f.n)).join(' ');
  const src = c.list.map((x,i)=>{
    let label, open='';
    if(x.asb){
      const a=AS[x.asb];
      label = `${esc(EN()?a.t_en:a.t)}<span class="cite-sub">${[a.bk?`${t('vBk')} ${hadRef(a.bk)}`:'', a.ms?`${t('vMs')} ${hadRef(a.ms)}`:''].filter(Boolean).join(' · ')}</span>`;
    } else if(x.dorar in SEQ_OF){
      const sq=SEQ_OF[x.dorar];
      label = `<button class="cite-ev" data-seq="${sq}">${esc(tx(EV[sq],'title'))}</button>`;
    } else {
      label = EN() ? esc(t('evNo')(x.dorar)) : esc(x.ref || t('evNo')(ad(x.dorar)));
    }
    if(x.url) open = `<a href="${escA(x.url)}" target="_blank" rel="noopener">${t('dorarLink')}</a>`;
    const q = x.quotes.length ? `<details class="cite-q"><summary>${t('quoteSum')}</summary>${x.quotes.map(q=>`<p lang="ar" dir="rtl">«${esc(q)}»</p>`).join('')}</details>` : '';
    return `<li id="cite-${i+1}"><span class="cite-n">${ad(i+1)}</span><div>${label}${open?` <span class="cite-link">· ${open}</span>`:''}${q}</div></li>`;
  }).join('');
  return `<h3>${t('bioCitedH')}</h3><p class="bio">${bio}</p>
    <div class="draft">${t('bioCitedNote')}</div>
    <h3 class="src-h">${t('srcH')}</h3><ol class="cites">${src}</ol>`;
}

const canHover = matchMedia('(hover:hover)').matches;
function showPop(el){
  const k=el.dataset.p, p=PP[k]; if(!p || !canHover) return;
  const pop=$('pop');
  pop.innerHTML=`<b>${esc(tx(p,'name'))}</b>${tx(p,'hon')?`<span class="hon">${esc(tx(p,'hon'))}</span>`:''}<p>${esc(tx(p,'desc'))}</p><small>${t('popHint')}</small>`;
  pop.classList.add('is-on');
  const r=el.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  let x=EN()?r.left:r.right-w; x=Math.max(10,Math.min(x,innerWidth-w-10));
  let y=r.bottom+8; if(y+h>innerHeight-10) y=r.top-h-8;
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
function hidePop(){ $('pop').classList.remove('is-on'); }
document.addEventListener('mouseover',ev=>{ const el=ev.target.closest('.pname,.chip'); el?showPop(el):hidePop(); });
document.addEventListener('focusin',ev=>{ const el=ev.target.closest('.pname,.chip'); el?showPop(el):hidePop(); });
document.addEventListener('scroll',hidePop,true);
$('panel').addEventListener('keydown',ev=>{
  const el=ev.target.closest('.pname'); if(el && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); el.click(); }
});
$('panel').addEventListener('click',ev=>{
  const el=ev.target.closest('.pname'); if(!el) return;
  hidePop(); stopPlay(); openPerson(el.dataset.p, false);
});

/* ---------- state changes ---------- */
function render(){
  renderTimeline();
  if(state.view==='detail' && state.seq!=null) renderDetail();
  else renderList();
  drawZones(); renderStat(); renderMini(); renderFigures(); drawStage(); drawRoute(state.view==='detail' && state.seq!=null ? EV[state.seq] : null);
  $('lgStage').textContent = !!state.mapPerson ? t('lgPerson') : t('lgStage');
  $('personBar').classList.toggle('is-on', !!state.mapPerson);
  if(state.mapPerson) $('pbName').textContent = tx(PP[state.mapPerson],'name');
  updateStory();
}
function selectStage(i){
  state.mapPerson=null; state.stage=i; state.view='list'; state.seq=null; state.expanded=false; state.arOpen=false;
  render(); frame(); $('panel').scrollTop=0;
}
function selectEvent(seq,opts={}){
  state.mapPerson=null; state.seq=seq; state.stage=EV[seq].stage; state.view='detail'; state.expanded=false; state.arOpen=false;
  render(); frame(); $('panel').scrollTop=0;
  if(window.innerWidth<=900 && !opts.fromMap && !state.story) $('panel').scrollIntoView({behavior:'smooth'});
}
function step(d){
  const base = state.seq==null ? ST[state.stage].start - (d>0?1:0) : state.seq;
  const n=Math.min(EV.length-1, Math.max(0, base+d));
  if(n===state.seq) { stopPlay(); return; }
  selectEvent(n);
}

/* ---------- story mode ---------- */
function updateStory(){
  $('story').classList.toggle('is-on', state.story);
  $('storyBtn').setAttribute('aria-pressed', state.story);
  $('storyBtn').textContent = state.story ? t('storyOn') : t('story');
  const i = state.seq==null ? 0 : state.seq+1;
  $('sLabel').textContent = t('sLabel')(ad(i),ad(EV.length));
  $('sBar').style.width = (i/EV.length*100)+'%';
  $('sPlay').textContent = state.playing ? t('sPause') : t('sPlay');
}
function startStory(){ state.story=true; if(state.seq==null) selectEvent(0); else render(); }
function stopPlay(){ state.playing=false; clearInterval(state.timer); state.timer=null; updateStory(); }
function togglePlay(){
  if(state.playing) return stopPlay();
  state.playing=true;
  state.timer=setInterval(()=>{ if(state.seq>=EV.length-1) return stopPlay(); step(1); }, 9000);
  updateStory();
}
$('storyBtn').onclick=()=>{ state.story ? (stopPlay(), state.story=false, updateStory()) : startStory(); };
$('sPlay').onclick=togglePlay;
$('sNext').onclick=()=>{ stopPlay(); step(1); };
$('sPrev').onclick=()=>{ stopPlay(); step(-1); };
$('sClose').onclick=()=>{ stopPlay(); state.story=false; updateStory(); };

/* ---------- keyboard + modal ---------- */
document.addEventListener('keydown',ev=>{
  if($('modal').classList.contains('is-open')){ if(ev.key==='Escape') $('modal').classList.remove('is-open'); return; }
  if($('pdlg').classList.contains('is-open')){ if(ev.key==='Escape') closeDlg(); return; }
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const fwd = EN() ? 'ArrowRight' : 'ArrowLeft', back = EN() ? 'ArrowLeft' : 'ArrowRight';
  if(ev.key===fwd){ stopPlay(); step(1); ev.preventDefault(); }
  if(ev.key===back){ stopPlay(); step(-1); ev.preventDefault(); }
});
$('aboutBtn').onclick=()=>{ $('modal').classList.add('is-open'); $('mClose').focus(); };
$('mClose').onclick=()=>$('modal').classList.remove('is-open');
$('modal').onclick=e=>{ if(e.target.id==='modal') $('modal').classList.remove('is-open'); };

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = EN() ? 'ltr' : 'rtl';
  document.title = t('title');
  $('logoLbl').setAttribute('aria-label', EN()?'Bidaya':'بداية');
  $('tagline').textContent = t('tagline'); $('langBtn').textContent = t('langBtn');
  $('langBtn').setAttribute('lang', EN()?'ar':'en');
  $('peopleBtn').textContent = t('people'); $('aboutBtn').textContent = t('about');
  ['pbShows','pbExit','notice','sPrev','sNext','sClose','lgTitle','lgActive','lgPast','lgRoute','lgZone','eraM','eraD'].forEach(id=>$(id).textContent=t(id));
  $('pdlgBack').textContent = t('allFig'); $('pdlgClose').textContent = t('close'); $('mClose').textContent = t('close');
  $('mBody').innerHTML = t('aboutHTML');
  const A = EN() ? ['Map','Stage events timeline','Map key','Stages of the Sirah','Story mode'] : ['الخريطة','أحداث المرحلة على الخط الزمني','دليل الخريطة','مراحل السيرة','القصة خطوة بخطوة'];
  ['mapWrap','mini','legendCard','timelineNav','story'].forEach((id,i)=>$(id).setAttribute('aria-label',A[i]));
  drawBase();
  if($('pdlg').classList.contains('is-open')) closeDlg();
  applyTheme();
}
$('langBtn').onclick=()=>{
  LANG = EN() ? 'ar' : 'en';
  try{ localStorage.setItem('bidaya-lang', LANG); }catch(e){}
  hidePop(); applyLang(); frame();
};

/* ---------- theme ---------- */
function applyTheme(){
  const d=isDark();
  $('themeBtn').textContent = d ? t('light') : t('dark');
  $('themeBtn').setAttribute('aria-pressed', d);
  tiles.setUrl(TILE(d?'dark':'light'));
  render();
}
$('themeBtn').onclick=()=>{
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('bidaya-theme', next); }catch(e){}
  applyTheme();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!document.documentElement.getAttribute('data-theme')) applyTheme(); });

lockRegion(); applyLang(); frame();
window.addEventListener('load',()=>{ lockRegion(); frame(); });
</script>
<script src="https://quranpedia.net/embed.js" defer></script>
</body>
</html>
