"ASB-005": {"t": "الصدع بالدعوة على الصفا", "t_en": "Proclaiming the call from al-Safa", "refs": [[26, "الشعراء", "Ash-Shu'ara", "214"]], "ph": "نزلت فعمل بها النبي ﷺ", "ph_en": "Revealed, and the Prophet ﷺ acted on it", "txt": "لما نزلت ﴿وَأَنْذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ﴾ صعد النبي ﷺ على الصفا، فجعل ينادي بطون قريش حتى اجتمعوا، فقال: «إني نذير لكم بين يدي عذاب شديد».", "bk": "4770، 4771", "ms": "208", "type": "امتثال بعد النزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-006": {"t": "قول أبي لهب على الصفا ونزول سورة المسد", "t_en": "Abu Lahab's words at al-Safa and the revelation of Surat al-Masad", "refs": [[111, "المسد", "Al-Masad", "1-5"]], "ph": "نزلت هذه السورة بسبب الواقعة المذكورة", "ph_en": "This surah was revealed because of the incident above", "txt": "لما جمع النبي ﷺ قريشًا على الصفا وأنذرهم، قال أبو لهب: «تبًّا لك سائر اليوم، ألهذا جمعتنا؟»، فنزلت سورة المسد.", "bk": "4770، 4971، 4972", "ms": "208", "type": "سبب نزول صريح", "whole": true, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/111/1"]}, "ASB-007": {"t": "طلب المشركين إبعاد ضعفاء المسلمين عن مجلس النبي ﷺ", "t_en": "The polytheists ask that the weak Muslims be sent away from the Prophet's ﷺ gathering", "refs": [[6, "الأنعام", "Al-An'am", "52"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال سعد بن أبي وقاص رضي الله عنه: كنا مع النبي ﷺ ستة نفر: أنا وابن مسعود ورجل من هذيل وبلال ورجلان، فقال المشركون: «اطرد هؤلاء لا يجترئون علينا»، فوقع في نفس النبي ﷺ ما شاء الله أن يقع، فأنزل الله: ﴿وَلَا تَطْرُدِ الَّذِينَ يَدْعُونَ رَبَّهُمْ بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ﴾.", "bk": "", "ms": "2413", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/6/14"]}, "ASB-008": {"t": "وعيد أبي جهل للنبي ﷺ وهو يصلي عند الكعبة", "t_en": "Abu Jahl threatens the Prophet ﷺ while he prays at the Kaaba", "refs": [[96, "العلق", "Al-Alaq", "6-19"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "حلف أبو جهل لئن رأى النبي ﷺ يصلي عند الكعبة ليطأنّ على رقبته، فلما دنا منه نكص على عقبيه وقال: «إن بيني وبينه لخندقًا من نار وهولًا وأجنحة»، فقال النبي ﷺ: «لو دنا مني لاختطفته الملائكة». وفي رواية مسلم: فأنزل الله هذه الآيات.", "bk": "4958", "ms": "2797", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/96/2"]}, "ASB-009": {"t": "قول أبي جهل: «اللهم إن كان هذا هو الحق من عندك»", "t_en": "Abu Jahl's words: \"O Allah, if this is the truth from You\"", "refs": [[8, "الأنفال", "Al-Anfal", "32-33"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال أبو جهل: «اللهم إن كان هذا هو الحق من عندك فأمطر علينا حجارة من السماء أو ائتنا بعذاب أليم»، فنزلت الآيتان.", "bk": "4648، 4649", "ms": "2796", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-010": {"t": "دَين خبّاب عند العاص بن وائل", "t_en": "Khabbab's debt owed by al-As ibn Wa'il", "refs": [[19, "مريم", "Maryam", "77-80"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "كان لخبّاب بن الأرت رضي الله عنه دَين على العاص بن وائل، فأتاه يتقاضاه، فقال: «لا أعطيك حتى تكفر بمحمد»، فقال خبّاب: «لا أكفر حتى يميتك الله ثم تُبعث»، قال: «فدعني حتى أموت وأُبعث، فسأُوتى مالًا وولدًا فأقضيك»، فنزلت الآيات.", "bk": "2091، 4732", "ms": "2795", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/19/14"]}, "ASB-011": {"t": "حديث النفر الثلاثة عند الكعبة", "t_en": "The three men at the Kaaba", "refs": [[41, "فصلت", "Fussilat", "22-23"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "اجتمع عند الكعبة ثلاثة نفر: قرشيان وثقفي، أو ثقفيان وقرشي، فقال أحدهم: «أترون الله يسمع ما نقول؟»، فقال آخر: «يسمع إن جهرنا، ولا يسمع إن أخفينا»، فأنزل الله الآيات. وكان ابن مسعود رضي الله عنه مستترًا بأستار الكعبة يسمعهم.", "bk": "4816، 4817", "ms": "2775", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/41/4"]}, "ASB-012": {"t": "سؤال المشركين عن التوبة بعد القتل والزنا", "t_en": "The polytheists ask about repentance after killing and adultery", "refs": [[25, "الفرقان", "Al-Furqan", "68-70"], [39, "الزمر", "Az-Zumar", "53"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: إن ناسًا من أهل الشرك قتلوا فأكثروا، وزنوا فأكثروا، فأتوا النبي ﷺ فقالوا: «إن الذي تقول وتدعو إليه لحسن، لو تخبرنا أن لما عملنا كفارة»، فنزلت آيات سورة الفرقان، ونزلت: ﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾.", "bk": "4810", "ms": "122", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/25/14", "https://dorar.net/tafseer/39/15"]}, "ASB-013": {"t": "استماع الجن للقرآن بنخلة", "t_en": "The jinn listen to the Quran at Nakhlah", "refs": [[72, "الجن", "Al-Jinn", "1-2"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: انطلق النبي ﷺ في طائفة من أصحابه عامدين إلى سوق عكاظ، فصلى بهم الفجر بنخلة، فاستمع نفر من الجن القرآن ورجعوا إلى قومهم، فأنزل الله على نبيه: ﴿قُلْ أُوحِيَ إِلَيَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِنَ الْجِنِّ﴾.", "bk": "773، 4921", "ms": "449", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/72/1"]}, "ASB-014": {"t": "وفاة أبي طالب", "t_en": "The death of Abu Talib", "refs": [[9, "التوبة", "At-Tawbah", "113"], [28, "القصص", "Al-Qasas", "56"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "حضر النبي ﷺ عمه أبا طالب عند موته، فقال: «يا عم، قل: لا إله إلا الله، كلمة أحاجّ لك بها عند الله»، فأبى، فقال النبي ﷺ: «لأستغفرن لك ما لم أُنه عنك»، فنزلت آية التوبة، ونزلت في أبي طالب: ﴿إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ﴾.", "bk": "1360، 3884، 4675، 4772", "ms": "24", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/28/11"]}, "ASB-015": {"t": "احتباس الوحي ونزول سورة الضحى", "t_en": "Revelation is delayed, then Surat al-Duha is revealed", "refs": [[93, "الضحى", "Ad-Duha", "1-3"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "اشتكى النبي ﷺ فلم يقم ليلتين أو ثلاثًا، فجاءت امرأة فقالت: «يا محمد، إني لأرجو أن يكون شيطانك قد تركك»، فأنزل الله: ﴿وَالضُّحَىٰ ۝ وَاللَّيْلِ إِذَا سَجَىٰ ۝ مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ﴾. وفي رواية للبخاري (1125): احتبس جبريل عليه السلام، فقالت امرأة من قريش: «أبطأ عليه شيطانه».", "bk": "1125، 4950، 4983", "ms": "1797", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/93/1"]}, "ASB-016": {"t": "سبّ الدهر", "t_en": "Cursing time (al-dahr)", "refs": [[45, "الجاثية", "Al-Jathiyah", "24"]], "ph": "ترتبط الآية بالواقعة المذكورة", "ph_en": "The verse relates to the incident above", "txt": "تحكي الآية قول المشركين: ﴿وَمَا يُهْلِكُنَا إِلَّا الدَّهْرُ﴾، وفي الحديث القدسي: «يؤذيني ابن آدم، يسب الدهر وأنا الدهر، بيدي الأمر، أقلب الليل والنهار». وأورده البخاري في تفسير سورة الجاثية.", "bk": "4826", "ms": "2246", "type": "سياق مرتبط", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-017": {"t": "عتاب المؤمنين في خشوع القلوب", "t_en": "The believers reproached about humble hearts", "refs": [[57, "الحديد", "Al-Hadid", "16"]], "ph": "حدّد الصحابي وقت نزولها", "ph_en": "A Companion stated when it was revealed", "txt": "قال ابن مسعود رضي الله عنه: «ما كان بين إسلامنا وبين أن عاتبنا الله بهذه الآية إلا أربع سنين».", "bk": "", "ms": "3027", "type": "زمن أو مكان النزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-018": {"t": "تفسير ابن عباس لقوله تعالى: ﴿لَرَادُّكَ إِلَىٰ مَعَادٍ﴾", "t_en": "Ibn Abbas explains \"He will return you to a place of return\"", "refs": [[28, "القصص", "Al-Qasas", "85"]], "ph": "هذا تفسير الصحابي للآية", "ph_en": "This is a Companion's explanation of the verse", "txt": "قال ابن عباس رضي الله عنهما في قوله تعالى: ﴿لَرَادُّكَ إِلَىٰ مَعَادٍ﴾: «إلى مكة».", "bk": "4773", "ms": "", "type": "تفسير صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-019": {"t": "بيان النبي ﷺ أن الظلم في الآية هو الشرك", "t_en": "The Prophet ﷺ explains that the wrongdoing in the verse is shirk", "refs": [[6, "الأنعام", "Al-An'am", "82"]], "ph": "بيّن النبي ﷺ معناها", "ph_en": "The Prophet ﷺ explained its meaning", "txt": "لما نزلت الآية شقّ ذلك على الصحابة رضي الله عنهم وقالوا: «أيّنا لا يظلم نفسه؟»، فقال النبي ﷺ: «ليس كما تظنون، إنما هو الشرك، ألم تسمعوا قول لقمان لابنه: ﴿إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾».", "bk": "32، 3360، 4629، 4776", "ms": "124", "type": "بيان نبوي للآية", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-020": {"t": "إسلام عبد الله بن سلام عند قدوم النبي ﷺ المدينة", "t_en": "Abdullah ibn Salam's Islam when the Prophet ﷺ arrived in Madinah", "refs": [[2, "البقرة", "Al-Baqarah", "97"]], "ph": "تلاها النبي ﷺ في الواقعة المذكورة", "ph_en": "The Prophet ﷺ recited it during the incident above", "txt": "سأل عبد الله بن سلام رضي الله عنه النبيَّ ﷺ عن ثلاث مسائل لا يعلمهن إلا نبي، فقال النبي ﷺ: «أخبرني بهن جبريل آنفًا»، فقال ابن سلام: «ذاك عدو اليهود من الملائكة»، فقرأ النبي ﷺ: ﴿مَنْ كَانَ عَدُوًّا لِجِبْرِيلَ فَإِنَّهُ نَزَّلَهُ عَلَىٰ قَلْبِكَ بِإِذْنِ اللَّهِ﴾.", "bk": "3329، 3938، 4480", "ms": "", "type": "استشهاد بالآية", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-021": {"t": "التوارث بالمؤاخاة ثم نسخه", "t_en": "Inheritance through the brotherhood, later abrogated", "refs": [[4, "النساء", "An-Nisa", "33"]], "ph": "نزلت فغيّرت حكمًا سابقًا", "ph_en": "Revealed to change an earlier ruling", "txt": "كان المهاجرون لما قدموا المدينة يرث المهاجريُّ الأنصاريَّ دون ذوي رحمه، للأخوّة التي آخى النبي ﷺ بينهم، فلما نزلت ﴿وَلِكُلٍّ جَعَلْنَا مَوَالِيَ﴾ نُسخ ذلك.", "bk": "2292، 4580، 6747", "ms": "", "type": "نسخ أو تخفيف", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-022": {"t": "تحويل القبلة إلى الكعبة", "t_en": "The change of the qiblah to the Kaaba", "refs": [[2, "البقرة", "Al-Baqarah", "142-144"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "صلى النبي ﷺ نحو بيت المقدس ستة عشر أو سبعة عشر شهرًا، وكان يحب أن يوجَّه إلى الكعبة، فأنزل الله: ﴿قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ﴾، فتوجّه نحو الكعبة. ونزل فيمن مات قبل التحويل: ﴿وَمَا كَانَ اللَّهُ لِيُضِيعَ إِيمَانَكُمْ﴾.", "bk": "40، 399، 4486", "ms": "525", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/24"]}, "ASB-023": {"t": "فرض صيام رمضان ونسخ التخيير", "t_en": "Fasting Ramadan made obligatory and the option abrogated", "refs": [[2, "البقرة", "Al-Baqarah", "184-185"]], "ph": "نزلت فغيّرت حكمًا سابقًا", "ph_en": "Revealed to change an earlier ruling", "txt": "قال سلمة بن الأكوع رضي الله عنه: لما نزلت ﴿وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ﴾ كان من أراد أن يفطر ويفتدي فعل، حتى نزلت الآية التي بعدها فنسختها.", "bk": "4507", "ms": "1145", "type": "نسخ أو تخفيف", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-024": {"t": "قصة قيس بن صرمة ورخصة ليالي الصيام", "t_en": "Qays ibn Sirmah and the concession for the nights of fasting", "refs": [[2, "البقرة", "Al-Baqarah", "187"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "كان الصائم إذا نام قبل أن يفطر لم يأكل حتى يمسي من الغد، وكان قيس بن صرمة الأنصاري رضي الله عنه صائمًا فنام قبل أن يطعم، فغُشي عليه نصف النهار، وكانوا لا يقربون النساء رمضان كله، فنزلت: ﴿أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَىٰ نِسَائِكُمْ﴾.", "bk": "1915، 4508", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/32"]}, "ASB-025": {"t": "مرور النبي ﷺ بمجلس فيه عبد الله بن أبي قبل بدر", "t_en": "The Prophet ﷺ passes a gathering with Abdullah ibn Ubayy, before Badr", "refs": [[3, "آل عمران", "Al Imran", "186"]], "ph": "ترتبط الآية بالواقعة المذكورة", "ph_en": "The verse relates to the incident above", "txt": "ركب النبي ﷺ حمارًا يعود سعد بن عبادة رضي الله عنه قبل وقعة بدر، فمرّ بمجلس فيه عبد الله بن أبي ابن سلول قبل أن يُظهر الإسلام، فآذاه بالقول. قال أسامة بن زيد رضي الله عنهما: وكان النبي ﷺ وأصحابه يعفون عن المشركين وأهل الكتاب، ويصبرون على الأذى كما أمرهم الله، ثم ذكر الآية.", "bk": "4566", "ms": "1798", "type": "سياق مرتبط", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-026": {"t": "غنائم بدر وسؤال سعد عن السيف", "t_en": "The spoils of Badr and Sa'd's question about the sword", "refs": [[8, "الأنفال", "Al-Anfal", "1"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: «سورة الأنفال نزلت في بدر». وقال سعد بن أبي وقاص رضي الله عنه: أصبت سيفًا فأتيت به النبي ﷺ فقلت: «نفّلنيه»، فقال: «ضعه»، فنزلت: ﴿يَسْأَلُونَكَ عَنِ الْأَنْفَالِ﴾.", "bk": "4645", "ms": "1748، 3031", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/8/1"]}, "ASB-027": {"t": "استغاثة النبي ﷺ يوم بدر وأسرى بدر", "t_en": "The Prophet's ﷺ plea for help at Badr, and the captives of Badr", "refs": [[8, "الأنفال", "Al-Anfal", "9"], [8, "الأنفال", "Al-Anfal", "67-69"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال عمر بن الخطاب رضي الله عنه: لما كان يوم بدر نظر النبي ﷺ إلى المشركين وهم ألف، وأصحابه ثلاثمائة وتسعة عشر رجلًا، فاستقبل القبلة يدعو ربه، فأنزل الله: ﴿إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ﴾، فأمدّه الله بالملائكة. ولما أخذ الفداء من الأسرى أنزل الله: ﴿مَا كَانَ لِنَبِيٍّ أَنْ يَكُونَ لَهُ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِي الْأَرْضِ﴾.", "bk": "", "ms": "1763", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/8/3", "https://dorar.net/tafseer/8/21"]}, "ASB-028": {"t": "تخفيف مصابرة العدو", "t_en": "Lightening the duty to stand firm against the enemy", "refs": [[8, "الأنفال", "Al-Anfal", "65-66"]], "ph": "نزلت فغيّرت حكمًا سابقًا", "ph_en": "Revealed to change an earlier ruling", "txt": "قال ابن عباس رضي الله عنهما: لما نزلت ﴿إِنْ يَكُنْ مِنْكُمْ عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ﴾ شقّ ذلك على المسلمين حين فُرض ألا يفرّ واحد من عشرة، فجاء التخفيف في الآية التي بعدها.", "bk": "4652، 4653", "ms": "", "type": "نسخ أو تخفيف", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-029": {"t": "المبارزة يوم بدر", "t_en": "The duel at Badr", "refs": [[22, "الحج", "Al-Hajj", "19"]], "ph": "أخبر الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion reported that it was revealed about the incident above", "txt": "كان أبو ذر رضي الله عنه يُقسم أن هذه الآية نزلت في الذين تبارزوا يوم بدر: حمزة وعلي وعبيدة بن الحارث رضي الله عنهم، وعتبة وشيبة ابنا ربيعة والوليد بن عتبة.", "bk": "3965، 3966، 4743", "ms": "3033", "type": "سبب نزول بقول صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-030": {"t": "القاعدون عن بدر وأولو الضرر", "t_en": "Those who stayed behind from Badr, and those with disabilities", "refs": [[4, "النساء", "An-Nisa", "95"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "لما نزلت ﴿لَا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ﴾ دعا النبي ﷺ زيد بن ثابت رضي الله عنه فكتبها، فجاء ابن أم مكتوم رضي الله عنه فشكا ضرارته، فأنزل الله: ﴿غَيْرُ أُولِي الضَّرَرِ﴾. وقال ابن عباس رضي الله عنهما: «القاعدون عن بدر، والخارجون إلى بدر».", "bk": "2831، 2832، 4592، 4593، 4595", "ms": "1898", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/27"]}, "ASB-031": {"t": "همّ بني سلمة وبني حارثة يوم أحد", "t_en": "Banu Salimah and Banu Harithah waver at Uhud", "refs": [[3, "آل عمران", "Al Imran", "122"]], "ph": "أخبر الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion reported that it was revealed about the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: فينا نزلت ﴿إِذْ هَمَّتْ طَائِفَتَانِ مِنْكُمْ أَنْ تَفْشَلَا﴾: بنو سلمة وبنو حارثة، وما أحب أنها لم تنزل، لقول الله: ﴿وَاللَّهُ وَلِيُّهُمَا﴾.", "bk": "4051، 4558", "ms": "2505", "type": "سبب نزول بقول صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-032": {"t": "جرح النبي ﷺ يوم أحد", "t_en": "The Prophet ﷺ is wounded at Uhud", "refs": [[3, "آل عمران", "Al Imran", "128"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أنس رضي الله عنه: شُجّ النبي ﷺ يوم أحد وكُسرت رباعيته، فجعل يسلت الدم عنه ويقول: «كيف يفلح قوم شجّوا نبيهم؟»، فأنزل الله: ﴿لَيْسَ لَكَ مِنَ الْأَمْرِ شَيْءٌ﴾. وفي البخاري عن ابن عمر رضي الله عنهما أنها نزلت لما دعا النبي ﷺ في القنوت على رجال من المشركين.", "bk": "4069، وتعليقًا عن أنس قبله", "ms": "1791", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/3/39"]}, "ASB-033": {"t": "اختلاف الصحابة فيمن رجع يوم أحد", "t_en": "The Companions differ over those who turned back at Uhud", "refs": [[4, "النساء", "An-Nisa", "88"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال زيد بن ثابت رضي الله عنه: لما خرج النبي ﷺ إلى أحد رجع ناس ممن خرج معه، فكان أصحاب النبي ﷺ فيهم فرقتين: فرقة تقول: نقاتلهم، وفرقة تقول: لا نقاتلهم، فنزلت: ﴿فَمَا لَكُمْ فِي الْمُنَافِقِينَ فِئَتَيْنِ﴾.", "bk": "1884، 4050، 4589", "ms": "2776", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-034": {"t": "أنس بن النضر يوم أحد", "t_en": "Anas ibn al-Nadr at Uhud", "refs": [[33, "الأحزاب", "Al-Ahzab", "23"]], "ph": "رأى الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion believed that it was revealed about the incident above", "txt": "وُجد بأنس بن النضر رضي الله عنه يوم أحد بضع وثمانون ضربة وطعنة ورمية، قال ابن أخيه أنس بن مالك رضي الله عنه: «كنا نرى أن هذه الآية نزلت فيه وفي أشباهه».", "bk": "2805، 4048، 4783", "ms": "1903", "type": "ظن صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/33/7"]}, "ASB-036": {"t": "قطع نخل بني النضير", "t_en": "Cutting the palm trees of Banu al-Nadir", "refs": [[59, "الحشر", "Al-Hashr", "5"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عمر رضي الله عنهما: حرّق النبي ﷺ نخل بني النضير وقطع، وهي البويرة، فنزلت: ﴿مَا قَطَعْتُمْ مِنْ لِينَةٍ أَوْ تَرَكْتُمُوهَا قَائِمَةً عَلَىٰ أُصُولِهَا فَبِإِذْنِ اللَّهِ﴾.", "bk": "4031، 4032، 4884", "ms": "1746", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/59/2"]}, "ASB-037": {"t": "تحريم الخمر", "t_en": "The prohibition of wine", "refs": [[5, "المائدة", "Al-Ma'idah", "90-93"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال أنس رضي الله عنه: كنت ساقي القوم في منزل أبي طلحة، فنزل تحريم الخمر، فأمر النبي ﷺ مناديًا فنادى، فأُهريقت حتى جرت في سكك المدينة. فقال بعض القوم: «قُتل قوم وهي في بطونهم»، فأنزل الله: ﴿لَيْسَ عَلَى الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا﴾.", "bk": "2464، 4618، 4620", "ms": "1980", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/5/28"]}, "ASB-038": {"t": "إبطال التبني", "t_en": "Adoption abolished", "refs": [[33, "الأحزاب", "Al-Ahzab", "5"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عمر رضي الله عنهما: ما كنا ندعو زيد بن حارثة إلا «زيد بن محمد» حتى نزل القرآن: ﴿ادْعُوهُمْ لِآبَائِهِمْ﴾.", "bk": "4782", "ms": "2425", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-039": {"t": "وليمة زواج أم المؤمنين زينب بنت جحش ونزول آية الحجاب", "t_en": "The wedding feast of Zaynab bint Jahsh, Mother of the Believers, and the verse of hijab", "refs": [[33, "الأحزاب", "Al-Ahzab", "53"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "لما تزوج النبي ﷺ أم المؤمنين زينب بنت جحش رضي الله عنها دعا القوم فطعموا، ثم جلسوا يتحدثون، فلما قاموا بقي ثلاثة نفر، فاستحيا النبي ﷺ منهم، فأنزل الله آية الحجاب.", "bk": "4791، 4792، 4793", "ms": "1428", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/33/17"]}, "ASB-040": {"t": "قول عبد الله بن أبي في غزوة بني المصطلق", "t_en": "Abdullah ibn Ubayy's words during the campaign of Banu al-Mustaliq", "refs": [[63, "المنافقون", "Al-Munafiqun", "1-8"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "سمع زيد بن أرقم رضي الله عنه عبد الله بن أبي يقول: «لا تنفقوا على من عند رسول الله حتى ينفضّوا، ولئن رجعنا إلى المدينة ليُخرجن الأعز منها الأذل»، فأخبر النبيَّ ﷺ، فحلف ابن أبي ما قال، فأنزل الله تصديق زيد.", "bk": "4900، 4901، 4902، 4903، 4904", "ms": "2772", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/63/1", "https://dorar.net/tafseer/63/3"]}, "ASB-041": {"t": "انقطاع عقد أم المؤمنين عائشة ونزول آية التيمم", "t_en": "Aishah, Mother of the Believers, loses her necklace and the verse of tayammum is revealed", "refs": [[5, "المائدة", "Al-Ma'idah", "6"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "انقطع عقد لأم المؤمنين عائشة رضي الله عنها في بعض أسفار النبي ﷺ، فأقام الناس على التماسه وليسوا على ماء، فأنزل الله آية التيمم، فقال أسيد بن حضير رضي الله عنه: «ما هي بأول بركتكم يا آل أبي بكر».", "bk": "334، 4583، 4607، 4608", "ms": "367", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/14"]}, "ASB-042": {"t": "حادثة الإفك وبراءة أم المؤمنين عائشة", "t_en": "The incident of the slander and the innocence of Aishah, Mother of the Believers", "refs": [[24, "النور", "An-Nur", "11-20"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "رُميت أم المؤمنين عائشة رضي الله عنها بالإفك، ومكث النبي ﷺ شهرًا لا يوحى إليه في شأنها، ثم أنزل الله براءتها في عشر آيات من سورة النور.", "bk": "2661، 4141، 4750", "ms": "2770", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/24/4"]}, "ASB-043": {"t": "يمين أبي بكر على مسطح", "t_en": "Abu Bakr's oath about Mistah", "refs": [[24, "النور", "An-Nur", "22"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "حلف أبو بكر الصديق رضي الله عنه ألا ينفق على مسطح بعد ما قال في عائشة رضي الله عنها، فأنزل الله: ﴿وَلَا يَأْتَلِ أُولُو الْفَضْلِ مِنْكُمْ وَالسَّعَةِ﴾، فقال أبو بكر: «بلى والله، إني لأحب أن يغفر الله لي»، فأرجع إليه النفقة.", "bk": "2661، 4750", "ms": "2770", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/24/5"]}, "ASB-044": {"t": "نزول سورة الفتح في الرجوع من الحديبية", "t_en": "Surat al-Fath revealed on the return from Hudaybiyyah", "refs": [[48, "الفتح", "Al-Fath", "1-5"]], "ph": "نزلت في طريق العودة من الحديبية", "ph_en": "Revealed on the way back from al-Hudaybiyyah", "txt": "قال أنس رضي الله عنه: نزلت على النبي ﷺ مرجعه من الحديبية. وقال النبي ﷺ لعمر رضي الله عنه: «لقد أُنزلت عليّ الليلة سورة لهي أحب إليّ مما طلعت عليه الشمس».", "bk": "4172، 4177، 4833، 4834", "ms": "1785، 1786", "type": "زمن أو مكان النزول", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/46/4"]}, "ASB-045": {"t": "كفّ أيدي المشركين في الحديبية", "t_en": "The polytheists' hands held back at Hudaybiyyah", "refs": [[48, "الفتح", "Al-Fath", "24"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أنس رضي الله عنه: هبط ثمانون رجلًا من أهل مكة من جبل التنعيم متسلحين، يريدون غِرّة النبي ﷺ وأصحابه، فأخذهم سِلمًا فاستحياهم، فأنزل الله: ﴿وَهُوَ الَّذِي كَفَّ أَيْدِيَهُمْ عَنْكُمْ وَأَيْدِيَكُمْ عَنْهُمْ بِبَطْنِ مَكَّةَ﴾.", "bk": "", "ms": "1808", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-046": {"t": "فدية الأذى لكعب بن عجرة", "t_en": "The expiation for Ka'b ibn Ujrah's ailment", "refs": [[2, "البقرة", "Al-Baqarah", "196"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "حُمل كعب بن عجرة رضي الله عنه إلى النبي ﷺ بالحديبية والقمل يتناثر على وجهه وهو محرم، فنزلت: ﴿فَفِدْيَةٌ مِنْ صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ﴾.", "bk": "1814، 1816، 4517", "ms": "1201", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/34"]}, "ASB-047": {"t": "امتحان المؤمنات المهاجرات", "t_en": "Testing the believing women who emigrated", "refs": [[60, "الممتحنة", "Al-Mumtahanah", "10-12"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "لما كاتب النبي ﷺ سهيل بن عمرو يوم الحديبية جاءت المؤمنات مهاجرات، فأنزل الله فيهن آية الامتحان، فكان النبي ﷺ يمتحنهن بها.", "bk": "2711، 2713، 4891", "ms": "1866", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/60/4"]}, "ASB-048": {"t": "بيعة الرضوان تحت الشجرة", "t_en": "The Pledge of al-Ridwan under the tree", "refs": [[48, "الفتح", "Al-Fath", "18"]], "ph": "تشير الآية إلى هذا الحدث", "ph_en": "The verse refers to this event", "txt": "قال جابر بن عبد الله رضي الله عنهما: قال لنا النبي ﷺ يوم الحديبية: «أنتم خير أهل الأرض»، وكنا ألفًا وأربعمائة، وبايعناه تحت الشجرة.", "bk": "4154، 4840", "ms": "1856", "type": "حدث تشير إليه الآية", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-049": {"t": "كتاب حاطب بن أبي بلتعة إلى قريش", "t_en": "Hatib ibn Abi Balta'ah's letter to Quraysh", "refs": [[60, "الممتحنة", "Al-Mumtahanah", "1"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "كتب حاطب بن أبي بلتعة رضي الله عنه إلى ناس من مشركي مكة يخبرهم ببعض أمر النبي ﷺ، فبعث النبي ﷺ عليًّا والزبير والمقداد رضي الله عنهم فأدركوا المرأة التي تحمل الكتاب بروضة خاخ وأخذوه، فنزلت: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا عَدُوِّي وَعَدُوَّكُمْ أَوْلِيَاءَ﴾.", "bk": "3007، 4274، 4890", "ms": "2494", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/60/1"]}, "ASB-050": {"t": "يوم حنين وثبات النبي ﷺ", "t_en": "The day of Hunayn and the Prophet's ﷺ steadfastness", "refs": [[9, "التوبة", "At-Tawbah", "25-26"]], "ph": "تشير الآيات إلى هذا الحدث", "ph_en": "These verses refer to this event", "txt": "انكشف المسلمون يوم حنين أول الأمر، وثبت النبي ﷺ على بغلته يقول: «أنا النبي لا كذب، أنا ابن عبد المطلب»، ثم نصر الله المسلمين.", "bk": "2864، 4315، 4317", "ms": "1775، 1776", "type": "حدث تشير إليه الآية", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/9/10"]}, "ASB-051": {"t": "وفد بني تميم واختلاف أبي بكر وعمر", "t_en": "The delegation of Banu Tamim and Abu Bakr and Umar's disagreement", "refs": [[49, "الحجرات", "Al-Hujurat", "1-2"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قدم ركب من بني تميم، فقال أبو بكر رضي الله عنه: «أمِّر القعقاع بن معبد»، وقال عمر رضي الله عنه: «بل أمِّر الأقرع بن حابس»، فتماريا حتى ارتفعت أصواتهما، فنزل في ذلك صدر سورة الحجرات.", "bk": "4367، 4845، 4847", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/49/1"]}, "ASB-052": {"t": "توبة الثلاثة الذين خُلّفوا", "t_en": "The repentance of the three who stayed behind", "refs": [[9, "التوبة", "At-Tawbah", "117-118"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "تاب الله على كعب بن مالك وهلال بن أمية ومرارة بن الربيع رضي الله عنهم، بعد خمسين ليلة هجرهم فيها المسلمون لتخلفهم عن غزوة تبوك.", "bk": "4418، 4677", "ms": "2769", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/9/43"]}, "ASB-053": {"t": "لمز المنافقين للمتصدقين", "t_en": "The hypocrites mock those giving charity", "refs": [[9, "التوبة", "At-Tawbah", "79"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أبو مسعود الأنصاري رضي الله عنه: لما أُمرنا بالصدقة كنا نحامل على ظهورنا، فجاء رجل فتصدق بشيء كثير، فقال المنافقون: «مُراءٍ»، وجاء رجل فتصدق بصاع، فقالوا: «إن الله لغني عن صاع هذا»، فنزلت: ﴿الَّذِينَ يَلْمِزُونَ الْمُطَّوِّعِينَ مِنَ الْمُؤْمِنِينَ فِي الصَّدَقَاتِ﴾.", "bk": "1415، 4668", "ms": "1018", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/9/29"]}, "ASB-054": {"t": "المسجد الذي أسس على التقوى", "t_en": "The mosque founded on piety", "refs": [[9, "التوبة", "At-Tawbah", "108"]], "ph": "بيّن النبي ﷺ معناها", "ph_en": "The Prophet ﷺ explained its meaning", "txt": "سأل أبو سعيد الخدري رضي الله عنه النبي ﷺ عن المسجد الذي أُسس على التقوى، فأخذ كفًّا من حصباء فضرب به الأرض، ثم قال: «هو مسجدكم هذا»، يعني مسجد المدينة.", "bk": "", "ms": "1398", "type": "بيان نبوي للآية", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-055": {"t": "موت عبد الله بن أبي والصلاة عليه", "t_en": "The death of Abdullah ibn Ubayy and the prayer over him", "refs": [[9, "التوبة", "At-Tawbah", "80"], [9, "التوبة", "At-Tawbah", "84"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "لما توفي عبد الله بن أبي جاء ابنه إلى النبي ﷺ فأعطاه قميصه، وقام ليصلي عليه، فقال عمر رضي الله عنه: «أتصلي عليه وقد نهاك ربك؟»، فقال: «إنما خيّرني الله»، فصلى عليه، ثم أنزل الله: ﴿وَلَا تُصَلِّ عَلَىٰ أَحَدٍ مِنْهُمْ مَاتَ أَبَدًا﴾.", "bk": "1269، 4670، 4672", "ms": "2400، 2774", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/9/31"]}, "ASB-056": {"t": "حجة أبي بكر والأذان ببراءة", "t_en": "Abu Bakr's Hajj and the announcement of Bara'ah", "refs": [[9, "التوبة", "At-Tawbah", "1-3"]], "ph": "نزلت فبُلِّغت في موسم الحج", "ph_en": "Revealed, then proclaimed during the Hajj season", "txt": "قال أبو هريرة رضي الله عنه: بعثني أبو بكر رضي الله عنه في الحجة التي أمّره عليها النبي ﷺ قبل حجة الوداع، في مؤذنين يؤذنون بمنى: «ألا لا يحج بعد العام مشرك، ولا يطوف بالبيت عريان»، ثم أردف النبي ﷺ بعليّ رضي الله عنه وأمره أن يؤذن ببراءة.", "bk": "369، 4655، 4656", "ms": "1347", "type": "امتثال بعد النزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-057": {"t": "يوم عرفة في حجة الوداع", "t_en": "The day of Arafah in the Farewell Hajj", "refs": [[5, "المائدة", "Al-Ma'idah", "3"]], "ph": "نزلت يوم عرفة في حجة الوداع", "ph_en": "Revealed on the day of Arafah, in the Farewell Hajj", "txt": "قال رجل من اليهود لعمر بن الخطاب رضي الله عنه: «آية في كتابكم لو علينا معشر اليهود نزلت لاتخذنا ذلك اليوم عيدًا»، فقال عمر: «إني لأعلم حيث أُنزلت، وأيّ يوم أُنزلت: يوم عرفة، في يوم جمعة».", "bk": "45، 4407، 4606", "ms": "3017", "type": "زمن أو مكان النزول", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/5/2"]}, "ASB-058": {"t": "آخر ما نزل: آيات الربا", "t_en": "The last revealed: the verses on riba", "refs": [[2, "البقرة", "Al-Baqarah", "275-281"]], "ph": "من آخر ما نزل من القرآن", "ph_en": "Among the last verses revealed", "txt": "قالت أم المؤمنين عائشة رضي الله عنها: لما نزلت الآيات من آخر سورة البقرة في الربا قرأها النبي ﷺ على الناس، ثم حرّم التجارة في الخمر. وقال ابن عباس رضي الله عنهما: «آخر آية نزلت على النبي ﷺ آية الربا».", "bk": "4540، 4544", "ms": "1580", "type": "زمن أو مكان النزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-059": {"t": "صلاة النافلة على الراحلة", "t_en": "Voluntary prayer on a riding animal", "refs": [[2, "البقرة", "Al-Baqarah", "115"]], "ph": "أخبر الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion reported that it was revealed about the incident above", "txt": "كان النبي ﷺ يصلي النافلة وهو مقبل من مكة إلى المدينة على راحلته حيث كان وجهه، قال ابن عمر رضي الله عنهما: وفيه نزلت: ﴿فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ﴾.", "bk": "", "ms": "700", "type": "سبب نزول بقول صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-060": {"t": "موافقة عمر في اتخاذ مقام إبراهيم مصلى", "t_en": "Umar's suggestion to take the Station of Ibrahim as a place of prayer", "refs": [[2, "البقرة", "Al-Baqarah", "125"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال عمر بن الخطاب رضي الله عنه: وافقت ربي في ثلاث؛ قلت: «يا رسول الله، لو اتخذنا من مقام إبراهيم مصلى»، فنزلت: ﴿وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى﴾.", "bk": "402، 4483", "ms": "2399", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-061": {"t": "تحرّج الأنصار من السعي بين الصفا والمروة", "t_en": "The Ansar's hesitation about walking between al-Safa and al-Marwah", "refs": [[2, "البقرة", "Al-Baqarah", "158"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قالت أم المؤمنين عائشة رضي الله عنها: كان الأنصار قبل أن يسلموا يُهلّون لمناة الطاغية، فكان من أهلّ لها يتحرّج أن يطوف بين الصفا والمروة، فلما أسلموا سألوا النبي ﷺ عن ذلك، فأنزل الله: ﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ﴾.", "bk": "1643، 4495", "ms": "1277", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/26"]}, "ASB-062": {"t": "إتيان البيوت من ظهورها", "t_en": "Entering houses from the back", "refs": [[2, "البقرة", "Al-Baqarah", "189"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال البراء بن عازب رضي الله عنهما: كانت الأنصار إذا حجّوا فجاؤوا لم يدخلوا من قِبَل أبواب بيوتهم، ولكن من ظهورها، فجاء رجل من الأنصار فدخل من قِبَل بابه، فكأنه عُيّر بذلك، فنزلت: ﴿وَلَيْسَ الْبِرُّ بِأَنْ تَأْتُوا الْبُيُوتَ مِنْ ظُهُورِهَا﴾.", "bk": "1803، 4512", "ms": "3026", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/33"]}, "ASB-063": {"t": "الإنفاق في سبيل الله", "t_en": "Spending in the way of Allah", "refs": [[2, "البقرة", "Al-Baqarah", "195"]], "ph": "هذا تفسير الصحابي للآية", "ph_en": "This is a Companion's explanation of the verse", "txt": "قال حذيفة بن اليمان رضي الله عنه في قوله تعالى: ﴿وَأَنْفِقُوا فِي سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾: «نزلت في النفقة».", "bk": "4516", "ms": "", "type": "تفسير صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/33"]}, "ASB-064": {"t": "مؤاكلة الحائض", "t_en": "Eating with a menstruating woman", "refs": [[2, "البقرة", "Al-Baqarah", "222"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أنس رضي الله عنه: كان اليهود إذا حاضت المرأة فيهم لم يؤاكلوها ولم يساكنوها في البيوت، فسأل الصحابة النبي ﷺ، فأنزل الله: ﴿وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ﴾، فقال النبي ﷺ: «اصنعوا كل شيء إلا النكاح».", "bk": "", "ms": "302", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/38"]}, "ASB-065": {"t": "إبطال قول اليهود في الولد الأحول", "t_en": "Refuting a claim of the Jews about a cross-eyed child", "refs": [[2, "البقرة", "Al-Baqarah", "223"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: كانت اليهود تزعم أن الرجل إذا أتى امرأته من ورائها في موضع الولد جاء الولد أحول، فنزلت: ﴿نِسَاؤُكُمْ حَرْثٌ لَكُمْ فَأْتُوا حَرْثَكُمْ أَنَّىٰ شِئْتُمْ﴾.", "bk": "4528", "ms": "1435", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/38"]}, "ASB-066": {"t": "نسخ الكلام في الصلاة", "t_en": "Speaking during prayer abrogated", "refs": [[2, "البقرة", "Al-Baqarah", "238"]], "ph": "نزلت فغيّرت حكمًا سابقًا", "ph_en": "Revealed to change an earlier ruling", "txt": "قال زيد بن أرقم رضي الله عنه: كنا نتكلم في الصلاة، يكلم الرجل صاحبه وهو إلى جنبه في الصلاة، حتى نزلت: ﴿وَقُومُوا لِلَّهِ قَانِتِينَ﴾، فأُمرنا بالسكوت ونُهينا عن الكلام.", "bk": "1200، 4534", "ms": "539", "type": "نسخ أو تخفيف", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-067": {"t": "خواتيم سورة البقرة", "t_en": "The closing verses of Surat al-Baqarah", "refs": [[2, "البقرة", "Al-Baqarah", "284-286"]], "ph": "نزلت فغيّرت حكمًا سابقًا", "ph_en": "Revealed to change an earlier ruling", "txt": "لما نزلت آية المحاسبة على ما في النفوس اشتد ذلك على الصحابة رضي الله عنهم، فجثوا على الركب، فأمرهم النبي ﷺ أن يقولوا: «سمعنا وأطعنا»، فلما قالوها أنزل الله الآيتين بعدها، ورفع بهما المؤاخذة بما لا يُطاق.", "bk": "4545، 4546", "ms": "125، 126", "type": "نسخ أو تخفيف", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/2/49"]}, "ASB-068": {"t": "سؤال اليهود عن الروح", "t_en": "The Jews ask about the spirit", "refs": [[17, "الإسراء", "Al-Isra", "85"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن مسعود رضي الله عنه: مرّ النبي ﷺ بنفر من اليهود في حرث بالمدينة، فقالوا: «سلوه عن الروح»، فسألوه، فقام متوكئًا على عسيب حتى نزل الوحي: ﴿وَيَسْأَلُونَكَ عَنِ الرُّوحِ ۖ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي﴾.", "bk": "125، 4721، 7297", "ms": "2794", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/17/21"]}, "ASB-069": {"t": "حديث الحبر اليهودي", "t_en": "The Jewish rabbi", "refs": [[39, "الزمر", "Az-Zumar", "67"]], "ph": "تلاها النبي ﷺ في الواقعة المذكورة", "ph_en": "The Prophet ﷺ recited it during the incident above", "txt": "قال ابن مسعود رضي الله عنه: جاء حبر من أحبار اليهود فقال: «يا محمد، إنا نجد أن الله يجعل السماوات على إصبع، والأرضين على إصبع، وسائر الخلق على إصبع»، فضحك النبي ﷺ حتى بدت نواجذه تصديقًا لقول الحبر، ثم قرأ: ﴿وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ﴾.", "bk": "4811", "ms": "2786", "type": "استشهاد بالآية", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-070": {"t": "خصومة الأشعث بن قيس واليمين الكاذبة", "t_en": "Al-Ash'ath ibn Qays's dispute and the false oath", "refs": [[3, "آل عمران", "Al Imran", "77"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال النبي ﷺ: «من حلف على يمين يقتطع بها مال امرئ مسلم لقي الله وهو عليه غضبان»، فأنزل الله تصديق ذلك: ﴿إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ وَأَيْمَانِهِمْ ثَمَنًا قَلِيلًا﴾. قال الأشعث بن قيس رضي الله عنه: «فيّ نزلت، كانت بيني وبين رجل خصومة في بئر»، فقال له النبي ﷺ: «شاهداك أو يمينه».", "bk": "2356، 2357، 4549، 4550", "ms": "138", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/3/24"]}, "ASB-071": {"t": "فرح المتخلفين بما لم يفعلوا", "t_en": "Those who rejoiced at what they had not done", "refs": [[3, "آل عمران", "Al Imran", "188"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أبو سعيد الخدري رضي الله عنه: كان رجال من المنافقين يتخلفون عن الغزو ويفرحون بقعودهم، فإذا قدم النبي ﷺ اعتذروا إليه، وأحبوا أن يُحمدوا بما لم يفعلوا، فنزلت الآية. وقال ابن عباس رضي الله عنهما: نزلت في أهل الكتاب، سألهم النبي ﷺ عن شيء فكتموه وأخبروه بغيره.", "bk": "4567، 4568", "ms": "2777، 2778", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/3/54"]}, "ASB-072": {"t": "اليتيمة في حجر وليها", "t_en": "The orphan girl under her guardian's care", "refs": [[4, "النساء", "An-Nisa", "3"]], "ph": "أخبر الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion reported that it was revealed about the incident above", "txt": "سأل عروة بن الزبير أم المؤمنين عائشة رضي الله عنها عن الآية، فقالت: «هي اليتيمة تكون في حجر وليها تشركه في ماله، فيعجبه مالها وجمالها، فيريد أن يتزوجها بغير أن يُقسط في صداقها»، فنُهوا أن ينكحوهن إلا أن يُقسطوا لهن.", "bk": "2494، 4573، 4574", "ms": "3018", "type": "سبب نزول بقول صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/2"]}, "ASB-073": {"t": "استفتاء الصحابة في يتامى النساء", "t_en": "The Companions ask about orphan women", "refs": [[4, "النساء", "An-Nisa", "127"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قالت أم المؤمنين عائشة رضي الله عنها: ثم إن الناس استفتوا رسول الله ﷺ بعد ذلك، فأنزل الله: ﴿وَيَسْتَفْتُونَكَ فِي النِّسَاءِ﴾، وهي في الرجل تكون عنده اليتيمة هو وليها ووارثها قد شركته في ماله، فيرغب عن نكاحها، ويكره أن يزوجها غيره فيشركه في ماله فيمنعها من الزواج.", "bk": "4600", "ms": "3018", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/34"]}, "ASB-074": {"t": "المرأة تخاف إعراض زوجها", "t_en": "A wife who fears her husband's aversion", "refs": [[4, "النساء", "An-Nisa", "128"]], "ph": "أخبر الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion reported that it was revealed about the incident above", "txt": "قالت أم المؤمنين عائشة رضي الله عنها في الآية: «الرجل تكون عنده المرأة ليس بمستكثر منها، يريد أن يفارقها، فتقول: أجعلك من شأني في حِلّ، فنزلت هذه الآية في ذلك».", "bk": "2450، 4601، 5206", "ms": "3021", "type": "سبب نزول بقول صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/35"]}, "ASB-075": {"t": "خصومة الزبير والأنصاري في سقي النخل", "t_en": "Al-Zubayr and an Ansari dispute over watering palms", "refs": [[4, "النساء", "An-Nisa", "65"]], "ph": "رأى الصحابي أنها نزلت في الواقعة المذكورة", "ph_en": "A Companion believed that it was revealed about the incident above", "txt": "خاصم رجل من الأنصار الزبير بن العوام رضي الله عنه في مسيل ماء بالحرة يسقون به النخل، فقال النبي ﷺ: «اسقِ يا زبير، ثم أرسل الماء إلى جارك»، فغضب الأنصاري وقال: «أنْ كان ابن عمتك؟» (أي: أقضيت له لأنه ابن عمتك؟)، قال الزبير: «فما أحسب هذه الآية إلا نزلت في ذلك».", "bk": "2359، 2360، 4585", "ms": "2357", "type": "ظن صحابي", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/19"]}, "ASB-076": {"t": "الرجل الذي أصاب قبلة ثم جاء تائبًا", "t_en": "The man who kissed a woman and came repenting", "refs": [[11, "هود", "Hud", "114"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن مسعود رضي الله عنه: أصاب رجل من امرأة قُبلة، فأتى النبي ﷺ فأخبره، فأنزل الله: ﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾، فقال الرجل: «ألي هذا؟»، قال: «لجميع أمتي كلهم».", "bk": "526، 4687", "ms": "2763", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/11/21"]}, "ASB-077": {"t": "النهي عن السؤال عما لا يعني", "t_en": "Not asking about what does not concern you", "refs": [[5, "المائدة", "Al-Ma'idah", "101"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أنس رضي الله عنه: خطب النبي ﷺ، فقال رجل: «من أبي؟»، قال: «فلان»، فنزلت: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ﴾. وقال ابن عباس رضي الله عنهما: كان قوم يسألون النبي ﷺ استهزاءً، فيقول الرجل: «من أبي؟»، ويقول الرجل تضلّ ناقته: «أين ناقتي؟»، فأنزل الله الآية.", "bk": "4621، 4622", "ms": "2359", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/5/31"]}, "ASB-078": {"t": "مرض جابر وآية الميراث", "t_en": "Jabir's illness and the verse of inheritance", "refs": [[4, "النساء", "An-Nisa", "176"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: عادني النبي ﷺ وأنا مريض لا أعقل، فتوضأ وصبّ عليّ من وضوئه فأفقت، فقلت: «يا رسول الله، كيف أصنع في مالي؟»، وفي رواية لمسلم: «إنما يرثني كلالة»، فنزلت آية الميراث.", "bk": "194، 4577، 6743", "ms": "1616", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/45"]}, "ASB-079": {"t": "انفضاض الناس إلى العير يوم الجمعة", "t_en": "People leave for the caravan during the Friday sermon", "refs": [[62, "الجمعة", "Al-Jumu'ah", "11"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: أقبلت عِير يوم الجمعة والنبي ﷺ يخطب، فانصرف الناس إليها حتى لم يبق معه إلا اثنا عشر رجلًا، فأنزل الله: ﴿وَإِذَا رَأَوْا تِجَارَةً أَوْ لَهْوًا انْفَضُّوا إِلَيْهَا وَتَرَكُوكَ قَائِمًا﴾.", "bk": "936، 4899", "ms": "863", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/62/3"]}, "ASB-080": {"t": "أرواح الشهداء", "t_en": "The souls of the martyrs", "refs": [[3, "آل عمران", "Al Imran", "169"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال النبي ﷺ: «لما أُصيب إخوانكم بأحد جعل الله أرواحهم في أجواف طير خضر ترد أنهار الجنة»، فأنزل الله: ﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا﴾. وفي صحيح مسلم أن ابن مسعود رضي الله عنه سُئل عن الآية فقال: قد سألنا عن ذلك، فقال النبي ﷺ: «أرواحهم في جوف طير خضر لها قناديل معلقة بالعرش».", "bk": "", "ms": "1887", "type": "سبب نزول صريح", "whole": false, "ev": "أبو داود (2520)، وأحمد، وأصله في مسلم (1887)؛ حسّنه ابن القطان والألباني، وصحّحه ابن الملقن: «لما أصيب إخوانكم بأحد... فأنزل الله: ولا تحسبن الذين قتلوا».", "ev_en": "Abu Dawud 2520 (core in Muslim 1887): \"When your brothers were struck at Uhud... Allah revealed...\"; graded hasan by al-Albani.", "tafs": ["https://dorar.net/tafseer/3/49"]}, "ASB-081": {"t": "قتل الرجل الذي ألقى السلام", "t_en": "The killing of a man who gave the greeting of peace", "refs": [[4, "النساء", "An-Nisa", "94"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: كان رجل في غُنيمة له، فلحقه المسلمون فقال: «السلام عليكم»، فقتلوه وأخذوا غُنيمته، فأنزل الله: ﴿وَلَا تَقُولُوا لِمَنْ أَلْقَىٰ إِلَيْكُمُ السَّلَامَ لَسْتَ مُؤْمِنًا﴾.", "bk": "4591", "ms": "3025", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/4/26"]}, "ASB-082": {"t": "الواهبات أنفسهن وإرجاء النبي ﷺ من يشاء", "t_en": "Women who offered themselves, and the Prophet ﷺ deferring whom he wished", "refs": [[33, "الأحزاب", "Al-Ahzab", "51"]], "ph": "هذا ما جرى عند نزولها", "ph_en": "What happened when it was revealed", "txt": "قالت أم المؤمنين عائشة رضي الله عنها: كنت أغار على اللاتي وهبن أنفسهن للنبي ﷺ، فلما أنزل الله: ﴿تُرْجِي مَنْ تَشَاءُ مِنْهُنَّ وَتُؤْوِي إِلَيْكَ مَنْ تَشَاءُ﴾ قلت: «ما أرى ربك إلا يسارع في هواك»، أي: يعجّل لك ما تحب.", "bk": "4788", "ms": "1464", "type": "حادثة مقارنة للنزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-083": {"t": "قصة هلال بن أمية وعويمر العجلاني وآيات اللعان", "t_en": "Hilal ibn Umayyah, Uwaymir al-Ajlani and the verses of li'an", "refs": [[24, "النور", "An-Nur", "6-9"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: قذف هلال بن أمية رضي الله عنه امرأته عند النبي ﷺ، فقال: «البيّنة أو حدٌّ في ظهرك»، فأنزل الله آيات اللعان. وفي حديث سهل بن سعد رضي الله عنه أن عويمرًا العجلاني سأل عن مثل ذلك، فقال النبي ﷺ: «قد أنزل الله فيك وفي صاحبتك».", "bk": "4745، 4747", "ms": "1492، 1496", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/24/3"]}, "ASB-084": {"t": "قصة العسل ونزول صدر سورة التحريم", "t_en": "The honey incident and the opening of Surat al-Tahrim", "refs": [[66, "التحريم", "At-Tahrim", "1-4"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قالت أم المؤمنين عائشة رضي الله عنها: كان النبي ﷺ يشرب عسلًا عند أم المؤمنين زينب بنت جحش رضي الله عنها ويمكث عندها، فاتفقتُ أنا وحفصة رضي الله عنها أن تقول له أيّتنا دخل عليها: «إني أجد منك ريح مغافير»، فقال: «بل شربت عسلًا، ولن أعود له»، فنزلت: ﴿يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ﴾. وفي حديث عمر رضي الله عنه أن المرأتين المذكورتين في الآية الرابعة هما عائشة وحفصة رضي الله عنهما.", "bk": "4912، 4913، 5191", "ms": "1474، 1479", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/66/1"]}, "ASB-085": {"t": "إغفاءة النبي ﷺ ونزول سورة الكوثر", "t_en": "The Prophet ﷺ dozes and Surat al-Kawthar is revealed", "refs": [[108, "الكوثر", "Al-Kawthar", "1-3"]], "ph": "هذا ما جرى عند نزولها", "ph_en": "What happened when it was revealed", "txt": "قال أنس رضي الله عنه: بينا النبي ﷺ بين أظهرنا إذ أغفى إغفاءة، ثم رفع رأسه متبسمًا وقال: «أُنزلت عليّ آنفًا سورة»، فقرأ سورة الكوثر.", "bk": "", "ms": "400", "type": "حادثة مقارنة للنزول", "whole": true, "ev": "", "ev_en": "", "tafs": []}, "TAF-01": {"t": "سؤال المشركين عن القتال في الشهر الحرام بعد سرية نخلة", "t_en": "The polytheists object to fighting in the sacred month after the Nakhlah expedition", "refs": [[2, "البقرة", "Al-Baqarah", "217-218"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال جندب بن عبد الله رضي الله عنه: بعث النبي ﷺ رهطًا أمّر عليهم عبد الله بن جحش رضي الله عنه، فلقوا ابن الحضرمي فقتلوه، ولم يدروا أكان ذلك اليوم من رجب أم من جمادى، فقال المشركون: «قتلتم في الشهر الحرام»، فأنزل الله: ﴿يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ﴾، فقال بعضهم: «إن لم يكونوا أصابوا وزرًا فليس لهم أجر»، فأنزل الله: ﴿إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "النسائي في السنن الكبرى (8803)، وأبو يعلى، والطبراني؛ حسّن إسناده ابن حجر، وصحّح سنده الشوكاني وأحمد شاكر.", "ev_en": "Al-Nasa'i, al-Sunan al-Kubra 8803; chain graded hasan by Ibn Hajar, sahih by al-Shawkani and Ahmad Shakir.", "tafs": ["https://dorar.net/tafseer/2/37"]}, "TAF-02": {"t": "أبناء الأنصار في بني النضير عند إجلائهم", "t_en": "Children of the Ansar among Banu al-Nadir at their expulsion", "refs": [[2, "البقرة", "Al-Baqarah", "256"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: كانت المرأة من الأنصار قليلة الولد، تجعل على نفسها إن عاش لها ولد أن تهوّده، فلما أُجليت بنو النضير كان فيهم من أبناء الأنصار، فقالوا: «لا ندع أبناءنا»، فأنزل الله: ﴿لَا إِكْرَاهَ فِي الدِّينِ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "الواحدي في أسباب النزول؛ صحّحه ابن دقيق العيد، وصحّح إسناده ابن كثير مع ذكره أنه رُوي مرسلًا، وذكر الشوكاني أن له طرقًا لا مطعن في رجالها.", "ev_en": "Al-Wahidi, Asbab al-Nuzul; graded sahih by Ibn Daqiq al-Id; Ibn Kathir graded its chain sahih while noting a mursal version.", "tafs": ["https://dorar.net/tafseer/2/43"]}, "TAF-04": {"t": "الاستجابة للخروج إلى حمراء الأسد بعد أحد", "t_en": "Answering the call to march to Hamra al-Asad after Uhud", "refs": [[3, "آل عمران", "Al Imran", "172"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: لما انصرف المشركون عن أحد وبلغوا الروحاء، قالوا: «لا محمدًا قتلتم… بئس ما صنعتم، ارجعوا»، فبلغ ذلك النبي ﷺ فندب الناس، فانتدبوا حتى بلغوا حمراء الأسد، فأنزل الله: ﴿الَّذِينَ اسْتَجَابُوا لِلَّهِ وَالرَّسُولِ مِنْ بَعْدِ مَا أَصَابَهُمُ الْقَرْحُ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "النسائي في السنن الكبرى (11083)، والطبراني؛ قال الهيثمي: رجاله رجال الصحيح غير محمد بن منصور الجواز وهو ثقة، وصحّحه الشوكاني والوادعي.", "ev_en": "Al-Nasa'i, al-Sunan al-Kubra 11083; graded sahih by al-Shawkani and al-Wadi'i.", "tafs": ["https://dorar.net/tafseer/3/50"]}, "TAF-05": {"t": "الخروج إلى موسم بدر في الموعد", "t_en": "Going out to Badr at the appointed season", "refs": [[3, "آل عمران", "Al Imran", "174"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: كان أبو سفيان قال للنبي ﷺ: «موعدك موسم بدر»، فخرج المسلمون في الموعد فلم يجدوا بها أحدًا، وتسوّقوا، فأنزل الله: ﴿فَانْقَلَبُوا بِنِعْمَةٍ مِنَ اللَّهِ وَفَضْلٍ لَمْ يَمْسَسْهُمْ سُوءٌ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "النسائي في السنن الكبرى (11083)، والطبراني؛ وهو تتمة الحديث السابق، وصحّحه الشوكاني والوادعي.", "ev_en": "Al-Nasa'i, al-Sunan al-Kubra 11083 (continuation of the previous report); graded sahih by al-Shawkani and al-Wadi'i.", "tafs": ["https://dorar.net/tafseer/3/50"]}, "TAF-06": {"t": "صلاة النبي ﷺ على النجاشي", "t_en": "The Prophet ﷺ prays the funeral prayer for the Negus", "refs": [[3, "آل عمران", "Al Imran", "199"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أنس رضي الله عنه: لما جاء نعي النجاشي قال النبي ﷺ: «صلّوا عليه»، فقالوا: «نصلي على عبد حبشي؟»، فأنزل الله: ﴿وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَنْ يُؤْمِنُ بِاللَّهِ وَمَا أُنْزِلَ إِلَيْكُمْ وَمَا أُنْزِلَ إِلَيْهِمْ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "النسائي في السنن الكبرى (11088)، والبزار، والطبراني؛ صحّح إسناده الألباني (الصحيحة 3044)، وقال الوادعي: يرتقي بمجموع طرقه إلى الحجية.", "ev_en": "Al-Nasa'i, al-Sunan al-Kubra 11088; chain graded sahih by al-Albani (al-Sahihah 3044).", "tafs": ["https://dorar.net/tafseer/3/56"]}, "TAF-07": {"t": "ابنتا سعد بن الربيع بعد استشهاد أبيهما في أحد", "t_en": "The two daughters of Sa'd ibn al-Rabi' after their father was martyred at Uhud", "refs": [[4, "النساء", "An-Nisa", "11"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: جاءت امرأة سعد بن الربيع رضي الله عنه بابنتيها فقالت: «يا رسول الله، هاتان ابنتا سعد بن الربيع، قُتل أبوهما معك في أحد شهيدًا، وإن عمهما أخذ مالهما»، فنزلت آية الميراث، فأمر النبي ﷺ عمهما أن يعطيهما الثلثين، وأمهما الثمن.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "أبو داود (2892)، والترمذي (2092)، وابن ماجه (2720)؛ صحّحه الترمذي، وحسّنه ابن عبد البر والألباني.", "ev_en": "Abu Dawud 2892, al-Tirmidhi 2092; graded sahih by al-Tirmidhi and hasan by al-Albani.", "tafs": ["https://dorar.net/tafseer/4/4"]}, "TAF-08": {"t": "سبايا أوطاس", "t_en": "The captives of Awtas", "refs": [[4, "النساء", "An-Nisa", "24"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أبو سعيد الخدري رضي الله عنه: بعث النبي ﷺ يوم حنين جيشًا إلى أوطاس، فلقوا عدوًّا فظهروا عليهم وأصابوا سبايا، فتحرّج ناس من الصحابة، فأنزل الله: ﴿وَالْمُحْصَنَاتُ مِنَ النِّسَاءِ إِلَّا مَا مَلَكَتْ أَيْمَانُكُمْ﴾.", "bk": "", "ms": "1456", "type": "سبب نزول صريح", "whole": false, "ev": "صحيح مسلم (1456).", "ev_en": "Sahih Muslim 1456.", "tafs": ["https://dorar.net/tafseer/4/8"]}, "TAF-09": {"t": "الأمر بالكف عن القتال في مكة ثم فرضه بعد الهجرة", "t_en": "Holding back from fighting in Makkah, then the command to fight after the Hijrah", "refs": [[4, "النساء", "An-Nisa", "77"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: إن عبد الرحمن بن عوف رضي الله عنه وأصحابًا له قالوا: «يا نبي الله، كنا في عز ونحن مشركون، فلما آمنا صرنا أذلة»، فقال: «إني أُمرت بالعفو فلا تقاتلوا القوم»، فلما حوّله الله إلى المدينة أمره بالقتال فكفّوا، فأنزل الله: ﴿أَلَمْ تَرَ إِلَى الَّذِينَ قِيلَ لَهُمْ كُفُّوا أَيْدِيَكُمْ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "النسائي (3086)، والطبري، والحاكم؛ صحّح إسناده الألباني، وصحّحه الوادعي.", "ev_en": "Al-Nasa'i 3086; chain graded sahih by al-Albani and al-Wadi'i.", "tafs": ["https://dorar.net/tafseer/4/22"]}, "TAF-10": {"t": "المستضعفون من أهل مكة الذين أُخرجوا إلى بدر", "t_en": "Makkan Muslims forced to march to Badr", "refs": [[4, "النساء", "An-Nisa", "97"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: كان قوم من أهل مكة أسلموا وكانوا يُخفون إسلامهم، فأخرجهم المشركون معهم يوم بدر، فأصيب بعضهم، فقال المسلمون: «كان أصحابنا هؤلاء مسلمين وأُكرهوا»، فنزلت: ﴿إِنَّ الَّذِينَ تَوَفَّاهُمُ الْمَلَائِكَةُ ظَالِمِي أَنْفُسِهِمْ﴾.", "bk": "7085", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "البزار، وابن جرير، وابن أبي حاتم؛ قال الهيثمي: رجاله رجال الصحيح غير محمد بن شريك وهو ثقة، وصحّح إسناده أحمد شاكر والأرناؤوط. وأصله في البخاري (7085) دون تسمية بدر.", "ev_en": "Al-Bazzar, Ibn Jarir; chain graded sahih by Ahmad Shakir and al-Arna'ut. The core is in al-Bukhari 7085, without naming Badr.", "tafs": ["https://dorar.net/tafseer/29/3", "https://dorar.net/tafseer/4/28"]}, "TAF-11": {"t": "فتنة من بقي بمكة من المسلمين بعد بدر", "t_en": "The trial of the Muslims who remained in Makkah after Badr", "refs": [[29, "العنكبوت", "Al-Ankabut", "10"], [16, "النحل", "An-Nahl", "110"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "تتمة الحديث السابق: كتب المسلمون إلى من بقي بمكة بآية سورة النساء، فخرجوا، فلحقهم المشركون ففتنوهم عن دينهم، فنزلت فيهم آية سورة العنكبوت، ثم نزلت فيهم: ﴿ثُمَّ إِنَّ رَبَّكَ لِلَّذِينَ هَاجَرُوا مِنْ بَعْدِ مَا فُتِنُوا﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "تتمة الحديث السابق عند ابن جرير وابن أبي حاتم والطحاوي؛ صحّح إسناده أحمد شاكر والأرناؤوط.", "ev_en": "Continuation of the previous report (Ibn Jarir, Ibn Abi Hatim); chain graded sahih by Ahmad Shakir and al-Arna'ut.", "tafs": ["https://dorar.net/tafseer/29/3"]}, "TAF-12": {"t": "رمي النبي ﷺ الحصباء يوم بدر", "t_en": "The Prophet ﷺ throws pebbles at Badr", "refs": [[8, "الأنفال", "Al-Anfal", "17"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال حكيم بن حزام رضي الله عنه: لما كان يوم بدر أخذ النبي ﷺ كفًّا من الحصباء فرمانا بها وقال: «شاهت الوجوه»، فانهزمنا، فأنزل الله: ﴿وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ اللَّهَ رَمَىٰ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "ابن جرير، وابن أبي حاتم، والطبراني (3128)؛ حسّن إسناده الهيثمي، وقال الوادعي: حسن لغيره.", "ev_en": "Ibn Jarir, Ibn Abi Hatim, al-Tabarani 3128; chain graded hasan by al-Haythami; hasan li-ghayrih per al-Wadi'i.", "tafs": ["https://dorar.net/tafseer/8/6"]}, "TAF-13": {"t": "سورة الأنفال نزلت في بدر", "t_en": "Surat al-Anfal was revealed about Badr", "refs": [[8, "الأنفال", "Al-Anfal", "1-75"]], "ph": "نزلت هذه السورة في هذا الحدث", "ph_en": "This surah was revealed about this event", "txt": "قال سعيد بن جبير: قلت لابن عباس رضي الله عنهما: سورة الأنفال؟ قال: «نزلت في بدر».", "bk": "4645", "ms": "3031", "type": "السورة نزلت في الحدث", "whole": true, "ev": "صحيح البخاري (4645)، وصحيح مسلم (3031).", "ev_en": "Sahih al-Bukhari 4645; Sahih Muslim 3031.", "tafs": ["https://dorar.net/tafseer/8", "https://dorar.net/tafseer/8/10"]}, "TAF-14": {"t": "نقض بني قريظة العهد", "t_en": "Banu Qurayzah break their covenant", "refs": [[8, "الأنفال", "Al-Anfal", "56"]], "ph": "نزلت في هذا الحدث باتفاق المفسرين", "ph_en": "Revealed about this event, by agreement of the commentators", "txt": "قال ابن عطية: «أجمع المتأولون (أي المفسرون) أن الآية نزلت في بني قريظة، وهي بعدُ تعمّ كل من اتصف بهذه الصفة».", "bk": "", "ms": "", "type": "باتفاق المفسرين", "whole": false, "ev": "نقله ابن عطية في تفسيره (إجماع المفسرين).", "ev_en": "Reported by Ibn Atiyyah as the consensus of the commentators.", "tafs": ["https://dorar.net/tafseer/8/18"]}, "TAF-15": {"t": "استئذان الجد بن قيس في القعود عن تبوك", "t_en": "Al-Jadd ibn Qays asks leave to stay behind from Tabuk", "refs": [[9, "التوبة", "At-Tawbah", "49"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال جابر بن عبد الله رضي الله عنهما: قال النبي ﷺ للجدّ بن قيس: «هل لك في جِلاد بني الأصفر؟»، فقال: «ائذن لي ولا تفتنّي»، فأنزل الله: ﴿وَمِنْهُمْ مَنْ يَقُولُ ائْذَنْ لِي وَلَا تَفْتِنِّي ۚ أَلَا فِي الْفِتْنَةِ سَقَطُوا﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "ابن أبي حاتم في تفسيره؛ حسّن إسناده الألباني. وقال الواحدي: قال ابن عباس والمفسرون كلهم: نزلت في الجد بن قيس.", "ev_en": "Ibn Abi Hatim; chain graded hasan by al-Albani. Al-Wahidi: Ibn Abbas and all the commentators said it was revealed about al-Jadd ibn Qays.", "tafs": ["https://dorar.net/tafseer/9/19"]}, "TAF-16": {"t": "المستهزئون بالقرّاء في غزوة تبوك", "t_en": "Those who mocked the reciters during Tabuk", "refs": [[9, "التوبة", "At-Tawbah", "65-66"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عمر رضي الله عنهما: قال رجل في غزوة تبوك: «ما رأيت مثل قرائنا هؤلاء، أرغب بطونًا، ولا أكذب ألسنة، ولا أجبن عند اللقاء»، فبلغ ذلك النبي ﷺ، ونزل القرآن.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "ابن أبي حاتم، وابن جرير؛ صحّح إسناده أحمد شاكر، وقال الوادعي: له شاهد بسند حسن. وقال الشنقيطي: نزلت في غزوة تبوك بإطباق المفسرين.", "ev_en": "Ibn Abi Hatim, Ibn Jarir; chain graded sahih by Ahmad Shakir. Al-Shinqiti: revealed during Tabuk by agreement of the commentators.", "tafs": ["https://dorar.net/tafseer/9/24"]}, "TAF-17": {"t": "سورة التوبة وغزوة تبوك", "t_en": "Surat al-Tawbah and the campaign of Tabuk", "refs": [[9, "التوبة", "At-Tawbah", "1-129"]], "ph": "نزلت السورة إثر هذا الحدث، بحسب ابن عاشور", "ph_en": "The surah was revealed right after this event, according to Ibn Ashur", "txt": "قال ابن عاشور: «هذه السورة نزلت إثر غزوة تبوك، وكانت غزوة تبوك في وقت عسرة».", "bk": "", "ms": "", "type": "قول المفسرين", "whole": true, "ev": "قول ابن عاشور في التحرير والتنوير، كما في موسوعة التفسير.", "ev_en": "Statement of Ibn Ashur (al-Tahrir wa al-Tanwir).", "tafs": ["https://dorar.net/tafseer/9/14"]}, "TAF-18": {"t": "آية العقوبة بالمثل: نزلت يوم فتح مكة بعد التمثيل بشهداء أحد", "t_en": "The verse on equal retribution, revealed on the day of the Conquest after the mutilation at Uhud", "refs": [[16, "النحل", "An-Nahl", "126"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال أُبيّ بن كعب رضي الله عنه: لما كان يوم أحد مثّل المشركون بشهداء المسلمين، وفيهم حمزة رضي الله عنه، فقالت الأنصار: «لئن أصبنا منهم يومًا مثل هذا لنُربينّ عليهم»، فلما كان يوم فتح مكة أنزل الله: ﴿وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ﴾، فقال النبي ﷺ: «كفّوا عن القوم».", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "الترمذي (3129)، وأحمد؛ قال الترمذي: حسن غريب، وقال الألباني: حسن صحيح الإسناد. وقال ابن عطية: أطبق أهل التفسير أنها مدنية نزلت في شأن التمثيل بحمزة.", "ev_en": "Al-Tirmidhi 3129, Ahmad; al-Tirmidhi: hasan gharib; al-Albani: hasan sahih chain.", "tafs": ["https://dorar.net/tafseer/16/27"]}, "TAF-19": {"t": "طلب أهل مكة أن يُجعل الصفا ذهبًا", "t_en": "The people of Makkah ask for al-Safa to be turned into gold", "refs": [[17, "الإسراء", "Al-Isra", "59"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: سأل أهل مكة النبي ﷺ أن يجعل لهم الصفا ذهبًا، وأن ينحّي الجبال عنهم فيزرعوا، فاختار النبي ﷺ أن يُمهَلوا، فأنزل الله: ﴿وَمَا مَنَعَنَا أَنْ نُرْسِلَ بِالْآيَاتِ إِلَّا أَنْ كَذَّبَ بِهَا الْأَوَّلُونَ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "أحمد (2333)، والنسائي في الكبرى (11290)؛ صحّحه الذهبي وأحمد شاكر، وجوّد إسناده ابن كثير، وقال الألباني: رجاله ثقات رجال الشيخين.", "ev_en": "Ahmad 2333, al-Nasa'i al-Kubra 11290; graded sahih by al-Dhahabi and Ahmad Shakir; narrators of al-Bukhari and Muslim per al-Albani.", "tafs": ["https://dorar.net/tafseer/17/14"]}, "TAF-20": {"t": "سؤال قريش عن الروح بإيعاز من اليهود", "t_en": "Quraysh ask about the spirit at the prompting of the Jews", "refs": [[17, "الإسراء", "Al-Isra", "85"], [18, "الكهف", "Al-Kahf", "109"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: قالت قريش لليهود: «أعطونا شيئًا نسأل عنه هذا الرجل»، فقالوا: «سلوه عن الروح»، فسألوه، فنزلت: ﴿وَيَسْأَلُونَكَ عَنِ الرُّوحِ﴾، فقالوا: «أوتينا علمًا كثيرًا»، فأنزل الله: ﴿قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا لِكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "الترمذي (3140) وقال: حسن صحيح غريب، وصحّحه ابن حبان والحاكم وابن دقيق العيد والذهبي وأحمد شاكر والألباني.", "ev_en": "Al-Tirmidhi 3140 (hasan sahih gharib); graded sahih by Ibn Hibban, al-Hakim, Ibn Daqiq al-Id and al-Albani.", "tafs": ["https://dorar.net/tafseer/18/27"]}, "TAF-21": {"t": "اعتراض ابن الزِّبَعرى على آية ﴿حَصَبُ جَهَنَّمَ﴾", "t_en": "Ibn al-Zib'ara's objection to the verse on the fuel of Hell", "refs": [[21, "الأنبياء", "Al-Anbiya", "98-101"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: لما نزلت ﴿إِنَّكُمْ وَمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ حَصَبُ جَهَنَّمَ﴾ شقّ ذلك على أهل مكة، فاعترض ابن الزِّبَعرى بأن النصارى تعبد عيسى، واليهود تعبد عُزيرًا، وبني مليح تعبد الملائكة، فأنزل الله: ﴿إِنَّ الَّذِينَ سَبَقَتْ لَهُمْ مِنَّا الْحُسْنَىٰ أُولَٰئِكَ عَنْهَا مُبْعَدُونَ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "الطحاوي في شرح مشكل الآثار، والطبراني؛ حسّنه ابن حجر، وصحّح إسناده ابن القيم.", "ev_en": "Al-Tahawi, al-Tabarani; graded hasan by Ibn Hajar; chain graded sahih by Ibn al-Qayyim.", "tafs": ["https://dorar.net/tafseer/21/21"]}, "TAF-22": {"t": "مجادلة قريش في عيسى عليه السلام", "t_en": "Quraysh argue about Isa (Jesus)", "refs": [[43, "الزخرف", "Az-Zukhruf", "57"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: قال النبي ﷺ لقريش: «ليس أحد يُعبد من دون الله فيه خير»، فقالوا: «ألست تزعم أن عيسى كان نبيًّا وعبدًا صالحًا؟»، فأنزل الله: ﴿وَلَمَّا ضُرِبَ ابْنُ مَرْيَمَ مَثَلًا إِذَا قَوْمُكَ مِنْهُ يَصِدُّونَ﴾.", "bk": "", "ms": "", "type": "سبب نزول صريح", "whole": false, "ev": "أحمد (2918)؛ صحّح إسناده أحمد شاكر، وحسّن إسناده الألباني (الصحيحة 3208) والأرناؤوط.", "ev_en": "Ahmad 2918; chain graded sahih by Ahmad Shakir and hasan by al-Albani (al-Sahihah 3208).", "tafs": ["https://dorar.net/tafseer/43/11"]}, "TAF-23": {"t": "حد القذف ورد شهادة القاذفين", "t_en": "The punishment for slander and rejecting the testimony of slanderers", "refs": [[24, "النور", "An-Nur", "4"]], "ph": "نزلت في هذا الحدث باتفاق أهل العلم", "ph_en": "Revealed about this event, by agreement of the scholars", "txt": "قال ابن تيمية: «الآية نزلت في أهل الإفك باتفاق أهل العلم والحديث والفقه والتفسير».", "bk": "", "ms": "", "type": "باتفاق المفسرين", "whole": false, "ev": "نقله ابن تيمية (اتفاق أهل العلم).", "ev_en": "Reported by Ibn Taymiyyah as the agreement of the scholars.", "tafs": ["https://dorar.net/tafseer/24/2"]}, "TAF-24": {"t": "المنافقون والمؤمنون يوم الأحزاب", "t_en": "The hypocrites and the believers at   aboutHTML:`<h2 id="mTitle">عن هذا النموذج</h2>

      <li>عناوين الأحداث منقولة كما هي من الموسوعة التاريخية في الدرر السنية، أما المواقع ومسارات الرحلات فمقترحة وهي قيد المراجعة العلمية.</li>

      <li>المواقع المعلّمة بعبارة «موقع تقريبي» يختلف المؤرخون في تحديدها.</li>
      <li>الشخصيات في كل حدث هي من ورد ذكرهم في نص المصدر. ونبذ الصحابة مجمّعة من حقائق موثقة في الموسوعة التاريخية وصحيحي البخاري ومسلم، لكل حقيقة مصدرها وشاهدها.</li>

  aboutHTML:`<h2 id="mTitle">About this prototype</h2>

      <li>The surahs and verses linked to each event or stage come from hadiths in Sahih al-Bukhari and Sahih Muslim, and from the Dorar Tafsir Encyclopedia with the hadith grading it quotes, with a link to read them on Quranpedia (the Open Quranic Encyclopedia). When a whole surah relates to an event, it is shown as "whole surah". Each card states the kind of link: revealed on the occasion, recited by the Prophet ﷺ, explained by a Companion, and so on. The English titles of these links are drafts pending review.</li>

    <p>To navigate, choose a stage on the timeline, an event from the list, or press "Story mode". The arrow keys also move between events.</p>`}

const t = k => U[LANG][k];

const EV = DATA.events, ST = DATA.stages, PP = DATA.people;
const PSEQ = {}; EV.forEach(e=>e.people.forEach(k=>(PSEQ[k]=PSEQ[k]||[]).push(e.seq)));
const GROUPS = ['family','sahaba','others'];
const ad = s => EN() ? String(s) : String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shortDate = e => EN() ? e.date_en.split(' (')[0] : ad(e.date.split('،')[0]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/ﷺ/g,'<span class="saw">ﷺ</span>');

const state = { stage:0, seq:null, view:'list', mapPerson:null, expanded:false, arOpen:false, story:false, playing:false, timer:null };

map.attributionControl.setPrefix(false);

let tileOk=false, tileErr=0;

const TILE = t => CARTO_KEY

const tiles = L.tileLayer(TILE(isDark()?'dark':'light'), {
  maxZoom:14, maxNativeZoom:16, bounds:REGION, noWrap:true,
  attribution:TILE_ATTR
}).on('tileload',()=>{tileOk=true; $('notice').style.display='none';})
  .on('tileerror',()=>{ if(!tileOk && ++tileErr>4) $('notice').style.display='block'; })
  .addTo(map);

/* keep the map on the region: never zoom out further than the region needs */
function lockRegion(){
  map.invalidateSize(false);
  const z = map.getBoundsZoom(REGION, false);

}
if('ResizeObserver' in window) new ResizeObserver(()=>lockRegion()).observe($('map'));

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const zstyle = () => ({color:cssv('--gold'), weight:1, opacity:.55, fillColor:cssv('--gold'), fillOpacity:isDark()?.16:.2, interactive:false});
function drawZones(){
  zoneLayer.clearLayers();
  if(!!state.mapPerson) return;
  ST[state.stage].zones.forEach(k=>{
    const z=ZONES[k];
    (z.p ? L.polygon(z.p, zstyle()) : L.circle(z.c, Object.assign({radius:z.r}, zstyle()))).addTo(zoneLayer);

function renderMini(){
  const s=ST[state.stage], cur = state.seq!=null && EV[state.seq].stage===state.stage ? state.seq : null;
  const pos = cur==null ? -1 : cur - s.start;
  let nodes='';
  for(let i=0;i<s.count;i++){
    const e=EV[s.start+i];
    nodes+=`<button class="node${i===pos?' on':''}${pos>=0&&i<pos?' done':''}" data-seq="${s.start+i}" aria-label="${escA(tx(e,'title'))}" title="${escA(tx(e,'title'))}"></button>`;
  }

  $('figcard').innerHTML = `<h3>${t('figTitle')}</h3>` + (ks.length

function renderStat(){

function placesOf(stageIdx){
  const s=ST[stageIdx], seqs=[];
  for(let i=s.start;i<s.start+s.count;i++) seqs.push(i);
  return placesFor(seqs);
}
function placesFor(seqs){
  const m=new Map();
  for(const i of seqs){
    const e=EV[i], k=e.lat+'|'+e.lng;
    if(!m.has(k)) m.set(k,{place:tx(e,'place'),lat:e.lat,lng:e.lng,seqs:[]});
    m.get(k).seqs.push(i);
  }
  return [...m.values()];
}

function drawStage(){

  const cur = state.seq!=null ? EV[state.seq] : null;
  // earlier events as faint dots
  const seen=new Set();
  for(let i=0;i<(!!state.mapPerson?0:ST[state.stage].start);i++){
    const e=EV[i], k=e.lat+','+e.lng; if(seen.has(k)) continue; seen.add(k);
    L.marker([e.lat,e.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<div class="past"></div>',iconSize:[8,8],iconAnchor:[4,4]})}).addTo(pastLayer);
  }
  const personMode = !!state.mapPerson;
  const places = personMode ? placesFor(PSEQ[state.mapPerson]) : placesOf(state.stage);
  const activeKey = cur && !state.mapPerson && cur.stage===state.stage ? cur.lat+'|'+cur.lng : null;
  // keep Makkah / Madinah readable when they are not part of the stage
  [[MAKKAH,t('cities')[0]],[MADINAH,t('cities')[1]]].forEach(([ll,n])=>{
    if(!places.some(p=>Math.abs(p.lat-ll[0])<0.01&&Math.abs(p.lng-ll[1])<0.01)){ const m=label([ll[0],ll[1]+0.06],n,'base-lbl'); m.options.cityLabel=true; m.addTo(baseLayer); }
  });
  // label priority: active place, then places with more events; hide labels that would sit too close
  const order=[...places].sort((a,b)=>((b.lat+'|'+b.lng)===activeKey)-((a.lat+'|'+a.lng)===activeKey) || b.seqs.length-a.seqs.length);
  const shown=[];
  order.forEach(p=>{ if(!shown.some(q=>Math.hypot(q.lat-p.lat,q.lng-p.lng)<0.35)) { shown.push(p); p.show=true; } });
  places.forEach(p=>{
    const key=p.lat+'|'+p.lng, active=key===activeKey;
    const n=p.seqs.length;
    const icon=L.divIcon({ className:'', iconSize:[24,24], iconAnchor:[12,12],
      html:`<div class="pin${active?' is-active':''}${p.show&&!active?' show':''}"><span class="dot"></span>${n>1?`<span class="count">${ad(n)}</span>`:''}<span class="lbl">${esc(p.place)}</span></div>` });
    const mk=L.marker([p.lat,p.lng],{icon, zIndexOffset: active?1000:0, title:p.place, keyboard:true, alt:p.place}).addTo(stageLayer);
    mk.on('click',()=>{
      // cycle through this place's events, starting after the current one
      const idx = p.seqs.indexOf(state.seq);
      selectEvent(p.seqs[(idx+1)%n], {fromMap:true});
    });
  });
}

function drawRoute(e){
  routeLayer.clearLayers();
  if(!e || !e.route) return;
  const rc=cssv('--route');
  L.polyline(e.route,{color:rc,weight:3,opacity:.85,dashArray:'7 8',lineCap:'round'}).addTo(routeLayer);
  L.circleMarker(e.route[0],{radius:5,color:rc,weight:2,fillColor:cssv('--bg'),fillOpacity:1}).addTo(routeLayer);
  (e.stations||[]).filter(([la,ln])=>!(Math.abs(e.lat-la)<0.01&&Math.abs(e.lng-ln)<0.01) && !placesOf(e.stage).some(p=>Math.abs(p.lat-la)<0.05&&Math.abs(p.lng-ln)<0.05)).forEach(([la,ln,nar,nen])=>{ const n=EN()?nen:nar;
    L.circleMarker([la,ln],{radius:4,color:rc,weight:2,fillColor:cssv('--gold'),fillOpacity:1}).addTo(routeLayer);
    label([la,ln],`<span style="position:relative;${EN()?'left':'right'}:10px;top:-9px">${esc(n)}</span>`,'station').addTo(routeLayer);
  });
}

function frame(){
  const wide = window.innerWidth>900;
  const pad = wide ? {paddingTopLeft:[50,60],paddingBottomRight:[50,40]} : {padding:[24,24]};
  const e = state.seq!=null ? EV[state.seq] : null;
  if(!!state.mapPerson){
    const pts=placesFor(PSEQ[state.mapPerson]).map(p=>[p.lat,p.lng]);
    if(pts.length===1) map.flyTo(pts[0],8,{duration:.9});
    else map.flyToBounds(L.latLngBounds(pts),Object.assign({maxZoom:8,duration:.9},pad));
    return;
  }
  if(e && e.stage===state.stage && state.view==='detail'){
    if(e.route) map.flyToBounds(L.latLngBounds(e.route),Object.assign({maxZoom:10,duration:.9},pad));
    else map.flyTo([e.lat,e.lng], e.zoom, {duration:.9});
  } else {
    const pts=placesOf(state.stage).map(p=>[p.lat,p.lng]);
    if(pts.length===1) map.flyTo(pts[0],9,{duration:.9});
    else map.flyToBounds(L.latLngBounds(pts),Object.assign({maxZoom:9,duration:.9},pad));
  }
}

/* ---------- verses (asbab al-nuzul) ---------- */
const AS = DATA.asbab, UND = DATA.undated;
const AYC=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const qpAyah = (r,w) => { if(w) return AYC[r[0]-1]<=20 ? `1-${AYC[r[0]-1]}` : '1'; const [a,b]=r[3].split('-'); return b && (+b-+a)<20 ? `${a}-${b}` : a; };
const mushaf = (r,w) => `https://quranpedia.net/embed?surah=${r[0]}&ayah=${qpAyah(r,w)}${EN()?'&type=translations':''}`;
const qv = h => h.replace(/﴿([^﴾]+)﴾/g,'<span class="qv">﴿$1﴾</span>');
const refLabel = r => EN() ? `${r[2]} ${r[3].replace('-','–')}` : `${r[1]}: ${ad(r[3]).replace('-','–')}`;
const hadRef = (x) => EN() ? x.replace(/،\s*/g,', ').replace('وتعليقًا عن أنس قبله',"and a mu'allaq report from Anas before it") : ad(x);
function vItem(id, k, after){
  const a=AS[id]; if(!a) return '';
  const abr=!a.refs.length;
  const head = abr ? `<span class="vref vabr">${t('vAbr')}</span>`
    : a.whole ? `<span class="vref">${EN()?esc(a.refs[0][2]):'سورة '+esc(a.refs[0][1])} — ${t('vWhole')}</span>`
    : a.refs.map(r=>`<span class="vref">${EN()?'':'سورة '}${esc(refLabel(r))}</span>`).join('<span class="vsep">·</span>');
  const tag = k==='a' ? t('vAfterEv') : k==='c' ? t('vCtx') : k==='s' ? t('vEst') : k==='p' ? t('vPeriod') : '';
  const aft = k==='s' && after!=null ? `<button class="vafter" data-seq="${after}">${t('vAfter')} ${esc(tx(EV[after],'title'))}</button>` : '';
  const src = (a.ev ? (EN()?esc(a.ev_en):esc(ad(a.ev))) : [a.bk?`${t('vBk')} ${hadRef(a.bk)}`:'', a.ms?`${t('vMs')} ${hadRef(a.ms)}`:''].filter(Boolean).join(' · '))
    + (a.tafs && a.tafs.length ? ` · <a href="${escA(a.tafs[0])}" target="_blank" rel="noopener">${t('vTaf')}</a>` : '');
  const read = abr ? '' : a.refs.map(r=>`<a href="${escA(mushaf(r,a.whole))}" data-quranpedia-link data-surah="${r[0]}" data-ayah="${qpAyah(r,a.whole)}"${EN()?' data-type="translations"':''} target="_blank" rel="noopener">${t('vRead')}${a.refs.length>1?` (${esc(refLabel(r))})`:''}</a>`).join(' · ');
  return `<li class="vitem${k==='c'?' is-ctx':''}">
    <div class="vhead">${head}</div>
    <div class="vtitle">${EN()?esc(a.t_en):qv(esc(a.t))}</div>
    <div class="vphrase">${esc(EN()?a.ph_en:a.ph)}</div>

    <details class="vtxt"><summary>${t('vMore')}</summary><p${EN()?' lang="ar" dir="rtl"':''}>${qv(esc(a.txt))}</p></details>
    <div class="vsrc">${src}${src&&read?' · ':''}${read}</div></li>`;

const vWire = root => root.querySelectorAll('.vafter').forEach(b=>b.onclick=()=>{ stopPlay(); selectEvent(+b.dataset.seq); });
function stageVerses(){
