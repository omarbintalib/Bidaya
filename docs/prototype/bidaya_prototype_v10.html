<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var th=localStorage.getItem("bidaya-theme");if(th)document.documentElement.setAttribute("data-theme",th);var l=localStorage.getItem("bidaya-lang");if(l==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr";}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بداية · السيرة النبوية في الزمان والمكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&text=%EF%B7%BA" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#FAF7F0; --ink:#331B0D; --ink-2:#2b170b; --soft:#5a4636; --muted:#8C7753;
  --gold:#B49641; --gold-text:#6f5a1f; --gold-soft:rgba(180,150,65,.13); --line:rgba(51,27,13,.12); --line-strong:rgba(51,27,13,.22);
  --btn-bg:#331B0D; --btn-fg:#FAF7F0; --btn-hover:#4a2a17; --overlay:rgba(255,255,255,.95); --stg-done:#f3eee3;
  --stg-on-bg:#331B0D; --stg-on-fg:#FAF7F0; --stg-on-sub:#d8c690; --halo:#ffffff; --sea:#7c8a8f; --region:rgba(140,119,83,.55);
  --pin-on:#331B0D; --story:#331B0D; --map-bg:#f3efe6; --tile-filter:sepia(.35) saturate(1.15) brightness(1.03); --route:#331B0D;
  color-scheme:light;
  --font:"Saudi","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --panel:420px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1B100A; --surface:#24160D; --surface-2:#2E1D12; --ink:#F1EADB; --ink-2:#E6DDCB; --soft:#CBBDA3; --muted:#A8946D;
  --gold:#C8A955; --gold-text:#DCC07A; --gold-soft:rgba(200,169,85,.16); --line:rgba(241,234,219,.10); --line-strong:rgba(241,234,219,.22);
  --btn-bg:#C8A955; --btn-fg:#1B100A; --btn-hover:#d6b964; --overlay:rgba(36,22,13,.94); --stg-done:#2A1A10;
  --stg-on-bg:#C8A955; --stg-on-fg:#1B100A; --stg-on-sub:#3d2a12; --halo:#1B100A; --sea:#8a9a9e; --region:rgba(200,169,85,.45);
  --pin-on:#F1EADB; --story:#3A2516; --map-bg:#1f1a16; --tile-filter:sepia(.4) saturate(1.3) brightness(.95); --route:#E7C873;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B100A; --surface:#24160D; --surface-2:#2E1D12; --ink:#F1EADB; --ink-2:#E6DDCB; --soft:#CBBDA3; --muted:#A8946D;
  --gold:#C8A955; --gold-text:#DCC07A; --gold-soft:rgba(200,169,85,.16); --line:rgba(241,234,219,.10); --line-strong:rgba(241,234,219,.22);
  --btn-bg:#C8A955; --btn-fg:#1B100A; --btn-hover:#d6b964; --overlay:rgba(36,22,13,.94); --stg-done:#2A1A10;
  --stg-on-bg:#C8A955; --stg-on-fg:#1B100A; --stg-on-sub:#3d2a12; --halo:#1B100A; --sea:#8a9a9e; --region:rgba(200,169,85,.45);
  --pin-on:#F1EADB; --story:#3A2516; --map-bg:#1f1a16; --tile-filter:sepia(.4) saturate(1.3) brightness(.95); --route:#E7C873;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:64px 1fr auto;grid-template-columns:minmax(460px,44%) 1fr;
  grid-template-areas:"head head" "panel map" "time time"}

/* header */
header{grid-area:head;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{height:30px;width:auto;color:var(--ink);display:block}
.tagline{font-size:15px;color:var(--muted);font-weight:500;padding-inline-start:18px;border-inline-start:1px solid var(--line-strong);line-height:30px}
.head-actions{margin-inline-start:auto;display:flex;gap:10px}
.btn{border:1px solid var(--line-strong);background:transparent;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;line-height:1.4}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-primary[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B100A}

/* panel */
.panel{grid-area:panel;background:var(--surface);border-inline-end:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.stage-head{padding:24px 28px 20px;border-bottom:1px solid var(--line)}
.stage-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.era{background:var(--gold-soft);color:var(--gold-text);border-radius:999px;padding:3px 12px;font-weight:600}
.stage-head h1{font-size:27px;line-height:1.45;margin:12px 0 6px;font-weight:700}
.stage-head p{margin:0;font-size:15px;line-height:1.9;color:var(--soft)}

.list{list-style:none;margin:0;padding:8px 0 24px}
.list button{width:100%;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:start;
  background:none;border:0;padding:12px 28px;border-inline-start:3px solid transparent}
.list button:hover{background:var(--surface-2)}
.list button.is-active{background:var(--gold-soft);border-inline-start-color:var(--gold)}
.num{font-size:13px;color:var(--muted);font-weight:600;padding-top:3px}
.li-title{display:block;font-size:17px;font-weight:600;line-height:1.6}
.li-date{display:block;font-size:13px;color:var(--muted);margin-top:2px}

.detail{padding:20px 28px 32px}
.back{background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.detail h2{font-size:32px;line-height:1.4;margin:14px 0 18px;font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 20px;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:15px}
.facts dt{color:var(--muted);font-weight:500}
.facts dd{margin:0;font-weight:600}
.theme-btn{min-width:44px}
.tag{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:1px 9px;vertical-align:2px}
.text p{font-size:19px;line-height:2.15;margin:0 0 16px;color:var(--ink-2)}
.saw{font-family:"Amiri","Saudi","IBM Plex Sans Arabic",serif;font-weight:700;font-size:1.05em;line-height:1}
.verse{color:var(--gold-text);font-weight:600}
.ref{color:var(--muted);font-size:14px}
.more{background:none;border:0;padding:0;font-size:15px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:6px}
.source{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.8}
.source a{color:var(--ink);font-weight:600;text-decoration-color:var(--gold);text-underline-offset:4px}
.pager{display:flex;gap:10px;margin-top:24px}
.pager .btn{flex:1}
.pager .btn:disabled{opacity:.35;cursor:default;border-color:var(--line-strong)}

/* people */
.people-sec{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.people-sec h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;line-height:1.5}
.chip:hover{border-color:var(--gold);background:var(--gold-soft)}
.person{padding:20px 28px 32px}
.person h2{font-size:28px;line-height:1.5;margin:12px 0 2px;font-weight:700}
.hon{font-size:15px;color:var(--gold-text);font-weight:600}
.person .desc{font-size:17px;line-height:2;margin:16px 0 6px;color:var(--ink-2)}
.draft{font-size:12px;color:var(--muted)}
.person h3{margin:26px 0 4px;font-size:16px;font-weight:600}
.person .list button{padding-inline:0}
.pgroup{margin-top:22px}
.pgroup h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plist button{width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.plist button:hover{border-color:var(--gold);background:var(--gold-soft)}
.plist b{display:block;font-size:15px;font-weight:600;line-height:1.5}
.plist small{font-size:12px;color:var(--muted)}
.intro{font-size:15px;line-height:1.9;color:var(--soft);margin:8px 0 0}
.stg .pdot{display:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-start:6px;vertical-align:1px}
.stg.has-person .pdot{display:inline-block}

.pname{cursor:pointer;
  text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:7px}
.pname:hover{color:var(--gold-text);background:var(--gold-soft);border-radius:4px}
.pop{position:fixed;z-index:3000;width:300px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;display:none;pointer-events:none}
.pop.is-on{display:block}
.pop b{display:block;font-size:17px;font-weight:700;line-height:1.5}
.pop .hon{font-size:13px}
.pop p{margin:8px 0 6px;font-size:14px;line-height:1.8;color:var(--soft)}
.pop small{font-size:12px;color:var(--muted)}
.pfacts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:18px 0 0;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:15px}
.pfacts dt{color:var(--muted);font-weight:500}
.pfacts dd{margin:0;font-weight:600;line-height:1.7}
.person h4{margin:22px 0 6px;font-size:16px;font-weight:600}
.person .bio{font-size:17px;line-height:2.1;margin:0;color:var(--ink-2)}

/* figures dialog */
.pdlg{z-index:2100}
.pdlg-box{background:var(--surface);border-radius:16px;width:min(960px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.pdlg-head{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.pdlg-title{font-size:15px;font-weight:600;color:var(--muted)}
.pdlg-head .btn{margin-inline-start:auto}
.pdlg-body{overflow-y:auto;padding:24px 28px 30px;overscroll-behavior:contain}
.pd-grid{display:grid;grid-template-columns:320px 1fr;gap:32px;align-items:start}
.pd-side{position:sticky;top:0}
.pd-side h2{font-size:28px;line-height:1.5;margin:12px 0 2px;font-weight:700}
.pd-side .desc{font-size:16px;line-height:1.9;margin:14px 0 0;color:var(--soft)}
.pd-map{width:100%;margin-top:16px}
.pd-main .bio{font-size:17px;line-height:2.1;margin:0 0 6px;color:var(--ink-2)}
.pd-main h3{margin:0 0 8px;font-size:17px;font-weight:700}
.pd-main h3:not(:first-child){margin-top:26px}
.pd-main .list{padding:0}
.pd-main .list button{padding:10px 8px;border-radius:8px}
.pdlg .pgroup:first-of-type{margin-top:14px}
.pdlg .plist{grid-template-columns:repeat(3,1fr)}
.plist li{display:flex}
.plist button{height:100%;display:flex;flex-direction:column}
.plist .pl-n{margin-top:auto!important;padding-top:4px}
.pdlg .plist small{display:block;line-height:1.7;margin-top:2px}
.pl-n{color:var(--gold-text)!important;font-weight:600}
.personbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:650;display:none;align-items:center;gap:12px;
  background:var(--overlay);border:1px solid var(--line-strong);border-radius:999px;padding:6px 8px 6px 16px;font-size:14px;white-space:nowrap}
.personbar.is-on{display:flex}
.personbar button{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}

/* english mode */
html[lang="en"] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",Tahoma,sans-serif}
html[lang="en"] .pin .lbl{right:auto;left:26px;direction:ltr}
html[lang="en"] .base-lbl,html[lang="en"] .sea-lbl,html[lang="en"] .region-lbl,html[lang="en"] .station{direction:ltr}
html[lang="en"] .text p{font-size:19px;line-height:1.75}
.text .summary-note{font-size:12px;line-height:1.6;color:var(--muted);margin:-4px 0 14px}
html[lang="en"] .pd-main .bio,html[lang="en"] .pd-side .desc{line-height:1.8}
html[lang="en"] .stg b{font-size:12.5px;line-height:1.4}
html[lang="en"] .stage-head p{line-height:1.7}
.en-note{margin:14px 0 4px!important}
.bio sup{line-height:0}
.cite{background:none;border:0;padding:0 2px;font-size:11px;font-weight:700;color:var(--gold-text);vertical-align:super;line-height:1}
.cite:hover{text-decoration:underline}
.src-h{margin-top:22px}
.cites{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:8px}
.cites li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;line-height:1.7;transition:border-color .3s,background .3s}
.cites li.flash{border-color:var(--gold);background:var(--gold-soft)}
.cite-n{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--gold-soft);color:var(--gold-text);font-size:12px;font-weight:700;display:grid;place-items:center}
.cite-ev{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:start;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.cite-sub{display:block;color:var(--muted);font-size:13px}
.cite-link{color:var(--muted)} .cite-link a{color:var(--ink);text-decoration-color:var(--gold);text-underline-offset:3px}
.cite-q{margin-top:4px} .cite-q summary{cursor:pointer;color:var(--muted);font-size:13px}
.cite-q p{margin:6px 0 0;font-family:"Saudi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:14px;line-height:1.9;color:var(--soft)}
.muted{color:var(--muted)}

.ar-toggle{background:none;border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;margin-top:6px}
.ar-toggle:hover{border-color:var(--gold)}
.ar-src{margin-top:14px;padding:14px 16px;border-inline-start:3px solid var(--gold);background:var(--surface-2);border-radius:8px;font-family:"Saudi","IBM Plex Sans Arabic",Tahoma,sans-serif}
.ar-src p{font-size:16px!important;line-height:2.05!important;margin:0 0 10px!important}
.lang-btn{font-weight:700}

.stage-head,.detail,.panel>.list{max-width:780px}
.stage-head{padding:28px 36px 22px}
.detail{padding:24px 36px 40px}
.panel .list button{padding:13px 36px}
.panel{box-shadow:6px 0 24px rgba(51,27,13,.06);position:relative;z-index:1}
html[dir="ltr"] .panel{box-shadow:-6px 0 24px rgba(51,27,13,.06)}

/* map */
.center{grid-area:map;min-height:0;display:grid;grid-template-rows:minmax(260px,1fr) auto auto;background:var(--bg);border-inline-start:0}
.map-wrap{position:relative;min-height:0;margin:14px 16px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mini{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px 10px}
.mini-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.mini-top b{font-size:15px;color:var(--ink);font-weight:600}
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:12px 6px 4px;height:26px}
.track::before{content:"";position:absolute;inset:50% 0 auto 0;height:2px;background:var(--line-strong);transform:translateY(-50%)}
.track .fill{position:absolute;top:50%;inset-inline-start:0;height:2px;background:var(--gold);transform:translateY(-50%)}
.node{position:relative;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);padding:0;flex:none}
.node:hover{border-color:var(--gold);transform:scale(1.25)}
.node.done{background:var(--gold);border-color:var(--gold)}
.node.on{width:22px;height:22px;background:var(--pin-on);border:3px solid var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.mini-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1.25fr 1.35fr .8fr;gap:12px;margin:12px 16px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;min-width:0}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
#figcard .chips{gap:6px}
#figcard .chip{padding:4px 12px;font-size:13px}
#figcard .empty{font-size:14px;color:var(--muted);line-height:1.8;margin:0}
.fig-more{display:block;margin-top:10px;background:none;border:0;padding:0;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--font)}
.leaflet-control-attribution{font-size:10px;background:var(--overlay)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--soft)!important}
.leaflet-bar a{color:var(--ink)!important;background:var(--surface)!important;border-color:var(--line)!important}
.leaflet-bar{border-color:var(--line-strong)!important}
.pin{position:relative;width:24px;height:24px}
.pin .dot{position:absolute;inset:6px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
.pin .count{position:absolute;top:-8px;left:14px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
.pin .lbl{position:absolute;top:50%;right:26px;transform:translateY(-50%);white-space:nowrap;direction:rtl;font-size:13px;font-weight:600;
  background:var(--overlay);color:var(--ink);border:1px solid var(--line);padding:2px 9px;border-radius:6px;display:none}
.pin.show .lbl{display:block;font-weight:500;color:var(--soft)}
.pin:hover .lbl{display:block}
.pin.is-active .dot{inset:2px;background:var(--pin-on);border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(180,150,65,.28)}
.pin.is-active .lbl{display:block;font-size:14px;font-weight:700}
.past{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.45}
.base-lbl{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;direction:rtl;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.region-lbl{font-size:14px;font-weight:600;color:var(--region);white-space:nowrap;direction:rtl;letter-spacing:1px}
.sea-lbl{font-size:13px;color:var(--sea);letter-spacing:.5px;white-space:nowrap;direction:rtl}
.station{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;direction:rtl;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 3px var(--halo)}
.legend{font-size:13px;line-height:2.05;color:var(--soft)}
.legend i{display:inline-block;vertical-align:middle;margin-inline-end:8px}
.lg-active{width:14px;height:14px;border-radius:50%;background:var(--pin-on);border:2px solid var(--gold)}
.lg-stage{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
.lg-past{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5;margin-inline:2px 10px!important}
.lg-route{width:18px;border-top:2px dashed var(--route)}
.notice{position:absolute;inset:auto 14px 14px auto;z-index:600;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 14px;font-size:14px;max-width:320px;display:none}

/* stage stat card */


.stat-n{font-size:30px;font-weight:700;line-height:1.3;margin-top:4px}
.stat-l{font-size:14px;line-height:1.7;font-weight:500}
.stat-c{font-size:12px;color:var(--muted);margin-bottom:2px}
.stat-spread{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.7}
.stat-spread b{font-weight:600;color:var(--muted);margin-inline-end:4px}
.stat-src{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.7}
.stat-src button{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.stat-note{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.7}
.lg-zone{width:14px;height:12px;border-radius:3px;background:rgba(180,150,65,.28);border:1px solid rgba(180,150,65,.7)}

/* story bar */
.story{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:700;display:none;align-items:center;gap:12px;
  background:var(--story);color:#FAF7F0;border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.28);border:1px solid var(--line);min-width:420px}
.story.is-on{display:flex}
.story button{background:transparent;border:1px solid rgba(250,247,240,.3);color:#FAF7F0;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600}
.story button:hover{border-color:var(--gold)}
.story .play{background:var(--gold);border-color:var(--gold);color:#1B100A;min-width:84px}
.story-prog{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.bar{height:4px;background:rgba(250,247,240,.2);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);transition:width .3s}

/* timeline */
.timeline{grid-area:time;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px 14px;overflow-x:auto}
.eras{display:grid;grid-template-columns:4fr 8fr;gap:8px;min-width:1100px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--muted)}
.eras div{border-bottom:2px solid var(--line-strong);padding-bottom:4px}
.eras div:last-child{border-bottom-color:var(--gold)}
.stages{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;min-width:1100px}
.stg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:start;min-height:58px;display:flex;flex-direction:column;justify-content:space-between}
.stg:hover{border-color:var(--muted)}
.stg b{font-size:13px;line-height:1.5;font-weight:600}
.stg small{font-size:12px;color:var(--muted);margin-top:4px}
.stg.is-done{background:var(--stg-done)}
.stg.is-active{background:var(--stg-on-bg);border-color:var(--stg-on-bg);color:var(--stg-on-fg)}
.stg.is-active small{color:var(--stg-on-sub)}

/* modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(20,10,4,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.is-open{display:flex}
.modal-box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:28px 30px;max-height:90vh;overflow:auto}
.modal-box h2{margin:0 0 12px;font-size:22px}
.modal-box p,.modal-box li{font-size:15px;line-height:2;color:var(--soft)}
.modal-box ul{padding-inline-start:20px;margin:6px 0 16px}

@media (max-width:900px){
  .pdlg{padding:0;align-items:stretch}
  .pdlg-box{max-height:none;height:100%;border-radius:0}
  .pd-grid{grid-template-columns:1fr;gap:20px}
  .pd-side{position:static}
  .pdlg .plist{grid-template-columns:1fr}
  .pdlg-body{padding:18px}
  .personbar{top:auto;bottom:80px}
  .person{padding-inline:18px}
  .plist{grid-template-columns:1fr}
  .center{display:contents}
  .map-wrap{grid-area:mapw}
  .mini{grid-area:mini}
  .cards{grid-area:cards}
  .timeline{padding:10px 10px 12px}
  .stages,.eras{min-width:1500px}
  .head-actions{width:100%;display:flex;flex-wrap:wrap;gap:6px}
  .head-actions .btn{flex:1 1 auto;font-size:13px;padding:7px 10px;white-space:nowrap}
  .head-actions .btn-primary{flex-basis:100%}
  .map-wrap{height:46vh;margin:10px 10px 0}
  .mini{margin:10px 10px 0;padding:10px 12px}
  .track{overflow-x:auto}
  .cards{grid-template-columns:1fr;margin:10px}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"head" "time" "mapw" "mini" "panel" "cards"}
  header{padding:10px 16px;flex-wrap:wrap;gap:10px}
  .tagline{display:none}
  .panel{border:0;overflow:visible}
  .story{min-width:0;width:calc(100% - 24px);gap:8px}
  .stage-head,.detail{padding-inline:18px}
  .list button{padding-inline:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.leaflet-right .leaflet-control{float:right}

.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:6px}
.leaflet-bar a{width:30px;height:30px;line-height:30px;display:block;text-align:center;text-decoration:none;border-bottom:1px solid var(--line)}
.leaflet-bar a:first-child{border-radius:6px 6px 0 0}.leaflet-bar a:last-child{border-radius:0 0 6px 6px;border-bottom:none}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px/30px system-ui,sans-serif}
.leaflet-control-attribution{margin:0!important;padding:0 6px;line-height:1.5}
.leaflet-container a{color:inherit}

/* verses (asbab al-nuzul) */
.verses-sec{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.verses-sec h3,.stage-verses h3{margin:0 0 4px;font-size:16px}
.stage-verses{margin:0 28px 8px;padding-top:18px}
.vhint{margin:0 0 12px}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vitem{border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:10px;padding:12px 14px;background:var(--surface)}
.vitem.is-ctx{border-inline-start-style:dashed}
.vhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.vref{display:inline-block;background:var(--gold-soft);color:var(--gold-text);font-weight:700;font-size:13px;padding:2px 10px;border-radius:999px}
.vref.vabr{background:transparent;border:1px dashed var(--line-strong);color:var(--soft)}
.vsep{color:var(--muted);font-size:12px}
.vtitle{font-weight:700;font-size:15px;line-height:1.6;color:var(--ink)}
.vphrase{font-size:14px;color:var(--soft);margin-top:2px}
.vtag{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted);border:1px solid var(--line-strong);border-radius:6px;padding:1px 8px}
.vafter{display:block;margin-top:6px;padding:0;border:0;background:none;color:var(--gold-text);font-size:13px;text-align:start;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.vtxt{margin-top:8px;font-size:14px;color:var(--soft)}

: "١٠٬٠٠٠", "label": "خرجوا مع النبي ﷺ لفتح مكة", "src": 112, "carried": false, "n_en": "10,000", "label_en": "Marched with the Prophet ﷺ to conquer Makkah"}, "spread": "الحجاز بعد فتح مكة، والبحرين وعُمان", "spread_en": "The Hijaz after the Conquest, plus Bahrain and Oman", "zones": ["hijaz", "bahrain", "oman"], "asbab": [{"id": "ASB-084", "k": "s", "after": 118}]}, {"name": "عام الوفود وحجة الوداع", "era": "مدني", "desc": "إقبال الوفود على الإسلام، وغزوة تبوك، وحجة الوداع، ثم وفاة النبي ﷺ.", "range": "9–11 هـ", "start": 119, "count": 12, "name_en": "Delegations and the Farewell Pilgrimage", "desc_en": "Delegations embrace Islam, the Tabuk campaign, the Farewell Pilgrimage, then the passing of the Prophet ﷺ.", "range_en": "9–11 AH", "stat": {"n": "٣٠٬٠٠٠", "label": "جيش المسلمين في غزوة تبوك، على المشهور", "src": 123, "carried": false, "n_en": "30,000", "label_en": "The army at Tabuk, the most accepted figure"}, "spread": "معظم جزيرة العرب", "spread_en": "Most of the Arabian Peninsula", "zones": ["peninsula"], "asbab": [{"id": "ASB-083", "k": "s", "after": 123}, {"id": "ASB-054", "k": "p", "after": 125}, {"id": "ASB-070", "k": "s", "after": 126}, {"id": "ASB-058", "k": "p", "after": 129}, {"id": "ASB-078", "k": "s", "after": 129}]}], "events": [{"seq": 0, "stage": 0, "title": "أوَّلُ نُزولِ الوَحيِ ونُبوءةُ النَّبيِّ صلَّى الله عَليهِ وسلَّم", "date": "رمضان 13 ق.هـ، الموافق 610م", "place": "غار حراء", "lat": 21.4576, "lng": 39.859, "approx": false, "zoom": 11, "paras": ["كان أوَّلَ ما بُدِئ بهِ الوحيُ هو الرُّؤيا الصَّادقةُ في النَّومِ، وكان لا يَرى رُؤيا إلا جاءتْ مِثلَ فَلَقِ الصُّبحِ، ثمَّ إنَّه صلى الله عليه وسلم حُبِّبَ إليهِ الخَلاءُ، فكان يَخلو في غارِ حِراءٍ ويَتَحَنَّثُ فيهِ مُتعبِّدًا، حتَّى جاءهُ جبريلُ عَليهِ السَّلامُ وهو في الغارِ بقولِه تعالى: <span class=\"verse\">﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ (١) خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ (٢) اقْرَأْ وَرَبُّكَ الْأَكْرَمُ (٣) الَّذِي عَلَّمَ بِالْقَلَمِ (٤) عَلَّمَ الْإِنْسَانَ مَا لَمْ يَعْلَمْ (٥) ﴾</span> <span class=\"ref\">[العلق: ١ - ٦]</span>.", "فَقَصَّ ذلك على زوجتِه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةَ</span> التي قَصَّتْ ما حدث على وَرقةَ بنِ نَوفلٍ فصدَّقهُ، وقال: إنَّه النَّاموسُ الأكبرُ الذي جاء موسى، ثمَّ انقطع الوحيُ فَترةً مِنَ الزَّمنِ، ثمَّ عاد إليهِ جبريلُ وهو قاعدٌ على كُرسيٍّ، فخاف منه النَّبيُّ صلى الله عليه وسلم ورجع إلى أهلِه قائلًا: زَمِّلوني زَمِّلوني.", "فأنزل الله تعالى: <span class=\"verse\">﴿يَاأَيُّهَا الْمُدَّثِّرُ (١) قُمْ فَأَنْذِرْ (٢) وَرَبَّكَ فَكَبِّرْ (٣) وَثِيَابَكَ فَطَهِّرْ (٤) وَالرُّجْزَ فَاهْجُرْ (٥)﴾</span> <span class=\"ref\">[المدثر: ١ - ٥]</span>. فكان ذلك أوَّلَ النُّبوَّةِ والأمرَ بالتَّبليغِ."], "url": "https://dorar.net/history/event/12", "route": null, "stations": null, "title_en": "The First Revelation and the Prophethood of the Prophet ﷺ", "date_en": "Ramadan 13 BH (610 CE)", "place_en": "Cave of Hira", "summary_en": "Revelation began with true dreams, then the Angel Jibril came to the Prophet ﷺ while he was in seclusion in the Cave of Hira and revealed the first verses of the Quran. Khadijah comforted him and stood by him.", "people": ["khadija"], "dorar": 12, "asbab": [{"id": "ASB-001", "k": "d"}, {"id": "ASB-002", "k": "d"}], "body_en": ["When revelation first started to appear to the Prophet ﷺ it started off as visions in his dreams; his dreams would occur like the braking of dawn. Then seclusion became beloved to him ﷺ and he would seclude himself at the cave of Hiraa’ and worship [Allah] there all by himself. He ﷺ did this until Jibreel, peace be upon him, came to him while he was in the cave and revealed to him: {READ in the name of thy Sustainer, who has created; He created man out of a germ-cell! [96:3] Read – for Your Sustainer is the Most Bountiful One who has taught [man] the use of the pen; He taught man what he did not know!", "Nay, verily, man becomes grossly overweening} [Quran 96:1-6]. He ﷺ told his wife Khadeejah what had happened, who then told Waraqah ibn Nawfal, and he believed him. He then said: “this is The Archangel (al-Naamoos al-Akbar) that was sent to Prophet Moosaa. Then, revelation stopped coming for a while after this, and then Jibreel re-appeared to him sitting on a chair. The Prophet ﷺ became fearful and hurried back to his wife saying to her: {cover me! Cover me!”} Then Allah revealed to him: {O you, enveloped in a mantle, stand up and warn, and pronounce the greatness of your Lord, and purify your clothes, and keep away from filth} [Quran 74: 1-5]. This then was the beginning of his Prophethood and the command to convey the divine message to the people."], "src_en": "https://dorar.net/en/history?page=1"}, {"seq": 1, "stage": 0, "title": "فُتورُ الوحيِ عن رسولِ الله صلَّى الله عَليهِ وسلَّم", "date": "شوال 13 ق.هـ، الموافق 610م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["فَتَرَ الوحيُ عن رسولِ الله صلى الله عليه وسلم فَترةً مِنَ الزَّمنِ, حتَّى شَقَّ ذلك عَليهِ فأحزنهُ، فجاءهُ جبريلُ بسورةِ الضُّحى يُقسِمُ له رَبُّهُ -وهو الذي أكرمهُ بما أكرمهُ بهِ- ما وَدَعَهُ, فقد روى البخاري في صحيحه من حديث جندب بن عبدالله رضي الله عنه قال: احْتَبَسَ جِبْرِيلُ صَلَّى اللهُ عليه وسلَّمَ علَى النبيِّ صَلَّى اللهُ عليه وسلَّمَ، فَقالتِ امْرَأَةٌ مِن قُرَيْشٍ -وهي أمُّ جميلٍ أَرْوى بنتُ حَرْبٍ أُخْتُ أبي سُفيانَ وزوجُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abulahab\">أبي لَهَبٍ</span>-: أَبْطَأَ عليه شيطَانُهُ، فَنَزَلَتْ: <span class=\"verse\">﴿وَالضُّحَى واللَّيْلِ إذَا سَجَى، ما ودَّعَكَ رَبُّكَ وما قَلَى﴾</span> ."], "url": "https://dorar.net/history/event/13", "route": null, "stations": null, "title_en": "Revelation Stops Coming to the Prophet ﷺ for a Time", "date_en": "Shawwal 13 BH (610 CE)", "place_en": "Makkah", "summary_en": "Revelation paused for a time, which saddened the Prophet ﷺ, until Jibril brought Surah Ad-Duha, assuring him that his Lord had not abandoned him.", "people": ["abulahab"], "dorar": 13, "asbab": [{"id": "ASB-015", "k": "d"}], "body_en": ["Revelation stopped coming to the Messenger of Allah ﷺ for a time, such that it became very difficult for him to bear and saddened him deeply. Jibreel then came to him and revealed Surah- al-Duhaa in which his Lord swore that He did not leave him, and that He was the one who blessed him with what he ﷺ has. During the days in which revelation had stopped coming, the Prophet ﷺ was filled with melancholy and sadness, and he ﷺ was filled with shock and confusion. Al-Bukhaaree records in his chapter on Dream Interpretation: “Revelation stopped coming [to the Prophet ﷺ] for a period of time. This saddened the Prophet ﷺ deeply, and grieved him so much that he ﷺ would take himself to the mountain tops in order to throw himself off. Every time he ﷺ would reach a summit and to jump, Jibreel would appear to him and say to him: “verily you are the Messenger of Allah!” And that would calm him down and he ﷺ would regain his composure, and he ﷺ would turn back.", "When revelation continued to be cut off from him, he ﷺ would return to the same state and return to the mountain tops where Jibreel would reappear to him and say the same as before. The withholding of revelation was supposed to be so that it would increase his longing for it and to remove the terror that he ﷺ had initially felt. Once that desire took hold firmly within him, and awaited the return of revelation, Allah blessed him with a second deluge of revelation.”"], "src_en": "https://dorar.net/en/history?page=1"}, {"seq": 2, "stage": 0, "title": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه", "date": "شوال 13 ق.هـ، الموافق 610م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كان أوَّلَ مَنْ آمنَ بالله ورسولِه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> بنتُ خويلدٍ زوجتُه صلى الله عليه وسلم، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span> الصِّدِّيقُ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">وعليُّ بنُ أبي طالبٍ</span>، ثمَّ أَسلمَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارثةَ</span> مولى رسولِ الله صلى الله عليه وسلم. وقد أَسلمَ بدُعاءِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبي بكرٍ</span> الصِّدِّيقِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> بنُ عفَّانَ، والزُّبيرُ بنُ العوَّامِ، وسعدُ بنُ أبي وقَّاصٍ، وطَلحةُ بنُ عُبيدِ الله، وعبدُ الرَّحمنِ بنُ عوفٍ, ثمَّ أَسلمَ أبو عُبيدةَ بنُ الجرَّاحِ، وأبو سَلمةَ بنُ عبدِ الأَسدِ، وعُثمانُ بنُ مَظعونٍ، ثمَّ أَخواهُ قُدامةُ وعبدُ الله، وابنُه السَّائبُ بنُ عُثمانَ بنِ مَظعونٍ، وأسماءُ بنتُ أبي بكرٍ الصِّدِّيقِ، وعائشةُ بنتُ أبي بكرٍ الصِّدِّيقِ، وهي صغيرةٌ، ثمَّ أسلمَ خالدُ بنُ سعيدِ بنِ العاصي، وأسلمتْ معه امرأتُه أُمَيْنَةُ بن بنتُ خلفِ بنِ أَسعدَ الخُزاعيَّةُ، وبلالٌ، وعمَّارُ بنُ ياسرٍ، وأمُّهُ سُميَّةُ، وصُهيبُ بنُ سِنانٍ النَّمَريُّ المعروف بالرُّوميِّ، وعَمرُو بنُ عَبَسةَ السُّلميُّ، وعَمرُو بنُ سعيدِ بنِ العاصي، وسعيدُ بنُ زيدِ بنِ عَمرو بنِ نُفيلٍ، وزوجتُه فاطمةُ بنتُ الخطَّابِ أختُ عُمرَ بنِ الخطَّابِ، وعُميرُ بنُ أبي وقَّاصٍ، وعبدُ الله بنُ مَسعودٍ، وأخوهُ عُتبةُ بنُ مَسعودٍ، وسَليطُ بنُ عمرٍو العامريُّ، وعيَّاشُ بنُ أبي رَبيعةَ المخزوميُّ، وامرأتُه أسماءُ بنتُ سَلامةَ بن مُخَرِّبَةَ التَّميميَّةُ، ومَسعودُ بنُ رَبيعةَ بنِ عَمرٍو القاريُّ من بني الهُونِ بنِ خُزيمةَ، وهُم القارَةُ، وخُنَيْسُ بنُ حُذافةَ بنِ قَيسِ بنِ عَدِيٍّ السَّهميُّ، وعبدُ الله جَحشٍ الأسَديُّ, تَتِمَّةُ السَّابقين إلى الإيمانِ برسولِ الله صلى الله عليه وسلم: وجعفرُ بنُ أبي طالبٍ، وامرأتُه أسماءُ بنتُ عُميسٍ، وعامرُ بنُ رَبيعةَ العَنَزيُّ، من عَنْزِ بنِ وائلٍ، حَليفُ الخطَّابِ بنِ نُفيلٍ، وأبو أحمدَ بنُ جَحشٍ الأعمى، وحاطبُ بنُ الحارثِ بنِ مَعمرٍ الجُمَحيُّ، وامرأتُه بنتُ المُجَلِّلِ العامريَّةُ، وحطَّابُ بنُ الحارثِ أخوهُ، وامرأتُه فكهية فُكَيْهَةُ بنتُ يَسارٍ، وأخوهما مَعمرُ بنُ الحارثِ بنِ مَعمرٍ الجُمَحيُّ، والمُطَّلِبُ بنُ أَزهرَ بنِ عبدِ عَوفٍ الزُّهريُّ، وامرأتُه رَمْلَةُ بنتُ أبي عَوفٍ السَّهميَّةُ، والنَّحَّامُ واسمُه نُعيمُ بنُ عبدِ الله العَدويُّ، وعامرُ بنُ فُهيرةَ مولًى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">لأبي بكرٍ</span> الصِّدِّيق، وحاطبُ بنُ عَمرِو بنِ شمسِ بنِ عبدِ وُدٍّ العامريُّ أخو سَليطِ بنِ عَمرٍو، وأبو حُذيفةُ بنُ عُتبةَ بنِ رَبيعةَ، واسمُه مِهْشَمُ بنُ عُتبةَ..."], "url": "https://dorar.net/history/event/14", "route": null, "stations": null, "title_en": "The First People to Believe in Allah and His Messenger", "date_en": "Shawwal 13 BH (610 CE)", "place_en": "Makkah", "summary_en": "The first to believe were Khadijah, Abu Bakr, Ali ibn Abi Talib and Zayd ibn Harithah. Through Abu Bakr's invitation, several leading Companions also accepted Islam, among them Uthman ibn Affan.", "people": ["abubakr", "khadija", "uthman", "ali", "zayd"], "dorar": 14, "asbab": [{"id": "ASB-003", "k": "d"}], "body_en": ["The first person to have ever believed in Allah and His Messenger, was Khadeejah bint Khuwaylid, the Prophet’s wife (may Allah be pleased with her). Then it was Aboo Bakr, Ali ibn Abee Taalib, and Zayd ibn Haarithah, the bondsperson of the Messenger of Allah ﷺ. Aboo Bakr was able to successfully call to Islam ‘Uthmaan ibn ‘Affaan, al-Zubayr ibn al-‘Awwaam, S’ad ibn Abee Waqqaas, Talhah ibn ‘Ubaydullah, and Abdurrahman ibn ‘Awf. Then Aboo ‘Ubaydah al-Jarraah, and Aboo Salmah ibn Abd’ul-Asad, ‘Uthmaan ibn Ma’thoom, then his brothers Qudaamah and Abdullah, then his son al-Saa’ib ibn Uthmaan ibn Ma’thoon, then Asmaa bint Abee Bakr al-Siddeeq, then ‘Aa’ishaa bint Abee Bakr al-Siddeeq while she was still young, entered Islam.", "Then came Khaalid ibn Sa’eed ibn al-‘Aasee and his wife, Umniyyah bint Khalaf ibn Sa’aad al-Khuza’eeyyah; then Bilal accepted Islam, Ammaar ibn Yaaser, then his mother Summayyah. The next people to accept Islam were Suhayb ibn Sinaan al-Namaree better known as al-Roomee. Then ‘‘Amr ibn ‘Abasah al-Sulamee, then ‘Amr ibn Sa’eed ibn al-Aasee, then S’aeed ibn Zayd ibn Umar ‘Amr ibn Nufayl and his wife Faatimah bint al-Khattaab, the sister of Umar ibn al-Khattaab. Then came Umayr ibn Abee Waqqaas, Abdullah ibn Masood and his brother Utbah ibn Masood, then Saleet ibn ‘Amr al-Aamiree, Ayyaash ibn Abee Rabee’ah al-Makhzoomee and his wife Asmaa’ bint Salamah ibn Mukharrabah al-Tameemiyyah, Masood ibn Rabeeah ibn ‘Amr al-Qaree from Banoo al-Hoon ibn Khuzaymah, also known as al-Qaarah.", "Then Khunays ibn Hudhayfah ibn Qays ibn ‘Adee al-Sahmee, then Abdullah Jahhash al-Asadee. The last of those to accept Islam early on in the Prophet’s mission, ﷺ are Ja’faar ibn Abee Taalib and his wife Asmaa’ bint ‘Umays, ‘Aamir ibn Rabee’ah al-‘Anzee, from the Banoo ‘Anz ibn Waa’il, one of the allies al-Khattaab ibn Nufayl, then Aboo Ahmad ibn Jahash al-‘Amaa, then Haatib ibn al-Haarith ibn Ma’mar al-Jumahee and his wife bint al-Mijallal al-Aamiriyyah, then Hattab ibn al-Haarith and his wife Fukayah Fukayhah bint Yasaar, and their brother Ma’mar ibn al Haarith ibn Ma’mar al-Jumahee.", "Then al-Muttalib ibn Azhar ibn Abd Awf al-Zuhree and his wife Ramlah ibn Abee Awf al-Sahmiyyah, then al-Nahhaam whose name was Nu’aym ibn Abdullah al-‘Adawee, then ‘Aamir ibn Fuhayrah the bondsman of Aboo Bakr al-Siddeeq, then Haatib ibn ‘Amr ibn Shams ibn Abdu Wudd al-‘Aamiree, the brother of Saleet ibn ‘‘Amr, and lastly Aboo Hudhayfah ibn Uthbah ibn Rabe’ah, and his name was Mihsham ibn Uthbah"], "src_en": "https://dorar.net/en/history?page=1"}, {"seq": 3, "stage": 0, "title": "طلب قريش من أبي طالب أن يكف عنهم رسول الله صلى الله عليه وسلم", "date": "9 ق.هـ، الموافق 613م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كان رسولُ الله صلَّى اللهُ عليه وسلَّم يدْعو إلى الله تعالى في كُلِّ أحوالِهِ؛ ليلًا ونهارًا، وسِرًّا وجهرًا، لا يَصرِفُه عن ذلك صارِفٌ ولا يَرُدُّه عن ذلك رادٌّ، ولا يَصُدُّه عن ذلك صادٌّ، يَتبَعُ الناسَ في أنديَتِهم، ومَجامِعِهم ومَحافِلِهم وفي المَواسمِ، ومَواقفِ الحَجِّ؛ يدعو مَن لَقيَه مِن حرٍّ وعبدٍ، وضعيفٍ وقويٍّ، وغنيٍّ وفقيرٍ.", "وتسلَّط عليه وعلى مَنِ اتَّبَعه كفارُ قَومِه من مُشرِكي قُريشٍ، بل كان من أشدِّ الناسِ عليه عمُّه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abulahab\">أبو لَهَبٍ</span> وامرأتُه أُمُّ جَميلٍ حَمَّالةُ الحَطَبِ -أرْوَى بِنتُ حَربِ بن أُمَيَّةَ أختُ أبي سُفيانَ-، وكان عمُّه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبو طالبِ</span> بن عبد المُطَّلب يحنو عليه، ويُحسِنُ إليه، ويُدافِعُ عنه ويُحامي، ويُخالِفُ قَومَه في ذلك؛ مع أنه على دِينِهم، وكان استِمرارُه على دينِ قَومِه من حكمةِ الله تعالى، ومَّما صَنَعه لرَسولِه من الحِمايةِ؛ إذ لو كان أسلَمَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبو طالب</span> لَمَا كان له عند مُشرِكي قُريشٍ وَجاهةٌ ولا كلمةٌ، ولا كانوا يَهابونه ويَحتَرِمونَه.", "روى أصحاب السِّير أنَّ قريشًا جاءتْ إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبي طالبٍ</span> فقالوا: \"إنَّ ابنَ أخيك هذا قد آذانا في نادينا ومَسجِدِنا فانْهَهُ عنَّا\". فقال: \"يا عَقيلُ، انطلِقْ فأْتِني بمُحمَّدٍ\"، فجاء به في الظَّهيرةِ في شدَّةِ الحَرِّ. فلمَّا أتاهم قال: \"إنَّ بني عمِّك هؤلاء زعموا أنَّك تُؤذيهم في ناديهم ومَسجدِهم؛ فانتَهِ عن أذاهم\"، فحلَّق رسولُ الله صلَّى اللهُ عليه وسلَّم ببصرِه إلى السماءِ؛ فقال: \"تَرَونَ هذه الشَّمسَ؟\" قالوا: \"نعم\"، قال: \"فما أنا بأقدَرَ أن أدَعَ ذلك منكم على أن تَشتَعِلوا منها بشُعلةٍ\". فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبو طالبٍ</span>: \"واللهِ ما كَذَب ابنُ أخي قطُّ فارجِعوا\"."], "url": "https://dorar.net/history/event/16", "route": null, "stations": null, "title_en": "Quraysh Protests to Aboo Taalib About the Actions of the Messenger of Allah ﷺ in Hopes That He Will Stop Him ﷺ.", "date_en": "9 BH (613 CE)", "place_en": "Makkah", "summary_en": "The Prophet ﷺ called people to Allah in every setting, openly and privately, in their gatherings and during the pilgrimage season, while Quraysh, including his uncle Abu Lahab, opposed him.", "people": ["abutalib", "abulahab"], "dorar": 16, "asbab": [{"id": "ASB-006", "k": "c"}, {"id": "ASB-005", "k": "c"}], "body_en": ["Night and day, openly and secretly, the Messenger of Allah ﷺ would call people to Islam no matter where he was and what he was doing. No one could deter him, nor rebuke him, nor stop him. He ﷺ would follow people wherever they went, in their meeting places, their assemblies, at their caravans during the proper seasons, at the places where the pilgrims gathered. He called everyone to Islam: freemen and slaves, weak and strong, rich, and poor. The polytheists and disbelievers of Quraysh had been persecuting him and his followers; the most ruthless of people towards him was his own paternal uncle, Aboo Lahab and his wife, Umm Jameel Arwaa bint Harb ibn Umayyah, the sister of Aboo Sufyaan, and the one who carried the firewood.", "His paternal uncle, Aboo Taalib ibn Abdul-Mutallab was compassionate and good towards him; he protected him and advocated for him. Despite this being against the wishes of his peers from Quraysh, and even though he remained upon their religion. His persistence upon the religion of his people was a wisdom only known to Allah, and a means to protect the Messenger of Allah, ﷺ. Had Aboo Taalib accepted Islam, the Messenger of Allah ﷺ would have never found a footing with Quraysh nor been able to say anything to any of them.", "Nor would Quraysh have ever had any amount of respect or reverence for him ﷺ. The biographical scholars have narrated that Quraysh said to Aboo Taalib: “This son of your brother (i.e., your nephew) has disturbed and annoyed us in our assemblies and our places of worship; so, stop him!” Aboo Taalib then turned to one his sons and said: “Oh Aqeel! Go, and get me Muhammad!” He then returned with him at midday when the sun was at its hottest. When he came to him, Aboo Taalib said to him: “The tribe of your paternal uncle has come to me and claimed that you are disturbing and annoying them in the gatherings and places of worship; so, desist from this.”", "Then the Messenger of Allah ﷺ turned his gaze towards the sky and said: “Do you see this sun?” They said: “Yes, of course”. The Prophet ﷺ then continued: “I am as incapable of leaving this affair as you are incapable of igniting a single flame upon its surface.” Aboo Taalib then said to Quraysh: “I swear by Allah, the son of my brother has never ever lied, so go back, (i.e., I cannot fulfill your request)."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 4, "stage": 0, "title": "ما لقِي الصَّحابةُ من إيذاءِ قُريشٍ", "date": "9 ق.هـ، الموافق 613م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كان أوَّلَ مَن أظهرَ إسلامَه سبعةٌ: رسولُ الله صلى الله عليه وسلم، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span>، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ammar\">وعمَّارٌ</span>، وأمُّهُ سُميَّةُ، وصُهيبٌ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">وبلالٌ</span>، والمقدادُ، فأمَّا رسولُ الله صلى الله عليه وسلم فمنعهُ الله بعمِّه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبي طالبٍ</span>، وأمَّا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> فمنعهُ بقومِه، وأما سائرهُم فأخذهُم المشركون فألبسوهُم أَدراعَ الحديدِ وصَهروهُم في الشَّمسِ، فما منهُم إلَّا مَن واتاهُم فيما أرادوا وأَوْهَمهُم بذلك إلَّا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">بلال</span>ًا، فإنَّه هانتْ عَليهِ نفسُه في الله عزَّ وجلَّ، وهان على قومِه فأخذوه، وأعطوه الوِلدانَ، فجعلوا يطوفون به في شِعابِ مكَّة، وهو يقولُ: أَحَدٌ، أَحَدٌ.", "فجعلوا في عُنقهِ حبلًا، ودفعوه إلى الصِّبيانِ يلعبون بهِ، حتَّى أثَّر في عُنقهِ، وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">بلالٌ</span> لبعضِ بني جُمَحٍ، وكان الذي يتولَّى كِبْرَ تَعذيبهِ أُميَّةُ بنُ خَلفٍ، فكان يُخرجهُ إذا حَمِيَتِ الظَّهيرةُ، فيَطرَحهُ على ظَهرهِ في بَطحاءِ مكَّة، ثمَّ يأمرُ بالصَّخرةِ العظيمةِ فتوضعُ على صدرهِ.", "ثمَّ يقولُ له: لا تزالُ هكذا حتَّى تموتَ أو تكفرَ بمحمَّدٍ وتعبدَ اللَّاتَ والعُزَّي. فيقولُ وهو في هذا العذابِ والبلاءِ: أَحَدٌ أَحَدٌ. وكأنَّما كان يزيدُه عذابُه وبلاؤُه إيمانًا فوق إيمانٍ، ورقَّ له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> حين رآهُ يومًا في هذا الهوانِ الشَّديدِ، فاشتراهُ وأعتقهُ، وأعتقَ معه سِتًّا ممَّن كانوا يُعذَّبون على الإسلامِ."], "url": "https://dorar.net/history/event/15", "route": null, "stations": null, "title_en": "The Persecution of the Companions by the Disbelievers of Quraysh", "date_en": "9 BH (613 CE)", "place_en": "Makkah", "summary_en": "The first to declare their Islam openly were seven, including the Prophet ﷺ, Abu Bakr, Ammar and his mother Sumayyah, Suhayb, Bilal and al-Miqdad. Those without tribal protection were tortured, and Abu Bakr freed several of them.", "people": ["abubakr", "bilal", "abutalib", "ammar"], "dorar": 15, "asbab": [{"id": "ASB-007", "k": "c"}, {"id": "ASB-008", "k": "c"}, {"id": "ASB-009", "k": "c"}, {"id": "ASB-010", "k": "c"}, {"id": "ASB-011", "k": "c"}, {"id": "ASB-012", "k": "c"}], "body_en": ["The first people to declare their Islam openly were seven: The Messenger of Allah ﷺ Aboo Bakr, ‘Ammar and his mother Sumayyah, Suhayb, Bilaal, and al-Miqdaad. As for the Messenger of Allah ﷺ Allah had protected him by means of his paternal uncle Aboo Taalib. As for Aboo Bakr, he was protected by his clan. The rest, however, were seized by the polytheists and dressed in plates or iron and left them to smolder in the sun. Every single person that was seized (and tortured) gave in and said what (Quraysh) wanted to hear and deceived them (for they only said it outwardly but did not believe it inwardly), except for Bilal.", "He did not give in, he sacrificed himself for the sake of Allah the Mighty and Majestic. His people then despised him, and handed him over to the children, and he was paraded around the streets of Makkah; and he kept saying: “ONE! ONE!” Then they placed a rope around his neck and gave him to the small children to play with him until the rope had dug into his neck. Bilal belonged to some people from Banee Jumah. The person who exercised the worst kind of torture against him was Ummayyah ibn Khalaf, who would take him and leave him under the sun during the hottest part of the day, on his back in the plains of Makkah.", "Then he ordered that a large stone be placed on his chest, and Ummayyah said to him: “This is how you shall remain until you die, or you renege upon your belief in Muhammad, and you worship al-Lat and al-Uzza!” And all Bilal would say whilst he was under such extreme duress was: “ONE! ONE!” It was as if his trials and tribulations would only increase him in his faith. Aboo Bakr then felt an extreme amount of mercy towards him when he saw him one day, in these extreme circumstances. So, he paid his master a price for him and then set him free. He also purchased and set free six other people who were being tortured for their Islam."], "src_en": "https://dorar.net/en/history?page=1"}, {"seq": 5, "stage": 1, "title": "الهِجرةُ الأُولى إلى الحَبشةِ", "date": "رجب 8 ق.هـ، الموافق 615م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["قالتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummsalama\">أمُّ سَلمةَ</span> رضي الله عنها: لمَّا ضاقتْ علينا مكَّة، وأوذِيَ أصحابُ رسولِ الله صلى الله عليه وسلم وفُتنوا، ورَأَوْا ما يُصيبهُم مِنَ البلاءِ والفِتنةِ في دينهِم، وأنَّ رسولَ الله صلى الله عليه وسلم لا يستطيعُ دفعَ ذلك عنهُم، وكان رسولُ الله صلى الله عليه وسلم في مَنَعَةٍ من قومهِ وعمِّه، لا يَصِلُ إليه شيءٌ ممَّا يَكرهُ ممَّا ينالُ أصحابَه، فقال لهم رسولُ الله صلى الله عليه وسلم: إنَّ بأرضِ الحَبشةِ مَلِكًا لا يُظلمُ عنده، فالحقوا ببلادهِ حتَّى يجعلَ الله لكم فَرَجًا ومَخرجًا ممَّا أنتم فيهِ.", "فخرجنا إليها حتَّى اجتمعنا بها، فنزلنا بخيرِ دارٍ إلى خيرِ جارٍ، أَمَّنَّا على ديننا، ولم نخشَ منه ظُلمًا.... وقيل: كان مخرجهُم إلى الحَبشةِ في رجبٍ في السَّنةِ الخامسةِ مِنَ البِعثةِ النَّبويَّةِ. هاجر مِنَ المسلمين فيها اثنا عشرَ رجلًا، وأربعُ نِسوةٍ، منهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> بنُ عفَّانَ، وهو أوَّلُ من خرج ومعه زوجتُه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقيَّةُ</span> بنتُ رسولِ الله صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/17", "route": [[21.4225, 39.8262], [20.83, 39.4], [15.27, 39.66], [14.1211, 38.7234]], "stations": null, "title_en": "The First Migration to Abyssinia", "date_en": "Rajab 8 BH (615 CE)", "place_en": "Makkah", "summary_en": "As persecution grew, the Prophet ﷺ allowed some Companions to migrate to Abyssinia, whose king was known for justice. The first group was twelve men and four women, among them Uthman ibn Affan.", "people": ["uthman", "ummsalama", "ruqayya"], "dorar": 17, "asbab": [], "body_en": ["Umm Salamah, may Allah be well pleased with her, said: “Living in Makkah had become too difficult for us (lit. Makkah became tight for us), and the companions of the Messenger of Allah were constantly being harassed, may Allah be well pleased with all of them, were being tortured, and they contemplated how difficult it was to practice their religion. The Messenger of Allah ﷺ was not able to protect them, but he was being protected by his paternal uncle (Aboo Taalib) and his people, and he was not experiencing the same difficulties that his companions were. The Messenger of Allah ﷺ said to them: ‘verily in Abyssinia is a king who does not oppress anyone; go to him until Allah gives you respite and a way out from the difficulties you are in.’ Thus, a group of them then went to Abyssinia until we all met there, and we found that we had gone from the best of lands to the best of neighbors, he safeguarded our religion (in that land) and we did not fear from him oppression of any sort.”", "It has been said that they made their exit to Abyssinia in the month of Rajab in the fifth year of since the beginning of the Prophet’s mission. In total, 16 Muslims left, 12 men and 4 women; ‘Uthmaan ibn ‘Affaan along with his wife Ruqayyah, the daughter of the Messenger of Allah ﷺ were the first people to immigrate to Abyssinia."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 6, "stage": 1, "title": "إسلام حمزة بن عبد المطلب رَضي اللهُ عنه", "date": "7 ق.هـ، الموافق 615م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["في أواخِرِ السنةِ السَّادسةِ من النُّبوَّةِ أسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةُ</span> بنُ عبد المطلب رَضي اللهُ عنه. وسببُ إسلامِه: أنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبا جَهلٍ</span> مرَّ برسولِ الله صلَّى اللهُ عليه وسلَّم يومًا عند الصَّفا، فآذاه ونال منه، ورسولُ الله صلَّى اللهُ عليه وسلَّم ساكِتٌ لا يُكلِّمُه، ثم ضَرَبه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جَهلٍ</span> بحَجَرٍ في رأسِه فشَجَّه حتى نَزَف منه الدَّمُ، ثم انصَرَف عنه إلى نادي قُرَيشٍ عند الكعبةِ فجَلَس معهم، وكانت مولاةٌ لعَبدِ الله بنِ جُدعانَ في مَسكَنٍ لها على الصَّفا ترى ذلك، وأقبل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةُ</span> من القَنْصِ مُتَوَشِّحًا قَوسَه، فأخبَرَتْه المَولاةُ بما رأتْ من <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبي جَهلٍ</span>، فغَضِب <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةُ</span> وخرَج يسعى، لم يقِفْ لأحدٍ، مُعِدًّا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">لأبي جهلٍ</span> إذا لَقيَه أن يوقِعَ به، فلمَّا دَخَل المسجِدَ قام على رأسِه وقال له: \"تَشتُمُ ابنَ أخي وأنا على دِينِه!\"، ثم ضَرَبه بالقَوسِ فشَجَّه شجَّةً مُنكرةً، فثار رجالٌ من بني مخزومٍ -حيِّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبي جهلٍ</span>- وثار بنو هاشمٍ -حيِّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةَ</span>- فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلٍ</span>: \"دَعوا أبا عِمارةَ! فإنِّي سَبَبتُ ابنَ أخيه سبًّا قبيحًا\".", "وقال ابنُ إسحاقَ: \"ثم رَجَع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةُ</span> إلى بيتِه فأتاه الشَّيطانُ فقال: أنت سيِّدُ قُريشٍ اتبعْتَ هذا الصابِئَ، وتركتَ دينَ آبائك، لَلموتُ خيرٌ لك ممَّا صنعتَ. فأقبلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةُ</span> على نفسِه وقال: \"ما صنعتُ؟! اللَّهمَّ إن كان رُشدًا فاجعَلْ تَصديقَه في قلبي، وإلَّا فاجعَل لي ممَّا وَقعتُ فيه مَخرجًا\"، فبات بلَيلةٍ لم يَبِتْ بِمِثلها مِن وَسوسةِ الشَّيطانِ، حتَّى أصبَحَ فغَدا على رسولِ الله صلَّى اللهُ عليه وسلَّم، فقال: \"يا بن أخي، إنِّي قد وَقعتُ في أمرٍ ولا أعرِفُ المَخرجَ منه، وإقامةُ مِثلي على ما لا أدري ما هو، أرُشْدٌ أم هو غَيٌّ شَديدٌ؟ فحدِّثني حديثًا؛ فقدِ اشتَهيتُ يا بنَ أخي أن تُحدِّثَني، فأقبل رسولُ الله صلَّى اللهُ عليه وسلَّم فذكَّره ووَعَظه، وخوَّفَه وبَشَّرَه، فألقَى اللهُ في قلبِه الإيمانَ بما قال رسولُ الله صلَّى اللهُ عليه وسلَّم.", "فقال: \"أشهَدُ أنَّك الصَّادِقُ شهادةَ الصِّدقِ، فأظهِرْ يا بن أخي دينَكَ، فواللهِ ما أُحِبُّ أنَّ لي ما أظلَّتْه السماءُ وأنِّي على ديني الأوَّلِ\"؛ فكان إسلامُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةَ</span> رَضي اللهُ عنه أوَّلَ الأمرِ أنَفةَ رجلٍ أبَى أن يُهانَ مَولاهُ، ثم شَرَح اللهُ صدرَهُ، فاسْتمَسْكَ بالعُروةِ الوُثقى، واعتَزَّ به المُسلِمون أيَّما اعتِزازٍ!"], "url": "https://dorar.net/history/event/18", "route": null, "stations": null, "title_en": "Hamza ibn ‘Abdul-Muttalib Accepts Islam, May Allah Be Well Pleased with Him.", "date_en": "7 BH (615 CE)", "place_en": "Makkah", "summary_en": "Hamzah, the Prophet's ﷺ uncle, accepted Islam after Abu Jahl insulted and harmed the Prophet ﷺ near al-Safa. His conversion gave the Muslims strength.", "people": ["hamza", "abujahl"], "dorar": 18, "asbab": [], "body_en": ["Towards the end of the 6th year since the beginning of the Prophet’s mission, Hamzah ibn Abdul-Mutallab (may Allah be pleased with him) accepted Islam. He did so because Aboo Jahl had passed by the Messenger of Allah ﷺ and had insulted in him while he was sitting by as-Safaa, and the Messenger of Allah ﷺ remained silent and did not respond. Then Aboo Jahl struck him on the head with a rock, causing him to bleed. Aboo Jahl then left and went to sit at the gathering place of Quraysh near the Ka’bah. The bondswoman of Abdullah ibn Jud’aan who lived by as-Safaa had seen everything.", "Hamzah was returning from the hunting grounds, wearing his bow when the bondswoman informed him of what had happened and what Aboo Jahl had done. He then became very angry and left running, not stopping for anyone, promising that if he met Aboo Jahl that he would assail him. When he finally arrived at the Ka’bah, he stood over Aboo Jahl and said to him: “You filthy low-life! (lit. oh you who’s anus whistles with the sound of farting!) You dare insult my nephew while I am upon his religion!” He then struck him with his bow and gave him a nasty gash on his head.", "Then some men from Banoo Makhzoom- representing Aboo Jahl -and some men from Banoo Haashim representing Hamzah- rushed each other, but Aboo Jahl then said: “Leave Aboo Imaarah (Hamzah)! For verily I insulted his nephew in a most heinous way.” Ibn Ishaaq reported: “Then Hamzah went back to his quarters where Satan whispered to him: “you are the master of Quraysh, and you dare to follow that juvenile and leave the religion of your fathers; verily death seems better for you than what you have done.” Then Hamzah blamed himself and said: “What have I done? Oh Allah! If what I have done is correct then make my heart at peace with it, and if not then find me a way out.” He then spent the night in agony amongst satanic misgivings, and when he woke-up, he made his way to the Messenger of Allah ﷺ and said to him: “Oh nephew! Verily I have fallen into a situation which I know not how to get myself out of and have stood my ground upon something which I do not fully understand.", "Have I acted correctly or was extreme error? Answer me and tell me something, for verily I have longed that you speak to me, oh nephew.” The Messenger of Allah ﷺ then drew close to him, reminded him, and entreated him to what was right, he gave him glad tidings and put fear into his heart (about following polytheism), until Allah placed faith in Hamzah’s heart through the words of the Prophet, ﷺ. Hamzah then said: I bear witness that you are Truthful and that you bear a true declaration. Go, my nephew, and expound your religion out in the open.", "For by Allah, I would not wish that the sky continues to shade while I am still upon my previous religion.” Hamzah’s acceptance of Islam began with him refusing to show contempt for his master. And the Muslims have since prided themselves through the Islam of Hamzah, may Allah be well pleased with him."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 7, "stage": 1, "title": "الهِجرةُ الثَّانيةُ إلى الحَبشةِ", "date": "7 ق.هـ، الموافق 615م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["بلغ المهاجرين في الحَبشةِ أنَّ قُريشًا قد أسلمتْ، فرجعوا إلى مكَّة في شوَّالٍ من نفسِ السَّنةِ التي هاجروا فيها، فلمَّا كانوا دون مكَّة ساعةً من نهارٍ وعرفوا جلية الأمرِ رجع منهم مَنْ رجع إلى الحَبشةِ، ولم يدخلْ في مكَّة مِن سائرهِم أحدٌ إلَّا مُستخفِيًا، أو في جِوارِ رجلٍ من قُريشٍ‏.‏ ثم اشتدَّ عليهِم وعلى المسلمين البلاءُ والعذابُ من قُريشٍ، وسَطَتْ بهِم عشائرُهُم، فقد كان صعبًا على قُريشٍ ما بلغها عَنِ النَّجاشيِّ من حُسنِ الجِوارِ، ولم يرَ رسولُ الله صلى الله عليه وسلم بُدًّا من أن يُشيرَ على أصحابهِ بالهجرةِ إلى الحَبشةِ مَرَّةً أُخرى‏.‏ واستعدَّ المسلمون للهجرةِ مَرَّةً أُخرى، حاولتْ قُريشٌ إحباطَ عمليَّةِ الهجرةِ الثَّانيةِ بَيْدَ أنَّ المسلمين كانوا أسرعَ، فانحازوا إلى نَجاشيِّ الحَبشةِ قبلَ أن يُدركوا‏.‏ هاجر مِنَ الرِّجالِ ثلاثةٌ وثمانون رجلًا، وثماني عشرةَ أو تسعَ عشرةَ امرأةً.", "فأرسلتْ قُريشٌ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span>، وعبدَ الله بنَ أبي رَبيعةَ قبلَ أن يُسلِما، وأرسلوا معهُما الهدايا المُستطرَفةَ للنَّجاشيِّ ولبَطارِقتِهِ، وبعد أن حضرا إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيِّ</span> قدَّما له الهدايا، ثمَّ كلَّماهُ فقالا له‏:‏ أيُّها الملكُ، إنَّه قد ضَوَى إلى بلدِك غِلمانٌ سُفهاءُ، فارقوا دينَ قومهِم، ولم يدخلوا في دينِك، وجاءوا بدينٍ ابتدعوه، لا نعرفُه نحن ولا أنت، وقد بعثَنا إليك فيهِم أشرافُ قومهِم من آبائهِم وأعمامهِم وعشائرهِم؛ لِتردَّهُم إليهِم، فَهُمْ أعلى بهِم عينًا، وأعلمُ بما عابوا عليهِم.", "وعاتبوهُم فيهِ،‏ وقالت البَطارِقةُ‏:‏ صَدقا أيُّها الملكُ، فأسلِمْهُم إليهِما، فليردَّاهُم إلى قومهِم وبلادهِم‏.‏ فأرسل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ</span> إلى المسلمين، ودعاهُم، فحضروا، وكانوا قد أجمعوا على الصِّدقِ كائنًا ما كان،‏ فقال لهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ‏</span>:‏ ما هذا الدِّينُ الذي فارقتُم فيه قومَكُم، ولم تدخلوا به في ديني ولا دينِ أحدٍ من هذه المِلَلِ ‏؟‏ قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جعفرُ</span> بنُ أبي طالبٍ -وكان هو المُتكلِّمُ عَنِ المسلمين‏:‏ أيُّها الملكُ، كُنَّا قومًا أهلَ جاهليَّةٍ؛ نعبدُ الأصنامَ، ونأكلُ المَيتةَ، ونأتي الفواحشَ، ونقطعُ الأرحامَ، ونُسِئُ الجِوارَ، ويأكلُ مِنَّا القويُّ الضَّعيفَ، وعدَّد له مَحاسنَ ما جاءهُم به صلى الله عليه وسلم، ثمَّ قال: فصدَّقناهُ، وآمنَّا بهِ، واتَّبعناهُ على ما جاءنا بهِ من دينِ الله، فعبدنا الله وحدَه، فلم نُشركْ به شيئًا، وحرَّمنا ما حُرِّمَ علينا، وأحللنا ما أحلَّ لنا، فعدا علينا قومُنا، فعذَّبونا وفَتنونا عن ديننا؛ لِيردُّونا إلى عِبادةِ الأوثانِ من عِبادةِ الله تعالى، وأن نَستحِلَّ ما كُنَّا نَستحِلُّ مِنَ الخبائثِ، فلمَّا قَهرونا وظَلمونا وضيَّقوا علينا، وحالوا بيننا وبين ديننا خرجنا إلى بلادِك، واخترناك على مَنْ سِواكَ، ورغِبنا في جِوارِك، ورَجوْنا ألَّا نُظْلَمَ عندك أيُّها الملكُ‏.‏ فقال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ‏</span>:‏ هل معك ممَّا جاء به عن الله من شيءٍ‏؟‏ فقال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جعفرٌ‏</span>:‏ نعم‏.‏ فقال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ‏</span>:‏ فاقْرأْهُ عليَّ، فقرأ عَليهِ صدرًا من: (سورة مريم) فبكى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ</span> حتَّى اخْضَلَّتْ لِحيتُه، وبكتْ أساقِفتُه حتَّى أخْضَلُوا مصاحِفَهُم حين سمِعوا ما تلا عليهِم، ثمَّ قال لهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ‏</span>:‏ إنَّ هذا والذي جاء به عيسى لَيخرجُ من مِشكاةٍ واحدةٍ، انطلقا، فلا والله لا أُسلِمُهُم إليكُما، ولا يُكادونَ -يُخاطِبُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> وصاحبَه- فخرجا، فلمَّا خرجا قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرُو بنُ العاصِ</span> لعبدِ الله بنِ أبي رَبيعةَ‏:‏ والله لآتينَّهُ غدًا عنهُم بما أَسْتَأْصِلُ به خَضراءَهُم‏.‏ فقال له عبدُ الله بنُ أبي رَبيعةَ‏:‏ لا تفعلْ، فإنَّ لهم أرحامًا، وإنْ كانوا قد خالفونا.", "ولكنْ أصرَّ عَمرٌو على رأيِهِ‏.‏ فلمَّا كان الغدُ قال للنَّجاشيِّ‏:‏ أيُّها الملكُ، إنَّهم يقولون في عيسى ابنِ مريمَ قولًا عظيمًا، فأرسل إليهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ</span> يسألهُم عن قولِهم في المَسيحِ ففَزِعوا، ولكنْ أجمعوا على الصِّدقِ، كائنًا ما كان، فلمَّا دخلوا عَليهِ وسألهم، قال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جعفرٌ‏</span>:‏ نقولُ فيه الذي جاءنا به نبيُّنا صلى الله عليه وسلم‏:‏ هو عبدُ الله ورسولُه ورُوحهُ وكَلِمتُه ألقاها إلى مريمَ العذراءِ البَتُولِ‏.‏ فأخذ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ</span> عودًا مِنَ الأرضِ ثمَّ قال‏:‏ والله ما عَدا عيسى ابنُ مريمَ ما قلتَ هذا العودَ.", "فتَناخَرتْ بَطارِقتُه، فقال‏:‏ وإنْ نَخَرْتُم ‏.‏ ثمَّ قال للمسلمين‏:‏ اذهبوا فأنتم شُيُومٌ بأرضي -والشُّيومُ‏:‏ الآمِنونَ بلسانِ الحَبشةِ- مَنْ سَبَّكم غَرِم، مَنْ سَبَّكم غَرِم، مَنْ سَبَّكم غَرِم، ما أُحِبُّ أنَّ لي دَبْرًا من ذهبٍ وإنِّي آذيتُ رجلًا منكُم -والدَّبْرُ‏:‏ الجبلُ بلسانِ الحَبشةِ-‏ ثمَّ قال لِحاشِيَتِهِ‏:‏ رُدُّوا عليهِما هَداياهُما فلا حاجةَ لي بها، فوالله ما أخذَ الله مِنِّـي الرِّشـوةَ حين رَدَّ عليَّ مُلكي، فآخذُ الرِّشـوةَ فيــه، وما أطاع النَّاسَ فِيَّ فأُطيعَـهُم فيهِ‏.‏ قالتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummsalama\">أمُّ سَلمةَ</span>: فخرجا من عندِه مَقبوحينَ مَردودًا عليهِما ما جاءا بهِ، وأقمنا عندهُ بخيرِ دارٍ مع خيرِ جارٍ‏.‏"], "url": "https://dorar.net/history/event/19", "route": null, "stations": null, "title_en": "The Second Migration to Abyssinia.", "date_en": "7 BH (615 CE)", "place_en": "Makkah", "summary_en": "Hearing a false report that Quraysh had accepted Islam, the emigrants returned from Abyssinia, then many went back. In the second migration 83 men and 18 or 19 women left, and the Negus refused Quraysh's demand to hand them over.", "people": ["najashi", "jafar", "amr", "ummsalama"], "dorar": 19, "asbab": [], "body_en": ["It had reached the migrants to Abyssinia that Quraysh had entered Islam, thus, they returned to Makkah in the month of Shawwal of that same year they had left. However, when they were within a day travel away from Makkah, they realized how grave the situation truly was! Accordingly, some of them returned to Abyssinia, while others entered in secret or entered under the protection of someone else from Quraysh. Trials and tribulations only became worse for them and the other Muslims at the hands of Quraysh, and their tribes gave up on them and oppressed them.", "It was very difficult for Quraysh to hear that the Najaashi was a very gracious host for the refugees. The Messenger of Allah ﷺ then saw it as incumbent that he council his Companions to migrate to Abyssinia once again; and the Muslims got ready to do so. Quraysh tried to stop their attempts at leaving a second time, but the Muslims were much quicker than them. They managed to reach the lands of Abyssinia and the Najaashi before they caught up with them. Amongst those who migrated, 83 were men, and 18 or 19 were women.", "In response, Quraysh dispatched ‘Amr ibn al-‘Aas and Abdullah ibn Rabee’ah before they had accepted Islam, in hopes that they could bring them back. They also sent with them sumptuous gifts for the Najaashi and the members of his clergy. When they appeared before the Najaashi they gave him the gifts and then said to him: “Esteemed king, there have come to your lands, lowly slaves, they have forsaken the religion of their peoples and they have not entered into your religion, rather they have come with a religion that they have innovated themselves, which neither we nor you know anything about. The nobles, fathers, uncles, and families of our peoples have sent us to them in order to bring them back. For they are more watchful over them and are more knowledgeable regarding what wrongs they have committed and have more right to admonish them.”", "The Najaashi’s clergymen then said: “O King! They have told the truth. Deliver those people to them and they will take them back to their families and their lands.” The Najaashi then had the Muslims sent for and brought before him, who had all agreed to speak the truth no matter what was to happen. The Najaashi then said to them: “What is this religion which has caused you to leave your people? And why do not accept my religion or any other religion for that matter? Ja’faar ibn Abee Taalib, who was the representative of the Muslims then answered: “Oh king, we were a people stuck in ignorant ways, we worshiped idols, and ate carrion, and committed all sorts of enormities; we cut off family ties, and we were bad to our neighbors, and the strong preyed on the weak.” He then proceeded to enumerate all of the good things which the Prophet had brought to them, ﷺ. Then he added: “so we have deemed what he says to be the truth and we have believed in the message he has brought, and we have followed him regarding what he has brought of the religion of Allah.", "So now, we only worship Allah and we do not associate partners with Him in anything, we have forbidden for ourselves that He has forbidden, and we enjoy that which He has made permissible. Our peoples then made themselves enemies to us, they tortured and tormented us because of our religion so that they may try and return us to the worship of idols; or that we may return to committing the enormities and sins we used to commit. When they had oppressed and repressed us and made our life difficult and tried to come between us and our religion, we came to your land and chose you over others, longing to be by your side, and hoping to never be oppressed here, O king.”", "Al-Najaashi then said: “Do you have anything with you that which has come to you regarding Allah?” Ja’faar then responded: “Yes,” and he then proceeded to recite ayaat from Surat Maryam. Then al-Najaashi wept until his beard became soaked, and his scroll-bearers also wept until they had soaked the scrolls they were carrying when they heard what was being recited. Najaashi then said to them: “Verily, there is no difference between this and what Jesus has brought; it has come from the same source. Go! By Allah, I shall never hand them over to you two or allow anyone to harm them. ‘Amr ibn al-‘Aas and his friend could not believe what they were hearing, and they began to leave. ‘Amr ibn al-Aas then said to Abdullah ibn Abee Rabee’ah: I swear by Allah that I shall come back tomorrow with what shall uproot them!”", "‘Abdullah responded: “No, do not do that, for they still have a sanctity despite the fact that they’ve opposed our ways.” But ‘‘Amr ibn al-‘Aas insisted, and the next day he came to the Najaashi and said to him: “Oh King! These people believe something regarding Jesus, the son of Maryam something which shall dismay you!” The Najaashi then had them sent for and asked them to explain themselves regarding what they believe regarding the Messiah!” So, the Najaashi had them sent for and asking that they tell him about their belief regarding the Messiah; they were all terrified, but they had all agreed that they would tell the truth no matter what happened as a consequence.", "When they were finally brought before him and he asked them, Ja’faar responded: “We say regarding him that which our Prophet ﷺ has brought to us that he is a Servant of Allah and His Messenger, His spirit and His word, which He breathed into the womb of Maryam the Virgin Maiden.” The Najaashi then took a stick, drew a line across the floor, and said: “By Allah Jesus, the son of Maryam is nothing beyond this line which you have mentioned.” His clergymen then all snorted, and the Najaashi then said: “Even if you disagree!”", "And he said to the Muslims: “Go. For you are safe in my lands”. “Whosoever insults you has sinned, whosoever insults you has sinned, whosoever insults you has sinned; I would hate that I had a mountain of gold and that I have annoyed or caused harm to a single one of you.” Then he said to his courtiers: “Give them back their gifts I have no need for them! For by Allah, Allah never took a bribe from me when He returned to me my kingdom, so why should I ever take one now?! Whatever people obey me in, I shall obey them (i.e., and protect them). Umm Salamah then said: “the two-‘‘Amr and Abdullah-left the presence of the king denigrated and rejected; and we stayed with the king, the best of neighbors in the best of abodes.”"], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 8, "stage": 1, "title": "إِسلامُ عُمَرَ رضِي الله عنهُ", "date": "ذي الحجة 7 ق.هـ، الموافق 616م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["أخرج الترمذي في سننه عن عبدالله بن عمر رضي الله عنهما أنَّ رسول الله صلى الله عليه وسلم قال: ((اللهم أَعِزَّ الإسلامَ بأَحَبِّ هذين الرجُلَيْنِ إليك <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">بأبي جهلٍ</span> أو <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">بعمرَ</span> بنِ الخطابِ قال وكان أَحَبَّهُما إليه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عمرُ</span> )) وروى أهل السِّير أنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عمر</span> خرج يومًا مُتوشِّحًا سَيفَهُ يُريدُ القضاءَ على النَّبيِّ صلى الله عليه وسلم، فلقِيهُ رجلٌ فقال: أين تعمدُ يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>؟ قال: أريدُ أنْ أقتُلَ محمَّدًا.", "قال: كيف تأمنُ من بني هاشمٍ ومن بني زُهرةَ وقد قتلتَ محمَّدًا؟ فقال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>: ما أراك إلَّا قد صَبَوْتَ، وتركتَ دينَك الذي كنتَ عَليهِ، قال: أفلا أدُلُّك على العَجَبِ يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>? إنَّ أُختَك وخَتَنَكَ قد صَبَوَا، وتركا دينَك الذي أنت عَليهِ، فمشى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> إليهِما، وعندهُما خَبَّابُ بنُ الأَرَتِّ، معه صَحيفةٌ فيها: سُورةُ <span class=\"ref\">[طه]</span> يُقرِئهُما إيَّاها، فلمَّا سمِع خَبَّابٌ حِسَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> تَوارى في البيتِ، وسَترتْ فاطمةُ أُختُ عُمَرَ الصَّحيفةَ، وكان قد سمِع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> حين دنا مِنَ البيتِ قِراءةَ خَبَّابٍ إليهِما، فلمَّا دخل عليهِما قال: ما هذه الهَيْنَمَةُ التي سمعتُها عندكُم؟ فقالا: ما عَدا حديثًا تحدَّثناهُ بيننا.", "قال: فلَعلَّكُما قد صَبَوْتُما, فقال له خَتَنُهُ: يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>، أرأيتَ إنْ كان الحقُّ في غيرِ دينِك؟ فوثبَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> على خَتَنِهِ فَوَطِئَهُ وَطْئًا شَديدًا, فجاءتْ أختُه فرفعتْهُ عن زَوجِها، فَنَفَحَها نَفْحَةً بيدِه، فَدَمَّى وجهَها، فقالتْ، وهي غَضبى: يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>، إنْ كان الحقُّ في غيرِ دينِك، أشهدُ أنْ لا إلَه إلَّا الله، وأشهدُ أنَّ محمَّدًا رسولُ الله.", "فلمَّا يَئِسَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span>، ورَأى ما بِأُختِه مِنَ الدَّمِ نَدِمَ واستَحْيا، وقال: أَعْطوني هذا الكتابَ الذي عندكُم فأَقرؤهُ، فقالتْ أختُه: إنَّك رِجْسٌ، ولا يَمَسُّهُ إلَّا المُطهَّرون، فقُمْ فاغْتسِلْ، فقام فاغتسَلَ، ثمَّ أخذَ الكتابَ، فقرأَ: بسم الله الرحمن الرحيم فقال: أسماءُ طَيِّبَةٌ طاهرةٌ.", "ثمَّ قرأَ <span class=\"ref\">[طه]</span> حتَّى انتهى إلى قولِه: (إِنَّنِي أَنَا اللَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي) فقال: ما أحسَنَ هذا الكلامَ وأَكرمَه! دِلُّوني على محمَّدٍ. فأتى النَّبيَّ صلى الله عليه وسلم فأَسلمَ عندَه، ثمَّ خرج المسلمون معهُ في صَفَّيْنِ حتَّى دخلوا المسجدَ، فلمَّا رأتهُم قُريشٌ أصابتْها كآبةٌ لم تُصبْها مِثلُها."], "url": "https://dorar.net/history/event/20", "route": null, "stations": null, "title_en": "‘Umar ibn al-Khattaab (May Allah Be Well Pleased with Him) Accepts Islam", "date_en": "Dhu al-Hijjah 7 BH (616 CE)", "place_en": "Makkah", "summary_en": "The Prophet ﷺ prayed that Allah strengthen Islam through Umar ibn al-Khattab or Abu Jahl. Umar set out in anger, but after reading verses of the Quran at his sister's house he went to the Prophet ﷺ and accepted Islam.", "people": ["umar", "abujahl"], "dorar": 20, "asbab": [], "body_en": ["One day, Umar ibn al-Khattaab went out wearing his sword intending to kill the Prophet ﷺ. A man met him on the way and said to him: “Where are you going, Umar?” He responded: “I want to kill Muhammad!” The man then said to him: “How would you protect yourself from Banoo Haashim and Banoo Zuhrah after you had killed Muhammad?” Umar then retorted: “I see that you have inclined (towards Muhammad) and have left your religion!” The man then responded again: “O Umar! Shall I not direct you towards what is truly incredible? Your sister and brother-in-law have both embraced Islam and have left the religion that you are upon.”", "Umar then marched over to them, and with them was Khabbaab ibn al-Art, who was holding a page which contained Surah Ta Ha and was reading it to them. When Khabbaab heard the faint sound of Umar, he quickly hid in the house, while Faatimah - Umar’s sister - hid the page that Khabbab was reading from. Umar had heard Khabbaab reading when he had approached his sister’s house, and when he entered the house, he said: “What was that murmuring I heard here?” His sister and her husband responded: “We were speaking to each other.”", "Umar then said: “I heard that you had both converted to Islam” to which his brother-in-law responded: “Oh Umar! Have you ever considered that the truth be elsewhere than in your religion?” Umar then attacked him and dealt him a vicious blow; then his sister got him off her husband at which point Umar slapped her which bloodied her face. (Faatimah) then yelled out angrily: “The truth is in other than your religion! I bear witness that there is no god worthy of worship except Allah, and I bear witness that Muhammad is the Messenger of Allah!”", "Then Umar began to feel despair (at what he had done) and saw that he had hurt his sister to the point of bleeding, he became regretful and ashamed. He then said: “Bring me that piece of writing you were reading from so that I may read it” His sister then yelled at him: “You are filthy! Only those who are pure can touch it! Go and wash.” Umar then went and did just that, then he took the piece of parchment and read: “By the Name of Allah the Most Gracious, the Most Merciful” upon which he commented by saying: such good and immaculate names!”", "Then he continued to read: {Taha…” Until he had read where Allah has said: “Verily I am Allah! There is no god other than Me! So worship Me (alone) an
