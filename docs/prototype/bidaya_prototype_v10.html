 تُنظِرونِ، فَوَالَّذي نَفسي بيَدِه لو قلتُم بأجمَعِكُم ما قالَت لضَرَبتُكُم بسَيفي هذا حتَّى أموتَ أو أقتُلَكُم\". فيومَئذٍ ظَهَر الإسلامُ في بني خَطْمةَ، وكان يَستخفي بإسلامِه فيهم مَن أسلَمَ، فكان أولُ مَن أسلَمَ مِن بني خَطْمةَ عُمَيرَ بنَ عَديٍّ، وهو الذي يُدعَى القارِئَ."], "url": "https://dorar.net/history/event/58", "route": null, "stations": null, "title_en": "Sending ‘Umayr ibn ‘Adyy al-Khatmee (May Allah Be Pleased with Him) to ‘Asmaa’ bint Marwaan from the Tribe of ‘Umayyah ibn Zayd.", "date_en": "Ramadan 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "Asma bint Marwan, who mocked Islam and incited people against the Prophet ﷺ, was killed. Many hadith scholars consider the chain of this report weak.", "people": [], "dorar": 58, "asbab": [], "body_en": ["‘Asmaa’ bint Marwaan from the tribe of ‘Umayyah ibn Zayd and the wife of Yazeed ibn Zayd ibn Hisn al-Khatmee was known for insulting Islam and abusing the Messenger of Allah ﷺ and encouraging people to fight him and throwing menstrual blood in the Mosque of Banee Khatmah. For all these reasons, the Prophet ﷺ declared her blood lawful to shed. ‘Umayr ibn ‘Adyy vowed that if he is meant to return alive to al-Madeenah from the Battle of Badr, he will kill her, and so he did (may Allah be pleased with him). After, he (may Allah be pleased with him), he found her sons burying her, so they asked him: O Umayr, is it you who killed her?", "He responded, yes it was me! So, plot against me, all of you, and give me no respite. By the One in whose Hand is my soul, if all of you said what she said, I would strike you with my sword until I either die or I kill all of you!” On that day, Islam manifested in the tribe of Banee Khatmah because before that day, those who embraced Islam among them used to hide their Islam. The first person who embraced Islam from them was ‘Umar ibn ‘Adyy who was also known as the Reciter."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 47, "stage": 5, "title": "غَزوةُ بدرٍ (الكُبرى) وانْتصارُ المُسلمين", "date": "رمضان 2 هـ، الموافق 624م", "place": "بدر", "lat": 23.78, "lng": 38.79, "approx": false, "zoom": 8, "paras": ["ندَب رسولُ الله صلى الله عليه وسلم نَفرًا مِنَ المسلمين لاعتراضِ قافلةِ قُريشٍ القادمةِ مِنَ الشَّامِ التي كان يرأَسُها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> الذي عَلِمَ بعدَ ذلك بِخُروجِ المُسلمين، فأَرسل إلى قُريشٍ يَسْتَنْفِرُها لاسْتِنقاذِ تِجارتِهم كما غَيَّرَ طريقَهُ لإنقاذِ التِّجارةِ، ثمَّ الْتَقى المسلمون والمشركون عند ماءِ بدرٍ، وهي مكانٌ بين مكَّةَ والمدينةِ وهو أَقربُ إليها مِن مكَّةَ، وكان عددُ المشركين يُقارِبُ الألفَ، وعددُ المسلمين أَكثرُ مِن ثلاثمائةٍ، وبدأتِ المعركةُ بالمُبارزَةِ المَشهورةِ، ثمَّ بدأ القِتالُ وكان شديدًا، وقُتِلَ فيها صَناديدُ قُريشٍ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">كأبي جهلٍ</span>، وأُميَّةَ بنِ خَلفٍ، وغَيرِهِما، حتَّى بلَغ قَتلاهُم سبعون رجلًا ومِثلُهم مِنَ الأَسرى، وقُتِلَ أربعةَ عشرَ مِنَ المسلمين، وقِيلَ: سِتَّةَ عشرَ.", "فكان النَّصرُ الكبيرُ حَليفَ المسلمين. حيث نَصرهُم الله تعالى وأَرسل ملائكةً تُقاتلُ معهم، أمَّا الأَسرى فأشار <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> بِقتلِهم، وأشار <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> بِفِدائِهم، فأخذ النَّبيُّ صلى الله عليه وسلم برأيِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبي بكرٍ</span>، ولكنَّ الوَحيَ نزل مُوافقًا لرأيِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span>، أمَّا الغَنائمُ فنزلت فيها سورةُ الأَنفالِ."], "url": "https://dorar.net/history/event/59", "route": [[24.4672, 39.6111], [24.2, 39.3], [23.78, 38.79]], "stations": null, "title_en": "The Great Battle of Badr (The Victory of Muslims)", "date_en": "Ramadan 2 AH (624 CE)", "place_en": "Badr", "summary_en": "The Muslims set out to intercept a Quraysh caravan led by Abu Sufyan. It escaped, and Quraysh marched out with nearly a thousand men. Just over three hundred Muslims met them at Badr and won a decisive victory.", "people": ["abubakr", "umar", "abusufyan", "abujahl"], "dorar": 59, "asbab": [{"id": "TAF-13", "k": "d"}, {"id": "ASB-026", "k": "d"}, {"id": "ASB-027", "k": "d"}, {"id": "ASB-029", "k": "d"}, {"id": "ASB-030", "k": "d"}, {"id": "TAF-10", "k": "d"}, {"id": "TAF-12", "k": "d"}, {"id": "TAF-11", "k": "a"}], "body_en": ["The Prophet ﷺ dispatched a group from the Muslims to intercept a merchandise-caravan that belonged to Quraysh, while it was on its way back from Al-Shaam. Aboo Sufyaan, however, who was the leader of that caravan, came to know about the intention of the Muslims, so he sent to Quraysh asking them to save his trade and fight the Muslims, and he changed his route to save his caravan. After, the Muslims encountered the disbelievers at the well of Badr, which is located in an area between Makkah and al-Madeenah – though closer to al-Madeenah.", "The army of disbelievers consisted of about one thousand fighters whereas the army of Muslims was slightly more than three hundred fighters. The battle started with a duel, man to man, sword against sword; then the two armies engaged. The fighting was intense, during which the chiefs of Quraysh were killed like Abu Jahl, ‘Umayyah ibn Khalaf, and others. The total of casualties among the disbelievers reached one hundred and forty men, half of them were killed and the other half was captured as prisoners. As for the Muslims, fourteen men were killed, and it has been said: they were sixteen.", "On that day, it was a great victory for the Muslims whom Allah aided with angels to fight along with them. The opinion of ‘Umar regarding the prisoners was to kill them while Aboo Bakr suggested their release on the condition of ransom. The Prophet ﷺ favoured the view of Aboo Bakr, but the revelation agreed with the opinion of ‘Umar. As for the war-bounty, the instructions on how to divide them were revealed in Surah al-Anfaal."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 48, "stage": 5, "title": "وفاةُ رُقَيَّةَ رضِي الله عنها", "date": "رمضان 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["هي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقَيَّةُ</span> بنتُ سَيِّدِ البَشرِ صلَّى الله عليه وسلَّم، وهي زوجُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> بنِ عفَّانَ رضِي الله عنهما، وكانت <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقَيَّةُ</span> أوَّلًا عند عُتْبَةَ بنِ أبي لَهبٍ، فلمَّا بُعِثَ النَّبيُّ صلَّى الله عليه وسلَّم أَمَرَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abulahab\">أبو لَهبٍ</span> ابنَهُ بِطلاقِها، فتَزوَّجها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> وهاجر بها إلى الحَبشةِ.", "ولمَّا نَدَبَ رسولُ الله النَّاسَ للخُروجِ لاعتراضِ قافلةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبي سُفيانَ</span> أَمَرَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> أن يَبقى عند <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقَيَّةَ</span> يُمَرِّضُها ويَعتَني بها، وكان هذا هو سببُ تَخَلُّفِهِ، وقد أَسهمَ له النَّبيُّ صلى الله عليه وسلم كما أَسهمَ لمن حضَر بدرًا، ثم ما لَبِثَتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقَيَّةُ</span> في مَرضِها حتَّى تُوفِّيتْ رضي الله عنها."], "url": "https://dorar.net/history/event/60", "route": null, "stations": null, "title_en": "The Death of Ruqayyah (May Allah Be Pleased with Her).", "date_en": "Ramadan 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "Ruqayyah, the Prophet's ﷺ daughter and the wife of Uthman ibn Affan, died in Madinah while the Muslims were at Badr; Uthman had stayed behind to nurse her.", "people": ["ruqayya", "uthman", "abusufyan", "abulahab"], "dorar": 60, "asbab": [], "body_en": ["She is Ruqayyah, the daughter of the Master of mankind ﷺ and the wife of ‘Uthmaan ibn ‘Affaan (may Allah be pleased with him and her). She was first married to ‘Utbah ibn Abee Lahab, but after the Prophet ﷺ received revelation and was sent to the people as Allah’s Messenger, Aboo Lahab ordered his son to divorce her. After, ‘Uthmaan married her and immigrated with her to Abyssinia. When the Prophet ﷺ dispatched a mission to intercept the merchandise-caravan of Aboo Sufyaan, he ﷺ ordered ‘Uthmaan to stay with Ruqayyah to look after her as she was sick, and that was the reason he did not participate in the battle.", "The Prophet ﷺ treated him like those who attended the battle and allocated for him a share from the war bounties. It was not that long until she passed away (may Allah be pleased with her)."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 49, "stage": 5, "title": "سرية سالم بن عمير رضي الله تعالى عنه إلى أبي عفك اليهودي", "date": "شوال 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كانت سريَّةُ سالِمِ بنِ عُمَيرٍ رَضي اللهُ عنه إلى أبي عَفَكٍ اليَهوديِّ في شوَّالٍ على رأسِ عشرين شهرًا من مُهاجَرِ رسولِ الله صلَّى اللهُ عليه وسلَّم، وكان أبو عَفَكٍ من بني عمرِو بن عوفٍ شَيخاً كبيرًا قد بلغ عشرين ومئةَ سنةٍ، وكان يَهوديًّا، عَظيمَ الكُفرِ، شديدَ الطَّعنِ على المسلمين، قد امتَلَأ قلبُه بالحقدِ والحسدِ للمسلمين، وهو يرى الْتِفافَ الأوسِ والخزرجِ على نُصرةِ رسولِ الله صلَّى اللهُ عليه وسلَّم، وازدادَ كيدُه بالإسلامِ وأهلِهِ بعد أنْ رَأى رسولَ الله صلَّى اللهُ عليه وسلَّم يزداد قوَّةً وتَمكينًا في المدينةِ وما حولَها بعد غزوةِ بدرٍ، فلم يُطِقْ لذلك صَبرًا، فأخذ يُنشِدُ الشِّعرَ يَهجو به رسولَ الله صلَّى اللهُ عليه وسلَّم ويُحرِّضُ على عداوَتِه، ويُسَفِّهُ رأيَ الأنصارِ لمُتابَعَتِهم رسولَ الله صلَّى اللهُ عليه وسلَّم ومُناصَرَتِه.", "فقال سالِمُ بنُ عُمَيرٍ وهو أحدُ البَكَّائين -أي: في غَزوةِ تَبوكَ- ومِمَّن شَهِد بَدرًا: \"عليَّ نَذرٌ أن أقتُلَ أبا عَفَكٍ أو أموتَ دُونَه\"، فأمهَلَ يَطلُبُ له غِرَّةً، حتى كانت ليلةٌ صائِفةٌ، فنام أبو عَفَكٍ بالفِناءِ، وسَمِعَ به سالِمُ بنُ عُميرٍ، فأقبَلَ فوَضَعَ السَّيفَ على كَبِدِه، ثم اعتَمَدَ عليه حتى خَشَّ في الفراشِ، وصاح عدوُّ اللهِ، فثاب إليه ناسٌ مِمَّن هم على قَولِه، فأدخَلوه منزلَه وقَبَروه.", "وكان أبو عَفَكٍ مِمَّن نَجَم نِفاقُه حين قَتَلَ رسولُ الله صلَّى اللهُ عليه وسلَّم الحارِثَ بنُ سُويدِ بنِ الصَّامِتِ، وشَهِدَ سالِمٌ بَدرًا، وأُحدًا، والخَندَقَ، والمَشاهِدَ كُلَّها مع رسول الله صلَّى اللهُ عليه وسلَّم، وتوُفِّي في خِلافةِ مُعاويةَ بن أبي سُفيانَ رَضي اللهُ عنهما."], "url": "https://dorar.net/history/event/61", "route": null, "stations": null, "title_en": "Dispatching the Expedition of Saalim ibn ‘Amr (May Allah Be Pleased with Him) to ‘Aboo ‘Afak, the Jew", "date_en": "Shawwal 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "Salim ibn Umayr was sent against Abu Afak, an old man who incited against the Prophet ﷺ in verse. Many hadith scholars consider the chain of this report weak.", "people": [], "dorar": 61, "asbab": [], "body_en": ["The expedition of Saalim ibn ‘Amr (may Allah be pleased with him) to ‘Aboo ‘Afak, the Jew was sent out in the beginning of Shawwaal after 20 months from the emigration of the Prophet ﷺ to al-Madeenah. Aboo ‘Afak was a Jew from the tribe of Banee ‘Amr ibn ‘Awf. At that time, he was 120 years old who showed great enmity towards the Muslims and his disbelief was strenuous. His heart was full of hatred and envy after he saw the tribes of al-Aws and al-Khazraj supporting the Prophet ﷺ and his enmity against Islam and Muslims became more excessive after seeing the power and dominion of the Prophet ﷺ increasing, particularly after the Battle of Badr.", "He could not hold back his frustration, anger, and hatred; thus, composed poetry lampooning the Prophet ﷺ encouraging people to stand against him, and ridicule the Ansaar for following and supporting him. It is reported on the authority of Saalim – who is one of the people whose eyes overflowed with tears out of grief – that they could not find something to spend for the cause of Allah during the battle of Tabook – see [Quran: 9:92] – “I swear and vow that I will kill Aboo ‘Afak or I will die trying.” He waited until he could find the right time to execute his plan.", "One night, the sky was clear and Aboo ‘Afak decided to sleep in his front yard. Saalim seized the opportunity and raided the house and stood before his head then placed his sword on the top of his liver and then leaned on his sword and pushed it all the way down until it went through the bed. Upon this, the enemy of Allah cried out loud, so those who were upon his way rushed to take him inside his house, and then buried his body. Aboo ‘Afak was one of those whose hypocrisy manifested to the people, and he was open about it after the Prophet ﷺ killed al-Haarith ibn Suwayd ibn As-Saamit.", "Saalim (may Allah be pleased with him) attended the Battle of Badr, the Battle of Uhud, and the Battle of the Trench, as well as all the battles with the Prophet ﷺ. He did during the reign of Mu’aawiyyah ibn Abee Sufyaan (may Allah be pleased with all of them)."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 50, "stage": 5, "title": "غَزوةُ بني قَينُقاعٍ", "date": "شوال 2 هـ، الموافق 624م", "place": "ديار بني قينقاع", "lat": 24.465, "lng": 39.615, "approx": false, "zoom": 11, "paras": ["ذكَر مُعظمُ أهلِ المَغازي والسِّيَرِ أنَّها وقعت بعدَ بدرٍ، ورجَّحهُ ابنُ حَجَرٍ، وقد كانت يومَ السَّبتِ للنِّصفِ مِن شَوَّالٍ. وخَبرُ إجلاءِ بني قَينُقاعٍ ثابتٌ في الصَّحيحينِ، فعنِ ابنِ عُمَرَ رضِي الله عنهما قال: \"حاربَتِ النَّضيرُ وقُرَيْظةُ، فأَجْلى بني النَّضيرِ، وأَقَرَّ قُرَيْظَةَ ومَن عليهم، حتَّى حاربتْ قُرَيْظَةُ، فقَتَلَ رِجالَهم، وقَسَمَ نِساءَهُم وأَولادَهُم وأَموالَهُم بين المسلمين، إلَّا بعضَهُم لَحِقوا بالنَّبيِّ صلى الله عليه وسلم فآمَنَهُم وأَسلَموا، وأَجْلى يَهودَ المدينةِ كُلَّهم: بني قَيْنُقاعٍ -وهُم رَهْطُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"salam\">عبدِ الله بنِ سَلامٍ</span>- ويَهودَ بني حارِثةَ، وكُلَّ يَهودِ المدينةِ\""], "url": "https://dorar.net/history/event/62", "route": null, "stations": null, "title_en": "The Battle of Banoo Qaynuqaa’", "date_en": "Shawwal 2 AH (624 CE)", "place_en": "Banu Qaynuqa", "summary_en": "After Badr, the Jewish tribe of Banu Qaynuqa broke their covenant. They were besieged and then expelled from Madinah.", "people": ["salam"], "dorar": 62, "asbab": [], "body_en": ["Most of the scholars who documented the history of the Prophet ﷺ and his battles agree that this battle occurred after the Battle of Badr, which is the view that Ibn Hajar believed to be more accurate. It took place on Saturday in the middle of the month of Shawwaal. The reports on exiling Banoo Qaynuqaa’ are correct and well established in Saheeh al-Bukhaaree and Saheeh Muslim. Narrated Ibn ‘Umar (may Allah be pleased with him and his father): Banoo An-Nadeer and Banoo Quraydhah fought against the Prophet ﷺ (violating their peace treaty), thus, the Prophet ﷺ exiled Banee An-Nadeer and allowed Banee Quraydhah to remain at their places (in al-Madeenah), taking nothing from them till they fought against the Prophet ﷺ again).", "In response, he ﷺ killed their men and distributed their women, children, and property among the Muslims, but some of them came to the Prophet ﷺ and he granted them safety, and they embraced Islam. He exiled all the Jews from al-Madeenah. They were the Jews of Bani Qaynuqaa’, the tribe of `Abdullah ibn Salaam, the Jews of Banee Haarithah, and all the other Jews of al-Madeenah.”"], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 51, "stage": 5, "title": "غزوة السويق أو غزوة بني سليم (قرقرة الكدر)", "date": "شوال 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["بعد هَزيمةِ المُشرِكين في بدْرٍ، نَذَر <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> ألَّا يَمَسَّ رَأسَه ماءٌ من جَنابةٍ حتى يَغزوَ مُحمَّدًا صلَّى اللهُ عليه وسلَّم وأصحابَه ويَنتقِمَ من المسلمين؛ فخَرَج في مِائتَي راكِبٍ من قُريشٍ، ليَبَرَّ بيَمينِه، ووَصَل إلى أطرافِ المَدينةِ لَيلًا، ولَجَأ إلى بني النَّضيرِ، فأتَى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"huyayy\">حُيَيَّ بنَ أخطَبَ</span>، فضَرَب عليه بابِه، فأبَى أن يَفتَحَ له بابَه وخافَهُ؛ فانصَرَف عنه إلى سَلَّامِ بنِ مِشكَمٍ -وكان سيِّدَ بني النَّضيرِ في زَمانِه ذلك، وصاحِبُ كَنزِهِم- فاستَأذَنَ عليه؛ فأذِنَ له، فضيَّفَه وسَقاهُ خَمرًا، وأخبَرَه من أخبارِ رسولِ الله صلَّى اللهُ عليه وسلَّم، ثم خَرَج <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> في عَقِبِ لَيلَتِه حتى أتى أصحابَه، فبَعَث رجالًا من قُرَيشٍ، فأتَوا ناحيةً من المَدينةِ يُقالُ لها: العَريضُ -وادٍ بالمدينةِ-، فأشعَلوا النَّارَ في أشجارِ ونَخيلِ المُسلمين المُثمِرةِ، ووَجَدوا رجلًا من الأنصارِ وحَليفًا له في حَرثٍ لهما، فقَتَلوهما، ثمَّ وَلَّوا مُدبِرين.", "فبَلَغ ذلك رسولَ الله صلَّى اللهُ عليه وسلَّم، فخَرَج في أثَرِهِم يَطلُبُهم في مِائتَينِ من المُهاجِرين والأنصارِ، واستَعمَلَ على المدينةِ أبا لُبابةَ بَشيرَ بنَ عبدِ المُنذِرِ رَضي اللهُ عنه، فجَعَل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> وأصحابُه يُلْقون جِرَبَ -أوعيةَ- السَّويقِ -قَمحٍ أو شَعيرٍ يُقلَى ثمَّ يُطحَنُ، فيُتزَوَّدُ به، مَلْتوتًا بماءٍ أو سمنٍ أو عسلٍ-، وهي عامَّةُ أزوادِهِم، يتَخفَّفون منها للنَّجاءِ، حتى بَلغَ رسولُ الله -صلَّى اللهُ عليه وسلَّم- قَرقَرةَ -القَرقَرُ: الأرضُ المُستَويةُ- الكَدْرِ -ماءٌ لبني سُلَيمٍ، وأصلُ الكُدْرِ: طَيرٌ في ألوانِها كُدْرةٌ، سُمِّيَ المَوضِعُ أو الماءُ به-، ثم انصَرَف راجِعًا إلى المدينةِ، وقد فاتَه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> وأصحابُه، وكانت غَيبةُ الرسولِ -صلَّى اللهُ عليه وسلَّم خمسةَ أيَّامٍ، فقال المسلمون حينَ رَجَع بهم رسولُ الله صلَّى اللهُ عليه وسلَّم: يا رسولَ الله، أتطمَعُ لنا أن تَكونَ غزوةً؟ قال: \"نعم\".", "وتُسمَّى هذه الغَزوةُ أيضًا بـ\"غزوةِ السَّويقِ\"؛ لأنَّ أكثَرَ ما طَرَح القَومُ مِن أزوادِهِمُ السَّويقُ، فرَجَع المسلمون بسَويقٍ كثيرٍ. وكان ذلك في شوَّالٍ في السَّنةِ الثَّانيةِ من الهجرةِ."], "url": "https://dorar.net/history/event/63", "route": null, "stations": null, "title_en": "The Battle of As-Soowayq / the Battle of Banee Saleem at al-Kudr (Qarqarah al-Kudr)", "date_en": "Shawwal 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "After Badr, Abu Sufyan raided the outskirts of Madinah with two hundred riders. The Prophet ﷺ pursued him, and the raiders fled, dropping their provisions of sawiq (barley meal).", "people": ["abusufyan", "huyayy"], "dorar": 63, "asbab": [], "body_en": ["After the defeat of the disbelievers of Quraysh in the Battle of Badr, Aboo Sufyaan vowed that he would not take a bath after sexual intercourse until after he takes revenge from the Prophet ﷺ and his Companions (may Allah be pleased with them). He departed Makkah with 200 horsemen from Quraysh to fulfill his vow and arrived at al-Madeenah at night. He turned to Banee An-Nadeer for help, so he went to the house of Huyayy ibn Akhtab and knocked on his door, but he refused to open his door out of fear. He left and headed to the house of Sallaam ibn Mishkam, who was the leader of Banee An-Nadeer at that time and the keeper of the treasures and wealth of his people.", "He opened his door and allowed him in. He hosted him and offered him wine to drink then informed Aboo Sufyaan of the news of the Prophet ﷺ. Then, he left his house at night and returned to the horsemen who were with him. He ordered some of them to burn the fruit trees and palm trees of the Muslims that are in al-‘Urayd, which is a valley located in al-Madeenah. While they were there, they found a man from the Ansaar along with a man from his allies in their farm, so they killed them and then fled the scene. The news of what happened reached the Prophet ﷺ who, in response, went out with 200 people from the Emigrants and Ansaar to chase them.", "The Prophet ﷺ appointed Aboo Lubaabah, Basheer ibn ‘Abd al-Mundhir (may Allah be pleased with him) to govern al-Madeenag in his absence. Aboo Sufyaan and his group tried escaping the pursuit of the Prophet ﷺ and his Companions by ridding off the travel’s supplies and sustenance they carried, which were pots containing food, namely Sawweeq, which is a meal made of fried barley or wheat that is grounded and then mixed with honey or ghee. The Prophet ﷺ continued his pursuit until he ﷺ arrived a water area in a flat land, named Qarqarah al-Kudr, that belonged to the tribe of Banoo Saleem.", "He ﷺ then returned to al-Madeenah after he ﷺ could not catch up with Aboo Sufaayn and his group. The Prophet ﷺ spent 5 days away from al-Madeenah because of this pursuit. When, he ﷺ arrived to al-Madeenah the people asked him if he hopes there will be [soon] a battle between the Muslims and the disbelievers. And he ﷺ said, yes. The battle is also known as the Battle of As-Saweeq after the many pots of Saweeq that the disbelievers got rid of while they were running away in order for their rides to be faster and escape the chase. This happened in the month of Shawwaal in the 3rd year after Hijrah."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 52, "stage": 6, "title": "مَقتَلُ كعبِ بنِ الأَشرفِ", "date": "3 هـ، الموافق 624م", "place": "ديار بني النضير", "lat": 24.43, "lng": 39.65, "approx": false, "zoom": 11, "paras": ["كعبُ بنُ الأَشرفِ رجلٌ مِن طَيِّءٍ وأمُّهُ مِن يَهودِ بني النَّضيرِ. كان شاعرًا يَهجو النَّبيَّ صلى الله عليه وسلم وأصحابَه ويُحرِّضُ عليهم ويُؤذيهِم، فلمَّا كانت وقعةُ بدرٍ كُبِتَ وذُلَّ وقال: بطنُ الأرضِ خيرٌ مِن ظَهرِها اليومَ. فخرج حتَّى قَدِمَ مكَّةَ فبَكى قَتلى قُريشٍ وحَرَّضهُم بالشِّعرِ، قال جابرُ بنُ عبدِ الله: قال: رسولُ الله صلى الله عليه وسلم: «مَن لِكعبِ بنِ الأَشرفِ؟ فإنَّه قد آذى الله ورسولَهُ».", "فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">محمَّدُ بنُ مَسلمةَ</span>: يا رسولَ الله، أَتُحِبُّ أن أَقتُلَهُ؟ قال: «نعم». قال: ائْذَنْ لي فَلْأَقُلْ. قال: «قُلْ». فأَتاهُ فقال له، وذَكَر ما بينهما، وقال: إنَّ هذا الرَّجلَ قد أراد صَدقةً وقد عَنَّانا. فلمَّا سمِعَه قال: وأيضًا والله لَتَمَلُّنَّهُ. قال: إنَّا قد اتَّبعناهُ الآنَ، ونَكرهُ أن نَدعَهُ حتَّى ننظُرَ إلى أيِّ شيءٍ يَصيرُ أَمرُهُ.", "قال: وقد أردتُ أن تُسلِّفَني سَلفًا. قال: فما تَرْهَنُني؟ قال: ما تريدُ؟ قال: تَرهَنُني نِساءَكُم. قال: أنت أَجملُ العربِ، أَنَرهنُك نِساءَنا! قال له: تَرهَنُوني أولادَكُم. قال: يُسَبُّ ابنُ أَحدِنا، فيُقالُ: رُهِنَ في وَسَقَينِ مِن تمرٍ، ولكنْ نَرهَنُك اللَّأْمَةَ -يعني السِّلاحَ- قال: فنعم.", "وواعَدهُ أن يَأتِيَهُ بالحارثِ، وأبي عَبْسِ بنِ جَبْرٍ، وعبَّادِ بنِ بِشْرٍ، قال: فجاءوا فَدَعَوْهُ ليلًا فنزل إليهِم، قال سُفيانُ: قال غيرُ عَمرٍو: قالت له امرأتُه: إنِّي لأَسمَعُ صوتًا كأنَّه صوتُ دَمٍ. قال: إنَّما هذا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">محمَّدُ بنُ مَسلمةَ</span>، ورَضيعُهُ، وأبو نائِلَةَ، إنَّ الكريمَ لو دُعِيَ إلى طَعنَةٍ ليلًا لأَجابَ.", "قال محمَّدٌ: إنِّي إذا جاء فسَوف أَمُدُّ يَدي إلى رأسِهِ، فإذا اسْتمكَنتُ منه فَدُونَكُم. قال: فلمَّا نزل نزل وهو مُتوَشِّحٌ، فقالوا: نَجِدُ منك ريحَ الطِّيبِ. قال: نعم تَحْتِي فُلانةُ هي أَعطرُ نِساءِ العربِ. قال: فتأذنُ لي أن أَشُمَّ منه، قال: نَعم فَشُمَّ. فتناوَل فَشَمَّ، ثمَّ قال: أَتأذنُ لي أن أَعودَ، قال: فاسْتمكَنَ مِن رأسِهِ، ثمَّ قال: دُونَكُم. قال: فقَتلوهُ\". (....ثمَّ أَتَوْا النَّبيَّ صلى الله عليه وسلم فأَخبَروهُ)."], "url": "https://dorar.net/history/event/65", "route": null, "stations": null, "title_en": "The Killing of Ka’b ibn al-Ashraf", "date_en": "3 AH (624 CE)", "place_en": "Banu al-Nadir", "summary_en": "Ka'b ibn al-Ashraf, a poet who mocked the Prophet ﷺ and stirred up Quraysh after Badr, was killed by Muhammad ibn Maslamah and his companions.", "people": ["maslama"], "dorar": 65, "asbab": [], "body_en": ["Ka’b ibn al-Ashraf was a man from the tribe of Tay’ and his mother was a Jewess from the tribe of Banee An-Nadeer. He was a poet who used to lampoon the Prophet ﷺ and his Companions in his poetry, harm them, and instigate people against them. After the victory of Muslims in the Battle of Badr, he was in shock and felt depressed to the extent he made a remark saying that living under earth is better than living above it (i.e., I’d prefer to be dead than alive and witness their victory). He could not stand it, so he left to Makkah and there he cried over the disbelievers who died in the Battle of Badr and recited poetry to instigate Quraysh against the Muslims.", "Narrated Jaabir ibn `Abdullah (may Allah be pleased with him): Allah's Messenger ﷺ said, \"Who is willing to kill Ka`b ibn al-Ashraf? For he is harming Allah and His Messenger?\" Thereupon, Muhammad ibn Maslamah got up saying, \"O Allah's Messenger! Would you like that I kill him?\" The Prophet ﷺ said, \"Yes,\" Muhammad ibn Maslamah said, \"Then, allow me to say a (false) thing (i.e., to deceive Ka`b). \"The Prophet ﷺ said, \"You may say it.\" Then Muhammad ibn Maslamah went to Ka`b and said, \"That man (i.e., Muhammad demands zakat from us, and he has troubled us, and I have come to borrow something from you.\"", "On that, Ka`b said, \"By Allah, you will get tired of him!\" Muhammad ibn Maslamah said, \"Now as we have followed him, we do not want to leave him unless and until we see how his end is going to be. I want you to lend me [so I can pay that zakat]. Ka`b said, \"Yes, (I will lend you), but you should mortgage something to me.\" Muhammad ibn Maslamah said, \"What do you want?\" Ka`b replied, \"Mortgage your women to me.\" They said, \"How can we mortgage our women to you, and you are the most handsome of the 'Arabs?\" Ka`b said, \"Then mortgage your sons to me.\"", "They said, \"How can we mortgage our sons to you? Later they would be abused by the people's saying that so-and-so has been mortgaged for a load of dates. That would cause us great disgrace, but we will mortgage our arms to you.\" Muhammad ibn Maslamah promised Ka`b that he would return to him and bring along al-Haarith, Aboo ‘Abs ibn Jabr, and ‘Abbaad ibn Bishr. At night, they came to him and called him from outside of his place to come out to them. The wife of Ka’b warned him of answering them and meeting them at night by saying: “I hear a voice as if dropping blood is from him.”", "However, he comforted her that there was nothing to worry about by saying: \"They are none but Muhammad in Maslamah and his foster brother, and Aboo Naa'ilah. Indeed, a generous man should respond to a call at night even if he is invited to be killed.\" Meanwhile, Muhammad ibn Maslamah said to the two men with him, \"When Ka`b comes, I will touch his hair and smell it, and when you see that I have got hold of his head, kill him.\" Ka`b came down to them wrapped in his clothes, and diffusing perfume. Muhammad ibn Maslamah said.", "\"I have never smelt a better scent than this.” Ka`b replied. \"I have got the best 'Arab woman who knows how to use the high class of perfume.\" Muhammad ibn Maslamah said to Ka`b, \"Will you allow me to smell your head?\" Ka`b said, \"Yes.\" Muhammad smelt it and made his companions smell it as well. Then he requested Ka`b again, \"Will you let me (smell your head)?\" Ka`b said, \"Yes.\" When Muhammad got a strong hold of him, he said to his companions, \"Get at him!\" So, they killed him and went to the Prophet ﷺ and informed him."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 53, "stage": 6, "title": "غزوة غطفان إلى نجد (غزوة ذي أمرّ)", "date": "صفر 3 هـ، الموافق 624م", "place": "ذو أمر", "lat": 24.9, "lng": 40.4, "approx": true, "zoom": 8, "paras": ["وهي غزوةُ ذي أمَرَّ بناحيةِ نَجدٍ. وسَبَبُها: أنَّ رسولَ الله صلَّى اللهُ عليه وسلَّم بَلَغه أنَّ جَمعًا من بني ثَعلَبَة بنِ سَعيدِ بن ذُبْيانَ بن بَغيضٍ بنِ رَيثِ بن غَطَفانَ، وبني مُحارِبِ بن خَصَفةَ بن قَيسٍ بذي أمَرَّ قد تَجَمَّعوا يُريدون أن يُصيبوا مِن أطرافِ رسولِ الله صلَّى اللهُ عليه وسلَّم، وجَمَعهم رجلٌ منهم يُقال له: دُعْثورُ بن الحارِثِ بن مُحارِبٍ، فنَدَب رسولُ الله صلَّى اللهُ عليه وسلَّم المسلمين، وخرج في أربعِمِئةٍ وخَمسين، معهم عِدَّةُ أفراسٍ، واستَخلَف على المدينةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> بنَ عفانَ، فأصابوا بالمدينةِ رجلًا منهم بذي القَصَّةِ يُقال له: جَبَّارٌ من بني ثَعلَبةَ، فقال له المسلمون: أين تُريد؟ فقال: أُريدُ يَثرِبَ لأرتاَد لنَفسي وأنظُرَ، فأُدخِلَ على رسولِ الله صلَّى اللهُ عليه وسلَّم فأخبَرَه مِن خَبَرِهم، قال: لن يُلاقوك ولو سَمِعوا بسَيرِك هَرَبوا في رؤوسِ الجبالِ وأنا سائِرٌ معك، فدعاه رسولُ الله صلَّى اللهُ عليه وسلَّم إلى الإسلامِ وأسلم، وضمَّه رسولُ الله صلَّى اللهُ عليه وسلَّم إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">بلالٍ</span>، فأخَذَ به جبَّارٌ طَريقًا، وهَبَط به عليهم، وسَمِع القومُ بمَسيرِ رسول الله صلَّى اللهُ عليه وسلَّم، فهَرَبوا في رؤوسِ الجِبالِ، فبَلَغ ماءً يقال له: ذو أمَرَّ، فعَسكرَ به، وأصاب رسولَ الله صلَّى اللهُ عليه وسلَّم وأصحابَه مطرٌ كثيرٌ، فابتَلَّت ثيابُ رسولِ الله صلَّى اللهُ عليه وسلَّم وثيابُ أصحابِهِ؛ فنزل رسولُ الله صلَّى اللهُ عليه وسلَّم تحتَ شجرةٍ ونَشَر ثيابَهُ لتَجِفَّ، واضطَجَع، وذلك بمَرأًى من المُشرِكين، واشتَغَل المسلمون في شؤونِهم.", "فبَعَث المشركون رَجلًا شُجاعًا منهم يقال له: دُعْثورُ بنُ الحارث، وكان سيِّدَها وأشجَعَها، ومعه سيفٌ متقلِّدٌ به، فبادَرَ دُعْثورٌ وأقبَلَ مُشتَمِلًا على السَّيفِ، حتى قام على رأسِ رسولِ الله صلَّى اللهُ عليه وسلَّم بالسَّيفِ مشهورًا، فقال: يا مُحمَّدُ، مَن يَمنَعُك مِنِّي اليَومَ؟ فقال رسول الله صلَّى اللهُ عليه وسلَّم: \"اللهُ\".", "ودَفَع جِبريلُ في صدرِه، فوقَع السَّيفُ من يدِه؛ فأخَذه رسولُ الله صلَّى اللهُ عليه وسلَّم، وقال له: \"مَن يَمنَعُك مِنِّي؟!\" فقال: لا أحَدَ، وأنا أشهَدُ أن لا إله إلا اللهُ وأنَّ محمدًا رسولُ الله، والله لا أُكثِّرُ عليك جَمعًا أبدًا، فأعطاهُ رسول الله صلَّى اللهُ عليه وسلَّم سيفَه.ثم أتى قَومَه فقالوا: ما لك؟ وَيلَكَ! فقال: نَظرتُ إلى رجلٍ طَويلٍ، فدَفَع في صَدري، فوَقَعتُ لظَهري، فعَرَفتُ أنَّه مَلَك، وشَهِدتُ بأنَّ مُحَمَّدًا رسول الله، واللهِ لا أُكثِّرُ عليه جَمعًا.", "وجَعَل يَدعو قومَه إلى الإسلامِ . وأنزل الله تعالى: <span class=\"verse\">﴿يَا أيُّهَا الَّذينَ آمَنُوا اذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ إِذْ هَمَّ قَوْمٌ أن يَبْسُطُوا إِلَيْكُمْ أيْدِيَهُمْ فَكَفَّ أيْدِيَهُمْ عَنْكُمْ﴾</span> <span class=\"ref\">[المائدة ١١]</span>. وعاد رسولُ الله صلَّى اللهُ عليه وسلَّم إلى المدينةِ، ولم يَلْقَ كَيدًا، وكانت غَيبَتُه خمسَ عشرةَ ليلةً، وقيل: قام رسولُ الله صلَّى اللهُ عليه وسلَّم بنَجدٍ صَفَرَ كُلَّه."], "url": "https://dorar.net/history/event/66", "route": null, "stations": null, "title_en": "The Battle of Ghatafaan", "date_en": "Safar 3 AH (624 CE)", "place_en": "Dhu Amarr (Najd)", "summary_en": "Hearing that tribes of Ghatafan were gathering at Dhu Amarr in Najd, the Prophet ﷺ marched out; the tribes dispersed and there was no fighting.", "people": ["uthman", "bilal"], "dorar": 66, "asbab": [], "body_en": ["The events of this battle occurred close to the region of Najd, also known as the Battle of Dhee Amarr. After the Prophet ﷺ received the news that some troops from Banee Muhaarib ibn Khasfah ibn Qays and Tha‘labah ibn Sa’eed ibn Dhubyaan in Bagheed ibn Rayth ibn Ghatafaan are rallying to attack al-Madeenah under the leadership of a man from them named, Du’thoor ibn al-Haarith ibn Muhaarib, he ﷺ with his Companions, hurriedly set out to discipline these new outlaws, cast fear into their hearts and deterred them from perpetrating further practices.", "The military detachment of the Muslims consisted of 450 fighters and a few horses, all led by the Prophet ﷺ who appointed ‘Uthmaan ibn ‘Affaan (may Allah be pleased with him) as the governor of al-Madeenah during his absence. On their way, the Muslims found a man from their enemy called Jabbaar, from the tribe of Banoo Tha’labah, heading towards Yathrib (i.e., al-Madeenah). He was taken to the Messenger of Allah ﷺ and he informed him about the plans of his tribe, and said: “They will not dare to encounter you, and if they heard that you are marching towards them, they would flee to the tops of mountains. I have the desire to be with you”.", "Then, the Prophet ﷺ invited him to Islam and the man accepted it and became a Muslim. The Prophet ﷺ placed him in the care of Bilaal (may Allah be pleased with him), and Jabbaar served as a guide. He took the Muslims through a different route that gave the Muslims the advantage of surprise. However, once the enemy heard of the coming of the Prophet ﷺ and his army, they fled to the tops of mountains, and the Prophet ﷺ stationed with his expedition [in the enemy’s assembly area] at a place called Dhoo Amarr. While they were there, rainfall was heavy to the extent that the clothes of the Prophet ﷺ and his Companions (may Allah be pleased with them) became soaked with water.", "The Prophet ﷺ went to a tree there and hung his clothes on it to let it dry, and then he laid down to rest. Meanwhile, the other Muslims were occupied with their own affairs. All this happened while the disbelievers were watching them, and they decided to send Du’thoor ibn al-Haarith, who was known for his bravery to assassinate the Prophet ﷺ. He wore his sword and went all the way until he stood up next to the head of the Prophet ﷺ while his word in his hand. He said to the Prophet ﷺ: O Muhammad! Who can protect you from me now?”", "The Prophet ﷺ replied: “Allah,” and then the archangel Jibreel pushed him on his chest causing the sword to fall off his hand. Then, the Prophet ﷺ took the sword and said to him: “Who can protect you from me now?” He said: Nobody! And I bear witness that there is no god except Allah and that Muhammad is His Messenger. I will never rally people against you ever!” Upon this, the Prophet ﷺ handed him his sword back and then he left and returned to his people. They were surprised that he could not kill the Prophet ﷺ. They asked him about what happened, and he answered by saying: “While I was standing there, I saw a very long man who pushed me in my chest, thus, I fell back on my back.", "I realised then that he was an angel, and so I testified that Muhammad is the Messenger of Allah. By Allah, I will never rally people against him ever again.” Then, he started to call his people to Islam and then Allah revealed: {O believers! Remember Allah’s favour upon you: when a people sought to harm you, but He held their hands back from you. Be mindful of Allah. And in Allah let the believers put their trust} [Quran 5:11] The Prophet ﷺ returned to al-Madeenah, without any outbreak of fighting, after he spent 15 days there. It has been said, he was stationed there during the whole month of Safar."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 54, "stage": 6, "title": "غزوة بحران بين الفُرْعِ والمدينة", "date": "ربيع الآخر 3 هـ، الموافق 624م", "place": "بحران", "lat": 23.3, "lng": 40.0, "approx": true, "zoom": 8, "paras": ["غزا رسولُ الله صلَّى اللهُ عليه وسلَّم يُريدُ قُريشًا، واستَعمَلَ على المدينةِ عبدَ الله بنَ أُمِّ مَكتومٍ رَضي اللهُ عنه، حتى بَلَغ بُحرانَ مِن ناحيةِ الفُرْعِ. وسَبَبُها: أنَّه بَلَغَ النبيَّ صلَّى اللهُ عليه وسلَّم أنَّ بها جَمعًا كثيرًا من بني سُلَيمِ بنِ مَنصورٍ؛ فخَرَج في ثَلاثِمئةِ رجلٍ من أصحابِه، ولم يُظهِر وَجهًا للسَّيرِ؛ حتى إذا كان دونَ بُحرانَ بليلةٍ لَقيَ رجلًا من بني سُلَيمٍ فأخبَرَهم أنَّ القَومَ افتَرَقوا فحَبَسَه مع رَجلٍ، وسار حتى وَرَد بُحرانَ وليس به أحدٌ، فأقام أيامًا ثم رَجَع ولم يَلْقَ كيدًا وأرسل الرَّجُلَ. ثم انصرف راجعًا إلى المدينةِ."], "url": "https://dorar.net/history/event/67", "route": null, "stations": null, "title_en": "The Battle of al-Furoo’ at Buhraan", "date_en": "Rabi al-Akhir 3 AH (624 CE)", "place_en": "Buhran", "summary_en": "The Prophet ﷺ marched toward Buhran in the Hijaz after news of a gathering against the Muslims, then returned without fighting.", "people": [], "dorar": 67, "asbab": [], "body_en": ["The Prophet ﷺ dispatched a military campaign to raid Quraysh and appointed ‘Abdullah ibn Maktoom (may Allah be pleased with him) to be the governor of al-Madeenah during his absence. He ﷺ marched with his expedition until they reached Buhraan, which is within the area of al-Furoo’. The cause of this expedition was that the Prophet ﷺ received a report that a formidable force of the tribe of Banoo Sulaym ibn Mansoor were gathered in Buhraan. The Prophet ﷺ dispatched an expedition consisting of 300 fighters, but without declaring their destination.", "When the Muslims were within one day of travel from Buhraan, they met a man from Banoo Sulaym who informed them that his people fled. The man was kept under the supervision of one of the Muslim soldiers, and the Muslims proceeded to Buhraan. Upon their arrival, they found them gone; thus, they stationed there for a few days and then returned to al-Madeenah. Throughout the expedition, they did not meet any enemies, and no fighting took place."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 55, "stage": 6, "title": "سَرِيَّةُ زيدِ بنِ حارِثةَ", "date": "جمادى الأول 3 هـ، الموافق 624م", "place": "القردة", "lat": 24.5, "lng": 41.2, "approx": true, "zoom": 8, "paras": ["أَصبحَ مُشرِكو مكَّةَ بعدَ هَزيمَتِهم في غَزوةِ بدرٍ، يَبحَثون عن طريقٍ أُخرى لِتِجارتِهم للشَّامِ، فأشارَ بعضُهم إلى طريقِ نَجْدِ العِراقِ، وقد سَلكوها بالفعلِ، وخرج منهم تُجَّارٌ، فيهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> بنُ حَربٍ، وصَفوانُ بنُ أُميَّةَ، وحُوَيْطِبُ بنُ عبدِ العُزَّى، ومعهم فِضَّةٌ وبضائعُ كثيرةٌ، بما قيمتُه مائةُ ألفِ دِرهمٍ؛ فبلغ ذلك رسولُ الله صلى الله عليه وسلم بواسطةِ سَليطِ بنِ النُّعمانِ رضي الله عنه، فبعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارِثةَ</span> في مائةِ راكبٍ لِاعتِراضِ القافلةِ، فلَقِيَها زيدٌ عند ماءٍ يُقالُ له: القَرَدَةُ، وهو ماءٌ مِن مِياهِ نَجْدٍ، فَفَرَّ رجالُها مَذعورين، وأصاب المسلمون العِيرَ وما عليها، وأَسَروا دَليلَها فُراتَ بنَ حيَّانَ الذي أَسلمَ بين يَدي النَّبيِّ صلى الله عليه وسلم، وعادوا إلى المدينةِ، فخَمَّسَها رسولُ الله صلى الله عليه وسلم ووَزَّعَ الباقيَ بين أَفرادِ السَّرِيَّةِ."], "url": "https://dorar.net/history/event/68", "route": null, "stations": null, "title_en": "The Expedition of Zayd ibn Haarithah", "date_en": "Jumada al-Ula 3 AH (624 CE)", "place_en": "Al-Qaradah (Najd)", "summary_en": "Zayd ibn Harithah intercepted a Quraysh caravan taking a new route through Najd toward Iraq, at the waters of al-Qaradah, and captured it.", "people": ["zayd", "abusufyan"], "dorar": 68, "asbab": [], "body_en": ["After their defeat in the Battle of Badr, the disbelievers of Makkah began to consider the coastal route to be a threat for themselves; therefore, they abandoned it and began to travel from the route of Najd, which led to Iraq. the Prophet ﷺ received intelligence from Sulayt ibn al-Nu’maan (may Allah be pleased with him) that a trade caravan of the Quraish of Makkah was to pass by this route of Najd. Chieftains such as Sufyaan Ibn Harb, Safwaan ibn Umayyah, and Huwaytib ibn ‘Abd al-‘Uzza accompanied this trade caravan and the value of its merchandise and silvers was about one hundred thousand Dirham.", "The Prophet ﷺ dispatched Zayd ibn Haarithah with 100 riding fighters to intercept the caravan. Flustered by this sudden attack, the people of the Quraysh fled in sheer panic, leaving the goods and valuables of the caravan behind. The Muslims returned to al-Madeenah with success and triumph, with a large value of spoils, and captured their guide, Furaat ibn Hayyaan, who then entered Islam at the hands of the Prophet.ﷺ. The spoils were divided between the fighters who participated in the expedition after the prescribed one fifth of it was taken out."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 56, "stage": 6, "title": "غَزوةُ أُحُدٍ وسبب هزيمة المسلمين", "date": "شوال 3 هـ، الموافق 625م", "place": "أحد", "lat": 24.5017, "lng": 39.6125, "approx": false, "zoom": 11, "paras": ["كان سببُها أنَّ المشركين حين قُتِلَ مَن قُتِلَ مِن أَشرافِهِم يوْمَ بَدْرٍ، وسَلمَت العِيرُ بما فيها مِنَ التِّجارةِ التي كانت مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبي سُفيانَ</span>، فلمَّا رجع فَلُّهُم إلى مكَّةَ قال أبناءُ مَن قُتِلَ، ورُؤساءُ مَن بَقِيَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">لأبي سُفيانَ</span>: ارْصُدْ هذه الأموالَ لِقتالِ محمَّدٍ، فأَنفَقوها في ذلك، وجمعوا الجُموعَ والأَحابيشَ وأَقبلوا في قَريبٍ مِن ثلاثةِ آلافٍ، حتَّى نزلوا قريبًا مِن أُحُدٍ تِلْقاءَ المدينةِ، فصلَّى رسولُ الله صلى الله عليه وسلم يومَ الجُمعةِ، فلمَّا فَرَغَ منها صلَّى على رجلٍ مِن بني النَّجَّارِ، يُقالُ له: مالكُ بنُ عَمرٍو، واسْتَشار النَّاسَ: أَيخرُجُ إليهِم، أمْ يَمكُثُ بالمدينةِ؟ فأشار عبدُ الله بنُ أُبَيٍّ بالمقامِ بالمدينةِ، فإن أقاموا أقاموا بِشَرِّ مَحْبسٍ وإن دخلوها قاتلَهُم الرِّجالُ في وُجوهِهم، ورَماهم النِّساءُ والصِّبيانُ بالحِجارةِ مِن فوقِهم، وإن رجعوا رجعوا خائِبين.", "وأشار آخرون مِنَ الصَّحابةِ ممَّن لم يَشهدْ بدرًا بالخُروجِ إليهم، فدخل رسولُ الله صلى الله عليه وسلم فلَبِسَ لَأْمَتَهُ وخرج عليهم... فسار في ألفٍ مِن أصحابِهِ، فلمَّا كان بالشَّوطِ رجع عبدُ الله بنُ أُبَيٍّ في ثُلُثِ الجيشِ مُغْضَبًا؛ لِكَونِه لم يُرجَعْ إلى قولِه، وقال هو وأصحابُه: لو نعلمُ اليومَ قِتالًا لاتَّبَعناكُم، ولكِنَّا لا نَراكُم تُقاتلون اليومَ.", "واستَمرَّ رسولُ الله صلى الله عليه وسلم سائرًا حتَّى نزل الشِّعْبَ مِن أُحُدٍ في عَدْوَةِ الوادي. وجعل ظَهرَهُ وعَسكرَهُ إلى أُحُدٍ، وتَهيَّأَ رسولُ الله صلى الله عليه وسلم للقِتالِ وهو في سبعمائةٍ مِن أصحابِهِ، وأمَّرَ على الرُّماةِ عبدَ الله بنَ جُبَيْرٍ أخا بني عَمرِو بنِ عَوفٍ، والرُّماةُ يَومئذٍ خمسون رجلًا.", "فقال: انْضَحْ الخَيْلَ عَنَّا بِالنَّبْلِ، لا يَأتونا مِن خَلفِنا، إن كانت لنا أو علينا، فاثْبُتْ مكانَك لا نُؤْتَيَنَّ مِن قِبَلِكَ، وظاهَر رسولُ الله صلى الله عليه وسلم بين دِرعَينِ، وأَعطى اللِّواءَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"musab\">مُصعبَ</span> بنَ عُميرٍ أخا بني عبدِ الدَّارِ، وأجاز رسولُ الله صلَّى الله عليه وسلَّم بعضَ الغِلْمانَ يَومئذٍ وأَرجأَ آخرين، وتَعبَّأتْ قُريشٌ وهُم ثلاثةُ آلافٍ، ومعهم مائتا فَرَسٍ قد جَنَبُوها، فجعلوا على مَيْمَنةِ الخَيْلِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدَ بنَ الوليدِ</span>، وعلى المَيسَرةِ عِكْرِمةَ بنَ أبي جَهْلٍ، ودفعوا إلى بني عبدِ الدَّارِ اللِّواءَ...", "ثمَّ كان بين الفَريقين ما كان، وكانت بَوادرُ النَّصرِ تَلوحُ لِصالحِ المسلمين، فلمَّا رَأى المسلمون تَقَهْقُرَ المشركين أَهملَ الرُّماةُ وَصِيَّةَ نَبِيِّهِم لهم ونزلوا يَحصُدون الغَنائمَ، فانْتهَز <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدُ بنُ الوليدِ</span> الفُرصةَ فالْتَفَّ خَلفَهم وأَعملَ الحربَ فيهم، ممَّا أَدَّى لِقَلْبِ الموازينِ وانْجَلَتِ المعركةُ عن مَقْتَلِ سبعين رجلًا مِن المسلمين مِنهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةُ</span> بنُ عبدِ المُطَّلبِ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"musab\">ومُصعبُ</span> بنُ عُميرٍ، وعبدُ الله بنُ حَرامٍ والدُ جابرٍ، وعبدُ الله بنُ جُبيرٍ أَميرُ الرُّماةِ...."], "url": "https://dorar.net/history/event/69", "route": null, "stations": null, "title_en": "The Battle of Uhud and the Defeat of the Muslims Because of the Archers Who Disobeyed the Command of the Prophet ﷺ", "date_en": "Shawwal 3 AH (625 CE)", "place_en": "Uhud", "summary_en": "Seeking revenge for Badr, Quraysh marched with about three thousand men. The Prophet ﷺ led about seven hundred at Uhud; after early success the archers left their post and the Muslims suffered heavy losses.", "people": ["khalid", "musab", "abusufyan", "hamza"], "dorar": 69, "asbab": [{"id": "ASB-031", "k": "d"}, {"id": "ASB-032", "k": "d"}, {"id": "ASB-033", "k": "d"}, {"id": "ASB-034", "k": "d"}, {"id": "ASB-080", "k": "d"}, {"id": "TAF-07", "k": "a"}], "body_en": ["After the killing of the leaders of Quraysh in the Battle of Badr, and the safe escape of the trade caravan of Aboo Sufyaan, the chieftains of Quraysh, along with the children of those who were killed in the Battle of Badr, put their money at the service of Aboo Sufyaan to muster a great army to fight the Muslims again and take revenge and dislodge the Prophet ﷺ. They assembled an army of 3,000 soldiers and marched towards al-Madeenah and stationed at a place near the mountain of Uhud. Meanwhile, After the Friday prayer, the Prophet ﷺ offered the funeral prayer over a man from the tribe of Banee al-Najjaar, named Maalik ibn ‘Amr, and then consulted his Companions about whether to encounter the disbelievers or remain stationed in al-Madeenah.", "‘Abdullah ibn Abee Ubay proposed to stay in al-Madeenah and argued that if they decided to remain stationed, then they would be at a place that has no water or food, and if they decided to enter al-Madeenah, the men would fight them face to face and stop them, and the women and children will throw rocks at them from above the houses, and if they retreated, they would return with failure. However, the Companions who could not attend the Battle of Badr proposed to go out to fight them. The Messenger of Allah ﷺ went to his house and came out while wearing his armor.", "The Prophet ﷺ left al-Madeenah for the valley of Mount Uhud with a Muslim army of only 700 after ‘Abdullah ibn Abee Ubay departed the Muslims army along with one third of the army when they arrived at a place called Ash-Shawt. He withdrew because he was frustrated that the Prophet ﷺ did not act upon his advice. He and those who were with him justified their decision by arguing that they do not believe fighting would take place on that day; otherwise, they would have joined the forces. The Prophet ﷺ and his Companions continued until they arrived at the valley of the Mount of Uhud where the Muslim troops stationed.", "The Prophet ﷺ made the back of his army towards the mountain of Uhud and positioned 50 archers under ‘Abdullah ibn Jubayr. He ﷺ ordered him to shoot the horses [of the enemy], and to obstruct the enemy if they attacked the Muslims from the rear and ordered them strictly to stay there until further orders, whatever may be the condition. After, the Prophet ﷺ wore two armours, he handed the banner to Mu’sab ibn ‘Umayr to bear it, approved the requests of a few teenagers who wished to participate in the battle, and declined the request of other teenagers.", "The army of Quraysh consisted of 200 horsemen. The left and right flanks of their army were commanded by ‘Ikrimah ibn Abee Jahl and Khaalid ibn al-Waleed, respectively, and the banner of Quraysh was handed to Banee ‘Abd al-Daar. The two armies set upon each other, and a fierce battle ensued, and the Muslims managed to overcome the disbelievers of Quraysh who, faced with yet another defeat, began to flee. It was at this point of perceived victory that the Muslim archers disobeyed the Prophet’s orders and deserted their stations, thinking that the battle was over, and joined the Muslim fighters to collect the war spoils.", "Khaalid ibn al-Waleed noticed the sudden vacuum created by the disappearance of the rear archers; thus, his cavalrymen attacked the Muslims from behind, killing many in the process. This move changed the calculations of the battle and turned it to the favour of the disbelievers, resulting in the killing of 70 Companions including Hamzah ibn ‘Abd al-Muttalib, Mus’ab ibn ‘Umayr, ‘Abdullah ibn Haraam, the father of Jaabir, and ‘Abdullah ibn Jubayr, the commander of the Muslim archers."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 57, "stage": 6, "title": "اسْتِشهادُ حَمزةَ رضِي الله عنه في غَزوةِ أُحُدٍ", "date": "شوال 3 هـ، الموافق 625م", "place": "أحد", "lat": 24.5017, "lng": 39.6125, "approx": false, "zoom": 11, "paras": ["عن عُبيدِ اللهِ بنِ عَدِيِّ بنِ الخِيارِ أنَّه سألَ وَحْشِيًّا قاتلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span>، ألا تُخبِرُنا بِقتلِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span>؟ قال: نعم، إنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span> قَتَلَ طُعَيْمَةَ بنَ عَدِيِّ بنِ الخِيارِ ببَدرٍ، فقال لي مولايَ جُبيرُ بنُ مُطْعِمٍ: إن قَتلتَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span> بِعَمِّي فأنت حُرٌّ، قال: فلمَّا أن خرج النَّاسُ عامَ عَيْنَيْنِ، وعَيْنَيْنُ جبلٌ بِحِيالِ أُحُدٍ، بينه وبينه وادٍ، خرجتُ مع النَّاسِ إلى القِتالِ، فلمَّا أن اصْطَفُّوا للقِتالِ، خرج سِباعٌ فقال: هل مِن مُبارِزٍ؟ قال: فخرج إليه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةُ</span> بنُ عبدِ المُطَّلبِ، فقال: يا سِباعُ، يا ابنَ أُمِّ أَنْمارٍ مُقَطِّعَةِ البُظورِ، أَتُحادُّ الله ورسولَهُ صلى الله عليه وسلم؟ قال: ثمَّ شَدَّ عليه، فكان كأَمسِ الذَّاهبِ، قال: وكَمَنْتُ لِ<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span> تحتَ صَخرةٍ، فلمَّا دَنا مِنِّي رَميتُهُ بِحَربَتي، فأضعُها في ثُنَّتِهِ حتَّى خَرجتْ مِن بين وَرِكَيْهِ، قال: فكان ذاك العهدُ به، فلمَّا رجع النَّاسُ رجعتُ معهم، فأَقمتُ بمكَّةَ حتَّى فَشا فيها الإسلامُ، ثمَّ خَرجتُ إلى الطَّائفِ، فأَرسلوا إلى رسولِ الله صلى الله عليه وسلم رسولًا، فقِيلَ لي: إنَّه لا يَهيجُ الرُّسُلَ.", "قال: فخَرجتُ معهم حتَّى قَدِمتُ على رسولِ الله صلى الله عليه وسلم، فلمَّا رآني قال: «آنت وَحْشِيٌّ؟». قلتُ: نعم. قال: «أنت قَتلتَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span>؟». قلتُ: قد كان مِنَ الأمرِ ما بَلغكَ. قال: «فهل تَستَطيعُ أن تُغَيِّبَ وَجهَك عَنِّي» قال: فَخرجتُ فلمَّا قُبِضَ رسولُ الله صلى الله عليه وسلم فخرج مُسَيْلِمَةُ الكذَّابُ، قلتُ: لأَخرُجَنَّ إلى مُسَيْلِمَةَ، لَعَلِّي أقتُلُه فأُكافِئَ به <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span>، قال: فخرجتُ مع النَّاسِ، فكان مِن أَمرهِ ما كان، قال: فإذا رجلٌ قائمٌ في ثَلْمَةِ جِدارٍ، كأنَّهُ جَمَلٌ أَوْرقُ ثائِرُ الرَّأسِ، قال: فَرمَيْتُه بِحَربَتي، فأَضعُها بين ثَدييهِ حتَّى خَرجتْ مِن بين كَتِفَيْهِ، قال: ووثبَ إليه رجلٌ مِنَ الأنصارِ فضَربهُ بالسَّيفِ على هامَتِهِ ."], "url": "https://dorar.net/history/event/70", "route": null, "stations": null, "title_en": "The Martyrdom of Hamzah in the Battle of Uhud", "date_en": "Shawwal 3 AH (625 CE)", "place_en": "Uhud", "summary_en": "Wahshi, a slave promised his freedom, killed Hamzah at Uhud. Wahshi later accepted Islam and described how it happened.", "people": ["hamza"], "dorar": 70, "asbab": [], "body_en": ["Narrated ‘Ubayd Allah ibn ‘Adyy ibn al-Khiyaar: I asked Wahshee, the killer of Hamzah: \"Will you tell me the story of the killing of Hamzah?\" Wahshee replied: \"Yes, Hamzah killed Tu’aymah ibn `Adyy ibn Al-Khiyaar at Badr (battle), so my master, Jubayr ibn Mut`im said to me, 'If you kill Hamzah in revenge for my uncle, then you will be set free.\" When the people set out (for the battle of Uhud) in the year of 'Aynayn ('Aynayn is a mountain near the mountain of Uhud, and between it and Uhud there is a valley), I went out with the people for the battle.", "When the army aligned for the fight, Sibaa' came out and said, 'Is there any Muslim to accept my challenge to a duel?' Hamzah ibn `Abdul Muttalib came out and said, 'O Sibaa'. O Ibn Um Anmaar, the one who circumcises females! Do you challenge Allah and His Messenger?' Then Hamzah attacked and killed him, causing him to be non-extant like the bygone of yesterday. I hid myself under a rock, and when he (i.e., Hamzah) came near me, I threw my spear at him, driving it into his umbilicus so that it came out through his buttocks, causing him to die.", "When all the people returned to Makkah, I too returned with them. I stayed in (Makkah) till Islam spread in it (i.e., Makkah). Then I left for al-Taaif, and when the people (of Taaif) sent their messengers to Allah's Messenger ﷺ I was told that the Prophet ﷺ did not harm the messengers; So, I too went out with them till I reached Allah's Messenger ﷺ. When he saw me, he said, 'Are you Wahshee?' I said, 'Yes.' He said, 'Was it you who killed Hamzah?' I replied, 'What happened is what you have been told of.' He said, 'Can you hide your face from me?' So, I went out when Allah's Messenger ﷺ and Musaylamah the Liar appeared (claiming to be a prophet).", "I said, 'I will go out to Musaylamah so that I may kill him and make amends for killing Hamzah. So, I went out with the people (to fight Musaylamah and his followers) and then famous events took place concerning that battle. Suddenly I saw a man (i.e., Musaylamah) standing near a gap in a wall. He looked like an ash-colored camel and his hair was dishevelled. So, I threw my spear at him, driving it into his chest in between his breasts till it passed out through his shoulders, and then an Ansari man attacked him and struck him on the head with a sword.”"], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 58, "stage": 6, "title": "غَزوةُ حَمراءِ الأَسدِ", "date": "شوال 3 هـ، الموافق 625م", "place": "حمراء الأسد", "lat": 24.4, "lng": 39.47, "approx": false, "zoom": 11, "paras": ["قال ابنُ كَثيرٍ في تَفسيرِ قولِه تعالى: <span class=\"verse\">﴿الَّذِينَ اسْتَجَابُوا لِلَّهِ وَالرَّسُولِ مِنْ بَعْدِ مَا أَصَابَهُمُ الْقَرْحُ﴾</span> هذا كان يومَ حَمراءِ الأسدِ، وذلك أنَّ المشركين لمَّا أصابوا ما أصابوا مِن المسلمين -أي يومَ أُحُدٍ-كَرُّوا راجِعين إلى بلادِهم، فلمَّا استَمرُّوا في سَيْرهِم تَنَدَّمُوا لِمَ لا تَمَّموا على أهلِ المدينةِ وجعلوها الفَيْصلةَ.", "فلمَّا بلغ ذلك رسولَ الله صلى الله عليه وسلم نَدَبَ المسلمين إلى الذِّهابِ وراءَهُم ليُرْعِبَهم ويُرِيَهُم أنَّ بهِم قُوَّةً وجَلَدًا، ولم يأذنْ لأَحَدٍ سِوَى مَن حضر الوَقعةَ يومَ أُحُدٍ، سِوَى جابرِ بنِ عبدِ الله رضي الله عنه فانْتدبَ المسلمون على ما بهِم مِنَ الجِراحِ والإثْخانِ طاعةً لله عزَّ وجلَّ ولِرسولِه صلى الله عليه وسلم.", "عن عائشةَ رضي الله عنها أنَّها قالت في قولِه تعالى: <span class=\"verse\">﴿الَّذِينَ اسْتَجَابُوا لِلَّهِ وَالرَّسُولِ مِنْ بَعْدِ مَا أَصَابَهُمُ الْقَرْحُ لِلَّذِينَ أَحْسَنُوا مِنْهُمْ وَاتَّقَوْا أَجْرٌ عَظِيمٌ﴾</span> قالت لِعُروةَ: يا ابنَ أُختي، كان أَبَواكَ منهم: الزُّبيرُ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span>، لمَّا أصابَ رسولَ الله صلى الله عليه وسلم ما أصابَ يومَ أُحُدٍ، وانصرف عنه المشركون، خاف أن يَرجِعوا، قال: «مَن يَذهبُ في إثْرِهِم» فانْتدَبَ منهم سبعون رجلًا، قال: كان فيهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>، والزُّبيرُ\". قال ابنُ كُثيرٍ عَقِبَ ذِكرِ هذا الحديثِ: (وهذا السِّياقُ غريبٌ جِدًّا، فإنَّ المشهورَ عند أصحابِ المغازي أنَّ الذين خرجوا مع رسولِ الله صلَّى الله عليه وسلَّم إلى حَمراءِ الأسدِ كُلُّ مَن شَهِدَ أُحُدًا، وكانوا سبعمائةٍ، قُتِلَ منهم سبعون، وبَقِيَ الباقون). والظَّاهرُ أنَّه لا تَخالُف بين قولي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> وأصحابِ المغازي؛ لأنَّ معنى قولِها: فانْتدَبَ لها سبعون. أنَّهم سبَقوا غيرَهُم، ثمَّ تلاحَق الباقون. وموقعُ حمراءِ الأسدِ على بُعْدِ ثمانيةِ أَميالٍ مِنَ المدينةِ."], "url": "https://dorar.net/history/event/71", "route": null, "stations": null, "title_en": "The Expedition of Hamraa’ al-Asad", "date_en": "Shawwal 3 AH (625 CE)", "place_en": "Hamra al-Asad", "summary_en": "The day after Uhud, the Prophet ﷺ led the wounded Muslims in pursuit of Quraysh to Hamra al-Asad, discouraging them from returning to attack Madinah.", "people": ["abubakr", "aisha"], "dorar": 71, "asbab": [{"id": "TAF-04", "k": "d"}], "body_en": ["Ibn Katheer commented on the Statement of Allah {Those [believers] who responded to Allah and the Messenger after injury had struck them.} [Quran 3: 172] by saying: “This occurred on the day of Hamraa' Al-Asad. After the idolators defeated the Muslims (at Uhud), they started on their way back home, but soon they were concerned because they did not finish off the Muslims in Al-Madeenah, so they set out to make that battle the final one. When the Messenger of Allah ﷺ got news of this, he ﷺ commanded the Muslims to march to meet the disbelievers, to bring fear to their hearts and to demonstrate that the Muslims still had strength to fight. The Prophet ﷺ only allowed those who were present during Uhud to accompany him, except for Jaabir ibn `Abdullah (may Allah be pleased with him), as we will mention. The Muslims mobilized, even though they were still suffering from their injuries, in obedience to Allah and His Messenger ﷺ. ‘Aishah (may Allah be pleased with her) explained the statement of Allah: {Those [believers] who responded to Allah and the Messenger after injury had struck them.", "For those who did good among them, and feared Allah is a great reward.} [Quran 3:172]. She told ‘Urwah, ‘O my nephew! Your both fathers [father and maternal grandfather] were among them, az-Zubayr and Aboo Bakr. After what happened on the battle of Uhud and the polytheists returned home, the Prophet ﷺ was concerned that they may return, thus he stated, ‘Who will pursue them?’ Seventy people amongst them willingly accepted the mission. ‘Urwah says that Aboo Bakr and az-Zubayr were amongst them.’” Ibn Katheer states after mentioning this Hadeeth, “This context is very strange as it is well-known among the chroniclers of the military campaigns of the Prophet ﷺ that those who went out with the Messenger of Allah ﷺ to Hamraa’ al-Asad were all those who witnessed Uhud, and they were seven hundred, seventy of them were killed, and the rest survived.", "Apparently, there seems to be no contradiction between the sayings of ‘Aishah and the chroniclers of the military campaigns of the Prophet. Because the meaning of her saying ‘Seventy readily accepted the mission’ is that they preceded others and the rest of the army caught up with them later. The site of Hamraa’ al-Asad is eight miles from the al-Madeenah."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 59, "stage": 6, "title": "سرية عبد الله بن عبد الأسد رضي الله عنه إلى قطن", "date": "محرم 4 هـ، الموافق 625م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["كانت سَريَّةُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبي سَلَمةَ</span> عبدِ الله بنِ عبدِ الأسَدِ، وهو ابنُ عمَّتِه صلَّى اللهُ عليه وسلَّم بَرَّةَ بنتِ عبد المطلب، وأخوه من الرَّضاعةِ، أرضَعَتهما ثُوَيبةُ. وقَطَنٌ: هو جبلٌ، وقيل: ماءٌ مِن مياهِ بني أسَدٍ. وسَبَبُها: أن رجلًا مِن طيِّئٍ اسمُه الوليدُ بن زُهَيرِ بن طَريفٍ قَدِم المدينةَ زائرًا ابنةَ أخيه زَينَبَ، وكانت تَحتَ طُلَيبِ بنِ عُمَيرِ بن وَهبٍ، فأُخبِرَ أنَّ طُليحةَ وسَلَمةَ ابنَي خوَيلِدٍ تَرَكَهما قد سارا في قَومِهِما ومَن أطاعَهما لحَربِ رسولِ اللَّه صلَّى اللهُ عليه وسلَّم، فنَهاهم قَيسُ بن الحارِثِ فعَصَوه؛ فلمَّا بَلَغ ذلك رسولَ اللَّه صلَّى اللهُ عليه وسلَّم دعا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبا سَلَمةَ</span> رضي اللَّه تعالى عنه وقال: \"اخرُج في هذه السَّريَّةِ فقدِ استَعمَلتُكَ عليها\".", "وعَقَد له لِواءً وقال: \"سِر حتَّى تَرِدَ أرضَ بَني أسَدِ بنِ خُزَيمةَ، فأغِرْ عليهم قبلَ أن يَتلاقَى عليك جُموعُهم\". وأوصاه بتقوى اللَّه تعالى وبمَن معه من المسلمين خيرًا. فخَرَج معه في تلك السَّريَّةِ خمسون ومئةُ رجلٍ، ومعه الرَّجلُ الطَّائيُّ دَليلًا، فأسرَعَ السَّيرَ وعَدَل بهم عن سَيفِ الطَّريقِ، وسار بهم ليلًا ونهارًا، فسَبَقوا الأخبارَ وانتَهَوا إلى ذي قَطَنٍ -ماءٍ من مياهِ بني أسَدٍ وهو الذي كان عليه جَمعُهم-، فأغاروا على سَرحٍ لهم، وأسَروا ثلاثةً من الرُّعاةِ وأفلَتَ سائِرُهم، فجاؤوا جَمْعَهم فأخبَروهم الخَبَرَ وحَذَّروهم جَمْعَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبي سَلَمةَ</span>، وكثَّروه عندهم، فتَفرَّق الجمعُ في كُلِّ وَجهٍ، ووَرَدَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلَمةَ</span> الماءَ، فوَجَد الجَمْعَ قد تَفرَّق.", "فعَسكَرَ وفرَّق أصحابَه في طَلَبِ النَّعَمِ والشَّاءِ؛ فجَعَلهم ثلاثَ فِرَقٍ: فِرقةٌ أقامت معه، وفِرقَتان أغارَتا في ناحيَتينِ شتَّى، وأوعَزَ إليهما ألا يُمعِنوا في الطلب، وألَّا يَبيتوا إلَّا عنده إن سَلِموا، وأمَرَهم ألَّا يَفتَرِقوا، واستَعمَل على كلِّ فِرقةٍ عامِلًا منهم فآبوا إليه جَميعًا سالِمين قد أصابوا إبِلًا وشاءً، ولم يَلْقَوا أحدًا، فانحَدَر <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلَمةَ</span> بذلك كُلِّه راجعًا إلى المدينةِ ورَجَع معه الطَّائيُّ.", "فلمَّا ساروا ليلةً قسَّمَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلَمةَ</span> الغنائِمَ، وأخرَجَ صَفيَّ رسول اللَّه صلَّى اللهُ عليه وسلَّم عبدًا وأخرَجَ الخُمُسَ وأعطَى الطائيَّ الدليلَ رِضاهُ من المَغنَمِ، ثم قَسَّم ما بَقي بين أصحابِه فأصاب كلُّ إنسانٍ سبعةَ أبعِرةٍ، وقَدِم بذلك إلى المدينةِ ولم يَلْقَ كَيدًا."], "url": "https://dorar.net/history/event/72", "route": null, "stations": null, "title_en": "The Brigade of Aboo Salamah, Abdullah ibn Abd al-Asad (May Allah Be Pleased with Him) to Qatan", "date_en": "Muharram 4 AH (625 CE)", "place_en": "Madinah", "summary_en": "Abu Salamah led a force to Qatan to disperse Banu Asad, who were preparing to attack Madinah.", "people": ["abusalama"], "dorar": 72, "asbab": [], "body_en": ["Aboo Salamah: He is Abdullah ibn Abd al-Asad, the son of the Prophet’s ﷺ paternal aunt, Barrah bint Abdul Muttalib, and his brother through breastfeeding; Thuwayba breastfed the Prophet ﷺ and him. Qatan: it is a mountain, and it was said: water from the waters of Banoo Asad. The Brigade was dispatched because a man from the tribe of Taiy named al-Waleed ibn Zuhayr ibn Tareef came to al-Madeenah visiting his niece, Zainab, who was married to Tulayb ibn ‘Umayr ibn Wahab. He told that Tulayhah and Salamah, the two sons of Khuwaylid joined their people and those who obey them to fight the Messenger of Allah ﷺ.", "Qays Ibn al-Haarith forbade them, but they disobeyed him. When this news reached the Messenger of Allah ﷺ he called Aboo Salamah (may Allah be pleased with him) and said, ‘\"Go out in this brigade, for I have appointed you as its commander.\" He held a banner for him and said: ‘Proceed until you reach the land of Banoo Asad ibn Khuzaymah, and raid them before they gather their people against you.’ Then, he ﷺ advised him to fear Allah and to be good to those with him from among the Muslims. One hundred and fifty men went out with him in that brigade and with him was the man of the tribe of Tay’ as a guide.", "He made haste to walk and turned them away from the main road, and he walked with them day and night, so they preceded the news and they ended up at Dhu Qatan, which is an oasis among the water sources of Banoo Asad- on which was their gathering - the waters of which he had gathered - so they raided their camp and captured three of the shepherds, and the rest of them escaped going to their crowd and they told them the news and warned them about the crowd of Aboo Salamah, and they exaggerated the number enormously, so the crowd scattered into all directions, and Aboo Salama came to the water, and found the crowd scattered.", "He encamped there and scattered his companions in seeking livestock and goats; he divided them into three groups. One group stayed with him, and the other two groups went on an attack mission to two different corners and instructed them not to go too far in the pursuit and not to spend the night but with him if they are safe. And he commanded not to scatter, and he appointed a leader for every group. They returned to him safely and they had acquired some camels and goats. However, they did not meet anyone from the enemy.", "Aboo Salamah moved forward returning to al-Madeenah with all those spoils and the man from the tribe of Tay’ also returned with him. When they travelled at night, Aboo Salamah distributed the spoils, he took the share of the Messenger of Allah ﷺ a slave, and then put aside the one fifth share and gave the guide from the tribe of Tay’ his preferred share of the booty. Then he distributed what was left over among his companions. Every person got seven camels each. He arrived at al-Madeenah with all spoils, and he did not encounter any problem or resistance on his way."], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 60, "stage": 6, "title": "سرية عبد الله بن أنيس الجهني إلى سفيان بن خالد ببطن عُرْنة", "date": "محرم 4 هـ، الموافق 625م", "place": "عرفة", "lat": 21.3549, "lng": 39.9842, "approx": true, "zoom": 11, "paras": ["خَرَج عبدُ اللَّه بنُ أُنيسٍ رَضي اللهُ عنه من المدينةِ يومَ الإثنَينِ لخمسٍ خَلَونَ من المُحرَّمِ على رأس خمسةٍ وثلاثين شهرًا من مُهاجَرِ رسولِ اللَّه صلَّى اللهُ عليه وسلَّم، وبَلَغَ رسولَ اللَّه صلَّى اللهُ عليه وسلَّم أنَّ سُفيانَ بنَ خالِدِ بن نُبَيحٍ الهُذليَّ ثم اللِّحيانيَّ -وكان يَنزِل عُرْنةَ وما والاها في أُناسٍ من قومِه وغيرِهم- يُريد أن يَجمَعَ الجُموعَ إلى رسولِ اللَّه صلَّى اللهُ عليه وسلَّم فضَوَى إليه بَشَرٌ كثيرٌ من أفناءِ الناسِ.", "قال عبدُ اللَّه بنُ أُنيسٍ رضي اللَّه تعالى عنه: دَعاني رسولُ اللَّه صلَّى اللهُ عليه وسلَّم فقال: \"إنَّه بَلَغني أنَّ سفيانَ بنَ خالدِ بنِ نُبَيحٍ يَجمَع لي الناسَ ليَغزوَني وهو بنَخلةَ أو بعُرْنةَ فأْتِه فاقْتُلْه\". فقلتُ: يا رسول اللَّه، صِفْهُ لي حتى أعرِفَه.", "فقال: \"آيةُ ما بَينَك وبَينَه أنَّك إذا رَأيتَه هِبتَه وفَرِقْتَ منه، ووَجَدْتَ له قُشَعْريرةً، وذَكَرْتَ الشَّيطانَ\". قال عبد اللَّه: كنتُ لا أهابُ الرِّجالَ، فقلت: يا رسول اللَّه، ما فَرِقتُ من شيءٍ قطُّ. فقال: \"بَلَى؛ آيةُ ما بَينَك وبَينَه ذلك: أن تَجِدَ له قُشَعْريرةً إذا رَأيتَه\".", "قال: واستَأذَنتُ رسولَ اللَّه صلَّى اللهُ عليه وسلَّم أن أقولَ. فقال: \"قُلْ ما بَدا لَكَ\". وقال: \"انتَسِبْ لخُزاعةَ\". فأخَذتُ سَيفي ولم أزِدْ عليه وخرجتُ أعتَزي لخُزاعةَ حتى إذا كنتُ ببَطنِ عُرْنةَ لَقيتُه يمشي ووراءه الأحابيشُ. فلمَّا رَأيتُه هِبتُه وعَرَفتُه بالنَّعتِ الذي نَعَت لي رسولُ اللَّه صلَّى اللهُ عليه وسلَّم.", "فقلتُ: صَدَقَ اللَّهُ ورسولُه، وقد دخل وقتُ العَصرِ حين رَأيتُه، فصَلَّيتُ وأنا أمشي أُومي برَأسي إيماءً. فلمَّا دَنَوتُ منه قال: \"مَنِ الرَّجلُ؟\". فقلتُ: \"رجلٌ من خُزاعةَ سَمِعتُ بجَمعِكَ لمُحمَّدٍ فجِئتُكَ لأكونَ مَعَك عليه\". قال: \"أجلْ؛ إنِّي لَفي الجَمعِ له\".", "فمَشَيتُ معه وحدَّثتُه فاستَحلَى حديثي وأنشَدتُه وقلتُ: \"عَجَبًا لِمَا أحدَثَ مُحمَّدٌ مِن هذا الدِّينِ المُحدَثِ، فارَقَ الآباءَ وسَفَّه أحلامَهم\". قال: \"لم ألْقَ أحَدًا يُشبِهُني ولا يُحسِنُ قِتالَه\". وهو يتوكَّأُ على عصًا يَهُدُّ الأرضَ، حتى انتَهَى إلى خِبائِه وتفرَّق عنه أصحابُه إلى منازِلَ قَريبةٍ منه، وهم يُطيفون به.", "فقال: هَلُمَّ يا أخا خُزاعةَ. فدَنَوتُ منه. فقال: اجلِسْ. فجَلَستُ معه حتى إذا هَدَأ الناسُ ونامَ اغتَرَرْتُه. وفي أكثرِ الرِّواياتِ أنه قال: فمَشَيتُ معه حتَّى إذا أمكَنني حَمَلتُ عليه السَّيفَ فقَتَلتُه وأخذتُ رأسَه. ثم أقبلتُ فصَعِدتُ جَبَلًا، فدَخَلتُ غارًا وأقبَلَ الطلبُ من الخيلِ والرجالِ تَمعَجُ في كلِّ وجهٍ وأنا مُكتَمِنٌ في الغارِ، وأقبل رجلٌ معه إداوَتُه ونعلُه في يدِهِ وكنتُ خائفًا، فوضع إداوَتَه ونعلَه وجلس يَبولُ قَريبًا من فَمِ الغارِ، ثم قال لأصحابِه: ليس في الغارِ أحدٌ، فانصَرَفوا راجِعين، وخرجتُ إلى الإداوةِ فشَرِبتُ ما فيها وأخذتُ النَّعلَين فلَبِستُهما.", "فكنتُ أسير الليلَ وأكمُنُ النهارَ حتى جِئتُ المدينة، فوَجَدتُ رسولَ اللَّه صلَّى اللهُ عليه وسلَّم في المسجد، فلمَّا رآني قال: \"أفلَحَ الوَجهُ\". فقلت: وأفلَحَ وَجهُكَ يا رسول اللَّه\". فوَضَعتُ الرَّأسَ بين يَدَيه وأخبَرتُه خَبَري، فدَفَع إليَّ عصًا وقال: \"تَخَصَّرْ بِها في الجَنَّةِ؛ فإنَّ المُتخَصِّرين في الجَنَّةِ قَليلٌ\". فكانتِ العصا عند عبدِ اللَّه بن أُنَيسٍ حتى إذا حضَرَته الوفاةُ أوصى أهلَه أن يُدرِجوا العصا في أكفانِه. ففَعَلوا ذلك. قال ابنُ عُقبةَ: \"فيَزعُمون أنَّ رسولَ اللَّه صلَّى اللهُ عليه وسلَّم أخبَرَ بقتلِ عبدِ اللَّه بنِ أُنيسٍ سُفيانَ بنَ خالِدٍ قبلَ قُدومِ عبدِ اللَّه بنِ أُنَيسٍ رضي اللَّه تعالى عنه\"."], "url": "https://dorar.net/history/event/73", "route": null, "stations": null, "title_en": "The Dispatching of Abdullah ibn Unays ibn As’ad al-Juhanee al-Qudhaa’i al-Ansaaree al-Salamee to Kill Sufyaan ibn Khaalid at ‘Urnah", "date_en": "Muharram 4 AH (625 CE)", "place_en": "Arafah", "summary_en": "Abdullah ibn Unays was sent alone against Sufyan ibn Khalid al-Hudhali, who was gathering forces to attack Madinah, and killed him.", "people": [], "dorar": 73, "asbab": [], "body_en": ["The Prophet ﷺ dispatched Abdullah ibn Unays (may Allah be please with him) who left on Monday, the fifth day of the month of Muharram, right in the beginning of the thirty fifth month since the emigration of the Messenger of Allah ﷺ. The reason he ﷺ sent him out was that Sufyan ibn Khaalid ibn Nubayh al-Hudhalee al-Lihyaane, who lived at ‘Urnah and it was surrounded with the people of his tribe and others, wanted to assemble people to revolt against the Messenger of Allah ﷺ and a good number of people of all sorts had joined him.", "Abdullah ibn Unays (may Allah be pleased with him( related, “The Messenger of Allah ﷺ called me, then said, “The news has reached me that Sufyaan ibn Khaalid ibn Nubayh is rallying people around him to fight me. He is currently at Nakhlah or ‘Urnah. Go to him and kill him. I said, “O Messenger of Allah, can you describe him to me so that I can recognise him? He said, ‘A sign between you and him is that if you see him, you would be awed by him and fear him, and you will find yourself shivering due to him, and you will remember the devil.’ Abdullah said, ‘Since I was never awed by men, therefore I said, ‘O Messenger of Allah, I have never been afraid of men.’ He replied: ‘Yes. There is a sign between you and him and that is that you find a shiver due to him when you see him.’ He said, ‘I took permission from the Messenger of Allah ﷺ to say whatever could help me fulfil my mission.’ The Messenger said, ‘Feel free to say whatever you see fits.’", "And he also said, ‘Ascribe yourself to the tribe of Khuzaa'ah.’ So, I took my sword and did not add anything else to it, and I went out to attributing myself to Khuza'ah, until when I was in the midst of ‘Urnah, I found him walking and behind him were the Abyssinians. When I saw him, I was awed and recognised him with the description that the Messenger of Allah ﷺ supplied me with. So, I said, ‘Allah and His Messenger have spoken the truth, and it was time for the afternoon prayer when I saw him, and I prayed with gestures as I walked.", "When I approached him, he said, ‘Who is the man?’ I replied, ‘A man from Khuzaa’ah, I heard that you had gathered to counterattack Muhammad, so I came to be with you against him.’ He said: ‘Yes, I am in the assembling [people] against him.’ I walked with him and spoke to him, he found my speech sweet, and I spoke criticisingly and said, ‘How disappointing! For the new religion that Muhammad has brought forth, he dislodged from the fathers and ridiculed their dreams.’ He said, ‘I have not met anyone who resembles me and who can fight him well.’", "He was leaning on a stick poking the earth, until he reached his tent and his companions dispersed from him to the dwellings close to him, and they had circled with him. He exclaimed, ‘Come, brother of Khuzaa'ah.’ I got close to him. He said, ‘Sit.’ I sat with him so that when people calmed down and fell asleep, I assassinated him.’ In most of the narrations, it comes that he said, ‘So I walked with him until when it was possible for me, I took the sword on him, and I killed him and took his head. Then I came and climbed a mountain, and I entered a cave, and the pursuit came from the horses and the men swarming in every direction while I was hiding in the cave, and a spider built a cobweb on the mouth of the cave.", "And a man came with his water carrier and his sandals on his hand, and I was afraid. He put his water carrier and his sandals and sat urinating near the mouth of the cave, then he told his companions, ‘There is no one in the cave, so they went back down, and I went out to the water carrier and drank from it and took the sandals and wore them. I used to travel at night and used to hide during the daytime until I came to Al-Madeenah, and I found the Messenger of Allah ﷺ in the mosque, and when he saw me, he said, ‘The face looks successful.’", "I replied, ‘And your face is successful too, O Messenger of Allah.’ So, I placed the head before his hands and told him my story, so he gave me a stick and said: ‘Be in full control with it in Paradise; There are few who will have sticks with them in Paradise.’ The stick remained with Abdullah ibn Unais, until when death approached him, he advised his family to put the stick in his shrouds. They did that. Ibn ‘Uqbah says, ‘They claimed that the Messenger of Allah ﷺ informed them of the killing of Sufyaan ibn Khaalid before the arrival of Abdullah ibn Unays (may Allah be pleased with him.)”"], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 61, "stage": 6, "title": "سرية يَوم الرَّجيعِ", "date": "صفر 4 هـ، الموافق 625م", "place": "الرجيع", "lat": 22.0, "lng": 39.5, "approx": true, "zoom": 8, "paras": ["عن أبي هُريرةَ رضي الله عنه قال: «بعَث رسولُ الله صلى الله عليه وسلم عشرةَ رَهْطٍ سَرِيَّةً عينًا، وأَمَّرَ عليهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"asim\">عاصمَ بنَ ثابتٍ</span> الأَنصاريَّ، جَدَّ عاصمِ بنِ عُمَرَ بنِ الخطاَّبِ، فانطلقوا حتَّى إذا كانوا بالهَدَأَةِ، وهو بين عُسْفانَ ومكَّةَ، ذُكِروا لِحَيٍّ مِن هُذيلٍ يُقالُ لهم: بنو لَحْيانَ، فنَفَروا لهم قريبًا مِن مائتي رجلٍ كُلُّهم رامٍ، فاقْتَصُّوا آثارَهُم حتَّى وجدوا مَأكلَهُم تمرًا تَزوَّدوهُ مِنَ المدينةِ، فقالوا: هذا تمرُ يَثْرِبَ. فاقْتَصُّوا آثارَهُم، فلمَّا رآهُم عاصمٌ وأصحابُه لَجَئُوا إلى فَدْفَدٍ وأحاط بهم القومُ، فقالوا لهم: انزلوا وأَعْطونا بِأَيديكُم، ولكم العهدُ والميثاقُ، ولا نقتُل منكم أحدًا، قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"asim\">عاصمُ بنُ ثابتٍ</span> أَميرُ السَّرِيَّةِ: أمَّا أنا فَوَالله لا أنزِلُ اليومَ في ذِمَّةِ كافرٍ، اللَّهمَّ أَخبِرْ عَنَّا نَبِيَّكَ، فرَمَوْهُم بالنَّبْلِ فقَتلوا عاصمًا في سَبعةٍ، فنزل إليهِم ثلاثةُ رَهْطٍ بالعهدِ والميثاقِ، منهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span> الأَنصاريُّ، وابنُ دَثِنَةَ، ورجلٌ آخرُ، فلمَّا اسْتمكَنوا منهم أطلقوا أَوتارَ قِسِيِّهِم فأَوثَقوهُم، فقال الرجلُ الثَّالثُ: هذا أوَّلُ الغَدْرِ، والله لا أَصحَبُكُم، إنَّ لي في هؤلاءِ لِأُسْوَةً يُريدُ القَتلى، فجَرَّروهُ وعالَجوهُ على أن يَصحبَهُم فأَبى فقَتلوهُ، فانطلقوا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">بخُبَيْبٍ</span>، وابنِ دَثِنَةَ حتَّى باعوهُما بمكَّةَ بعدَ وَقعةِ بدرٍ، فابتاع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْب</span>ًا بنو الحارثِ بنِ عامرِ بنِ نَوفلِ بنِ عبدِ مَنافٍ، وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span> هو قَتَلَ الحارثَ بنَ عامرٍ يومَ بدرٍ، فلَبِثَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span> عندهم أَسيرًا، فأخبرني عُبيدُ الله بنُ عِياضٍ، أنَّ بنتَ الحارثِ أخبرتْهُ: أنَّهم حين اجتمعوا اسْتَعار منها موسى يَسْتَحِدُّ بها، فأعارتْهُ، فأخذ ابنًا لي وأنا غافلةٌ حين أتاهُ قالت: فوجدتُه مُجْلِسَهُ على فَخِذِهِ والموسى بيدِه، ففَزِعْتُ فَزْعَةً عرَفها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span> في وجهي، فقال: تَخْشَيْنَ أن أَقتُلَهُ؟ ما كنتُ لأَفعلَ ذلك. والله ما رأيتُ أَسيرًا قَطُّ خيرًا مِن <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٍ</span>، والله لقد وجدتُهُ يومًا يأكلُ مِن قِطْفِ عِنَبٍ في يدِه، وإنَّه لَمُوثَقٌ في الحديدِ، وما بمكَّةَ مِن ثَمَرٍ، وكانت تقولُ: إنَّه لَرزقٌ مِنَ الله رَزَقَهُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْب</span>ًا، فلمَّا خرجوا مِنَ الحَرَمِ لِيقتُلوه في الحِلِّ، قال لهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span>: ذَروني أَركعُ رَكعتينِ. فتركوه، فركَع رَكعتينِ، ثمَّ قال: لولا أن تَظنُّوا أنَّ ما بي جَزَعٌ لَطَوَّلْتُها، اللَّهمَّ أَحْصِهم عددًا، ثمَّ ارْتَجز يقولُه: لا أُبالي حين أُقتَلُ مُسلمًا... على أيِّ شِقٍّ كان لله مَصرعي، وذلك في ذاتِ الإلهِ وإن يشأْ... يُبارِك على أَوصالِ شِلْوٍ مُمَزَّعِ. فقتَله ابنُ الحارثِ، فكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">خُبَيْبٌ</span> هو سَنَّ الرَّكعتينِ لِكُلِّ امرئٍ مُسلمٍ قُتِلَ صَبرًا، فاستجاب الله <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"asim\">لعاصمِ بنِ ثابتٍ</span> يومَ أُصيبَ، فأَخبرَ النَّبيُّ صلى الله عليه وسلم أصحابَه خبرَهُم، وما أُصيبوا، وبعَث ناسٌ مِن كُفَّارِ قُريشٍ إلى عاصمٍ حين حُدِّثوا أنَّه قُتِلَ، لِيُؤْتَوْا بشيءٍ منه يُعرفُ، وكان قد قتَل رجلًا مِن عُظمائهِم يومَ بدرٍ، فبُعِثَ على عاصمٍ مِثْلُ الظُّلَّةِ مِنَ الدَّبْرِ، فحَمَتْهُ مِن رسولهِم، فلم يَقدِروا على أن يَقطعَ مِن لَحمِه شيئًا."], "url": "https://dorar.net/history/event/74", "route": null, "stations": null, "title_en": "The Battle of Ar-Rajee’", "date_en": "Safar 4 AH (625 CE)", "place_en": "Al-Raji", "summary_en": "Ten Companions led by Asim ibn Thabit were betrayed at al-Raji. Most were killed, and Khubayb ibn Adi was captured and later killed in Makkah.", "people": ["khubayb", "asim"], "dorar": 74, "asbab": [], "body_en": ["Aboo Hurayrah (may Allah be pleased with him) narrated that the Messenger of Allah sent a brigade of ten men as surveillants under the leadership of ‘Aasim ibn Thaabit al-Ansaaree, the grandfather of `Aasim ibn `Umar Al-Khattaab. They proceeded till they reached Hada’ah, a place between 'Usfaan, and Makkah. Their news reached a branch of the tribe of Hudhayl called Banee Lihyaan. About two-hundred men, who were all archers, hurried towards them and followed their tracks till they found the place where they had eaten dates, they had brought with them as a provision from al-Madeenah.", "They recognised the dates and said, ‘These are the dates of Yathrib (i.e., al-Madeenah),’ and they continued following their tracks. When `Aasim and his companions saw their pursuers, they went up a high place. The disbelievers encircled them and said to them, ‘Descend and surrender, and we promise and guarantee you that we will not kill any one of you.’ `Aasim ibn Thaabit; the commander of the Bigrade said, ‘By Allah! I will not come down to be under the protection of a disbeliever. O Allah! Convey our news to Your Prophet.’", "Then the disbelievers threw arrows at them till they martyred ‘Aasim along with six other men, while three men came down accepting their promise and convention, and among them were Khubayb al-Ansaaree and Ibn Dathinah and another man. After the disbelievers captured them, they undid the strings of their bows and tied them. The third (of the captives) said, ‘This is the first betrayal. By Allah! I will not go with you. No doubt these the martyred ones have set a good example for us.’ So, they dragged him and tried to compel him to accompany them, but as he refused, they killed him.", "They took Khubayb and Ibn Dathinah with them and sold them (as slaves) in Makkah (and all that took place) after the battle of Badr. Khubayb was bought by the sons of al-Haarith ibn 'Amir ibn Nawfal ibn `Abd al-Manaaf. It was Khubayb who had killed Al-Haarith ibn 'Aamir on the day (of the battle of) Badr, and Khubayb remained a prisoner with those people. Az-Zuhri narrated that 'Ubaydullah ibn 'Iyyaad told him that the daughter of Al-Haarith told him, ‘When those people gathered (to kill Khubayb) he borrowed a razor from me to shave his pubes and I gave it to him.", "Then he took a son of mine while I was unaware when he came upon him. I saw him placing my son on his thigh and the razor was in his hand. I got scared so much that Khubayb noticed the agitation on my face and said’, 'Are you afraid that I will kill him? No, I will never do so.’ ‘By Allah, I never saw a prisoner better than Khubayb. By Allah, one day I saw him eating of a bunch of grapes in his hand while he was chained in irons, and there was no fruit at that time in Makkah.’ The daughter of Al-Haarith used to say, ‘It was a bounty that Allah bestowed upon Khubayb.’", "When they took him out of the Sanctuary (Haram of Makkah) to kill him outside its boundaries, Khubayb requested them to let him offer two units of prayer. They allowed him and he offered two units and then he exclaimed, ‘Had not I been afraid that you would think that I fear (of being killed), I would have prolonged the prayer. O Allah, kill them all with no exception.’ He then recited poetically: ‘So long I am killed as a Muslim, I do not mind how I am killed in Allah's cause, for my killing is for Allah's sake; And if Allah wishes, He will bless the amputated parts of a torn body.’", "Then the son of al-Haarith killed him. It was Khubayb who set the tradition for any Muslim sentenced to death in captivity to offer a two-units prayer (before being killed). Allah fulfilled the invocation of `Aasim
