 forgive the sins of Abdullah ibn Qays (Aboo Moosa Al-Ash'aree) and admit him to an elevated place on the Day of Resurrection. Aboo Burda said: One prayer is for Aboo 'Aamir and the other is for Aboo Moosa.”"], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 103, "stage": 10, "title": "إِسلامُ عَمرِو بنِ العاصِ وخالدِ بنِ الوليدِ وعُثمانَ بنِ طلحةَ رضِي الله عنهم", "date": "صفر 8 هـ، الموافق 629م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدُ بنُ الوليدِ</span>: لمَّا أراد الله عزَّ وجلَّ ما أَراد مِنَ الخيرِ قذَف في قلبي الإسلامَ وحضَرني رُشدي, وقلتُ قد شَهِدتُ هذه المواطِنَ كُلَّها على محمَّدٍ صلَّى الله عليه وسلَّم فليس مَوطنٌ أَشهدُه إلَّا أَنصرِفُ وأنا أَرى في نَفْسي أنِّي في غيرِ شيءٍ وأنَّ محمَّدًا سيَظهرُ، فلمَّا خرَج رسولُ الله صلَّى الله عليه وسلَّم إلى الحُديبيةِ خَرجتُ في خيلِ المشركين فقمتُ بإزائِه في عُسْفانَ وتَعرَّضتُ له، فصلَّى بأصحابِه الظُّهرَ أمامَنا فهَمَمْنا أن نُغِيرَ عليه فلم نُمَكَّنْ منه, فصلَّى بأصحابِه صلاةَ العَصرِ صلاةَ الخَوفِ فوقع ذلك مِنَّا مَوقِعًا، وقلتُ: الرَّجلُ ممنوعٌ.", "فافْتَرقنا, فلمَّا صالح قُريشًا بالحُديبيةِ, ثمَّ دخَل رسولُ الله صلَّى الله عليه وسلَّم مكَّةَ في عُمرَةِ القَضاءِ طَلبَني فلم يَجِدْني، وكتَب إليَّ كِتابًا فيه: بسم الله الرَّحمن الرَّحيم أمَّا بعدُ، فإنِّي لم أَرَ أَعجبَ مِن ذِهابِ رَأيكِ عنِ الإسلامِ وعَقلِكَ, ومِثلُ الإسلامِ يَجهلُه أَحدٌ؟.", "ثمَّ سأل عَنِّي, فقِيلَ: له يأتي الله به. فقال: ما مِثلُه جَهِلَ الإسلامَ, ولو كان يجعل نِكايتَهُ مع المسلمين على المشركين كان خيرًا له، ولَقَدَّمْناهُ على غَيرِه. فلما جاءَني كِتابُه نَشَطْتُ للخُروجِ، وزادني رَغبةً في الإسلامِ، وسَرَّني سُؤالُه عَنِّي, فلمَّا أَجمعتُ الخُروجَ إلى رسولِ الله صلى الله عليه وسلم لَقِىيتُ عُثمانَ بنَ طلحةَ فعَرضتُ عليه الإسلامَ فأَسرعَ الإجابةَ، فخرج معي حتى انتهينا إلى الهَدةِ فوَجدْنا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> بها, فقال: مرحبًا بالقومِ.", "فقُلنا: وبِكَ. قال: إلى أين مَسيرُكُم؟ قُلنا: الدُّخولُ في الإسلامِ، واتِّباعُ محمَّدٍ صلَّى الله عليه وسلَّم. فقال: وذاك الذي أَقدَمني. فاصْطحَبْنا جميعًا حتَّى دخَلنا المدينةَ, فلَبِسْتُ مِن صالحِ ثِيابي ثمَّ عَمدتُ إلى رسولِ الله صلَّى الله عليه وسلَّم, وقد أُخبِرَ بِنا فَسُرَّ بقُدومِنا, فما زال يَتَبَسَّمُ حين رآني حتَّى وَقفتُ عليه، فسَلَّمتُ عليه بالنُّبُوَّةِ فرَدَّ عليَّ السَّلامَ بوَجْهٍ طَلْقٍ، فقلتُ: إنِّي أَشهدُ أن لا إلَه إلَّا الله، وأنَّك رسولُ الله.", "فقال الحمدُ لله الذي هَداك، قد كنتُ أَرى لك عَقلًا رَجَوْتُ أن لا يُسْلِمَكَ إلَّا إلى خيرٍ. قلتُ: يا رسولَ الله قد رأيتَ ما كنتُ أشهدُ مِن تلك المواطنِ عليك، فادعُ الله يَغفِرُها لي. فقال صلَّى الله عليه وسلَّم: الإسلامُ يَجُبُّ ما كان قَبلَهُ."], "url": "https://dorar.net/history/event/118", "route": null, "stations": null, "title_en": "The Islam of ‘Amr ibn al-‘Aas, Khaalid ibn al-Waleed, and ‘Uthmaan ibn Talhah (May Allah Be Pleased with Them).", "date_en": "Safar 8 AH (629 CE)", "place_en": "Madinah", "summary_en": "Khalid ibn al-Walid and Amr ibn al-As travelled to Madinah and accepted Islam before the Conquest of Makkah.", "people": ["khalid", "amr"], "dorar": 118, "asbab": [], "body_en": ["Khaalid bin Al-Waleed said, “When Allah, Exalted be He, willed the good for me, He allowed my heart to embrace Islam and gave me guidance. At that point of time, I said to myself, ‘I have witnessed all these occasions against Muhammad ﷺ. There is no occasion that I witness, but I return, and I perceive in myself that I am in nothing, while that Muhammad will prevail and be victorious. When the Messenger of Allah ﷺ set out to al-Hudaybiyah, I went out in a group of horsemen of the polytheists, and I stationed near his camp at ‘Usfaan. He prayed with his Companions the afternoon prayer in front of us. We intended to raid him, but we were not able to do so. He then performed the ‘Asr prayer, but it was performed in the form of the Prayer of Fear, with his Companions. That had a great impact on us, and I remarked, “The man is well fortified.” Thus, we parted. After the Messenger of Allah ﷺ made a pact with Quraysh at al-Hudaybiyah, he ﷺ entered Makkah on the occasion of 'Umrah al-Qadaa’, and he inquired about me, but he did not find me.", "He wrote to me a letter in which it was written: “By the Name of Allah, the Most Gracious, the Most Merciful. I wonder at nothing more than I wonder at your opinion of Islam and how your intellect did not lead you to Islam! How could a person be so ignorant about Islam?” Thereafter, he ﷺ asked about me, and he ﷺ was told, “Allah will bring him.” He ﷺ then remarked, “Anyone like him cannot be that ignorant about Islam. And if he were to put his vengeance with the Muslims against the polytheists, it would have been better for him; and we would have given him precedence (in commandeering) over others.”", "When his letter reached me, I became actively willing to set out [to him] and it increased me in interest towards Islam and his inquiry regarding me really delighted me. When I resolved to set out to the Messenger of Allah ﷺ I met with ‘Uthmaan bin Talhah. I presented Islam to him, and he hastily responded positively to it. He set out with me until we reached Al-Hadah, and we found ‘Amr ibn Al-Aas there. Upon seeing us, he said, “Welcome, people!” We replied, “It is great to meet you!” He asked, “What is your destination?”", "We replied, “[We are travelling] to enter into Islam and follow Muhammad ﷺ. He remarked, “And that is the exact reason that brought me here.” We accompanied each other until we arrived at al-Madeenah. I wore my best clothes, then I proceeded to the Messenger of Allah ﷺ. He was already informed about us, and he ﷺ was delighted by our arrival. He kept on smiling when he ﷺ saw me until I stood up in front of him. I greeted him with the address of [his prophethood], he ﷺ replied to my greeting with a smiling face. I professed, “I bear witness that there is no God but Allah and that you are the Messenger of Allah.” He replied, “All praises are due to Allah Who guided you, I saw that you had an intellect and I hoped that it does not submit you to anything but good.” I said, “O Messenger of Allah, you have seen what I used to be present in, meaning, on those occasions of war, against you; so, please supplicate to Allah that He forgives me those sins.” The Prophet ﷺ replied, “Islam abolishes all that was before it.”"], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 104, "stage": 10, "title": "سَرِيَّةُ غالبِ بنِ عبدِ الله اللَّيثيِّ إلى أَصحابِ بَشيرِ بنِ سعدٍ بفَدَكٍ", "date": "صفر 8 هـ، الموافق 629م", "place": "فدك", "lat": 25.98, "lng": 40.47, "approx": false, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم إلى مُصابِ أَصحابِ بَشيرِ بنِ سعدٍ بفَدَكٍ سَرِيَّةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ghalib\">غالبِ بنِ عبدِ الله</span>، في مِائتي رجلٍ؛ فأصابوا مِن بني مُرَّةَ نَعَمًا، وقتلوا منهم قَتْلى."], "url": "https://dorar.net/history/event/119", "route": null, "stations": null, "title_en": "The Expedition of Ghaalib ibn ‘Abd Allah al-Laythee to Avenge for the Killing of the Companions of Basheer ibn Sa’d at Fadak.", "date_en": "Safar 8 AH (629 CE)", "place_en": "Fadak", "summary_en": "Ghalib ibn Abdullah led two hundred men to Fadak after the companions of Bashir ibn Sa'd were killed there.", "people": ["ghalib"], "dorar": 119, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched to the afflicted companions of Basheer ibn Sa’d at Fadak the brigade of Ghaalib ibn Abdullah, with two hundred men. The Muslims captured livestock from Banoo Murrah, and killed some of them."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 105, "stage": 10, "title": "سَرِيَّةَ كعبِ بنِ عُميرٍ الأنصاريِّ إلى بني قُضَاعَةَ", "date": "ربيع الأول 8 هـ، الموافق 629م", "place": "ذات أطلاح", "lat": 30.5, "lng": 36.0, "approx": true, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةَ ذاتِ أطلح بقِيادةِ كعبِ بنِ عُميرٍ الأنصاريِّ في خمسةَ عشرَ رجلًا إلى بني قُضَاعَةَ؛ حيث كانت قد حَشدتْ جُموعًا كَبيرةً للإغارَةِ على المسلمين، فلَقوا العَدُوَّ، فدَعَوْهُم إلى الإسلامِ، فلم يَستَجيبوا لهم، وأَرشَقوهُم بالنَّبْلِ حتَّى قُتِلوا كُلُّهم إلَّا رجلًا واحدًا، فقد ارْتُثَّ مِن بين القَتْلى."], "url": "https://dorar.net/history/event/120", "route": null, "stations": null, "title_en": "Dispatching an Expedition to Dhaat Adtlah to Fight Banoo Qudaa’ah", "date_en": "Rabi al-Awwal 8 AH (629 CE)", "place_en": "Dhat Atlah", "summary_en": "Ka'b ibn Umayr led fifteen men to Dhat Atlah against Quda'ah, who had gathered to attack the Muslims.", "people": [], "dorar": 120, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched a campaign made up of fifteen fighters under the command of Ka’b ibn ‘Umayr al-Ansaaree to Bano Quda’ah. The reason for this expedition was to eliminate the danger of Banoo Qudaa’ah who mobilised a big group of people in order to attack the Muslims. The expedition invited them to Islam, but they declined and refused. After hearing their response, The Muslims threw arrows at them until they killed all of them, except for one man who was badly wounded and carried away amidst the dead."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 106, "stage": 10, "title": "سَرِيَّةُ شُجاعِ بنِ وَهْبٍ رضِي الله عنه إلى بني هَوازِنَ", "date": "ربيع الأول 8 هـ، الموافق 629م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["كانت بنو هَوازِنَ قد مَدَّتْ يدَ المَعونَةِ لأعداءِ المسلمين مِرارًا, فأَرسلَ إليهم رسولُ الله صلى الله عليه وسلم شُجاعَ بنَ وَهْبٍ الأَسديَّ في خمسةٍ وعشرين رجلًا، وهم بالسِّيِّ, ناحيةَ رُكْبَةَ, مِن وراءِ المَعدِن, وهي مِنَ المدينةِ على خمسِ ليالٍ، وأَمرهُ أن يُغِيرَ عليهم, فكان يَسيرُ اللَّيلَ ويكَمُنُ النَّهارَ, حتَّى صَبَّحَهُم وهُم غارون، وقد أَوعزَ إلى أصحابِه ألَّا يُمْعِنوا في الطَّلَبِ، فأصابوا نَعَمًا كَثيرًا وشاءً, ولم يَلقوا كَيْداً, واسْتاقوا ذلك حتَّى قَدِموا المدينةَ, واقْتسَموا الغَنيمةَ, فكانت سهمانهم خمسةَ عشرَ بَعيرًا لِكُلِّ رَجلٍ, وعَدلوا البَعيرَ بِعشرٍ مِنَ الغَنَمِ، وكان مَغيبُهم خمسَ عشرةَ ليلةً."], "url": "https://dorar.net/history/event/121", "route": null, "stations": null, "title_en": "The Expedition of Shuj’aa ibn Wah to Banoo Hawaazin", "date_en": "Rabi al-Awwal 8 AH (629 CE)", "place_en": "Madinah", "summary_en": "Shuja ibn Wahb led twenty-five men against Hawazin at al-Siyy, who had repeatedly helped the Muslims' enemies.", "people": [], "dorar": 121, "asbab": [], "body_en": ["The tribe of Banoo Hawazin had extended a helping hand to the enemies of the Muslims on several occasions. In response, the Messenger of Allah ﷺ dispatched a military campaign made up of twenty-five men under the leadership of Shujaa’ ibn Wahb al-Asa’dee. The tribe was based in an area called as-Siyy, near Rukbah, behind al-Mi’din, which is situated at the distance of five nights journey from al-Madeenah. He ﷺ commanded him to mount a raid on them. He marched towards their location, travelling by night and hiding during the day.", "He reached them in the morning while they were sleeping. He gave orders to his companions not to overdo in their pursuit. They captured a lot of camels and sheep and did not encounter any resistance. They drove them away with them until they reached al-Madeenah. They distributed the booty amongst them. Their share comprised of fifteen camels for each person, and they equated a camel with ten sheep. Their absence lasted for fifteen nights."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 107, "stage": 10, "title": "غَزوةُ مُؤْتَةَ", "date": "جمادى الأول 8 هـ، الموافق 629م", "place": "مؤتة", "lat": 31.087, "lng": 35.699, "approx": false, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةً في ثلاثةِ آلافِ مُقاتلٍ على الجيشِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارثةَ</span>، فإن أُصيبَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">فجَعفرُ</span> بنُ أبي طالبٍ، فإنْ أُصيبَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">فعبدُ اللهِ بنُ رَواحةَ</span>، وشَيَّعهُم رسولُ الله صلى الله عليه وسلم ووَدَّعهُم، ثمَّ انْصرَف ونهَضوا، فلمَّا بلغوا مَعانَ مِن أرضِ الشَّامِ، أَتاهُم الخبرُ: أنَّ هِرقلَ مَلِكَ الرُّومِ قد نزل أرضَ بني مآبٍ، -أرضَ البَلقاءِ- في مائةِ ألفٍ مِنَ الرُّومِ، ومائةِ ألفٍ أُخرى مِن نَصارى أهلِ الشَّامِ، فأقام المسلمون في مَعانَ لَيلتينِ، يتَشاوَرون في أمرِ اللِّقاءِ بِعَدُوِّهِم البالغِ مِائتي ألفٍ فقالوا: نَكتُب إلى رسولِ الله صلى الله عليه وسلم نُخبِرُهُ بعَددِ عَدُوِّنا، فيَأمُرنا بأَمرِهِ أو يُمِدُّنا.", "فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدُ الله بنُ رَواحةَ</span>: يا قومُ، إنَّ الذي تَكرَهون لَلَّتِي خَرجتُم تَطلُبون -يعني الشَّهادةَ- وما نُقاتِلُ النَّاسَ بِعدَدٍ ولا قُوَّةٍ، وما نُقاتِلُهُم إلَّا بهذا الذي أَكرَمَنا الله به، فانْطَلِقوا فهي إحدى الحُسْنَيينِ: إمَّا ظُهورٌ، وإمَّا شَهادةٌ. فَوافقَهُ الجيشُ على هذا الرَّأيِ ونهَضوا، حتَّى إذا كانوا بتُخومِ البَلقاءِ لَقوا بعضَ الجُموعِ التي مع هِرقلَ بالقُربِ مِن قريةٍ يُقالُ لها: مُؤْتَةُ.", "فاقتَتَلوا، فقُتِلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارثةَ</span>، فأخَذ الرَّايةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جعفرُ</span> بنُ أبي طالبٍ، فقاتَل حتَّى قُطِعَتْ يَمينُه، فأخَذ الرَّايةَ بِيُسْراهُ فقُطِعَتْ، فاحْتضَنَها فقُتِلَ كذلك، فأخَذ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدُ الله بنُ رَواحةَ</span> الرَّايةَ، وتَرَدَّدَ عنِ النُّزولِ بعضَ التَّرَدُّدِ، ثمَّ صَمَّمَ، فقاتَل حتَّى قُتِلَ، فأخَذ الرَّايةَ ثابتُ بنُ أَقرمَ، وقال: يا مَعشرَ المسلمين، اصْطَلِحوا على رجلٍ منكم.", "فقالوا: أنت. قال: لا. فاصطَلَح النَّاسُ على <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدِ بنِ الوليدِ</span>، فلمَّا أخَذ الرَّايةَ دافَع القَومَ وحاشى بهِم، ثمَّ انْحازَ وانْحِيزَ عنه، حتَّى انْصرَف بالنَّاسِ، فتَمَكَّنَ مِنَ الانْسِحابِ بمَن معه مِنَ المسلمين، قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدُ بنُ الوليدِ</span>: لقد انقْطَعَتْ في يَدي يومَ مُؤْتَةَ تِسعةُ أَسيافٍ فما بَقِيَ في يَدي إلَّا صَفيحةٌ يَمانِيَّةٌ».", "وهذا يقتضي أنَّهم أثْخَنوا فيهم قَتْلًا، ولو لم يكن كذلك لَما قَدَروا على التَّخَلُّصِ منهم، ولهذا السَّببِ ولِغيرِهِ ذهَب بعضُ المُحقِّقين إلى أنَّ المسلمين قد انتصروا في هذه المعركةِ ولم يُهزَموا. عن أنسٍ رضي الله عنه: أنَّ النَّبيَّ صلى الله عليه وسلم، نَعَى زيدًا، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">وجعفر</span>ًا، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">وابنَ رَواحةَ</span> للنَّاسِ، قبلَ أن يَأتِيَهُم خَبرُهُم، فقال: «أخَذ الرَّايةَ زيدٌ فأُصيبَ، ثمَّ أخَذ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جعفرٌ</span> فأُصيبَ، ثمَّ أخَذ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">ابنُ رَواحةَ</span> فأُصيبَ، وعَيناهُ تَذْرِفانِ حتَّى أخَذ سيفٌ مِن سُيوفِ الله حتَّى فتَح الله عليهم»."], "url": "https://dorar.net/history/event/122", "route": [[24.4672, 39.6111], [26.6, 38.0], [28.3838, 36.555], [31.087, 35.699]], "stations": null, "title_en": "The Battle of Mu’tah", "date_en": "Jumada al-Ula 8 AH (629 CE)", "place_en": "Mutah", "summary_en": "Three thousand Muslims under Zayd ibn Harithah, then Ja'far, then Abdullah ibn Rawahah faced a much larger Byzantine force at Mu'tah. All three commanders were martyred, and Khalid ibn al-Walid withdrew the army.", "people": ["rawaha", "khalid", "jafar", "zayd"], "dorar": 122, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched an army consisting of three thousand fighters, and appointed Zayd bin Haarithah as the commander of the army. The Messenger of Allah ﷺ stated that if Zayd is martyred, then Ja’far ibn Abee Taalib will take over. And if he is martyred, then Abdullah ibn Rawaahah takes over. Then the Messenger of Allah ﷺ accompanied them in their departure and bade them farewell, then he ﷺ returned. They started the journey, marching forward. When they reached Ma’aan, part of the lands of the Levant (i.e. Jordan), they received the news that Heraclius, the king of the Romans, stationed in the land of Banee Ma’aab - the land of al-Balqaa’ - with a hundred thousand Romans and with another hundred thousand Christians from the people of the Levant.", "The Muslims camped in Ma'aan for two nights, consulting about the matter of meeting their two-hundred-thousand enemy. They said, “We should write to the Messenger of Allah ﷺ informing him of the number of our enemy, thereafter he may order us with his command or provide us with reinforcements. Abdullah ibn Rawaahah remarked, “O my people, what you dislike is exactly what you set out to seek - meaning martyrdom - and we do not fight people with numbers or strength, and we do not fight them except with this which Allah has honoured us with. So, march forward. It is either one of the two things: either victory or either martyrdom.” The Muslim army agreed on this opinion, and they rose to march forward. When they arrived at the borders of al-Balqaa’, they met some of the fighters that were with Heraclius near a town called Mu’tah. They fought with each other and Zayd ibn Haarithah was martyred during the combat. Then, Ja’far ibn Abee Taalib took the flag, then he fought until his right hand was cut off; so, he took the flag in his left hand, that hand was also cut; thereafter, he clenched it on his chest.", "He kept fighting until he was also martyred. Thereafter, Abdullah ibn Rawaahah took the flag. He somewhat hesitated, then resolved to do so, and fought until he was martyred. Thereafter, Thaabit ibn Aqram took the flag, and said, “O Muslims, reconcile with the leadership of a person amongst you. They replied, “You [take the command].” He answered, “No.” So, the people reconciled with the leadership of Khaalid ibn al-Waleed. When he took the flag, he repelled the enemy and fought them bravely. Then, he took a side and the enemy withdrew from him, until he managed to withdraw with those who were with him among the Muslims. Khaalid ibn al-Walid recalled the event and said, “Nine swords were broken in my hand on the Day of Mu’tah, and what remained in my hand was nothing but a Yemeni blade.” This statement requires that the Muslims killed so many of their enemies; and if that was not the case, they would not have been able to escape from them.", "For this reason and other reasons than that, some verifiers concluded that the Muslims had won in this battle and were not defeated. On the authority of Anas, may Allah be pleased with him, that the Prophet ﷺ informed the people of the death of Zayd, Ja’far, and Ibn Rawaahah beforehand [learning about it through revelation], before receiving their actual news. He ﷺ said, “Zayd has held the flag, and he has been martyred. Thereafter, Ja’far has taken the flag and he has been martyred. Then, Ibn Rawaahah has taken the flag, and he has also been martyred - his eyes were filled with tears – now a sword among the swords of Allah has taken the flag until Allah granted them victory.”"], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 108, "stage": 10, "title": "غَزوةُ ذاتِ السَّلاسِلِ", "date": "جمادى الآخر 8 هـ، الموافق 629م", "place": "ذات السلاسل", "lat": 27.5, "lng": 37.5, "approx": true, "zoom": 8, "paras": ["كانت بعدَ غزوة مُؤْتَةَ، وسُمِّيتْ ذاتَ السَّلاسِلِ لأنَّها وقعت بالقُرْبِ مِن ماءٍ يُقالُ له: السَّلْسَلُ. بلَغ النَّبيَّ صلى الله عليه وسلم أنَّ جمعًا مِن قُضاعةَ تَجَمَّعوا وأَرادوا أن يَدنوا مِن أَطرافِ المدينةِ فَدعا النَّبيُّ صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> فعقَد له لِواءً أَبيضًا وبَعثَهُ في ثلاثمائةٍ مِن سَراةِ المُهاجرين والأنصارِ، فكان أَميرُها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> رضي الله عنه.", "قال عَمرٌو: بعَث إليَّ رسولُ الله صلى الله عليه وسلم فقال: خُذْ عليك ثِيابَك وسِلاحَك ثمَّ ائْتِني. فأَتيتُه وهو يتَوضَّأُ، فصَعَّد فِيَّ النَّظرَ، ثمَّ طَأْطَأَ، فقال: إنِّي أُريدُ أن أَبعثَكَ على جَيشٍ، فيُسَلِّمَك الله ويُغْنِمَك، وأَرْغَبُ لك مِنَ المالِ رَغبةً صالِحةً، قال: قلتُ: يا رسولَ الله، ما أَسلمتُ مِن أجلِ المالِ، ولكنِّي أَسلمتُ رَغبةً في الإسلامِ، وأن أكونَ مع رسولِ الله صلى الله عليه وسلم، فقال: يا عَمرُو، نِعْمَ المالُ الصَّالحُ للمَرءِ الصَّالحِ ).", "وفي الغَزوةِ سأَلهُ أصحابُه أن يُوقِدوا نارًا فمَنعَهُم فكَلَّموا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبا بكرٍ</span> فكَلَّمهُ في ذلك فقال: لا يُوقِدُ أحدٌ منهم نارًا إلَّا قَذفْتُه فيها. قال: فلَقوا العَدُوَّ فهَزموهُم فأرادوا أن يَتَبَعوهُم فمنَعهُم، فلمَّا انصرَف ذلك الجيشُ ذَكَروا للنَّبيِّ صلى الله عليه وسلم وشَكَوْهُ إليه، فقال: يا رسولَ الله، إنِّي كَرِهتُ أن آذنَ لهم أن يُوقِدوا نارًا فيَرى عَدُوُّهم قِلَّتَهُم، وكَرِهتُ أن يَتْبَعُوهم فيكونُ لهم مَدَدٌ فيَعْطِفوا عليهم.", "فحمِد رسولُ الله صلَّى الله عليه وسلَّم أَمْرَهُ...). وفيها صلَّى عَمرٌو بالنَّاسِ وهو جُنُبٌ ومعه ماءٌ، لم يَزِدْ على أن غسَل فَرْجَهُ وتَيمَّمَ، فلمَّا قَدِمَ عَمرٌو على رسولِ الله صلى الله عليه وسلم سأَلهُ عن صلاتِه، فأَخبرَهُ فقال: والذي بعثَك بالحقِّ لو اغْتسَلتُ لَمُتُّ، لم أَجِدْ بَردًا قَطُّ مِثلَهُ، وقد قال الله عزَّ وجلَّ: <span class=\"verse\">﴿وَلَا تَقْتُلُوا أَنْفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾</span> <span class=\"ref\">[النساء: ٢٩]</span>، فضَحِك رسولُ الله صلى الله عليه وسلم، ولم يَقُلْ له شيئًا."], "url": "https://dorar.net/history/event/123", "route": null, "stations": null, "title_en": "The Battle of Chains (Dhaat al-Salaasil)", "date_en": "Jumada al-Akhirah 8 AH (629 CE)", "place_en": "Dhat al-Salasil", "summary_en": "Hearing that Quda'ah were gathering near Madinah's borders, the Prophet ﷺ sent Amr ibn al-As to Dhat al-Salasil and later reinforced him.", "people": ["amr", "abubakr"], "dorar": 123, "asbab": [], "body_en": ["This battle took place after the Battle of Mu’tah and the reason it is called Dhat al-Salasil is that it took place near a water source called Al-Salsal. The intelligence of the Prophet ﷺ reported to him that a group from the tribe of Banoo Qudaa’ah were rallying up to attack al-Madeenah and heading towards it. In response, the Prophet ﷺ dispatched an expedition made up of 300 fighters from the Emigrants and Ansaar, led by ‘Amr ibn al-‘Aas. He ﷺ handed him the flag of the expedition. About this event, ‘Amr ibn al-‘Aas reported: “The Messenger of Allah ﷺ ordered me to collect my weapons and clothing and then come to him. I came to him when he ﷺ was performing ablution. He looked thoughtfully and then lowered his head and he ﷺ said, “O ‘Amr! I want to dispatch you on a matter in which Allah will keep you safe and grant you booty, and I shall make you an allotment from the spoil.” I replied, “O Messenger of Allah! My emigration was not for the sake of property but was only for my interest in Islam and to be in the company of Allah’s Messenger.”", "He said, “The best of good property is that which is owned by a righteous man.” Before the battle started, his companions asked him to set some fire [because the night was cold] and asked Aboo Bakr to talk with him about it. However, he refused and said if any one of them set a fire, I would throw him into it. After the two armies engaged in fight, the Muslims defeated their enemy and they wanted to go in their pursuit, but he prevented them from doing so. After their return to al-Madeenah, they mentioned to the Prophet ﷺ the incident and complained to him about his decision.", "His response was: “O Messenger of Allah! I disliked letting them setting a fire because I feared our enemy would notice our little number and forbid them from pursuing them because I feared that they may have reinforcements and then take us over.” Upon hearing this, the Prophet ﷺ commended his decision. During this battle, ‘Amr led the prayer while he was in a state of major impurity and all he did was wash his private member and performed dry ablution (taymammum) although he had water. After he returned, he inquired about the validity of his prayer and said to the Prophet ﷺ: “By the One who has sent you with the Truth! Had I taken a bath, I would have been dead. It was so cold such that I never experienced anything like it before. And, Allah, Most High, said: {Do not kill yourselves, for Allah is indeed merciful to you} [Quran 6:29]. Thereupon, the Prophet ﷺ laughed and did not comment on the incident."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 109, "stage": 10, "title": "سَرِيَّةُ أبي عُبيدةَ بنِ الجَرَّاحِ رضِي الله عنه إلى سِيفِ البَحرِ", "date": "رجب 8 هـ، الموافق 629م", "place": "سيف البحر", "lat": 24.9, "lng": 38.1, "approx": true, "zoom": 8, "paras": ["بعَث رسولُ اللّه صلَّى اللّه عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبيدةَ</span> بنَ الجَرَّاحِ على رأسِ ثلاثمائةِ رجلٍ إلى سِيفِ البَحرِ, وكان الغَرَضُ مِن هذه السَّرِيَّةِ رَصْدَ عِيرٍ لقُريشٍ، ومُحارَبةَ حَيٍّ مِن جُهينةَ, وزَوَّدَهُم جِرابًا مِن تمرٍ, فجعل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبو عُبيدةَ</span> يَقُوتُهُم إيَّاهُ, حتَّى صار إلى أن يَعُدَّهُ لهم عددًا, حتَّى كان يُعطي كُلَّ رجلٍ منهم كُلَّ يومٍ تمرةً, فقَسَمَها يومًا فنَقصَتْ تمرةٌ عن رجلٍ, فوَجَد فَقْدَها ذلك اليومَ, فلمَّا نَفَدَ ما كان معهم مِنَ الزَّادِ أَكلوا الخَبَطَ وهو وَرَقُ السَّلِمِ, فسُمِّيَ الجيشُ لذلك \"جيشَ الخَبَطِ\"، وأصابَهُم جوعٌ شَديدٌ, فنَحَرَ قيسُ بنُ سعدِ بنِ عُبادةَ -وكان أحدَ جُنودِ هذه السَّرِيَّةِ- ثلاثَ جَزائِرَ، ثمَّ نَحَرَ ثلاثَ جَزائِرَ، ثمَّ نَحَرَ ثلاثَ جَزائِرَ، ثمَّ إنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبيدةَ</span> نَهاهُ، فأَلقى إليهم البَحرُ دابَّةً يُقالُ لها: العَنْبَرُ، فأكلوا منها عِشرين ليلةً، وادَّهَنوا منه, حتَّى ثابَتْ منه أَجسامُهم، وصَلحتْ، وأخَذ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبو عُبيدةَ</span> ضِلعًا مِن أَضلاعِه فنظَر إلى أَطولِ رجلٍ في الجيشِ وأَطولِ جَملٍ فحُمِلَ عليه ومَرَّ تَحتَهُ، وتَزوَّدوا مِن لَحمِه وَشَائِقَ، فلمَّا قَدِموا المدينةَ، أَتَوْا رسولَ الله صلى الله عليه وسلم فذَكَروا له ذلك، فقال: \"هو رِزقٌ أَخرَجهُ الله لكم، فهل معكم مِن لَحمِه شيءٌ تُطْعِمونا؟). فأَرسلوا إلى رسولِ الله صلى الله عليه وسلم منه فأَكلَهُ\"."], "url": "https://dorar.net/history/event/124", "route": null, "stations": null, "title_en": "The Expedition of Aboo ‘Ubaydah ibn al-Jarraah to Sayf al-Bahr", "date_en": "Rajab 8 AH (629 CE)", "place_en": "Red Sea coast", "summary_en": "Abu Ubaydah led three hundred men to the Red Sea coast. When their food ran out they lived on leaves, until the sea cast up a huge whale that fed them.", "people": ["abuubayda"], "dorar": 124, "asbab": [], "body_en": ["The Prophet ﷺ dispatched an expedition made up of three hundred men under the command of Aboo ‘Ubaydah ibn al-Jarraah (may Allah be pleased with him) to the coastline. The objective of this bigrade was to intercept a caravan belonging to Quraysh and fight a group of people from Juhaybah. He ﷺ provided them a sack filled with dates that Aboo ‘Ubaydah supervised its distribution between his men to ensure it can suffice them. He kept giving them their daily ration in small amounts from it, till it was exhausted. The share of every one of them used to be as little as one date only – due to the lack of supplies with them.", "One day, he divided the dates between his men so that each one could get only one date, but he was one date short. After they consumed all the dates and had nothing left to eat, they had to eat the leaves of a tree called al-Khabt, and because of which, they were called the Detachment of al-Khabt. They experienced extreme hunger that made Qays ibn Sa’d ibn ‘Ubaadah – one of the soldiers in this expedition, slaughter three camels, then slaughter another three camels, and finally, he slaughtered three more camels to feed the platoon.", "Thereupon, Aboo ‘Ubaydah ordered him to stop it. When they reached the sea-shore, they saw a huge fish, called al-‘Anbar, which was like a small mountain that the army ate from for twenty days and rubbed its fat on their bodies until their bodies became stout. Then, Aboo 'Ubaydah caught hold of one of its ribs and fixed that up. He then casted a glance at the tallest man of the army and the highest of the camels, then made him ride over that, and that man passed beneath the rib without touching it. After, they extracted many pitchers of meat and fat from this sea-fish and added it to their supplies.", "After their return to al-Madeenah, they mentioned the story to the Prophet ﷺ who said: “It is a provision which Allah has brought forth for you! Do you have any meat of it with you so I can eat from it?” So, they sent some of it to the Messenger of Allah ﷺ and he ate it."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 110, "stage": 10, "title": "سَرِيَّةُ أبي قَتادةَ الأَنصاريِّ إلى خَضِرَة", "date": "شعبان 8 هـ، الموافق 629م", "place": "خضرة (نجد)", "lat": 24.8, "lng": 41.2, "approx": true, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم أبا قَتادةَ بنَ رِبْعِيٍّ رضي الله عنه في سَرِيَّةٍ إلى خَضِرَة؛ وذلك لأنَّ بني غَطَفَانَ كانوا يَحْتَشِدون في خَضِرَة -وهي أرضُ مُحَارِبٍ بِنَجْدٍ- فبعَثهُ صلى الله عليه وسلم في خمسةَ عشرَ رجلًا، فقَتَلَ منهم، وسَبَى وغَنِمَ، وكانت غَيبتُه خمسَ عشرةَ ليلةً."], "url": "https://dorar.net/history/event/125", "route": null, "stations": null, "title_en": "The Expedition of Aboo Qataadh al-Ansaaree to Khidrah", "date_en": "Shaban 8 AH (629 CE)", "place_en": "Khadirah (Najd)", "summary_en": "Abu Qatadah led an expedition to Khadirah in Najd, where Ghatafan were gathering.", "people": [], "dorar": 125, "asbab": [], "body_en": ["The Prophet ﷺ dispatched a military campaign under the leadership of Aboo Qataadah ibn Rib’yy (may Allah be pleased with him) to Khidrah where the tribe of Banoo Ghatafaan were gathered, preparing to attack the Muslims. The location of this area is in Najd, and it is the land of Muhaarib. The military detachment was made up of 15 men who managed to slay many of their enemy and capture their livestock and people. This expedition was absent from al-Madeenah for 15 nights."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 111, "stage": 10, "title": "سَرِيَّةُ أبي قَتادةَ رضِي الله عنه إلى بَطْنِ إِضَمٍ", "date": "رمضان 8 هـ، الموافق 630م", "place": "بطن إضم", "lat": 24.9, "lng": 39.2, "approx": true, "zoom": 8, "paras": ["لمَّا نَقضَتْ قُريشٌ ومَن معها العهدَ الذين الذي بينهم وبين المسلمين في الحُديبيةِ عزَم رسولُ الله صلى الله عليه وسلم على المَسيرِ إليهم، أمَر النَّاسَ بالجِهازِ وأَعلمَهُم أنَّه سائِرٌ لمكَّةَ، وقال: (اللَّهمَّ خُذِ العُيونَ والأَخبارَ عن قُريشٍ حتَّى نَبْغَتَها في بِلادِها).", "وزِيادةٌ في الإخفاءِ والتَّعمِيَةِ بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةً قَوامُها ثَمانيةُ رِجالٍ، تحت قِيادةِ أبي قَتادةَ بنِ رِبْعِيٍّ، إلى بَطْنِ إِضَمٍ، فيما بين ذي خَشَبٍ وذي المَروَةِ، على ثلاثةِ بُرُدٍ مِنَ المدينةِ، في أوَّلِ هذا الشَّهرِ الكريمِ؛ لِيَظُنَّ الظَّانُ أنَّه صلى الله عليه وسلم يتَوَجَّهُ إلى تلك النَّاحيةِ، ولِتذهَبَ بذلك الأَخبارُ، وواصلت هذه السَّرِيَّةُ سَيْرَها حتَّى إذا وصلت حيثما أُمِرَتْ بلَغها أنَّ رسولَ الله صلى الله عليه وسلم خرَج إلى مكَّةَ، فسارت إليه حتَّى لَحِقْتُه."], "url": "https://dorar.net/history/event/126", "route": null, "stations": null, "title_en": "The Expedition of Aboo Qataadah (May Allah Be Pleased with Him) to Batn and Idam.", "date_en": "Ramadan 8 AH (630 CE)", "place_en": "Batn Idam", "summary_en": "When Quraysh broke the truce of Hudaybiyyah, the Prophet ﷺ prepared to march on Makkah in secret. To mislead observers he sent a small party under Abu Qatadah toward Batn Idam; when it learned he had set out for Makkah, it rejoined him on the way.", "people": [], "dorar": 126, "asbab": [{"id": "ASB-049", "k": "d"}], "body_en": ["After Quraysh breached the truce treaty that it signed with the Muslims at al-Hudaybiyyah, the Messenger of Allah was determined to launch a military campaign against them. He ﷺ ordered the people to prepare for war and informed them that they are heading to Makkah. He ﷺ said to them: “O Allah, keep their scouts and our news away from Quraysh so we can take them by surprise upon our arrival at their land.” To ensure their cover and keeping their intent unknown, he ﷺ dispatched a brigade made up of eight fighters under the leadership of Aboo Qataadah ibn Rib’iee to Batn Idam, which is a place located between Dhee Khashab and Dhee Marwah that is situated thirty-six miles away from al-Madeenah.", "The brigade travelled at the beginning of the month to keep their actual destination unknown to give people the impression that he ﷺ was planning to attack that place so Quraysh receives this news. While the brigade was heading towards that place, the Muslim army marched towards Makkah and then followed them."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 112, "stage": 10, "title": "غَزوةُ فَتحِ مكَّةَ", "date": "رمضان 8 هـ، الموافق 630م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كان سببُها أنَّ المشركين نقَضوا العهدَ الذي بينهم وبين رسولِ الله صلى الله عليه وسلم، فأَغاروا على إحدى القَبائلِ المُحالفةِ للرَّسولِ عليه الصَّلاةُ والسَّلامُ، وهي قَبيلةُ خُزاعةَ، ولمَّا عَلِمَ النَّبيُّ صلى الله عليه وسلم بالأَمرِ أَمَرَ النَّاسَ بالتَّجَهُّزِ دون أن يُخبِرَهُم بوِجْهَتِه، ثمَّ مضى حتَّى نزَل بمَرِّ الظَّهرانِ وهو وادٍ قَريبٌ مِن مكَّةَ.", "فعنِ ابنِ عبَّاسٍ رضِي الله عنهما: أنَّ النَّبيَّ صلى الله عليه وسلم خرَج في رَمضانَ مِنَ المدينةِ ومعه عشرةُ آلافٍ، وذلك على رأسِ ثمانِ سِنين ونِصفٍ مِن مَقْدَمِه المدينةَ، فسار هو ومَن معه مِنَ المسلمين إلى مكَّةَ، يَصومُ ويَصومون، حتَّى بلَغ الكَدِيدَ، وهو ماءٌ بين عُسْفانَ، وقُدَيْدٍ أَفطَر وأَفطَروا.", "وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> قد رَأى جيشَ النَّبيِّ صلى الله عليه وسلم قبلَ دُخولِه مكَّةَ، فهالَهُ ما رَأى، ثمَّ أَسلَم في أثناءِ ذلك، ثمَّ جاء إلى قومِه وصرَخ فيهم مُحذِّرًا لهم بأن لا قِبَلَ لهم بِجيشِ محمَّدٍ صلى الله عليه وسلم، وقال لهم ما قاله عليه الصَّلاةُ والسَّلامُ: مَن دخَل دارَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبي سُفيانَ</span> فهو آمِن، ومَن أَغلَق عليه دارَهُ فهو آمِن، ومَن دخَل المسجِدَ فهو آمِن.", "فتَفرَّقَ النَّاسُ إلى دورِهِم وإلى المسجِدِ. وعن عائشةَ رضي الله عنها: أنَّ النَّبيَّ صلى الله عليه وسلم دخَل عامَ الفتحِ مِن كَداءٍ التي بأعلى مكَّةَ. وقد أَهدَر النَّبيُّ صلى الله عليه وسلم دَمَ بعضِ المشركين يومَ الفتحِ، ووجَد عليه الصَّلاةُ والسَّلامُ حولَ البيتِ ثلاثمائةٍ وسِتِّين نُصُبًا، فجعل يَطعنُها بِعودٍ في يَدِه ويقولُ: (جاء الحقُّ وزَهَقَ الباطلُ، جاء الحقُّ، وما يُبْدِئُ الباطلُ وما يُعيدُ).", "وقد تَفاوَتت الرِّواياتُ في مُدَّةِ إقامتِه صلى الله عليه وسلم عامَ الفتحِ، و الأرجحُ -والله أعلم- أنَّها كانت تِسعةَ عشرَ يومًا."], "url": "https://dorar.net/history/event/127", "route": [[24.4672, 39.6111], [23.5, 39.25], [22.35, 39.3], [21.75, 39.65], [21.4225, 39.8262]], "stations": null, "title_en": "The Conquest of Makkah", "date_en": "Ramadan 8 AH (630 CE)", "place_en": "Makkah", "summary_en": "The Prophet ﷺ entered Makkah with ten thousand men, with almost no fighting, cleared the Kaaba of idols, and pardoned its people.", "people": ["abusufyan"], "dorar": 127, "asbab": [{"id": "TAF-18", "k": "d"}], "body_en": ["The Quraysh of Makkah broke their pact of Hudaybiyyah with the Prophet (PBUH) by killing some of the men of the Khuzaa’ah tribe with whom the Prophet ﷺ had a treaty. After learning of this incident, the Prophet ﷺ ordered the people to prepare for a war without informing them of his destination. The Prophet ﷺ set out with his forces until he reached the valley of Marr al-Dhahraan, which is situated near Makkah. It is reported on the authority of Ibn ‘Abbaas (may Allah be pleased with him) that the Prophet ﷺset out in the month of Ramadan with his forces of 10,000 men, after 8.5 years from his arrival to al-Madeenah.", "He ﷺ marched with his forces while all of them were fasting until they reached a place between ‘Usfaan and Qudayd, which is a water source called al-Kadeed. There, they broke their fast. Before reaching Makkah, Aboo Sufyaan witnessed the army of the Prophet ﷺ and that scene made him overwhelmed and bedazzled. Afterwards, he entered Islam and then went to his people (i.e., Quraysh) and called them out loud warning them that they would not be able defeat the army of the Prophet ﷺ Aboo Sufyaan rushed to Makkah and called the people of Quraysh outload warning them, “O Quraysh! This is Muhammad ﷺ who has come to you with a force you cannot resist.”", "Thereafter, the Prophet ﷺ announced that whoever entered Aboo Sufyaan’s house would be safe and whoever went behind his own door and bolted it would be safe and whoever went into the Sacred Mosque would also be safe.” Thereupon, the people of Makkah took refuge in their own homes and the Sacred Mosque. ‘Aishah (may Allah be pleased with her) related that in the year of the conquest of Mecca, the Prophet entered Makkah from Kadaa' at the higher place of Makkah. On the Conquest Day, the Prophet ﷺ authorised the killing of some disbelievers, and he ﷺ found 360 idols installed around the Ka’bah.", "He ﷺ poked each one of them and recited, {The truth has come, and falsehood has vanished. Surely, falsehood is bound to vanish!} (17:81). The reports on the length of his stay in Makkah after the conquest varied, but the most likely correct opinion is that he ﷺ stayed for 19 days, And Allah knows best."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 113, "stage": 10, "title": "سَرِيَّةُ خالدِ بنِ الوليدِ رضِي الله عنه إلى العُزَّى بنَخْلَةَ", "date": "رمضان 8 هـ، الموافق 630م", "place": "نخلة", "lat": 21.53, "lng": 40.08, "approx": false, "zoom": 8, "paras": ["لمَّا اطْمأَنَّ رسولُ الله صلى الله عليه وسلم بعدَ الفتحِ بعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدَ بنَ الوليدِ</span> إلى العُزَّى لخمسِ ليالٍ بَقِينَ مِن هذا الشَّهرِ الكريمِ لِيَهدِمَها، وكانت بِنَخْلَةَ، وكانت لقُريشٍ وجميعِ بني كِنانةَ, وهي أَعظمُ أَصنامِهم. وكان سَدَنَتُها بني شَيبانَ؛ فخرَج إليها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدٌ</span> في ثلاثين فارسًا حتَّى انتهى إليها فهَدمَها.", "ولمَّا رجَع إليها سألهُ رسولُ الله صلى الله عليه وسلم (هل رأيتَ شيئًا؟). قال: لا. قال: (فإنَّك لم تَهدِمْها فارجِعْ إليها فاهْدِمْها). فرجع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدٌ</span> مُتَغَيِّظًا قد جَرَّدَ سَيفَهُ فخَرجتْ إليه امرأةٌ عُريانةٌ سَوداءُ ناشِرَةُ الرَّأسِ، فجعَل السَّادِنُ يَصيحُ بها، فضربها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدٌ</span> فجزَلها بِاثْنتَينِ، ثمَّ رجَع إلى رسولِ الله صلى الله عليه وسلم فأخبرَهُ، فقال: (نعم، تلك العُزَّى، وقد أَيِسَتْ أن تُعْبَدَ في بلادِكُم أبدًا)."], "url": "https://dorar.net/history/event/128", "route": null, "stations": null, "title_en": "The Expedition of Khaalid ibn al-Waleed (May Allah Be Pleased with Him) to Destroy the She-Idol Stature Called al-‘Uzza at Nakhlah.", "date_en": "Ramadan 8 AH (630 CE)", "place_en": "Nakhlah", "summary_en": "After the Conquest, Khalid ibn al-Walid was sent to destroy al-Uzza at Nakhlah, the greatest idol of Quraysh and Kinanah.", "people": ["khalid"], "dorar": 128, "asbab": [], "body_en": ["After the conquest of Makkah, the Prophet ﷺ felt comfortable and assured, and so he sent out Khaalid ibn al-Waleed on the fifth day from the end of the month of Ramadan to a place called Nakhlah, where there was an idol of the goddess called Al-'Uzza, worshipped by the Quraysh and Kinaanah tribes, and guarded by custodians from Banoo Shaybaan. The mission of Khaalid was to destroy the idol, which was one of the greatest idols of theirs; thus, Khaalid at the head of thirty horsemen, arrived at the spot and destroyed the idol.", "Upon his return, the Prophet ﷺ asked him if he had seen anything else there, to which Khaalid replied, \"No\". He ﷺ told him: “You did not destroy it as yet. Return and destroy it.” Khaalid went again to Nakhlah and there saw a black woman, naked with disheveled hair. The warden of the idol started to shout at her, and then Khaalid struck her with his sword and cut her into \"two pieces.\" Then, he returned once again and narrated his story to the Prophet ﷺ who said after hearing the news: “Yes, that was al-'Uzza. She despaired that she will ever be worshipped again your land.\""], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 114, "stage": 10, "title": "سَرِيَّةُ عَمرِو بنِ العاصِ رضِي الله عنه إلى سُواعٍ، صَنَمِ هُذيلٍ", "date": "رمضان 8 هـ، الموافق 630م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": true, "zoom": 10, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> إلى سُواعٍ لِيَهدِمَهُ، وسُواعٌ صَنَمٌ لقومِ نوحٍ عليه السَّلامُ، ثمَّ صار بعدَ ذلك لقَبيلةِ هُذيلٍ المُضَريَّةِ, وظَلَّ هذا الوَثَنُ مَنصوبًا تَعبُدهُ هُذيلٌ وتُعَظِّمُهُ, حتَّى إنَّهم كانوا يَحُجُّون إليه حتَّى فُتِحَتْ مكَّةُ ودخلَت هُذيلٌ فيمَن دخَل في دينِ الله أفواجًا، وكان مَوضعُه بِرُهاطٍ على قُرابةِ ١٥٠ كيلو مترًا شمالَ شرقيِّ مكَّةَ، فلمَّا انتهى إليه عَمرٌو قال له السَّادِنُ: ما تُريدُ؟ قال: أمَرني رسولُ الله صلَّى الله عليه وسلَّم أن أَهدِمَهُ.", "قال: لا تَقدِرُ على ذلك. قال: لِمَ ؟ قال تُمْنَعُ. قال: حتَّى الآنَ أنت على الباطلِ؟ وَيْحَكَ فهل يَسمعُ أو يُبصِرُ؟ ثم دَنا فكسَرهُ، وأمَر أصحابَهُ فهدموا بيتَ خَزانَتِهِ فلم يَجِدوا فيه شيئًا، ثمَّ قال للسَّادِنِ: كيف رأيتَ؟ قال: أَسلمتُ لله."], "url": "https://dorar.net/history/event/129", "route": null, "stations": null, "title_en": "The Expedition of ‘Amr ibn al-‘Aas to Destroy Soowaa’ , the Idol of the Tribe of Hudhayl", "date_en": "Ramadan 8 AH (630 CE)", "place_en": "Makkah", "summary_en": "Amr ibn al-As was sent to destroy Suwa, an idol worshipped by the tribe of Hudhayl.", "people": ["amr"], "dorar": 129, "asbab": [], "body_en": ["The Prophet ﷺ sent out ‘Amr ibn al-‘Aas in a mission to destroy Soowaa’, an idol that the people of Prophet Noah (peace be upon him) worshipped at first and then the tribe of Hudhayl of Mudar worshipped it. They used to worship and glorify this idol to the extent that they used to travel to it. This remained the case until the day of the conquest of Makkah when the tribe of Hudhayl entered Islam among the large number of Arabs who entered Islam at that time. The idol was installed in a place called Ruhaat, which is situated in the northern east of Makkah, 150 kilometers away from Makkah.", "When ‘Amr arrived at the location of the idol, its warden asked him about the reason of his visit. He replied: I am here fulfilling the order of the Messenger of Allah ﷺ - that is to destroy it. The warden responded: You will not be able to do it. ‘Amr asked: Why is that? The warden replied: You will be prevented, to which ‘Amr said: “Are you still upon falsehood? Woe to you! Does it have the ability to hear or see?” Then, he broke the idol to pieces, and ordered his men to destroy its temple and they found it empty. ‘Amr looked at the warden of the idol and asked him: “What do you think now?” to which he replied: “I have submitted to Allah.”"], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 115, "stage": 10, "title": "سَرِيَّةُ خالدِ بنِ الوليدِ رضِي الله عنه إلى بني جَذِيمَةَ", "date": "شوال 8 هـ، الموافق 630م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": true, "zoom": 10, "paras": ["لمَّا رجَع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدُ بنُ الوليدِ</span> مِن هَدْمِ العُزَّى بعَثهُ رسولُ الله صلى الله عليه وسلم إلى بني جَذيمَةَ داعِيًا إلى الإسلامِ لا مُقاتِلًا, فخرَج في ثلاثمائةٍ وخمسين رجلًا مِنَ المُهاجرين والأنصارِ وبني سُليمٍ، فانتهى إليهم فدَعاهُم إلى الإسلامِ فلم يُحسِنوا أن يَقولوا: أَسلَمْنا، فجعلوا يَقولون: صَبَأْنا، صَبَأْنا.", "-فحملها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالد</span> على أنها سُخرية بالإسلام لأن قريشًا كانت تقول لمن أسلم صبأ تعييرا له- فجعَل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدٌ</span> يَقتُلُهم ويَأْسِرُهُم, ودفَع إلى كُلِّ رجلٍ ممَّن كان معه أَسِيرًا، فأمَر يومًا أن يَقتُلَ كُلُّ رجلٍ أَسِيرَهُ, فأبى ابنُ عُمَرَ وأصحابُه حتَّى قَدِموا على النَّبيِّ صلى الله عليه وسلم فذكَروا له، فرفَع صلى الله عليه وسلم يَديهِ وقال: (اللَّهمَّ إنِّي أَبْرَأُ إليك ممَّا صنَع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khalid\">خالدٌ</span> ) مَرَّتين.", "وكانت بنو سُليمٍ هُم الذين قَتَلوا أَسْراهُم دون المُهاجرين والأنصارِ, وبعَث رسولُ الله صلى الله عليه وسلم علِيًّا, فَوَدَى لهم قَتلاهُم وما ذهَب منهم."], "url": "https://dorar.net/history/event/130", "route": null, "stations": null, "title_en": "The Expedition of Khaalid ibn al-Waleed (May Allah Be Pleased with Him) to Banoo Jadheemah", "date_en": "Shawwal 8 AH (630 CE)", "place_en": "Makkah", "summary_en": "Khalid ibn al-Walid was sent to call Banu Jadhimah to Islam, not to fight them. He killed some of them, and the Prophet ﷺ disavowed what he had done.", "people": ["khalid"], "dorar": 130, "asbab": [], "body_en": ["On his return from his expedition to destroy al-‘Uzza, Khaalid ibn al-Waleed at the head of 350 horsemen of Emigrants, Ansaar, and Banoo Saleem was dispatched once again to Banoo Jadheem. His mission was to invite them to Islam, but they expressed themselves in a manner that made Khaalid believe that they refused to enter Islam. Instead of saying we have become Muslims, they said, we left the religion; thus, Khaalid killed some of them and captured others. Then, he placed one prisoner under the care of each one of his men.", "One day, he ordered his men to kill their prisoners but Ibn ‘Umar and his companions refused to do so. They went to the Prophet ﷺ and informed him of the incident. Thereupon, the Prophet ﷺ raised his hands and said twice: “O Allah! I declare myself innocent from what Khaalid did.” The people from Banoo Saleem were the only ones who killed their prisoners while the Emigrants and Ansaar refused to do so. Then, the Prophet ﷺ sent Alee ibn Abee Taalib to resolve the issue, so he paid them the blood money and compensated them for what had been taken from them."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 116, "stage": 10, "title": "غزوة الطَّائفِ بعد أن حاصرها المسلمون أربعين ليلة", "date": "شوال 8 هـ، الموافق 630م", "place": "الطائف", "lat": 21.2703, "lng": 40.4158, "approx": false, "zoom": 8, "paras": ["بعدَ أن تَعقَّبَ المسلمون فُلولَ الهارِبين مِن هَوازِنَ في أَوْطاسٍ ونَخْلةَ، تَوجَّهوا للقَضاءِ على ثَقيفٍ التي فَرَّتْ مِن حُنينٍ وأَوْطاسٍ، وتَحصَّنتْ بحُصونِها المَنيعَةِ في الطَّائفِ، وفي صَحيحِ مُسلمٍ: أنَّ الرَّسولَ صلى الله عليه وسلم ومَن معه مِنَ المسلمين حاصروا المشركين في الطَّائفِ أربعين ليلةً.", "عن أبي نَجيحٍ السُّلميِّ قال: حاصَرْنا مع نَبيِّ الله صلَّى الله عليه وسلَّم حِصْنَ الطَّائفِ فسمعتُ رسولَ الله صلَّى الله عليه وسلَّم يقولُ: مَن بلَغ بِسَهْمٍ فَلهُ دَرجةٌ في الجنَّةِ. قال: فبلَغتُ يَومئذٍ سِتَّةَ عشرَ سَهْمًا.....). وقد هرَب مِن ذلك الحِصنِ إلى رسولِ الله صلى الله عليه وسلم ثلاثةٌ وعشرون رجلًا، عن عبدِ الله بنِ عُمَرَ، قال: لمَّا حاصَر رسولُ الله صلَّى الله عليه وسلَّم الطَّائفَ، فلم يَنَلْ منهم شيئًا قال: «إنَّا قافِلون إن شاء الله. فثَقُلَ عليهم، وقالوا: نَذهبُ ولا نَفتَحُه. فقال: «اغْدوا على القِتالِ». فغَدَوْا فأَصابَهم جِراحٌ، فقال: «إنَّا قافِلون غَدًا إن شاء الله». فأَعجبَهُم، فضَحِكَ النَّبيُّ صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/131", "route": null, "stations": null, "title_en": "The Siege of al-Taa’if", "date_en": "Shawwal 8 AH (630 CE)", "place_en": "Taif", "summary_en": "Thaqif, who fled from Hunayn, fortified themselves in Taif. The Muslims besieged the city, then withdrew; Thaqif accepted Islam the following year.", "people": [], "dorar": 131, "asbab": [], "body_en": ["After tracking down the fled fighters of the tribe of Hawaazin in Awtaas and Nakhlah, the Muslim army marched to eliminate the people of Thaqeef who fled from Hunayn and Awtaas and stayed in their bastioned forts in al-Taa’if. According to the report in Saheeh Muslim, the Messenger of Allah ﷺ besieged the disbelievers in al-Taa’if for 40 nights. Aboo Najeeh al-Sulamee (may Allah be pleased with him) related: We besieged with the Prophet ﷺ the fortress of al-Taa’if where I heard him say: “Whoever shoots an arrow in the cause of Allah and it hits the target, it will raise him one level in Paradise.' That day, I shot sixteen arrows that hit their targets.”", "Only 23 men managed to escape from that fortress to the Messenger of Allah ﷺ. Narrated Ibn ‘Umar (may Allah be pleased with him): When Allah's Messenger ﷺ besieged Taif and could not conquer its people, he said, \"We will return (to Medina) If Allah wills.\" That distressed the Companions (of the Prophet ﷺ and they said, \"Shall we go away without conquering it (i.e., the Fort of Taif)?\" Once the Prophet ﷺ said, \"Let us return.\" Then the Prophet said (to them), \"Fight tomorrow.\" They fought and (many of them) got wounded, whereupon the Prophet ﷺ said, \"We will return (to al-Madeenah) tomorrow if Allah wills.\" That delighted them, whereupon the Prophet ﷺ smiled."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 117, "stage": 10, "title": "غَزوةُ حُنينٍ (هَوازِنَ)", "date": "ذي القعدة 8 هـ، الموافق 630م", "place": "حنين", "lat": 21.5, "lng": 40.08, "approx": false, "zoom": 8, "paras": ["حُنينُ: وادٍ إلى جَنبِ ذي المَجازِ، قريبٌ مِنَ الطَّائفِ، وبينه وبين مكَّةَ بضعةَ عشرَ مِيلًا مِن جِهَةِ الشرائع والسيل الكبير، وقِيلَ سُمِّيَ بِحُنَيْنٍ؛ نِسبَةً إلى رَجلٍ يُدعَى: حُنينَ بنَ قابِثَةَ بنِ مَهْلائِيلَ. وكان النَّبيُّ صلى الله عليه وسلم قد أقامَ بمكَّةَ ١٩ يومًا، حتَّى جاءَتْ هَوازِنُ وثَقيفٌ فنزلوا بحُنينٍ يُريدون قِتالَ النَّبيِّ صلى الله عليه وسلم، وكانوا قد جمَعوا قبلَ ذلك حين سَمِعوا بمَخرجِ رسولِ الله صلَّى الله عليه وسلَّم مِنَ المدينةِ، وهُم يَظنُّون أنَّه إنَّما يُريدُهم، فلمَّا أَتاهُم أنَّه قد نزَل مكَّةَ، أخَذوا في الاسْتِعدادِ لِمُواجهَتِه، وقد أَرادوها مَوقِعَةً حاسِمةً، فحَشدوا الأموالَ والنِّساءَ والأَبناءَ حتَّى لا يَفِرَّ أَحدُهم ويَترك أهلَهُ ومالَهُ، وكان يَقودُهم مالكُ بنُ عَوفٍ النَّضْريُّ، واسْتنفَروا معهم غَطَفانَ وغيرَها.", "فاسْتعَدَّ الرَّسولُ صلى الله عليه وسلم لِمُواجَهتِهم، فاسْتَعارَ مِن يَعْلى بنِ أُميَّةَ ثلاثين بَعيرًا وثلاثين دِرْعًا، واسْتَعارَ مِن صَفوانَ بنِ أُميَّةَ مائةَ دِرْعٍ، واسْتعمَل عَتَّابَ بنَ أَسِيدِ بنِ أبي العاصِ أَميرًا على مكَّةَ، وقد ثبَت في الصَّحيحين أنَّ الطُّلقاءَ قد خرَجوا معه إلى حُنينٍ.", "واسْتقبَل الرَّسولُ صلى الله عليه وسلم بجَيشِه وادِيَ حُنينٍ في عَمايَةِ الصُّبْحِ، وانْحَدروا فيه، وعند دُخولِهم إلى الوادي حَملوا على هَوازِنَ فانْكشَفوا، فأَكَبَّ المسلمون على ما تَركوهُ مِن غَنائِمَ، وبينما هُم على هذه الحالِ اسْتقبَلَتْهُم هَوازِنُ وأَمطَرتْهُم بِوابِلٍ مِنَ السِّهامِ، ولم يكنْ المسلمون يَتوقَّعون هذا فضاقَتْ عليهم الأَرضُ بما رَحُبَتْ، فوَلَّوْا مُدْبِرين لا يَلْوِي أحدٌ على أحدٍ، وانْحازَ الرَّسولُ صلى الله عليه وسلم ذاتَ اليَمينِ وهو يقولُ: (أين النَّاسُ؟ هَلُمُّوا إليَّ، أنا رسولُ الله، أنا رسولُ الله، أنا محمَّدُ بنُ عبدِ الله).", "وأمَر الرَّسولُ صلى الله عليه وسلم عَمَّهُ العبَّاسَ -وكان جَهْوَرِيَّ الصَّوتِ- أن يُنادِيَ النَّاسَ بالثَّباتِ، وخَصَّ منهم أصحابَ بَيعةِ الرِّضوانِ، فأَسرَعوا إليه، ثمَّ خَصَّ الأَنصارَ بالنِّداءِ، ثمَّ بني الحارثِ بنِ الخَزرجِ، فطاروا إليه قائِلِين: لَبَّيْكَ، لَبَّيْكَ.", "ودارت المَعركةُ قَويَّةً ضِدَّ هَوازِنَ، وقال الرَّسولُ صلى الله عليه وسلم عندما رأى المَعركةَ تَشْتَدُّ: (هذا حين حَمِيَ الوَطيسُ). ثمَّ أخَذ حَصَياتٍ -أو تُرابا- فرَمى به وُجوهِ الكُفَّارِ وهو يقولُ: (شاهَتِ الوُجوهُ). فما خلَق الله تعالى منهم إنسانًا إلَّا مَلأَ عَينَيْهِ تُرابًا بتلك القَبضةِ، فوَلَّوْا مُدْبِرين، والرَّسولُ صلى الله عليه وسلم يقولُ: (انْهزَموا ورَبِّ محمَّدٍ)، وفي رِوايةٍ أُخرى: (انْهزَموا ورَبِّ الكَعبةِ, انْهزَموا ورَبِّ الكَعبةِ).", "وقد رُوِيَ: أنَّ قَتْلى بني مالكٍ مِن ثَقيفٍ لِوَحدِها قد بلَغ ٧٠ قَتيلًا، وقُتِلَ بأَوْطاسٍ مِن بني مالكٍ ٣٠٠، وقُتِلَ خُلَقٌ كَثيرٌ مِن بني نَصرِ بنِ مُعاوِيَةَ ثمَّ مِن بني رِئابٍ، ورُوِيَ: أنَّ سَبْيَ حُنينٍ قد بلَغ ٦٠٠٠ مِنَ النِّساءِ والأَبناءِ. بينما قُتِلَ مِنَ المسلمين أربعةٌ."], "url": "https://dorar.net/history/event/132", "route": [[21.4225, 39.8262], [21.5, 40.08]], "stations": null, "title_en": "The Battle of Hunayn (Hawaazin)", "date_en": "Dhu al-Qadah 8 AH (630 CE)", "place_en": "Hunayn", "summary_en": "Hawazin and Thaqif gathered against the Muslims at Hunayn. Ambushed in the valley, many Muslims fell back at first, but the Prophet ﷺ stood firm and the Muslims regrouped and won.", "people": [], "dorar": 132, "asbab": [{"id": "ASB-050", "k": "d"}], "body_en": ["Hunayan is a valley near a place called Dhee al-Majaaz, near al-Taa’if. It is less than 20 kilometers away from Makkah from the direction of the mount of ‘Arafaat. It has been said it was named Hunayan after a man with the name of Hunayan ibn Qaabi’ah ibn Mahlaa’eel. The Prophet ﷺ stayed in Makkah for 19 days and around that time the tribes of Hawaazin and Thaqeef stationed in Hunayan with the intent of fighting the Prophet ﷺ. They rallied up before that point of time after they heard that the Prophet ﷺ left al-Madeenah, as they thought he was marching towards them.", "However, after they learned that he ﷺ entered Makkah, their preparation to encounter the Muslims started. They wished it to be a decisive battle; thus, they brought to the battle their women, children, and their property so that none of them would dare to flee the battlefield, leaving his wife, children and money behind. They pursued Ghatafaan and other tribes as well to join their forces, and all of them were under the leadership of Maalik ibn ‘Awf al-Nadree. The Prophet ﷺ rallied up his army, borrowed 30 camels and 30 armors from Ya’la ibn ‘Umayyah, and 100 armors from Safwaan ibn ‘Umayyah, and appointed ‘Attaab in Aseed ibn Abee al-‘Aas the governor of Makkah.", "According to the reports in Saheeh al-Bukhaaree and Saheeh Muslim, those who accepted Islam after the conquest of Makkah joined the Muslim army in this battle too. The Prophet ﷺ and his army arrived at the valley of Hunayn before the dawn while the sky was still dark. They descended down to the valley and launched an attack against Hawaazin who fled the location. Thereupon, the Muslims rushed to collect the spoils that they left behind and while they were busy collecting the spoils of war, Hawaazin showered them with arrows causing the Muslims to retreat, each one trying to save himself.", "The Muslim army panicked and were in so much distress by the surprise attack. Many fled the battlefield and only a few remained and stood firmly. The Prophet ﷺ remained and stood firm in the battlefield and called the Muslims out loud: \"Come on, people! I am the Messenger of Allah. I am Muhammad, the son of Abdullah.\" Then, he ordered his paternal uncle, al-‘Abbaas – who was known of his loud strong voice – to summon the people and encourage them to stand firm. The Prophet ﷺ called out first his Companions who pledged their allegiance to him (the pledge of al-Ridwaan), who rushed to answer his call.", "Then, he called the Ansaar who rushed to him immediately upon hearing his call. Then, he called out the tribe of Banoo al-Haarith bin al-Khazraj. All of them rushed to him while saying: “Here we are answering your call”. Thereafter, the Muslims led a fierce fighting against the tribe of Hawaazin. When the Prophet ﷺ observed how fierce was the fighting, he said: “This is the time when it is fierce fighting,” then he picked up a handful of pebbles, hurled it at their faces while saying: \"May your faces be shameful.\" As a result, the eyes of each one of them were thick with dust and the enemy began to retreat in utter confusion.", "As they were fleeing, the Prophet ﷺ said: “By the Lord of Muhammad! They have been defeated.” And in another version of the report, he ﷺ said: “By the Lord of Ka’bah, they have been defeated. By the Lord of Ka’bah, they have been defeated.” It has been reported that the death toll from the clan of Banoo Maalik from the Tribe of Thaqeef alone was 70, who lost in Awtaas, 300 men, in addition to a large number of people from Banoo Nasr ibn Mu’aawiyyah and from Banoo Ri’aab. It was said that the number of women and children who were taken captives was about 6,000. All the while, only 4 people from the Muslims were killed."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 118, "stage": 10, "title": "عُمرَةُ الجِعْرانَةِ", "date": "ذي القعدة 8 هـ، الموافق 630م", "place": "الجعرانة", "lat": 21.56, "lng": 39.956, "approx": false, "zoom": 11, "paras": ["ثبَت أنَّ النَّبيَّ صلى الله عليه وسلم اعْتمَرَ مِنَ الجِعْرانةِ عامَ حُنينٍ، وهذه العُمرَةُ هي الثَّالثةُ بعدَ عُمرَةِ الحُديبيَةِ وعُمرَةِ القَضاءِ. قال ابنُ حَجَرٍ: فإنَّه صلى الله عليه وسلم أَحرَمَ مِنَ الجِعْرانةِ ودخَل مكَّةَ ليلًا فقَضى أمْرَ العُمرَةِ ثمَّ رجَع ليلًا فأَصبحَ بالجِعْرانةِ كَبائِتٍ.", "قال إبراهيمُ النَّخَعيُّ: كانوا يَستَحِبُّون أن يَدخلوا مكَّةَ نهارًا ويَخرُجوا منها ليلًا. وعن عطاءٍ: إن شِئْتُم فادْخُلوا ليلًا إنَّكم لَستُم كرسولِ الله صلى الله عليه وسلم، إنَّه كان إمامًا فأَحَبَّ أن يَدخُلَها نهارًا لِيَراهُ النَّاسُ. انتهى. وقَضيَّةُ هذا أنَّ مَن كان إمامًا يُقْتَدى به اسْتُحِبَ له أن يَدخُلَها نهارًا."], "url": "https://dorar.net/history/event/133", "route": null, "stations": null, "title_en": "The ‘Umrah of al-Ji’raanah", "date_en": "Dhu al-Qadah 8 AH (630 CE)", "place_en": "Al-Jiranah", "summary_en": "After Hunayn the Prophet ﷺ entered ihram at al-Ji'ranah and performed Umrah, his third after Hudaybiyyah and the Compensatory Umrah.", "people": [], "dorar": 133, "asbab": [], "body_en": ["It has been proven authentic that the Prophet ﷺ entered into the state of Ihraam for ‘Umrah from al-Ji’raanah after returning from the battle of Hunayn. It was the third ‘Umrah, after the ‘Umrah of al-Hudaybiyyah and the ‘Umrah al-Qadaa’ (i.e., it was performed after the ‘Umrah of al-Hudaybiyyah). Ibn Hajar said: “[Entering Makkah at night only happened once] ; the Prophet ﷺ entered into the state of Ihraam [for ‘Umrah] from al-JI’raanah. He ﷺ entered Makkah during the night, completed his ‘Umrah, and returned to al-Ji’raanah at [the same] night. He arrived ﷺ in the morning as if he had stayed there. Ibraaheem al-Nakh’ee said: They liked to enter Makkah during the daytime and leave it at night. ‘Ataa’ said: If you like, enter Makkah at night for you are not like the Messenger of Allah ﷺ. He was an Imaam [i.e., an example for us to follow and imitate], so he ﷺ liked to enter Makkah during daytime, so people can see him.”", "The ruling concerning this is that if the person is someone who people follow his actions, it will be recommended that he enters Makkah during daytime, so people imitate him."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 119, "stage": 11, "title": "وَفاةُ أمِّ كُلثومٍ بنتِ رسولِ الله صلَّى الله عليه وسلَّم", "date": "9 هـ، الموافق 630م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["هي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummkulthum\">أمُّ كُلثومٍ</span> بنتُ رسولِ الله صلى الله عليه وسلم- البَضْعَةُ الرَّابعةُ النَّبَوِيَّةُ، أمُّها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> بنتُ خُويلدٍ رضي الله عنها، يُقالُ تَزوَّجها عُتَيْبةُ بنُ أبي لَهبٍ ثمَّ فارَقَها، وأَسلَمتْ وهاجَرتْ بعدَ النَّبيِّ صلى الله عليه وسلم، فلمَّا تُوفِّيتْ أُختُها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">رُقيَّةُ</span> تزَوَّجَ بها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> في رَبيعٍ الأوَّلِ سَنةَ ثلاثٍ فلم تَلِدْ له."], "url": "https://dorar.net/history/event/134", "route": null, "stations": null, "title_en": "The Passing of Umm Kulthoom (May Allah Be Pleased with Her), the Daughter of the Prophet ﷺ", "date_en": "9 AH (630 CE)", "place_en": "Madinah", "summary_en": "Umm Kulthum, the Prophet's ﷺ daughter and the wife of Uthman ibn Affan, died in Madinah.", "people": ["ummkulthum", "khadija", "uthman", "ruqayya"], "dorar": 134, "asbab": [], "body_en": ["Umm Kulthoom is the daughter of the Prophet ﷺand his fourth child. Her mother was Khadeejah bint Khuwaylid (may Allah be pleased with her). It was said that she married ‘Utaybah ibn Abee Lahab then he left her. She embraced Islam and emigrated after the Prophet ﷺ had emigrated. When her sister Ruqayyah – the wife of ‘Uthmaan - passed away, ‘Uthmaan ibn ‘Affaan married her in the month of Rabee’ al-Awwal in the third year after Hijrah. She bore no children from him."], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 120, "stage": 11, "title": "عامُ الوُفودِ", "date": "9 هـ، الموافق 630م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كان مِن أَبرَزِ نَتائجِ فَتحِ مكَّةَ أن أَخذتْ قَبائلُ العربِ وأَفرادُها يُبادِرون بإسلامِهم؛ لأنَّهم كانوا يَنتظِرون نَتيجةَ الصِّراعِ بين المسلمين وقُريشٍ، فعن عَمرِو بنِ سَلمةَ قال: كُنَّا بماءٍ مَمَرَّ النَّاسِ، وكان يَمُرُّ بِنا الرُّكبانُ فنسألُهم: ما للنَّاسِ، ما للنَّاسِ؟ ما هذا الرَّجلُ؟ فيقولون: يَزعُم أنَّ الله أَرسلَهُ، أَوْحى إليه -أو: أَوْحى الله بكذا- فكنتُ أَحفظُ ذلك الكلامَ، وكأنَّما يُقَرُّ في صدري، وكانتِ العربُ تَلَوَّمُ بإسلامِهم الفَتحَ، فيَقولون: اتْرُكوهُ وقَومَهُ، فإنَّه إن ظهَر عليهم فهو نَبِيٌّ صادِقٌ. فلمَّا كانت وَقعةُ أهلِ الفَتحِ بادَر كُلُّ قومٍ بإسلامِهم، وبَدَرَ أبي قومي بإسلامِهم."], "url": "https://dorar.net/history/event/135", "route": null, "stations": null, "title_en": "The Year of Delegates", "date_en": "9 AH (630 CE)", "place_en": "Makkah", "summary_en": "After the Conquest of Makkah, Arab tribes who had been waiting for its outcome hastened to accept Islam and sent delegations to the Prophet ﷺ.", "people": [], "dorar": 135, "asbab": [{"id": "ASB-051", "k": "d"}], "body_en": ["The aftermath of the conquest of Makkah was Arab tribes taking the initiative and declaring their Islam. This was because they wanted to see the outcome of the conflict between the Muslims and Quraysh. ‘Amr ibn Salamah related: “We lived by water which people passed. Riders would pass by us, and we would ask them, \"What has happened to the people? What has happened to the people? What is this man like?”, and they would reply, \"He asserts that Allah has sent him, has made a revelation to him, has made a revelation to him to this effect.”", "I was remembering those words with the result that they seemed to be glued in my breast. By their acceptance of Islam, the Arabs were expecting victory for they would say, ‘Leave him and his people alone, for if begets the better of them, he is a true prophet.’ Then when the conquest of Makkah took place, every tribe hastened to accept Islam, and my father was the first of my tribe to accept it.”"], "src_en": "https://dorar.net/en/history?page=9"}, {"seq": 121, "stage": 11, "title": "نزول فريضة الحج", "date": "9 هـ، الموافق 630م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كان الحَجُّ مَعروفًا قبلَ البعثة، فإبراهيمُ أَذَّنَ في النَّاسِ بالحَجِّ، وحَجَّ موسى وغيرُه مِنَ الأنبياءِ، وبَقِيَ الحَجُّ مَعروفًا ولكن بَدَّلَ فيه المُشركون ما بَدَّلوا، وأَوَّلُ مَن بَدَّلَ عَمرُو بنُ لُحَيٍّ، ثمَّ فرَض الله تعالى الحَجَّ على المسلمين لِمَن اسْتَطاع إليه سَبيلًا، <span class=\"verse\">﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾</span> <span class=\"ref\">[آل عمران: ٩٧]</span>، وبَيَّن الرَّسولُ صلى الله عليه وسلم مَناسِكَهُ بِتَمامِها في حَجَّةِ الوَداعِ في سَنَةِ ١٠هـ، واخْتُلِف في أيِّ عامٍ فُرِضَ الحَجُّ، قِيلَ: فُرِضَ في سَنَةِ سِتٍّ. وقِيلَ: سَنَةَ سبعٍ. وقِيلَ: سَنَةَ ثَمانٍ. وقِيلَ غيرَ ذلك."], "url": "https://dorar.net/history/event/136", "route": null, "stations": null, "title_en": "Making Pilgrimage (Hajj) Obligation", "date_en": "9 AH (630 CE)", "place_en": "Madinah", "summary_en": "Hajj, known since the time of Abraham, was made obligatory upon every Muslim able to perform it.", "people": [], "dorar": 136, "asbab": [], "body_en": ["Hajj was known to the people before Islam from the time of Prophet Ibraaheem (peace e upon him) who called all people to the pilgrimage. Other Prophets such like Moses (peace be upon him) performed pilgrimage too. It has been a known ritual since then, but the polytheists altered it, and the first person who introduced new changes to it was ‘Amr ibn Luhayy. After the emergence of Islam, Allah has made it obligatory upon every adult Muslim who can afford it, physically and financially. Allah, Most High, says: {Pilgrimage to this House is an obligation by Allah upon whoever is able among the people} [Quran 3: 97].", "The Prophet ﷺ explained to us all of its rituals during the Farewell Pilgrimage, which he ﷺ performed in the 10th year after Hijrah. The scholars differed about the year in which pilgrimage was made obligatory; some said it was in the 6th year after Hijrah while others said it was in the 7th year after Hijrah. It has been said that it happened in the 8th year after Hijrah, and others said it was in a different year."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 122, "stage": 11, "title": "وَفاةُ النَّجاشِيِّ صاحِبِ الحَبشةِ رضِي الله عنه", "date": "رجب 9 هـ، الموافق 630م", "place": "الحبشة", "lat": 14.1211, "lng": 38.7234, "approx": false, "zoom": 8, "paras": ["هو أَصْحَمَةُ بنُ أَبْجَرَ مَلِكُ الحَبشةِ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">والنَّجاشيُّ</span> لَقبٌ له ولمُلوكِ الحَبشةِ، ومَعْنى: أَصْحَمَةَ: عَطِيَّةُ، وقِيلَ: عَطِيَّةُ الله، وقِيلَ: عَطاءٌ. تَوَلَّى الحُكمَ بعدَ مَوتِ عَمِّهِ، وبعدَ سَنواتٍ مِن حُكمِهِ وانْتِشارِ عَدْلِه أَسلمَ في عَهدِ النَّبيِّ صلى الله عليه وسلم، وأَحسنَ إلى المسلمين الذين هاجَروا إلى أَرضِه، قال رسولُ الله صلَّى الله عليه وسلَّم لأَصحابِه عن النَّجاشيِّ: لو خَرجتُم إلى أرضِ الحَبشةِ فإنَّ بها مَلِكًا لا يُظْلَمُ عنده أحدٌ، وهي أرضُ صِدْقٍ، حتَّى يَجعلَ الله لكم فَرَجًا.", "ولمَّا ماتَ صلَّى عليه النَّبيُّ صلى الله عليه وسلم بالمدينةِ صَلاةَ الغائِبِ، فعن أبي هُريرةَ رضي الله عنه: أنَّ رسولَ الله صلى الله عليه وسلم نَعى لهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيَّ</span> صاحِبَ الحَبشةِ، في اليَومِ الذي مات فيه، وقال: «اسْتَغْفِروا لأَخيكُم ». وعن جابرٍ رضي الله عنه: قال النَّبيُّ صلى الله عليه وسلم حين مات <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيُّ</span>: «مات اليَومَ رَجلٌ صالِحٌ، فقوموا فصَلُّوا على أَخيكُم أَصْحَمَةَ»."], "url": "https://dorar.net/history/event/137", "route": null, "stations": null, "title_en": "The Death of the Najaashi, the King of Abyssinia", "date_en": "Rajab 9 AH (630 CE)", "place_en": "Abyssinia", "summary_en": "Ashama, the Negus of Abyssinia who sheltered the Muslim emigrants and accepted Islam, died, and the Prophet ﷺ led the funeral prayer for him in absentia in Madinah.", "people": ["najashi"], "dorar": 137, "asbab": [{"id": "TAF-06", "k": "d"}], "body_en": ["The name of the king of Abyssinia, commonly known as al-Najaashi, which is an honorific title given to all kings of Abyssinia, was As-Hamah ibn Abjar. The meaning of his first name (As-Hamah) is ‘Atiyyah (the gift) and it has been said that it means ‘Attiyyatul Allah (the gift of Allah) while others said it means ‘Ataa’. He ruled Abyssinia after the passing of his paternal uncle. During his reign justice prevailed and after a few years from assuming his position, he embraced Islam during the lifetime of the Prophet ﷺ.", "He welcomed the Muslims and treated them well when they emigrated to Abyssinia. The Prophet ﷺ proposed to his Companions to emigrate to Abyssinia and praised its king. He said: “Set out to the land of Abyssinia. There is a king there by whom no one is wronged, and it is a land of honesty. [Stay there] until Allah makes a way for you out from what you are suffering.” When King Najaashee expired, the Prophet ﷺ offered his funeral prayer in absentia. Narrated Aboo Hurayrah (may Allah be pleased with him), that Allah's Messenger ﷺ informed them (i.e. his Companions) of the death of al-Najaashee, the king of Abyssinia, on the very day on which the latter died, and said, \"Ask Allah's Forgiveness for your brother.\"", "Narrated Jaabir (may Allah be pleased with him): When al-Najaashee died, the Prophet ﷺ said, \"Today a pious man has died. So, get up and offer the funeral prayer for your brother As-Hamah.\""], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 123, "stage": 11, "title": "غَزوةُ تَبوكَ وجَيشُ العُسْرَةِ", "date": "رجب 9 هـ، الموافق 630م", "place": "تبوك", "lat": 28.3838, "lng": 36.555, "approx": false, "zoom": 8, "paras": ["تَبوكُ مَوضِعٌ بين وادي القُرى والشَّامِ، قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">أبو موسى</span> الأَشعريُّ رضي الله عنه: (أَرسلَني أَصحابي إلى رسولِ الله صلى الله عليه وسلم أَسأَلُه الحُمْلانَ لهم إذ هُم معه في جَيشِ العُسْرَةِ، وهي غَزوةُ تَبوكَ..). وحديث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">أبي موسى</span> رضي الله عنه فيه دِلالةٌ على ما كان عليه الصَّحابةُ مِنَ العُسْرِ الشَّديدِ في المالِ والزَّادِ والرَّكائِبِ، كما رَوى مُسلمٌ أيضًا عن أبي هُريرةَ رضي الله عنه ما وقع للمسلمين في طَريقِ هذه الغَزوةِ مِن نَقْصٍ في الزَّادِ حتَّى مَصُّوا النَّوَى وشَرِبوا عليه الماءَ، وفي رِوايةٍ أُخرى لمُسلمٍ: أنَّهم اسْتأذَنوا الرَّسولَ صلى الله عليه وسلم في نَحْرِ مَطاياهُم لِيأكُلوا.", "وقد قال الله تعالى: <span class=\"verse\">﴿لَقَدْ تَابَ اللَّهُ عَلَى النَّبِيِّ وَالْمُهَاجِرِينَ وَالْأَنْصَارِ الَّذِينَ اتَّبَعُوهُ فِي سَاعَةِ الْعُسْرَةِ﴾</span> <span class=\"ref\">[التوبة: ١١٧]</span>. قال ابنُ كَثيرٍ: فعزَم رسولُ الله صلى الله عليه وسلم على قِتالِ الرُّومِ؛ لأنَّهم أَقربُ النَّاسِ إليه؛ وأَوْلى النَّاسِ بالدَّعوَةِ إلى الحقِّ لقُربِهِم إلى الإسلامِ وأَهلِه، وقد قال الله تعالى: <span class=\"verse\">﴿يَاأَيُّهَا الَّذِينَ آمَنُوا قَاتِلُوا الَّذِينَ يَلُونَكُمْ مِنَ الْكُفَّارِ وَلْيَجِدُوا فِيكُمْ غِلْظَةً وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ﴾</span> <span class=\"ref\">[التوبة: ١٢٣]</span>.", "وقد بَيَّنَ صلى الله عليه وسلم وِجْهَةَ هذه الغَزوةِ، فعن مُعاذٍ رضي الله عنه: أنَّ رسولَ الله صلى الله عليه وسلم قال: (سَتأْتون غدًا إن شاء الله عَيْنَ تَبوكَ، وإنَّكم لن تَأْتوها حتَّى يَضْحى النَّهارُ، فمَن جاءَها مِنكم فلا يَمَسَّ مِن مائِها شيئًا حتَّى آتي).", "والمشهورُ والرَّاجحُ أنَّ جَيشَ تَبوكَ كان ثلاثين ألفًا، ولكنَّ الرَّسولَ صلَّى الله عليه وسلَّم لم يَلْقَ حَربًا مِنَ الأعداءِ، فرجَع إلى المدينةِ مُنتصِرًا بعدَ أن أقامَ بتَبوكَ عِشرين ليلةً."], "url": "https://dorar.net/history/event/138", "route": [[24.4672, 39.6111], [26.6, 38.0], [28.3838, 36.555]], "stations": null, "title_en": "The Battle of Tabook and the Army of Destitute", "date_en": "Rajab 9 AH (630 CE)", "place_en": "Tabuk", "summary_en": "In a time of hardship and intense heat, the Prophet ﷺ led about thirty thousand men to Tabuk to face the Byzantines. No battle took place.", "people": ["abumusa"], "dorar": 138, "asbab": [{"id": "TAF-17", "k": "d"}, {"id": "ASB-052", "k": "d"}, {"id": "ASB-053", "k": "d"}, {"id": "TAF-15", "k": "d"}, {"id": "TAF-16", "k": "d"}], "body_en": ["Tabook is a place situated between al-Shaam and Waadi al-Qura. Narrated Aboo Moosa al-Ash’aree (may Allah be pleased with him): “My companions sent me to Allah's Messenger ﷺ asking him to provide them with mounts as they were going along with him in the army of destitute - and that is the occasion of the Battle of Tabook…” This hadeeth indicates that the Companions were in extreme lack of money, supplies, and mounts. This is even noted in the hadeeth in Saheeh Muslim wherein Aboo Hurayrah (may Allah be pleased with him) reported that in this battle, the food supplies were so short that the Companions had to subsist on sucking date stones and drinking water.", "In another report in Saheeh Muslim, Aboo Hurayrah (may Allah be pleased with him) related that he asked the Prophet’s permission to slaughter their mounts to eat. Allah, Most High, said: {Allah has certainly turned in mercy to the Prophet as well as the Emigrants and the Helpers who stood by him in the time of hardship} [Quran 9:117]. Ibn Katheer said: “The Prophet ﷺ began preparations to fight the Romans who were the closest in area to the Arabian Peninsula, and as such, had the most right to be called to Islam…” Allah, Most High, said: {O you who believe!", "Fight those of the disbelievers who are close to you and let them find harshness in you and know that Allah is with those who have piety} [Quran 9:123]. The Prophet ﷺ disclosed to the Muslims the destination of the army as reported in the authentic hadeeth. It is reported on the authority of Mu’aadh (may Allah be pleased with him) that the Prophet ﷺ said: “Tomorrow you will come, by Allah’s will, to the spring of Tabook. But you will not get there until well into the morning. No one who arrives should touch any of its water until I come.”", "The famous, and most likely to be correct, view is that the army of Muslims in the battle of Tabook was made up of 30,000 fighters. However, no fighting ensued as the enemy fled before the arrival of the Muslim army; thus, the Prophet ﷺ returned to al-Madeenah victorious after he stationed in Tabook for 20 nights."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 124, "stage": 11, "title": "وَفاةُ رَأْسِ المُنافقين عبدِ الله بنِ أُبَيٍّ ابنِ سَلولَ", "date": "ذي القعدة 9 هـ، الموافق 631م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["هو <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayy\">عبدُ الله بنُ أُبَيٍّ بن</span> ابنُ سَلولَ، رَأْسُ المُنافقين، مَرِضَ في ليالٍ بَقِينَ مِن شَوَّالٍ بعدَ أن رجَع رسولُ الله صلى الله عليه وسلم مِن غَزوةِ تَبوكَ, ولمَّا مات اسْتَغفَرَ له رسولُ اللّه صلى الله عليه وسلم، وصلَّى عليه بعدَ أن حاوَلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> مَنْعَهُ عن الصَّلاةِ عليه، وقد نزَل القُرآنُ بعدَ ذلك بِمُوافَقَةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> رضي الله عنه، وإنَّما صلَّى عليه رسولُ الله صلى الله عليه وسلم إجراءً له على حُكمِ الظَّاهرِ وهو الإسلامُ؛ ولِما فيه مِن مَصلَحةٍ شَرعيَّةٍ؛ وهو تَأليفُ قُلوبِ قَومِه وتابِعيهِ، فقد كان يَدِينُ له بالوَلاءِ فِئَةٌ كَبيرةٌ مِنَ المُنافقين، فعسى أن يَتأثَّروا ويَرجِعوا عن نِفاقِهم ويَعتبِروا ويُخلِصوا لله ولِرسولِهِ."], "url": "https://dorar.net/history/event/139", "route": null, "stations": null, "title_en": "The Death of the Head of Hypocrites, Abdullah ibn Ubay ibn Salool", "date_en": "Dhu al-Qadah 9 AH (631 CE)", "place_en": "Madinah", "summary_en": "Abdullah ibn Ubayy ibn Salul, leader of the hypocrites, died after Tabuk. The Prophet ﷺ prayed over him, and verses were then revealed forbidding prayer over hypocrites.", "people": ["ubayy", "umar"], "dorar": 139, "asbab": [{"id": "ASB-055", "k": "d"}], "body_en": ["He is Abdullah ibn Ubay Ibn Salool, the head of hypocrites. He fell sick towards the end of the month of Shawwaal after the Prophet ﷺ returned from the battle of Tabook. When he died, Allah’s Messenger ﷺ asked Allah to forgive him and prayed over him despite the attempt of ‘Umar (may Allah be pleased with him) to convince the Prophet ﷺ not to pray over him. However, Allah revealed afterwards confirmed the view of ‘Umar ibn al-Khattaab (may Allah be pleased with him). The reason the Prophet ﷺ prayed over him was to [show us that we should] act according to what appears to us [without delving into people’s hearts] i.e., he presented him as a Muslim so he should be treated as such, and to achieve a religious benefit – that is to soften the hearts of his people and followers since a large number of hypocrites were loyal to him, so the Prophet ﷺ hoped it would influence them and encourage them to stop their hypocrisy and become sincere to Allah and His Messenger."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 125, "stage": 11, "title": "حَجَّةُ أبي بكرٍ الصِّدِّيقِ ونُزولُ سُورةِ بَراءَة", "date": "ذي الحجة 9 هـ، الموافق 631م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["بعَث النَّبيُّ صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبا بكرٍ</span> أَميرًا على الحَجِّ بعدَ انْسِلاخِ ذي القَعدةِ لِيُقيمَ للمسلمين حَجَّهُم -والنَّاسُ مِن أهلِ الشِّركِ على مَنازِلهم مِن حَجِّهِم- فخرَج <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> رضِي الله عنه ومَن معه مِنَ المسلمين، وقد بعَث عليه الصَّلاةُ والسَّلامُ عَلِيًّا رضي الله عنه بعدَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبي بكرٍ</span> الصِّدِّيقِ رضي الله عنه لِيكونَ معه، ويَتوَلَّى علِيٌّ بِنَفْسِه إبلاغَ البَراءةِ إلى المشركين نِيابَةً عن رسولِ الله صلى الله عليه وسلم لِكونِهِ ابنَ عَمِّهِ، مِن عَصَبَتِهِ، قال أبو هُريرةَ: بعَثَني <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> في تلك الحَجَّةِ في مُؤَذِّنين يَومَ النَّحْرِ، نُؤَذِّنُ بمِنًى: أن لا يَحُجَّ بعدَ العامِ مُشركٌ، ولا يَطوفَ بالبيتِ عُريانٌ.", "قال حُميدُ بنُ عبدِ الرَّحمنِ: ثمَّ أَردَفَ رسولُ الله صلى الله عليه وسلم عَلِيًّا، فأَمَرهُ أن يُؤَذِّنَ ببَراءَة. قال أبو هُريرةَ: فأَذَّنَ مَعَنا علِيٌّ في أهلِ مِنًى يَومَ النَّحْرِ: لا يَحُجُّ بعدَ العامِ مُشرِكٌ، ولا يَطوفُ بالبيتِ عُريانٌ."], "url": "https://dorar.net/history/event/140", "route": null, "stations": null, "title_en": "Aboo Bakr Performs Hajj and the Revelation of the Surah of Tawbah.", "date_en": "Dhu al-Hijjah 9 AH (631 CE)", "place_en": "Makkah", "summary_en": "The Prophet ﷺ appointed Abu Bakr to lead the Hajj of year 9, and the opening verses of Surah At-Tawbah were proclaimed to the pilgrims.", "people": ["abubakr"], "dorar": 140, "asbab": [{"id": "ASB-056", "k": "d"}], "body_en": ["The Prophet ﷺ sent Aboo Bakr (may Allah be pleased with him) to superintend the Hajj after the month of Dhoo al-Qa’dah had expired. His mission was to ensure the pilgrimage of Muslims is correct. At that point in time, the polytheists were still occupying the places where the stated places of Hajj were found. After Aboo Bakr left al-Madeenah with the Muslims who were in his company, the Prophet ﷺ dispatched Alee ibn Abee Taalib (may Allah be pleased with him), since he was his paternal cousin and from his family, to follow Aboo Bakr to inform him, personally, on the behalf of the Prophet ﷺ of the ayaat that were revealed from Surah al-Tawbah.", "Narrated Aboo Hurayrah (may Allah be pleased with him): On the Day of Nahr [when Aboo Bakr was the leader of the pilgrims in that Hajj] Abu Bakr sent me along with other announcers to Mina to make a public announcement: \"No polytheist is allowed to perform Hajj after this year and no naked person is allowed to perform circumambulation around the Ka`bah.” Humayd ibn ‘Abd al-Rahmaan added: “Then Allah's Messenger ﷺ sent `Alee to read out the Surat al-Tawbah to the people.” Aboo Hurayarh (may Allah be pleased with him) continued saying: “So, Alee ibn Abee Taalib (may Allah be pleased with him) made the announcement along with us on the day of Nahr in Mina: \" No polytheist is allowed to perform Hajj after this year and no naked person is allowed to perform circumambulation around the Ka`bah.\""], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 126, "stage": 11, "title": "تَتابُعُ الوُفودِ إلى النَّبيِّ صلَّى الله عليه وسلَّم", "date": "10 هـ، الموافق 631م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 11, "paras": ["بَقِيَتِ الوُفودُ تَتابَعُ إلى رسولِ الله صلَّى الله عليه وسلَّم، وكان بينها وَفْدُ نَصارى نَجْرانَ، ومصالحتهم وصالَحَهُم على الجِزْيَةِ، وجعَل لهم ذِمَّةً."], "url": "https://dorar.net/history/event/141", "route": null, "stations": null, "title_en": "The Prophet ﷺ Receiving More Delegates", "date_en": "10 AH (631 CE)", "place_en": "Madinah", "summary_en": "Among the delegations was that of the Christians of Najran. The Prophet ﷺ made a treaty with them guaranteeing their protection in return for the j
