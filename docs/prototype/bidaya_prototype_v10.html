d establish the prayer in order to remember Me!} Umar then said: “How wonderful and noble are these words! Direct me to Muhammad.” He then went to the Prophet ﷺ and accepted Islam at his hands. Then he went out with the Muslims in two ranks until they reached the Mosque. When Quraysh saw him with them, they felt a dark pall, the likes of which they had never felt before"], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 9, "stage": 1, "title": "إسلام الطّفيل بن عمرو الدوسي رَضي اللهُ عنه", "date": "6 ق.هـ، الموافق 616م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["كانت قُريشٌ تُحذِّر منَ الاستِماعِ للنبيِّ صلَّى اللهُ عليه وسلَّم، فلمَّا قَدِم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"tufayl\">الطُّفَيلُ</span> بن عمرٍو مكةَ مَشَى إليه رجالٍ من قُرَيشٍ، وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"tufayl\">الطُّفَيلُ</span> رجلًا شَريفًا شاعِرًا لَبيبًا، فقالوا له: \"يا طُفَيلُ، إنَّك قَدِمتَ بلادَنا، وهذا الرجلُ الذي بين أظهُرِنا قد أعضَلَ -اشتَدَّ أمرُه- بنا، وقد فرَّق جماعَتَنا، وشتَّت أمْرَنا، وإنَّما قَولُه كالسِّحرِ يُفرِّق بين الرَّجلِ وبين أبيه، وبين الرَّجُلِ وبين أخيه، وبين الرَّجُلِ وبين زَوجَتِه، وإنَّا نَخشَى عليك وعلى قَومِك ما قد دَخلَ علينا، فلا تُكلِّمَنَّه ولا تَسمَعَنَّ منه شيئًا\".", "قال: فَواللهِ ما زالوا بي حتَّى أجمعتُ ألَّا أسمَعَ منه شيئًا ولا أُكلِّمه، حتى حَشَوتُ في أُذُنَيَّ حين غَدَوتُ إلى المسجِدِ كُرسُفًا -قُطنًا- خوفًا مِن أن يَبلُغَني شيءٌ مِن قَولِه، وأنا لا أُريدُ أن أسمَعَه. فغَدَوتُ إلى المسجدِ فإذا رسولُ الله صلَّى اللهُ عليه وسلَّم قائمٌ يصلِّي عند الكَعبةِ.", "قال: فقُمتُ منه قريبًا، فأبى الله إلَّا أنْ يُسمِعَني بعضَ قولِه. قال: فسَمِعتُ كَلامًا حَسَنًا. فقُلتُ في نَفسي: وا ثُكْلَ أُمِّي، واللهِ إنِّي لرَجلٌ لَبيبٌ شاعِرٌ ما يَخفَى علَيَّ الحَسنُ من القَبيحِ، فما يَمنَعُني أن أسمَعَ من هذا الرَّجلِ ما يقولُ؟ فإنْ كان الذي يَأتي به حَسنًا قَبِلتُه، وإن كان قَبيحًا تَرَكتُه.", "فمَكَثتُ حتى انصَرَف رسول الله صلَّى اللهُ عليه وسلَّم إلى بيتِه فاتَّبَعتُه، حتى إذا دخل بَيتَه دَخَلتُ عليه، فقلتُ: يا مُحمَّدُ، إنَّ قومَك قد قالوا لي كذا وكذا، للذي قالوا؛ فوالله ما بَرِحوا يُخوِّفونَني أمْرَك حتى سَدَدتُ أُذُنَيَّ بكُرسُفٍ لِئَلَّا أسمَعَ قولَك، ثمَّ أبَى الله إلا أن يُسمِعَني قَولَك، فسَمِعتُه قَولًا حَسَنًا، فاعرِضْ علَيَّ أمْرَك.", "قال: فعَرَضَ علَيَّ رسولُ الله صلَّى اللهُ عليه وسلَّم الإسلامَ، وتلا علَيَّ القُرآنَ، فلا والله ما سَمعتُ قولًا قطُّ أحسنَ منه، ولا أمرًا أعدَلَ منه. فأسلمتُ وشَهِدتُ شهادةَ الحقِّ، وقلتُ: يا نبيَّ الله، إنِّي امرُؤٌ مُطاعٌ في قومي، وأنا راجِعٌ إليهم، وداعيهِم إلى الإسلامِ، فادعُ الله أن يجعلَ لي آيةً تَكون لي عَونًا عليهم فيما أدعوهم إليه، فقال: \"اللَّهمَّ اجعَل له آيةً\".", "قال: فخَرَجتُ إلى قومي، حتى إذا كنتُ بثَنيَّةٍ -الفُرجةُ بين الجَبَلَين- تُطلِعُني على الحاضِرِ -أي: القوم النَّازِلين على الماء- وقع نورٌ بين عينَيَّ مِثلُ المِصباحِ، فقُلتُ: اللَّهمَّ في غيرِ وجهي، إنِّي أخشى أن يَظُنُّوا أنَّها مُثلةٌ وَقَعت في وَجهي لفِراقي دينَهم.", "قال: فتَحَوَّل فوَقَع في رأسِ سوطي. قال: فجَعَل الحاضِرُ يَتراءَون ذلك النُّورَ في سَوطي كالقِنديلِ المُعلَّقِ، وأنا أهبِطُ إليهم من الثَّنيَّةِ، قال: حتى جِئتُهم فأصبَحتُ فيهم. فلمَّا نزلتُ أتاني أبي، وكان شيخًا كبيرًا، قال: فقلتُ: إليك عنِّي يا أبتِ، فلستُ منك ولستَ منِّي.", "قال: ولِمَ يا بُنَيَّ؟ قال: قلتُ: أسلمتُ وتابَعتُ دينَ محمدٍ صلَّى اللهُ عليه وسلَّم. قال: أيْ بنيَّ، فديني دينُك. قال: فقلتُ: فاذهَبْ فاغتَسِلْ وطهِّرْ ثيابَك، ثم تعالَ حتى أُعَلِّمَك ما عَلِمتُ. فذَهَب فاغتَسَلَ، وطهَّرَ ثيابَه، ثم جاء فعَرَضتُ عليه الإسلامَ، فأسلمَ.", "ثم أتَتْني صاحِبَتي -زَوجَتي- فقلتُ: إليكِ عنِّي، فلستُ منكِ ولستِ منِّي. قالت: لِمَ؟ بأبي أنت وأمي. قلتُ: قد فرَّق بيني وبينكِ الإسلامُ، وتابَعتُ دينَ محمدٍ صلَّى اللهُ عليه وسلَّم. قالت: فديني دينُكَ. قلتُ: فاذهَبي فتطهَّري، فذَهَبَت فاغتسَلَت، ثم جاءت فعَرَضتُ عليها الإسلامَ، فأسلَمَت.", "ثم دعوتُ دَوسًا إلى الإسلامِ فأبطَؤوا علَيَّ، ثم جئتُ رسولَ الله صلَّى اللهُ عليه وسلَّم بمكةَ، فقلتُ له: يا نبيَّ الله، إنَّه قد غَلَبني على دوسٍ الزِّنا -لَهوٌ مع شُغُلِ القَلبِ والبَصرِ-، فادعُ الله عليهم، فقال: \"اللَّهمَّ اهدِ دَوسًا، ارجِعْ إلى قومِكَ فادعُهم وارفُقْ بِهِم\".", "قال: فلَم أزَلْ بأرضِ دَوسٍ أدعوهم إلى الإسلامِ، حتى هاجَرَ رسولُ الله صلَّى اللهُ عليه وسلَّم إلى المدينةِ، ومَضَى بدرٌ وأُحُدٌ والخَندَقُ، ثم قَدِمتُ على رسول الله صلَّى اللهُ عليه وسلَّم بِمَن أسلم معي من قومي، ورسولُ الله صلَّى اللهُ عليه وسلَّم بخَيبَرَ، حتى نزلتُ المدينةَ بسبعين أو ثمانين بَيتًا من دوسٍ، ثم لَحِقْنا برسول الله صلَّى اللهُ عليه وسلَّم بخَيبَرَ، فأسهَمَ لنا مع المسلمين\". ثم لم يَزَل رَضي اللهُ عنه مع رسولِ الله صلَّى اللهُ عليه وسلَّم حتى فتح الله عليه مكَّةَ، وكان معه بالمدينةِ حتى قَبَض الله رسوله صلَّى اللهُ عليه وسلَّم، فلمَّا ارتدَّتِ العربُ خرج مع المسلمين، فسار معهم حتى فَرَغوا من طُلَيحةَ، ومن أرضِ نجدٍ كلِّها. ثم سار مع المسلمين إلى اليَمامةِ، واستشهد فيها."], "url": "https://dorar.net/history/event/21", "route": null, "stations": null, "title_en": "The Islam of Tufayl ibn ‘Amr al-Dawsy, May Allah Be Well Pleased with Him", "date_en": "6 BH (616 CE)", "place_en": "Makkah", "summary_en": "Al-Tufayl ibn Amr, a chief and poet of the Daws tribe, was warned by Quraysh not to listen to the Prophet ﷺ, but he heard the Quran, accepted Islam, and returned to call his people.", "people": ["tufayl"], "dorar": 21, "asbab": [], "body_en": ["Quraysh would warn people against listening to the Prophet, ﷺ. When Tufayl ibn ‘Amr al-Dawsy -a very intelligent and noble man, and a poet as well- arrived at Makkah, some men from Quraysh approached him and said to him: “O Tufayl! You have come to our lands (and you are welcome), but amongst us is a man whose affair has become great, but he has caused great dissension amongst us; he speaks like a sorcerer whose words separate a man from his father, his brother, and his wife. We fear for you and your people that which has come upon us. Do not dare to speak to him nor listen to him!”", "He then said: “By Allah, they kept warning me until I decided to never hear a word of his; thus, I stuffed my ears full of cotton, out of fear that anything of what they said would happen to me. I did not want to hear him, but when I went to the Mosque, the Messenger of Allah ﷺ was there praying by the Ka’bah. So, I stood by him, not too far, and Allah refused to allow that I not hear anything of what the Prophet ﷺ had to say. I heard good things from him, and I said to myself: “May my mother be bereft of me! For I swear by Allah, that I am an intelligent man, a poet! I do not confound truth and falsehood together (lit. the good and the ugly). What then is keeping me from listening to the words that this man is saying? If what he is bringing forth is something good, then I shall accept it; and if it is something bad then I shall leave it.” (Tufayl continues): “So I stayed there until the Messenger of Allah ﷺ left to go back to his house, and so I followed him, until he went in, and I followed him there too.", "I said: “Oh Muhammad! Your people said to me such-and-such (preventing me from meeting you or listening to what you have to say). By Allah, they did not stop until they had scared me so much, that I had plugged up my ears with cotton, so that I wouldn’t be able to hear what you said. But then Allah willed it so that I should hear what it is that you are claiming, and I heard from you a goodly word. I entreat you then, present to me your affair.” So, (the Prophet ﷺ) then presented to me Islam and recited the Quran to me as well.", "And by Allah, I had never heard more exquisite words, nor something more just and right. Upon that, I accepted Islam and bore witness to the truth. Then I said: ‘O Prophet of Allah! I am a man who is followed and obeyed by his people, and I am returning to them, and I shall call them to Islam. So please pray to Allah that He gives me a sign (or a miracle) to which I am calling them to.” And then the Prophet ﷺ said: “Oh Allah give him a sign.’” Tufayl continues narrating his story: “Then I returned to my people and had reached an opening in the mountains which led me to the place where water is gathered.", "All of a sudden, a light appeared between my eyes, which looked like a lamp had been lit. And I said: “O Allah! Please place else where than in my face! For verily I fear that people think that it is some sort of disfigurement that happened to me because I have abandoned their religion.” So, the light went to the pommel of my whip, and the people at the watering-place saw that light as some sort of suspended candle, all the while I am descending towards them from the mountain pass, until I came to them and was not amongst them.", "When I got there, my father came to me, and he was an elderly man, so I said to him: “Get away from me!” For I am not from you nor are you from me! And he responded to me: “Why is that my son?” I said: “I have accepted Islam and have followed the religion of Muhammad ﷺ.” At which he replied: “My son, my religion is your religion.” Then I said to him: “go now and wash yourself and purify your clothes, then come back. I shall teach you what he has taught me.” And he went and washed and purified his clothes, and when he came back, I presented to him Islam, which he then accepted.”", "“Then my wife came to me, and I said to her: “get away from me! I am not from you, and you are not from me!” She responded: “Why!? May my father and mother be your ransom.” Then I said: “Islam has separated us; I have followed the religion of Muhammad ﷺ.” To which she responded: “My religion is your religion.” I instructed her: “go and purify yourself,” which she did. Then she came back, and I presented to her Islam, which she then accepted. Then I turned my attention to calling the entire tribe of Daws to Islam, but they were slow in coming. I went back to the Messenger of Allah ﷺ in Makkah and said to him: “Oh Prophet of Allah! The people of Daws have been overcome with fornication, vain play, and what other people may think of them, so ask Allah to guide them.” Then the Prophet ﷺ said: “Oh Allah, guide the people of Daws to Islam. Now go back (Tufayl) to your people and be kind to them.” I continued to call the tribe of Daws to Islam until the Messenger of Allah ﷺ migrated to al-Madeenah, and the battles of Badr, Uhud, and of the Trench all came to pass.", "Then I went back to the Messenger of Allah ﷺ with those of my people who had accepted Islam, and he, ﷺ was at Khaybar. I arrived at al-Madeenah and with me were 70 or 80 families from Daws, then we met up with the Messenger of Allah ﷺ at Khaybar and he gave us a share (of the spoils of war).” Tufayl (may Allah be well pleased with him) stayed with the Prophet ﷺ until the conquest of Makkah. He, may Allah be well pleased with him, also stayed in al-Madeenah until the Messenger of Allah ﷺ passed away. When the Arabs apostatized, he went out with the Muslims and fought with them until they were rid of Tulayhah, and all of Najd was under control. Then he went out to Yamaamah with the Muslims and was martyred there as well."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 10, "stage": 2, "title": "حصار قريش للمسلمين في شعب أبي طالب", "date": "محرم 6 ق.هـ، الموافق 616م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["لمَّا عَزمتْ قُريشٌ أنْ تَقتُلَ رسولَ الله صلى الله عليه وسلم أجمع بَنو عبدِ المُطَّلِبِ أمرَهم على أنْ يُدخِلوا رسولَ الله صلى الله عليه وسلم شِعبَهم ويَحموهُ فيه، فعن أبي هُريرةَ رضي الله عنه، قال: قال النَّبيُّ صلى الله عليه وسلم مِنَ الغَدِ يومَ النَّحْرِ، وهو بمِنًى: «نحن نازِلون غدًا بِخَيْفِ بني كِنانةَ؛ حيث تقاسموا على الكُفرِ» يعني ذلك المُحَصَّبَ، وذلك أنَّ قُريشًا وكِنانةَ، تحالفتْ على بني هاشمٍ وبني عبدِ المُطَّلبِ، أو بني المُطَّلبِ: أنْ لا يُناكِحوهُم ولا يُبايِعوهُم، حتَّى يُسلِموا إليهِمُ النَّبيَّ صلى الله عليه وسلم، فدخلوا الشِّعْبَ جميعًا مُسلِمهُم وكافِرهُم، وأجمعَ المشركون أمرَهُم على أنْ لا يُجالِسوهُم، ولا يُخالِطوهُم، ولا يُبايِعوهُم، ولا يَدخُلوا بُيوتَهم، حتَّى يُسلِموا رسولَ الله للقتلِ، وكتبوا في ذلك صَحيفةً، فلبِث بنو هاشمٍ في شِعبهِم ثلاثَ سِنينَ، واشتدَّ عليهِم البلاءُ والجهدُ والجوعُ، فلمَّا كان رأس ثلاثِ سِنينَ تَلاوَمَ رجالٌ من قُريشٍ على ما حدث وأجمعوا على نَقضِ الصَّحيفةِ، وهكذا انتهتْ المقاطعةُ."], "url": "https://dorar.net/history/event/22", "route": null, "stations": null, "title_en": "Embargo and Boycott of the Hashemites", "date_en": "Muharram 6 BH (616 CE)", "place_en": "Makkah", "summary_en": "When Quraysh resolved to kill the Prophet ﷺ, Banu Hashim and Banu al-Muttalib sheltered him in their valley. Quraysh then signed a pact to boycott them, and they endured hunger and hardship for years.", "people": [], "dorar": 22, "asbab": [], "body_en": ["When Quraysh had all resolved that they would kill the Messenger of Allah ﷺ Banoo Abdul-Mutallab had all agreed that they would enter him into their quarters and protect him there. Narrated Aboo Hurayrah (may Allah be well pleased with him): “The Prophet ﷺ said from tomorrow shall be the day of slaughter and he was at Mina. ‘We are descending tomorrow upon the valley of Banee Kinaanah; as they have agreed on disbelief.’” Meaning, the place where stones are thrown at Minaa (al-Muhassab). What happened was that Banoo Kinaanah and Quraysh agreed to join forces against the tribe of Banoo Haashim and Banoo Abdul-Mutallab or simply Banoo al-Muttalab.", "They agreed that none of them would marry anyone from them, nor do business with them until they deliver to them the Prophet ﷺ so, they all entered the quarters: the Muslims and the disbelievers among the Hashemites. The polytheists had all agreed that they would not sit with them, nor mix with them, do business with them, nor enter their homes, until they hand over the Prophet ﷺ in order that he may be executed. They wrote all of this down on a piece of parchment (which they had hung on the Ka’bah). The tribe of Banoo Haashim stayed in their quarters for a total of 3 years.", "And during that period, the trials, tribulations, and famine became severe. At the end of the third year, men from Quraysh began to decry what the rest of their tribe were doing, and they had all agreed that they would rescind what was in the agreement that had been hung in the Ka’bah. The Prophet ﷺ then informed them that only the words of disbelief and oppression remained in that document. By that, the boycott ended."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 11, "stage": 2, "title": "نَقْضُ قريش لمِيثاقِ الصَّحيفةِ", "date": "محرم 3 ق.هـ، الموافق 619م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["بعدَ مُرورِ عامينِ أو ثلاثةِ أَعوامٍ مِنَ الحِصارِ الظَّالمِ في شِعْبِ أبي طالبٍ نُقِضتْ الصَّحيفةُ وفُكَّ الحِصارُ؛ وذلك أنَّ قُريشًا كانوا بين راضٍ بهذا الميثاقِ وكارهٍ له، فسعى في نَقْضِ الصَّحيفةِ مَنْ كان كارهًا لها, وكان القائمُ بذلك هشامُ بنُ عَمرٍو مِن بني عامرِ بنِ لُؤَيٍّ, وكان يَصِلُ بني هاشمٍ في الشِّعْبِ مُستَخفِيًا باللَّيلِ بالطَّعامِ, فإنَّه ذهب إلى زُهيرِ بنِ أبي أُمَيَّةَ المخزوميِّ -وكانت أمُّه عاتِكَةَ بنتَ عبدِ المُطَّلبِ- وقال: يا زُهيرُ، أَرَضيتَ أنْ تَأكُلَ الطَّعامَ، وتَشربَ الشَّرابَ، وأَخوالُكَ بحيث تعلمُ؟ فقال: ويحكَ، فما أصنعُ وأنا رجلٌ واحدٌ؟ أما والله لو كان معي رجلٌ آخرُ لقمتُ في نَقضِها.", "قال: قد وجدتَ رجلًا. قال: فمن هو؟ قال: أنا. قال له زُهيرٌ: ابْغِنا رجلًا ثالثًا. فذهب إلى المُطْعِمِ بنِ عَدِيٍّ، فذكَّرهُ أَرحامَ بني هاشمٍ وبني المُطَّلبِ ابنيْ عبدِ مَنافٍ، ولَامَهُ على مُوافقتِهِ لِقُريشٍ على هذا الظُّلمِ، فقال المُطْعِمُ: ويحكَ، ماذا أصنعُ؟ إنَّما أنا رجلٌ واحدٌ.", "قال: قد وجدتَ ثانيًا. قال: من هو؟ قال: أنا. قال: ابغِنا ثالثًا. قال: قد فعلتُ. قال: من هو؟ قال: زُهيرُ بنُ أبي أُمَيَّةَ. قال: ابغِنا رابعًا. فذهب إلى أبي البَخْتريِّ بنِ هشامٍ، فقال له نحوًا ممَّا قال للمُطْعِمِ، فقال: وهل مِن أحدٍ يُعينُ على هذا؟ قال: نعم. قال: مَن هو؟ قال زُهيرُ بنُ أبي أُمَيَّةَ، والمُطْعِمُ بنُ عَدِيٍّ، وأنا معك.", "قال: ابغِنا خامسًا. فذهب إلى زَمعةَ بنِ الأسودِ بنِ المُطَّلبِ بنِ أسدٍ، فكلَّمهُ, وذكر له قرابتَهُم وحقَّهُم، فقال له: وهل على هذا الأمرِ الذي تُدعوني إليه مِن أحدٍ؟ قال: نعم. ثم سَمَّى له القومَ، فاجتمعوا عند الحَجُونِ، وتعاقدوا على القيامِ بنَقضِ الصَّحيفةِ، وقال زُهيرٌ: أنا أَبدأُكم فأكونُ أوَّلَ مَن يتكلَّمُ.", "فلمَّا أصبحوا غَدَوْا إلى أَنْدِيَتِهِم، وغدا زُهيرٌ عليه حُلَّةٌ، فطاف بالبيتِ سبعًا، ثمَّ أقبل على النَّاسِ، فقال: يا أهلَ مكَّة، أنأكلُ الطَّعامَ, ونَلبَسُ الثِّيابَ, وبنو هاشمٍ هَلْكى، لا يُباع ولا يُبتاعُ منهم؟ والله لا أقعدُ حتَّى تُشَقَّ هذه الصَّحيفةُ القاطعةُ الظَّالمةُ.", "قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلٍ</span>, وكان في ناحيةِ المسجدِ: كذبتَ، والله لا تُشَقُّ. فقال زَمعةُ بنُ الأسودِ: أنت والله أَكْذَبُ، ما رضينا كتابتَها حيث كُتِبتْ. قال أبو البَخْتريِّ: صدق زَمعةُ، لا نرضى ما كُتِبَ فيها، ولا نُقِرُّ به. قال المُطْعِمُ بنُ عَدِيٍّ: صدقتُما، وكذب مَن قال غيرَ ذلك، نبرأُ إلى الله منها وممَّا كُتِبَ فيها.", "وقال هشامُ بنُ عَمرٍو نحوًا من ذلك. فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلٍ</span>: هذا أمر قُضِيَ بليلٍ، وتُشُووِر فيه بغيرِ هذا المكانِ. <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">وأبو طالبٍ</span> جالسٌ في ناحيةِ المسجدِ، إنمَّا جاءهُم لأنَّ الله كان قد أَطلعَ رسولَه صلى الله عليه وسلم على أمرِ الصَّحيفةِ، وأنَّه أرسلَ عليها الأَرَضَةَ، فأكلتْ جميعَ ما فيها من جَورٍ وقَطيعةٍ وظُلمٍ إلا ذكرَ الله عزَّ وجلَّ، فأَخبر بذلك عمَّه، فخرج إلى قُريشٍ فأخبرهم أنَّ ابنَ أخيهِ قد قال كذا وكذا، فإنْ كان كاذبًا خَلَّيْنا بينكم وبينه، وإنْ كان صادقًا رجعتُم عن قطيعتِنا وظُلمِنا.", "قالوا: قد أنصفتَ. وبعد أنْ دار الكلامُ بين القومِ وبين <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبي جهلٍ</span>، قام المُطعمِ إلى الصَّحيفةِ لِيَشُقَّها، فوجد الأَرَضَةَ قد أكلتْها إلَّا (باسمِك اللَّهمَّ)، وما كان فيها مِن اسمِ الله فإنَّها لم تأكلْهُ. ثم نقضَ الصَّحيفةَ وخرج رسولُ الله صلى الله عليه وسلم ومَن معه مِنَ الشِّعبِ، وقد رأى المشركون آيةً عظيمةً مِن آياتِ نُبوَّتِه، ولكنَّهم كما أخبر الله عنهم: (وَإِن يَرَوْا آيَةً يُعْرِضُوا وَيَقُولُوا سِحْرٌ مُّسْتَمِرٌّ ) أعرضوا عن هذه الآيةِ وازدادوا كُفرًا إلى كُفرهِم."], "url": "https://dorar.net/history/event/23", "route": null, "stations": null, "title_en": "The Nullification of the Parchment, Laying Out the Agreement to Boycott the Hashemites and Banoo al-Muttalib", "date_en": "Muharram 3 BH (619 CE)", "place_en": "Makkah", "summary_en": "After two or three years of siege, men of Quraysh who opposed the boycott worked to annul the pact, and the siege of the valley ended.", "people": ["abujahl", "abutalib"], "dorar": 23, "asbab": [], "body_en": ["After the oppressive embargo had lasted for 2 or 3 years upon the kinsfolk of Aboo Taalib, the embargo was lifted, and the parchment was torn. This happened because the people of Quraysh were divided between those who approved the embargo and those who despised it. The one who led the efforts to end this embargo was Hishaam ibn ‘Amr, from the tribe of Banee ‘Aamir ibn Lu’ayy; he used to secretly bring food to them in their quarters during the cover of the night. One day, he went to see Zuhayr ibn Abee Umayyah al-Makhzoomee, whose mother was ‘Aatikah bint Abdul-Mutallab and said to him: “Oh Zuhayr, are you satisfied with eating and drinking whilst your maternal uncles are enduring the suffering that you are aware of?”", "Zuhayr responded: “Woe to you! What am I supposed to do, and I am only one man, alone?” I swear by Allah that if another man were with me, I would stand up and nullify the boycott.” Hishaam then said to him: “You have found another man…” Zuhayr asked: “and who is that man?” Hishaam said: “me”; and then Zuhayr added: “we need a third”. Hishaam then went to see al-Mut’im ibn ‘Adee and reminded him of the connection that Banoo Haashim and Banoo al-Muttalib have with Banoo ‘Abdu Manaaf. He then chastised his agreeing with Quraysh to enact the oppressive boycott.", "Al-Mut’im then said: “Woe to you! What am I supposed to do? I am only one man.” Hishaam then said to him: “you have found a second one”. Al-Mut’im then said: “and who is that?” Hishaam responded: “me”, but Mut’im then said: “we need a third” to which Hishaam replied: “I already found one.” But al-Mut’im then said: “who is he?” Hishaam responded: “Zuhayr ibn Abee Umayyah”; but al-Mut’im said: “we need a fourth”. So Hishaam then went to see Aboo al-Bakhtaree ibn Hishaam and told him the same thing he told the other two.", "But Aboo’l-Bukhtaree then asked him: “Is there anyone who will help with this?” He said: “yes”, so Aboo al-Bakhtaree asked: “who?” Hishaam responded: “Zuhayr ibn Abee Umayyah, al-Mut’im ibn ‘Adee, and I myself am with you. But al-Bakhtaree said: “we need a fifth,” so Hishaam then went to Zam’ah ibn al-Aswad ibn al-Muttalib ibn Asad, and he told him the same he had told the others, and he mentioned the family ties that he has with those being oppressed and their rights they have with him. Zam’ah then said: “Is there anyone else taking part in this thing that you are calling me to?” Hishaam said: “yes”, and he proceeded to name the people that were with him. They then all met together at al-Hajoon, and they all pledged that they would stand up against the embargo. Zuhayr then stood and said: “I am the one who brought you all together (on this matter), so I should be the one to stand up first and speak up. The next day, when everyone went to their places of gathering, Zuhayr went to the Ka’bah wearing a good robe and made tawaf seven times.", "Then he came towards the people and said: “Oh people of Makkah! How come we eat food and wear clothes whilst Banoo Haashim are perishing! No one sells nor buys anything from them! By Allah, I will not sit until that oppressive and divisive parchment is torn to pieces!” Aboo Jahl, who was off to the side of the Mosque, retorted: “You lie! By Allah! It will not be torn!” Zam’ah ibn al-Aswad then said: “I swear by Allah that you are the biggest liar! We were never pleased with it the moment it was written!” Then Aboo al-Bakhtaree said: “Zam’ah is telling the truth. We are not pleased with what has been written in that parchment, nor do we approve of it.”", "Al-Mut’im ibn Adee then added: They have both told the truth, and whosoever says differently is a liar! We free ourselves in front of Allah and from what has been written therein.” Hishaam ibn ‘Amr said something similar as well. Aboo Jahl then said: “This was decided upon overnight, and you have discussed it in other than this place.” Aboo Taalib had been sitting in another part of the Mosque, and he came to them only because he had been informed that Allah had informed the Messenger of Allah ﷺ about what was happening with the parchment, and that He had sent termites to eat up every single part of the parchment which mentioned alienation and oppression except for where it mentioned the Name of Allah, the Mighty and Majestic.", "Aboo Taalib went to Quraysh and told them his nephew had told him such-and-such, and if he is lying then we have freed ourselves from between the two of you. But if he is truthful, then you shall relinquish us from your alienation and boycott.” Quraysh then said: “You have spoken fairly”. After the people and Aboo Jahl exchanged words, al-Mut’im went to the parchment in order to tear it up, but he had found the termites had already eaten it except for the part where it said: “O Allah! By Your Name.” They had not touched the part of the document which mentioned Allah’s Name.", "The document was then nullified, and the Messenger of Allah ﷺ and those with him came out from the quarters of the Banoo Haashim. On that day the polytheists had seen the greatest of signs that testified to his prophethood, however, they were as Allah described them: {And when they are shown a sign, they still deny it and say “this is but ceaseless magic”}. They neglected this sign and they only increased in their disbelief."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 12, "stage": 2, "title": "وَفاةُ أمِّ المؤمنين خَديجةَ بنتِ خويلدٍ رضِي الله عنها", "date": "رمضان 3 ق.هـ، الموافق 620م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["هي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> بنتُ خويلدِ بنِ أسدِ بنِ عبدِ العُزَّى بنِ قُصَيِّ بنِ كِلابٍ، مِن خيرِ نِساءِ الدُّنيا، أتى جبريلُ النَّبيَّ صلى الله عليه وسلم فقال: يا رسولَ الله، هذه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خديجةُ</span> قد أتتْكَ بإناءٍ فيه إدامٌ -أو طعامٌ أو شرابٌ- فإذا أتتْكَ فَاقرأْ عليها السَّلامَ مِن رَبِّها ومِنِّي، وبَشِّرها بِبيتٍ في الجنَّةِ من قَصبٍ لا صَخَبَ فيهِ ولا نَصَبَ .", "كانتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> أوَّلَ مَنْ أَسلمَ بالنَّبيِّ صلى الله عليه وسلم. آمنتْ بهِ إذ كفرَ بهِ النَّاسُ، وآوَتْهُ إذ رَفضهُ النَّاسُ، وصَدَّقتهُ إذ كَذَّبهُ النَّاسُ، ورزقهُ الله منها الوَلَدَ: القاسِمَ، والطَّيِّبَ، والطَّاهِرَ، ماتوا رضعًا، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ruqayya\">ورُقيَّةَ</span>، وزَينبَ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummkulthum\">وأمَّ كَلثومٍ</span>، وفاطمةَ, توفِّيتْ رضي الله عنها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">وأبو طالبٍ</span> في عامٍ واحدٍ، فتتابعتْ على رسولِ الله صلى الله عليه وسلم المصائبُ بموتهِما, فكانتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> وَزيرةَ صِدقٍ على الإسلامِ، وكان النَّبيُّ صلى الله عليه وسلم يَسكُن إليها.", "«توفِّيتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> قبلَ مَخرجِ النَّبيِّ صلى الله عليه وسلم إلى المدينةِ بثلاثِ سِنينَ، فلَبِثَ سَنتينِ أو قريبًا من ذلك، ونكحَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> وهي بنتُ سِتِّ سِنينَ، ثمَّ بنى بها وهي بنتُ تِسعِ سِنينَ» توفِّيتْ أمُّ المؤمنين <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةُ</span> بنتِ خويلدٍ رضِي الله عنها في مكَّة، ودُفِنتْ بالحَجونِ."], "url": "https://dorar.net/history/event/24", "route": null, "stations": null, "title_en": "The Death of the Mother of the Believers, Khadeejah bint Khuwaylid, May Allah Be Well Pleased with Her", "date_en": "Ramadan 3 BH (620 CE)", "place_en": "Makkah", "summary_en": "Khadijah, the Prophet's ﷺ first wife and the first to believe in him, passed away in Makkah, and the Prophet ﷺ grieved deeply for her.", "people": ["khadija", "abutalib", "aisha", "ruqayya", "ummkulthum"], "dorar": 24, "asbab": [], "body_en": ["She is Khadeejah bint Khuwaylid ibn Asad ibn ‘Abdul-Uzza ibn Qusay ibn Kilaab; of the best women of this Earth. Jibreel came to the Messenger of Allah ﷺ and said: “O Messenger of Allah! This is Khadeejah coming to you with a dish having meat soup (or some food or drink). When she reaches you, greet her on behalf of her Lord (i.e. Allah) and on my behalf, and give her the glad tidings of palaces in Paradise made from ornamental threads in which there is no tumult nor any distress.” Khadeejah was the first to have believed in the Prophet ﷺ while everyone else had disbelieved; she protected him while everyone else rejected him.", "She attested to what he said as being the truth, while everyone else was giving him the lie. Allah gave him ﷺ through her, sons: al-Qaasim, al-Tayyib, and al-Taahir, who all died when they were infants; as well as daughters: Ruqayyah, Zaynab, Umm Kalthoom, and Faatimah. She died, may Allah be well pleased with her, in the same year in which Aboo Taalib died. After their death, the calamities descended upon the Prophet ﷺ. Khadeejah was a faithful counsellor for Islam, and the Prophet ﷺ would turn to her for comfort and consultation.", "Khadeejah, may Allah be well pleased with her, died three years before the departure of the Prophet ﷺ to al-Madeenah. Then approximately two years passed until he ﷺ married ‘Aaishah (may Allah be pleased with her) who was a girl of six years at that time. Then he consummated the marriage and took her in when she turned nine. Khadeejah (may Allah be pleased with her) died in Makkah and was buried at al-Hajoon."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 13, "stage": 2, "title": "خُروجُ رسولِ الله صلَّى الله عَليهِ وسلَّم إلى الطَّائفِ", "date": "شوال 3 ق.هـ، الموافق 620م", "place": "الطائف", "lat": 21.2703, "lng": 40.4158, "approx": false, "zoom": 8, "paras": ["خرج النَّبيُّ صلى الله عليه وسلم إلى الطَّائفِ، وهي تَبعُد عن مكَّة نحوَ سِتِّينَ مِيلًا، سارها ماشِيًا على قَدميهِ جِيئةً وذِهابًا، ومعه مولاهُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارثةَ</span>، وكان كُلَّما مَرَّ على قَبيلةٍ في الطَّريقِ دعاهُم إلى الإسلامِ، فلمْ تُجبْ إليهِ واحدةٌ منها, فلمَّا انتهى إلى الطَّائفِ عَمَدَ إلى رُؤسائِها فدعاهُم فلمْ يَستجيبوا له, فأقام بين أهلِ الطَّائفِ عشرةَ أيَّامٍ، لا يَدَعُ أحدًا مِنْ أشرافهِم إلا جاءهُ وكَلَّمهُ، فقالوا: اخرُجْ من بلادِنا.", "وأَغْرَوْا به سُفهاءَهُم، فلمَّا أراد الخُروجَ تَبِعَهُ سُفهاؤهُم وعَبيدهُم يُسِبُّونَهُ ويُصيحونَ بهِ، حتَّى اجتمع عَليهِ النَّاسُ، فوقَفوا له سِمَاطَيْنِ <span class=\"ref\">[أي صَفَّيْنِ]</span> وجعلوا يَرمونهُ بالحِجارةِ، وبكِلماتٍ مِنَ السَّفَهِ، ورَجموا عَراقيبَهُ، حتَّى اخْتَضَبَ نَعلاهُ بالدِّماءِ.", "وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارثةَ</span> يَقِيهِ بِنفسهِ حتَّى أصابهُ شِجَاجٌ في رَأسهِ، ولم يزلْ بهِ السُّفهاءُ كذلك حتَّى أَلجأوهُ إلى حائطٍ لعُتبةَ وشَيبةَ ابنيْ رَبيعةَ على ثلاثةِ أميالٍ مِنَ الطَّائفِ, ورجع رسولُ الله صلى الله عليه وسلم في طريقِ مكَّة بعدَ خُروجهِ مِنَ الحائطِ كَئيبًا مَحزونًا، كَسيرَ القلبِ، فلمَّا بلغ قَرْنَ المنازلِ بعث الله إليه جبريلَ ومعه مَلَكُ الجبالِ، يَسْتَأْمِرُهُ أنْ يُطْبِقَ الأَخْشَبَيْنِ على أهلِ مكَّة, فقال النَّبيُّ صلى الله عليه وسلم: (بل أرجو أنْ يُخرجَ الله عزَّ وجلَّ من أصلابهِم مَنْ يَعبدُ الله عزَّ وجلَّ وحدَه لا يُشركُ بهِ شيئًا).", "وفي هذا الجوابِ الذي أَدلى بهِ الرَّسولُ صلى الله عليه وسلم تَتجلَّى شَخصيَّتُه الفَذَّةُ، وما كان عَليهِ من خُلُقٍ عَظيمٍ."], "url": "https://dorar.net/history/event/25", "route": [[21.4225, 39.8262], [21.4, 40.1], [21.2703, 40.4158]], "stations": null, "title_en": "The Messenger of Allah ﷺ Leaving Makkah to al-Taa’if", "date_en": "Shawwal 3 BH (620 CE)", "place_en": "Taif", "summary_en": "The Prophet ﷺ walked to Taif with Zayd ibn Harithah to call its people to Islam. They rejected him harshly and set their youths on him, who pelted him with stones.", "people": ["zayd"], "dorar": 25, "asbab": [], "body_en": ["The Prophet ﷺ went to al-Taa’if, a city 60 miles away from Makkah; he went there walking on his feet and came back that way as well. Zayd ibn Haarithah, his servant, was with him as well. Every tribe they passed by on their way to al-Taa’if, he ﷺ would call them to Islam, but not a single person of those tribes answered the call. When they finally arrived at al-Taa’if, the Prophet ﷺ went directly to its leaders and called them to Islam, but nobody responded to him. He stayed amongst the people of al-Taa’if for a total of ten days during which he ﷺ called every noble and leader among them to Islam.", "However, they said to him: “Get out from our lands!”, and they asked their riffraff and their slaves to goad and taunt him. On his way out of al-Taa’if, they insulted and yelled at him until a large gathering of people gathered around him. Two rows of people stood on either side of him ﷺ throwing rocks and insulting him; they pelted his ankles until his sandals were filled with blood. Zayd ibn Haarith was trying to protect him with his own body until he suffered a head injury from the rocks. The people did not stop until he sought refuge in a walled garden belonging to ‘Utbah and Shaybah, the sons of Rabee’ah, which is 3 miles away from al-Taa’if.", "Then, the Messenger of Allah ﷺ made his way back to Makkah feeling downtrodden and broken hearted. When he reached Qarn al-Manaazil (i.e., the Miqaat for the people of Najd and surrounding areas), Allah, Exalted be He, sent Jibreel with the Angel of the Mountains so that the Prophet ﷺ may order him to push the two mountains towering over Makkah in order to crush its people. But the Prophet ﷺ refused saying: “Rather, I hope that one day Allah, the Mighty and Majestic brings forth from their loins a generation who will worship Allah, the Mighty and Majestic, without associating with Him anything.” This answer is an indication of the Prophet’s ﷺ unique personality, and his immense and noble character."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 14, "stage": 2, "title": "إِسلامُ الجِنِّ وتَوافُدهُم على النَّبيِّ صلَّى الله عَليهِ وسلَّم", "date": "شوال 3 ق.هـ، الموافق 620م", "place": "نخلة", "lat": 21.53, "lng": 40.08, "approx": false, "zoom": 8, "paras": ["لمَّا انصرف النَّبيُّ صلى الله عليه وسلم مِنَ الطَّائفِ راجعًا إلى مكَّة، حتَّى إذا كان بِنَخْلَةَ، قام من جوفِ اللَّيلِ يُصلِّي، فمَرَّ بهِ النَّفرُ مِنَ الجِنِّ الذين ذكَرهُم الله تعالى، وكانوا سَبعةَ نَفَرٍ من جِنِّ أهلِ نَصِيبِينَ، فاستمعوا لِتِلاوةِ الرَّسولِ صلى الله عليه وسلم، فلمَّا فرغ من صلاتهِ، وَلَّوْا إلى قَومهِم مُنذِرين، قد آمنوا وأجابوا إلى ما سمِعوا، وفيهِم نزل قولُه تعالى: (وَإِذْ صَرَفْنَا إِلَيْكَ نَفَرًا مِّنَ الْجِنِّ يَسْتَمِعُونَ الْقُرْآنَ فَلَمَّا حَضَرُوهُ قَالُوا أَنصِتُوا فَلَمَّا قُضِيَ وَلَّوْا إِلَىٰ قَوْمِهِم مُّنذِرِينَ (٢٩) قَالُوا يَا قَوْمَنَا إِنَّا سَمِعْنَا كِتَابًا أُنزِلَ مِن بَعْدِ مُوسَىٰ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ يَهْدِي إِلَى الْحَقِّ وَإِلَىٰ طَرِيقٍ مُّسْتَقِيمٍ (٣٠) يَا قَوْمَنَا أَجِيبُوا دَاعِيَ اللَّهِ وَآمِنُوا بِهِ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ أَلِيمٍ(٣١) وَمَن لَّا يُجِبْ دَاعِيَ اللَّهِ فَلَيْسَ بِمُعْجِزٍ فِي الْأَرْضِ وَلَيْسَ لَهُ مِن دُونِهِ أَوْلِيَاءُ أُولَٰئِكَ فِي ضَلَالٍ مُّبِينٍ (٣٢)) <span class=\"ref\">[الأحقاف]</span> وبعدَ عِدَّةِ أَشهُرٍ من لِقاءِ الوفدِ الأوَّلِ مِنَ الجِنِّ بِرسولِ الله صلى الله عليه وسلم, جاء الوفدُ الثَّاني مُتشوِّقاً لِرُؤيةِ الحبيبِ المصطفى صلى الله عليه وسلم, والاستماعِ إلى كلامِ رَبِّ العالمين."], "url": "https://dorar.net/history/event/26", "route": [[21.2703, 40.4158], [21.53, 40.08], [21.4225, 39.8262]], "stations": null, "title_en": "Some of the Jinn Make Their Way to the Prophet ﷺ and Accept Islam", "date_en": "Shawwal 3 BH (620 CE)", "place_en": "Nakhlah", "summary_en": "Returning from Taif, the Prophet ﷺ stopped at Nakhlah and prayed at night, and a group of jinn listened to the Quran and believed, as the Quran itself mentions.", "people": [], "dorar": 26, "asbab": [{"id": "ASB-013", "k": "d"}], "body_en": ["After the Prophet ﷺ left al-Taa’if and made his way back to Makkah, he rested under a palm tree. During the night, he had gotten up to pray when a group of jinn passed by him, which were mentioned by Allah, the Most High (in the Quran); they were seven jinn in total from Nasaybeen. They listened to the Messenger of Allah’s ﷺ recitation, and when he had finished praying, they returned to their peoples announcing to them what they had heard. They believed in what they heard and had accepted it. They were the ones Allah mentioned in the Quran when He said: {˹Remember, O Prophet˺ when We sent a group of jinn your way to listen to the Quran.", "Then, upon hearing it, they said ˹to one another˺, “Listen quietly!” Then when it was over, they returned to their fellow jinn as warners. They declared, “O our fellow jinn! We have truly heard a scripture revealed after Moses, confirming what came before it. It guides to the truth and the Straight Way. O our fellow jinn! Respond to the caller of Allah and believe in him, He will forgive your sins and protect you from a painful punishment. And whoever does not respond to the caller of Allah will have no escape on earth, nor will they have any protectors against Him. It is they who are clearly astray.} (Al-Ahqaaf, 29 to 32) After several months, a second delegation came to the Messenger of Allah ﷺ longing to see the Beloved Prophet ﷺ and longing to hear the words of the Lord of the Worlds."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 15, "stage": 2, "title": "وَفاةُ أبي طالبٍ عَمِّ النَّبيِّ صلَّى الله عَليهِ وسلَّم", "date": "شوال 3 ق.هـ، الموافق 620م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["بعدَ أنِ اشْتدَّ المرضُ على <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبي طالبٍ</span> عَمِّ النَّبيِّ صلى الله عليه وسلم وهو الذي كفله صغيرًا، وآزرَهُ كبيرًا، وناصرَهُ على دَعوتهِ، وحَماهُ من عَوادي المشركين، دخل عَليهِ النَّبيُّ صلى الله عليه وسلم وعندهُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جَهْلٍ</span>، فقال: ( أي عَمِّ، قُلْ: لا إلَه إلَّا الله، كلمةً أُحاجُّ لك بها عندَ الله).", "فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جَهْلٍ</span> وعبدُ الله بنُ أبي أُمَيَّةَ: يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبا طالبٍ</span>، تَرغبُ عن مِلَّةِ عبدِ المُطَّلبِ؟ فلم يَزالا يُكلِّماهُ حتَّى قال آخرَ شيءٍ كَلَّمهُم بهِ: على مِلَّةِ عبدِ المُطَّلبِ. فقال النَّبيُّ صلى الله عليه وسلم: (لأَستَغفِرَنَّ لك ما لمْ أُنْهَ عنهُ). فنزلتْ: <span class=\"verse\">﴿مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُواْ أَن يَسْتَغْفِرُواْ لِلْمُشْرِكِينَ وَلَوْ كَانُواْ أُوْلِي قُرْبَى مِن بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ﴾</span>ونزلتْ: <span class=\"verse\">﴿إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ﴾</span> .", "وقد كان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abutalib\">أبو طالبٍ</span> الحِصْنَ الذي احتَمى بهِ النَّبيُّ صلى الله عليه وسلم من هَجماتِ الكُبراءِ والسُّفهاءِ، ولكنَّه بَقِيَ على مِلَّةِ الأَشياخِ من أَجدادهِ، فلمْ يُفلِحْ."], "url": "https://dorar.net/history/event/27", "route": null, "stations": null, "title_en": "The Death of Aboo Taalib, the Paternal Uncle of the Prophet ﷺ", "date_en": "Shawwal 3 BH (620 CE)", "place_en": "Makkah", "summary_en": "Abu Talib, the uncle who raised and protected the Prophet ﷺ, fell gravely ill and died. At his deathbed the Prophet ﷺ urged him to declare the testimony of faith.", "people": ["abutalib", "abujahl"], "dorar": 27, "asbab": [{"id": "ASB-014", "k": "d"}], "body_en": ["Aboo Taalib was the paternal uncle of the Prophet ﷺ the man who took care of him when he was young, supported him when he grew older, and defended him when he was calling people to Islam. When he became severely ill, the Prophet ﷺ went to visit him whilst Aboo Jahl was there as well. He ﷺ said: “O Uncle, say: “There is no god but Allah, a statement by which I shall intercede on your behalf in front of Allah.” Aboo Jahl and Abdullah ibn Abee Umayyah then said: “O Aboo Taalib! Would you prefer (anything else) over the religion of Abdul-Mutallab?” And they did not quit speaking to him until he said: “…[I am] upon the religion of Abdul-Mutallab,” to which the Prophet ﷺ responded: “I shall ask for your forgiveness until I am prevented from doing so.” Then it was revealed to the Prophet ﷺ {It is not ˹proper˺ for the Prophet and the believers to seek forgiveness for the polytheists, even if they were close relatives, after it has become clear to the believers that they are bound for the Hellfire} (Surah Tawbah, 113) and then it was revealed: {You surely cannot guide whoever you like ˹O Prophet˺, but it is Allah Who guides whoever He wills, and He knows best who are ˹fit to be˺ guided.} (Surah al-Qasas, 56).", "Aboo Taalib had been the fortress within which the Prophet ﷺ sought refuge and protection from the attacks of the arrogant leaders and riffraff from amongst Quraysh. However, he remained upon the religion of his forefathers, and failed in accepting Islam."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 16, "stage": 2, "title": "زَواجُ النَّبيِّ صلَّى الله عَليهِ وسلَّم من سَوْدَةَ بنتِ زَمْعَةَ رضِي الله عنها", "date": "شوال 3 ق.هـ، الموافق 620م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["بعدَ وفاةِ أمِّ المؤمنين <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةَ</span> بنتِ خويلدٍ رضي الله عنها والتي كانت مِن نِعَمِ الله الجَليلةِ على رسولِ الله صلى الله عليه وسلم، تَزوَّج رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"sawda\">سَودةَ</span> بنتَ زَمْعَةَ بنِ قَيسِ بنِ عبدِ شمسِ بنِ عبدِ وُدِّ بنِ نصرِ بنِ مالكِ بن حِسْلِ بنِ عامرِ بن لُؤَيٍّ، القُرشيَّةَ، تَزوَّجها بمكَّة قبلَ الهِجرةِ، وكانت ممَّن أسلمَ قديمًا, وهاجرتْ الهِجرةَ الثَّانيةَ إلى الحَبشةِ، وكان زوجُها السَّكرانَ بنَ عَمرٍو، وكان قد أَسلمَ وهاجر معها، فمات بأرضِ الحَبشةِ، أو بعدَ الرُّجوعِ إلى مكَّة، فلمَّا حَلَّتْ خطبَها رسولُ الله صلى الله عليه وسلم وتَزوَّجها، وكانتْ أوَّلَ امرأةٍ تَزوَّجها بعدَ وفاةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةَ</span>، وكانتْ في العَقْدِ السَّادسِ من عُمُرِها وقتَها، ولمَّا أراد النَّبيُّ صلى الله عليه وسلم طلاقَها صالَحَتْهُ بأنْ وَهبتْ نَوْبَتَها لِ<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> رضي الله عنها فأَمْسَكها، ولمْ يُصِبْ منها ولدًا حتَّى مات صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/28", "route": null, "stations": null, "title_en": "The Prophet ﷺ Marries Sawdah bint Zam’ah (May Allah Be Well Pleased with Her)", "date_en": "Shawwal 3 BH (620 CE)", "place_en": "Makkah", "summary_en": "After the death of Khadijah, the Prophet ﷺ married Sawdah bint Zam'ah, a widow who had migrated to Abyssinia.", "people": ["sawda", "khadija", "aisha"], "dorar": 28, "asbab": [], "body_en": ["After the death of the Mother of the Believers, Khadeejah bint Khuwaylid (may Allah be well pleased with her), who was one of the greatest blessings that Allah placed in the Prophet’s life, he ﷺ married Sawdah bint Zam’ah ibn Qays ibn Abdu Shams ibn Abdu Wudud ibn Nasr ibn Maalik ibn Hisl ibn ‘Aamir ibn Lu’ayy al-Qurashiyyah. He ﷺ married her in Makkah before the Hijrah and was amongst the early people who entered Islam. She was amongst the people who travelled in the second immigration to Abyssinia when she was still married to Al-Sakraan ibn ‘Amr, who entered Islam and travelled with her, at that time.", "He died there or after their return to Makkah. After she had completed her waiting period, the Messenger of Allah ﷺ asked for her hand in marriage; and she was the first woman he married after the death of Khadeejah, and she was in the 6th decade of her life, (i.e., she was in her sixties) when she got married. When the Prophet ﷺ intended to divorce her, she changed his mind by gifting her night with him to ‘Aishah (may Allah be well pleased with her) and so he ﷺ kept her. She did not bare him ﷺ any children, until the very day he ﷺ died."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 17, "stage": 3, "title": "بداية دخول الأنصار في الإسلام", "date": "ذي الحجة 3 ق.هـ، الموافق 620م", "place": "العقبة", "lat": 21.422, "lng": 39.873, "approx": false, "zoom": 11, "paras": ["لمَّا أراد الله عزَّ وجلَّ إظهارَ دينهِ، وإعزازَ نَبيِّهِ صلى الله عليه وسلم، وإنجازَ مَوعِدِه له خرج رسولُ الله صلى الله عليه وسلم في مَوسمِ الحجِّ يَعرِضُ نَفْسَهُ على قبائلِ العربِ، كما كان صنع في كُلِّ مَوسمٍ. فبينما هو عند العَقبةِ لَقِيَ رهطًا مِنَ الخَزرجِ أراد الله بهم خيرًا فقال لهم مَن أنتم؟ قالوا: نَفرٌ مِنَ الخَزرجِ، قال أمِن موالي يَهودَ؟ قالوا: نعم.", "قال أفلا تَجلِسون أُكلِّمكُم؟ قالوا: بلى. فجلسوا معه فدعاهم إلى الله عزَّ وجلَّ، وعرض عليهم الإسلامَ، وتلا عليهم القُرآنَ. وكان مما صنع الله لهم به في الإسلامِ أنَّ يَهودَ كانوا معهم في بلادِهم، وكانوا يتَوعَّدونَهُم بِقُربِ ظُهورِ نَبِيٍّ يتَّبِعونهُ ثمَّ يَقتلون معه العربَ قتلَ إِرَمَ, فلمَّا كلَّمهُم صلَّى الله عليه وسلَّم ودعاهم إلى الله قال بعضُهم لبعضٍ: يا قومُ، تعلموا والله إنَّه للنَّبيُّ الذي تَوعَّدكُم به يَهودُ فلا تَسْبِقَنَّكُم إليه.", "فأجابوه فيما دعاهم إليه وقالوا له: إنَّا قد تركنا قومَنا، ولا قومٌ بينهم مِنَ العَداوةِ والشَّرِّ ما بينهم، وعسى أن يجمعَهُم الله بكَ. فَسنَقدَمُ فنَدعوهُم إلى أمرِك، ونعرِضُ عليهم الذي أجبناك إليه من هذا الدِّينِ، فإن يَجمعْهُم الله عليك فلا رجلَ أعزُّ منك. ثمَّ انصرفوا راجِعين إلى بلادِهم، قد آمنوا وصدَّقوا\". فلمَّا قَدِموا المدينةَ إلى قومِهم ذكروا لهم رسولَ الله صلى الله عليه وسلم، ودَعوهُم إلى الإسلامِ حتَّى فَشا فيهِم فلمْ يَبْقَ دارٌ مِن دورِ الأنصارِ إلَّا وفيها ذِكْرٌ مِن رسولِ الله صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/29", "route": null, "stations": null, "title_en": "The Ansaar Starting to Accept Islam", "date_en": "Dhu al-Hijjah 3 BH (620 CE)", "place_en": "Aqabah", "summary_en": "During the pilgrimage season the Prophet ﷺ presented Islam to the tribes and met a group from the Khazraj of Yathrib, who accepted Islam and carried it back to their city.", "people": [], "dorar": 29, "asbab": [], "body_en": ["When Allah, Exalted be He, wanted to make His religion to become apparent, to strengthen His Prophet ﷺ and, to put into effect what He had promised him, he ﷺ approached the Arab tribes during the Hajj season and spoke to them about Islam, just as he would do every year. Whilst he was at al-‘Aqabah, he ﷺ met with a group of men from al-Khazjraj whom Allah wanted good for them. He ﷺ said to them: “Who are you?” They said: “A group of men from the Khazraj.” He ﷺ then said: “Are you from those who have allies with the Jews?”", "They said: “Yes” So then he ﷺ said: “Will you not sit with me so that I may speak with you for a moment?” They said: “Of course.” They all sat together, and he ﷺ called them to worship Allah, the Mighty and Majestic, and presented to them Islam, and recited to them the Quran. Allah facilitated for them to enter Islam because the Jews lived in their lands, and they would threaten them with the approaching arrival of a Prophet whom they shall all follow and then with whom they shall slay all the Arabs and cause them to disappear like Iram. [i.e., they already had knowledge that a Prophet will emerge].", "For this reason, when the Prophet ﷺ spoke to them and called them to Allah, they said to themselves: “O people! Know, by Allah, that this is the Prophet that the Jews keep threatening us with, do not let them reach him before we do!” As a result, the Khazraj that were there all accepted what he ﷺ called them to, and they said to him ﷺ: “Verily, we have left our people and there is enmity amongst them like no other. I hope that Allah gathers them all together through you. We shall go forth and call them to your matter (i.e., to Islam), and we shall present to them that which you have presented to us (i.e., Islam) and we accepted. If Allah gathers them together under you, then there shall be no man more powerful than you.”", "Then they left to return to their lands, having believed and attested to Islam. When they came back to al-Madeenah to their people, they mentioned to them the Messenger of Allah ﷺ and called them to Islam until it had become widespread amongst them. Thus, it came to pass that not a single house of the houses of the Ansaar went without mentioning the Messenger of Allah ﷺ."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 18, "stage": 3, "title": "زَواجُ النَّبيِّ مِن عائشةَ بنتِ أبي بكرٍ الصِّدِّيقِ رضِي الله عنهُما", "date": "محرم 2 ق.هـ، الموافق 620م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["تَزوَّج رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> الصِّدِّيقةَ رضي الله عنها وهي بنتُ سِتِّ سِنينَ, وبَنى بها بالمدينةِ في شَوَّال في السَّنةِ الثانية مِن الهِجرةِ وهي بنتُ تِسعِ سِنينَ, وكانت أَحظى أزواجِه عنده وأحبَّهُم إليه, ولمْ يتزوَّجْ بِكرًا غيرَها."], "url": "https://dorar.net/history/event/30", "route": null, "stations": null, "title_en": "The Prophet ﷺ Marries ‘Aaíshah bint Abee Bakr (May Allah Be Well Pleased with Her and Her Father)", "date_en": "Muharram 2 BH (620 CE)", "place_en": "Makkah", "summary_en": "The Prophet ﷺ married Aishah, daughter of Abu Bakr, in Makkah; she joined his household later in Madinah.", "people": ["aisha"], "dorar": 30, "asbab": [], "body_en": ["The Messenger of Allah ﷺ married ‘Aaishah al-Siddeeqqah (may Allah be well pleased with her) when she was a girl, six years of age. He ﷺ consummated the marriage and began living with her in al-Madeenah in the month of Shawwaal in the first year of the Hijrah when she was a girl nine years of age. She was his most favored and most beloved of wives, and she was the only virgin that the Prophet ﷺ married."], "src_en": "https://dorar.net/en/history?page=2"}, {"seq": 19, "stage": 3, "title": "بَيْعةُ العَقبةِ الأولى", "date": "ذي الحجة 2 ق.هـ، الموافق 621م", "place": "العقبة", "lat": 21.422, "lng": 39.873, "approx": false, "zoom": 11, "paras": ["عن عُبادةَ بنِ الصَّامتِ رضي الله عنه أحدُ النُّقَباءِ ليلةَ العَقبةِ: أنَّ رسولَ الله صلَّى الله عليه وعلى آله وصَحبِه وسلَّم قال وحولَه عِصابةٌ مِن أصحابهِ: (بايِعوني على أنْ لا تُشرِكوا بالله شيئًا، ولا تَسرِقوا، ولا تَزنوا، ولا تَقتُلوا أولادَكُم، ولا تَأتوا ببُهْتانٍ تَفتَرونهُ بين أيديكُم وأرجُلِكُم، ولا تَعْصوا في مَعروفٍ، فمَن وَفَّى منكم فأجرُهُ على الله، ومَن أصاب مِن ذلك شيئًا فعُوقِبَ في الدُّنيا فهو كفَّارةٌ له، ومَن أصاب مِن ذلك شيئًا ثمَّ سَترهُ الله فهو إلى الله، إن شاء عَفا عنه، وإن شاء عاقَبهُ) . قال: فبايَعناهُ على ذلك."], "url": "https://dorar.net/history/event/31", "route": null, "stations": null, "title_en": "The First Pledge of Allegiance at al-‘Aqabah", "date_en": "Dhu al-Hijjah 2 BH (621 CE)", "place_en": "Aqabah", "summary_en": "Twelve men from Yathrib met the Prophet ﷺ at Aqabah and pledged to worship Allah alone and to keep away from theft, adultery and other sins.", "people": [], "dorar": 31, "asbab": [], "body_en": ["Narrated ‘Ubaadah ibn al-Saamit (may Allah be well pleased with him), one of the representatives at the night of al-‘Aqabah: The Messenger of Allah ﷺ said, whilst surrounded by his Companions: “Pledge allegiance to me promising that you shall not associate partners with Allah, nor will you steal, nor fornicate, nor will you kill your children, nor will you utter any false accusations that you have conjured up within yourselves, nor will you violate any good action. Whosoever amongst you shall remain faithful to this pledge, your reward is with Allah, and whoever falls short, then they shall be punished accordingly in this world, and it shall be an expiation for them. And whosever contravenes something here and Allah covers him, then he belongs to Allah: if He wants, He shall forgive him, and if He wants, He shall punish him.” Everyone then pledged their allegiance."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 20, "stage": 3, "title": "الإسراءُ والمِعراجُ وفرضُ الصَّلواتِ الخمسِ", "date": "1 ق.هـ، الموافق 621م", "place": "بيت المقدس", "lat": 31.778, "lng": 35.2354, "approx": false, "zoom": 8, "paras": ["في هذه الحادثةِ العظيمةِ رأى النَّبيُّ صلى الله عليه وسلم الأنبياءَ، ورأى سِدرةَ المُنتهى وغيرَ ذلك مِنَ الآياتِ العظيمةِ، وفيها فُرِضتْ الصَّلواتُ الخمسُ، وهو أمرٌ تتَّفِقُ عليه رِواياتُ الصَّحيحينِ، وقد كذَّبتْ قُريشٌ وقوعَ حادثةِ الإسراءِ والمِعراجِ، وهذا أمرٌ اتَّفقتْ عليه رِواياتُ الصَّحيحينِ أيضًا، قال رسولُ الله صلى الله عليه وسلم:\"لقد رأيتُني في الحِجْرِ وقُريشٌ تسألُني عن مَسْرايَ، فسألَتني عن أشياءَ مِن بيتِ المَقدسِ لم أُثْبِتْها، فكُرِبْتُ كُربةً ما كُرِبْتُ مِثلَهُ قَطُّ». قال: \" فرفعهُ الله لي أنظرُ إليه، ما يسألوني عن شيءٍ إلَّا أنبأتُهم به، وقد رأيتُني في جماعةٍ مِنَ الأنبياءِ، فإذا موسى قائمٌ يُصلِّي، فإذا رجلٌ ضَرْبٌ، جَعْدٌ كأنَّه مِن رجالِ شَنُوءَةَ، وإذا عيسى ابنُ مريمَ عليه السَّلامُ قائمٌ يُصلِّي، أقربُ النَّاسِ به شَبَهًا عُروةُ بنُ مَسعودٍ الثَّقفيُّ، وإذا إبراهيمُ عليه السَّلامُ قائمٌ يُصلِّي، أَشْبَهُ النَّاسِ به صاحبُكم - يعني نَفْسَهُ - فحانتِ الصَّلاةُ فأَمَمْتُهُم، فلمَّا فَرَغْتُ مِنَ الصَّلاةِ قال قائلٌ: يا محمَّدُ، هذا مالكٌ صاحبُ النَّارِ، فَسلِّمْ عليه، فالتفَتُّ إليه، فبدأَني بالسَّلامِ \" ."], "url": "https://dorar.net/history/event/32", "route": [[21.4225, 39.8262], [31.778, 35.2354]], "stations": null, "title_en": "The Night Journey & Ascension to Heaven; Enacting the Five Daily Prayers", "date_en": "1 BH (621 CE)", "place_en": "Jerusalem", "summary_en": "In one night the Prophet ﷺ was taken from Makkah to Jerusalem, then ascended through the heavens, where he saw earlier prophets and the five daily prayers were made obligatory.", "people": [], "dorar": 32, "asbab": [{"id": "TAF-28", "k": "d"}], "body_en": ["During this significant night, the Prophet ﷺ saw all the other prophets and At the Lote Tree of the Utmost Boundary, as well as many other great signs. On that night, the five daily prayers were made obligatory, as confirmed by all the reports [on this matter] in Saheeh al-Bukhaaree and Saheeh Muslim. However, Quraysh denied that the Night Journey to Jerusalem and ascending to the Heaven could have ever happened, as confirmed by the reported recorded in Saheeh al-Bukhaaree and Saheeh Muslim. The Prophet ﷺ said: “I found myself in Hijr and the people of Quraish were asking me about my Night Journey. I was asked about things pertaining to Bait-ul-Maqdis, which I could not preserve (in my mind). I was very much vexed, so vexed as I had never been before. Then Allah raised it (Bait-ul-Maqdis) before my eyes. I looked towards it, and I gave them the information with whatever they questioned me. I also saw myself among the group of prophets. I saw Moses standing in prayer and found him to be a well-built man as if he was a man of the tribe of Shanoo'a.", "I saw Jesus, the son of Mary (peace be upon him) offering prayer, of all of men he had the closest resemblance with 'Urwa ibn Mas’ood al-Thaqafee. I saw Ibraaheem (peace be upon him) offering prayer; he had the closest resemblance with your companion (the Prophet himself) amongst people. When the time of prayer came, I led them. When I completed the prayer, someone said: This is Maalik, the keeper of the Hell; pay him salutations. I turned to him, but he preceded me in salutation.”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 21, "stage": 3, "title": "هِجرةُ أبي سَلمةَ وأمِّ سَلمةَ رضي الله عنهما", "date": "محرم 1 ق.هـ، الموافق 621م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلمةَ</span> عبدُ الله بنُ عبدِ الأسدِ أوَّلَ مَن هاجر إلى المدينةِ مِن أصحابِ رسولِ الله صلى الله عليه وسلم مِنَ المُهاجرين مِن قُريشٍ مِن بني مَخزومٍ، وكانتْ هِجرتُه إليها بعدَ بَيعةِ العَقبةِ الأولى، وقبلَ بَيعةِ العَقبةِ الثَّانيةِ، حين آذتْهُ قُريشٌ بعدَ مَرجعِهِ مِنَ الحَبشةِ، فعزم على الرُّجوعِ إليها، ثمَّ بَلغهُ أنَّ بالمدينةِ لهم إخوانًا، فعزم في الهِجرةِ إليها.", "قالتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummsalama\">أمُّ سَلمةَ</span>: لمَّا أجمع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلمةَ</span> الخُروجُ إلى المدينةِ رَحَّلَ لي بَعيرَهُ ثمَّ حملَني عليه، وجعل معي ابْنِي سَلمةَ بنَ أبي سَلمةَ في حِجْري، ثمَّ خرج يقود بي بَعيرَهُ، وانطلق به بنو عبدِ الأسدِ، وحبسني بنو المُغيرةِ عندهم وانطلق زوجي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلمةَ</span> إلى المدينةِ.", "قالتْ: ففُرِّق بيني وبين ابْنِي وبين زوجي. قالت: فكنتُ أخرُج كُلَّ غَداةٍ فأجلِسُ في الأَبْطَحِ، فما أزالُ أبكي حتَّى أُمْسي، سَنَةً أو قريبًا منها، حتَّى مَرَّ بي رجلٌ مِن بني عَمِّي أحدُ بني المُغيرةِ، فرأى ما بي فرحِمَني، فقال لِبَني المُغيرةِ: ألا تحرجون من هذه المِسكينةِ؟ فرَّقتُم بينها وبين زوجِها وبين ولدِها؟ قالت: فقالوا لي: الْحَقي بزوجِك إن شئتِ.", "قالت: فَرَدَّ بنو عبدِ الأسدِ إليَّ عند ذلك ابْنِي، قالت: فارتحلتُ بعيري، ثمَّ أخذتُ ابْنِي فوضعتُه في حِجْري، ثمَّ خرجتُ أُريدُ زوجي بالمدينةِ. قالت: وما معي أحدٌ من خَلقِ الله، حتَّى إذا كنتُ بالتَّنعيمِ لَقيتُ عُثمانَ بنَ طلحةَ بنِ أبي طلحةَ أخا بني عبدِ الدَّارِ، فقال: إلى أين يا ابنةَ أبي أُميَّةَ؟ قلتُ: أُريدُ زوجي بالمدينةِ.", "قال: أَوَمَا معكِ أحدٌ؟ قلتُ: ما معي أحدٌ إلَّا الله وابْنِي هذا. فقال: والله ما لكِ مِن مَتْرَكٍ. فأخذ بخِطامِ البَعيرِ فانطلق معي يَهْوي بي، فَوَالله ما صَحِبتُ رجلًا مِن العربِ قَطُّ أَرى أنَّه كان أَكرمَ منه، كان إذا بلغ المنزِلَ أناخ بي، ثمَّ استأخر عنِّي حتَّى إذا نزلتُ استأخر ببعيري فحَطَّ عنه ثمَّ قيَّدهُ في الشَّجرِ، ثمَّ تنحَّى إلى شجرةٍ فاضطجع تحتها.", "فإذا دَنا الرَّواحُ قام إلى بعيري فقدَّمهُ فَرَحَّلَهُ، ثمَّ استأخر عنِّي وقال: ارْكَبي. فإذا رَكِبْتُ فاستويتُ على بعيري أتى فأخذ بخِطامهِ فقادَني حتَّى يَنزِلُ بي، فلمْ يَزلْ يصنعُ ذلك بي حتَّى أَقْدَمَني المدينةَ، فلمَّا نظر إلى قريةِ بني عَمرِو بنِ عَوفٍ بقُباءٍ قال: زوجُكِ في هذه القريةِ.", "وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبو سَلمةَ</span> بها نازلًا، فادْخُليها على بركةِ الله. ثمَّ انصرف راجعًا إلى مكَّةَ. فكانت تقولُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummsalama\">أمُّ سَلمةَ</span>: ما أعلمُ أهلَ بيتٍ في الإسلامِ أصابهم ما أصاب آلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبي سَلمةَ</span>، وما رأيتُ صاحبًا قَطُّ كان أكرمَ مِن عُثمانَ بنِ طلحةَ. أَسلمَ عُثمانُ بنُ طلحةَ بنِ أبي طلحةَ العَبْدَريُّ بعدَ الحُدَيبيةِ."], "url": "https://dorar.net/history/event/33", "route": null, "stations": null, "title_en": "The Emigration of Aboo Salamah and Umm Salamah", "date_en": "Muharram 1 BH (621 CE)", "place_en": "Madinah", "summary_en": "Abu Salamah was the first of the Prophet's ﷺ Companions to migrate to Madinah, after the first pledge of Aqabah.", "people": ["abusalama", "ummsalama"], "dorar": 33, "asbab": [], "body_en": ["Aboo Salamah, Abdullah ibn Abd al-Asad was the first man to migrate to al-Madeenah from amongst the Companions of the Messenger of Allah ﷺ and the first of the Emigrants from amongst Quraysh, from Banee Makhzoom. He migrated there after the first pledge of allegiance at al-Aqabah and before the second one, and after Quraysh had harassed him upon his return from Abyssinia. That made him determined to return there, but then it reached him that there are Muslims at al-Madeenah, thus, he became determined to go there instead.", "Umm Salamah (may Allah be pleased with her) related: “When Aboo Salamah had gathered everything to leave to go to al-Madeenah, he put me on his camel and placed with me my son, Salamah ibn Abee Salamah, in my lap, and then he went to steer the camel. However, Banoo Abd al-Asad took him away from me, while Banoo al-Mugheerah detained me [against my will]. As for my husband, he left to go to al-Madeenah.” Then she added: “My husband and my son were separated from me! I used to go out every day to sit in the valley where I would cry all day until the evening. This lasted for about a year, until one day a man from my paternal cousins passed by me and felt sorry for me. He then said to Banoo al-Mugheerah: “Won’t someone help this poor woman? You’ve separated her from husband and her son.” They said to me: “You are free to go and meet your husband, if you wish”. Upon that, Banoo ‘Abd al-Asad returned to me my son, then I left on my camel and placed my son on my lap, then I left to go meet my husband in al-Madeenah.", "I was on my own without having a single person with me. However, when I reached al-Tan’eem, I met ‘Uthmaan ibn Talhah ibn Abee Talhah, a brother of Banoo Abd al-Daar, and he said to me: “O daughter of Banee Umayyah! Where are you going?” I responded: “I am going to my husband in al-Madeenah,” then he asked: “Do not you have anyone with you (to protect and guide you)?” I said: “I have none but Allah and my son here.” He said: “By Allah! I am not leaving you alone,” and he grabbed the reins of my camel guiding me. And by Allah, I have never met a man from amongst the Arabs more generous than he.", "When he would reach a place to spend the night, he would cause the camel to kneel, then move away until I got off, and then he would go and tie the camel to a tree. He would then take cover under a tree and lie beneath it to rest. When it came time to leave, he would fetch my camel and get it ready for me, then he would distance himself from me and would tell me to get on. When I would get on and stabilize myself on my camel, he would grab the reins and guide me until we reached the next point to rest. He did this repeatedly until we reached al-Madeenah.", "When he looked towards the village of Banee ‘Amr Ibn Awf, in Qubaa’, he said: “Your husband is in this village.” Aboo Salamah was there resting, completing his journey. He said to me: “So enter it, with the blessings of Allah.” Then he left heading back to Makkah.” Umm Salamah (may Allah be pleased with her) used to say: “I do not know of a family amongst the Muslims to whom happened the likes of which happened to the family of Aboo Salamah, and I never saw a companion, more generous and noble than ‘Uthmaan ibn Talhah.” He (‘Uthmaan ibn Talhah) accepted Islam after the Hudaybiyyah."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 22, "stage": 3, "title": "انتِشارُ الإسلامِ في يَثْرِبَ بعدَ العَقبةِ الأولى", "date": "محرم 1 ق.هـ، الموافق 621م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كتب الأنصارُ إلى رسولِ الله صلى الله عليه وسلم بعدَ بَيعةِ العَقبةِ الأولى أن يبعثَ لهم مَن يُصلِّي بهم ويُقريهِم القُرآنَ، فبعث رسولُ الله صلى الله عليه وسلم لهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"musab\">مُصعبَ</span> بنَ عُميرٍ, فكان في ضِيافةِ أَسعدَ بنِ زُرارةَ, وأخذ يدعو إلى الإسلامِ، وانتشر الإسلامُ في أهلِ يَثْرِبَ حتَّى لمْ يَبْقَ بيتٌ في يَثْرِبَ إلَّا وفيه مُسلمٌ أو مُسلمةٌ، وكان ممَّن أَسلمَ على يدِهِ سَيِّدا الأَوسِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saadmuadh\">سعدُ بنُ مُعاذٍ</span>، وأُسيدُ بنُ الحُضيرِ."], "url": "https://dorar.net/history/event/34", "route": null, "stations": null, "title_en": "Islam Spreads in Yathrib (al-Madeenah) After the First Pledge of Allegiance at al-Aqabah", "date_en": "Muharram 1 BH (621 CE)", "place_en": "Madinah", "summary_en": "The Prophet ﷺ sent Mus'ab ibn Umayr to Yathrib to teach the Quran and lead the prayer. Many accepted Islam through him, including Sa'd ibn Mu'adh, chief of the Aws.", "people": ["musab", "saadmuadh"], "dorar": 34, "asbab": [], "body_en": ["The Ansaar wrote to the Messenger of Allah ﷺ after the first pledge of allegiance at al-Aqabah, asking him to send to them someone to teach them how to pray and to recite to them the Quran. The Messenger of Allah ﷺ sent to them Mus’ab ibn Umayr, who was hosted by As’ad ibn Zuraarah whilst staying in Yathrib. When he arrived, he began calling people to Islam. Islam then spread amongst the people of Yathrib until there was not a single house except that it contained Muslims. Amongst those who embraced Islam at the hands of Mus’ab, the leaders of the tribe of Al-Aws: Sa’d ibn Mu’aadh and Usayd ibn al-Hudayr"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 23, "stage": 3, "title": "بَيعةُ العَقبةِ الثَّانيةِ", "date": "ذي الحجة 1 ق.هـ، الموافق 622م", "place": "العقبة", "lat": 21.422, "lng": 39.873, "approx": false, "zoom": 11, "paras": ["عن جابرٍ قال: (مكث رسولُ الله صلى الله عليه وسلم بمكَّةَ عشرَ سِنينَ يَتْبَعُ النَّاسَ في منازلِهم بعُكاظٍ ومَجَنَّةَ، وفي المَواسمِ بمِنًى، يقول: مَن يُؤْوِيني؟ مَن يَنصُرني حتَّى أُبَلِّغَ رسالةَ رَبِّي وله الجَنَّةُ. حتَّى إنَّ الرَّجلَ لَيخرُجُ مِنَ اليمنِ أو مِن مُضَرَ، فيأتيه قومُه فيقولون: احْذرْ غُلامَ قُريشٍ لا يَفْتِنُكَ. ويمشي بين رجالِهم وهُم يُشيرون إليه بالأصابعِ حتَّى بعثنا الله إليه مِن يَثْرِبَ فآوَيناهُ وصدَّقناهُ، فيخرُج الرَّجلُ مِنَّا فيُؤمِنُ به ويُقرِئُهُ القُرآنَ فيَنقلِبُ إلى أهلهِ فيُسلِمون بإسلامهِ، حتَّى لمْ يَبْقَ دارٌ مِن دورِ الأنصارِ إلَّا وفيها رَهطٌ مِنَ المسلمين يُظهِرون الإسلامَ، ثمَّ ائْتَمروا جميعًا فقُلنا: حتَّى متى نَترُك رسولَ الله صلَّى الله عليه وسلَّم يُطْرَدُ في جبالِ مكَّةَ ويخافُ. فرحل إليه مِنَّا سبعون رجلًا حتَّى قَدِموا عليه في المَوسمِ فَواعَدناهُ شِعْبَ العَقبةِ، فاجتمَعنا عليه مِن رجلٍ ورَجُلَينِ حتَّى تَوافَينا فقُلنا: يا رسولَ الله، نُبايِعُك. قال: تُبايِعوني على السَّمعِ والطَّاعةِ في النَّشاطِ والكَسلِ، والنَّفقةِ في العُسرِ واليُسرِ، وعلى الأمرِ بالمعروفِ والنَّهيِ عن المُنكرِ، وأن تقولوا في الله لا تخافون في الله لَوْمَةَ لائمٍ، وعلى أن تَنصُروني فتَمنَعوني إذا قَدِمتُ عليكم ممَّا تمنَعون منه أنفسَكُم وأَزواجَكُم وأبناءَكُم ولكم الجنَّةُ. قال فقُمنا إليه فبايَعناهُ، وأخذ بيدِهِ أَسعدُ بنُ زُرارةَ وهو مِن أَصغرِهم، فقال: رُويدًا يا أهلَ يَثْرِبَ، فإنَّا لمْ نَضرِبْ أَكبادَ الإبلِ إلَّا ونحن نعلمُ أنَّه رسولُ الله صلَّى الله عليه وسلَّم، وإنَّ إخراجَهُ اليومَ مُفارقةُ العربِ كافَّةً، وقَتْلُ خِيارِكُم، وأنْ تَعَضَّكُم السُّيوفُ، فإمَّا أنتم قومٌ تَصبِرون على ذلك وأَجرُكم على الله، وإمَّا أنتم قومٌ تخافون مِن أَنفُسِكُم جَبِينَةً فَبَيِّنوا ذلك فهو عُذْرٌ لكم عند الله. قالوا أَمِطْ عنَّا يا أَسعدُ، فَوَالله لا نَدَعُ هذه البَيعةَ أبدًا، ولا نَسْلُبُها أبدًا. قال فقُمنا إليه فبايَعناهُ فأخذ علينا وشَرَطَ ويُعطينا على ذلك الجنَّةَ)"], "url": "https://dorar.net/history/event/35", "route": null, "stations": null, "title_en": "The Second Pledge of Allegiance at al-al-‘Aqabah.", "date_en": "Dhu al-Hijjah 1 BH (622 CE)", "place_en": "Aqabah", "summary_en": "Seventy men of the Ansar met the Prophet ﷺ at Aqabah in the pilgrimage season and pledged to protect him as they protected their own families, opening the way to the Hijrah.", "people": [], "dorar": 35, "asbab": [], "body_en": ["Narrated Jaabir (may Allah be pleased with him): “The Messenger of Allah ﷺ stayed in Makkah for 10 years, following people around to their homes, at ‘Ukaadh and Majannah, as well as during the pilgrimage seasons at Mina. He would ask people: “Who shall protect and support me so that I may deliver the message of my Lord, and Paradise will be granted to him?” He did not find anyone to support him and shelter him, even men coming from Yemen and Mudar would be approached by their tribesmen and be warned against the young man from Quraysh saying: “Watch out for that boy from Quraysh lest he bewitches you.” He ﷺ would walk amongst the throngs of men, and people would point at him with their fingers, until Allah sent us to him from Yathrib, and we protected him and believed in him. A man leaves from amongst us and believes in the Prophet ﷺ and hears the recitation of the Quran, he then goes to this people, and they become Muslims through his Islam, until there was no household from the Ansaar except that it has Muslims manifesting their Islam.", "Then, all of them gathered and said: “How much longer shall people banish the Messenger of Allah ﷺ to the mountains of Makkah, and he lives in fear?” A group of seventy men from amongst us went to him and met him during the pilgrimage season, and we promised him at al-Aqabah. We met him one-by-one and two-by-two, until we had all sworn allegiance to him. We then said: “O Messenger of Allah! We pledge allegiance to you.” So he said: “You pledge allegiance to me that you shall hear and obey me through strength and languor; and that you shall support me in ease and difficulty; and that you will command the good and forbid the wrong; and that you shall speak regarding Allah to others, and not fear any chastisement from anyone; and that you shall support me and that you shall protect me from whatever you would protect your own selves, your wives, and your children; and if you do all this, then Paradise is yours.”", "Jaabir continues: “So we stood, and we all pledged our fealty to him, and he took with his hand As’ad ibn Zuraarah, and he was the youngest amongst us and said: “O people of Yathrib! Take it easy, for verily we have exerted ourselves in coming here, except that we were convinced that he is the Messenger of Allah ﷺ and his expulsion shall signal the division of all of the Arabs, and the slaying of the best from amongst you, and that swords shall soon assail you. Therefore, you shall either bare all of this patiently and your reward shall be with Allah, or you shall be fearful for yourselves, out of cowardice, then be honest now and clear, and that shall be an excuse in your favor in front of Allah.” Then the people responded: “O As’ad! Do not say such words, for by Allah, we will never leave this pledge, nor will we ever renege it, ever!” Jaabir then said: “so we went to him ﷺ and we gave him our fealty and allegiance, which he took from us, and gave us the conditions, and promised us that we would enter Paradise, (if we followed it to the letter).”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 24, "stage": 3, "title": "مُعجِزةُ انشِقاقِ القَمرِ", "date": "قبيل الهجرة، الموافق 622م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["عن عبدِ الله بنِ مَسعودٍ رضي الله عنه، قال: انشقَّ القَمرُ على عهدِ رسولِ الله صلى الله عليه وسلم شِقَّتينِ، فقال النَّبيُّ صلى الله عليه وسلم: «اشْهَدوا» . وعن أنسِ بنِ مالكٍ رضي الله عنه، «أنَّ أهلَ مكَّة سألوا رسولَ الله صلى الله عليه وسلم أنْ يُرِيَهُم آيةً، فأراهُم القَمرَ شِقَّتينِ، حتَّى رَأَوْا حِراءً بينهُما» وفي صحيحِ مُسلمٍ عن عبدِ الله بنِ مَسعودٍ قال: انشقَّ القَمرُ على عهدِ رسولِ الله صلَّى الله عَليهِ وسلَّم فِلقَتَينِ، فسَترَ الجبلُ فِلْقَةً، وكانتْ فِلْقَةٌ فوقَ الجبلِ، فقال رسولُ الله صلى الله عليه وسلم: «اللَّهُمَّ اشْهدْ».", "والمشهورُ أنَّ انشِقاقَ القَمرِ حصلَ مَرَّةً واحدةً، أمَّا ما وردَ في إِحدى رِواياتِ مُسلمٍ: (.. فأَراهُم انشِقاقَ القَمرِ مَرَّتَينِ). فقد أجاب عنها العُلماءُ. ورَجَّحَ ابنُ القَيِّمِ وابنُ حَجَرْ وغيرُهما أنَّه وقع مَرَّةً واحدةً."], "url": "https://dorar.net/history/event/36", "route": null, "stations": null, "title_en": "The Miracle of the Splitting of the Moon", "date_en": "Shortly before the Hijrah (622 CE)", "place_en": "Makkah", "summary_en": "During the Prophet's ﷺ time in Makkah the moon split into two parts, and he told those present to bear witness.", "people": [], "dorar": 36, "asbab": [{"id": "TAF-29", "k": "d"}], "body_en": ["Narrated ‘Abdullah ibn Mas’ood (may Allah be pleased with him): The moon was split into two pieces during the lifetime of the Prophet ﷺ. He ﷺ said: “Be witnesses to this.” Narrated Anas ibn Maalik (may Allah be pleased with him): “The people of Mecca asked Allah's Messenger ﷺ to show them a miracle. He ﷺ showed them the moon split in two halves between which they saw the Hiraa’ mountain.” It is recorded in Saheeh Muslim on the authority of 'Abdullah b. Mas'ood (may Allah be pleased with him) that the moon was split up in two parts during the lifetime of Allah's Messenger ﷺ.", "The mountain covered one of its parts and one part of it was above the mountain and Allah's Messenger ﷺ said: “Bear witness to this.” The famous view is that the splitting of the moon occurred only once. As for the report in Saheeh Muslims wherein it reads: “he showed twice the splitting of the moon.”, the scholars have already addressed it and explained it. From the scholars who held the view that it only occurred once include Ibn al-Qayyim and Ibn Hajar."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 25, "stage": 4, "title": "هِجرةُ الصَّحابةِ إلى المدينةِ", "date": "محرم 1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["لمَّا تَمَّتْ بَيعةُ العَقبةِ أمرَ رسولُ الله صلى الله عليه وسلم مَن كان معه بالهِجرةِ إلى المدينةِ، فخرجوا أَرسالًا، كان مِنَ السَّابقين للهِجرةِ بعدَ العَقبةِ الثَّانيةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"musab\">مُصعبُ</span> بنُ عُميرٍ, ثمَّ عامرُ بنُ رَبيعةَ حَليفُ بن بني عَدِيِّ بنِ كعبٍ، معه امرأتُه ليلى بنتُ أبي حَثْمَةَ بنِ غانمٍ، ثمَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdjahsh\">عبدُ الله بنُ جَحْشٍ</span> بأهلِهِ وأخيهِ عبدِ بنِ جَحْشٍ أبي أحمدَ، وكان ضَريرًا، وكان منزلُهما ومنزلُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبي سَلمةَ</span> بقُباءٍ في بني <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عَمر</span>ِو بنِ عَوفٍ، فلمَّا هاجر جميعُ بني جَحْشٍ بنِسائهِم فعَدا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> على دارِهم فتَمَلَّكَها، فذكر ذلك <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdjahsh\">عبدُ الله بنُ جَحْشٍ</span> لمَّا بَلَغَهُ لِرسولِ الله صلى الله عليه وسلم، فقال له رسولُ الله صلى الله عليه وسلم: \"ألا تَرضى يا عبدَ الله أن يُعطِيَك الله بها دارًا في الجنَّةِ خيرًا منها؟ قال: بلى. قال: فذلك لك\".", "فلمَّا افتتح رسولُ الله صلى الله عليه وسلم مكَّةَ كَلَّمَهُ أبو أَحمدَ في دارِهم، فأبطأَ عليه رسولُ الله صلى الله عليه وسلم فقال النَّاسُ لأبي أَحمدَ: يا أبا أَحمدَ، إنَّ رسولَ الله صلى الله عليه وسلم يَكرهُ أن تَرجِعوا في شيءٍ أُصيبَ منكم في الله، فأَمْسَكَ عن كلامِ رسولِ الله صلى الله عليه وسلم.", "وكان بنو غَنْمِ بنِ دُودانِ أهلَ إسلامٍ قد خرجوا كُلُّهم إلى المدينةِ، ثمَّ خرج <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> بنُ الخطَّابِ، وعيَّاشُ بنُ أبي رَبيعةَ في عِشرين راكبًا فقَدِموا المدينةَ، وكان هشامُ بنُ العاصِ بنِ وائلٍ قد أَسلمَ، وواعد <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> بنَ الخطَّابِ أن يُهاجِرَ معه، وقال: تَجِدُني أو أَجِدُك عند أَضاءةِ بني غِفارٍ، ففَطِنَ لهشامٍ قومُه فحبسوه عن الهِجرةِ.", "ثمَّ إنَّ أبا جهلٍ والحرثَ بنَ هشامٍ خرجا حتَّى قَدِما المدينةَ ورسولُ الله صلَّى الله عليه وسلَّم بمكَّةَ، فكَلَّما عيَّاشَ بنَ أبي رَبيعةَ وكان أخاهُما لِأُمِّهِما وابنَ عَمِّهِما، وأَخبراهُ أنَّ أمَّهُ قد نَذرتْ أن لا تَغسِلَ رأسَها ولا تَسْتَظِلَّ حتَّى تَراهُ، فَرَقَّتْ نَفْسُهُ وصدَّقهُما وخرج راجعًا معهُما، فكَتَّفاهُ في الطَّريقِ وبلغا به مكَّةَ، نهارًا مُوثَقًا، ثمَّ قالا: يا أهلَ مكَّةَ هكذا فافعلوا بسُفهائِكُم كما فعلنا بسَفيهِنا هذا.", "فحَبَساهُ بها إلى أن خَلَّصَهُ الله تعالى بعد ذلك بدُعاءِ رسولِ الله صلى الله عليه وسلم له في قُنوتِ الصَّلاةِ: \"اللَّهمَّ أَنْجِ الوليدَ بنَ الوليدِ، وسَلمةَ بنَ هشامٍ، وعيَّاشَ بنَ أبي رَبيعةَ\". ولمَّا أراد صُهيبُ بنُ سِنانٍ الهِجرةَ قال له كُفَّارُ قُريشٍ: أَتَيْتَنا صُعلوكًا حَقيرًا فكَثُرَ مالُك عندنا، وبلغتَ الذي بلغتَ، ثمَّ تُريدُ أن تَخرُجَ بمالِك ونَفسِك، لا والله لا يكونُ ذلك.", "فقال لهم صُهيبٌ: أَرأيتُم إن جَعلتُ لكم مالي أَتُخَلُّون سَبيلي؟ قالوا: نعم، فقال: فإنِّي قد جَعلتُ لكم، فبلغ ذلك رسولُ الله صلى الله عليه وسلم فقال: \"رَبِحَ صُهيبٌ، رَبِحَ صُهيبٌ\". ثمَّ تتابع المهاجرون بالهِجرةِ إلى المدينةِ إلى أن هاجر رسولُ الله صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/40", "route": null, "stations": null, "title_en": "The Migration of the Companions to al-Madeenah", "date_en": "Muharram 1 AH (622 CE)", "place_en": "Madinah", "summary_en": "After the second pledge of Aqabah, the Prophet ﷺ told the Muslims to migrate to Madinah. They left in groups, among them Umar ibn al-Khattab, while Quraysh held some back.", "people": ["umar", "abdjahsh", "musab", "abusalama", "abusufyan"], "dorar": 40, "asbab": [], "body_en": ["When the pledge of allegiance was completed at al-Aqabah, the Messenger of Allah ﷺ ordered his Companions to migrate to al-Madeenah. Following his order, they all went out in groups, one group after another. The first of the Companions of the Prophet ﷺ to have gone out was Mus’ab ibn Umayr, then ‘Aamir ibn Rabee’ah, the ally of the sons of Banoo Adee ibn K’ab, and with him was his wife Laylah bint Abee Hatmah ibn Ghaanim, then Abdullah ibn Jahsh with his family and his brother, ‘Abd ibn Jahash Aboo Ahmad who was blind.", "Their home and the home of Aboo Salamah was in Qubaa’ amongst the people of Banoo ‘Amr ibn Awf. When all of the people of Banoo Jahsh migrated with their womenfolk, Aboo Sufyaan took over possession of their houses wrongfully. When news of this had reached Abdullah ibn Jahsh, he told the Messenger of Allah ﷺ about it, who then said to him: “O Abdullah! would you not be pleased with that through accepting that loss, Allah gives you a house in Paradise better than it?” To which Abdullah replied: “Of course…” The Prophet ﷺ then responded: “that is what is waiting for you then…” When the Messenger of Allah ﷺ conquered Makkah, Aboo Ahmad spoke to him about their home, but the Messenger of Allah ﷺ did not respond to him.", "The people said to Aboo Ahmad: “O Aboo Ahmed! the Messenger of Allah ﷺ hates that you would take back (change your mind) about something that you have left for Allah’s sake. So, refrain from speaking with the Messenger of Allah ﷺ about it. The people of Banoo Ghanam ibn Doodaan entered Islam, and all of them had emigrated to al-Madeenah. Afterwards, Umar ibn al-Khattaab emigrated, then Ayyaash ibn Abee Rabee’ah amongst a group of 20 riders emigrated to al-Madeenah. At that time, Hishaam ibn al-‘Aas ibn Waa’il had accepted Islam as well, and he agreed with Umar ibn al-Khattaab to migrate together with him. He said: “Either you will find me, or I will find you at the flatlands of the people of Banoo Ghiffaar.” But his kinfolk found out about his plan, so they imprisoned him and kept him from migrating. Afterwards, Aboo Jahl and al-Harth ibn Hishaam both went to al-Madeenah while the Messenger of Allah ﷺ was still in Makkah. There, they spoke to Ayyaash ibn Abee Rabee’ah; who was their maternal half-brother and their parental cousins as well.", "They informed him that his mother had sworn an oath that she would not wash her hair nor seek any shade until she sees him again. Ayyaash’s heart then softened and he believed them, so he departed to make his way back to Makkah with them. On their way, after they departed al-Madeenah, they tied him up and detained him until they reached Makkah in the middle of the day. When they reached Makkah, Aboo Jahl and al-Harth said: “O people of Makkah! This is how you must deal with those fools from amongst yourself (who left to al-Madeenah and became Muslims)! You should do the same way we have dealt with this fool!”", "They then locked him up until he was freed by the supplications of the Messenger of Allah ﷺ during the Qunoot of his prayer, when he said: “Oh Allah, free al-Waleed ibn al-Waleed, Salamah ibn Hishaam, and Ayaash ibn Rabee’ah.” When Suhayb ibn Sinaan (may Allah be pleased with him) intended to migrate, the disbelievers of Quraysh said to him: “You came to us poor and wretch, and you became wealthy while you are amongst us, and you have become who you are today! Now, you want to leave and take all the wealth [that you have made from us] with you! By Allah! You will not!”", "Suhayb said to them: “If I were to give you all of my wealth, will you then let me go freely?” They said: “Yes”. So, he said: “Then verily I have given you all of my wealth.” When the news of that reached the Messenger of Allah ﷺ he said: “Verily Suhayb has profited, verily Suhayb has profited…” Then the Emigrants continued their migration to al-Madeenah until the Messenger of Allah ﷺ migrated to al-Madeenah himself."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 26, "stage": 4, "title": "اجتماعُ المُشركين في دارِ النَّدوَةِ واتِّفاقُهم على قَتلِ النَّبيِّ صلَّى الله عليه وسلَّم", "date": "صفر 1 هـ، الموافق 622م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 11, "paras": ["لمَّا رَأى المُشركون أنَّ أصحابَ رسولِ الله صلى الله عليه وسلم قد تَجهَّزوا وخرجوا، وحملوا وساقوا الذَّراريَّ والأطفالَ والأموالَ إلى الأوسِ والخزرجِ في يَثْرِبَ، أصابتهُم الكآبةُ والحزنُ، وساوَرهُم القلقُ والهَمُّ، فاجتمع طواغيتُ مكَّةَ في دارِ النَّدوَةِ لِيتَّخِذوا قرارًا حاسمًا في هذا الأمرِ.", "وكان اجتماعُهُم بعدَ شَهرينِ ونصفِ تقريبًا مِن بَيعةِ العَقبةِ، وتوافد إلى هذا الاجتماعِ جميعُ نُوَّابِ القبائلِ القُرشيَّةِ؛ لِيتَدارسوا خُطَّةً حاسِمةً, تَكفُلُ القضاءَ سريعًا على النَّبيِّ صلى الله عليه وسلم ودَعوتِهِ, ولمَّا جاءوا إلى دارِ النَّدوةِ حَسْبَ الميعادِ، اعترضهُم إبليسُ في هَيئةِ شيخٍ جليلٍ، ووقف على البابِ، فقالوا: مَن الشَّيخُ؟ قال: شيخٌ مِن أهلِ نجدٍ, سمِع بالذي اتَّعَدْتُم له فحضر معكم لِيسمعَ ما تقولون، وعسى ألَّا يُعْدِمَكُم منه رأيًا ونُصْحاً.", "قالوا: أجلْ، فادْخُلْ. فدخل معهم. وبعد أن تَكامل الاجتماعُ, ودار النِّقاشُ طويلًا. قال أبو الأَسودِ: نُخرِجُهُ مِن بين أَظْهُرِنا ونَنْفيهِ مِن بلادِنا، ولا نُبالي أين ذهب، ولا حيث وقع، فقد أَصلَحنا أَمْرَنا, وأُلْفَتَنا كما كانت. قال الشيخُ النَّجديُّ: لا والله ما هذا لكم برأيٍ، ألم تَرَوْا حُسْنَ حَديثهِ، وحَلاوةَ مَنْطِقِهِ، وغَلَبَتْهُ على قلوبِ الرِّجالِ بما يأتي به، والله لو فعلتُم ذ
