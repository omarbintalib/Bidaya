لك ما أَمِنْتُم أن يَحِلَّ على حَيٍّ مِن العربِ، ثمَّ يَسيرُ بهِم إليكم - بعد أن يَتَّبِعوهُ - حتَّى يَطأَكُم بهِم في بلادِكُم، ثمَّ يفعلُ بكم ما أراد، دَبِّروا فيه رأيًا غيرَ هذا.", "قال أبو البَخْتريِّ: احْبِسوه في الحديدِ وأَغلِقوا عليه بابًا، ثمَّ تَربَّصوا به ما أصاب أمثالَهُ مِن الشُّعراءِ الذين كانوا قبله - زُهيرًا والنَّابِغةَ - ومَن مضى منهم، مِن هذا الموتِ، حتَّى يُصيبَهُ ما أصابهم. قال الشَّيخُ النَّجديُّ: لا والله ما هذا لكم برأيٍ، والله لَئِن حَبَستُموه -كما تقولون- لَيَخرُجنَّ أَمرُهُ مِن وراءِ البابِ الذي أغلقتُم دونَه إلى أصحابهِ، فلأَوْشَكوا أن يَثِبوا عليكم، فيَنزِعوه مِن أَيديكُم، ثمَّ يُكاثِروكُم به حتَّى يَغلِبوكُم على أَمرِكُم، ما هذا لكم برأيٍ، فانظروا في غيرِهِ.", "بعد ذلك تَقدَّم كبيرُ مُجرِمي مكَّةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلِ</span> بنِ هشامٍ بِاقتِراحٍ آثمٍ وافق عليه جميعُ مَن حضر, قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلٍ</span>: والله إنَّ لي فيه رأيًا ما أَراكُم وقعتُم عليه بعدُ. قالوا: وما هو يا أبا الحكمِ؟ قال: أَرى أن نَأخُذَ مِن كُلِّ قَبيلةٍ فَتًى شابًّا جَليدًا نَسِيبًا وَسِيطًا فِينا، ثمَّ نُعطي كُلَّ فَتًى منهم سَيفًا صارمًا، ثمَّ يَعمِدوا إليه، فيَضرِبوه بها ضربةَ رجلٍ واحدٍ فيَقتُلوه، فنَستَريحَ منه، فإنَّهم إذا فعلوا ذلك تَفرَّق دَمُهُ في القبائلِ جميعًا، فلمْ يَقدِرْ بنو عبدِ منافٍ على حربِ قومِهم جميعًا، فَرَضوا مِنَّا بالعَقْلِ، فَعَقَلْناهُ لهم.", "قال الشَّيخُ النَّجديُّ: القولُ ما قال الرَّجلُ، هذا الرَّأيُ الذي لا رأيَ غيرُهُ. ووافقوا على هذا الاقتراحِ الآثمِ بالإجماعِ."], "url": "https://dorar.net/history/event/41", "route": null, "stations": null, "title_en": "The Polytheists of Makkah Gather in Daar al-Nidwah and Agree to All Kill the Prophet ﷺ.", "date_en": "Safar 1 AH (622 CE)", "place_en": "Makkah", "summary_en": "Alarmed by the Muslims' migration, the leaders of Quraysh met at Dar al-Nadwah and adopted Abu Jahl's plan to have young men from every clan strike the Prophet ﷺ together, so that no clan could be held responsible.", "people": ["abujahl"], "dorar": 41, "asbab": [], "body_en": ["The polytheists of Makkah became very saddened and depressed; and their worries and anxiety increased when they saw the Companions of the Messenger of Allah ﷺ preparing themselves to depart and leave Makkah while taking with them their wives and children, as well all their wealth to the Aws and Khazraj of Yathrib. The wicked and vice people of Makkah had a meeting in Daar al-Nidwah to take a categorical decision on the subject matter. The meeting, which occurred approximately two and a half months after the pledge at al-Aqabah, was attended by the heads of the tribes of Quraysh.", "The purpose of the meeting was to devise a plan to swiftly eliminate the Prophet ﷺ and his mission. All of them arrived at Daar al-Nidwah according to the agreed upon day and time. While they were there, Satan appeared in the form of an esteemed elder, he stood at the door, waiting. The attendees asked: “Who are you?” He responded: “An elder from the people of Najd, I heard what you were planning to do, so I came to listen to what you have to say for I can give you the best advice and opinion.” They approved it and allowed him to enter and attend the meeting with them.", "After long discussions and arguing, Aboo al-Aswad stood and said: “Let us expel him from amongst ourselves and our lands! We shall not care where he goes nor where he ends up. By this, we will rectify our affairs and reunite once again.” But the elder from Najd (Satan) interjected, saying: “No! This is not a correct opinion. Do you not see how good his speech is, and the sweetness of his elocution, and the effect he is having on the hearts of men? By Allah if you do what you have just suggested, you will find him going to other Arab tribes, follow him and then bring them all back to fight you here in your land, and then they shall do with you as they please. You should think of another solution. Aboo al-Bahtaree then suggested: “Let us shackle him in chains and lock him up, and then let him taste the death that happened to the poets before him-Zuhayr and al-Naabighah.” However, the elder from Najd said: “No, by Allah, this is not a good idea either.", "By Allah, if you were to lock him up just as you say, then the news will reach his Companions and they would gather themselves and attack you to set him free and then he will slip from your grasp, then they shall increase in number against you and overpower you. No, this is not a good idea, so think of another idea. Thereafter, the wickedest man in Makkah, Aboo Jahl ibn Hishaam, put forth a heinous suggestion to which all those present agreed to. Aboo Jahl said: “By Allah, I have thought of something not one of you has ever thought of before.”", "Those present said: “O Aboo al-Hakam! What is it?” He said: “We should nominate from every tribe a young strong man, with a good lineage, and who is well known amongst us. Then we shall equip everyone with a strong and sharp sword, then they should all attack him at the same time and hit him with the strike of a single man and slay him; then we shall be rid of him. Should we do this, then we shall be able to spread his blood, the responsibility of his murder upon every tribe, and Banoo Abdoo Manaaf will not be able to war with all of us at the same time. They will be pleased with us paying them the blood money, and then we shall pay it.”", "The elder from Najd said: “What this man has just said is the correct way of going about things, and nothing else.” Accordingly, all those present agreed to Aboo Jahl’s suggestion.”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 27, "stage": 4, "title": "هِجرةُ الرَّسولِ صلَّى الله عليه وسلَّم وأبي بكرٍ رضِي الله عنه إلى المدينةِ", "date": "صفر 1 هـ، الموافق 622م", "place": "غار ثور", "lat": 21.3775, "lng": 39.85, "approx": false, "zoom": 11, "paras": ["عن عائشةَ رضي الله عنها قالت: قال النَّبيُّ صلى الله عليه وسلم للمُسلمين: «إنِّي أُريتُ دارَ هِجرتِكُم ذاتَ نَخلٍ بين لابَتَيْنِ». وهُما الحَرَّتانِ، فهاجر مَن هاجر قِبَلَ المدينةِ، ورجع عامَّةُ مَن كان هاجر بأرضِ الحَبشةِ إلى المدينةِ، وتَجهَّز <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> قِبَلَ المدينةِ، فقال له رسولُ الله صلى الله عليه وسلم: «على رِسْلِكَ، فإنِّي أرجو أن يُؤذنَ لي».", "فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>: وهل ترجو ذلك بأبي أنت؟ قال: «نعم» . فحبَس <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> نَفْسَهُ على رسولِ الله صلى الله عليه وسلم لِيصحبَهُ، وعلَف راحِلتينِ كانتا عنده وَرَقَ السَّمُرِ -وهو الخَبَطُ- أربعةَ أَشهُرٍ. قال ابنُ شهابٍ: قال عُروةُ: قالت <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span>: فبينما نحن يومًا جُلوسٌ في بيتِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبي بكرٍ</span> في نَحْرِ الظَّهيرةِ، قال قائلٌ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">لأبي بكرٍ</span>: هذا رسولُ الله صلى الله عليه وسلم مُتقنِّعًا، في ساعةٍ لم يكن يأتينا فيها، فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>: فِداءٌ له أبي وأمِّي، والله ما جاء به في هذه السَّاعةِ إلَّا أَمْرٌ، قالت: فجاء رسولُ الله صلَّى الله عليه وسلَّم فاسْتأذَن، فأُذِنَ له فدخل، فقال النَّبيُّ صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">لأبي بكرٍ</span>: «أَخْرِجْ مَن عندك».", "فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>: إنَّما هُم أَهلُك، بأبي أنت يا رسولَ الله. قال: «فإنِّي قد أُذِنَ لي في الخُروجِ». فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>: الصُّحبة بأبي أنت يا رسولَ الله؟ قال رسولُ الله صلى الله عليه وسلم: «نعم». قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span>: فَخُذْ -بأبي أنت يا رسولَ الله- إحدى راحِلَتي هاتينِ، قال رسولُ الله صلى الله عليه وسلم: «بالثَّمنِ».", "قالت <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span>: فجَهَّزناهُما أَحَثَّ الجِهازِ، وصنعنا لهُما سُفْرَةً في جِرابٍ، فقطعتْ أسماءُ بنتُ أبي بكرٍ قِطعةً مِن نِطاقِها فربطتْ به على فَمِ الجِرابِ، فبذلك سُمِّيت: ذاتَ النِّطاقينِ. قالت: ثمَّ لَحِقَ رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span> بِغارٍ في جبلِ ثَوْرٍ، فَكَمَنَا فيه ثلاثَ ليالٍ، يَبيتُ عندهما عبدُ الله بنُ أبي بكرٍ، وهو غلامُ شابٌّ، ثَقِفٌ لَقِنٌ، فَيُدْلِجُ مِن عندهِما بِسَحَرٍ، فيُصبحُ مع قُريشٍ بمكَّةَ كَبائِتٍ، فلا يسمعُ أمرًا، يُكتادانِ به إلَّا وعاهُ، حتَّى يأتيَهُما بخبرِ ذلك حين يَختلِطُ الظَّلامُ، ويَرعى عليهِما عامرُ بنُ فُهيرةَ، مولى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبي بكرٍ</span> مِنْحَةً مِن غَنَمٍ، فيُريحُها عليهِما حين تَذهبُ ساعةٌ مِنَ العِشاءِ، فيَبيتانِ في رِسْلٍ، وهو لبنُ مِنْحَتِهِما ورَضِيفِهِما، حتَّى يَنْعِقَ بها عامرُ بنُ فُهيرةَ بِغَلَسٍ، يفعلُ ذلك في كُلِّ ليلةٍ مِن تلك اللَّيالي الثَّلاثِ، واسْتأجر رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span> رجلًا مِن بني الدِّيلِ، وهو مِن بني عبدِ بنِ عَدِيٍّ، هادِيًا خِرِّيتًا -والخِرِّيتُ الماهرُ بالهِدايةِ- قد غَمَسَ حِلْفًا في آلِ العاصِ بنِ وائلٍ السَّهميِّ، وهو على دينِ كُفَّارِ قُريشٍ، فأَمِناهُ فدَفعا إليه راحِلَتَيْهِما، وواعَداهُ غارَ ثَوْرٍ بعدَ ثلاثِ ليالٍ، بِراحِلَتيهِما صُبْحَ ثلاثٍ، وانطلق معهما عامرُ بنُ فُهيرةَ والدَّليلُ، فأخذ بهم طريقَ السَّواحلِ.", "قال: سُراقةُ بنُ جُعْشُمٍ: جاءنا رُسُلُ كُفَّارِ قُريشٍ، يجعلون في رسولِ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبي بكرٍ</span>، دِيَةَ كُلِّ واحدٍ منهما، مَن قَتلهُ أو أَسَرهُ، فبينما أنا جالسٌ في مجلسٍ مِن مجالسِ قَومي بني مُدْلِجٍ، أقبل رجلٌ منهم حتَّى قام علينا ونحن جُلوسٌ، فقال يا سُراقةُ: إنِّي قد رأيتُ آنفًا أَسْوِدَةً بالسَّاحلِ، أُراها محمَّدًا وأصحابَه، قال سُراقةُ: فعرَفتُ أنَّهم هُم، فقلتُ له: إنَّهم لَيسوا بهِم، ولكنَّك رأيتَ فُلانًا وفُلانًا، انطلَقوا بِأَعْيُنِنا، ثمَّ لَبِثْتُ في المجلسِ ساعةً، ثمَّ قمتُ فدخلتُ فأمرتُ جاريتي أن تَخرُجَ بفَرسي، وهي مِن وراءِ أَكَمَةٍ، فتَحبِسَها عليَّ، وأخذتُ رُمحي، فخرجتُ به مِن ظَهرِ البيتِ، فَحَطَطْتُ بِزُجِّهِ الأرضَ، وخَفضتُ عالِيَهُ، حتَّى أتيتُ فَرسي فركِبتُها، فرفَعتُها تُقَرِّبُ بي، حتَّى دَنوتُ منهم، فعَثَرَتْ بي فَرسي، فخَررتُ عنها، فقمتُ فأَهويتُ يدي إلى كِنانتي، فاسْتخرجتُ منها الأَزلامَ فاسْتقسَمتُ بها: أَضرُّهُم أم لا، فخرج الذي أَكرهُ، فركِبتُ فَرسي، وعصيتُ الأَزلامَ، تُقَرِّبُ بي حتَّى إذا سمعتُ قِراءةَ رسولِ الله صلى الله عليه وسلم، وهو لا يَلتفتُ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span> يُكثِرُ الالتِفاتَ، ساختْ يَدا فَرسي في الأرضِ، حتَّى بَلغتا الرُّكبَتينِ، فخررتُ عنها، ثمَّ زجرتُها فنهَضتْ، فلم تكدْ تُخرِجُ يدَيها، فلمَّا استوت قائمةً إذا لِأثَرِ يدَيها عُثانٌ ساطعٌ في السَّماءِ مِثلُ الدُّخانِ، فاسْتقسَمتُ بالأَزلامِ، فخرج الذي أَكرهُ، فنادَيتُهم بالأَمانِ فوقفوا، فركِبتُ فَرسي حتَّى جِئتُهم، ووقع في نفسي حين لَقِيتُ ما لَقِيتُ مِنَ الحَبسِ عنهم أن سَيظهرُ أَمْرُ رسولِ الله صلى الله عليه وسلم، فقلتُ له: إنَّ قومَك قد جعلوا فيك الدِّيةَ، وأخبرتُهم أخبارَ ما يُريدُ النَّاسُ بهِم، وعرضتُ عليهم الزَّادَ والمتاعَ، فلم يَرْزآني ولم يَسألاني، إلَّا أن قال: «أَخْفِ عَنَّا».", "فسألتُه أن يَكتُبَ لي كتابَ أَمْنٍ، فأمر عامرَ بنَ فُهيرةَ فكتب في رُقعةٍ مِن أَديمٍ، ثمَّ مَضى رسولُ الله صلى الله عليه وسلم. وعن عُروةَ بنِ الزُّبيرِ: أنَّ رسولَ الله صلى الله عليه وسلم لَقِيَ الزُّبيرَ في رَكْبٍ مِنَ المسلمين، كانوا تُجَّارًا قافِلين مِن الشَّأْمِ، فكَسا الزُّبيرُ رسولَ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبا بكرٍ</span> ثِيابَ بَياضٍ، وسمِع المسلمون بالمدينةِ مَخرجَ رسولِ الله صلى الله عليه وسلم مِن مكَّةَ، فكانوا يَغدون كُلَّ غَداةٍ إلى الحَرَّةِ، فيَنتظِرونَهُ حتَّى يَرُدَّهُم حَرُّ الظَّهيرةِ، فانقلبوا يومًا بعد ما أطالوا انتظارَهُم، فلمَّا أَوَوْا إلى بُيوتِهم، أَوفى رجلٌ مِن يَهودَ على أُطُمٍ مِن آطامِهِم، لِأَمْرٍ يَنظرُ إليه، فبصر برسولِ الله صلى الله عليه وسلم وأصحابِه مُبَيَّضِين يَزولُ بهِم السَّرابُ، فلم يملِك اليَهوديُّ أن قال بأعلى صوتِه: يا مَعاشِرَ العربِ، هذا جَدُّكُم الذي تَنتظِرون، فثار المسلمون إلى السِّلاحِ، فتَلَقَّوْا رسولَ الله صلى الله عليه وسلم بظَهْرِ الحَرَّةِ، فعَدل بهِم ذاتَ اليمينِ، حتَّى نزل بهِم في بني عَمرِو بنِ عَوفٍ، وذلك يومَ الاثنينِ مِن شهرِ ربيعٍ الأوَّلِ، فقام <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> للنَّاسِ، وجلس رسولُ الله صلى الله عليه وسلم صامتًا، فطَفِقَ مَن جاء مِنَ الأنصارِ -ممَّن لم يَرَ رسولَ الله صلى الله عليه وسلم- يُحَيِّي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبا بكرٍ</span>، حتَّى أصابتِ الشَّمسُ رسولَ الله صلى الله عليه وسلم، فأقبل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> حتَّى ظَلَّلَ عليه بِردائِه، فعرَف النَّاسُ رسولَ الله صلى الله عليه وسلم عند ذلك."], "url": "https://dorar.net/history/event/42", "route": [[21.4225, 39.8262], [21.3775, 39.85], [21.55, 39.4], [21.95, 39.2], [22.35, 39.3], [23.0, 39.15], [23.7, 39.3], [24.25, 39.45], [24.4393, 39.6173], [24.4672, 39.6111]], "stations": [[21.3775, 39.85, "غار ثور", "Cave of Thawr"], [22.35, 39.3, "قديد", "Qudayd"], [24.4393, 39.6173, "قباء", "Quba"]], "title_en": "The Migration of the Prophet ﷺ and His Companion Aboo Bakr (May Allah Be Well Pleased with Him) to al-Madeenah", "date_en": "Safar 1 AH (622 CE)", "place_en": "Cave of Thawr", "summary_en": "The Prophet ﷺ told the Muslims he had been shown the land of their migration, and they began migrating to Madinah. When permission came, he left Makkah with Abu Bakr, hid in the Cave of Thawr for three nights, then took the coastal road to Madinah.", "people": ["abubakr", "aisha"], "dorar": 42, "asbab": [], "body_en": ["Narrated ‘Aaishah (may Allah be well pleased with her): “The Prophet ﷺ said to the Muslims: “I have been shown the land where you shall make your final migration, a place filled with palm trees between the two tracts of black stones.” Then, the Muslims who were able to, migrated to al-Madeenah, while those who had gone to Abyssinia migrated to al-Madeenah once they came back. Aboo Bakr (may Allah be pleased with him), as well, prepared himself to go to al-Madeenah. However, the Messenger of Allah ﷺ said to him: “Wait! I am waiting to be given permission (to go as well).” Aboo Bakr (may Allah be pleased with him) then replied: “May my father be your ransom! are you hoping that I come with you?” The Prophet ﷺ said: “Yes”. This made Aboo Bakr to postpone his emigration so that he be in the company of the Prophet ﷺ in his journey. He maintained two mounts (for the journey) for four months, feeding them leaves from the Acacia tree. Ibn Shihaab related that ‘Urwah said that ‘Aa’ishah said: “One day, whilst we were sitting in the house of Aboo Bakr, in the middle of the afternoon, someone came and said to Aboo Bakr: “The Messenger of Allah ﷺ with his face covered is at the door, and it was a time in which he ﷺ would not come and visit us.”", "Aboo Bakr (may Allah be pleased with him) said: “May my mother and father be his ransom! I swear by Allah that nothing except a momentous thing has come to him in this moment.” ‘Aaishah then said: “The Messenger of Allah ﷺ then came and asked permission to enter, and he was given permission to do so. When he ﷺ entered, he ﷺ said to Aboo Bakr: “Ask the people here to leave.” To which Aboo Bakr replied: “O Messenger of Allah! These are your family; may my mother and father be your ransom.” The Prophet ﷺ then continued: “I have been given permission to leave.” Aboo Bakr then said: “May my mother and father be your ransom! Am I allowed to accompany you in this trip?” The Messenger of Allah ﷺ said: “Yes”. Aboo Bakr then said: “May my mother and father be your ransom! Take one of my two mounts.” But the Messenger of Allah ﷺ said: “only if you allow me to pay its price”” ‘Aaishah continues: “so we prepared for them all they would need for their journey in the best and quickest of ways, and we also made for them a meal for the journey and placed it in a pouch.", "Asmaa’ bint Aboo Bakr (may Allah be pleased with her) then ripped her waist-wrapper in two in order to close the mouth of the pouch; and this is why she was given the name “The woman of the two waist-wrappers” (Araabic: Dhaat al-Nitaaqayn). Then, we caught up with the Messenger of Allah ﷺ and Aboo Bakr (may Allah be pleased with him) at a cave in Mount Thawr wherein we stayed there for three days. Abdullah ibn Aboo Bakr would spend the night with them as he was a young strong boy, skilled, and who did as he was told.", "He would leave them a little before dawn so that he could appear in Makkah by the break of dawn as if he had never left. He did not hear any news from Makkah in which they were plotting against the Messenger of Allah ﷺ and Aboo Bakr, except that he would carry it back to them, at night fall. Keeping a watch out for them was ‘Aamir ibn Fuhayrah, the slave of Aboo Bakr, whom he had hired to watch over his sheep. He would take the sheep to them and let them drink from its fresh milk. He would keep them there until an hour or so of the night had passed, then he would call the sheep to move to return to its pasture when the last part of the night was near.", "‘Aamir ibn Fuhayrah did this every night of those three nights. The Messenger of Allah ﷺ and Aboo Bakr hired a skilled guide from Banoo Ad-Deel, who was from the people of Banoo Abd ibn Adee, who had recently ended an alliance with the tribe of al-‘Aaas ibn Waa’il As-Sahmee. He was a disbeliever upon the faith of Quraysh. They trusted him and they gave him their mounts and agreed with him to meet again at the cave on Mount Thawr on the morning of the third day, with their mounts. When the guide came at the appointed time, they all left, along with Aamir ibn Fuhayrah, and he led them to al-Madeenah through the coast route.", "Suraaqah ibn Ju’shum said: “Quraysh sent their messengers to announce that they placed a bounty on the heads of the Messenger of Allah ﷺ and Aboo Bakr, for whosoever would capture or kill them. Whilst I was sitting in one of the gatherings of my people, the Banoo Mudlij, one the messengers from Quraysh approached us until he was standing over our gathering. He said: “O Suraaqah, I have just seen tracks on the coastal route, I believe they belong to Muhammad and his Companion.” I knew that what he said was true (that it was their tracks) but I said to him, in response: “That track is not theirs, you saw the tracks of so-and-so, we saw them go ourselves.” I stayed a while at the gathering for a while, then I got up and went into my dwelling and I ordered my bondswoman that she prepare my horse that was behind a small mound. She brought it to me and tied it while I grabbed my spear, and I left with it from behind the house. Then I planted my spearhead into the ground and placed it low to the ground (so no one can see me) until I reached my horse.", "I drew it near me so that I could mount it, but it stumbled into me and then I fell onto it. At that moment, I got up and reached for my quiver and took out the divination arrows and threw them: “will this venture harm them or not?” But the arrows fell on what I disliked (it showed that it would harm them if I proceeded) but I got on my horse and paid no mind to the arrows. (Then I rode) until I heard the recitation of the Messenger of Allah ﷺ and he was not paying any mind to what was going on around him, but Aboo Bakr was; he was constantly looking around.", "My horse’s feet then sunk into the ground until it reached its knees, throwing me off, but I scolded it and it stood right back up. It was almost unable to get its feet free. But when it finally stood straight, its hooves sent dust flying into the air. I consulted the divination arrows, and the outcome was distasteful to me. So, I called out to them both, promising to them safety, and so they stopped; then I proceeded to ride over to them. A feeling came over me, when I was withheld from them after my horse’s feet sucked into the ground that the Messenger of Allah ﷺ would prevail.", "I said: “Your people have placed a bounty upon your head,” and I informed them about what the people wanted to do; I also offered them what I had of provisions, but they did not try to take anything from me, nor they did they ask for anything. All he ﷺ said to me was: “Conceal our tacks and do not inform people of our route”. I asked them to give me a letter promising my safety. He ﷺ ordered ‘Aamir ibn Fuhayrah to do so, and so he wrote me a guarantee of safety message on a piece of animal skin. Then the Messenger of Allah ﷺ continued on his way.”", "Narrated Urwah ibn al-Zubayr (may Allah be pleased with him): “The Messenger of Allah ﷺ met al-Zubayr in a caravan of Merchant Muslims who were on their way back from al-Shaam. Al-Zubayr gave the Messenger of Allah ﷺ and Aboo Bakr white garments to wear. The Muslims in al-Madeenah heard of the departure of the Messenger of Allah ﷺ from Makkah, thus, they would wait for him every morning at the Hurrah until the mid-afternoon heat would send them back to al-Madeenah. One day, after returning to their homes from having waited for a long time, one of the Jews who was standing upon the walls of one of their citadels looking for a personal thing. While he was there, he sighted the Messenger of Allah ﷺ and his Companion both clad in white all the while the effects of the heat causing mirages are fading away. The Jew could not hold himself but yelled out as loud as he could: “O Arabs! Here is the one whom you have been waiting for.” Upon hearing his announcement, the Muslims sprang for their weapons, and they met the Messenger of Allah ﷺ at the top of the Harrah, and he turned with them to the right and continued with them until the had descended upon the quarters of the people of Banee ‘Amr ibn ‘Awf.", "That occurred on a Monday, in the month of Rabee al-Awwal. Aboo Bakr (may Allah be pleased with him) stood to receive the people and the Messenger of Allah ﷺ sat down and remained quiet. The Ansaar began to arrive and were welcoming Aboo Bakr, thinking that he was the Prophet ﷺ because they had never seen him before, until the sun started to hit the Messenger of Allah ﷺ upon which Aboo Bakr hastened to shade him. Only then, they knew that he was Aboo Bakr and that the man he was shading was the Prophet ﷺ."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 28, "stage": 4, "title": "بِناءُ مَسجدِ قُباءٍ", "date": "ربيع الأول 1 هـ، الموافق 622م", "place": "قباء", "lat": 24.4393, "lng": 39.6173, "approx": false, "zoom": 11, "paras": ["لَبِثَ رسولُ الله صلى الله عليه وسلم في بني عَمرِو بنِ عَوفٍ بِقُباءٍ بِضعَ عشرةَ ليلةً، وأسَّسَ فيها المسجدَ الذي أُسِّسَ على التَّقوىَ، وصلَّى فيه رسولُ الله صلى الله عليه وسلم."], "url": "https://dorar.net/history/event/43", "route": null, "stations": null, "title_en": "The Building of the Mosque at Qubaa’", "date_en": "Rabi al-Awwal 1 AH (622 CE)", "place_en": "Quba", "summary_en": "The Prophet ﷺ stayed in Quba among Banu Amr ibn Awf for over ten nights and founded its mosque, the mosque founded on piety.", "people": [], "dorar": 43, "asbab": [], "body_en": ["The Messenger of Allah ﷺ stayed amongst the people of Banoo ‘Amr ibn ‘Awf in Qubaa’ for more than ten nights. He built there the Mosque that was built upon fearing Allah and piety, and the Messenger of Allah ﷺ then prayed in it."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 29, "stage": 4, "title": "بِناءُ المسجدِ النَّبوِيِّ", "date": "ربيع الأول 1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["ركِب رسولُ الله صلى الله عليه وسلم راحِلتَه مِن قُباءٍ فسار يمشي معه النَّاسُ حتَّى برَكتْ عند مسجدِ الرَّسولِ صلى الله عليه وسلم بالمدينةِ، وهو يُصلِّي فيه يَومئذٍ رجالٌ مِنَ المسلمين، وكان مِرْبَدًا للتَّمرِ، لِسُهيلٍ وسَهلٍ غُلامَينِ يَتيمَينِ في حَجْرِ أَسعدَ بنِ زُرارةَ، فقال رسولُ الله صلى الله عليه وسلم حين بَركتْ به راحِلتُه: «هذا إن شاء الله المنزِلُ».", "ثمَّ دَعا رسولُ الله صلى الله عليه وسلم الغُلامَينِ فَساوَمَهُما بالمِرْبَدِ، لِيَتَّخِذَهُ مسجدًا، فقالا: لا، بل نَهَبُهُ لك يا رسولَ الله، فأبى رسولُ الله أن يَقبلَهُ منهُما هِبَةً حتَّى ابتاعَهُ منهُما، ثمَّ بناهُ مسجدًا، وطَفِقَ رسولُ الله صلى الله عليه وسلم يَنقُلُ معهم اللَّبِنَ في بُنيانِهِ ويقولُ، وهو يَنقُلُ اللَّبِنَ: \"هذا الحِمالُ لا حِمالَ خَيبرْ، هذا أَبَرُّ رَبَّنا وأَطهرْ. ويقول: اللَّهمَّ إنَّ الأجرَ أجرُ الآخِرهْ، فارْحَمِ الأنصارَ، والمُهاجِرهْ\" وعن أنسٍ رضي الله عنه قَالَ: قَدِمَ النَّبيُّ صلى الله عليه وسلم المدينةَ فنزل أعلى المدينةِ في حَيٍّ يُقالُ لهم: بنو عَمرِو بنِ عَوفٍ.", "فأقام النَّبيُّ صلى الله عليه وسلم فيهِم أربعَ عشرةَ ليلةً، ثمَّ أرسل إلى بني النَّجَّارِ، فجاءوا مُتَقَلِّدي السُّيوفِ كأنِّي أنظرُ إلى النَّبيِّ صلى الله عليه وسلم على راحِلتِهِ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">وأبو بكرٍ</span> رِدْفُهُ ومَلَأُ بني النَّجَّارِ حولَه حتَّى أَلقى بفِناءِ أبي أيُّوبَ، وكان يُحِبُّ أن يُصلِّيَ حيث أدركتهُ الصَّلاةُ، ويُصلِّي في مَرابضِ الغَنَمِ، وأنَّه أَمَرَ ببِناءِ المسجدِ، فأرسل إلى مَلإٍ مِن بني النَّجَّارِ فقال: «يا بَني النَّجَّارِ ثامِنوني بحائِطِكُم هذا».", "قالوا: لا والله لا نطلبُ ثَمَنَهُ إلَّا إلى الله. فقال أنسٌ: فكان فيه ما أقولُ لكم: قُبورُ المشركين، وفيه خَرِبٌ وفيه نَخلٌ، فأَمَر النَّبيُّ صلى الله عليه وسلم بقُبورِ المشركين فنُبِشَتْ، ثمَّ بالخَرِبِ فسُوِّيَتْ، وبالنَّخلِ فقُطِعَ، فصَفُّوا النَّخلَ قِبلةَ المسجدِ، وجعلوا عِضادَتَيْهِ الحِجارةَ، وجعلوا يَنقُلون الصَّخرَ وهُم يَرتَجِزون والنَّبيُّ صلى الله عليه وسلم معهم، وهو يقول: «اللَّهمَّ لا خيرَ إلَّا خيرُ الآخرهْ، فاغْفِرْ للأنصارِ والمُهاجِرهْ» .", "قال عبدُ الله بنُ عُمَرَ، \" إنَّ المسجدَ كان على عهدِ رسولِ الله صلى الله عليه وسلم مَبْنِيًّا باللَّبِنِ، وسَقْفُهُ الجَريدُ، وعُمُدُهُ خَشبُ النَّخلِ."], "url": "https://dorar.net/history/event/44", "route": [[24.4393, 39.6173], [24.4672, 39.6111]], "stations": null, "title_en": "The Building of the Prophet’s Mosque", "date_en": "Rabi al-Awwal 1 AH (622 CE)", "place_en": "Madinah", "summary_en": "Riding from Quba, the Prophet ﷺ entered Madinah with the people walking beside him, and his camel knelt at the site where the Prophet's Mosque was built.", "people": ["abubakr"], "dorar": 44, "asbab": [], "body_en": ["The Messenger of Allah ﷺ mounted his ride from Qubaa’ and progressed, while people are walking with him, until his she-camel alighted where his Mosque would eventually be built in al-Madeenah. The place was already used by several Muslims as a place of prayer. It was a place to dry dates, which belonged to Sahl and Suhayl, two orphans under the care of As’ad ibn Zuraarah. Upon the alighting of his camel, the Messenger of Allah ﷺ said: “This place, by Allah’s willing, will be where will be the house (i.e., the mosque).”", "Then the Messenger of Allah ﷺ called the two boys and spoke to them about purchasing the piece of land where he ﷺ wanted to build a mosque, but they said: “O Messenger of Allah! We do not wish to sell it because we want to gift it to you!”. But he ﷺ refused to accept it as a gift and instead pressed them until they agreed to sell it to him. Then he ﷺ gave the order for the mosque to be built and he ﷺ began carrying with them bricks and blocks and he ﷺ would say as he worked: “O Lord! This weight that we carry is the one, there is none better; this is purer and more pious,” and the Prophet ﷺ would say: “O Allah! The reward is the reward of the Hereafter; [I beseech You to] have mercy upon the Ansaar and the Emigrants.”", "Narrated Anas ibn Maalik (may Allah be well pleased with him): The Messenger of Allah ﷺ arrived in al-Madeenah and descended upon the quarters of the Banoo ‘Amr ibn Awf. The Prophet ﷺ stayed there for 14 nights, then he ﷺ called the people of Banee al-Najjaar to see him, and they all came carrying their swords….It was as if I am [now] looking at the Prophet ﷺ riding his camel, and Aboo Bakr (may Allah be pleased with him) was riding behind him on its hindquarters, and the people of Banoo al-Najjaar are surrounding him, until the Prophet ﷺ arrived at the yard of Aboo Ayyoob.", "It was the habit of the Prophet ﷺ to like to pray at the place where the prayer’s time came; he ﷺ would pray in the enclosures of sheep. He ﷺ then gave the order for the building of the Mosque; thus, he ﷺ called a group from the people of Banoo al-Najjaar and he ﷺ said to them: “Oh Banee al-Najjaar, name your price for this piece of land of yours.” They said: “By Allah, we do not want anything for it except for the good pleasure of Allah.” Then Anas said: “In that land, there were graves of polytheists, trees, and other ruins.”", "The Prophet ﷺ ordered that the graves be dug up, that the ruins be removed, and that the trees be cut; then the trees were placed in a line facing the Qiblah. Then, they placed stones for the steps. As they worked, they sang poetry and the Prophet ﷺ was with them. And he ﷺ would say: “O Allah! There is no good like the good of Paradise; forgive the Ansaar and the Emigrants.” Abdullah ibn Umar (may Allah be pleased with him) said: “The mosque at the time of the Messenger of Allah ﷺ was built out of mud-brick, its roof was thatched with palm-leaves, and its pillars were the trunks of palm trees.”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 30, "stage": 4, "title": "المُؤاخاةُ بين المُهاجِرين والأنصارِ", "date": "ربيع الأول 1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كان مِن آثارِ هِجرتِه صلى الله عليه وسلم وأصحابِه إلى المدينةِ تلك المُؤاخاةُ التي حَدثت بين المُهاجرين والأنصارِ رضي الله عنهم، حتَّى كان يَرِثُ بعضُهم بعضًا في أوَّلِ الأمرِ. فعنِ ابنِ عبَّاسٍ رضِي الله عنهما: <span class=\"verse\">﴿وَلِكُلٍّ جَعَلْنَا مَوَالِيَ﴾</span> قال: «وَرَثَةً»: <span class=\"verse\">﴿وَالَّذِينَ عَاقَدَتْ أَيْمَانُكُمْ﴾</span> قال: \" كان المُهاجِرون لمَّا قَدِموا المدينةَ يَرِثُ المُهاجِرُ الأنصاريَّ دون ذَوِي رَحِمِهِ؛ لِلأُخُوَّةِ التي آخى النَّبيُّ صلى الله عليه وسلم بينهم، فلمَّا نزلت: {<span class=\"verse\">﴿وَلِكُلٍّ جَعَلْنَا مَوَالِيَ﴾</span> نسَختْ\". ثمَّ قال: <span class=\"verse\">﴿وَالَّذِينَ عَاقَدَتْ أَيْمَانُكُمْ﴾</span> «إلَّا النَّصرَ، والرِّفادَةَ، والنَّصيحةَ، وقد ذهب الميراثُ، ويوصي له». وعن أنسٍ قال: لمَّا قَدِمَ النَّبيُّ صلى الله عليه وسلم المدينةَ أتاهُ المُهاجرون فقالوا: يا رسولَ الله، ما رَأينا قومًا أَبْذَلَ مِن كثيرٍ، ولا أحسنَ مُواساةً مِن قليلٍ مِن قومٍ نزلنا بين أَظهُرهِم، لقد كَفَوْنا المُؤنَةَ وأشرَكونا في المَهْنَإِ حتَّى لقد خُفْنا أن يَذهبوا بالأجرِ كُلِّهِ. فقال النَّبيُّ صلى الله عليه وسلم: «لا ما دَعَوتُم الله لهم، وأَثْنَيْتُم عليهِم» . وقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdrahman\">عبدُ الرَّحمنِ بنُ عَوفٍ</span> رضي الله عنه: لمَّا قَدِمْنا المدينةَ آخى رسولُ الله صلى الله عليه وسلم بيني وبين سعدِ بنِ الرَّبيعِ، فقال سعدُ بنُ الرَّبيعِ: إنِّي أَكثرُ الأنصارِ مالًا، فَأَقْسِمُ لك نِصفَ مالي، وانْظُرْ أيَّ زَوجتيَّ هَوِيتَ نَزلتُ لك عنها، فإذا حَلَّتْ تَزوَّجتَها. قال: فقال له عبدُ الرَّحمنِ: لا حاجةَ لي في ذلك، هل مِن سوقٍ فيه تِجارةٌ؟ قال: سوقُ قَيْنُقاعٍ. قال: فغَدا إليه عبدُ الرَّحمنِ، فأتى بأَقِطٍ وسَمْنٍ، قال: ثمَّ تابع الغُدُوَّ، فما لَبِثَ أن جاء عبدُ الرَّحمنِ عليه أثرُ صُفْرَةٍ، فقال رسولُ الله صلى الله عليه وسلم: «تَزوَّجتَ؟». قال: نعم. قال: «ومَن؟»، قال: امرأةً مِنَ الأنصارِ. قال: «كَم سُقْتَ؟»، قال: زِنَةَ نَواةٍ مِن ذَهبٍ -أو نَواةً مِن ذَهبٍ- فقال له النَّبيُّ صلى الله عليه وسلم: «أَوْلِمْ ولو بِشاةٍ» ."], "url": "https://dorar.net/history/event/45", "route": null, "stations": null, "title_en": "The Emigrants and the Ansaar Are Made Brothers", "date_en": "Rabi al-Awwal 1 AH (622 CE)", "place_en": "Madinah", "summary_en": "The Prophet ﷺ made the Muhajirun and the Ansar brothers. The Ansar shared their homes and wealth, and at first they even inherited from one another.", "people": ["abdrahman"], "dorar": 45, "asbab": [{"id": "ASB-021", "k": "d"}], "body_en": ["Amongst the fruits of the migration of the Prophet ﷺ and that of his Companions (may Allah be pleased with him) to al-Madeenah was the brotherhood that was created between the Emigrants and the Ansaar (may Allah be well pleased with all of them). The bond of brotherhood that was created was to the extent that it even allowed for them to inherit each other at the beginning [until Allah revealed how inheritance should be divided]. Ibn `Abbas (may Allah be pleased with him) said, \"In the ayah: {To every one We have appointed Muwaliya}.", "Muwaliya means one's heirs (4.33).' (And regarding the ayah) {And those with whom your right hands have made a pledge.} Ibn `Abbas said, \"When the emigrants came to the Prophet (ﷺ) in Medina, the emigrant would inherit the Ansari while the latter's relatives would not inherit him because of the bond of brotherhood which the Prophet established between them (i.e., the emigrants and the Ansaar). When the ayah: {And to everyone We have appointed heirs} (4.33) was revealed, it canceled (the bond (the pledge) of brotherhood regarding inheritance).\"", "Then he said, \"The ayah: {To those also to whom your right hands have pledged} remained valid regarding cooperation and mutual advice, while the matter of inheritance was excluded, and it became permissible to assign something in one's testament to the person who had the right of inheriting before.” Narrated Anas (may Allah be well pleased with him): “When the Prophet ﷺ came to al-Madeenah, the Emigrants came to him and said: “O Messenger of Allah! We have never seen people more liberal out of abundance or better in giving help when they have little than a people among whom we have settled. They have removed our trouble and shared with us their pleasant things so that we are afraid they will get the whole reward.\" He replied, ‘No, as long as you make supplication to God for them and express commendation of them [i.e., They have no reason to fear that the Ansar will get all the reward from God so long as due expression of thanks is made.].", "Abd al-Rahmaan ibn ‘Awf (may Allah be well pleased with him) said: “When we came to Medina as emigrants, Allah's Messenger ﷺ established a bond of brotherhood between me and Sa`d ibn Ar-Rabee`. Sa`d ibn Ar-Rabee` said (to me), 'I am the wealthiest among the Ansaar, so I will give you half of my wealth and you may look at my two wives and whichever of the two you may choose, I will divorce her, and when she has completed the prescribed period (before marriage) you may marry her.' `Abd al-Rahmaan replied, \"I am not in need of all that. Is there any marketplace where trade is practiced?' He replied, \"The market of Qaynuqaa.\" `So, he went to that market the following day and brought some dried buttermilk and butter, and then he continued going there regularly. Few days later, `Abd al-Rahmaan came having traces of yellow (scent) on his body. Allah's Messenger ﷺ asked him whether he had got married. He replied in the affirmative. The Prophet ﷺ said, 'Whom have you married?' He replied, 'A woman from the Ansaar.' The Prophet ﷺ asked, 'How much did you pay her?' He replied, '(I gave her) a gold piece equal in weigh to a date stone (or a date stone of gold)! The Prophet ﷺ said, 'Make a wedding banquet even if with one sheep.\""], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 31, "stage": 4, "title": "إسلام عبد الله بن سلَام رَضي اللهُ عنه", "date": "1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"salam\">عبدُ الله بن سلامٍ</span> رَضي اللهُ عنه حَبْرًا من أحبارِ يَهودَ، عالِمًا، قال: لمَّا سَمِعتُ برسولِ الله صلَّى اللهُ عليه وسلَّم عَرَفتُ صِفَتَه واسمَه وزَمانَه الذي كنا نتوقَّعُ له، فكنتُ مُسِرًّا لذلك، صامِتًا عليه، حتى قَدِمَ رسولُ الله صلَّى اللهُ عليه وسلَّم المدينةَ، فلمَّا نزل بقُباءٍ، في بني عَمرِو بنِ عَوفٍ، أقبل رجلٌ حتى أخبَرَ بقُدومِه، وأنا في رأسِ نَخلةٍ لي أعمَلُ فيها، وعمَّتي خالِدةُ بنتُ الحارِثِ تحتي جالِسةٌ، فلما سمعتُ الخبرَ بقُدومِ رسولِ الله صلَّى اللهُ عليه وسلَّم كَبَّرتُ، فقالت لي عَمَّتي حين سَمِعَت تكبيري: خيَّبَك اللهُ! واللهِ لو كُنتَ سَمِعتَ بموسى بنِ عِمرانَ قادِمًا ما زِدتَ! قال: فقلتُ لها: أيْ عمَّةُ، هو واللهِ أخو موسى بنِ عِمرانَ، وعلى دينِه، بُعِث بما بُعِث به.", "قال: فقالت: أيِ ابنَ أخي، أهوَ النبيُّ الذي كُنَّا نُخبَرُ أنه يُبعَثُ مع نَفَسِ السَّاعةِ؟ قال: فقلتُ لها: نعم. قال: فقالت: فذاك إذن. قال: ثم خرجتُ إلى رسولِ الله صلَّى اللهُ عليه وسلَّم، فأسلَمتُ، ثم رَجَعتُ إلى أهلِ بيتي، فأمرتُهم فأسلموا. قال: وكَتمتُ إسلامي من يهودَ، ثم جِئتُ رسولَ الله صلَّى اللهُ عليه وسلَّم، فقلتُ له: يا رسولَ الله، إنَّ يهودَ قومٌ بُهتٌ، وإنِّي أُحِبُّ أن تُدخِلَني في بعضِ بُيوتِك، وتُغيِّبَني عنهم، ثم تَسألَهم عني، حتى يُخبِروك كيف أنا فيهم، قَبْلَ أن يعلَموا بإسلامي؛ فإنَّهم إنْ عَلِموا به بَهَتوني وعابوني.", "قال: فأدخَلَني رسولُ الله صلَّى اللهُ عليه وسلَّم في بعضِ بُيوتِه، ودَخَلوا عليه، فكلَّموه وساءَلوه، ثم قال لهم: \"أيُّ رجلٍ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"salam\">عبدُ الله بنُ سَلامٍ</span> فيكم؟\" قالوا: سيِّدُنا وابنُ سيِّدِنا، وحَبرُنا وعالِمُنا. قال: فلمَّا فَرَغوا من قولِهم خرجتُ عليهم، فقلتُ لهم: يا مَعشرَ يهودَ، اتَّقوا اللهَ واقبَلوا ما جاءكم به، فواللهِ إنَّكم لَتعلمون إنَّه لَرسولُ الله، تَجِدونَه مَكتوبًا عِندكُم في التَّوراةِ باسمِهِ وصِفَتِه، فإنِّي أشهَدُ أنَّه رسولُ الله صلَّى اللهُ عليه وسلَّم، وأُومِن به وأُصدِّقُه وأعرِفُه.", "فقالوا: كَذَبْتَ. ثم وَقَعوا بي، قال: فقلتُ لرسولِ الله صلَّى اللهُ عليه وسلَّم: ألَمْ أُخبِرْك يا رسولَ الله أنهم قومٌ بُهتٌ، أهلُ غدرٍ وكذبٍ وفُجورٍ! قال: فأظهَرتُ إسلامي وإسلامَ أهلِ بيتي، وأسلَمَت عمَّتِي خالِدةُ بنتُ الحارِثِ، فحَسُن إسلامُها."], "url": "https://dorar.net/history/event/37", "route": null, "stations": null, "title_en": "‘Abdullah ibn Salaam (May Allah Be Pleased with Him) Enters Islam", "date_en": "1 AH (622 CE)", "place_en": "Madinah", "summary_en": "Abdullah ibn Salam, a learned rabbi of Madinah, recognised the Prophet ﷺ from the description in his scriptures and accepted Islam.", "people": ["salam"], "dorar": 37, "asbab": [{"id": "ASB-020", "k": "d"}], "body_en": ["Abdullah ibn Salaam (may Allah be well pleased with him) used to be a scholar and a rabbi from amongst the Jews. He related: “When I heard [the news of the appearance of] the Messenger of Allah ﷺ I [already] knew his characteristics, his name, and the time which we expected him to appear; but I had kept all of this secret until the Messenger of Allah ﷺ arrived at al-Madeenah. When he stopped at Qubaa’ amongst the people of Banoo ‘Amr ibn ‘Awf, a man came to announce his arrival. At the time, I was at the top of a palm tree, busy with some work, while my paternal aunt, Khaalidah bint al-Haarith was down below sitting. When I heard the news of his arrival ﷺ I said “Allahu Akbar!” and then my aunt said to me when she heard me say it: “may Allah disappoint you! Had you heard that Moses ibn ‘Imraan had arrived, you would have never made such a noise!” I said to her: “O aunt! By Allah, he is the brother of [Prophet] Moses ibn ‘Imraan, and upon his religion he has been sent.”", "She then responded to me: “O my nephew! Is this the Prophet that we were being informed about his arrival close to the Final Hour?” I said: “Yes” then she said: “That’s what it is then…”. Abdullah continues: “then I went out to meet the Messenger of Allah ﷺ and I accepted Islam; then I went back to my family and ordered them to do the same, and they did.” He added: “I hid my Islam from the Jews, then I went to see the Messenger of Allah ﷺ and I said to him: “O Messenger of Allah! Verily the Jews are a slanderous people, and I would appreciate if you could hide me in your house and then ask them about me without them knowing that I am present, until they tell you how I am amongst them before they find out about my Islam. If they were to find out about it now, they would accuse me of all sorts of things and denigrate me.” The Messenger of Allah ﷺ then did as I asked and then the Jews came to meet him; they spoke to him and asked him questions.", "Then the Messenger of Allah ﷺ said to them: “Tell me about Abdullah ibn Salaam, how is he considered amongst yourselves?” They said: “Our master and the son of our master, he is our rabbi and a scholar from amongst us.” Abdullah continues his story: “When they had finished describing me, I came out to where they were then I said to them: “Oh Jews! Fear Allah and accept that which I have come to you with. By Allah, you all know that this is the Messenger of Allah, whose name and description we have found written in the Torah. I therefore bear witness that he is the Messenger of Allah and I believe in what he says, and confirm it, and I know who he truly is.” But then the Jews who had gathered there all said: “You have lied!” and then they all started to accuse and slander me. I said to the Messenger of Allah ﷺ “Did I not tell you that they were a people given to false accusations? A lying, treacherous, and wicked people?” After that incident, I announced my Islam and the Islam of my family; my paternal aunt, Khaalidah bint al-Haarith also accepted Islam, and she was a good Muslim.”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 32, "stage": 4, "title": "معاهدة النبي صلَّى اللهُ عليه وسلَّم مع يهود", "date": "1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["قال ابن إسحاق: «كتب رسول الله- صلى الله عليه وسلم- كتابًا بين المهاجرين والأنصار وادع فيه يهود وعاهدهم وأقرّهم على دينهم وأموالهم واشترط عليهم وشرط لهم» . أي لمّا امتنعوا من إتباعه، وذلك قبل الإذن بالقتال وأخذ الجزية ممن أبى الإسلام، وقد أبى عامَّتُهم إلا الكفر.", "وكانوا ثلاث قبائل: بنو قينقاع، وبنو النضير، وبنو قريظة، وحاربه الثلاثة، فمنَّ على بني قينقاع، وأجلى بني النضير، وقتل بني قريظة، وسبى ذريتهم، ونزلت (سورة الحشر) في بني النضير، و (سورة الأحزاب) في بني قريظة."], "url": "https://dorar.net/history/event/38", "route": null, "stations": null, "title_en": "The Prophet ﷺ Concludes a Pact with the Jews", "date_en": "1 AH (622 CE)", "place_en": "Madinah", "summary_en": "The Prophet ﷺ wrote a charter between the Muhajirun and the Ansar that also made a pact with the Jews of Madinah, securing their religion and property and setting duties on both sides.", "people": [], "dorar": 38, "asbab": [], "body_en": ["Ibn Ishaaq related: “The Messenger of Allah ﷺ penned a pact between the Emigrants, the Ansaar, and the Jews. The terms of the agreement were to make peace with the Jews, let them be upon their religion, and safeguard their wealth. In this pact, he ﷺ established conditions for them and established conditions upon the Muslims towards them.” i.e., this happened when the Jews refused to follow him, namely before he was given permission to fight back and to take the Jizyah from those who refused to accept Islam; and the majority of them refused to accept Islam.", "The Jews were organized into three tribes: “Banoo Qaynuqaa’, Banoo al-Nadeer, and Banoo al-Quraydhhah. All of them warred against him ﷺ; he ﷺ gave amnesty to Banoo al-Qaynuqaa’, he ﷺ banished Banoo Nadeer, and he executed Banoo Quraydhha, and took their womenfolk and children as captives. The Surah of al-Hashr was revealed concerning Banoo al-Nadeer, and Surah al-Ahzaab was revealed concerning Banoo Quraydhhaa."], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 33, "stage": 4, "title": "مَشروعِيَّةُ الأَذانِ", "date": "1 هـ، الموافق 622م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["عنِ ابنِ عُمَرَ قال: كان المسلمون حين قَدِموا المدينةَ يجتَمِعون فيتَحيَّنون الصَّلواتِ، وليس يُنادي بها أحدٌ، فتَكلَّموا يومًا في ذلك فقال بعضُهم: اتَّخِذوا ناقوسًا مِثلَ ناقوسِ النَّصارى، وقال بعضُهم: قَرْنًا مِثْلَ قَرْنِ اليَهودِ. وقال عبدُ الله بنُ زيدٍ: (لمَّا أَمَر رسولُ الله صلى الله عليه وسلم بالنَّاقوسِ يُعملُ لِيُضرَبَ به للنَّاسِ لِجَمْعِ الصَّلاةِ طاف بي وأنا نائمٌ رجلٌ يَحمِلُ ناقوسًا في يَدِه فقلتُ: يا عبدَ الله أَتبيعَ النَّاقوسَ؟ قال: وما تصنعُ به؟ فقلتُ: نَدعو به إلى الصَّلاةِ قال: أفلا أَدُلُّك على ما هو خيرٌ مِن ذلك؟ فقلتُ له: بلى. قال: فقال: تقولُ: الله أَكبرُ، الله أَكبرُ، الله أَكبرُ، الله أَكبرُ، أَشهدُ أن لا إلَه إلَّا الله، أَشهدُ أن لا إلَه إلَّا الله، أَشهدُ أنَّ محمَّدًا رسولُ الله، أَشهدُ أنَّ محمَّدًا رسولُ الله، حَيَّ على الصَّلاةِ، حَيَّ على الصَّلاةِ، حَيَّ على الفَلاحِ، حَيَّ على الفَلاحِ، الله أَكبرُ، الله أَكبرُ، لا إلَه إلَّا الله. قال: ثمَّ اسْتأخَر عَنِّي غيرَ بَعيدٍ، ثمَّ قال: وتقولُ إذا أَقمتَ الصَّلاةَ: الله أَكبرُ، الله أَكبرُ، أَشهدُ أن لا إلَه إلَّا الله، أَشهدُ أنَّ محمَّدًا رسولُ الله، حَيَّ على الصَّلاةِ، حَيَّ على الفَلاحِ، قد قامتِ الصَّلاةُ، قد قامتِ الصَّلاةُ، الله أَكبرُ، الله أَكبرُ، لا إلَه إلَّا الله. فلمَّا أَصبحتُ أَتيتُ رسولَ الله صلى الله عليه وسلم فأخبرتُه بما رأيتُ، فقال إنَّها لَرُؤْيا حَقٌّ إن شاء الله، فقُمْ مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">بلالٍ</span> فَأَلْقِ عليه ما رَأيتَ فَلْيُؤَذِّنْ به؛ فإنَّه أَندى صوتًا منك. فقمتُ مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"bilal\">بلالٍ</span> فجعلتُ أُلْقِيهِ عليه ويُؤذِّنُ به، قال فسمِع ذلك <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> بنُ الخطَّابِ وهو في بيتِه، فخرج يَجُرُّ رِداءَهُ ويقولُ: والذي بعثَك بالحقِّ يا رسولَ الله، لقد رأيتُ مِثلَ ما رَأى. فقال رسولُ الله صلى الله عليه وسلم: فللهِ الحمدُ) ."], "url": "https://dorar.net/history/event/39", "route": null, "stations": null, "title_en": "Legislating the Call to Prayer", "date_en": "1 AH (622 CE)", "place_en": "Madinah", "summary_en": "The Muslims discussed how to call people to prayer. After a vision seen by a Companion, which Umar also confirmed, the Prophet ﷺ adopted the adhan and asked Bilal to call it.", "people": ["bilal", "umar"], "dorar": 39, "asbab": [], "body_en": ["Narrated Ibn Umar (may Allah be pleased with him): “When the Muslims arrived at al-Madeenah, they would gather and wait for the right moment to offer their prayers, as there was no one to call them to it. One day, they discussed the matter; some of them said: “let us use a bell like the Christians do,” while others said: “Let us use a horn like the Jews do.”” Abdullah ibn Zayd said: “When the Messenger of Allah ﷺ ordered that we use the bell to call people to all of the prayers, a man came to me in my dream whilst I was sleeping carrying a bell in his hand, and I said to him: “Hey you! (lit. oh slave of Allah), do you sell bells?” He responded: “and what will you do with it?” I said: “We shall call people with it to the prayer.” He said: “Shall I not show you a better way to call people?” I said: “Of course…” He said: “Say: Allahu Akbar, Allahu Akbar, Allahu Akbar, Allahu Akbar, I testify that there is no god but Allah; I testify that there is no god but Allah; I testify that Muhammad is the Messenger of Allah; I testify that Muhammad is the Messenger of Allah.", "Come to pray, come to pray; come to salvation; come to salvation. Allahu Akar, Allahu Akbar. I testify that there is no god but Allah.” He then moved backward a few steps and said: when you announce the start of the prayer (i.e., iqaamah), you should say: Allah is most great, Allah is most great. I testify that there is no god but Allah, I testify that Muhammad is the Messenger of Allah. Come to prayer, come to salvation. The time for prayer has come, the time for prayer has come: Allahu Akbar, Allahu Akbar. There is no god but Allah.”", "When I awoke, I went to see the Messenger of Allah ﷺ and I told him what I saw. He ﷺ said: “Indeed, this is a true dream, if Allah wills. Go to Bilaal and recite this to him so that he can use it to call people with it; he has the loudest voice from amongst you.” I went to Bilal and recited to him that which I had heard in my dream and he began calling people with it.” Ibn Umar continues: “Umar ibn al-Khattaab (may Allah be pleased with him) was in his house when he heard the call to prayer, and he came out putting on his cape saying: “O Messenger of Allah! By the One who has sent with you with the Truth, I saw the same thing that (Abdullah) saw in his dream.” Then the Messenger of Allah ﷺ said: “All Praise is due to Allah.”"], "src_en": "https://dorar.net/en/history?page=3"}, {"seq": 34, "stage": 5, "title": "سرية عبيدة بن الحارث بن المطلب إلى بطن رابغ", "date": "شعبان 1 هـ، الموافق 623م", "place": "رابغ", "lat": 22.79, "lng": 39.03, "approx": false, "zoom": 8, "paras": ["بَعَث النبيُّ صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayda\">عُبيدةَ بنَ الحارِثِ</span> بن عبد المطلب في سريَّةٍ إلي بطنِ رابِغٍ -هيَ ميقاتُ أهلِ الشامِ ومِصرَ وتركيا ومَن سَلَك طَريقَهم- في شعبان على رأسِ ثمانيةِ أشهُرٍ من الهجرةِ، وعَقَد له لواءً أبيضَ، وحَمَله مِسْطَحُ بن أُثاثةَ بن المطلبِ بن عبد مَنافٍ، وكانوا في ستِّين من المُهاجِرين ليس فيهم أنصاريٌّ، فلَقيَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبا سُفيانَ</span> بنَ حربٍ، وهو في مائتينِ على بطنِ رابِغٍ، على عشرةِ أميالٍ من الجُحفةِ، وكان بينهم الرَّميُ، ولم يَسُلُّوا السُّيوفَ، ولم يَصطَفُّوا للقتالِ، وإنَّما كانت مُناوشةً، وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدُ بن أبي وقَّاصٍ</span> فيهم، وهو أوَّلُ مَن رَمَى بسهمٍ في سبيل الله، ثم انصَرَف الفريقانِ إلى حاميَتِهم."], "url": "https://dorar.net/history/event/46", "route": null, "stations": null, "title_en": "Sending Out an Expedition Led by ‘Ubaydah ibn al-Haarith ibn al-Muttalib to the Valley of Raabigh,", "date_en": "Shaban 1 AH (623 CE)", "place_en": "Rabigh", "summary_en": "The Prophet ﷺ sent Ubaydah ibn al-Harith with a group of Muhajirun to the valley of Rabigh. They met a party of Quraysh, but no fighting took place beyond an exchange of arrows.", "people": ["ubayda", "saad", "abusufyan"], "dorar": 46, "asbab": [], "body_en": ["The Prophet ﷺ sent out a military detachment lead by ‘Ubaydah ibn al-Haarith ibn ‘Abd al-Muttalib to the valley of Raabigh, which is the principal boundary at which Muslim pilgrims from al-Shaam, Egypt, Turkey, and those who travel through their route, intending to perform the Hajj or Umrah pilgrimages, must be enter the state of ihraam, in the month of Shawwaal, after 8 months after the hijrah. He was given a white banner, a banner that Mistah ibn ‘Uthaathah ibn al-Muttalib ibn ‘Abd Manaaf. The military detachment consisted of 60 fighters; all of them were from the immigrants.", "The combat encounter between them and Aboo Sufyaan ibn Harb and his 200 fighters, occurred at the valley of Raaghib, ten miles away from al-Juhfah. However, their encounter was just a skirmish where the archers exchanged arrows apace on both sides without any outbreak of fighting by swords. Sa’d ibn Abee Waqqaas was in the Muslim expedition, who was the first one in Islam to shoot an arrow in the path of Allah. After, both sides departed and returned to their rear-guard."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 35, "stage": 5, "title": "سرية حمزة إلى سيف البحر", "date": "رمضان 1 هـ، الموافق 623م", "place": "سيف البحر", "lat": 24.9, "lng": 38.1, "approx": true, "zoom": 8, "paras": ["أرسل النبيُّ صلَّى اللهُ عليه وسلَّم سَريَّةً إلى سِيفِ -ساحِلِ- البحرِ، أمَّر عليها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةَ</span> بنَ عبد المطلب، وبعثه في ثلاثين راكبًا مِن المُهاجِرين، وكان لِواءُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حَمزةَ</span> أولَ لواءٍ عَقَده رسولُ الله صلَّى اللهُ عليه وسلَّم، وكان أبيضَ، وكان حامِلُه أبا مِرثَدٍ كَنَّازَ بنَ حُصينٍ الغَنويَّ رَضي اللهُ عنه، وكان هدفُ هذه السَّريَّةِ اعتِراضَ عِيرٍ لقُريشٍ جاءتْ من الشامِ، وفيها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abujahl\">أبو جهلِ</span> بنُ هشامٍ في ثلاثِ مئةِ رجلٍ، فبَلَغوا سِيفَ البحرِ من ناحيةِ العيصِ -اسمُ موضِعٍ قُربَ المدينةِ على ساحِلِ البحرِ- فالْتَقَوا واصطَفُّوا للقتالِ، فمَشَى مَجْديُّ بن عَمرٍو الجُهنيُّ -وكان حليفًا للفَريقَينِ جميعًا- بين هؤلاءِ وهؤلاءِ، حتى حَجَز بينهم، فلم يَقتَتِلوا.", "وقد كانتْ سريَّةُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"hamza\">حمزةَ</span> رَضي اللهُ عنه في وَقتٍ واحدٍ مع سريَّةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayda\">عُبيدةَ بنِ الحارِثِ</span> رَضي اللهُ عنه إلى رابِغٍ."], "url": "https://dorar.net/history/event/47", "route": null, "stations": null, "title_en": "Sending Out an Expedition Led by Hamzah to the Seashore", "date_en": "Ramadan 1 AH (623 CE)", "place_en": "Red Sea coast", "summary_en": "Hamzah led thirty Muhajirun to the Red Sea coast to intercept a Quraysh caravan led by Abu Jahl, but a local chief intervened and no fighting took place. It was the first banner the Prophet ﷺ tied.", "people": ["hamza", "ubayda", "abujahl"], "dorar": 47, "asbab": [], "body_en": ["The Prophet ﷺ sent out an expedition to the seashore and appointed Hamzah ibn ‘Abd al-Muttalib as its commander. The expedition consisted of 30 fighters, all of them were from the immigrants. The first banner that the Prophet handed to any Muslims was to Hamzah, and it was white in colour, and it was carried by Aboo Mirthad, Kannaz ibn Hussayn al-Ghanawee (may Allah be pleased with him). The mission of this expedition was to intercept a merchant-caravan returning from the Shaam that has three hundred riders. Hamzah (may Allah be pleased with him) met Aboo Jahl who was the head of the caravan at the seashore at a place called al-‘Eees near al-Madeenah.", "Each side lined up, taking their position to fight, but Majdee ibn ‘Amr al-Juhanee intervened between them for he was at peace with both parties, and he kept walking between the two parties, which then separated without any outbreak of fighting. The expedition of Hamzah (may Allah be pleased with him) and the expedition of ‘Ubaydah ibn al-Haarith (may Allah be pleased with him) to the valley of Raabigh were dispatched at the same time."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 36, "stage": 5, "title": "سرية سعد بن أبي وقاص رضي الله عنه إلى الخَرّار", "date": "ذي القعدة 1 هـ، الموافق 623م", "place": "الخرار", "lat": 22.95, "lng": 39.15, "approx": true, "zoom": 8, "paras": ["بَعثَ رسولُ الله صلَّى اللهُ عليه وسلَّم على رأسِ تِسعةِ أشهُرٍ من الهِجرةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدَ بنَ أبي وقَّاصٍ</span> رَضي اللهُ عنه في عِشرين من المُهاجِرين. وقيل: ثَمانيةٍ إلى الخَرَّارِ. وعَقَد له لواءً أبيضَ حَمَلَه المِقدادُ بنُ عَمرٍو رَضي اللهُ عنه. والخَرَّارُ: وادٍ يُتَوَصَّلُ منه إلى الجُحفةِ، وقد عَهِدَ صلَّى اللهُ عليه وسلَّم إليه ألَّا يُجاوِزَه؛ ليَعتَرِضَ عيرًا لقُريشٍ تَمرُّ بِهِم، فخَرَجوا يَمشون على أقدامِهِم، يَكمُنون النَّهارَ ويَسيرون اللَّيلَ حتى صَبَّحوا المكانَ المَذكورَ في صُبحِ خمسٍ؛ فوَجدوا العِيرَ قد مرَّت بالأمسِ؛ فضَرَبوا راجِعين إلى المدينةِ من غيرِ حربٍ."], "url": "https://dorar.net/history/event/48", "route": null, "stations": null, "title_en": "Sending Out an Expedition Led by Sa’d ibn Abee Waqqaas (May Allah Be Pleased with Him) to al-Kharraar", "date_en": "Dhu al-Qadah 1 AH (623 CE)", "place_en": "Al-Kharrar", "summary_en": "Sa'd ibn Abi Waqqas led a group of Muhajirun to al-Kharrar to intercept a Quraysh caravan, but it had already passed.", "people": ["saad"], "dorar": 48, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent out an expedition led by Sa’d ibn Abee Waqqaas (may Allah be pleased with him) to al-Kharraar, which is a valley through which one can reach al-Juhfah. The expedition consisted of twenty riders, all of them were from the immigrants, and it was said that they were eight only. The Prophet ﷺ handed him a white banner that was carried by al-Miqdaad ibn ‘Amr (may Allah be pleased with him). The Prophet ﷺ ordered Sa’d not to go beyond the limits of the valley as their mission was to intercept the merchant-caravans of Quraysh passing through the valley.", "The expedition marched to their destination on foot, resting at daytime and walking during the night. They arrived at their destination in the morning of the fifth day, but to find out that they missed the caravan. So, they returned to the al-Madeenah without having any fight."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 37, "stage": 5, "title": "غَزوةُ الأَبْواءِ (وَدَّانَ) ومُوادَعةُ بني ضَمْرَةَ", "date": "صفر 2 هـ، الموافق 623م", "place": "الأبواء", "lat": 23.12, "lng": 39.05, "approx": false, "zoom": 8, "paras": ["أوَّلُ ما غَزا النَّبيُّ صلَّى الله عليه وسلَّم الأَبْواءَ ثمَّ بُواطَ ثمَّ العُشَيْرَةَ. وهي قريةٌ مِن عَمَلِ الفُرْعِ، بينها وبين الجُحْفَةِ مِن جِهَةِ المدينةِ ثلاثةٌ وعِشرون مِيلًا. قِيلَ سُمِّيتْ بذلك لِما كان فيها مِنَ الوَباءِ، وهي غَزوةُ وَدَّانَ بِتَشديدِ الدَّالِ، قال إسحاقُ: خرج النَّبيُّ صلَّى الله عليه وسلَّم غازِيًا بِنَفْسِهِ حتَّى انتَهى إلى وَدَّانَ، وهي الأَبْواءُ.", "خرج مِنَ المدينةِ على رأسِ اثنيْ عشرَ شهرًا مِن مَقْدَمِهِ المدينةَ يُريدُ قُريشًا، فَوادَعَ بني ضَمْرَةَ بنِ بكرِ بنِ عبدِ مَناةَ، مِن كِنانةَ، وادَعَهُ رَئيسُهم مَخْشِيُّ بنُ عَمرٍو الضَّمْريُّ، ورجع بغيرِ قِتالٍ. وكان النَّبيُّ صلَّى الله عليه وسلَّم قد استعمل على المدينةِ سعدَ بنَ عُبادةَ.", "وقِيلَ: إنَّ النَّبيَّ صلَّى الله عليه وسلَّم لمَّا وصل إلى الأَبْواءِ بعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayda\">عُبيدةَ بنَ الحارثِ</span> في سِتِّينَ رجلًا فَلَقوا جمعًا مِن قُريشٍ فتَراموا بالنَّبْلِ، فَرَمى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدُ بنُ أبي وقَّاصٍ</span> بِسَهمٍ، وكان أوَّلَ مَن رَمى بِسَهمٍ في سَبيلِ الله."], "url": "https://dorar.net/history/event/49", "route": null, "stations": null, "title_en": "The Battle of al-Abwaa’ (Waddaan) and Making Peace with Banee Dumrah", "date_en": "Safar 2 AH (623 CE)", "place_en": "Al-Abwa", "summary_en": "The first campaign the Prophet ﷺ led in person was to al-Abwa (Waddan). He made a pact with Banu Damrah, and no fighting took place.", "people": ["saad", "ubayda"], "dorar": 49, "asbab": [], "body_en": ["The first place that the Prophet ﷺ went to on campaign was al-Abwaa’, then Buwaat, followed by al-‘Ushayrah. It is one of the villages of the valley of al-Furu’ that is located twenty-three miles from al-Madeenah. It was said the reason it was given its name is that it was known of suffering pandemics. This battle is also known as the battle of Waddaan. Ishaaq said: The Prophet ﷺ went on campaign himself. He marched with his expedition until they arrived at a place called Waddaan, which is al-Abwaa’. He went on this campaign after twelve months from his arrival to al-Madeenah, and his mission was to encounter Quraysh.", "He made peace with Banee Dumrah ibn Bakr ibn ‘Abd Manaah, from Kinaanah. It was their leader, Majdyy ibn ‘Amr al-Dumree, who made peace on behalf of his tribe; thus, no fight took place between them and the Muslims. The Prophet ﷺ appointed Sa’d ibn ‘Ubaadah in charge of al-Madeenah during his absence. It has been said that when the Prophet ﷺ arrived to al-Abwaa’, he ﷺ sent out a military detachment consisting of sixty men led by ‘Ubaydah ibn al-Haarth to intercept a group from Quraysh [who were on their way back to Makkah].", "The encounter resulted in throwing arrows against each other, and Sa’d ibn Abee Waqqaas was in that mission, and he was the first Muslim to throw an arrow in the path of Allah."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 38, "stage": 5, "title": "غزوة بدر الأولى (وادي سفوان)", "date": "ربيع الأول 2 هـ، الموافق 623م", "place": "بدر", "lat": 23.78, "lng": 38.79, "approx": false, "zoom": 8, "paras": ["غزا رسولُ الله صلَّى اللهُ عليه وسلَّم غزوةَ بدرٍ الأولَى حتى بَلَغ واديَ سَفَوانَ؛ حيث خَرَج رسولُ الله صلَّى اللهُ عليه وسلَّم على رأسِ ثلاثةَ عَشَرَ شهرًا من مُهاجَرِه يَطلُب كُرزَ بنَ جابِرٍ الفِهريَّ، وحَمَل لِواءَه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">عليُّ بنُ أبي طالِبٍ</span> رَضي اللهُ عنه، وكان أبيضَ، واستَخلَفَ على المدينةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارِثةَ</span>، وكان كُرزٌ قد أغار على سَرحِ المدينةِ -الإبِلِ والمَواشي التي تَسرَحُ للرَّعيِ بالغَداةِ- فاستاقَه، وكان يَرعَى بالحِمَى، فطَلَبه رسولُ الله صلَّى اللهُ عليه وسلَّم حتى بَلَغ واديًا يُقالُ له: \"سَفَوانُ\" من ناحيةِ بَدرٍ، وفاتَه كُرزٌ ولم يَلحَقْه، فرَجَع إلى المَدينةِ."], "url": "https://dorar.net/history/event/50", "route": null, "stations": null, "title_en": "The First Battle of Badr (The Valley of Safwaan)", "date_en": "Rabi al-Awwal 2 AH (623 CE)", "place_en": "Badr", "summary_en": "The Prophet ﷺ pursued Kurz ibn Jabir al-Fihri, who had raided the pastures of Madinah, as far as the valley of Safawan near Badr, but he escaped.", "people": ["ali", "zayd"], "dorar": 50, "asbab": [], "body_en": ["The Prophet ﷺ participated in the first Battle of Badr until he ﷺ reached the valley of Safwaan. After thirteen months after his immigration, he ﷺ went [on a campaign] to [capture] Kurz ibn Jaabir al-Fihree. The banner of the mission was white in colour, and the bearer of it was Alee ibn Abee Taalib (may Allah be pleased with him). The Prophet ﷺ appointed Zayd ibn Haarithah in charge of al-Madeenah. The reason the Prophet ﷺ went out after Kurz is that he led an assault on a suburb of al-Madeenah and stole the camels and cattle that were grazing in the land during the morning time.", "Upon this, the Messenger of Allah ﷺ dispatched a mission to capture him and they went in his pursuit until they reached a valley called Safwaan, near Badr area. However, he ﷺ could not catch him, so he ﷺ returned to al-Madeenah."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 39, "stage": 5, "title": "غَزوةُ بُواطٍ بِقُربِ يَنْبُعَ", "date": "ربيع الآخر 2 هـ، الموافق 623م", "place": "بواط", "lat": 24.27, "lng": 38.75, "approx": true, "zoom": 8, "paras": ["عن جابرٍ رضي الله عنه قال: سِرْنا مع رسولِ الله صلى الله عليه وسلم في غَزوةِ بَطْنِ بُواطٍ، وهو يَطلُبُ المَجْدِيَّ بنَ عَمرٍو الجُهَنيَّ، وكان النَّاضِحُ يَعْتَقِبُهُ مِنَّا الخمسةُ والسِّتَّةُ والسَّبعةُ، فَدارتْ عُقْبَةُ رجلٍ مِنَ الأنصارِ على ناضِحٍ له، فأناخَهُ فركِبَهُ، ثمَّ بَعثَهُ فتَلَدَّنَ عليه بَعضَ التَّلَدُّنِ، فقال له: شَأْ، لَعنَك الله.", "فقال رسولُ الله صلى الله عليه وسلم: «مَن هذا اللَّاعِنُ بَعيرَهُ؟». قال: أنا، يا رسولَ الله. قال: «انْزِلْ عنه، فلا تَصْحَبْنا بِمَلعونٍ، لا تَدعوا على أَنفُسِكُم، ولا تَدعوا على أَولادِكُم، ولا تَدعوا على أَموالِكُم، لا تُوافِقوا مِنَ الله ساعةً يُسأَلُ فيها عَطاءٌ، فَيسْتَجيبُ لكم» . وبُواطٌ: جبلٌ مِن جبالِ جُهَينةَ، بِقُربِ يَنْبُعَ."], "url": "https://dorar.net/history/event/51", "route": null, "stations": null, "title_en": "The Battle of Buwaat", "date_en": "Rabi al-Akhir 2 AH (623 CE)", "place_en": "Buwat", "summary_en": "The Prophet ﷺ led a campaign to Buwat to intercept a Quraysh caravan, but did not meet it.", "people": [], "dorar": 51, "asbab": [], "body_en": ["It is reported on the authority of Jaabir (may Allah be pleased with him) that he said: “We set out along with Allah's Messenger (may peace be upon him) on an expedition of Batn Buwaat. He ﷺ was in search of al-Majdee ibn 'Amr al-Juhanee. We had so meagre equipment that five, six, or seven of us had one camel to ride, and so we mounted it turn by turn. Once there, the turn of an Ansari came to ride upon the camel. He made it kneel down to ride over it (and after having mounted it), he tried to raise it up, but it hesitated. So, he said. May there be curse of Allah upon you! Thereupon Allah's Messenger ﷺ said: Who is there to curse his camel? He said: O Allah's Messenger! it is I. Thereupon he ﷺ said: Get down from the camel and let us not have in our company the cursed one. Don't curse your own selves, nor your children, nor your belongings. There is the possibility that your curse may coincide with the time when Allah is about to confer upon you what you demand and thus your prayer may be readily responded.” Buwaat is one of the mountains of Juhaynah, near Yanbu’."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 40, "stage": 5, "title": "غَزوةُ العُشَيْرَةِ (الْعُسَيْرَةِ)", "date": "جمادى الأول 2 هـ، الموافق 623م", "place": "العشيرة", "lat": 24.1, "lng": 38.4, "approx": true, "zoom": 8, "paras": ["قِيلَ لِزيدِ بنِ أَرقمَ: \" كم غَزا النَّبيُّ صلى الله عليه وسلم مِن غَزوةٍ؟ قال: تِسعَ عشرةَ. قِيلَ: كم غَزوتَ أنت معه؟ قال: سبعَ عشرةَ. قِيلَ: فأَيُّهم كانت أوَّلَ؟ قال: الْعُسَيْرَةُ، أَوِ الْعُشَيْرُ. وقعت غَزوةُ العُشَيْرَةِ قبلَ وَقعةِ بدرٍ، سَلَكَ النَّبيُّ صلَّى الله عليه وسلَّم على نَقْبِ بني دِينارٍ، ثمَّ على فَيْفاءِ الخَبارِ فنزل تحت شجرةٍ ببَطْحاءَ ابنِ أَزهرَ يُقالُ لها: ذاتُ السَّاقِ. فصَلَّى عندها... وصُنِعَ له عندها طعامٌ فأكل منه وأكل النَّاسُ معه... واسْتُقِيَ له مِن ماءٍ به يُقالُ له: المُشْتَرِبُ، ثمَّ ارْتَحل رسولُ الله صلى الله عليه وسلم فترك الخلائقَ بيَسارهِ وسلك شُعبةً يُقالُ لها: شُعبةُ عبدِ الله... ثمَّ صَبَّ لليَسارِ حتَّى هبَط يَلْيَلَ فنزل بِمُجتَمعِه ومُجتمعِ الضَّبُوعَةِ، واسْتَقى مِن بئرٍ بالضَّبُوعَةِ، ثمَّ سلك الفَرْشَ فَرْشَ مَلَلٍ حتَّى لَقِيَ الطَّريقَ بصحيرات بِصُخَيْراتِ اليَمامِ، ثمَّ اعتدل به الطَّريقُ حتَّى نزل العُشَيْرَةَ مِن بطنِ يَنْبُعَ فأقام بها جُمادى الأُولى ولياليَ مِن جُمادى الآخرةِ، وادَع فيها بني مُدْلِجٍ وحُلفاءَهُم مِن بني ضَمْرَةَ ثمَّ رجع إلى المدينةِ ولمْ يَلْقَ كَيْدًا."], "url": "https://dorar.net/history/event/52", "route": null, "stations": null, "title_en": "The Battle of al-Ushayrah (al-Usayrah)", "date_en": "Jumada al-Ula 2 AH (623 CE)", "place_en": "Al-Ushayrah", "summary_en": "The Prophet ﷺ marched to al-Ushayrah to intercept a Quraysh caravan heading to Syria. It had passed, and he made treaties with local tribes.", "people": [], "dorar": 52, "asbab": [], "body_en": ["Zayd ibn Arqam was asked: How many battles did the Prophet ﷺ attend by himself? He said: nineteen battles. Then, he was asked: How many of which did you attend with him? He replied: seventeen. Someone asked: Which battle was the first? He said: Al-Usayrah or Al-Ushayr. The battle of al-Ushayr took place before the Battle of Badr. The Prophet ﷺ went through the route of Banee Dinaar, then passed through Fayfaa’ al-Khabaar. During the trip, he ﷺ stopped and rested under a tree at the valley of Ibn Azhir, known as dhaat al-Saaq, where he offered prayer...", "Food was prepared for him, and he ﷺ ate accompanied by those who were with him. Then, they brought him water from the water of a place called Al-Mushtarib. Then he ﷺ departed Al-Khala’iq leftward in the direction of a glen called path that is called the Shu’bah of Abdullah; then he ﷺ headed to the left again until he went down Yalyal and stopped at a crossing with Adaboo'ah, and he ﷺ drank from a well at Ad-Daboo'ah, traversing the plain of Mulal until he ﷺ met the track in Suhayraat al-Yamaam straight to Al-'Ushayrah in the valley of Yanbu’ where he ﷺ stayed throughout the month of Jumaadah al-Oolah and some days of the following month.", "He ﷺ made a pact of peace there with Banee Mudlij and their allies Banee Damrah and returned to al-Madeenah without an outbreak of fighting between them and the Muslims."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 41, "stage": 5, "title": "سرية سعد بن أبي وقاص رضي الله عنه إلى رابغ", "date": "رجب 2 هـ، الموافق 624م", "place": "رابغ", "lat": 22.79, "lng": 39.03, "approx": true, "zoom": 8, "paras": ["أخرَجَ ابنُ عَساكِرَ عن الزُّهريِّ قال: \"بَعَثَ رَسولُ الله صلَّى اللهُ عليه وسلَّم سَريَّةً فيها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدُ بنُ أبي وقَّاصٍ</span> رَضي اللهُ عنه إلى جانِبٍ مِن الحِجازِ يُدعَى (رابِغ)، فانكَفَأ المُشرِكون على المسلمين، فجاءَهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدُ بن أبي وقَّاصٍ</span> رَضي اللهُ عنه يومَئذٍ بسِهامِهِ، وكان أوَّلَ مَن رَمَى في سبيلِ الله، وكان هذا أوَّلَ قِتالٍ في الإسلامِ\"."], "url": "https://dorar.net/history/event/53", "route": null, "stations": null, "title_en": "The Expedition of Sa’d in Abee Waqqaas (May Allah Be Pleased with Him)", "date_en": "Rajab 2 AH (624 CE)", "place_en": "Rabigh", "summary_en": "A small party that included Sa'd ibn Abi Waqqas was sent toward Rabigh, where it encountered the polytheists.", "people": ["saad"], "dorar": 53, "asbab": [], "body_en": ["Ibn ‘Asaakir reported on the authority of al-Zuhree: “The Messenger of Allah ﷺ dispatched an expedition in which was Sa’d ibn Abee Waqqaas (may Allah be pleased with him) to an area in al-Hijaaz, called Raabigh. [When the expedition encountered the disbelievers], Sa’d ibn Abee Waqqaas threw his arrows at them, and he was the first Muslim to shoot an arrow [at disbelievers] in the path of Allah. It was the first combat against the disbelievers in Islam."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 42, "stage": 5, "title": "سرية عبد الله بن جحش الأسدي إلى نخلة", "date": "رجب 2 هـ، الموافق 624م", "place": "نخلة", "lat": 21.53, "lng": 40.08, "approx": false, "zoom": 8, "paras": ["بَعثَ رسولُ الله صلَّى اللهُ عليه وسلَّم رسولَه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdjahsh\">عبدَ الله بنَ جَحشٍ</span> الأسَديَّ إلى نَخلةَ في رَجبٍ على رأسِ سَبعةَ عَشَرَ شَهرًا من الهِجرةِ في اثنَيْ عَشَرَ رَجلًا من المُهاجِرين، كلُّ اثنَينِ يَعتَقِبان على بَعيرٍ، فوَصَلوا إلى بَطنِ نَخلةَ يَرصُدون عيرًا لقُريشٍ، وفي هذه السَّريَّةِ سُمِّيَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdjahsh\">عبدُ الله بنُ جَحشٍ</span> أميرَ المؤمنين، وكان رسولُ الله كَتَب له كِتابًا، وأمرَه ألَّا يَنظُرَ فيه حتى يَسيرَ يَومَين ثم يَنظُرَ فيه، ولمَّا فَتَح الكِتابَ وَجَد فيه: \"إذا نَظَرْتَ في كِتابي هذا، فامْضِ حتى تَنزِلَ نَخلةَ بينَ مكَّةَ والطَّائِفِ فتَرصُدَ بها قُريشًا، وتَعلَمَ لنا من أخبارِهِم\"، فقال: سَمعًا وطاعةً، وأخبَرَ أصحابَه بذلك، وبأنَّه لا يَستَكرِهُهم، فمَن أحبَّ الشَّهادةَ فليَنهَض، ومَن كَرِهَ الموتَ فليَرجِع، وأمَّا أنا فناهِضٌ.", "فمَضَوا كلُّهم. فلمَّا كان في أثناء الطَّريقِ أضلَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saad\">سعدُ بن أبي وقَّاصٍ</span> وعُتبةُ بن غَزوانَ بعيرًا لهما كانا يَعتَقِبانِه، فتَخَلَّفا في طَلَبِه، وبَعُدَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdjahsh\">عبدُ الله بنُ جَحشٍ</span> حتَّى نزل بنخلةَ، فمَرَّت به عيرٌ لقُرَيشٍ تَحمِلُ زَبيبًا وأُدمًا وتجارةً فيها عَمرُو بنُ الحَضرَميِّ، وعُثمانُ ونَوفَلُ بنُ عبدِ الله بن المُغيرةَ، والحَكَمُ بنُ كَيسانَ مَولَى بني المُغيرةِ فتَشاوَرَ المسلمون، وقالوا: نحنُ في آخِرِ يَومٍ من رَجَبٍ الشَّهرِ الحَرامِ، فإنْ قاتلناهم، انتَهَكْنا الشَّهرَ الحرامَ، وإن تَرَكناهمُ اللَّيلةَ دَخَلوا الحرمَ، ثمَّ أجمَعوا على مُلاقاتِهم فرَمَى أحدُهم عمرَو بنَ الحَضرَميِّ فقَتَلَه، وأسَروا عُثمانَ والحَكَمَ، وأفلتَ نَوفَلٌ، ثم قَدِموا بالعيرِ والأسيرَينِ، وقد عَزَلوا من ذلك الخُمُسَ، وهو أوَّلُ خُمُسٍ كان في الإسلامِ، وأوَّلُ قتيلٍ في الإسلامِ وأوَّلُ أسيرَينِ في الإسلامِ، وأنكرَ رسولُ الله صلَّى اللهُ عليه وسلَّم عليهم ما فعلوه، واشتَدَّ تَعنُّتُ قُريشٍ وإنكارُهم ذلك، وزَعَموا أنَّهم قد وَجَدوا مَقالًا، فقَالوا: قد أحلَّ مُحمَّدٌ الشَّهرَ الحرامَ، واشتدَّ على المسلمين ذلك، حتى أنزلَ اللهُ تعالى: <span class=\"verse\">﴿يَسْألُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فيهِ قُلْ قِتَالٌ فيهِ كَبيرٌ وَصَدٌّ عَنْ سَبيلِ اللَّهِ وَكُفْرٌ بِهِ وَالْمَسْجِدِ الْحَرَامِ وَإخْرَاجُ أهْلِهِ مِنْهُ أكْبَرُ عِنْدَ اللَّهِ وَالْفِتْنةُ أكْبَرُ مِنَ الْقَتْلِ﴾</span> <span class=\"ref\">[البقرة: ٢١٧]</span>."], "url": "https://dorar.net/history/event/54", "route": null, "stations": null, "title_en": "Sending Out the Expedition of ‘Adullah ibn Jahsh al-Asadee to Nakhlah", "date_en": "Rajab 2 AH (624 CE)", "place_en": "Nakhlah", "summary_en": "Abdullah ibn Jahsh led twelve Muhajirun to Nakhlah to gather news of Quraysh. They attacked a caravan at the end of the sacred month of Rajab, and verses of the Quran addressed the matter.", "people": ["abdjahsh", "saad"], "dorar": 54, "asbab": [{"id": "TAF-01", "k": "d"}], "body_en": ["The Messenger of Allah ﷺ dispatched his messenger, ‘Abdullah ibn Jahsh, on the Nakhla Raid in Rajab, after seventeen months of his emigration to al-Madeenah, together with twelve other Emigrants and six camels; every person would alternate riding a camel with his fellow Emigrant. They arrived at the valley of Nakhlah where they were expecting to raid some camels that belonged to Quraysh. He ﷺ gave ‘Abdullah a letter with instructions not to read it until he had travelled for two days, and in this expedition, ‘Abdullah was named the Chief of Believers.", "After Abd-Allah had proceeded for two days, he duly opened the letter wherein it read: “Once you read this letter, proceed until you reach Nakhlah, between Makkah and al-Taa'if, lie in wait for the Quraysh and observe what they are doing.” Upon reading the letter, he said, “I hear and obey!” Then, he informed his companions about the instructions of the Prophet ﷺ and said to them: “I do not force any of you to join me. If you love to be a martyr, get up and join me, and if you dislike death, then return. As for me, I am proceeding.”", "Upon this, all of them got up and joined him. While they were on their way, the camel that Sa’d ibn Abee Waqqaas and ‘Utbah ibn Ghazwaan used to alternate in riding got lost, so they left the expedition searching for it. At that time, ‘Abdullah ibn Jahsh arrived at Nakhlah, and while they were there, the caravan of Quraysh passed through Nakhlah, which carried dyed skins, raisins, and other merchandise, and among them were ‘Amr ibn al-Hadramee, ‘Uthmaan and Nawfal ibn ‘Abdullah ibn al-Mugheerah, and al-Hakam ibn Kaysaan, the freed slave of Banee al-Mugheerah.", "The Muslims discussed whether they should attack them or not saying, we are in the last day of the Sacred month of Rajab; if we attack them, we will dishonour the sacred month, and if we let them go tonight, they will be in the Sacred [Mosque]. So, they agreed to attack the merchants even though it was still the sacred month of Rajab when fighting was forbidden. One of the Muslims shot an arrow at ‘Amr ibn al-Hadarmee and killed him, and they succeeded in capturing ‘Uthman and al-Hakam, along with all the merchandise.", "As for Nawfal, he managed to escape. They returned to al-Madeenah with the seized merchandise, after taking out the fifth of it, and the two prisoners. This combat marked the first fifth, the first disbeliever to be killed, and the first two prisoners in Islam. The Prophet ﷺ disapproved their actions, but Quraysh found in it an opportunity to insist on their disbelief and claim that [Prophet] Muhammad ﷺ made fighting in the Sacred month lawful. The Muslims found the situation so difficult, until Allah, Most High, revealed: {They ask you concerning fighting in the sacred months.", "Say, \"Fighting therein is a great (transgression) but a greater (transgression) with Allah is to prevent mankind from following the way of Allah, to disbelieve in Him, to prevent access to Al-Masjid-Al-Ḥaraam, and to drive out its inhabitants, and Al-Fitnah is worse than killing.} [Quran 2:217]"], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 43, "stage": 5, "title": "تَحويلُ القِبلَةِ إلى الكعبة", "date": "شعبان 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["عنِ البَراءِ بنِ عازبٍ رضِي الله عنهما قال: \"لمَّا قَدِمَ رسولُ الله صلى الله عليه وسلم المدينةَ صلَّى نحوَ بيتِ المَقدسِ سِتَّةَ عشرَ أو سَبعةَ عشرَ شهرًا، وكان يُحِبُّ أن يُوَجَّهَ إلى الكعبةِ، فأنزل الله تعالى: <span class=\"verse\">﴿قَدْ نَرَى تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَاهَا﴾</span> <span class=\"ref\">[البقرة: ١٤٤]</span>، فَوُجِّهَ نحوَ الكعبةِ، وصلَّى معه رجلٌ العصرَ، ثمَّ خرج فمَرَّ على قومٍ مِنَ الأنصارِ فقال: هو يَشْهَدُ أنَّه صلَّى مع النَّبيِّ صلى الله عليه وسلم، وأنَّه قد وُجِّهَ إلى الكعبةِ، فانحرفوا وهُم ركوعٌ في صلاةِ العصرِ."], "url": "https://dorar.net/history/event/55", "route": null, "stations": null, "title_en": "Changing the Direction of Qiblah", "date_en": "Shaban 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "After praying toward Jerusalem for sixteen or seventeen months in Madinah, the Muslims were commanded to face the Kaaba in Makkah.", "people": [], "dorar": 55, "asbab": [{"id": "ASB-022", "k": "d"}], "body_en": ["Narrated Al-Baraa' ibn ‘Aazib (may Allah be pleased with him and his father): When Allah's Messenger ﷺ arrived at al-Madeenah, he ﷺ prayed facing Jerusalem for sixteen or seventeen months, but he ﷺ wished that he ﷺ would be ordered to face the Ka`ba. So, Allah revealed: -- {'Verily! We have seen the turning of your face towards the heaven; surely, we shall turn you to a prayer direction (Qibla) that shall please you.} (Quran 2.144) Thus, he was directed towards the Ka`ba. A man prayed the `Asr prayer with the Prophet ﷺ and then went out, and passing by some people from the Ansar, he said, \"I testify that I have prayed with the Prophet ﷺ and he (the Prophet) has prayed facing the Ka`ba.\" Thereupon they, who were bowing in the `Asr prayer, turned towards the Ka`ba."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 44, "stage": 5, "title": "نزول فَرْضِيَّة صِيامِ شَهرِ رَمضانَ", "date": "شعبان 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["في هذه السَّنَةِ فُرِضَ صِيامُ شهرِ رمضانَ، وقِيلَ: إنَّ فَريضةَ صِيامِ شهرِ رمضانَ كانت قبلَ غَزوةِ بدرٍ."], "url": "https://dorar.net/history/event/56", "route": null, "stations": null, "title_en": "Enacting the Fasting of the Month of Ramadan", "date_en": "Shaban 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "In the second year after the Hijrah, fasting the month of Ramadan was made obligatory.", "people": [], "dorar": 56, "asbab": [{"id": "ASB-023", "k": "d"}, {"id": "ASB-024", "k": "d"}], "body_en": ["In this year, fasting the month of Ramadan was made obligatory upon the Muslims. It has been said: It was made obligatory before the Battle of Badr."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 45, "stage": 5, "title": "نزول فَرْضية زكاةِ الفِطرِ", "date": "رمضان 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["شرع الله سُبحانه وتعالى زكاةَ الفِطرِ, وهي واجبةٌ على كُلِّ مُسلمٍ حُرٍّ أو عبدٍ، ذَكَرٍ أو أُنثى، صغيرٍ أو كبيرٍ مِنَ المسلمين قادرٍ عليها. والحِكمةُ منها تَطهيرُ الصَّائمِ ممَّا عسى أن يكونَ قد وقع فيه أثناءَ الصِّيامِ مِن لَغْوٍ أو رَفَثٍ، وإعانةٌ للفقراءِ على إدخالِ السُّرورِ عليهم في يومِ العيدِ."], "url": "https://dorar.net/history/event/57", "route": null, "stations": null, "title_en": "Enacting the Zakat of Fitr", "date_en": "Ramadan 2 AH (624 CE)", "place_en": "Madinah", "summary_en": "Zakat al-Fitr, a charity due from every Muslim able to give it, was prescribed at the end of Ramadan to purify the fasting person and feed the poor.", "people": [], "dorar": 57, "asbab": [], "body_en": ["Allah has legislated the zakat al-Fitr, which is obligatory upon all Muslims, be they were free or slaves, males or females, adult or young, so long as they can afford it. The wisdom behind it is that it purifies the fasting person from any obscenity or ill-speech that he may have said or did while fasting, and to help the poor and make them happy on the Day of Eid."], "src_en": "https://dorar.net/en/history?page=4"}, {"seq": 46, "stage": 5, "title": "سرية عمير بن عدي رضي الله عنه لقتل عصماء بنت مروان", "date": "رمضان 2 هـ، الموافق 624م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["كانت عَصماءُ بِنتُ مَرْوانَ مِن بني أُمَيَّةَ بنِ زَيدٍ، زَوجةُ يَزيدَ بنِ زَيدِ بنِ حِصنٍ الخَطْميِّ، تَعيبُ الإسلامَ وتُؤذي رسولَ اللَّه صلَّى اللهُ عليه وسلَّم، وتُحرِّضُ عليه. وكانت تَطرَحُ المَحايِضَ في مسجِدِ بني خَطْمةَ؛ فأهدَرَ رسولُ اللَّه صلَّى اللهُ عليه وسلَّم دَمَها، فنَذَر عُمَيرُ بنُ عَديٍّ لئن رَجَعَ رسولُ اللَّه صلَّى اللهُ عليه وسلَّم من بَدرٍ إلى المدينة ليَقتُلَنَّها، وقد فعل رضي الله عنه وأرضاه.", "فلمَّا رَجَع عُميرٌ وَجَد بَنيها في جماعةٍ يَدفِنونَها. فقالوا: يا عُمَيرُ، أنتَ قَتَلْتَها؟ قال: \"نَعَم، فكيدوني جَميعًا ثم لا
