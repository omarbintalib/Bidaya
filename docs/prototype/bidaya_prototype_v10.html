مالًا وأمانةً، وهو زوجُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zaynab\">زَينبَ بنتِ رسولِ الله</span> صلَّى اللهُ عليه وسلَّم، وأمُّه هالةُ بِنتُ خويلدٍ أُختِ خَديجةَ رَضي اللهُ عنها. فأتى أبو العاصِ زينبَ رَضي اللهُ عنها في اللَّيلِ، وكانت زينبُ هاجَرَت قَبلَه وتَرَكَته على شِركِه فاستَجارَ بها فأجارَته، وأجازَ رسولُ الله صلَّى اللهُ عليه وسلَّم جِوارَها."], "url": "https://dorar.net/history/event/95", "route": null, "stations": null, "title_en": "The Brigade of Zayd ibn Haarithah to al-‘Ees (Now Known as al Ais/ al ‘Ays)", "date_en": "Jumada al-Ula 6 AH (627 CE)", "place_en": "Red Sea coast", "summary_en": "Zayd ibn Harithah led 170 riders to al-Is to intercept a Quraysh caravan from Syria. They captured it, along with Abu al-As, husband of the Prophet's ﷺ daughter Zaynab, who then gave him protection.", "people": ["zayd", "zaynab"], "dorar": 95, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent Zayd ibn Haarithah (may Allah be pleased with him) in a brigade comprising of one hundred and seventy riders to al-‘Ees – name of a place closer to Al-Madeenah at the coastline of the sea (Red Sea)- with the objective to intercept a caravan belonging to Quraysh that came from the levant under the leadership of Aboo al-‘Aaas ibn al-Rabee’. They managed to catch up with it and they seized all of it. On that day, they confiscated a sizeable amount of silver belonging to Safwaan ibn Umayyah, and they imprisoned several people who were in the caravan, among whom was Aboo al-’Aas ibn al-Rabee’, and they brought them to al-Madeenah.", "Aboo al-’Aas was among a handful of men known for trade, wealth, and trustworthiness in Makkah, and was the husband of Zaynab, the daughter of the Messenger of Allah ﷺ . His mother is Haalah bint Khuwaylid, the sister of Khadeejah (may Allah be pleased with her). Aboo al-’Aas came to Zaynab (may Allah be pleased with her) at night asking for her refuge and protection, which she granted to him. The Messenger of Allah ﷺ permitted her protection. At that time, Zaynab had already migrated from Makkah to al-Madeenah before him and had left him on his polytheism."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 80, "stage": 8, "title": "سرية زيد بن حارثة إلى بني ثعلبة بالطَّرف (ماء قرب المدينة)", "date": "جمادى الآخر 6 هـ، الموافق 627م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["بَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارِثةَ</span> رَضي اللهُ عنه إلى الطَّرَفِ -هو ماءٌ على ستَّةٍ وثلاثين ميلًا من المدينةِ-، فخَرَج إلى بني ثَعلبةَ في خَمسةَ عَشَرَ رَجُلًا، فهَرَبتِ الأعرابُ وخافوا أن يكونَ رسولُ الله صلَّى اللهُ عليه وسلَّم سار إليهم، وأنَّ هؤلاءِ مُقدِّمةٌ؛ فأصابَ مِن نَعَمِهم عِشرين بَعيرًا، ورَجَع إلى المدينةِ، ولم يَلْقَ كيدًا، وغابَ أربَعَ لَيالٍ. وكان شِعارُهم: \"أمِتْ أمِتْ\"."], "url": "https://dorar.net/history/event/96", "route": null, "stations": null, "title_en": "The Brigade of Zayd ibn Haarithah to Banoo Tha’labah at al-Taraf", "date_en": "Jumada al-Akhirah 6 AH (627 CE)", "place_en": "Madinah", "summary_en": "Zayd ibn Harithah led fifteen men to al-Taraf against Banu Tha'labah, who fled.", "people": ["zayd"], "dorar": 96, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent Zayd ibn Haarithah (may Allah be pleased with him) to al-Taraf - which is a water source over thirty-six miles from al-Madeenah. His brigade was made up of fifteen fighters that marched to Banoo Tha'labah. The Arab nomads fled in panic and feared that the Messenger of Allah ﷺ will go after them and that this bigrade was the frontline division of a battalion. The bigrade captured twenty camels of their livestock, and then returned to al-Madeenah, without encountering any fighting. The bigrade remained away for four nights, and their motto was: \"Put to death. Put to death\""], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 81, "stage": 8, "title": "سرية عبد الرحمن بن عوف رضي الله عنه إلى دومة الجندل", "date": "شعبان 6 هـ، الموافق 628م", "place": "دومة الجندل", "lat": 29.81, "lng": 39.868, "approx": false, "zoom": 8, "paras": ["دعا رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdrahman\">عبدَ الرَّحمنِ بنَ عوفٍ</span> رَضي اللهُ عنه، فقال له: \"تَجهَّزْ؛ فإنِّي باعِثُك في سَريَّةٍ مِن يَومِك هذا، أو مِن الغَدِ إن شاءَ اللهُ تعالى\"، فأصبَحَ عبدُ الرَّحمنِ فغَدا إلى رسولِ الله صلَّى اللهُ عليه وسلَّم، فأقعَدَه بين يَدَيه وعمَّمَه بيَدِهِ، ثمَّ عَقَد له رسولُ الله صلَّى اللهُ عليه وسلَّم اللواءَ بيَدِه، أو أمرَ بلالًا يَدفَعُه إليه، ثم قال له: \"خُذه باسمِ اللهِ وبَرَكَتِه\"، ثم حَمِد الله تعالى، ثم قال صلَّى اللهُ عليه وسلَّم: \"اغزُ باسمِ الله، وفي سَبيلِ الله، فقاتِل مَن كَفَر بالله! ولا تَغُلَّ -الغُلولُ: هو الخيانةُ في المَغنَمِ والسَّرِقةُ من الغَنيمةِ قَبْلَ القِسمةِ-، ولا تَغدِرْ، ولا تَقتُلْ وَليدًا\"، ثم أمَرَه رسولُ الله أن يَسيرَ إلى بني كَلْبٍ بدُومةِ الجَندَلِ، فيَدعوَهم إلى الإسلامِ، وقال له: \"إنِ استَجابوا لَكَ فتَزَوَّجِ ابنةَ مَلِكِهِم\".", "فسار عبدُ الرَّحمنِ رَضي اللهُ عنه بأصحابِه وكانوا سَبعَمِئةِ رَجلٍ، حتى قَدِمَ دُومةَ الجَندَلِ؛ فمَكَث ثلاثةَ أيَّامٍ يَدعوهم إلى الإسلامِ؛ فلمَّا كان اليومُ الثالِثُ أسلَمَ رأسُهم ومَلِكُهمُ الأصبَغُ بنُ عَمرٍو الكَلبيُّ، وكان نَصرانيًّا، وأسلَمَ معه ناسٌ كَثيرٌ من قَومِه؛ فبَعَث عبدُ الرحمنِ رافِعَ بنَ مَكيثٍ بَشيرًا إلى النبيِّ صلَّى اللهُ عليه وسلَّم يُخبِرُه بما فَتَح الله عليه وكَتَب له بذلك، وتزوَّجَ عبدُ الرحمنِ تُماضِرَ بِنتَ الأصبَغِ وقَدِمَ بها المدينةَ، فوَلَدَت له بعد ذلك <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusalama\">أبا سَلَمةَ</span> بنَ عبدِ الرَّحمنِ بنَ عَوفٍ."], "url": "https://dorar.net/history/event/97", "route": null, "stations": null, "title_en": "The Brigade of Abdur Rahmaan ibn ‘Awf to Doomat al-Jandal", "date_en": "Shaban 6 AH (628 CE)", "place_en": "Dumat al-Jandal", "summary_en": "Abd al-Rahman ibn Awf was sent to Dumat al-Jandal to call its people to Islam.", "people": ["abdrahman", "abusalama"], "dorar": 97, "asbab": [], "body_en": ["The Messenger of Allah ﷺ summoned Abdur Rahmaan ibn ‘Awf (may Allah be pleased with him) and told him, “Prepare, as I will send you in a brigade today or tomorrow, by Allah’s will.” In the early morning, Abdur Rahman proceeded to the Messenger of Allah ﷺ and the Messenger of Allah ﷺ made him sit in front him and placed the turban on his head with his hand. Then, the Messenger of Allah ﷺ handed the banner to him with his hand, or ordered Bilaal to hand him over the banner, then said to him: “Take it by the Name of Allah and His blessing.”", "Then he ﷺ praised Allah, and thereafter, he ﷺ said, “Invade by the Name of Allah, and in the path of Allah, and fight those who disbelieved in Allah! Do not defraud the spoils - it is the betrayal of the spoils and the theft of the war spoils before the division - and do not be treacherous, and do not kill a young child.” Then the Messenger of Allah ﷺ ordered him to go to Banoo Kalb at Doomat al-Jandal and invite them to Islam. He ﷺ then said to him, “If they accept Islam, then marry the daughter of their king.” Abdur Rahman (may Allah be pleased with him) travelled with seven hundred fighters, until he came to Doomat al-Jandal.", "He stayed there for three days inviting them to Islam. On the third day, their head and their king, al-Asbagh ibn Amr Al-Kalbee, who was a Christian, embraced Islam, and many of his people embraced Islam with him. Abdur Rahman sent Raafi’ ibn Makeeth to convey the good news to the Prophet ﷺ. Abdur Rahmaan married the daughter of al-Asbagh and brought her to al-Madeenah, after which she bore him Aboo Salamah ibn Abdur Rahman ibn ‘Awf."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 82, "stage": 8, "title": "سرية أبي بكر الصديق رضي الله عنه إلى بني فزارة بوادي القرى", "date": "رمضان 6 هـ، الموافق 628م", "place": "وادي القرى", "lat": 26.48, "lng": 38.1, "approx": false, "zoom": 8, "paras": ["كان بَطنُ فَزارةَ يُريدُ اغتيالَ النبيِّ صلَّى اللهُ عليه وسلَّم؛ فبَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم سَريَّةً على رَأسِها: <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بَكرٍ</span> الصِّدِّيقُ رَضي اللهُ عنه فأغار عليهم، وقَتَل وأسَر وسَبَى، وكان مِن شَياطينِهم أُمُّ قِرْفةَ التي جهَّزَت ثلاثين فارِسًا من أهلِ بَيتِها لاغتيالِ رسولِ الله صلَّى اللهُ عليه وسلَّم، فقُتِلوا وسُبيَتِ ابنَتُها، ففَدَى بها رسولُ الله صلَّى اللهُ عليه وسلَّم بعضَ أُسارَى المسلمين في مكةَ.", "أخرج الإمامُ مسلمٌ في «صَحيحِه» عن سَلَمةَ بنِ الأكوَعِ رَضي اللهُ عنه قال: غَزَونا فَزارةَ، وعلينا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بَكرٍ</span>؛ أمَّرَه رسول الله صلَّى اللهُ عليه وسلَّم علينا؛ فلمَّا كان بيننا وبين الماءِ ساعةٌ أمَرَنا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بَكرٍ</span> فعَرَّسنا ثم شنَّ الغارةَ، فوَرَدَ الماء، فقَتَل مَن قَتَل عليه، وسَبَى، وأنظُرُ إلى عُنُقٍ من النَّاسِ، فيهِمُ الذَّراري فخَشيتُ أن يَسبِقوني إلى الجبلِ، فرَمَيتُ بسهمٍ بينهم وبين الجبلِ.", "فلمَّا رَأوُا السَّهمَ وَقَفوا، فجِئتُ بهم أسوقُهم. وفيهمُ امرَأةٌ من بني فَزارةَ عليها قَشْعٌ من أدَمٍ -أي: ثَوبٌ من الجِلدِ-، معها ابنةٌ من أحسَنِ العَرَبِ، فسُقتُهم حتى أتيتُ بهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبا بَكرٍ</span>، فنَفَلَني <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> ابنَتَها. فقَدِمنا المدينةَ، وما كَشَفتُ لها ثَوبًا، فلَقيَني رسولُ الله صلَّى اللهُ عليه وسلَّم في السُّوقِ، فقال: \"يا سَلَمةُ، هَبْ لي المَرأةَ\".", "فقلتُ: \"يا رسولَ الله، والله لقد أعجَبَتني، وما كَشَفتُ لها ثَوبًا\"، ثم لَقيَني رسولُ الله صلَّى اللهُ عليه وسلَّم من الغَدِ في السُّوقِ، فقال لي: \"يا سَلَمةُ، هَبْ لي المَرأةَ للهِ أبوكَ!\" فقلتُ: هي لك يا رسولَ الله، فوالله ما كَشَفتُ لها ثَوبًا. فبَعَث بها رسولُ الله صلَّى اللهُ عليه وسلَّم إلى أهلِ مكةَ، ففَدَى بها ناسًا من المسلمين، كانوا أُسِروا بمكةَ."], "url": "https://dorar.net/history/event/98", "route": null, "stations": null, "title_en": "The Brigade of Aboo Bakr As-Siddeeq (May Allah Be Pleased with Him) to Banoo Fazaarah at Wadee al-Qura", "date_en": "Ramadan 6 AH (628 CE)", "place_en": "Wadi al-Qura", "summary_en": "A branch of Banu Fazarah planned to assassinate the Prophet ﷺ, so an expedition led by Abu Bakr was sent against them.", "people": ["abubakr"], "dorar": 98, "asbab": [], "body_en": ["The sub-tribe of Fazaarah was plotting to assassinate the Prophet ﷺ. In response, the Messenger of Allah ﷺ sent a brigade headed by Aboo Bakr (may Allah be pleased with him). He attacked them, killed the enemy, imprisoned, and captured many of them. Among their vice people was Umm Qirfah, who had prepared thirty horsemen of her family in order to assassinate the Messenger of Allah ﷺ. However, all of them were killed, and her daughter was taken as prisoner. The Messenger of Allah ﷺ used her as a ransom to free some of the Muslim captives in Makkah.", "It is recorded in Saheeh Muslim on the authority of Salamah ibn al-Akwa’ (may Allah be pleased him), “We fought against the Fazaarah, and Aboo Bakr was the commander over us. He had been appointed by the Messenger of Allah ﷺ to command. When we were only at an hour's distance from the water source of the enemy, Aboo Bakr ordered us, so we halted during the last part of the night to rest. Afterwards, he launched an attack, and he reached the water source wherein he killed whom he managed to kill; and took some prisoners. I saw the necks of the people that consisted of women and children. I was afraid lest they should reach the mountain before me, so I shot an arrow between them and the mountain. When they saw the arrow, they stopped. So, I brought them down driving them along. Among them was a woman from Banoo Fazaarah. She was wearing a leather coat, meaning, a garment made of leader. With her was her daughter who was one of the prettiest girls of the Arabs.", "I drove them along until I brought them to Aboo Bakr who bestowed that girl upon me. Then, we arrived at al-Madeenah. I had not yet disrobed her when the Messenger of Allah ﷺ met me in the market and said, “Gift me that girl, O Salamah.” I said, “O Messenger of Allah, I am fascinated by her [looks]. I have not disrobed her yet.” On the next day, the Messenger of Allah ﷺ again met me in the market, and he said, “Gift me that girl, O Salamah, may Allah bless your father.” I replied, “She is for you, Messenger of Allah! By Allah. I have not yet disrobed her.” The Messenger of Allah ﷺ sent her to the people of Makkah and used her as a bargaining chip to free thereby a number of Muslims who were imprisoned in Makkah."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 83, "stage": 8, "title": "سرية كُرز بن جابر الفهري إلى العرنيين", "date": "شوال 6 هـ، الموافق 628م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["في هذا العام كانت سَريَّةُ كُرْزِ بنِ جابِرٍ الفِهريِّ إلى العُرَنيِّين، الذين قَتَلوا راعيَ رسولِ الله صلَّى اللهُ عليه وسلَّم، واستاقوا النَّعَمَ؛ فبَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم في آثارِهِم كُرْزَ بنَ جابِرٍ رَضي اللهُ عنه في عِشرين فارِسًا. عن أنس رَضي اللهُ عنه: أنَّ رهطًا من عُكلٍ وعُرَينةَ أتَوا رسولَ الله صلَّى اللهُ عليه وسلَّم فقالوا: إنَّا أُناسٌ من أهل ضَرعٍ، ولم نَكُن أهلَ ريفٍ، فاستَوخَمنا المَدينةَ -لم يُوافِقهم جَوُّها- فأمَر لهم رسولُ الله صلَّى اللهُ عليه وسلَّم بذَودٍ -إبلٍ- وراعٍ، وأمَرَهم أن يَخرُجوا فيها فيَشرَبوا من أبوالِها وألبانِها؛ فانطَلَقوا حتى إذا كانوا في ناحيةِ الحَرَّةِ قَتَلوا راعيَ رسولِ الله صلَّى اللهُ عليه وسلَّم واستاقوا الذَّودَ، وكَفَروا بعد إسلامِهِم؛ فبَعَث النبيُّ صلَّى اللهُ عليه وسلَّم في طَلَبِهم، فأمر فقَطَع أيديَهم وأرجُلَهم وسَمَرَ أعيُنَهم -كَحَلَها بمَساميرَ مَحميَّةٍ-، وتَرَكَهم في ناحيةِ الحَرَّةِ حتى ماتوا وهم كذلك. وإنَّما سَمَرَ أعينهم لأنهم سمروا أعين الرعاء."], "url": "https://dorar.net/history/event/99", "route": null, "stations": null, "title_en": "The Brigade of Kurz ibn Jaabir al-Fihree to the People ‘Uraynah", "date_en": "Shawwal 6 AH (628 CE)", "place_en": "Madinah", "summary_en": "Men from Urayna who killed the Prophet's ﷺ herdsman and drove off the camels were pursued by Kurz ibn Jabir and captured.", "people": [], "dorar": 99, "asbab": [], "body_en": ["In this year, the brigade of Kurz ibn Jaabir al-Fihree was sent to the tribe of ‘Uraynah, who had killed the shepherd of the Messenger of Allah ﷺ and drove away the livestock with them. In response, the Messenger of Allah ﷺ sent in their tracks Kurz ibn Jaabir (may Allah be pleased with him) with twenty horsemen. It is narrated on the authority of Anas (may Allah be pleased with him) that “Some people from the tribes of ‘Ukl and ‘Uraynah came to Allah's Messenger ﷺ and embraced Islam, and they said, \"O Allah's Messenger ﷺ! We are owners of livestock and have never been farmers and we find al-Madeenah unpleasant for us.” – its climate was unsuitable for them.", "Hence, Allah's Messenger ﷺ ordered that they be given some camels and a shepherd and ordered them to go out with those camels and drink their milk and urine. So, they set out; however, when they reached a place called Al-Harrah, they killed the shepherd and drove away the camels and they converted to disbelief after their conversion to Islam. The Prophet ﷺ sent in their pursuit. [After catching them] the Prophet ﷺ ordered to cut their hands and feet and branded their eyes with heated iron rods, and then they were left at Al-Harrah till they died in that state. He only branded their eyes with heated iron rods because they branded the eyes of the shepherds with heated iron rods."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 84, "stage": 8, "title": "بَيعةُ الرِّضْوانِ", "date": "ذي القعدة 6 هـ، الموافق 628م", "place": "الحديبية", "lat": 21.48, "lng": 39.64, "approx": false, "zoom": 8, "paras": ["كان رسولُ الله صلَّى الله عليه وسلَّم قبلَ عَقْدِ صُلحِ الحُديبيةِ بعَث خِراشَ بنَ أُميَّةَ الخُزاعيَّ إلى مكَّةَ، وحمَلهُ على جَملٍ له يُقالُ له: الثَّعلبُ. فلمَّا دخَل مكَّةَ عَقَرَتْ به قُريشٌ وأرادوا قَتْلَ خِراشٍ فمنَعهُم الأَحابيشُ (هم: بنو الحارث بن عبد مناة بن كنانة ، والهون بن خزيمة بن مدركة، وبنو المصطلق من خزاعة) حتَّى أتى رسولَ الله صلى الله عليه وسلم فدَعا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> لِيَبعثَهُ إلى مكَّةَ، فقال: يا رسولَ الله إنِّي أَخافُ قُريشًا على نَفْسي، وليس بها مِن بني عَدِيٍّ أحدٌ يَمنعُني، وقد عَرفتْ قُريشٌ عَداوتي إيَّاها وغِلْظَتي عليها؛ ولكنْ أَدلُّك على رجلٍ هو أَعزُّ مِنِّي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> بنِ عفَّانَ.", "فدَعاهُ رسولُ الله صلَّى الله عليه وسلَّم فبعَثهُ إلى قُريشٍ يُخبِرُهم أنَّه لم يأتِ لحربٍ، وأنَّه جاء زائرًا لهذا البيتِ مُعَظِّمًا لِحُرمَتِه، فخرج <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> حتَّى أتى مكَّةَ ولَقِيَهُ أَبانُ بنُ سَعيدِ بنِ العاصِ، فنزَل عن دَابَّتِه وحمَله بين يَديه ورَدِف خلفَه وأَجارهُ حتَّى بلَّغَ رِسالةَ رسولِ الله صلَّى الله عليه وسلَّم، فانطلق <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> حتَّى أتى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبا سُفيانَ</span> وعُظماءَ قُريشٍ فبَلَّغهُم عن رسولِ الله صلَّى الله عليه وسلَّم ما أَرسلهُ به، فقالوا لِ<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span>: إن شِئتَ أن تَطوفَ بالبيتِ فَطُفْ به.", "فقال: ما كنتُ لأفعلَ حتَّى يَطوفَ به رسولُ الله صلَّى الله عليه وسلَّم. فاحْتبسَتهُ قُريشٌ عندها، فبلَغ رسولَ الله صلَّى الله عليه وسلَّم والمسلمين أنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> قد قُتِلَ).قال ابنُ عُمَرَ رضِي الله عنهما:كانت بَيعةُ الرِّضوانِ بعدَ ما ذهَب <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانُ</span> إلى مكَّةَ، فقال رسولُ الله صلى الله عليه وسلم بيدِه اليُمنى: «هذه يدُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span>».", "فضرَب بها على يدِه، فقال: «هذه لِ<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span>». وقال جابرُ بنُ عبدِ الله: كُنَّا يومَ الحُديبيةِ ألفًا وأربعَ مائةٍ، فبايَعْنا رسولَ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">وعُمَرُ</span> آخِذٌ بيدِه تحت الشَّجرةِ، وهي سَمُرَةٌ. وقال لنا النَّبيُّ صلى الله عليه وسلم: «أنتم اليومَ خيرُ أهلِ الأرضِ».", "ثم قال جابرٌ: لو كنتُ أُبصِرُ لأَرَيْتُكُم مَوضِعَ الشَّجرةِ . وعن مَعقِلِ بنِ يَسارٍ قال: لقد رَأيتُني يومَ الشَّجرةِ، والنَّبيُّ صلى الله عليه وسلم يُبايِعُ النَّاسَ، وأنا رافعٌ غُصنًا مِن أَغصانِها عن رَأسِه، ونحن أربعَ عشرةَ مائةً. وقدِ اخْتلفتِ الرِّواياتُ في عَددِهم، فقال ابنُ حَجَرٍ: (والجمعُ بين هذا الاختلافِ أنَّهم كانوا أكثرَ مِن ألفٍ وأربعمائةٍ، فمَن قال: ألفًا وخمسمائةٍ جبَر الكَسرَ، ومَن قال: ألفًا وأربعمائةٍ أَلغاهُ)."], "url": "https://dorar.net/history/event/100", "route": null, "stations": null, "title_en": "The Pledge of Allegiance of al-Ridwaan", "date_en": "Dhu al-Qadah 6 AH (628 CE)", "place_en": "Al-Hudaybiyyah", "summary_en": "Before the treaty of Hudaybiyyah, the Prophet ﷺ sent Khirash ibn Umayyah, then Uthman ibn Affan, to Quraysh to explain that the Muslims had come only for Umrah. When a rumour spread that Uthman had been killed, the Companions pledged allegiance to the Prophet ﷺ under the tree.", "people": ["uthman", "umar", "abusufyan"], "dorar": 100, "asbab": [], "body_en": ["Before holding the Treaty of al-Hudaybiyyah, the Messenger of Allah ﷺ had sent Khiraash ibn Umayyah al-Khuzaa’ee to Makkah and gave him a camel that belonged to him, which was called the ath-Tha’lab. When he entered Makkah, Quraysh harmed him and wanted to kill Khiraash. Al-Ahaabish stopped them from doing so until he came to the Messenger of Allah ﷺ. The Messenger ﷺ called ‘Umar to send him to Makkah. He said, “O Messenger of Allah, I fear Quraysh for myself, and there is no one from Banoo ‘Adiy who can protect me, and Quraysh have known my enmity towards them and my harshness towards them. However, I will point you to a man who is dearer to them than me, that is, ‘Uthman ibn ‘Affaan. The Messenger of Allah ﷺ called him and sent him to Quraysh telling them that he did not come to them to war, and that he is coming as a visitor to the House, venerating its sanctity. ‘Uthman left until he arrived at Makkah and Aban ibn Sa’eed ibn al-‘Aas met him, so he came down from his mount and carried him in front of him and then he sat behind him and granted him security until he delivered the letter of the Messenger of Allah ﷺ.", "‘Uthman moved forward until he came to Aboo Sufyaan and the chiefs of Quraysh, and he informed them of the message of the Messenger of Allah ﷺ that he had sent him with. They said to ‘Uthmaan, “If you want to circumambulate the House, then do so.” He replied, “I will not do so until the Messenger of Allah ﷺ circumambulates it. Upon that, Quraysh detained him. On the other hand, the Messenger of Allah ﷺ and the Muslims were informed that ‘Uthman had been killed. Ibn Umar, may Allah be pleased with them both (him and his father), states, “The pledge of allegiance of al-Ridwaan was after ‘Uthman had gone to Makkah, so the Messenger of Allah ﷺ stated with showing his right hand: “This is ‘Uthman’s hand.” He then struck it on his [left] hand and said: “This [allegiance] is for Uthmaan.” Jaabir ibn Abdullah says, “On the day of al-Hudaybiyah, we were one thousand four hundred, so we pledged allegiance to the Messenger of Allah ﷺ and Umar was holding his hand while he was sitting under the tree (to administer the oath) which was an acacia tortilis tree.”", "He further says, “We pledged allegiance to him not to flee, and we did not pledge allegiance to him on death. And the Prophet ﷺ told us, “Today you are the best of the people on earth.” Then Jaabir said, “If I had sight, I would have shown you the location of the tree.” On the authority of Ma’qil ibn Yasaar, he said, “I saw on the day of the tree the Prophet ﷺ took allegiance of the people, while I was lifting one of its branches off his head. We were one thousand and four hundred.” The narrations differ regarding their number, and Ibn Hajar said, “The combination of this difference is that they were more than one thousand and four hundred. Whoever said: one thousand and five hundred, he made a reparation for the fraction (i.e., rounded up the number), and whoever said: one thousand and four hundred abolished it (i.e., rounded down the number).”"], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 85, "stage": 8, "title": "صُلْحُ الحُدَيبيةِ", "date": "ذي القعدة 6 هـ، الموافق 628م", "place": "الحديبية", "lat": 21.48, "lng": 39.64, "approx": false, "zoom": 8, "paras": ["خرَج رسولُ الله صلى الله عليه وسلم ومعه قُرابةُ ألفٍ وأربعمائةٍ مِن أصحابِه يُريدون العُمرةَ فلمَّا وصلوا إلى الحُديبيةِ - وهي تَبعُد عن مكَّةَ قُرابةَ ٢٢ كم - وَصلَهُ الخبرُ أنَّ هناك مَن يُريدُ أن يُقاتِلَهُ، فقال: إنَّه لم يَجِئْ لقِتالٍ؛ بل جاء مُعتمِرًا. وأَرسل رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> بنَ عفَّانَ إلى مكَّةَ لِيُخبِرَهم بذلك، ثمَّ شاع الخبرُ أنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"uthman\">عُثمانَ</span> قُتِلَ، فأمَر رسولُ الله صلى الله عليه وسلم الصَّحابةَ رضي الله عنهم أن يُبايِعوه على القِتالِ، فبايَعوهُ وهي بَيعةُ الرِّضوانِ، ثمَّ جاء المشركون إلى الحُديبيةِ وحَصَلت عِدَّةُ مُفاوضاتٍ بين رُؤساءٍ مِنَ المشركين وبين النَّبيِّ صلى الله عليه وسلم حتَّى جاء سُهيلُ بنُ عَمرٍو فصالَحهُ النَّبيُّ صلى الله عليه وسلم على أن تُوضَعَ الحربُ عشرَ سنين يأمنُ فيها النَّاسُ، ويَكُفُّ بعضُهم عن بعضٍ، وعلى أنَّ مَن أتى رسولَ الله مِن أصحابِه مِن غيرِ إذنِ وَلِيِّهِ رَدَّهُ رسولُ الله عليهم، ومَن أتى قُريشًا مِن أصحابِه لم يَردُّوه، وأنَّ بينهم عَيْبَةً مَكفوفَةً، أي: لا غِشَّ فيها، وأنَّه لا إسْلالَ -يعني لا سَرِقةَ- ولا إغْلالَ -يعني لا خِيانةَ- وأن يَرجِعَ في عامِه هذا دون أن يَدخُلَ مكَّةَ وله ذلك في العامِ القابلِ، يَدخلُها ثلاثةَ أيَّامٍ معه سِلاحُ الرَّاكبِ لا يَدخلُها بغيرِ السُّيوف في القُرُبِ...", "ثمَّ أمَر النَّبيُّ صلى الله عليه وسلم أصحابَه أن يَنحَروا ويَحلِقوا؛ ولكنَّهم لم يفعلوا حتَّى أَشارت عليه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ummsalama\">أمُّ سَلمةَ</span> رضي الله عنها أن يَقومَ هو بذلك دون أن يُكلِّمَ أحدًا فلمَّا رَأَوْهُ نَحَرَ تَواثَبوا إلى الهَدْيِ وفعلوا مِثلَ ما فعَل, ثم عاد النَّبيُّ صلى الله عليه وسلم إلى المدينة دون عُمرةٍ ودون قِتالٍ."], "url": "https://dorar.net/history/event/101", "route": [[24.4672, 39.6111], [24.413, 39.543], [23.5, 39.25], [22.35, 39.3], [21.95, 39.35], [21.48, 39.64]], "stations": null, "title_en": "The Treaty of al-Hudaybiyah", "date_en": "Dhu al-Qadah 6 AH (628 CE)", "place_en": "Al-Hudaybiyyah", "summary_en": "The Prophet ﷺ set out for Umrah with about 1,400 Companions. Stopped at al-Hudaybiyyah, they pledged allegiance under the tree, and a truce was concluded with Quraysh.", "people": ["uthman", "ummsalama"], "dorar": 101, "asbab": [{"id": "ASB-044", "k": "d"}, {"id": "ASB-045", "k": "d"}, {"id": "ASB-046", "k": "d"}, {"id": "ASB-047", "k": "d"}, {"id": "ASB-048", "k": "d"}], "body_en": ["The Messenger of Allah ﷺ went out with about one thousand and four hundred of his Companions wanting to perform Umrah. However, when they reached al-Hudaybiyah - which is about 22 km away from Makkah - the news reached him that there were people who wanted to fight him, so he said that he did not come to fight. Rather, he came to perform Umrah. For this reason, the Messenger of Allah ﷺ sent ‘Uthamaan ibn ‘Affaan to Makkah to inform them of his real intention. After his arrival to Makkah, the news spread that ‘Uthmaan had been killed there, thus, the Messenger of Allah ﷺ ordered his Companions, may Allah be pleased with them, to pledge allegiance to him for the fight.", "They pledged allegiance to him and that was the pledge of allegiance of al-Ridwaan. Afterwards, the polytheists came to al-Hudaybiyah and there, several negotiations between chiefs from among the polytheists and the Prophet ﷺ took place until Suhayl ibn ‘Amr came and the Prophet ﷺ reconciled with him and made a ten years truce during which people will be granted safety from any harm, and that if any of his Companions comes to the Messenger of Allah ﷺ without the consent of his guardian, then the Messenger of Allah ﷺ would return him to them.", "And whoever of his companions would come to Quraysh, they would not turn him back, and that there was a blinding defect among them, i.e.: there was no cheating in it, and that there was no fraud - meaning no theft, and no tying - meaning no betrayal - and that the Muslims will return to al-Madeenah this year without entering Makkah. However, the coming year, they can enter it for three days, whilst carrying with them only the rider’s weapon. The Muslims, according to this truce, should enter while their swords in the sheaths ....", "Then the Prophet ﷺ ordered his Companions to slaughter the sacrificial animals and shave their heads to end their state of ihram. But they did not respond until Umm Salamah (may Allah be pleased with her) advised him ﷺ that he should do that [first] without speaking to anyone. When the Companions saw him that he had sacrificed, they hastened towards their animals driven for sacrifice and they emulated what he performed. Then the Prophet ﷺ returned to al-Madeenah."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 86, "stage": 9, "title": "غَزوةُ خَيبرَ", "date": "محرم 7 هـ، الموافق 628م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["اختلَف أهلُ السِّيَرِ في وقتِها على قولين، فقِيلَ: في السَّنةِ السَّابعةِ. وهو قولُ ابنِ إسحاقَ وغيرِه، وقِيلَ: في السَّنةِ السَّادسةِ. وهو قولُ مالكٍ وغيرِه. قال ابنُ القَيِّمِ: والجُمهورُ على أنَّها في السَّابعةِ. وقال ابنُ حَجَرٍ: وهذه الأقوالُ مُتقاربةٌ، والرَّاجحُ منها ما ذكَرهُ ابنُ إسحاقَ، ويُمكنُ الجمعُ بينهما بأنَّ مَن أطلق سَنَةَ سِتٍّ بِناءً على أنَّ ابتداءَ السَّنةِ مِن شهرِ الهِجرةِ الحقيقيِّ وهو ربيعٌ الأوَّلُ.", "عن أنسٍ: أنَّ رسولَ الله صلى الله عليه وسلم غَزا خَيبرَ، قال: فصلَّينا عندها صلاةَ الغَداةِ بِغَلَسٍ، فرَكِبَ نَبيُّ الله صلَّى الله عليه وسلَّم ورَكِبَ أبو طلحةَ، وأنا رَديفُ أبي طلحةَ، فأَجرى نَبيُّ الله صلى الله عليه وسلم في زُقاقِ خَيبرَ، وإنَّ رُكبتِي لَتَمَسُّ فَخِذَ نَبيِّ الله صلى الله عليه وسلم، وانْحسَر الإزارُ عن فَخِذِ نَبيِّ الله صلى الله عليه وسلم، فإنِّي لأَرى بَياضَ فَخِذِ نَبيِّ الله صلى الله عليه وسلم، فلمَّا دخَل القريةَ قال: «الله أكبرُ خَرِبتْ خَيبرُ، إنَّا إذا نزَلنا بِساحةِ قومٍ فَساءَ صباحُ المُنذَرين».", "قالها ثلاثَ مرَّاتٍ، قال: وقد خرَج القومُ إلى أعمالِهم، فقالوا: محمَّدٌ، والله -قال عبدُ العَزيزِ: وقال بعضُ أصحابِنا: محمَّدٌ، والخَميسُ- قال: وأَصَبناها عَنْوَةً، وجُمِعَ السَّبْيُ، فجاءَهُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحْيَةُ</span> فقال: يا رسولَ الله، أَعطِني جاريةً مِنَ السَّبْيِ. فقال: «اذهَبْ فخُذْ جاريةً».", "فأخَذ صَفِيَّةَ بنتَ حُيَيٍّ، فجاء رجلٌ إلى نَبيِّ الله صلى الله عليه وسلم فقال: يا نَبيَّ الله، أَعطيتَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةَ</span> صَفيَّةَ بنتَ حُيَيٍّ سَيِّدِ قُريظةَ والنَّضيرِ! ما تَصلُحُ إلَّا لك، قال: «ادْعوهُ بها». قال: فجاء بها، فلمَّا نظَر إليها النَّبيُّ صلى الله عليه وسلم، قال: «خُذْ جاريةً مِنَ السَّبْيِ غيرَها».", "قال: وأَعتقَها وتَزوَّجَها...\" عن أنسٍ رضي الله عنه: أنَّ النَّبيَّ صلى الله عليه وسلم خرَج إلى خَيبرَ، فجاءَها ليلًا، وكان إذا جاء قومًا بِليلٍ لا يُغيرُ عليهم حتَّى يُصبِحَ، فلمَّا أَصبح خرجَت يَهودُ بمَساحيهِم ومَكاتِلهِم، فلمَّا رَأَوْهُ قالوا: محمَّدٌ والله، محمد والخَميسُ. فقال النَّبيُّ صلى الله عليه وسلم: «الله أَكبرُ، خَرِبَتْ خَيبرُ إنَّا إذا نزلنا بِساحةِ قومٍ، فَساءَ صَباحُ المُنذَرين». وقد جعَل الله تعالى فتحَ خَيبرَ على يَدِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">عليِّ بنِ أبي طالبٍ</span> رضي الله عنه. وعن عبدِ الله بنِ عُمَرَ رضِي الله عنهما قال: أَعطى رسولُ الله صلى الله عليه وسلم خَيبرَ اليَهودَ: أن يَعمَلوها ويَزرَعوها، ولهم شَطْرُ ما يَخرُجُ منها\". فأَبقاهم النَّبيُّ صلى الله عليه وسلم في أَرضِهم ولهم النِّصفُ."], "url": "https://dorar.net/history/event/102", "route": [[24.4672, 39.6111], [25.7, 39.29]], "stations": null, "title_en": "The Battle of Khaybar", "date_en": "Muharram 7 AH (628 CE)", "place_en": "Khaybar", "summary_en": "The Muslims marched on Khaybar, the stronghold of those who had rallied the confederates, and took its fortresses one by one. The banner was given to Ali ibn Abi Talib.", "people": ["dihya", "ali"], "dorar": 102, "asbab": [], "body_en": ["The biographers of the life of the Prophet ﷺ differed on its time, having two opinions. It was mentioned: “It happened in the seventh year [after migration].” This is the view of Ibn Ishaaq and others. It was also stated, “It took place in the sixth year,” which is the saying of Maalik and others. Ibn al-Qayyim said, “The majority opinion is that it happened in the seventh year.” Ibn Hajar said, “These opinions are close to each other, and the most preponderant of them is what Ibn Ishaaq mentioned. The different views can be reconciled by saying that whoever proclaimed that it was the year six, they perceived so on the basis that the beginning of the year [in counting] should be from the real month of migration, which is in this case is Rabee’ al-Awwal.”", "It is narrated on the authority of Anas (may Allah be pleased with him) that the Messenger of Allah ﷺ invaded Khaybar. He states, “We prayed the morning prayer at the earliest dark hours of daybreak. Thereafter, the Prophet ﷺ mounted his ride and thereafter, Aboo Talhah also rode his mount, and I mounted the same ride behind Aboo Talhah. The Prophet ﷺ sprinted in the alleys of Khaybar. My knee was touching the thigh of the Prophet of Allah ﷺ and the lower garment receded from the thigh of the Prophet of Allah ﷺ for I could see the whiteness of the thigh of the Prophet ﷺ. When he entered the town, he proclaimed, “Allah is the Greatest, Khaybar has fallen into ruins. Indeed, when we halt at the people’s square, then the morning of those who have been warned before becomes really bad.” He said it three times. The narrator says, “The people had gone out to their usual business, and said: Muhammad, by Allah - Abdul Aziz said: “Some of our companions narrated Muhammad, and on Thursday” – He further said, “We conquered by force, and the captives were assembled.", "Dihyah came to the Prophet ﷺ and said, “O Messenger of Allah, grant me a slave girl from the captives.” He said, \"Go forth and take a maidservant.” So, he took Safiya bint Huyayy. A man came to the Prophet of Allah ﷺ and said, “Prophet of Allah ﷺ you have given Dihyah Safiyyah, the daughter of Huyayy, the master of Quraydhah and an-Nadeer! She is only suitable for you.” He said, “Call him over with her.” He said, “He brought her and when the Prophet ﷺ looked at her, he said: “Take another slave girl from the captivity apart from her.”", "He further says, “And he then freed her and married her...” On the authority of Anas (may Allah be pleased with him), it is narrated that the Prophet ﷺ went out to Khaybar and he arrived at it at night. It was his habit if he ﷺ came to a people by night, he would not attack them until morning. In the morning, the Jews came out with their baskets and spades. When they saw him, they said, “Muhammad and on Thursday.” The Prophet ﷺ proclaimed, “Allah is the Greatest, Khaybar has fallen into ruins. Indeed, when we halt at the people’s square, then the morning of those who have been warned before becomes bad.”", "Allah granted the victory of Khaybar at the hands of ‘Ali ibn Aboo Taalib, may Allah be pleased with him. Abdullah ibn ‘Umar, may Allah be pleased with both, says, “The Messenger of Allah ﷺ granted Khaybar to the Jews on the condition that they work in it and cultivate it and they receive half of its produce. The Prophet ﷺ permitted them to remain in their lands and that they are allowed to take half of the produce.”"], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 87, "stage": 9, "title": "تَحريمُ لُحومِ الحُمُرِ الأَهْلِيَّةِ ومُتعةِ النِّساءِ يوم خيبر", "date": "محرم 7 هـ، الموافق 628م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["في أثناءِ غَزوةِ خَيبرَ حَرَّمَ رسولُ الله صلى الله عليه وسلم لُحومَ الحُمُرِ الأَهلِيَّةِ، وأَخبرَ أنَّها رِجْسٌ، وأمَر بالقُدورِ فأُلقِيتْ وهي تَفورُ بِلُحومِها، وأمَر بغَسلِ القُدورِ بعدُ، وأَحَلَّ حِينئذٍ لُحومَ الخَيْلِ وأَطعَمهُم إيَّاها, كما نَهى صلى الله عليه وسلم عن مُتعةِ النِّساءِ."], "url": "https://dorar.net/history/event/103", "route": null, "stations": null, "title_en": "The Prohibition of Consuming Domestic Donkeys and of Temporary Marriages", "date_en": "Muharram 7 AH (628 CE)", "place_en": "Khaybar", "summary_en": "During the Khaybar campaign the Prophet ﷺ forbade eating the meat of domestic donkeys.", "people": [], "dorar": 103, "asbab": [], "body_en": ["During the battle of Khaybar, the Messenger of Allah ﷺ prohibited the consumption of domestic donkey’s meat and he informed that it is impure. He ﷺ commanded them to empty the pots. They were overturned whilst they were boiling with domestic donkey’s meat. He ordered the washing of the pots thereafter. During that period, he allowed the consumption of horses and he fed them to the Muslims, and he ﷺ prohibited temporary marriage contracts."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 88, "stage": 9, "title": "هجرة أبي موسى الأشعري وأصحابه رضي الله عنهم إلى المدينة مروراً بالحَبشةِ", "date": "محرم 7 هـ، الموافق 628م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["عن أبي موسى رضي الله عنه قال: بلغَنا مَخرجُ النَّبيِّ صلى الله عليه وسلم ونحن باليَمنِ، فخرَجْنا مُهاجرين إليه، أنا وأَخَوانِ لي أنا أَصغرُهم، أَحدُهما أبو بُردةَ، والآخرُ أبو رُهْمٍ -إمَّا قال: في بِضْعٍ، وإمَّا قال: في ثلاثةٍ وخمسين، أو اثنين وخمسين رجلًا مِن قومي- فرَكِبْنا سَفينةً، فأَلقَتْنا سَفينتُنا إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيِّ</span> بالحَبشةِ، ووافَقْنا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جَعفرَ</span> بنَ أبي طالبٍ وأصحابَه عنده، فقال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جَعفرٌ</span>: إنَّ رسولَ الله صلى الله عليه وسلم بعَثنا هاهنا، وأمَرنا بالإقامةِ، فأقيموا معنا.", "فأَقمنا معه حتَّى قَدِمنا جميعا، فوافَقْنا النَّبيَّ صلى الله عليه وسلم حين افتَتَح خَيبرَ، فأَسهَم لنا -أو قال: فأعطانا منها- وما قَسَمَ لأحدٍ غاب عن فَتحِ خَيبرَ منها شيئًا، إلَّا لمن شَهِدَ معه، إلَّا أصحابَ سَفينتِنا مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"jafar\">جَعفرٍ</span> وأصحابِه، قَسَمَ لهم معهم."], "url": "https://dorar.net/history/event/104", "route": null, "stations": null, "title_en": "The Return of the Emigrants from Abyssinia", "date_en": "Muharram 7 AH (628 CE)", "place_en": "Khaybar", "summary_en": "Ja'far ibn Abi Talib and the emigrants from Abyssinia, together with Abu Musa al-Ash'ari and his people from Yemen, reached the Prophet ﷺ at Khaybar.", "people": ["jafar", "najashi"], "dorar": 104, "asbab": [], "body_en": ["It is reported on the authority of Aboo Musa (may Allah be pleased with him) that, “The news of the migration of the Prophet ﷺ reached us while we were in Yemen, so we went out as migrants to him. Two brothers of mine and I also migrated. I was the youngest of them; one of them was Aboo Burdah and the other was Aboo Ruhm – either he said, ‘in group of some people,’ or he said, ‘in fifty-three, or fifty-two men of my people.’ So, we boarded a ship, and our ship threw us to the Negus in Abyssinia, wherein we met Ja’far ibn Aboo Taalib and his companions. Ja’far said, “The Messenger of Allah ﷺ sent us here and ordered us to stay here, so, please remain with us here. We stayed with him until we all came [to al-Madeenah]. We met the Prophet ﷺ when he conquered Khaybar, so he allocated a portion of its spoils for us” - or he said, “He gave us some of it” – “and he did not distribute anything of it to anyone who missed the conquest of Khaybar. He divided the spoils with those who witnessed the conquest of Khaybar and the people who were on our ship alongside Ja’far and his companions.”"], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 89, "stage": 9, "title": "مُحاوَلةُ اليَهودِ تَسميمِ رسولِ الله صلَّى الله عليه وسلَّم", "date": "محرم 7 هـ، الموافق 628م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["لمَّا اطْمأنَّ رسولُ الله صلى الله عليه وسلم بخَيبرَ بعدَ فَتحِها أَهدَتْ له زَينبُ بنتُ الحارثِ -امرأةُ سَلاَّمِ بنِ مِشْكَمٍ- شاةً مَصْلِيَّةً، وقد سَألتْ أيَّ عُضْوٍ أَحَبُّ إلى رسولِ الله صلى الله عليه وسلم؟ فقِيلَ لها: الذِّراعُ، فأَكثرتْ فيها مِنَ السُّمِّ، ثمَّ سَمَّتْ سائرَ الشَّاةِ، ثمَّ جاءت بها، فلمَّا وَضعتْها بين يَدي رسولِ الله صلى الله عليه وسلم تناوَلَ الذِّراعَ، فَلاكَ منها مُضغةً فلم يسغْها، ولَفَظَها، ثمَّ قال: (إنَّ هذا العَظمُ لَيخبِرُني أنَّه مَسمومٌ).", "ثم دَعا بها فاعْترَفتْ، فقال: (ما حمَلكِ على ذلك؟). قالتْ: قلتُ إن كان مَلِكاً استَرحتُ منه، وإن كان نَبِيًّا فسيُخبَرُ، فتجاوَز عنها. وكان معه بِشْرُ بنُ البَراءِ بنِ مَعْرورٍ، أخَذ منها أَكلةً فأَساغَها، فمات منها, واخْتلفَتِ الرِّواياتُ في التَّجاوُزِ عنِ المرأةِ وقَتْلِها، وأجمعوا بأنَّه تَجاوَز عنها أوَّلًا، فلمَّا مات بِشْرُ قَتَلَها قِصاصًا."], "url": "https://dorar.net/history/event/105", "route": null, "stations": null, "title_en": "The Attempt of Jews to Poison the Messenger of Allah ﷺ", "date_en": "Muharram 7 AH (628 CE)", "place_en": "Khaybar", "summary_en": "After Khaybar was conquered, a woman named Zaynab bint al-Harith gave the Prophet ﷺ a poisoned roasted sheep. He spat out the meat, but a Companion who had eaten from it died.", "people": [], "dorar": 105, "asbab": [], "body_en": ["When the Messenger of Allah ﷺ felt comfortably peaceful at Khaybar after its conquest, Zaynab bint al-Haarith, the wife of Sallaam ibn Mishkam, gifted him a roasted lamb and asked, “Which portion is more beloved to the Messenger of Allah ﷺ? She was told, “The shoulder.” She put more poison in it and then she laced the rest of the lamb with poison. Then, she brought it forth and placed it in from the Messenger of Allah ﷺ. He consumed the shoulder, masticating a morsel of it, however, he did not let it go down the throat and spat it out. Then he said, “This bone is informing me that it is laced with poison.” Then, he called her, and she admitted the crime. He ﷺ asked, “What prompted you to do that?” She replied, “I said to myself, if he (the Prophet) is only a king, then I will have a comfortable break from him and if he is truly a Prophet, then he will be notified.” So, he ﷺ let her go. Bishr ibn al-Baraa ibn Ma’roor was with the Prophet ﷺ and he had taken a morsel thereof, and had allowed it go down his throat.", "Thus, he died due to it.” The narrations have differed concerning letting the woman go and killing her. The scholars have all agreed that he let her go in the beginning. However, when Bishr died due to it, he killed as a legal retribution."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 90, "stage": 9, "title": "مراسلة النبي صلى الله عليه وسلم إلى المُلوكِ يَدعوهُم إلى الإسلامِ", "date": "محرم 7 هـ، الموافق 628م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["بعدَ رُجوعِ رسولِ الله صلى الله عليه وسلم مِنَ الحُديبيةِ كتَب إلى المُلوكِ يَدعوهُم إلى الإسلامِ, ولمَّا أراد أن يُكاتِبَهُم قِيلَ له: إنَّهم لا يَقرءون كِتابًا إلَّا وعليه خاتمٌ، فاتَّخذَ النَّبيُّ صلى الله عليه وسلم خاتمًا مِن فِضَّةٍ، نَقْشُهُ: محمَّدٌ رسولُ الله، وكان هذا النَّقْشُ ثلاثةَ أَسطُرٍ: محمَّدٌ سطرٌ، ورسولُ سطرٌ، والله سطرٌ.", "وعن أنسِ بنِ مالكٍ رضي الله عنه قال: « فَكأنِّي بِوَبِيصِ -أو بِبَصِيصِ- الخاتمِ في إصبعِ النَّبيِّ صلى الله عليه وسلم -أو في كَفِّهِ-». واختار مِن أصحابِه رُسُلًا لهم مَعرفةٌ وخِبرةٌ، وأَرسلَهُم إلى المُلوكِ فبعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةَ</span> بنَ خَليفةَ الكَلبيَّ إلى قَيصرَ مَلِكِ الرُّومِ، فقَرأ الكِتابَ ولم يُسْلِمْ, وبعَث عبدَ الله بنَ حُذافةَ السَّهميَّ إلى كِسرى مَلِكِ الفُرْسِ، فلمَّا قُرِئَ الكِتابُ عليه مَزَّقَهُ، ولمَّا بلَغ ذلك رسولَ الله صلى الله عليه وسلم قال: (مَزَّقَ الله مُلْكَهُ).", "وقد كان كما قال, وبعَث عَمرَو بنَ أُميَّةَ الضَّمْريَّ إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"najashi\">النَّجاشيِّ</span> مَلِكِ الحَبشةِ، فلمَّا أَعطاهُ كِتابَ رسولِ الله صلى الله عليه وسلم أَخَذهُ ووَضعَهُ على عَينِه، ونزَل عن سَريرهِ على الأرضِ، وبعَث حاطِبَ بنَ أبي بَلْتَعَةَ إلى المُقَوْقِسِ مَلِكِ الإسكندريَّةِ, فأخَذ كِتابَ النَّبيِّ صلى الله عليه وسلم فجَعلهُ في حُقِّ مِن عاجٍ، وختَم عليه، ثم كتَب إلى رسولِ الله صلى الله عليه وسلم كِتابًا, ولم يُسْلِمْ, وأَهداهُ جاريتين هُما مارِيَةُ، وشيرين وسِيرينُ، وبَغلةً تُسمَّى دُلْدُلَ.", "وبعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"amr\">عَمرَو بنَ العاصِ</span> السَّهميَّ إلى جَيْفَرٍ وعياد عَبَّادٍ ابْنَي الجُلُنْديِّ الأَزديِّين مَلِكَي عُمانَ، فأجابا إلى الإسلامِ جميعًا، وصدَّقا النَّبيَّ صلى الله عليه وسلم, وبعَث سَليطَ بنَ عَمرٍو أَحَدَ بني عامرِ بنِ لُؤَيٍّ إلى هَوذةَ بنِ عليٍّ الحَنفيِّ مَلِكِ اليَمامةِ, فرَدَّ عليه رَدًّا دون رَدٍّ، وكتَب إلى النَّبيِّ صلى الله عليه وسلم: (ما أحسنَ ما تدعو إليه وأَجملَهُ، والعربُ تَهابُ مَكاني، فاجعلْ لي بعضَ الأمرِ أَتَّبِعُكَ).", "وبعَث العَلاءَ بنَ الحَضرميِّ إلى المُنذِرِ بنِ ساوى العَبديِّ مَلكِ البَحريْنِ فلمَّا أَتاهُ كِتابُ رسولِ الله صلى الله عليه وسلم أَسلمَ, وبعَث شُجاعَ بنَ وَهْبٍ الأَسَديَّ إلى الحارثِ بنِ أبي شِمْرٍ الغسَّانيِّ مَلِكِ تُخومِ الشَّامِ, فلمَّا بلَغهُ الكِتابُ رَمى به وقال: مَن يَنزِعُ مُلكي مِنِّي؟ أنا سائرٌ إليه, ولم يُسْلِمْ.", "واسْتأذنَ قَيصرَ في حربِ رسولِ الله صلى الله عليه وسلم فثَنَّاهُ عن عزمِه، فأَجازَ الحارثُ شُجاعَ بنَ وَهْبٍ بالكِسْوَةِ والنَّفَقةِ، ورَدَّهُ بالحُسنى, وبعَث المُهاجرَ بنَ أبي أُميَّةَ المَخزوميَّ إلى الحارثِ بنِ عبدِ كُلالٍ الحِمْيَريِّ مَلِكِ اليَمنِ وقد أَسلمَ هو وأَخواهُ جميعًا."], "url": "https://dorar.net/history/event/106", "route": null, "stations": null, "title_en": "The Envoys of the Messenger of Allah ﷺ to the Kings", "date_en": "Muharram 7 AH (628 CE)", "place_en": "Madinah", "summary_en": "After Hudaybiyyah the Prophet ﷺ had a seal made and sent letters to kings and rulers, including Heraclius, Chosroes, the Negus and the ruler of Egypt, inviting them to Islam.", "people": ["amr", "dihya", "najashi"], "dorar": 106, "asbab": [], "body_en": ["After the Messenger of Allah ﷺ returned from al-Hudaybiyah, he sent letters to the kings inviting them to Islam. However, when he ﷺ wanted to write to them, he was advised that kings do not read a letter without a seal on it.” Thus, the Prophet ﷺ took a silver ring whose inscription was: Muhammad, Messenger [of], Allah. This inscription had three lines: Muhammad in a line, Rasool (Messenger) in the second line, and Allah in the third line. On the authority of Anas ibn Maalik (may Allah be pleased with him) he said: “It is as if I vividly perceive the shine of the ring on the finger of the Prophet, ﷺ or in his hand.”", "He ﷺ chose messengers from his Companions who had knowledge and experience and sent them to the kings. He sent Dihyah ibn Khaleefah al-Kalbee to Caesar, the king of the Romans, who read the letter and yet he did not embrace Islam. He ﷺ sent Abdullah ibn Sahmee to Kisra, the king of the Persians, and when the letter was read to him, he tore it. When that news reached the Messenger of Allah ﷺ he said, “May Allah tear his kingdom apart.” Thus, it happened exactly as he stated. He ﷺ also sent ‘Amr ibn Umayyah ad-Damari to Negus, the king of Abyssinia.", "When he gave him the letter of the Messenger of Allah ﷺ he took it and placed it on his eye and came down from his couch onto the floor. He ﷺ sent Haatib ibn Abee Balta'ah to Cyrus, the king of Alexandria, who took the letter of the Prophet ﷺ and put it into the cavity of ivory, and sealed it, then he wrote to the Messenger of Allah ﷺ a letter, though he did not accept Islam, however, he gifted two slave girls, Maariyah and Shireen (Sireen), and a mule called Duldul. He ﷺ sent Amr Ibn al-‘Aas as-Sahmee to Jayfar and ‘Ayaad ‘Abbaad, the sons of al-Julundee al-Azdee, the Kings of Oman.", "They all answered the call of Islam and believed in the Prophet ﷺ. He sent Saleet ibn Amr, a person from Banee Amer ibn Lu’ay to Haudhah Ibn Ali al-Hanafee, the King of al-Yamamah. He responded below the expected response, and he wrote to the Prophet ﷺ “How best and beautiful is what you call to; however, the Arabs fear my position, so make me a part of the affairs, then I will follow you.” He sent al-‘Alaa ibn al-Hadramee to al-Mundhir ibn Saawi al-‘Abdee, the King of Bahrayn. When the letter of the Messenger of Allah ﷺ reached him, he readily accepted Islam.", "He ﷺ sent Shujaa’ ibn Wahab al-Asadee to al-Haarith ibn Aboo Shimr al-Ghassani the king of the boundaries of the Levant. When the letter reached him, he threw it away, and retorted, “Who will snatch my kingdom from me? I will be marching towards him.” Thus, he did not embrace Islam. Further, he sought Caesar’s permission to fight the Messenger of Allah ﷺ he discouraged him from fulfilling his intention. Al-Haarith ordered Shujaa’ ibn Wahb to receive clothes and maintenance and responded to him kindly. He ﷺ also sent al-Muhaajir ibn Aboo Umayyah al-Makhzoomee to al-Haarith ibn Abd Kulaal al-Himyaree, the King of Yemen, who accepted Islam alongside both of his brothers."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 91, "stage": 9, "title": "غَزوةُ ذاتِ الرِّقاعِ", "date": "ربيع الأول 7 هـ، الموافق 628م", "place": "ذات الرقاع", "lat": 24.9, "lng": 41.0, "approx": true, "zoom": 8, "paras": ["قال جابرُ بنُ عبدِ الله رضي الله عنه: خرج النَّبيُّ صلى الله عليه وسلم إلى ذاتِ الرِّقاعِ مِن نخلٍ، فلَقِيَ جمعًا مِن غَطَفانَ، فلم يكن قِتالٌ، وأخاف النَّاسُ بعضُهم بعضًا، فصَلَّى النَّبيُّ صلى الله عليه وسلم ركعتي الخوفِ، وعن أبي موسى رضي الله عنه قال: خرجنا مع النَّبيِّ صلى الله عليه وسلم في غَزوةٍ ونحن سِتَّةُ نفرٍ، بيننا بَعيرٌ نَعْتَقِبُه، فنَقِبَتْ أَقدامُنا، ونَقِبَتْ قَدمايَ، وسقَطت أَظفاري، وكُنَّا نَلُفُّ على أَرجُلِنا الخِرَقَ، فسُمِّيت غزوةَ ذاتِ الرِّقاعِ، لِما كُنَّا نَعصِبُ مِنَ الخِرَقِ على أَرجُلِنا.", "وحدَّث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">أبو موسى</span> بهذا ثمَّ كَرِهَ ذاك، قال: ما كنتُ أصنعُ بأن أذكُرَهُ، كأنَّه كَرِهَ أن يكونَ شيءٌ مِن عملِه أَفشاهُ. وعن صالحِ بنِ خَوَّاتٍ، عمَّن شَهِدَ رسولَ الله صلى الله عليه وسلم يومَ ذاتِ الرِّقاعِ صلَّى صلاةَ الخوفِ: أنَّ طائفةً صَفَّتْ معه، وطائفةٌ وِجاهَ العَدُوِّ، فصلَّى بالتي معه ركعةً، ثمَّ ثبَت قائمًا، وأتمُّوا لأَنفُسِهم ثمَّ انصرفوا، فصَفُّوا وِجاهَ العَدُوِّ، وجاءتِ الطَّائفةُ الأُخرى فصَلَّى بهم الرَّكعةَ التي بَقِيتْ مِن صلاتِه ثمَّ ثبَت جالسًا، وأتمُّوا لأَنفُسِهم، ثمَّ سلَّم بهم.", "وهي غَزوةُ مُحارِبِ خَصَفَةَ وبني ثَعلبةَ مِن غَطَفانَ، وعن جابرِ بنِ عبدِ الله رضِي الله عنهما: أنَّ النَّبيَّ صلى الله عليه وسلم صلَّى بأصحابهِ في الخوفِ في غَزوةِ السَّابعةِ، غَزوةِ ذاتِ الرِّقاعِ. وعن جابرٍ قال: صلَّى النَّبيُّ صلى الله عليه وسلم بهم يومَ مُحارِبٍ، وثَعلبةَ."], "url": "https://dorar.net/history/event/77", "route": null, "stations": null, "title_en": "The Battle of Rags (Dhaat Ar-Riqaa’)", "date_en": "Rabi al-Awwal 7 AH (628 CE)", "place_en": "Dhat al-Riqa (Najd)", "summary_en": "The Prophet ﷺ marched to Dhat al-Riqa in Najd and met a gathering of Ghatafan. No fighting took place, and the Prophet ﷺ led the prayer of fear.", "people": ["abumusa"], "dorar": 77, "asbab": [], "body_en": ["Jaabir ibn Abdullah (may Allah be pleased with him) states: “The Prophet ﷺ left to Dhaat ar-Riqaa’, a place situated in an area called Nakhl. There, he ﷺ encountered a group from the tribe of Ghatfaan but no fighting occurred. However, some people casted fear in each other’s heart; therefore, the Prophet ﷺ performed the prayer of fear.” Yazeed says whilst narrating from Salamah, “I fought alongside the Prophet ﷺ on the Battle of Qarad.” Aboo Musa ash-Ash’aree (may Allah be pleased with him) related: “Six of us accompanied the Messenger of Allah ﷺ in a military expedition. We had one camel with us; we rode it in turn. Our feet got puncture wounds and my feet too got puncture wounds and my nails also fell out. We wrapped up our feet with rags; and because of this, the campaign came to be known as Dhaat ar-Riqaa’ (the Expedition of Rags).”", "Aboo Musa reported this Hadeeth, but he disliked doing so. He said, “Would that I had not mentioned it!” He said so because he disliked disclosing anything concerning his deeds. Saalih ibn Khawwaat narrates from those who witnessed the Expedition of Dhaat ar-Riqaa’ offering the Fear Prayer that the Companions prayed with the Allah's Messenger ﷺ the Fear Prayer i.e., one group lined up in rows behind him while another group faced the enemy. The Prophet ﷺ led the group that was with him in one unit, and then he remained in the standing posture while that group completed their prayer by themselves and went away to line in the face of the enemy, while the other group joined the prayer behind the Prophet and he prayed the second unit of the prayer with them, and then he kept sitting till they completed their prayer by themselves, and he then finished his prayer with tasleem along with them.”", "It is known the military expedition of Muhaarib ibn Khasafah of the clan of Banoo Tha’labah belonging to the tribe of Ghatafaan. It happened after the battle of Khaybar because Aboo Musa arrived after Khaybar. It is narrated from Jaabir ibn Abdullah (may Allah be pleased with him) and his father, “The Prophet ﷺ led his companions in the prayer of fear in the seventh military expedition, the expedition of Dhaat ar-Riqaa’ at Dhu Qarad. And it is narrated from Jaabir that the Prophet ﷺ led them in prayer on the day of Muhaarib and Tha’labah.”"], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 92, "stage": 9, "title": "سَرِيَّةُ غالبِ بنِ عبدِ الله اللَّيثيِّ إلى بني المُلَوَّحِ بُقدَيْدٍ", "date": "ربيع الأول 7 هـ، الموافق 628م", "place": "قديد", "lat": 22.35, "lng": 39.3, "approx": true, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ghalib\">غالبِ بنِ عبدِ الله</span> اللَّيثيِّ إلى بني المُلَوَّحِ بِقُدَيْدٍ، وكان بنو المُلَوَّحِ قد قَتلوا أصحابَ بشيرِ بن سُوَيْدٍ، فبُعِثت هذه السَّرِيَّةُ لأَخذِ الثَّأرِ، فشَنُّوا الغارةَ في اللَّيلِ فقَتلوا مَن قَتلوا، وساقوا النَّعَمِ، وطاردَهُم جيشٌ كَبيرٌ مِنَ العَدُوِّ، حتَّى إذا قرب مِنَ المسلمين نزل مَطَرٌ، فجاء سَيلٌ عَظيمٌ حال بين الفَريقين. ونجَح المسلمون في بَقِيَّةِ الانسِحابِ."], "url": "https://dorar.net/history/event/107", "route": null, "stations": null, "title_en": "The Brigade of Ghaalib ibn Abdullah al-Laythee to Banoo al-Mullawwah at Qudayd", "date_en": "Rabi al-Awwal 7 AH (628 CE)", "place_en": "Qudayd", "summary_en": "Ghalib al-Laythi led an expedition against Banu al-Mulawwah at Qudayd, who had killed the companions of Bashir ibn Suwayd.", "people": ["ghalib"], "dorar": 107, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched Ghaalib ibn Abdullah al-Laythi to Banoo Al-Mulawwah at Qudayd after they killed the Companions of Basheer ibn Suwayd. The mission of this brigade was to take revenge. They staged the raid at night, thus, killing some of them and herded the livestock. However, a large army of the enemy chased them, until they approached the Muslims, rain started to pour down. A great flood ensued which became a hindrance between the two groups. Thus, the Muslims succeeded in the rest of the withdrawal"], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 93, "stage": 9, "title": "سرية زيد بن حارثة إلى أرض حِسْمى", "date": "جمادى الآخر 7 هـ، الموافق 628م", "place": "حسمى", "lat": 28.5, "lng": 35.9, "approx": true, "zoom": 8, "paras": ["أرسل الرَّسولُ صلى الله عليه وسلم بكِتابٍ إلى قَيصرِ الرُّومِ وكان حاملَ الكِتابِ هو <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةُ</span> بنُ خَليفةَ الكَلبيُّ، فلمَّا كان مِن قَيصرَ ما كان أجاز <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةَ</span> بنَ خَليفةَ الكَلبيَّ بمالٍ وكِسوَةٍ، ولمَّا كان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةُ</span> بحِسْمَى في الطَّريقِ لَقِيَهُ ناسٌ مِن جُذَامَ، فقَطعوها عليه، فلم يتركوا معه شيئًا، فجاء <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةُ</span> إلى رسولِ الله صلى الله عليه وسلم قبلَ أن يَدخُلَ بيتَه فأخبرَهُ، فبعَث رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارثةَ</span> إلى حِسْمَى، وهي وَراءَ وادي القُرى، في خمسمائةِ رجلٍ، فشَنَّ زيدٌ الغارةَ على جُذامَ، فقَتل فيهم قتلًا ذَريعًا، واسْتاقَ نَعَمَهُم ونِساءَهُم، فأخذ مِنَ النَّعَمِ ألفَ بَعيرٍ، ومِنَ الشَّاةِ خمسةَ آلافٍ، والسَّبْيِ مائةً مِنَ النِّساءِ والصِّبيانِ.", "وكان بين النَّبيِّ صلى الله عليه وسلم وبين قَبيلةِ جُذامَ مُوادَعةٌ، فأسرعَ زيدُ بنُ رِفَاعةَ الجُذاميُّ أَحَدُ زُعماءِ هذه القَبيلةِ بتَقديمِ الاحْتِجاجِ إلى النَّبيِّ صلى الله عليه وسلم، وكان قد أَسلمَ هو ورِجالٌ مِن قومِه، ونَصَروا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"dihya\">دِحيةَ</span> حين قُطِعَ عليه الطَّريقُ، فقَبِلَ النَّبيُّ صلى الله عليه وسلم احْتِجاجَهُ، وأَمَر بِرَدِّ الغَنائمِ والسَّبْيِ."], "url": "https://dorar.net/history/event/108", "route": null, "stations": null, "title_en": "The Brigade of Zayd ibn Haarithah to Hismee", "date_en": "Jumada al-Akhirah 7 AH (628 CE)", "place_en": "Hisma", "summary_en": "Dihyah al-Kalbi was robbed at Hisma on his way back from Heraclius, so the Prophet ﷺ sent Zayd ibn Harithah against those responsible.", "people": ["zayd", "dihya"], "dorar": 108, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent a letter to Caesar of the Roman Empire, and the bearer of the letter was Dihyah ibn Khaleefah Al-Kalbee. After reading the letter and the discussion that occurred about its content, Caesar gifted Dihyah ibn Khaleefah al-Kalbee with money and clothing. On his way back to al-Madeenah, Dihya arrived at Hisma where he met some people from the tribe Judhaam. They robbed him of all what he had, leaving nothing with him. After arriving at al-Madeenah, Dihyah visited the Messenger of Allah ﷺ before entering his house, and he informed him of the incident.", "In response, the Messenger of Allah ﷺ dispatched Zayd ibn Haarithah to Hisma, which is situated behind Waadee al-Qura, with five hundred men. Zayd launched the raid on Judhaam, and he killed them horribly, and took away their livestock and women. He took from the camels one thousand camels, and from the sheep five thousand, and the captives consisting of one hundred women and children. At that time, there was a peace pact between the Prophet ﷺ and the tribe of Judhaam, thus, Zayd ibn Rifaa’ah al-Judhaamee, one of the leaders of this tribe, hurriedly presented a protest to the Prophet ﷺ who, alongside other men, had embraced Islam earlier and had also helped Dihyah when he was robbed on the road. The Prophet ﷺ accepted his protest and commanded to return the spoils and the captives."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 94, "stage": 9, "title": "سَرِيَّةُ عُمَرَ بنِ الخطَّابِ رضِي الله عنه إلى (تُرَبَةَ) طائفةٍ مِن هَوازِنَ", "date": "شعبان 7 هـ، الموافق 628م", "place": "تربة", "lat": 21.21, "lng": 41.65, "approx": false, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> بنَ الخطَّابِ رضِي الله تعالى عنه في ثلاثين رجلًا إلى عَجُزِ هَوازِنَ -مَحِلٌّ بينه وبين مكَّةَ أربعُ ليالٍ بطَريقِ صَنعاءَ يُقالُ له: تُرَبَةُ-. وأَرسلَ صلى الله عليه وسلم دليلًا مِن بني هِلالٍ فكان يَسيرُ اللَّيلَ ويَكْمُنُ النَّهارَ، فأتى الخبرُ لِهَوازنَ فهَربوا، فجاء <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> بنُ الخطَّابِ رضِي الله تعالى عنه مَحالَّهُم فلم يَجِدْ منهم أحدًا فانصرَف راجعًا إلى المدينةِ فلمَّا كان بِمَحِلٍّ بينه وبين المدينةِ سِتَّةُ أميالٍ قال له الدَّليلُ هل لك جَمْعٌ آخرُ مِن خَثْعَمَ؟ فقال له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرُ</span> رضِي الله تعالى عنه: لم يَأمُرْني رسولُ الله صلى الله عليه وسلم بهم، إنَّما أَمرَني بقِتالِ هَوازِنَ."], "url": "https://dorar.net/history/event/109", "route": null, "stations": null, "title_en": "The Expedition of ‘Umar ibn al-Khattaab (May Allah Be Pleased with Him) to Turbah, a Group of Hawaazin", "date_en": "Shaban 7 AH (628 CE)", "place_en": "Turabah", "summary_en": "Umar ibn al-Khattab led thirty men to Turabah against the rear of Hawazin, who fled before them.", "people": ["umar"], "dorar": 109, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent ‘Umar ibn al-Khattaab (may Allah be pleased with him) with thirty men to Turbah in the back area of Hawaazin - a place that is situated at the distance of four nights journey from Makkah, on the road to Sana’a. Along the expedition, the Prophet ﷺ sent a guide from Banoo Hilaal who instructed the expedition to travel at night and hide during the day. After the news reached Hawaazin, they fled and when ‘Umar ibn Al-Khattaab (may Allah be pleased with him) arrived at their places of residence, he did not find any of them there, thus, he left and headed back to al-Madeenah.", "However, on their way back, they arrived at a place that is six miles away from al-Madeenah, the guide asked him, “Would you care to raid a group from the tribe of Kath’am? ‘Umar (may Allah be pleased with him) refused and explained that the Messenger of Allah ﷺ did not order him to fight them and that he only ordered him to fight Hawaazin."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 95, "stage": 9, "title": "سَرِيَّةُ بَشيرِ بنِ سعدٍ الأَنصاريِّ إلى بني مُرَّةَ بِناحِيةِ فَدَكٍ", "date": "شعبان 7 هـ، الموافق 628م", "place": "فدك", "lat": 25.98, "lng": 40.47, "approx": false, "zoom": 8, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةَ بَشيرِ بنِ سعدٍ الأَنصاريِّ إلى بني مُرَّةَ بِناحِيةِ فَدَكٍ، في ثلاثين رجلًا. وخرَج إليهم واسْتاقَ الشَّاءَ والنَّعَمَ، ثمَّ رجَع فأَدْركَهُ الطَّلَبُ عند اللَّيلِ، فرَمَوْهُم بالنَّبْلِ حتَّى فَنِيَ نَبْلُ بَشيرٍ وأصحابِه، فقُتِلوا جميعًا إلَّا بَشيرًا، فإنَّه حُمِلَ وبه رَمَقٌ إلى فَدَكٍ، فأقام عند يَهودَ حتَّى بَرَأَتْ جِراحُهُ، فرجَع إلى المدينةِ."], "url": "https://dorar.net/history/event/110", "route": null, "stations": null, "title_en": "The Expedition of Basheer ibn Sa’d al-Ansaaree to Banoo Murrah at Fadak", "date_en": "Shaban 7 AH (628 CE)", "place_en": "Fadak", "summary_en": "Bashir ibn Sa'd led thirty men against Banu Murrah near Fadak. They were overtaken at night and most of his men were killed.", "people": [], "dorar": 110, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent out Basheer ibn Sa’d al-Ansaaree with thirty men to Banoo Murrah who were situated in the Fadak district. With this bigrade, he mounted a raid on them and seized the sheep and camels and then headed back to al-Madeenah. However, the people of Banoo Murrah managed to catch with them at night. They shot them with arrows until the arrows of Basheer and his companions were all spent. All of them were killed apart from Basheer, who was carried while he had some life to Fadak, where he stayed with Jews until his wounds healed; thereafter, he returned to al-Madeenah."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 96, "stage": 9, "title": "سَرِيَّةُ غالبِ بنِ عبدِ الله اللَّيثيِّ إلى بني عُوَالٍ", "date": "رمضان 7 هـ، الموافق 629م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ghalib\">غالبِ بنِ عبدِ الله</span> اللَّيثيِّ، إلى بني عُوَالٍ وبني عبدِ بنِ ثَعلبةَ بالمَيْفَعَةِ، وقِيلَ إلى الحُرَقَاتِ مِن جُهَيْنَةَ في مائةٍ وثلاثين رجلًا؛ فهجَموا عليهم جميعًا، وقتَلوا مَن أَشرفَ لهم، واسْتاقوا نَعَمًا وشَاءً، وفي هذه السَّرِيَّةِ قَتَلَ أُسامةُ بنُ زيدٍ نَهِيكَ بن مِرْدَاسٍ بعدَ أن قال: لا إلَه إلَّا الله.", "فلمَّا قَدِموا وأُخْبِرَ النَّبيُّ صلى الله عليه وسلم، كَبُرَ عليه وقال: (أَقَتلتَهُ بعدَ ما قال: لا إلَه إلَّا الله؟!). فقال: إنَّما قالها مُتَعَوِّذًا قال: (فَهَلَّا شَققتَ عن قَلبِه فتَعلمُ أَصادِقٌ هو أم كاذبٌ؟)."], "url": "https://dorar.net/history/event/111", "route": null, "stations": null, "title_en": "The Expedition of Ghaalib ibn Abdullah al-Laythee to Banoo ‘Uwaal and Others", "date_en": "Ramadan 7 AH (629 CE)", "place_en": "Madinah", "summary_en": "Ghalib al-Laythi led 130 men against Banu Uwal and Banu Abd ibn Tha'labah at al-Mayfa'ah.", "people": ["ghalib"], "dorar": 111, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent the brigade of Ghaalib ibn Abdullah Al-Laythee to Banoo ‘Uwaal and Banoo ‘Abd ibn Tha’labah at al-Mayfa’ah. It was said that they were sent to al-Huraqaat of the tribe of Juhaynah in a group of one hundred and thirty men. The expedition attacked all of them and killed from them those who engaged with them; and then they seized their camels and sheep. In this mission, the famous incident of Usaamah ibn Zayd with Naheek ibn Mirdaas happened when he killed him after he uttered statement, “There is no god but Allah.”", "After their return to al-Madeenah, the Prophet ﷺ was informed of the incident, which he could not take it easy due to its seriousness, thus, he ﷺ said to Usaamah, “You really killed him after he said, ‘There is no god but Allah?!’” Zayd replied, “He only uttered it to save himself.” Thereupon, the Prophet ﷺ remarked, “Would you rip open his heart to discern whether he is truthful or a liar?”"], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 97, "stage": 9, "title": "سَرِيَّةُ عبدِ الله بنِ رَواحةَ إلى خَيبرَ لِقَتلِ يَسيرِ بنِ رِزامٍ اليَهوديِّ", "date": "شوال 7 هـ، الموافق 629م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["بلَغ رسولَ الله صلى الله عليه وسلم أنَّ يَسيرَ بنَ رِزامٍ اليَهوديَّ يَجمعُ غَطَفانَ لِيَغزو بهم المدينةَ، فبعَث رسولُ الله صلى الله عليه وسلم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدَ الله بنَ رَواحةَ</span> في ثلاثين راكبًا إلى يَسيرِ بنِ رِزامٍ حتَّى أَتَوْهُ بِخَيبرَ، فقالوا: أَرسلَنا إليك رسولُ الله صلى الله عليه وسلم لِيَستعمِلَك على خَيبرَ, فلم يزالوا به حتَّى تَبِعَهُم في ثلاثين رجلًا مع كُلِّ رجلٍ منهم رَديفٌ مِنَ المسلمين، فلمَّا بلغوا قَرْقَرَةَ نِيارٍ نَدِمَ يَسيرُ بنُ رِزامٍ فأَهوى بيدِه إلى سَيفِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدِ الله بنِ رَواحةَ</span>، ففَطِنَ له <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدُ الله بنُ رَواحةَ</span> فزَجَر بَعيرَهُ ثمَّ اقْتَحَم يَسوقُ بالقَومِ، حتَّى اسْتمكَن مِن يَسيرٍ فضرَب رِجلَهُ فقطَعها، واقْتحَم يَسيرٌ وفي يدِه مِخْراشٌ مِن شَوْحَطٍ فضرَب به وَجْهَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدِ الله بنِ رَواحةَ</span> فشَجَّهُ شَجَّةً مَأمومةً, وانْكفَأ كُلُّ رَجُلٍ مِنَ المسلمين على رَديفِه فقَتلهُ، غَيرَ رَجُلٍ واحدٍ مِنَ اليَهودِ أعَجزَهُم شَدًّا ولم يُصِبْ مِنَ المسلمين أحدًا، فبَصَقَ رسولُ الله صلى الله عليه وسلم في شَجَّةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">عبدِ الله بنِ رَواحةَ</span> فلم تُقَيَّحْ ولم تُؤْذِهِ حتَّى مات."], "url": "https://dorar.net/history/event/112", "route": null, "stations": null, "title_en": "The Expedition of Abdullah ibn Rawaahah to Khaybar to Kill Yaseer ibn Rizaam, the Jew", "date_en": "Shawwal 7 AH (629 CE)", "place_en": "Khaybar", "summary_en": "Abdullah ibn Rawahah led thirty riders against Yusayr ibn Rizam of Khaybar, who was gathering Ghatafan to attack Madinah.", "people": ["rawaha"], "dorar": 112, "asbab": [], "body_en": ["The Messenger of Allah ﷺ came to know about the plan of Yaseer ibn Rizaam, the Jew, who was rallying the ranks of Ghatafaan to attack al-Madeenah; thus, he ﷺ dispatched a thirty-horseman group headed by 'Abdullah ibn Rawaahah to eliminate Yaseer ibn Rizaam in Khaybar. When they arrived, they said to him, “The Messenger of Allah ﷺ sent us to you to appoint you as the governor of Khaybar. They persuaded him until he accepted to return with them; thus, he joined them with thirty men from his supporters. With each man of them, there was a Muslim man riding behind him. When they reached Qarqarah Niyaar, Yaseer ibn Rizaam regretted that he joined them and then inclined with his hand to the sword of Abdullah ibn Rawaahah. However, ‘Abdullah ibn Rawaahah became conscious of this and shouted at his camel, then broke into the people and started leading them, until he was able to overpower Yaseer, and he struck his leg and cut it off. Yaseer on the other hand charged forward and he had a curved wooden stick made from Shawhat tree.", "He struck the face of Abdullah ibn Rawaahah with it injuring thereby the middle of his head. Then, every person among the Muslims leaned towards his rear passenger and killed him, apart from one man amongst the Jews who made them exhausted in fighting. None of the Muslims suffered casualties. The Messenger of Allah ﷺ placed his blessed saliva on the Abdullah ibn Rawaahah’s head wound; it never became septic thereafter nor did it hurt him until he passed away."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 98, "stage": 9, "title": "سَرِيَّةُ أبي حَدْرَدٍ الأَسلميٍّ إلى الغابةِ", "date": "ذي القعدة 7 هـ، الموافق 629م", "place": "الغابة", "lat": 24.58, "lng": 39.62, "approx": true, "zoom": 11, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم سَرِيَّةَ أبي حَدْرَدٍ الأسلميِّ إلى الغابةِ، وسببُ ذلك أنَّ رجلًا مِن جُشَمِ بنِ مُعاويةَ أَقبلَ في عددٍ كبيرٍ إلى الغابةِ، يُريدُ أن يَجمعَ قَيسًا على مُحارَبةِ المسلمين، فبعَث رسولُ الله صلى الله عليه وسلم أبا حَدْرَدٍ مع رَجلينِ ليأتوا منه بِخَبرٍ وعِلْمٍ، فوصلوا إلى القومِ مع غُروبِ الشَّمسِ، فكَمَنَ أبو حَدْرَدٍ في ناحيةٍ، وصاحِباهُ في ناحيةٍ أُخرى، وأَبطأَ على القومِ رِاعيهِم حتَّى ذهَبتْ فَحْمَةُ العِشاءِ، فقام رَئيسُ القومِ وَحدَهُ، فلمَّا مَرَّ بأبي حَدْرَدٍ رَماهُ بِسَهمٍ في فُؤادِه فسقَط ولم يَتكلَّمْ، فاحْتَزَّ أبو حَدْرَدٍ رَأسَهُ، وشَدَّ في ناحيةِ العَسكرِ وكَبَّرَ، وكَبَّرَ صاحِباهُ وشَدَّا، فما كان مِنَ القومِ إلَّا الفِرارُ، واسْتاقَ المسلمون الثلاثةُ الكَثيرَ مِنَ الإبلِ والغَنَمِ."], "url": "https://dorar.net/history/event/113", "route": null, "stations": null, "title_en": "The Brigade of Aboo Hadrad al-Aslamee to al-Ghaabah", "date_en": "Dhu al-Qadah 7 AH (629 CE)", "place_en": "Al-Ghabah", "summary_en": "Abu Hadrad al-Aslami was sent to al-Ghabah against a man of Jusham who was rallying Qays to fight the Muslims.", "people": [], "dorar": 113, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent out the brigade of Aboo Hadrad al-Aslamee to al-Ghaabah. The reason for that was that a man from Jusham ibn Mu’awiyah came in a large number of people to al-Ghaabah, wanting to rally the ranks of Qays to fight the Muslims. The Messenger of Allah ﷺ sent Aboo Hadrad with two men to investigate the situation and bring back the news. They arrived at their location at the sunset, and so, Aboo Hadrad hid in one side and his two companions in another side. Their shepherd was delayed until the darkness of the night disappeared.", "The leader of the tribe stood up alone, when he passed by Aboo Hadrad, he shot him with an arrow into his heart, and he fell and did not speak. Aboo Hadrad cut off his head, charged in the direction of the army and said out loud the takbeer. His companions also said takbeer and charged. The people could not do anything but flee. The three Muslims in this mission captured many camels and sheep."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 99, "stage": 9, "title": "عُمرَةُ الحُديبيةِ وتُسَمَّى (عُمرَةَ القَضاءِ)", "date": "ذي القعدة 7 هـ، الموافق 629م", "place": "مكة", "lat": 21.4225, "lng": 39.8262, "approx": false, "zoom": 10, "paras": ["قال ابنُ عبَّاسٍ رضِي الله عنهما: قَدِمَ رسولُ الله صلى الله عليه وسلم وأصحابُه مكَّةَ، وقد وَهَنَتْهُم حُمَّى يَثْرِبَ، قال المشركون: إنَّه يَقدُمُ عليكم غَدًا قومٌ قد وَهَنَتْهُم الحُمَّى، ولَقوا منها شِدَّةً، فجلسوا ممَّا يَلِي الحِجْرَ، وأَمرَهُم النَّبيُّ صلى الله عليه وسلم أن يَرمُلوا ثلاثةَ أَشواطٍ، ويَمشوا ما بين الرُّكنَينِ، لِيَرى المشركون جَلَدَهُم، فقال المشركون: هؤلاء الذين زَعمْتُم أنَّ الحُمَّى قد وَهَنَتْهُم، هؤلاء أَجلدُ مِن كذا وكذا.", "قال ابنُ عبَّاسٍ: ولم يَمنعْهُ أن يَأمُرَهُم أن يَرمُلوا الأشواطَ كُلَّها إلَّا الإبْقاءُ عليهم. وفي هذه العُمرَةِ تَزوَّجَ النَّبيُّ صلى الله عليه وسلم بمَيمونَةَ بنتِ الحارثِ رضي الله عنها."], "url": "https://dorar.net/history/event/114", "route": null, "stations": null, "title_en": "The ‘Umrah of al-Hudaybiyah (Umrah al-Qadaa’)", "date_en": "Dhu al-Qadah 7 AH (629 CE)", "place_en": "Makkah", "summary_en": "As agreed at Hudaybiyyah, the Muslims performed Umrah the following year. The Prophet ﷺ told them to walk briskly in the first circuits to show Quraysh their strength.", "people": [], "dorar": 114, "asbab": [], "body_en": ["Ibn 'Abbaas, may Allah be pleased with him, reported that Allah's Messenger ﷺ and his Companions came to Makkah and the fever in al-Madeenah had weakened them. Thereupon, the polytheists (of Makkah) said: There would come to you a people whom the fever has made weak, and they have suffered severely from it. They sat in Hatim. Thereupon Allah's Messenger ﷺ commanded them to walk briskly for three circuits and walk normally between the two corners so that the polytheists can witness their endurance. The polytheists then said (to one another), “You were under the impression that fever had emaciated them whereas they are stronger than so and so.”", "Ibn Abbaas said: “He (the Prophet) did not command them (the Muslims) to walk quickly in all the circuits out of kindness to them. It is during this Umrah when the Prophet ﷺ married Maymoonah bint al-Haarith, may Allah be pleased with her."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 100, "stage": 9, "title": "سَرِيَّةُ ابنِ أبي العَوجاءِ إلى بني سُلَيْمٍ", "date": "ذي الحجة 7 هـ، الموافق 629م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["بعَث رسولُ الله صلى الله عليه وسلم إلى بني سُلَيْمٍ سَرِيَّةِ ابنِ أبي العَوجاءِ، في خمسين رجلاً، وذلك لِيَدعُوَهُم إلى الإسلامِ؛ فقالوا: لا حاجةَ لنا إلى ما دَعوتَنا، ثمَّ قاتَلوا قِتالًا شَديدًا. جُرِحَ فيه أبو العَوجاءِ، وأُسِرَ رَجُلان مِنَ العَدُوِّ."], "url": "https://dorar.net/history/event/115", "route": null, "stations": null, "title_en": "The Brigade of ibn Aboo al-‘Awjaa’ to Banoo Sulaym", "date_en": "Dhu al-Hijjah 7 AH (629 CE)", "place_en": "Madinah", "summary_en": "Ibn Abi al-Awja led fifty men to call Banu Sulaym to Islam. They refused and fought, and most of his men were killed.", "people": [], "dorar": 115, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched Ibn Aboo al-‘Awjaa’ with a group of fifty men to Banoo Sulaym to invite them to Islam. However, their response was: “We are in no need of what you called us to,” and then they fought a fierce battle in which Aboo al-‘Awjaa’ was wounded, and two men from the enemy were captured."], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 101, "stage": 10, "title": "وَفاةُ زَينبَ رضِي الله عنها بنتِ رسولِ الله صلَّى الله عليه وسلَّم", "date": "8 هـ، الموافق 629م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["هي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zaynab\">زينبُ بنتُ رسولِ الله</span> صلى الله عليه وسلم، وأَكبرُ أَخواتِها، تَزوَّجَها في حياةِ أمِّها ابنُ خالتِها أبو العاصِ بنُ الرَّبيعِ، فوَلدتْ له أُمامَةَ التي تَزوَّجَ بها <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">عليُّ بنُ أبي طالبٍ</span> بعدَ فاطمةَ، ووَلدتْ له عليَّ بنَ أبي العاصِ، أَسلمتْ زَينبُ وهاجرتْ قبلَ إسلامِ زَوجِها بسِتِّ سنين، قالت أمُّ عَطيَّةَ: لمَّا ماتتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zaynab\">زَينبُ بنتُ رسولِ الله</span> صلى الله عليه وسلم قال لنا رسولُ الله صلَّى الله عليه وسلَّم: «اغْسِلْنَها وِترًا ثلاثًا، أو خمسًا، واجْعَلْنَ في الخامسةِ كافورًا، أو شيئًا مِن كافورٍ، فإذا غَسَّلْتُنَّها، فأَعْلِمْنَني». قالت: فأَعلَمْناهُ، فأعطانا حِقْوَهُ وقال «أَشْعِرْنَها إيَّاهُ »."], "url": "https://dorar.net/history/event/116", "route": null, "stations": null, "title_en": "The Death of Zaynab (May Allah Be Pleased with Her) the Daughter of the Messenger of Allah ﷺ", "date_en": "8 AH (629 CE)", "place_en": "Madinah", "summary_en": "Zaynab, the Prophet's ﷺ eldest daughter, died in Madinah.", "people": ["zaynab", "ali"], "dorar": 116, "asbab": [], "body_en": ["She is Zaynab, the daughter of the Messenger of Allah ﷺ and the eldest of her sisters. She was married to the son of her maternal aunt Aboo Al-‘Aas ibn Al-Rabee’ during her mother’s life. She bore him Umaamah, whom Ali ibn Abee Taalib married after the demise of Fatimah, and she bore him Ali ibn Abi Al-‘Aas. Zaynab embraced Islam and emigrated six years before her husband converted to Islam. Umm ‘Atiyyah says, “When Zaynab, the daughter of the Messenger of Allah ﷺ died, the Messenger of Allah ﷺ told us, “Wash her an odd number of times, three times, or five, and use camphor in the fifth time, or some camphor. Once you have washed her, let me know.” She said, “So we informed him, and he gave us his lower garment and said, ‘Shroud her in it.’”"], "src_en": "https://dorar.net/en/history?page=8"}, {"seq": 102, "stage": 10, "title": "سريَّة أَوْطاسٍ (وادٍ بين مكة والطائف)", "date": "8 هـ، الموافق 629م", "place": "أوطاس", "lat": 21.75, "lng": 40.6, "approx": true, "zoom": 8, "paras": ["لمَّا فرَغ النَّبيُّ صلى الله عليه وسلم مِن حُنينٍ بعَث أبا عامرٍ على جيشٍ إلى أَوْطاسٍ، فلَقِيَ دُرَيْدَ بنَ الصِّمَّةِ، فقُتِلَ دُريدٌ وهزَم الله أصحابَهُ، قال <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">أبو موسى</span> الأَشعريُّ: وبعَثني مع أبي عامرٍ عُبيدٍ الأَشعريِّ، فرُمِيَ أبو عامرٍ في رُكْبَتِهِ، رَماهُ جُشَمِيٌّ بِسَهمٍ فأَثْبَتَهُ في رُكبتِهِ، فانتَهيتُ إليه فقلتُ: يا عمِّ مَن رَماك؟ فأَشار إليه فقال: ذاك قاتِلي الذي رَماني.", "فقصدتُ له فلَحِقْتُهُ، فلمَّا رَآني وَلَّى، فاتَّبَعْتُه وجعلتُ أقولُ له: ألا تَسْتَحْيِي، ألا تَثْبُتُ، فكَفَّ، فاخْتلَفْنا ضَربتين بالسَّيفِ فقَتلتُه، ثمَّ قلتُ لأبي عامرٍ: قتَل الله صاحِبَك. قال: فانْزَعْ هذا السَّهمَ. فنَزعْتُه فنَزا منه الماءُ قال: يا ابنَ أخي أَقْرِئْ النَّبيَّ صلى الله عليه وسلم السَّلامَ، وقُلْ له: اسْتَغْفِرْ لي.", "واسْتخلَفني أبو عامرٍ على النَّاسِ، فمكَث يَسيرًا ثمَّ مات، فرجعتُ فدخلتُ على النَّبيِّ صلى الله عليه وسلم في بيتِه على سَريرٍ مُرْمَلٍ وعليه فِراشٌ، قد أَثَّرَ رِمالُ السَّريرِ بِظَهْرِهِ وجَنْبَيْهِ، فأَخبرتُه بخَبرِنا وخَبرِ أبي عامرٍ، وقال: قُلْ له اسْتَغْفِرْ لي.", "فدَعا بماءٍ فتَوضَّأَ، ثمَّ رفَع يَديهِ فقال: «اللَّهمَّ اغْفِرْ لعُبيدٍ أبي عامرٍ». ورَأيتُ بَياضَ إِبْطَيْهِ، ثمَّ قال: «اللَّهمَّ اجْعَلْهُ يومَ القِيامةِ فوقَ كَثيرٍ مِن خَلقِك مِنَ النَّاسِ». فقلتُ: وَلِي فَاسْتَغْفِرْ. فقال: «اللَّهمَّ اغْفِرْ لعبدِ الله بنِ قَيسٍ ذَنْبَهُ، وأَدْخِلْهُ يومَ القِيامةِ مُدخَلًا كَريمًا» قال أبو بُردةَ: إحداهُما لأبي عامرٍ، والأُخرى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">لأبي موسى</span> ."], "url": "https://dorar.net/history/event/117", "route": null, "stations": null, "title_en": "The Battle of Awtaas", "date_en": "8 AH (629 CE)", "place_en": "Awtas", "summary_en": "After Hunayn the Prophet ﷺ sent Abu Amir al-Ash'ari against Hawazin's forces at Awtas. Their leader Durayd ibn al-Simmah was killed and they were defeated.", "people": ["abumusa"], "dorar": 117, "asbab": [{"id": "TAF-08", "k": "d"}], "body_en": ["When the Prophet ﷺ had finished from the battle of Hunayn, he dispatched a platoon headed by Aboo ‘Aamir to Awtaas where he engaged in combat with Durayd ibn as-Simmah. The outcome of the battle was the killing of Durayd and the defeat of the enemy. Aboo Moosa al-Ash’aree reported: “The Prophet ﷺ sent me along with Aboo 'Aamir al-Ash’aree, and Aboo 'Aamir received a wound in his knee from the arrow, (shot by) a person of Banee Jusham. It stuck in his knee. I went to him and said: Uncle, who shot an arrow upon you? Abu 'Amir pointed out to Abu Musa and said: Verily that one who shot an arrow upon me in fact killed me. Abu Musa said: I followed him with the determination to kill him and overtook him and when he saw me, he turned upon his heels. I followed him and I said to him: Don't you feel ashamed (that you run), aren't you an Arab? Why don't you stop? He stopped and I had an encounter with him, and we exchanged the strokes of (swords).", "I struck him with the sword and killed him. Then I came back to Abu Amir and said: Verily Allah has killed the one who killed you. And he said: Now draw out this arrow. I drew out the arrow and there came out from that (wound) water. Aboo 'Aamir said: My nephew, go to Allah's Messenger (ﷺ) and convey my greetings to him and tell him that Abu Amir begs you to ask forgiveness for him. And Abu Amir appointed me as the chief of the people, and he died after a short time. When I came to Allah's Apostle (ﷺ) I visited him, and he had been lying on the cot woven by strings and there was (no) bed over it and so there had been marks of the strings on the back of Allah's Messenger (ﷺ) and on his sides.", "I narrated to him what had happened to us and narrated to him about Aboo ‘Aamir and said to him that he had made a request to the effect that forgiveness should be sought for him (from Allah). Thereupon Allah's Messenger (may peace be upon him) called for water and performed ablution with it. He then lifted his hands and said: O Allah, grant pardon to Your servant Aboo ‘Aamir. (The Prophet had raised his hands so high for supplication) that I saw the whiteness of his armpits. He again said: O Allah, grant him distinction amongst the majority of Your created beings or from amongst the people.", "I said: Allah's Messenger, ask forgiveness for me too. Thereupon Allah's Messenger ﷺ said: Allah,
