 ibn Thaabit on that very day on which he was martyred. The Prophet ﷺ informed his Companions of their news and what had happened to them. Afterwards, upon hearing that `Aasim had been killed, some of the disbelievers of Quraysh sent some people to fetch a part of his body by which he would be recognised.", "(That was because) `Aasim had killed one of their chiefs on the day (of the battle) of Badr. Upon their arrival, they found a swarm of wasps, resembling a shady cloud, hovering over the body of `Aasim and protecting him from their messenger and thus they could not cut off anything from his flesh.”"], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 62, "stage": 6, "title": "سرية بِئر مَعونةَ", "date": "صفر 4 هـ، الموافق 625م", "place": "بئر معونة", "lat": 24.3, "lng": 40.6, "approx": true, "zoom": 8, "paras": ["عن أنسِ بنِ مالكٍ رضي الله عنه قال: أنَّ رِعْلًا، وذَكْوانَ، وعُصَيَّةَ، وبني لَحْيانَ، اسْتمَدُّوا رسولَ الله صلى الله عليه وسلم على عَدُوٍّ، فأَمدَّهُم بسبعين مِنَ الأنصارِ، كُنَّا نُسمِّيهم القُرَّاءَ في زمانِهم، كانوا يَحْتَطِبون بالنَّهارِ، ويُصلُّون باللَّيلِ، حتَّى كانوا ببِئرِ مَعونةَ قَتلوهُم وغَدَروا بهم، فبلَغ النَّبيَّ صلى الله عليه وسلم فقَنَتَ شهرًا يَدعو في الصُّبحِ على أَحياءٍ مِن أَحياءِ العربِ، على رِعْلٍ، وذَكْوانَ، وعُصَيَّةَ، وبني لَحْيانَ.", "قال أنسٌ: فقَرأنا فيهم قُرآنًا، ثمَّ إنَّ ذلك رُفِعَ: بَلِّغوا عَنَّا قَومَنا أَنَّا لَقِينا رَبَّنا فَرَضِيَ عَنَّا وأَرضانا. وجاء في ِروايةٍ عند البُخاريِّ: أنَّ أولئك السَّبعين مِنَ الأنصارِ قُتِلوا ببِئرِ مَعونةَ. وعن أنسِ بنِ مالكٍ، قال: جاء ناسٌ إلى النَّبيِّ صلى الله عليه وسلم، فقالوا: أَنِ ابْعَثْ معنا رجالًا يُعلِّمونا القُرآنَ والسُّنَّةَ، فبعَث إليهم سبعين رجلًا مِنَ الأنصارِ، يُقالُ لهم: القُرَّاءُ، فيهم خالي حَرامٌ، يَقرءون القُرآنَ، ويَتدارَسون باللَّيلِ يَتعلَّمون، وكانوا بالنَّهارِ يَجيئون بالماءِ فيضَعونَهُ في المسجدِ، ويَحْتَطِبون فَيَبيعونَهُ ويَشْتَرون به الطَّعامَ لأَهلِ الصُّفَّةِ وللفُقراءِ، فبعثَهُم النَّبيُّ صلَّى الله عليه وسلَّم إليهم، فعَرَضوا لهم فقَتَلوهُم قبلَ أن يَبلُغوا المكانَ، فقالوا: اللَّهمَّ، بَلِّغْ عَنَّا نَبِيَّنا أَنَّا قد لَقِيناك فَرَضينا عنك، ورَضيتَ عَنَّا.", "قال: وأَتى رجلٌ حَرامًا -خالَ أنسٍ- مِن خَلفِه، فطَعنَهُ برُمحٍ حتَّى أَنْفَذَهُ، فقال حَرامٌ: فُزْتُ ورَبِّ الكعبةِ. فقال رسولُ الله صلى الله عليه وسلم لأصحابِه: إنَّ إخوانَكُم قد قُتِلوا، وإنَّهم قالوا: اللَّهمَّ بَلِّغْ عَنَّا نَبِيَّنا أَنَّا قد لَقِيناك فَرَضينا عنك، ورَضيت عَنَّا."], "url": "https://dorar.net/history/event/75", "route": null, "stations": null, "title_en": "The Well of Ma’oonah", "date_en": "Safar 4 AH (625 CE)", "place_en": "Bir Maunah", "summary_en": "Seventy Companions known as the reciters were sent to teach Islam at the request of tribes, but they were ambushed and killed at Bi'r Ma'unah.", "people": [], "dorar": 75, "asbab": [], "body_en": ["Anas ibn Maalik (may Allah be pleased with him) narrated that the tribes of Ri’l, Dhakwaan, 'Usaiyah, and Banee Lihyaan asked Allah's Messenger ﷺ to assist them with some men to support them against their enemy. He therefore provided them with seventy men from the Ansaar whom we used to call Al-Qurraa' (the reciters) in their lifetime. They used to collect wood by daytime and pray at night. When they were at the well of Ma'oonah, they took them by surprise and killed them. When this news reached the Prophet ﷺ he performed al-Qunoot for one month during the Fajr prayer, invoking curse upon some of the Arab tribes, namely upon Ri’l, Dhakwaan, 'Usaiyah, and Bani Lihyaan.’", "Anas further stated, ‘We used to read an ayah of the Quran revealed in their connection, but later the ayah was lifted.’ It reads, ‘Convey to our people on our behalf that we have met Our Lord, and He is pleased with us, and has made us pleased.’ In a narration of al-Bukhaaree, it is reported: ‘That those seventy people of al-Ansaar were killed at the Well of Ma’oonah.’” Anas ibn Maalik narrates, stating, “A group of people came to the Prophet ﷺ and said, ‘Send with us men that can teach us the Quran and the Sunnah.", "Hence, he ﷺ sent to them seventy men from the Ansaar, who were called the Qurraa’ (the reciters). Amongst them was my maternal uncle, Haraam. They were known for reading the Quran and studying it amongst themselves, by night, and during the day, they would bring the water and place it in the mosque; and they would collect wood, sell it, and buy with its proceeds food for the people of as-Suffah and the poor. The Prophet ﷺ sent them to teach them the Quran and Sunnah. However, it turned out to be a plot, so they ambushed them and killed them before they reached the destination.", "Amid all this, after finding that they were deceived, they supplicated, ‘O Allah, convey to our Prophet on our behalf that we have met You. We became pleased with you, and you also became pleased with us.’ Anas says, “A person came to Haraam - the uncle of Anas – from behind him and stabbed him with a spear until he caused it to go through. Haraam said, “I have succeeded by the Lord of the Ka’bah!” The Messenger of Allah ﷺ told his Companions, “Your brothers have been killed and they said, ‘O Allah, convey our Prophet on behalf of us, that we have indeed met You, we are pleased with You, and You are pleased with us.’”"], "src_en": "https://dorar.net/en/history?page=5"}, {"seq": 63, "stage": 6, "title": "غَزوةُ بني النَّضيرِ", "date": "ربيع الأول 4 هـ، الموافق 625م", "place": "ديار بني النضير", "lat": 24.43, "lng": 39.65, "approx": false, "zoom": 11, "paras": ["كان سببُها أنَّه لمَّا قُتِلَ أصحابُ بِئرِ مَعونةَ مِن أصحابِ رسولِ الله صلى الله عليه وسلم، وكانوا سبعين، وأَفْلَتَ منهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عَمر</span>ُو بنُ أُميَّةَ الضَّمريُّ، فلمَّا كان في أَثناءِ الطَّريقِ راجعًا إلى المدينةِ قَتَلَ رجُلينِ مِن بني عامرٍ، وكان معهما عهدٌ مِن رسولِ الله صلى الله عليه وسلم وأَمانٌ لم يَعلَمْ به <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عَمر</span>ٌو، فلمَّا رجَع أَخبرَ رسولَ الله صلى الله عليه وسلم...", "فخرج رسولُ الله صلى الله عليه وسلم إلى بني النَّضيرِ يَستَعينُهم في دِيَةِ ذَيْنِكَ الرَّجلينِ، وكانت مَنازِلُ بني النَّضيرِ ظاهِرَ المدينةِ على أَميالٍ منها شَرقِيَّها. قال محمَّدُ بنُ إسحاقَ بنِ يَسارٍ في كتابِه السِّيرة: ثمَّ خرج رسولُ الله إلى بني النَّضيرِ، يَستَعينُهم في دِيَةِ ذَيْنِكَ القَتيلَينِ مِن بني عامرٍ، اللَّذينِ قَتَلَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عَمر</span>ُو بنُ أُميَّةَ الضَّمريُّ؛ للجِوارِ الذي كان رسولُ الله صلى الله عليه وسلم عقَد لهما....", "فلمَّا أتاهُم رسولُ الله صلى الله عليه وسلم يَستَعينُهم في دِيَةِ ذَيْنِكَ القَتيلينِ قالوا: نعم، يا أبا القاسمِ، نُعينُك على ما أَحببتَ، ممَّا اسْتعَنتَ بِنا عليه. ثمَّ خلا بعضُهم ببعضٍ فقالوا: إنَّكم لن تَجِدوا الرَّجلَ على مِثلِ حالِه هذه -ورسولُ الله صلى الله عليه وسلم إلى جَنبِ جِدارٍ مِن بُيوتِهم- فَمَن رجلٌ يَعلو على هذا البيتِ، فيُلقي عليه صَخرةً، فيُريحُنا منه؟ فانْتدَب لذلك <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عَمر</span>ُو بنُ جَحَّاشِ بنِ كعبٍ أحدُهم، فقال: أنا لذلك.", "فصعَدَ ليُلقِيَ عليه صَخرةً كما قال، ورسولُ الله صلى الله عليه وسلم في نَفَرٍ مِن أصحابِه، فيهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بكرٍ</span> <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">وعُمَرُ</span> <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">وعليٌّ رضي الله</span> عنهم. فأتى رسولَ الله صلى الله عليه وسلم الخبرُ مِن السَّماءِ بما أراد القومُ، فقام وخرج راجعًا إلى المدينةِ، فلمَّا اسْتَلْبَثَ النَّبيَّ صلى الله عليه وسلم أصحابُه قاموا في طَلبِه فلَقوا رجلًا مُقبِلًا مِنَ المدينةِ، فسألوهُ عنه، فقال: رأيتُه داخلًا المدينةَ.", "فأقبل أصحابُ رسولِ الله صلى الله عليه وسلم حتَّى انتهوا إليه، فأخبرَهُم الخبرَ بما كانت يَهودُ أرادت مِنَ الغَدْرِ به، وأمَر رسولُ الله صلى الله عليه وسلم بالتَّهَيُّؤِ لِحربِهم والمَسيرِ إليهم. ثمَّ سار حتَّى نزل بهم فتَحصَّنوا منه في الحُصون، فأمَر رسولُ الله صلى الله عليه وسلم بقطعِ النَّخلِ والتَّحريقِ فيها.", "فنادوهُ: أن يا محمَّدُ، قد كنتَ تَنهى عن الفسادِ وتَعيبُه على مَن صنَعه، فما بالُ قطعِ النَّخلِ وتَحريقِها؟! وقد كان رَهْطٌ مِن بني عَوفِ بنِ الخَزرجِ، منهم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayy\">عبدُ الله بنُ أُبَيٍّ بن</span> ابنُ سَلولَ، ووَديعَةُ، ومالكُ بنُ أبي قَوْقَلٍ، وسُوَيدٌ، وداعِسٌ، قد بعثوا إلى بني النَّضيرِ: أنِ اثْبُتوا وتَمَنَّعوا فإنَّا لن نُسْلِمَكُم، إن قوتِلْتُم قاتلنا معكم، وإن أُخرِجتُم خَرَجنا معكم فتَرَبَّصوا ذلك مِن نَصرِهم، فلم يفعلوا، وقذف الله في قلوبهم الرُّعبَ، فسألوا رسولَ الله صلى الله عليه وسلم أن يُجْلِيَهم ويَكُفَّ عن دِمائهِم، على أنَّ لهم ما حمَلتِ الإبلُ مِن أموالهِم، إلَّا الحَلَقَةَ، ففعَل، فاحتملوا مِن أموالهم ما اسْتقلَّتْ به الإبلُ، فكان الرَّجلُ منهم يَهدِم بيتَه عن نِجافِ بابِه، فيضَعُه على ظهرِ بَعيرهِ فينطلِقُ به، فخرجوا إلى خيبر، ومنهم مَن سار إلى الشَّامِ، وخَلَّوْا الأموالَ إلى رسولِ الله صلى الله عليه وسلم، فكانت لِرسولِ الله خاصَّةً)، وقد ثبَت في البُخاريِّ أنَّ النَّبيِّ صلى الله عليه وسلم قد أَجلى بني النَّضيرِ. وفيهم نزلت سورةُ الحَشْرِ."], "url": "https://dorar.net/history/event/76", "route": null, "stations": null, "title_en": "The Battle of Banoo An-Nadeer", "date_en": "Rabi al-Awwal 4 AH (625 CE)", "place_en": "Banu al-Nadir", "summary_en": "Banu al-Nadir plotted against the Prophet ﷺ while he was visiting them, breaking their covenant. They were besieged and expelled from Madinah.", "people": ["abubakr", "umar", "ali", "ubayy"], "dorar": 76, "asbab": [{"id": "TAF-31", "k": "d"}, {"id": "ASB-036", "k": "d"}, {"id": "TAF-02", "k": "d"}], "body_en": ["Its cause was that when the seventy Companions were attacked and killed near the Well of Ma’oonah, ‘Amr ibn Umayyah ad-Damuree managed to escape the slaughter. On his way back to al-Madeenah, he killed two men from Banoo ‘Aamir without knowing that they had with them a covenant and safety agreement from the Messenger of Allah ﷺ. Upon his arrival to al-Madeenah, he informed the Messenger of Allah ﷺ of the incident. The Messenger of Allah left to meet Banoo an-Nadeer in order to contribute to the blood money of those two men pursuant to the protection agreement that they signed with the Muslims.", "When the Messenger of Allah ﷺ asked them to contribute to the blood money of those two killed men, they agreed and assured him that they will fulfil his request. However, some of them confided with others and said, ‘Verily, you will never find the man in this state of his [without protection] - while the Messenger of Allah ﷺ was standing towards a wall of their houses! Who will ascend the house and throw a boulder on him, thus giving us a rest from him?’ ‘Amr ibn Jahhaash ibn Ka’b, one of them, got ready for this task and remarked, ‘I am ready for that.’", "He went up to throw the boulder on the Prophet as he verbally promised, while the Messenger of Allah ﷺ was in a group of his Companions, among whom were Aboo Bakr, ‘Umar, and ‘Ali (may Allah be pleased with them). The Messenger of Allah ﷺ received the news from the sky about their plot and intent to assassinate him; thus, he stood up and returned to Al-Madeenah. When his Companions found the Prophet ﷺ taking time, they stood up in search for him. They met a man coming from al-Madeenah, they asked him about his whereabouts.", "He replied, ‘I saw him entering al-Madeenah. The Companions of the Messenger of Allah ﷺ proceeded until they reached him, and he informed them about the treason which the Jews intended to carry out against him. Then, the Messenger of Allah ﷺ ordered to prepare for their war and then proceeded towards them. The Jews protected themselves from him in their fortresses. The Messenger of Allah ﷺ commanded to cut the date-palm trees and burn them. They shouted, ‘O Muhammad, you forbid from corruption and criticise the one who does it, so what about cutting and burning palm trees?!’", "A group among Banoo ‘Awf of the tribe of al-Khazraj comprising of Abdullah ibn ‘Ubay ibn Salool, Wadee’ah, Maalik ibn Aboo Qawqal, Suwayd, and Daa’is had sent a message to Banoo an-Nadeer that ‘stay put and be entrenched, we will not entrust you [to the enemy]; if you are fought against, then we will fight alongside you, if you are taken out, we will leave with you.’ They eagerly waited for their help, but they failed to do so, and Allah casted terror in their hearts. They requested the Messenger of Allah ﷺ to deport them and stop from committing their bloodshed on the conditions that they possess what the camels can carry of their wealth apart from arms.", "The Prophet ﷺ accepted that. They varied their wealth which the camels found little. A man among them would demolish his house from the top side of his door and would place the contents on the back of his camel and would proceed with that. They left for Khaybar. Some of them went to the Levant (ash-Sham). They left their wealth with the Messenger of Allah ﷺ and thus, their wealth was specifically for the Messenger of Allah ﷺ. It is established in al-Bukhaaaree that the Prophet ﷺ deported Banoo an-Nadeer. And Surah al-Hashr was revealed concerning them."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 64, "stage": 6, "title": "غزوة بدر الموعد (بدر الثانية)", "date": "شعبان 4 هـ، الموافق 626م", "place": "بدر", "lat": 23.78, "lng": 38.79, "approx": false, "zoom": 8, "paras": ["تُسمَّى هذه الغزوةُ ببدرٍ الآخِرةِ، وبَدرٍ الصُّغرى، وبدرٍ الثانيةِ، وبدرٍ المَوعِدِ؛ للمواعَدةِ عليها مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبي سُفيانَ</span> بنِ حربٍ يومَ أُحدٍ؛ وذلك أن <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبا سفيان</span> لمَّا انصَرَف منِ أُحدٍ نادى: \"إنَّ مَوعِدَكم بَدرٌ، العامَ المُقبِلَ\". فلمَّا كانتِ السَّنةُ الرابِعةُ من الهِجرةِ، خَرَج الرسولُ صلَّى اللهُ عليه وسلَّم بألفٍ وخَمسِمئةٍ من أصحابِه إلى بدرٍ ومعه عَشَرةُ أفراسٍ، وحَمَل لِواءَه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ali\">عليُّ بن أبي طالِبٍ</span> رَضي اللهُ عنه، وذلك في انتِظارِ قُدومِ قُرَيشٍ حَسَبَ المَوعِدِ المُحدَّدِ منذ وَقعةِ أُحُدٍ مع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبي سُفيانَ</span> زعيمِ قُريشٍ.", "وانتَظَرَ المسلمون ثمانيةَ أيَّامٍ دونَ أن تَقدَمَ قُرَيشٌ، وكان <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abusufyan\">أبو سُفيانَ</span> قد خَرَج بألفينِ ومعهم خمسون فرسًا، فلمَّا وَصَلوا مرَّ الظَّهرانِ على أربعينَ كَيلًا مِن مكةَ عادوا بحُجَّةِ أنَّ العامَ عامُ جَدبٍ، وكان لإخلافِهِمُ المَوعِدَ أثرٌ في تقويةِ مكانةِ المسلمين وإعادةِ هَيبَتِهم.", "وقد واصَلَ المسلمون إرسالَ سَراياهم إلى الأنحاءِ المُختَلِفةِ من نَجدٍ والحِجازِ لتَأديبِ الأعرابِ، فقاد <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبو عُبيدةَ</span> بنُ الجرَّاحِ سَريَّةً إلى طيِّئٍ وأسَدٍ بنَجدٍ، فتَفَرَّقوا في الجبالِ دونَ أن يقعَ قتالٌ. وقاد الرسولُ صلَّى اللهُ عليه وسلَّم جَيشًا من ألفِ مُقاتِلٍ في شهرِ ربيعٍ الأوَّلِ من سنةِ خَمسٍ باتِّجاهِ دُومةِ الجَندَلِ، وقد بَلَغه وُجودُ تَجمُّعٍ للمُشرِكين بها، ولكِنَّ الجَمعَ تفرَّق عندما عَلِموا بقُدومِ المسلمين الذين أقاموا أيَّامًا في المِنطَقةِ بَثُّوا خِلالَها السَّرايا، فلم يَلقَوا مُقاومةً ورَجَعوا إلى المدينةِ بعد أن وادَعَ في العَودةِ عُيينةَ بنَ حِصنٍ الفَزاريَّ."], "url": "https://dorar.net/history/event/78", "route": null, "stations": null, "title_en": "The Battle of Second Badr (Badr al-Maw’id)", "date_en": "Shaban 4 AH (626 CE)", "place_en": "Badr", "summary_en": "Keeping the appointment Abu Sufyan had made at Uhud, the Prophet ﷺ marched to Badr, but Quraysh turned back and no battle took place.", "people": ["abusufyan", "ali", "abuubayda"], "dorar": 78, "asbab": [{"id": "TAF-05", "k": "d"}], "body_en": ["This military expedition is known as the last battle of Badr, the minor battle of Badr, the second battle of Badr, and the battle of appointment, due to the appointment for it with Aboo Sufyan ibn Harb on the Battle of Uhud when Aboo Sufyan proclaimed, “We will meet again in Badr, next year.” In the fourth year of emigration, the Prophet ﷺ assembled an army of 1500 soldiers with ten horses, and headed towards Badr, and the bearer of the banner was ‘Ali ibn Aboo Talib (may Allah be pleased with him). The military detachment headed there to encounter Quraysh according to the specified appointment that was made by Aboo Sufyan, the leader of Quraish, after the Battle of Uhud.", "The Muslims waited for eight days but without any sign of Quraysh. Meanwhile, Aboo Sufyan left Makkah with two thousand soldiers and fifty horses. When they reached Marr ad-Dhahraan, forty miles away from Makkah, they returned under the pretext that the year is a drought-stricken year! Their failure to fulfil the appointment had the effect of strengthening the position of Muslims and restoring their prestige and influence. The Muslims continued to send their expeditions to different parts of Najd and Hijaaz to discipline the nomads.", "Aboo Ubaydah ibn Al-Jarraah led an expedition to fight the tribes of Tay’ and Asad in Najd, who fled in panic and dispersed in the mountains without a fight occurring. The Prophet ﷺ led an army of one thousand fighters in the month of Rabee’ al-Awwal of the fifth year of migration. The army marched to Doomat al-Jandal after the news reached the Prophet ﷺ that the large number of disbelievers are stationed there. However, the disbelievers fled the location upon hearing that the Muslims are approaching them. The Muslims stationed in the location for days and the Prophet ﷺ sent out many brigades in their pursuit. There was no resistance or whatsoever; thus, the Muslims returned to al-Madeenah after they made peace with ‘Uyaynah ibn Hisn al-Fazaaree."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 65, "stage": 7, "title": "غزوة دومة الجندل", "date": "ربيع الأول 5 هـ، الموافق 626م", "place": "دومة الجندل", "lat": 29.81, "lng": 39.868, "approx": false, "zoom": 8, "paras": ["كانت غزوةُ دُومةِ الجَندلِ -موضِعٍ على طَرَفِ الشَّامِ بينها وبين دمشقَ خمسَ لَيالٍ، وبينها وبين المدينةِ خمسَ عشرةَ أو سِتَّ عشرةَ لَيلةً- في ربيعٍ الأوَّلِ من السَّنةِ الخامسةِ للهِجرةِ. وسَبَبُها: أنَّ رسولَ الله صلَّى اللهُ عليه وسلَّم بَلَغه أنَّ بدُومةِ الجَندَلِ جَمعًا كثيرًا من القبائِلِ، وأنَّهم يَظلِمون مَن مرَّ بِهِم، ويَنهَبون ما معهم، وأنَّهم يُريدون أن يَدْنوا من المدينةِ لمُهاجَمَتِها؛ فنَدَب رسولُ الله صلَّى اللهُ عليه وسلَّم النَّاسَ، واستَخلَف على المدينةِ سِباعَ بنَ عُرفُطةَ الغِفاريَّ، وخَرَج رسولُ الله صلَّى اللهُ عليه وسلَّم في ألفٍ مِن المسلمين، فكانوا يَسيرون اللَّيلَ، ويَكمُنون -يَستَتِرون- النَّهارَ، ومعه صلَّى اللهُ عليه وسلَّم دليلٌ له من بني عُذْرةَ يقال له: (مَذكورٌ)؛ فلمَّا دَنَوا من دُومةِ الجَندلِ، هَجَموا على ماشيَتِهِم ورُعاتِهم، فأصابوا ما أصابوا منهم، وهَرَب مَن هَرَب في كلِّ وَجهٍ؛ فلمَّا عَلِمَ أهلُ دُومةِ الجَندَلِ تَفرَّقوا، ونَزَل رسولُ الله صلَّى اللهُ عليه وسلَّم بساحَتِهِم فلم يَجِد بها أحدًا؛ فأقام بها أيامًا وبثَّ السَّرايا وفَرَّقَها، فرَجَعَت ولم تُصِب منهم أحدًا، وأُخِذ منهم رجلٌ؛ فسَأله رسولُ الله عنهم، فقال: هَرَبوا حين سَمِعوا أنَّك أخذْتَ نَعَمَهم؛ فعَرَض عليه الإسلامَ فأسلَمَ، ثم رَجَع رسولُ الله صلَّى اللهُ عليه وسلَّم إلى المَدينةِ، ولم يَلْقَ كَيدًا."], "url": "https://dorar.net/history/event/80", "route": null, "stations": null, "title_en": "The Expedition of Doomat al-Jandal", "date_en": "Rabi al-Awwal 5 AH (626 CE)", "place_en": "Dumat al-Jandal", "summary_en": "The Prophet ﷺ marched to Dumat al-Jandal, near Syria, after hearing that tribes there were attacking travellers and planning to approach Madinah; they fled before he arrived.", "people": [], "dorar": 80, "asbab": [], "body_en": ["The military campaign of Doomat al-Jandal – a place on the boarders of al-Shaam, it is situated at the distance of five nights journey from Damascus, and sixteen- or seventeen-nights journey from al-Madeenah – happened in Rabee’ al-Awwal of the fifth year after migration. The reason behind it: The Messenger of Allah ﷺ learned that there was a large group of tribes at Doomat al-Jandal, that they oppressed anyone who passes by them and confiscated what they have with them; and that they planned to attack to al-Madeenah.", "The Messenger of Allah ﷺ got the people ready and appointed Sibaa’ ibn ‘Urfutah al-Ghifaaree to govern Al-Madeenah. The Messenger of Allah ﷺ departed in a group of one thousand Muslims. They used to travel by night and hide by day. He ﷺ had taken his guide from Banoo ‘Udhrah, a man known of the name Madhkoor. When they got closer to Doomat al-Jandal, they raided their livestock and shepherds, and they acquired whatever they got, and those who could flee fled in all directions. When the people of Doomat al-Jandal learned about this, they dispersed.", "The Messenger of Allah ﷺ reached their position and found no one there. He ﷺ remained there for days and he dispatched brigades in all directions in their pursuit, but they returned without capturing anyone among them, except a man amongst them that was taken into custody. The Messenger of Allah ﷺ asked him about them. He replied, “They ran away when they heard that you took their animals away. The Prophet ﷺ presented Islam to him, and he accepted it. Then the Messenger of Allah ﷺ returned to al-Madeenah without facing any resistance or fighting."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 66, "stage": 7, "title": "غزوة بني المصطلق (المريسيع)", "date": "شعبان 5 هـ، الموافق 627م", "place": "المريسيع", "lat": 22.4, "lng": 39.2, "approx": true, "zoom": 8, "paras": ["بَلَغ رسولَ الله صلَّى اللهُ عليه وسلَّم أن بني المُصطَلِقِ -وهم بَطنٌ من قَبيلةِ خُزاعةَ الأزديَّةِ اليَمانيَّةِ- يَجمَعون لقِتالِه، وقائِدُهمُ الحارِثُ بن أبي ضِرارٍ؛ فلمَّا سَمِع رسولُ الله صلَّى اللهُ عليه وسلَّم بهم خَرَج إليهم حتَّى لَقيَهم على ماءٍ لهم يُقال له: (المُرَيسيعُ)، ولذلك تُسَمَّى هذه الغَزوةُ أيضًا: بغَزوةِ المُرَيسيعِ.", "فتَزاحَفَ النَّاسُ واقتَتَلوا، فهَزَمَ اللهُ بني المُصطَلِقِ وقُتِلَ مَن قُتِلَ منهم، ونَفَلَ رسولَ الله صلَّى اللهُ عليه وسلَّم أبناءَهم ونِساءَهم وأموالَهم فأفاءَهم عليه، وكان فيمَن سُبي جُوَيريةُ رَضي اللهُ عنها بنتُ الحارِثِ بنِ أبي ضِرارٍ سيِّدِ بني المُصطَلِقِ، التي تزوَّجَها رسول الله صلَّى اللهُ عليه وسلَّم حين جاءَته تَستَعينُه في كِتابَتِها، وجَعَل صَداقَها رَضي اللهُ عنها أربَعينَ أسيرًا مِن قَومِها، فأعتَقَ النَّاسُ ما بأيديهِم من الأسرَى؛ لمَكانِ جُويريةَ رَضي اللهُ عنها.", "وأثناءَ الرُّجوعِ من هذه الغَزوةِ تكلَّم أهلُ الإفكِ بما تَكَلَّموا به في حقِّ أُمِّ المؤمنين <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائِشةَ</span> رَضي اللهُ عنها، الصِّدِّيقةِ بنتِ الصِّدِّيقِ المُبَرَّأةِ من فَوقِ سَبعِ سمواتٍ. وفيها أيضًا قال ابنُ أبيٍّ ابنُ سَلولَ قَوْلَتَه: \"لَئِن رَجَعنا إلى المَدينةِ ليُخرِجَنَّ الأعَزُّ منها الأذَلَّ!\"، فسَمِعَه زيدُ بن أرقَمَ، ونَزَلت سورةُ \"المنافقون\"."], "url": "https://dorar.net/history/event/83", "route": null, "stations": null, "title_en": "The Expedition of Banoo al-Mustaliq (al-Maraysee’)", "date_en": "Shaban 5 AH (627 CE)", "place_en": "Al-Muraysi", "summary_en": "Hearing that Banu al-Mustaliq of Khuza'ah were gathering against him, the Prophet ﷺ marched to al-Muraysi and defeated them.", "people": ["aisha"], "dorar": 83, "asbab": [{"id": "ASB-040", "k": "d"}], "body_en": ["The Messenger of Allah ﷺ received the news that Banoo al-Mustaliq – who are a branch of the Yemeni Azdee tribe of Khuzaa’ah – were assembling to fight against him under the command of al-Haarith ibn Aboo Diraar. When the Messenger of Allah ﷺ heard about them, he dispatched a military campaign to fight them. He marched until he found them at a water source belonging to them called al-Muraysi’, because of which, this campaign has become known as the expedition of al-Muraysi’. There, people moved forward to attack, and they fought each other.", "Allah gave Banoo al-Mustalaq defeat and those who were to be killed were killed. The Messenger of Allah ﷺ acquired their children, wives and wealth as booty and Allah made them over to him as gains. Among those imprisoned was Juwairiyyah (may Allah be pleased with her) the daughter of al-Haarith ibn Aboo Diraar, the leader of the tribe of Banoo al-Mustalaq. The Messenger of Allah ﷺ married her after she approached him to seek help in her contract to purchase freedom. He made the freedom of forty prisoners of her people as her wedding-gift.", "Upon which, the Muslims freed the prisoners they possessed because of the status of Juwairiyyah (may Allah be pleased with her). During the return from this military campaign, the people of slander spoke ill of ‘Aishah (may Allah be pleased with her), the most truthful, the daughter of the most truthful, whose innocence was proclaimed from above the seven heavens. Concerning her, Ibn Ubayy ibn Salul made the remark: “If we return to al-Madeenah, the honourable will definitely expel the inferior.” [Al-Munafiqoon: 8]. Zayd ibn Arqam heard his statement and Surah al-Munafiqoon was revealed in this regard."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 67, "stage": 7, "title": "حادِثةُ الإفْكِ", "date": "5 هـ، الموافق 626م", "place": "المريسيع", "lat": 22.4, "lng": 39.2, "approx": true, "zoom": 8, "paras": ["لمَّا خرَج النَّبيُّ صلى الله عليه وسلم إلى بني المُصطلِقِ لِغَزوِهِم أَقرعَ بين نِسائِه مَن يَخرُج معه، فكانت القُرعَةُ على <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> الطَّاهرةِ رضي الله عنها وأَرضاها، وفي طريقِ العَودةِ كانت تُحمَلُ على هَودجٍ، فقدَّرَ الله في ذلك اليومِ أن تكونَ خارجَ هَودَجِها لِتبحثَ عن عِقْدٍ سقَط منها، فلمَّا أرادوا الرَّحيلَ لم يَشعُروا بعدمِ وُجودِها ورَحلوا؛ فقد كانت صَغيرةً خَفيفةَ الوَزنِ، فلمَّا رجعت لم تَرَهُم.", "قالت <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span> رضِي الله عنها: (فتَيَمَّمْتُ مَنزلي الذي كنتُ فيه، وظَننتُ أنَّ القومَ سَيفْقِدوني فيَرجِعون إليَّ، فبينا أنا جالسةٌ في مَنزلي غَلبتْني عَيني فنِمْتُ، وكان صَفوانُ بنُ المُعَطَّلِ السُّلميُّ ثمَّ الذَّكْوانيُّ قد عَرَّسَ مِن وَراءِ الجيشِ فأَدْلَجَ، فأصبحَ عند مَنزلي فرَأى سَوادَ إنسانٍ نائمٍ، فأتاني فعَرفَني حين رآني، وقد كان يَراني قبلَ أن يُضرَبَ الحِجابُ عَليَّ، فاسْتيقَظتُ بِاسْتِرجاعِه حين عَرفَني، فخَمَّرتُ وجهي بِجِلبابي، ووالله ما يُكلِّمُني كَلمةً، ولا سمِعتُ منه كَلمةً غيرَ اسْتِرجاعِه، حتَّى أناخ راحلتَه، فوَطِئَ على يَدِها فرَكِبتُها، فانطلق يَقود بي الرَّاحلةَ، حتَّى أَتينا الجيشَ، بعدما نزلوا مُوغِرين في نَحْرِ الظَّهيرةِ، فهلَك مَن هلَك في شأني، وكان الذي تَولَّى كِبْرَهُ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ubayy\">عبدُ الله بنُ أُبَيٍّ بن</span> ابنُ سَلولَ،...) فاتَّهموها مع صَفوانَ وبدَأ هذا الإفكُ المُبينُ يَنتشِرُ في المدينةِ، وبَقِيتْ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span> شهرًا لا تعلمُ شيئًا عن ذلك، حتَّى عَلِمتْ بذلك صَراحةً مِن أمِّ مِسْطَحٍ، وكُلُّ ذلك ولم تَتَبيَّنْ الحقيقةُ، ثمَّ نزلت آياتٌ تُتْلى إلى يومِ القيامةِ مِن قولِه تعالى: <span class=\"verse\">﴿إِنَّ الَّذِينَ جَاءُوا بِالْإِفْكِ عُصْبَةٌ مِنْكُمْ لَا تَحْسَبُوهُ شَرًّا لَكُمْ بَلْ هُوَ خَيْرٌ لَكُمْ﴾</span> <span class=\"ref\">[النور: ١١]</span> إلى قوله: <span class=\"verse\">﴿وَلَكِنَّ اللَّهَ يُزَكِّي مَنْ يَشَاءُ وَاللَّهُ سَمِيعٌ عَلِيمٌ﴾</span> <span class=\"ref\">[النور: ٢١]</span> آياتٌ تُبرِّئُ الطَّاهرةَ المُطَهَّرةَ ممَّا افْتَراهُ المُفتَرون."], "url": "https://dorar.net/history/event/79", "route": null, "stations": null, "title_en": "The False Accusation of Adultery Levied Against ‘Aishah (May Allah Be Pleased with Her)", "date_en": "5 AH (626 CE)", "place_en": "Al-Muraysi", "summary_en": "On the way back from Banu al-Mustaliq, Aishah was left behind while searching for a lost necklace. Hypocrites spread a slander about her, until Allah revealed her innocence in Surah An-Nur.", "people": ["aisha", "ubayy"], "dorar": 79, "asbab": [{"id": "ASB-041", "k": "d"}, {"id": "ASB-042", "k": "d"}, {"id": "ASB-043", "k": "d"}, {"id": "TAF-23", "k": "d"}], "body_en": ["When the Prophet ﷺ headed to Banoo al-Mustaliq to combat them, he ﷺ drew lots between his wives to ascertain who will leave with him. The one who was chosen by lot was ‘Aishah, the Pure, may Allah be pleased with her and may He please her. On the return journey she was being carried on a howdah. That day, Allah predestined that she be outside her howdah in search for a necklace that fell from her. When they intended to set out again on a journey, they did not notice her absence and that she was not inside her howdah because she was small and light in weight, so they set out.", "When she returned, she did not see them. ‘Aishah, may Allah pleased with her, recalled that day and said, “I intended to go to my halting place where I was stationed, and I thought the people will look for me and return to me. As I was seated at my halting place, my eyes overpowered with drowsiness, and I slept. Safwaan ibn al-Mu’attal as-Sulamee, then known as adh-Dhakwani had encamped behind the army. He set out at nightfall and reached my halting place in the morning; he saw the shadow of a sleeping person. He came to me and recognised me when he saw me. He used to see me before the Hijab was imposed on me. I woke up upon hearing his statement “Indeed we belong to Allah and indeed we will return to Him” when he recognised me, thus, I covered my face with my Jilbaab. By Allah, he did not speak to me a word and I did not hear a word from him except the statement of “Indeed we belong to Allah and indeed we will return to Him”. He made his camel kneel and he pressed the camel's foreleg, and I amounted the camel.", "He moved forward by driving the camel until we arrived at the army where it had encamped for rest in the first part of the midday. Woe betide those who destroyed themselves by slandering me, and the haughtiest among them was ‘Abdullah ibn ‘Ubayy, ….” They accused her of committing adultery with Safwaan, thus this plain slander started spreading in al-Madeenah. ‘’Aishah (may Allah be pleased with her) remained in that state not knowing anything about it, until she learned about it from Umm Mistah. With all this, the full reality was still unapparent.", "Thereafter, some ayaat were revealed which will remain recited until the Day of Judgement from the divine statement: {Indeed, those who came with falsehood are a group among you. Do not think it bad for you; rather, it is good for you.} [An-Nur: 11] to Allah’s statement: {But Allah purifies whom He wills, and Allah is Hearing and Knowing.} [An-Nur: 21], the ayaat that pronounced the Pure and Purified Lady innocent from the slander which the slanderers had fabricated."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 68, "stage": 7, "title": "غَزوةُ الخَندَقِ (الأَحزابِ)", "date": "شوال 5 هـ، الموافق 627م", "place": "الخندق", "lat": 24.477, "lng": 39.6, "approx": false, "zoom": 11, "paras": ["كان سببُ هذه الغَزوةِ هو إجلاءُ يَهودِ بني النَّضيرِ مِنَ المدينةِ؛ حيثُ إنَّ الحسدَ والحِقدَ قد تَمكَّنا مِن قُلوبهِم، ممَّا جعَلهم يُضمِرون العَداءَ ويَتَحَيَّنون الفُرصَ للتَّشفِّي ممَّن طَردَهم مِنَ المدينةِ وما حولها. ولمَّا لم يَستطِعْ يَهودُ خَيبرَ وخاصَّةً بني النَّضيرِ مَجابهةَ المسلمين لَجأوا إلى أُسلوبِ المكرِ والتَّحريشِ.", "وقد ذكَر ابنُ إسحاقَ بِسَندِهِ عن جماعةٍ: أنَّ الذين حَزَّبوا الأحزابَ نفرٌ مِنَ اليَهودِ، وكان منهم: سَلَّامُ بنُ أبي الحُقَيْقِ، <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"huyayy\">وحُيَيُّ بنُ أَخْطَبَ</span> النَّضْريُّ، وكِنانةُ بنُ أبي الحُقَيْقِ النَّضْريُّ، وهَوْذَةُ بنُ قَيسٍ الوائليُّ، وأبو <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ammar\">عَمَّارٍ</span> الوائليُّ، في نَفرٍ مِن بني النَّضيرِ، فلمَّا قَدِموا على قُريشٍ، دَعَوْهُم إلى حربِ رسولِ الله صلى الله عليه وسلم وقالوا: إنَّا سَنَكون معكم عليه حتَّى نَسْتَأْصِلَهُ، فقالت لهم قُريشٌ: يا مَعشرَ يَهودَ، إنَّكم أهلُ الكتابِ الأوَّلِ والعِلْمِ بما أصبحنا نَختلِفُ فيه نحن ومحمَّدٌ، أَفَدينُنا خيرٌ أم دينُه، قالوا: بل دينُكم خيرٌ مِن دينِه، وأنتم أَولى بالحقِّ منه !!! واختلف العُلماءُ في زمنِ وُقوعِ هذه الغَزوةِ، فمال البُخاريُّ إلى قولِ موسى بنِ عُقبةَ: إنَّها كانت في شوَّالٍ سنةَ أَربعٍ، بينما ذَهبتْ الكثرةُ الكاثرةُ إلى أنَّها كانت في سنةِ خمسٍ، قال الذَّهبيُّ: وهو المقطوعُ به.", "وقال ابنُ القَيِّمِ: وهو الأصحُّ. قام النَّبيُّ صلى الله عليه وسلم وأصحابُه رضي الله عنهم بِحَفرِ خَندقٍ في المنطقةِ المكشوفةِ أمامَ الغُزاةِ، وذكَر ابنُ عُقبةَ: أنَّ حَفرَ الخندقِ استغرقَ قريبًا مِن عِشرين ليلةً. وعن أنسٍ رضي الله عنه قال: خرَج رسولُ الله صلى الله عليه وسلم إلى الخندقِ، فإذا المهاجرون والأنصارُ يَحفُرون في غَداةٍ باردةٍ، فلم يكنْ لهم عَبيدٌ يعملون ذلك لهم، فلمَّا رأى ما بهم مِنَ النَّصَبِ والجوعِ قال: اللَّهمَّ إنَّ العَيْشَ عَيْشَ الآخِرهْ، فاغْفِرْ للأنصارِ والمُهاجِرهْ، فقالوا مُجِيبينَ له: نحن الذين بايَعوا محمَّدًا...", "على الجِهادِ ما بَقِينا أبدًا. وعن البَراءِ رضي الله عنه قال: لمَّا كان يومُ الأحزابِ، وخَنْدَقَ رسولُ الله صلى الله عليه وسلم، رأيتُه يَنقُلُ مِن تُرابِ الخَندقِ، حتَّى وارى عَنِّي الغُبارُ جِلدةَ بَطنِه، وكان كَثيرَ الشَّعرِ، فسَمِعتُه يَرتجِزُ بِكلماتِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">ابنِ رَواحةَ</span>، وهو يَنقُلُ مِنَ التُّرابِ يقولُ: اللَّهمَّ لولا أنت ما اهْتَدَيْنا...", "ولا تَصدَّقْنا ولا صَلَّيْنا، فأَنْزِلَنْ سَكينةً علينا... وثَبِّتِ الأَقدامَ إن لاقَيْنا، إنَّ الأُلى قد بَغَوْا علينا... وإن أرادوا فِتنةً أَبَيْنا. قال: ثمَّ يَمُدُّ صوتَهُ بآخِرها. وعن عائشةَ رضي الله عنها أنَّها قالت في قوله تعالى: <span class=\"verse\">﴿إِذْ جَاؤُوكُمْ مِنْ فَوْقِكُمْ وَمِنْ أَسْفَلَ مِنْكُمْ وَإِذْ زَاغَتِ الأَبْصَارُ﴾</span> كان ذاك يومَ الخَندقِ.", "وعندما وصلتِ الأَحزابُ المدينةَ فوجِئوا بوُجودِ الخَندقِ، فقاموا بِعدَّةِ مُحاولاتٍ لاقْتِحامهِ، ولكنَّهم فَشلوا. واسْتمرَّ الحِصارُ أربعًا وعِشرين ليلةً. وثَقُلَ الأمرُ على قُريشٍ بسببِ الرِّيحِ التي أَكْفَأَتْ قُدورَهُم وخِيامَهُم، كما قام المسلمون بالتَّخْذيلِ بين اليَهودِ والمشركين، فأُرْغِموا على الرَّحيلِ وهَزمهُم الله تعالى، وكف شَرَّهُم عنِ المدينةِ."], "url": "https://dorar.net/history/event/84", "route": null, "stations": null, "title_en": "The Battle of Trench", "date_en": "Shawwal 5 AH (627 CE)", "place_en": "The Trench", "summary_en": "Quraysh and allied tribes, stirred up by leaders of Banu al-Nadir, besieged Madinah with a large army. The Muslims dug a trench, and after a siege of about twenty-four nights the confederates withdrew.", "people": ["ammar", "rawaha", "huyayy"], "dorar": 84, "asbab": [{"id": "TAF-24", "k": "d"}], "body_en": ["The reason for this invasion was the eviction of the Jews of Banoo an-Nadeer from al-Madeenah; Envy and malice had gripped their hearts, which made them harbour hostility and were waiting for opportunities to feel gratified from those who expelled them from al-Madeenah and its surroundings. However, when the Jews of Khaybar, particularly the tribe of Banoo an-Nadeer, were unable to confront the Muslims, they resorted to the method of deception and intimidation. Ibn Ishaaq narrated with his chain from a group of narrators, “That those enticed and rallied the [disbelieving] parties against the Muslims were a group of Jews, and among them were them that Salaam ibn Aboo al-Huqayq, Huyayy ibn Akhtab an-Nadree, Kinaanah ibn Aboo al-Huqayq an-Nadree, Hawdhah ibn Qays al-Waaelee, Aboo ‘Ammaar al-Waaelee, in a group of Banoo Nadeer. When they came to Quraysh, they encouraged them to fight the Messenger of Allah ﷺ and said to them, “We will be with you against him until we root him out.”", "Quraysh replied to them, “O Jews, you are the people of the First Book, and you know that we have differed with Muhammad, [tell us] is our religion better than his religion?” The Jews answered, “Rather, your religion is better than his religion, and you are more deserving of the truth than he!!!” Scholars have differed about the time of the occurrence of this invasion. Al-Bukhaaree inclined to the saying of Musa ibn ‘Uqbah that It was in Shawwal in the fourth year of migration, while the great majority held the view that it was in the fifth year after migration.", "Adh-Dhahabee confirmed that the latter is the correct view, and Ibn al-Qayyim agreed with adh-Dhahabee and mentioned that it is the most correct opinion. The Prophet ﷺ dug a trench in the open area in front of the combatants. Ibn ‘Uqbah mentions, “The digging of the trench took nearly twenty nights to complete.” On the authority of Anas, may Allah be pleased with him, he said, “The Messenger of Allah ﷺ went out to the trench, and there he found the Emigrants and the Ansaar digging in a cold morning, as they had no slaves who could do that for them. When he ﷺ saw their exhaustion and hunger, he remarked, “O Allah! Indeed, the real life is the life of the Hereafter, so forgive the Ansaar and the Emigrants.” They said in response to him “We are the ones who pledged allegiance to Muhammad... for jihad as long as we live.” On the authority of Al-Baraa’, may Allah be pleased with him, he said, “On the day of the Battle of the Parties, and the Messenger of Allah ﷺ dug the trench, I saw him carrying earth out of the trench till dust made the skin of his abdomen out of my sight and he was a hairy man.", "I heard him reciting the poetic verses composed by Ibn Rawaahah while he was carrying the earth, \"“Were it not for You [Allah], we would not have been guided. Neither would we give alms, nor would we pray, so send down tranquillity upon us. And make our feet firm if we meet [the enemy], for these have transgressed against us... And if they want a strife, we have refused it.” The Prophet ﷺ would then extend his voice at the end part of last word of each line.” Narrated ‘Aishah (may Allah be pleased with her) concerning the Statement of Allah: {[Remember] when they came at you from above you and from below you, and when eyes shifted [in fear]} [Al-Ahzab: 10]: “That was the day of the Battle of the Trench.", "When the parties reached al-Madeenah, they were surprised by the presence of the trench. They made several attempts to storm it, however, they failed. The siege lasted twenty-four nights. Quraysh no longer could hold their siege due to the wind that overturned their pots and their tents, and the disappointing situation that the Muslims created between the Jews and the Quraysh. As a result, they were forced to leave, and Allah, the Almighty, defeated them, and stopped their evil from entering al-Madeenah.”"], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 69, "stage": 7, "title": "نُزولُ آيةِ الحِجابِ", "date": "ذي القعدة 5 هـ، الموافق 627م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["وكان سببُ نُزولِها أنَّ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"umar\">عُمَرَ</span> رضي الله عنه كان يَقولُ لِرسولِ الله صلى الله عليه وسلم: لو أَمرتَ نِساءَك أن يَحْتَجِبْنَ، فإنَّه يُكلِّمُهُنَّ البَرُّ والفاجرُ، فنزَل قولُه تعالى: {يَا أَيُّهَا الَّذِينَ آمَنُوا لا تَدْخُلُوا بُيُوتَ النَّبِيِّ إِلَّا أَن يُؤْذَنَ لَكُمْ... إلى قوله تعالى:..وَإِذَا سَأَلْتُمُوهُنَّ مَتَاعًا فَاسْأَلُوهُنَّ مِن وَرَاءِ حِجَابٍ ذَلِكُمْ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّ\"."], "url": "https://dorar.net/history/event/85", "route": null, "stations": null, "title_en": "The Revelation of the Ayah of Hijaab", "date_en": "Dhu al-Qadah 5 AH (627 CE)", "place_en": "Madinah", "summary_en": "After Umar urged that the Prophet's ﷺ wives be screened from visitors, verses on the hijab were revealed.", "people": ["umar"], "dorar": 85, "asbab": [{"id": "ASB-039", "k": "d"}, {"id": "TAF-26", "k": "d"}], "body_en": ["The context of its revelation is that ‘Umar, may Allah be pleased with him, used say to the Messenger of Allah ﷺ “It is a wish if you command your wives to be screened, because people, both those who are righteous and those who are wretched do speak to them. Afterwards, the divine statement of Allah was revealed, {O you who have believed, do not enter the houses of the Prophet except when you are permitted… And when you ask [his wives] for something, ask them from behind a partition. That is purer for your hearts and their hearts.} [Al-Ahzaab: 53]"], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 70, "stage": 7, "title": "غَزوةُ يَهودِ بني قُرَيْظَةَ", "date": "ذي القعدة 5 هـ، الموافق 627م", "place": "ديار بني قريظة", "lat": 24.43, "lng": 39.63, "approx": false, "zoom": 11, "paras": ["وقعَت هذه الغَزوةُ بعدَ غَزوةِ الأحزابِ مُباشرةً، وكان سببُها نقضَ بني قُريظةَ العهدَ الذي بينهم وبين النَّبيِّ صلى الله عليه وسلم بتَحريضٍ مِن <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"huyayy\">حُيَيِّ بنِ أَخطبَ</span> النَّضْريِّ. وكان النَّبيُّ صلَّى الله عليه وسلَّم قد أَرسلَ الزُّبيرَ لِمعرفةِ نِيَّتِهم، ثمَّ أَتبَعهُ بالسَّعدَيْنِ –سَعدِ بنِ عُبادةَ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saadmuadh\">وسَعدِ بنِ مُعاذٍ</span>- <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"rawaha\">وابنِ رَواحةَ</span>، وخَوَّاتِ بنِ جُبيرٍ لِذاتِ الهدفِ ليَتأكَّدَ مِن غَدرِهم.", "وقد أمَر الله تعالى نَبِيَّهُ صلى الله عليه وسلم، بقِتالِهم بعدَ عَودتِه مِنَ الخَندقِ ووَضْعِهِ السِّلاحَ، فأَوْصى عليه الصَّلاةُ والسَّلامُ أصحابَهُ أن يَتوجَّهوا إلى بني قُريظةَ، وقال لهم: (لا يُصَلِّيَنَّ أَحدُكم العَصرَ إلَّا في بني قُريظةَ). كما في رِوايةِ البُخاريِّ، أو (الظُّهرَ) كما في رِوايةِ مُسلمٍ.", "فضرَب الرَّسولُ صلى الله عليه وسلم الحِصارَ على بني قُريظةَ لمُدَّةِ خمسٍ وعِشرين ليلةً على الأرجحِ، حتَّى نزلوا على حُكمِ الرَّسولِ صلى الله عليه وسلم، فأَحَبَّ أن يَكِلَ الحُكمَ عليهم إلى واحدٍ مِن رُؤساءِ الأَوْسِ؛ لأنَّهم كانوا حُلفاءَ بني قُريظةَ، فجعل الحُكمَ فيهم إلى <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saadmuadh\">سعدِ بنِ مُعاذٍ</span>، فلمَّا دَنا مِنَ المسلمين قال الرَّسولُ صلى الله عليه وسلم للأنصارِ: قوموا إلى سَيِّدِكُم -أو خَيرِكُم- ثمَّ قال: إنَّ هؤلاءِ نزلوا على حُكمِك.", "قال -أي <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"saadmuadh\">سعدُ بنُ مُعاذٍ</span>-: تُقْتَلُ مُقاتِلَتُهم، وتُسْبى ذَرارِيُّهُم، وتُقْسَمُ أَموالُهم. فقال له النَّبيُّ صلى الله عليه وسلم: قَضيتَ بحُكمِ الله تعالى. ونَفَّذَ الرَّسولُ صلى الله عليه وسلم هذا الحُكمَ فيهم، وكانوا أَربعمائةٍ على الأرجحِ. ولم يَنْجُ إلَّا بعضُهم، ثمَّ قَسَّمَ الرَّسولُ صلى الله عليه وسلم أَموالَهم وذَراريَّهُم بين المسلمين."], "url": "https://dorar.net/history/event/86", "route": null, "stations": null, "title_en": "The Battle of the Jews of Banoo Quraydhah", "date_en": "Dhu al-Qadah 5 AH (627 CE)", "place_en": "Banu Qurayzah", "summary_en": "Banu Qurayzah broke their covenant during the siege of Madinah. Right after the Trench they were besieged, and the judgment was given to Sa'd ibn Mu'adh.", "people": ["saadmuadh", "rawaha", "huyayy"], "dorar": 86, "asbab": [{"id": "TAF-14", "k": "d"}, {"id": "TAF-25", "k": "d"}], "body_en": ["This battle occurred straight after the Battle of the Parties [or also known as the Battle of the Trench], and the context behind it was that Banoo Quraydhah broke the covenant between them and the Prophet ﷺ after stirring up the endeavours of Huyayy ibn Akhtab an-Nadree. The Prophet ﷺ had sent az-Zubayr to probe their intention, then he sent Al-Sa’din behind him – Sa’d ibn ‘Ubaadah and Sa’d ibn Mu’aadh - and Ibn Rawaahah, and Khawwaat ibn Jubayr for the same purpose. Allah, the Almighty, commanded his Prophet ﷺ to fight them after he returned from the battle of the trench and laid down his weapon.", "Thus, he ﷺ commanded his Companions to march to the houses of Banoo Quraydhah, and he told them, “None of you will perform ‘Asr prayer except at Banoo Quraydhah,” as mentioned in the narration of al-Bukhaaree, or “Dhuhr prayer,” as mentioned in the narration of Muslim. The Messenger ﷺ laid siege to Banoo Quraydhah for a period of twenty-five nights according to the most preponderant view, until they came down to the rule of the Messenger ﷺ. The Prophet ﷺ liked to entrust the judgement against them to a person from the leaders of the tribe of Aws as they were allies of Banoo Quraydhah.", "Thus, he ﷺ put the ruling concerning them to Sa’d ibn Mu’aadh. When he approached the Muslims, the Messenger said to the Ansaar, “Get up to your master or your best one.” Then he said, “These people [the Jews] have agreed to accept your judgment regarding them.” He - meaning Sa’d ibn Muaadh – said, “[My judgmenet is that] their fighters be killed, their offspring taken captive, and their wealth distributed.” The Prophet ﷺ said to him, “You have judged by the judgment of Allah, Most High.” The Messenger ﷺ implemented this ruling on them, and they were four hundred according to the preponderant opinion. Only some of them survived, then the Messenger ﷺ divided their property and offspring among the Muslims."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 71, "stage": 7, "title": "مَقتلُ سَلَّامِ بنِ أبي الحُقَيْقِ اليَهوديِّ", "date": "6 هـ، الموافق 627م", "place": "خيبر", "lat": 25.7, "lng": 39.29, "approx": false, "zoom": 8, "paras": ["هو أبو رافعٍ سَلَّامُ بنُ أبي الحُقَيْقِ شاعرٌ وفارسٌ يَهوديٌّ، أحدُ الذين حَزَّبوا الأحزابَ ضِدَ المسلمين في غزوةِ الأحزابِ، وأَعانَهُم بالمُؤَنِ والأَموالِ الكَثيرةِ، ولمَّا قتَل الله كعبَ بنَ الأشرفِ على يدِ رجالٍ مِنَ الأَوسِ بعدَ وقعةَ بدرٍ كان أبو رافعٍ سَلَّامُ بنُ أبي الحُقيقِ ممَّن أَلَّبَ الأحزابَ على رسولِ الله صلى الله عليه وسلم ولم يُقتلْ مع بني قُريظةَ كما قُتِلَ صاحبُه <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"huyayy\">حُيَيُّ بنُ أَخطبِ</span>، رَغِبتِ الخَزرجُ في قتلِه طلبًا لِمُساواةِ الأَوسِ في الأَجرِ.", "وكان الله سُبحانه قد جعَل هذين الحَيَّيْنِ يَتَصاولانِ بين يدي رسولِ الله صلى الله عليه وسلم في الخيراتِ، فاسْتأذَنوا رسولَ الله في قتلِه فأَذِن لهم، فعنِ البَراءِ بنِ عازبٍ قال: بعَث رسولُ الله صلى الله عليه وسلم إلى أبي رافعٍ اليَهوديِّ رِجالًا مِنَ الأنصارِ، فأَمَّرَ عليهم عبدَ الله بنَ عَتيكٍ، وكان أبو رافعٍ يُؤذي رسولَ الله صلى الله عليه وسلم ويُعينُ عليه، وكان في حِصنٍ له بأرضِ الحجازِ، فلمَّا دَنَوْا منه وقد غَربتِ الشَّمسُ، وراح النَّاسُ بِسَرْحِهِم، فقال عبدُ الله لأصحابِه: اجْلِسوا مَكانَكُم، فإنِّي مُنطلِقٌ، ومُتَلَطِّفٌ للبَوَّابِ، لَعلِّي أن أَدخُلَ، فأقبل حتَّى دَنا مِنَ البابِ، ثمَّ تَقَنَّعَ بِثَوبهِ كأنَّه يَقْضي حاجةً، وقد دخل النَّاسُ، فهتَف به البَوَّابُ: يا عبدَ الله، إن كُنتَ تُريدُ أن تَدخُلَ فادخُلْ، فإنِّي أُريدُ أن أُغلقَ البابَ، فدخلتُ فكَمَنْتُ، فلمَّا دخَل النَّاسُ أَغلقَ البابَ، ثمَّ عَلَّقَ الأَغاليقَ على وَتَدٍ، قال: فقمتُ إلى الأقاليدِ فأَخذتُها، ففتحتُ البابَ، وكان أبو رافعٍ يُسْمَرُ عنده، وكان في عَلالِيَّ له، فلمَّا ذهَب عنه أهلُ سَمَرِهِ صَعدتُ إليه، فجعلتُ كلمَّا فتحتُ بابًا أَغلقتُ عليَّ مِن داخلٍ، قلتُ: إن القومَ نَذِروا بي لم يَخْلُصوا إليَّ حتَّى أَقتُلَه، فانتهيتُ إليه، فإذا هو في بيتٍ مُظلمٍ وسطَ عِيالهِ، لا أَدري أين هو مِنَ البيتِ، فقلتُ: يا أبا رافعٍ، قال: مَن هذا؟ فأَهويتُ نحوَ الصَّوتِ فأَضرِبُه ضَربةً بالسَّيفِ وأنا دَهِشٌ، فما أَغنيتُ شيئًا، وصاح، فخرجتُ مِنَ البيتِ، فأَمكثُ غيرَ بَعيدٍ، ثمَّ دَخلتُ إليه، فقلتُ: ما هذا الصَّوتُ يا أبا رافعٍ؟ فقال: لِأُمِّكَ الوَيْلُ، إنَّ رجلًا في البيتِ ضَربَني قبلُ بالسَّيفِ.", "قال: فأَضرِبُه ضَربةً أَثْخَنَتْهُ ولم أَقتُلْه، ثمَّ وَضعتُ ظِبَةَ السَّيفِ في بَطنِه حتَّى أخَذ في ظَهرهِ، فعَرفتُ أنِّي قَتلتُه، فَجعلتُ أَفتحُ الأبوابَ بابًا بابًا، حتَّى انْتهَيتُ إلى دَرجةٍ له، فوَضعتُ رِجلي، وأنا أَرى أنِّي قد انْتهَيتُ إلى الأرضِ، فوقعتُ في ليلةٍ مُقْمِرَةٍ، فانكَسرتْ ساقي، فعَصَبْتُها بِعِمامةٍ، ثمَّ انطَلقتُ حتَّى جَلستُ على البابِ، فقلتُ: لا أخرجُ اللَّيلةَ حتَّى أَعلمَ: أَقتلتُه؟ فلمَّا صاح الدِّيكُ قام النَّاعي على السُّورِ فقال: أَنْعى أبا رافعٍ تاجرَ أهلِ الحِجازِ.", "فانطَلقتُ إلى أصحابي، فقلتُ: النَّجاءَ، فقد قتَل الله أبا رافعٍ، فانتهَيتُ إلى النَّبيِّ صلى الله عليه وسلم فحَدَّثتُه، فقال: «ابْسُطْ رِجْلَكَ». فبَسطتُ رِجلي فمسَحها فكأنَّها لم أَشْتَكِها قَطُّ ."], "url": "https://dorar.net/history/event/87", "route": null, "stations": null, "title_en": "The Killing of Sallaam ibn Aboo al-Huqayq, the Jew.", "date_en": "6 AH (627 CE)", "place_en": "Khaybar", "summary_en": "Abu Rafi ibn Abi al-Huqayq of Khaybar, who had helped rally the confederates against Madinah, was killed by a small group of the Ansar.", "people": ["huyayy"], "dorar": 87, "asbab": [], "body_en": ["He is Aboo Raafi’ Salam ibn Abee al-Huqayq, a Jewish poet and knight, one of those who rallied the parties against the Muslims in the Battle of the Trench and helped them with plenty of supplies and money. After Ka’b ibn al-Ashraf was killed on the hands of a few men from al-Aws after the Battle of Badr, Aboo Raafi’ Salaam ibn Aboo al-Huqayq was among those who rallied the parties against the Messenger of Allah ﷺ. He was not killed with Banoo Quraydhah as his companion, Huyayy ibn Akhtab was killed. The tribe of al-Khazraj were interested in killing him in order to seek equality with al-Aws in reward.", "These two tribes (al-Aws and al-Khazraj) used to compete before the Messenger of Allah ﷺ in good works. Thus, they asked the permission of the Messenger of Allah ﷺ to kill him, so he granted them his permission. Narrated al-Baraa; ibn ‘Aazib (may Allah be pleased with him): “Allah's Messenger ﷺ sent some men from the Ansaar to kill Aboo Raafi’, the Jew, and appointed `Abdullah ibn ‘Ateek as their leader. Aboo Raafi` used to abuse Allah's Messenger ﷺ and help his enemies against him. He lived in his castle in the land of Hijaaz. When those men approached (the castle) after the sun had set and the people had brought back their livestock to their homes. `Abdullah (ibn ‘Ateek) said to his companions, \"Sit down at your places. I am going, and I will try to play a trick on the gate-keeper so that I may enter (the castle).\" So `Abdullah proceeded towards the castle, and when he approached the gate, he covered himself with his clothes, pretending to answer the call of nature.", "The people had gone in, and the gatekeeper (considered `Abdullah as one of the castle's servants) addressing him saying, \"O Allah's Servant! Enter if you wish, for I want to close the gate.\" `Abdullah added in his story, \"So I went in (the castle) and hid myself. When the people got inside, the gatekeeper closed the gate and hung the keys on a fixed wooden peg. I got up and took the keys and opened the gate. Some people were staying late at night with Aboo Raafi` for a pleasant night chat in a room of his. When his companions of nightly entertainment went away, I ascended to him, and whenever I opened a door, I closed it from inside.", "I said to myself, 'Should these people discover my presence, they will not be able to catch me till I have killed him.' I reached him and found him sleeping in a dark house amidst his family, I could not recognize his location in the house. I shouted, 'O Aboo Raafi`!' Aboo Raafi` said, 'Who is it?' I proceeded towards the source of the voice and hit him with the sword, and because of my perplexity, I could not kill him. He cried loudly, and I came out of the house and waited for a while, and then went to him again and said, 'What is this voice, O Aboo Raafi`?' He said, 'Woe to your mother!", "A man in my house has hit me with a sword! I again hit him severely, but I did not kill him. Then I drove the point of the sword into his belly (and pressed it through) till it touched his back, and I realized that I have killed him. I then opened the doors one by one till I reached the staircase, and thinking that I had reached the ground, I stepped out and fell-down and got my leg broken in a moonlit night. I tied my leg with a turban and proceeded on till I sat at the gate, and said, 'I will not go out tonight till I know that I have killed him.' So, when (early in the morning) the cock crowed, the announcer of the casualty stood on the wall saying, 'I announce the death of Aboo Raafi`, the merchant of Hijaz.", "Thereupon I went to my companions and said, 'Let us save ourselves, for Allah has killed Aboo Raafi`,' So I (along with my companions proceeded and) went to the Prophet ﷺ and described the whole story to him. \"He said, 'Stretch out your (broken) leg. I stretched it out and he rubbed it and it became All right as if I had never had any ailment whatsoever.”"], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 72, "stage": 8, "title": "غَزوةُ ذي قَرَدٍ", "date": "محرم 6 هـ، الموافق 627م", "place": "الغابة", "lat": 24.58, "lng": 39.62, "approx": true, "zoom": 11, "paras": ["أَغار عُيَيْنَةُ بنُ حِصْنٍ -في بني عبدِ الله بنِ غَطَفانَ- على لِقاحِ النَّبيِّ صلى الله عليه وسلم التي بالغابةِ، فاسْتاقَها وقتَل راعيَها، وهو رجلٌ مِن غِفارٍ، وأخذوا امْرأتَهُ، فكان أوَّلَ مَن نذَر بهم سَلمةُ بنُ عَمرِو بنِ الأَكْوَعِ الأَسلميُّ رضي الله عنه، يقول سَلمةُ: خَرجتُ قبلَ أن يُؤذَّنَ بالأولى، وكانت لِقاحُ رسولِ الله صلى الله عليه وسلم تَرعى بِذي قَرَدٍ، قال: فلَقِيَني غُلامٌ لِ<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abdrahman\">عبدِ الرَّحمنِ بنِ عَوفٍ</span> فقال: أُخِذَتْ لِقاحُ رسولِ الله صلى الله عليه وسلم.", "فقُلتُ: مَن أخَذها؟ قال: غَطَفانُ. قال: فصَرختُ ثلاثَ صَرخاتٍ، يا صَباحاهُ. قال: فأَسمَعتُ ما بين لابَتَيِ المدينةِ، ثمَّ اندَفعتُ على وجهي حتَّى أدركتُهم بِذي قَرَدٍ، وقد أخَذوا يَسقون مِنَ الماءِ، فجَعلتُ أَرميهِم بِنَبْلي، وكنتُ راميًا، وأقولُ: أنا ابنُ الأكوعِ...", "واليومُ يومُ الرُّضَّعِ، فأَرتَجِز حتَّى اسْتنقَذتُ اللِّقاحَ منهم، واسْتلَبتُ منهم ثلاثين بُردةً، قال: وجاء النَّبيُّ صلى الله عليه وسلم والنَّاسُ، فقلتُ: يا نَبيَّ الله، إنِّي قد حَمَيْتُ القومَ الماءَ وهُم عِطاشٌ، فابعثْ إليهم السَّاعةَ. فقال: «يا ابنَ الأَكوعِ مَلَكْتَ فأَسْجِحْ».", "ثمَّ قال: «إنَّهم الآنَ ليُقْرَوْنَ في غَطَفانَ». وذهَب الصَّريخُ بالمدينةِ إلى بني عَمرِو بنِ عَوفٍ، فَجاءتِ الأَمدادُ ولم تَزلْ الخيلُ تأتي، والرِّجالُ على أَقدامِهم وعلى الإبلِ حتَّى انْتَهَوْا إلى رسولِ الله صلى الله عليه وسلم بِذي قَرَدٍ. وبلغ النَّبيُّ صلى الله عليه وسلم ماءً يُقالُ له: ذو قَرَدٍ.", "فنحَر لِقْحَةً ممَّا اسْتَرجَع، وأقام هناك يومًا وليلةً، ثمَّ رجَع إلى المدينةِ. وقُتِلَ في هذه الغَزوةِ الأَخْرَمُ، وهو مُحْرِزُ بنُ نَضْلَةَ رضي الله عنه، قتَلهُ عبدُ الرَّحمنِ بنُ عُيينةَ، وتَحوَّل على فَرسِه، فحمَل عليه أبو قَتادةَ فقَتلهُ، واسْتَرجَع الفَرسَ، وكانت لِمحمودِ بنِ مَسلمةَ، وأَقبلتِ المرأةُ المَأسورةُ على ناقةٍ لِرسولِ الله صلى الله عليه وسلم، وقد نَذرتْ: إنِ الله أَنجاها عليها لَتَنْحَرَنَّها، فقال رسولُ الله صلى الله عليه وسلم: بِئسَ ما جَزَتْها، لا نذرَ لابنِ آدمَ فيما لا يَملِك، ولا في مَعصيةٍ.", "وأخَذ ناقتَهُ. وقد رَوى مُسلمٌ في صَحيحِه عن سَلمةَ بنِ الأَكوعِ في هذه القِصَّةِ قال: فرجَعنا إلى المدينةِ، فلم نَلبثْ إلَّا ثلاثَ ليالٍ، حتَّى خرَجنا إلى خَيبرَ."], "url": "https://dorar.net/history/event/88", "route": null, "stations": null, "title_en": "The Battle of Dhee Qarad", "date_en": "Muharram 6 AH (627 CE)", "place_en": "Al-Ghabah", "summary_en": "Uyaynah ibn Hisn raided the Prophet's ﷺ camels at al-Ghabah. Salamah ibn al-Akwa chased the raiders on foot, and the Prophet ﷺ followed with riders to Dhu Qarad.", "people": ["abdrahman"], "dorar": 88, "asbab": [], "body_en": ["‘Uyaynah ibn Hisn - in a group of men from Banoo Abdullah ibn Ghatafaan – raided the camels of the Prophet ﷺ in the forest, killed its shepherd, a man from the tribe of Ghifaar, and kidnapped his wife. The first person to warn about the incident was Salamah ibn ‘Amr ibn al-Akwa’ al-Aslamee (may Allah be pleased with him) who related: “I came out before the Adhan of Fajr was called out and the milch camels of the Messenger of Allah ﷺ were grazing at Dhoo Qarad. A young servant belonged to Abd al-Rahmaan ibn ‘Auf met me and said, ‘The milch camels of the Messenger of Allah ﷺ have been looted.’ I asked, ‘Who looted them?’ He replied, ‘[the people of] Ghatafaan.’”", "Upon which I called out loudly three times, O morning, people!” and I made it heard between the two lava mountains of al-Madeenah. Then I ran straight in their pursuit until I found them at Dhoo Qarad where they were just going to water their animals. I, being an archer, shot them with my arrows while syaing, ‘I am the son of al-Akwa’. And today is the day when the cowards will meet their doom.’ I continued melodiously chanting until I rescued the milch she-camels from them and snatched from them thirty garments. Thereafter, the Messenger of Allah ﷺ and some other people came along.", "I said, ‘O Prophet of Allah! I have prevented them from water while they were thirsty. You can send a force (to punish them) at this instance.’ He (the Prophet ﷺ) said: ‘O Ibn al-Akwa’! You have taken [them] back. Now let them go.” Then, he said, “Indeed, they are being entertained at Ghatafaan. The loud cry travelled to al-Madeenah, to Banoo ‘Amr ibn ‘Awf. The reinforcements arrived. Horses, men on their feet and on camels came, until they came to the Messenger of Allah ﷺ at Dhoo Qirad. The Prophet ﷺ reached a water source called Dhoo Qirad.", "He ﷺ slaughtered a milch camel from what he ﷺ recovered and stayed there for a day and night, then returned to al-Madeenah. Al-Akhram, Mikhraz ibn Nadlah (may Allah be pleased with him) was killed in this battle by Abd al-Rahmaan ibn Uyaynah, and he turned on his horse. Thereupon, Aboo Qatadah attacked him, killed him, and recovered the horse, which belonged to Mahmood ibn Maslamah. The captured woman came to the Messenger of Allah ﷺ on a she-camel, and she had vowed that if Allah saves her, she will sacrifice the she-camel.", "The Messenger of Allah ﷺ said, “Evil is what she intended to pay back with. There is no vow for the son of Adam in what he does not possess, nor in disobedience. And he took his she-camel. Muslim narrated in his Saheeh on the authority of Salamah ibn al-Akwa’ in this story, he said, “Thus, we returned to al-Madeenah, and we remained [there] only for three nights, until we set out for Khaybar.”"], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 73, "stage": 8, "title": "سرية محمد بن مسلمة رضي الله عنه إلى القرطاء", "date": "محرم 6 هـ، الموافق 627م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": true, "zoom": 10, "paras": ["بَعَثَ رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">مُحمَّدَ بن مَسلَمةَ</span> رَضي اللهُ عنه في ثلاثين راكِبًا إلى القُرْطاءِ -بينها وبين المدينةِ سَبعُ ليالٍ-، وهم بَطنٌ من بني بَكرٍ، واسمُه: عُبَيدُ بنُ كِلابٍ. فخَرَج <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">محمدُ بنُ مَسلَمةَ</span> رَضي اللهُ عنه وأصحابُه فسار اللَّيلَ واستَتَر النَّهارَ، فلمَّا أغار عليهم هَرَب سائِرُهم بعد أن قَتَل نَفَرًا منهم، واستاقَ المسلمون نَعَمًا وشاءً، وقَدِموا المدينةَ لِلَيلةٍ بَقيَت من المُحرَّمِ ومعهم ثُمامةُ بنُ أُثالٍ الحَنفيُّ سيِّدُ بني حَنيفةَ، كان قد خَرَج مُتنَكِّرًا لاغتيالِ النبيِّ صلَّى اللهُ عليه وسلَّم بأمرِ مُسيلِمةَ الكَذَّابِ، فأخَذَه المسلمون، فلمَّا جاؤوا به رَبَطوه بساريةٍ من سَواري المَسجِدِ، فخَرَج إليه النبيُّ صلَّى اللهُ عليه وسلَّم فقال: \"ما عِندَكَ يا ثُمامةُ؟\" فقال: عِندي خَيرٌ يا مُحمَّدُ، إنْ تَقتُلْ تَقتُلْ ذا دَمٍ، وإنْ تُنعِمْ تُنعِمْ على شاكِرٍ، وإنْ كُنتَ تُريدُ المالَ فسَلْ تُعطَ منه ما شِئتَ، فتَرَكَه.", "ثم مرَّ به مرَّةً أُخرَى، فقالَ له مِثلَ ذلك، فرَدَّ عليه كما ردَّ عليه أولًا، ثم مرَّ مرَّةً ثالِثةً فقال بعدما دار بينهما الكَلامُ السَّابِقُ: \"أطلِقوا ثُمامةَ\"، فأطلَقوه، فذَهَب إلى نَخلٍ قَريبٍ من المسجِدِ، فاغتَسَل، ثم جاءه فأسلَمَ، وقال: \"واللهِ ما كان على وَجهِ الأرضِ وَجهٌ أبغَضَ إليَّ من وَجهِك، فقد أصبَحَ وَجهُك أحبَّ الوُجوهِ إليّ، وواللهِ ما كان على وَجهِ الأرضِ دينٌ أبغَضَ إلَيَّ من دِينِك، فقد أصبَحَ دينُك أحَبَّ الأديانِ إليَّ، وإنَّ خَيلَك أخذَتْني وأنا أُريدُ العُمرةَ، فبَشَّرَه رسول الله صلَّى اللهُ عليه وسلَّم، وأمَره أن يَعتَمِرَ؛ فلمَّا قَدِم على قُرَيشٍ قالوا: صَبَأتَ يا ثُمامةُ، قال: لا واللهِ، ولكنِّي أسلَمتُ مع مُحمَّدٍ صلَّى اللهُ عليه وسلَّم، ولا واللهِ لا يأتيكُم من اليَمامةِ حَبَّةُ حِنطةٍ حتى يأذنَ فيها رسولُ الله صلَّى اللهُ عليه وسلَّم\".", "وكانت يَمامةُ ريفُ مكةَ؛ فانصَرَف إلى بلادِه، ومَنَع الحَمْلَ إلى مكةَ، حتى جَهِدَت قُريشٌ، وكَتَبوا إلى رسولِ الله صلَّى اللهُ عليه وسلَّم يَسألونه بأرحامِهِم أن يَكتُبَ إلى ثُمامةَ يُخلِّي إليهِم حَمْلَ الطَّعامِ؛ ففَعَل رسولُ الله صلَّى اللهُ عليه وسلَّم."], "url": "https://dorar.net/history/event/89", "route": null, "stations": null, "title_en": "The Brigade of Muhammad ibn Maslamah (May Allah Be Pleased with Him) Towards al-Qurtaa’", "date_en": "Muharram 6 AH (627 CE)", "place_en": "Madinah", "summary_en": "Muhammad ibn Maslamah led thirty riders against al-Qurata, a clan of Banu Bakr seven nights from Madinah.", "people": ["maslama"], "dorar": 89, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent Muhammad ibn Maslamah (may Allah be pleased with him) in a group of thirty mounted men to the people of al-Qurtaa – which is situated at a distance of seven nights journey from al-Madeenah – who are a branch of the tribe of Banoo Bakr, whose name is ‘Ubaid ibn Kilaab. Muhammad ibn Maslamah and his fighters set out travelling by night and hiding by day. When they raided them, all of them fled after they managed to kill a group of them. The Muslims drove the livestock and goats with them and headed back to al-Madeenah.", "They reached al-Madeenah one night before the end of the month of Muharram. They had taken Thumaamah ibn Uthaal al-Hanafee, the leader of Banoo Haneefah in captivity with them, after they caught him disguised in order to assassinate the Prophet ﷺ by the order of Musaylimah, the Liar. When they brought him, they tied him to one of the pillars of the mosque. The Prophet ﷺ came out to him and said, “O Thumaamah, what do you think? He replied: O Muhammad, I have good opinion of you. If you kill me, you will kill a person who has spilt blood. If you do me a favour, you will do a favour to a grateful person. If you want wealth, ask and you will get what you will demand. The Messenger of Allah ﷺ left him (in this condition) for two days, (and came to him again) and said: What do you think, O Thumaamah? He replied: What I have already told you. If you do a favour, you will do a favour to a grateful person. If you kill me, you will kill a person who has spilt blood.", "If you want wealth, ask and you will get what you will demand. The Messenger of Allah ﷺ left him until the next day when he (came to him again) and said: What do you think, O Thumaamah? He replied: What I have already told you. If you do me a favour, you will do a favour to a grateful person. If you kill me, you will kill a person who has spilt blood. If you want wealth, ask and you will get what you will demand. The Messenger of Allah ﷺ said: Set Thumaamah free. He went to a palm-grove near the mosque and took a bath.", "Then he entered the mosque and said: I bear testimony (to the truth) that there is no god but Allah, and I testify that Muhammad is His bondman and His messenger. O Muhammad, by Allah, there was no face on the earth more hateful to me than your face, but (now) your face has become to me the dearest of all faces. By Allah, there was no religion more hateful to me than your religion, but (now) your religion has become the dearest of all religions to me. By Allah, there was no city more hateful to me than your city, but (now) your city has become the dearest of all cities to me.", "Your horsemen captured me when I intended going for Umrah. Now what is your opinion (in the matter)? The Messenger of Allah ﷺ announced good tidings to him and told him to go on 'Umrah. When he reached Mecca, somebody said to him: Have you changed your religion? He said: No! I have rather embraced Islam with the Messenger of Allah ﷺ. By Allah, you will not get a single grain of wheat from Yamaamah until it is permitted by the Messenger of Allah ﷺ.” Al-Yamaamah was in the rural area of Makkah. So, he went back to his countryside and prevented the transportation to Makkah, until the Quraysh struggled, and they wrote to the Messenger of Allah ﷺ begging him by their relationship of kith and kin to write to Thumaamah that he should allow the transportation of food to Makkah. The Messenger of Allah ﷺ did that [on their behalf]."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 74, "stage": 8, "title": "سرية عُكَّاشة بن مِحصَن رضي الله عنه إلى الغَمر (ماء بني أسد)", "date": "ربيع الأول 6 هـ، الموافق 627م", "place": "الغمر", "lat": 25.5, "lng": 40.5, "approx": true, "zoom": 8, "paras": ["بَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم عُكَّاشةَ بنَ مِحصَنٍ رَضي اللهُ عنه إلى الغَمْرِ -ماءٍ لبني أسَدٍ- في أربعين رَجلًا، فيهم: ثابِتُ بنُ أقرَمَ، وشُجاعُ بنُ وَهبٍ؛ فخَرَج سَريعًا ونَذِرَ به القَومُ فهَرَبوا فنَزَلوا عَلياءَ بلادِهِم، ووَجَد ديارَهم خُلوفًا -أي: أهلُها غائِبون-، فبَعَث شُجاعَ بنَ وَهبٍ طَليعةً؛ فرَأى أثَرَ النَّعَمِ، فتَحمَّلوا فأصابوا مَن دَلَّهم على بَعضِ ماشيَتِهِم، فأمَّنوه، فدَلَّهم على نَعَمٍ لبني عمٍّ له، فأغاروا عليها، فاستاقوا مِائتَي بَعيرٍ؛ فأرسَلوا الرَّجلَ، وساقوا النَّعَمَ إلى المدينةِ، وقَدِموا على رسولِ الله صلَّى اللهُ عليه وسلَّم ولم يَلقَوا كَيدًا."], "url": "https://dorar.net/history/event/90", "route": null, "stations": null, "title_en": "The Brigade of ‘Ukkaashah ibn Mihsan (May Allah Be Pleased with Him) to Ghamr Mazruq (A Water Source That Belonged to Banoo Asad)", "date_en": "Rabi al-Awwal 6 AH (627 CE)", "place_en": "Al-Ghamr", "summary_en": "Ukkashah ibn Mihsan led forty men to al-Ghamr, a water of Banu Asad, whose people fled before them.", "people": [], "dorar": 90, "asbab": [], "body_en": ["The Messenger of Allah ﷺ sent ‘Ukkaashah ibn Mihsan, may Allah be pleased with him, to al-Ghamr – a water source belonging to Banoo Asad - with forty men, including Thaabit ibn Aqram and Shujaa’ ibn Wahb. He went out quickly and the people were on alert against him, thus, they fled and settled in the high areas of their lands. He found their dwellings deserted, meaning, its people were absent. He sent Shujaa' ibn Wahb as a vanguard who saw the footprints of the animals. They patiently advanced and found the one who showed them some of their livestock, so they made him safe.", "He led them to the livestock of his cousins and so they raided them and acquired two hundred camels. Then, they released the man, drove the camels to al-Madeenah. They returned to the Messenger of Allah ﷺ without encountering any fighting or resistance."], "src_en": "https://dorar.net/en/history?page=6"}, {"seq": 75, "stage": 8, "title": "سرية محمد بن مسلمة رضي الله عنه إلى بني ثعلبة وبني عوال بذي القَصَّةِ", "date": "ربيع الآخر 6 هـ، الموافق 627م", "place": "ذو القصة", "lat": 24.65, "lng": 39.9, "approx": true, "zoom": 8, "paras": ["بَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">مُحمَّدَ بنَ مَسلَمةَ</span> رَضي اللهُ عنه، ومعه عَشَرةُ نَفَرٍ إلى بني ثَعلَبةَ من غَطَفانَ وبني عَوالٍ من ثَعلَبةَ، وهم بذي القَصَّةِ، فوَرَدوا عليهم ليلًا، فأحدَق به القومُ، وهم مئةُ رجلٍ، فتَرامَوا ساعةً من اللَّيلِ، ثم حَمَلتِ الأعرابُ عليهم بالرِّماحِ فقَتَلوهم جميعًا، ووَقَع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">محمدُ بنُ مَسلَمةَ</span> جَريحًا، فضَرَبوا كعبَه فلم يتحرَّك فظَنُّوا مَوتَه، فجَرَّدوه من الثيابَ وانطَلَقوا، ومر بمُحمَّدٍ وأصحابِه رجلٌ من المسلمين فاستَرجَعَ، فلمَّا سَمِعه مُحمَّدٌ يَستَرجِعُ تَحرَّك له، فأخَذه وحَمَله إلى المدينةِ؛ فعند ذلك بَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبيدةَ</span> بنَ الجرَّاحِ في أربعين رجُلًا إلى مَصارِعِهم فلم يَجِدوا أحدًا، ووَجَدوا نَعَمًا وشاءً فانحدَروا بها إلى المَدينةِ."], "url": "https://dorar.net/history/event/91", "route": null, "stations": null, "title_en": "The Brigade of Muhammad ibn Maslamah (May Allah Be Pleased with Him_ to Banoo Tha’labah and Banoo ‘Awaal at Dhoo al-Qassah", "date_en": "Rabi al-Akhir 6 AH (627 CE)", "place_en": "Dhu al-Qassah", "summary_en": "Muhammad ibn Maslamah and ten men went to Dhu al-Qassah. They were surrounded at night and all were killed except Muhammad, who was wounded.", "people": ["maslama", "abuubayda"], "dorar": 91, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched Muhammad ibn Maslamah (may Allah be pleased with him) and ten people with him to Banoo Tha’labah from Ghatafaan and Banoo ‘Awaal from the tribe of Tha’labah, who were at Dhoo al-Qassah. They reached them at night. The people saw him, and they were one hundred in number. There was an exchange of arrows that ensued for some time of the night. Then, the Arab nomads attacked them with spears, and they killed them all. Muhammad ibn Maslamah was wounded. They hit his heel, but he did not move, and they thought he was dead, so they stripped him of his clothes and set off.", "A man from the Muslims passed by Muhammad (ibn Maslamah) and his companions, and he said: “Indeed we belong to Allah and indeed we will return unto Him.” When Muhammad heard him say that, he moved so he could notice that he was still alive. The man took him and carried him to Al-Madeenah. At that time, the Messenger of Allah ﷺ sent Aboo ‘Ubaydah ibn al-Jarraah with forty men to their battleground, however, they did not find anyone. Nonetheless, they found livestock and goats, so, they acquired them and returned to al-Madeenah."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 76, "stage": 8, "title": "سرية أبي عبيدة بن الجراح إلى ذي القصة", "date": "ربيع الآخر 6 هـ، الموافق 627م", "place": "ذو القصة", "lat": 24.65, "lng": 39.9, "approx": true, "zoom": 8, "paras": ["أرسل رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبَيدةَ</span> بنَ الجَرَّاحِ رَضي اللهُ عنه إلى ذي القَصَّةِ -موضِعٍ قريبٍ من المدينةِ- على إثرِ مَقتَلِ أصحابِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">مُحمَّدِ بنِ مَسلمةَ</span> رَضي اللهُ عنه في أربعين رجلًا من المسلمين حين صَلَّوُا المَغرِبَ، فسار إليهم مُشاةً حتى وافَوا ذي القَصَّةِ مع عَمايةِ الصُّبحِ -بقيَّةِ ظُلمةِ اللَّيلِ- فأغاروا عليهم، فأعجَزوهم هَرَبًا في الجبالِ، وأصابوا رجلًا فأسلم فتَرَكوه، وغَنِموا نَعَمًا من نَعَمِهِم فاستاقوه، ورِثَّةً -السَّقَطَ من مَتاعِ البَيتِ- من مَتاعِهم، وقَدِموا بذلك المدينةَ، فخَمَّسَه رسولُ الله صلَّى اللهُ عليه وسلَّم وقسَّم ما بَقيَ عليهم.", "وعند ابنِ سعدٍ في طَبَقاتِه: أنَّ سببَ بَعثِه صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبيدةَ</span> رَضي اللهُ عنه إلى ذي القَصَّةِ: هو ما بَلَغه مِن أنَّ بني مُحارِبِ بنِ خَصَفةَ، وثَعلبةَ وأنمارٍ -وهما من غَطَفانَ- أجمَعوا أن يُغيروا على سَرحِ المَدينةِ، وهو يَرعَى بهَيفا -موضِعٍ على سَبعةِ أميالٍ من المدينةِ-، فلَعلَّ الرسولَ -صلَّى اللهُ عليه وسلَّم- بَعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abuubayda\">أبا عُبيدةَ</span> رَضي اللهُ عنه مرَّتَين إلى ذي القَصَّةِ، أو أن يَكونَ البَعثُ مرَّةً واحِدةً، ولكنْ له سَبَبانِ: الأخذُ بثَأرِ أصحابِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"maslama\">مُحمَّدِ بن مَسلَمةَ</span> رَضي اللهُ عنه المَقتولين، ودَفْعُ مَن أراد الإغارةَ على سَرحِ المَدينةِ."], "url": "https://dorar.net/history/event/92", "route": null, "stations": null, "title_en": "The Brigade of Aboo ‘Ubaydah ibn al-Jarraah to Dhoo al-Qassah", "date_en": "Rabi al-Akhir 6 AH (627 CE)", "place_en": "Dhu al-Qassah", "summary_en": "Abu Ubaydah ibn al-Jarrah led forty men to Dhu al-Qassah after Muhammad ibn Maslamah's companions were killed.", "people": ["abuubayda", "maslama"], "dorar": 92, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched Aboo ‘Ubaydah ibn al-Jarraah (may Allah be pleased with him) with forty fighters to Dhul-Qassah - a place close to Al-Madeenah - following the killing of the companions of Muhammad ibn Maslamah (may Allah be pleased with him) when they performed the Maghrib prayer. The brigade proceeded as an infantry until they reached Dhul al-Qassah at darkened hours of morning - with remaining darkness of night- they then attacked them, crippling their efforts to escape into the mountains, and they captured a man who accepted Islam, hence they released him.", "They seized their livestock and brought them back with them, and they acquired items of less value – household items of minimal value - amongst their belongings. They brought all of that to al-Madeenah. The Messenger Allah ﷺ took the one-fifth share and divided what was left among them. According to Ibn Sa`d in his Tabaqaat, ‘the reason he ﷺ dispatched the brigade of Aboo ‘Ubaydah (may Allah be pleased with him) to Dhul-Qassah was what he had heard that the tribes of Banoo Muharib ibn Khasfah, Tha’labah and Anmaar - both of which are from Ghatafaan – agreed to raid the livestock of al-Madeenah which were grazing at Haifaa – a place at a distance of seven miles from al-Madeenah.", "It is possible that the Messenger ﷺ sent Aboo ‘Ubaydah (may Allah be pleased with him) twice to Dhu al-Qassah, or that dispatch might have occurred once. However, there were two reasons for that, one, to take revenge on behalf of the companions of Muhammad ibn Maslamah who were killed; and two, to repel those who intended to raid the livestock of al-Madeenah."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 77, "stage": 8, "title": "سرية زيد بن حارثة رضي الله عنه إلى الجموم (ماءٌ على طَريقِ مكةَ)", "date": "ربيع الآخر 6 هـ، الموافق 627م", "place": "الجموم", "lat": 24.7, "lng": 40.1, "approx": true, "zoom": 8, "paras": ["بَعَث رسولُ الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارِثةَ</span> رَضي اللهُ عنه إلى بني سُلَيمٍ؛ فسار حتى وَرَد الجَمومَ -وهو ماءٌ على طَريقِ مكةَ- ناحيةَ بَطنِ نَخلٍ عن يَسارِها، فأصابوا عليه امرَأةً من مُزَينةَ يقال لها: حَليمةُ، فدَلَّتهم على مَحَلَّةٍ من مَحالِّ بني سُلَيمٍ؛ فأصابوا في تلك المَحَلَّةِ نَعَمًا وشاءً وأسرى، فكان فيهم زوجُ حَليمةَ المُزنيَّةِ، فلمَّا قَفَل <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدُ بنُ حارِثةَ</span> رَضي اللهُ عنه إلى المَدينةِ بما أصاب، وَهَب رسولُ الله صلَّى اللهُ عليه وسلَّم للمُزَنيَّةِ نَفسَها وزَوجَها."], "url": "https://dorar.net/history/event/93", "route": null, "stations": null, "title_en": "The Brigade of Zayd ibn Haarithah at al-Jamoom", "date_en": "Rabi al-Akhir 6 AH (627 CE)", "place_en": "Al-Jamum", "summary_en": "Zayd ibn Harithah led an expedition to Banu Sulaym at al-Jamum, a water on the road to Makkah.", "people": ["zayd"], "dorar": 93, "asbab": [], "body_en": ["The Messenger of Allah ﷺ dispatched Zayd ibn Haarithah (may Allah be pleased with him) to Banoo Sulaym. He travelled by night until he came to al-Jamoom - which is a water source on the road to Makkah - towards the area of Batn Nakhl on its left. They captured a woman from the tribe of Muzaynah called Haleemah, and she directed them to an area amongst the places of Banoo Sulaym. They acquired in that area camels, goats, and captives. Among them was the husband of Haleemah al-Muzaniyyah. When Zayd ibn Haarithah returned to Al-Madeenah with what he acquired, the Messenger of Allah ﷺ gifted the Muzaniyyah lady and her husband their freedom."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 78, "stage": 8, "title": "غزوة بني لحيان (الذين غدروا يوم الرجيع)", "date": "جمادى الأول 6 هـ، الموافق 627م", "place": "الرجيع", "lat": 22.0, "lng": 39.5, "approx": true, "zoom": 8, "paras": ["بنو لِحيانَ: هم الذين غدروا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khubayb\">بخُبَيبِ</span> بنِ عَديٍّ رَضي اللهُ عنه وأصحابِه يومَ الرَّجيعِ، ولمَّا كانت ديارُهم مُتوغِّلةً في بلاد الحِجازِ إلى حدودِ مكةَ، ولوُجودِ ثاراتٍ بين المسلمين من جهةٍ، وقُريشٍ والأعرابِ من جهة أُخرَى، رأى رسولُ الله صلَّى اللهُ عليه وسلَّم ألَّا يَتوغَّلَ في البلادِ القريبةِ من العَدوِّ الأكبَرِ والرَّئيسيِّ قُريشٍ، فلمَّا تَخاذَلَتِ الأحزابُ، وانكَسَرَت عزائِمُهم، رأى أنَّ الوقتَ قد حان لغَزوِ بني لِحيانَ وأخذِ الثَّأرِ لأصحابِ الرَّجيعِ؛ فخَرَج إليهمُ الرَّسولُ صلَّى اللهُ عليه وسلَّم طالِبًا بدِماءِ أصحابِه في مِائَتين من أصحابِه، ومعهم عِشرون فَرَسًا، واستَخلَف على المدينةِ عبدَ اللهِ بنَ أُمِّ مَكتومٍ رَضي اللهُ عنه، وأظهَر رسولُ الله صلَّى اللهُ عليه وسلَّم أنَّه يُريدُ الشَّامَ ليُصيبَ بني لِحيانَ غِرَّةً، ثم أسرَع السَّيرَ حتى انتَهَى إلى وادي غُرانَ بين أمَجَّ -مَوضِعٍ بين مكةَ والمدينةِ- وعُسفانَ -قريةٍ بين مكةَ والمدينةِ-، وهي منازِلُ بني لِحيانَ، وفيها كان مُصابُ أصحابِه، فتَرَحَّم عليهم ودعا لهم.", "وسَمِعت به بنو لِحيانَ، فهَرَبوا واحتَمَوا في رؤوسِ الجِبالِ؛ فلم يَقدِر رسولُ الله صلَّى اللهُ عليه وسلَّم على أحدٍ منهم؛ فأقام رسولُ الله صلَّى اللهُ عليه وسلَّم بأرضِهم يَومًا أو يومَين، وبَعَث السَّرايا في كلِّ ناحيةٍ فلم يَقدِروا على أحدٍ. ثم سار رسولُ الله صلَّى اللهُ عليه وسلَّم بأصحابِه إلى عُسفانَ لتَسمَعَ به قُرَيشٌ فيُداخِلَهمُ الرُّعبُ، وليُريَهم من نَفسِه قُوَّةً؛ فبَعَث <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبا بكرٍ</span> الصِّدِّيقَ رَضي اللهُ عنه في عَشَرةِ فَوارِسَ إلى كُراعِ الغَميمِ -مَوضِعٍ بين مكةَ والمدينةَ-، ثم رَجَع <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abubakr\">أبو بَكرٍ</span> الصِّدِّيقُ رَضي اللهُ عنه ولم يَلْقَ أحدًا."], "url": "https://dorar.net/history/event/94", "route": null, "stations": null, "title_en": "The Battle of Banoo Lihyaan Banee Hudhayl ibn Mudrikah on the Outskirts of ‘Asfaan", "date_en": "Jumada al-Ula 6 AH (627 CE)", "place_en": "Al-Raji", "summary_en": "The Prophet ﷺ marched against Banu Lihyan, who had betrayed the Companions at al-Raji, but they fled to the mountains.", "people": ["abubakr", "khubayb"], "dorar": 94, "asbab": [], "body_en": ["The people of Banoo Lihyaan are those who ambushed Khubayb ibn ‘Adiy (may Allah be pleased with him) and his companions on the day of ar-Rajee’. As their residences were spread throughout the region of al-Hijaaz extending towards the borders of Makkah, and due to the presence of vengeances between the Muslims on one side and Quraysh and Arab nomads on the other side, the Messenger of Allah ﷺ decided not to penetrate in the regions that are closer to the biggest and official enemy, Quraysh. When the Parties failed in their attempt to invade al-Madeenah and their determinations were broken, he ﷺ saw that the time had arrived to combat Banoo Lihyaan and to take revenge on behalf the companions of ar-Rajee’.", "The Messenger ﷺ led an expedition consisting of two hundred of his companions and twenty horses, heading to the regions of Banoo Lihyaan to seek revenge for the bloodshed of his companions, and left Abdullah ibn Umm Maktoom (may Allah be pleased with him) as the governor over al-Madeenah. The Messenger of Allah ﷺ pretended that he was heading to the Levant, so that he could take them by surprise. Then, he ﷺ hastened the march until he reached the valley of Ghuraan located between Amajj – a place between Makkah and al-Madeenah – and ‘Usfaan – a town between Makkah and al-Madeenah, which are the areas of Banoo Lihyaan.", "It was there where the casualties of his companions (may Allah be pleased with them) occurred. The Messenger ﷺ prayed for their mercy and supplicated for them. After Banoo Lihyaan heard about his arrival, they fled in panic and took shelter on the peaks of the mountains; thus, the Messenger of Allah ﷺ was unbale to capture anyone of them. He ﷺ stationed in their homelands for a day or two, and during that time he ﷺ dispatched brigades in all corners, but they could not capture anyone from them. Then the Messenger ﷺ journeyed with his Companions to ‘Usfaan to allow Quraysh to hear about it, thus instilling fear in them and to show them his power.", "Thereafter, he ﷺ sent Aboo Bakr as-Siddeeq (may Allah be pleased with him) with ten horsemen to Kuraa’ al-Ghameem – a place between Makkah and al-Madeenah. However, Aboo Bakr as-Siddeeq (may Allah be pleased with him) did not find anyone there so he returned to al-Madeenah."], "src_en": "https://dorar.net/en/history?page=7"}, {"seq": 79, "stage": 8, "title": "سرية زيد بن حارثة رضي الله عنه إلى العيص", "date": "جمادى الأول 6 هـ، الموافق 627م", "place": "سيف البحر", "lat": 24.9, "lng": 38.1, "approx": true, "zoom": 8, "paras": ["بَعَث رسول الله صلَّى اللهُ عليه وسلَّم <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"zayd\">زيدَ بنَ حارِثةَ</span> رَضي اللهُ عنه في سَريَّةٍ في سبعين ومئةِ راكِبٍ إلى العيصِ -اسمِ مَوضِعٍ قُربَ المدينةِ على ساحِلِ البحرِ- بهَدفِ اعتِراضِ عيرٍ لقُريشٍ أقبلَت مِن الشامِ بقيادةِ أبي العاصِ بنِ الرَّبيعِ، فأدرَكوها، فأخَذوها وما فيها، وأخَذوا يومئذٍ فِضَّةً كَثيرةً لصَفوانَ بنِ أُميَّةَ، وأسَروا ناسًا ممَّن كان في العيرِ، منهم: أبو العاصِ بنُ الرَّبيعِ، وقَدِموا بهم إلى المدينةِ.", "وكان أبو العاصِ من رجالِ مكة المعدودين تِجارةً و
