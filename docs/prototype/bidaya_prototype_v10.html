izyah.", "people": [], "dorar": 141, "asbab": [], "body_en": ["The delegates continued to arrive at al-Madeenah visiting the Prophet ﷺ. One of these delegates was the Christians of Najraan who signed a treaty with the Prophet ﷺ who made granted them protection after they agreed to pay the jizyah."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 127, "stage": 11, "title": "وَفاةُ إبراهيمَ ابنِ النَّبيِّ صلَّى الله عليه وسلَّم", "date": "10 هـ، الموافق 631م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["<span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"ibrahim\">إبراهيمُ ابنُ النَّبيِّ</span> صلى الله عليه وسلم، وأمُّهُ مارِيَةُ القِبْطِيَّةُ، وقد كان جَميعُ أَولادِ النَّبيِّ صلى الله عليه وسلم مِن <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"khadija\">خَديجةَ</span> رضي الله عنها، ما عَدا إبراهيمَ فمِن مارِيَةَ القِبطيَّةِ المِصريَّةِ رضي الله عنها، قال أنسُ بنُ مالكٍ رضي الله عنه: «ما رَأيتُ أحدًا كان أَرحمَ بالعِيالِ مِن رسولِ الله صلى الله عليه وسلم. قال: كان إبراهيمُ مُسْتَرْضِعًا له في عَوالي المَدينةِ، فكان يَنطلِقُ ونحن معه فيَدخُلُ البيتَ وإنَّه لَيُدَخَّنُ، وكان ظِئْرُهُ قَيْنًا، فيَأخُذهُ فيُقَبِّلُهُ، ثمَّ يَرجِع. قال عَمرٌو: فلمَّا تُوفِّيَ إبراهيمُ قال رسولُ الله صلَّى الله عليه وسلَّم: «إنَّ إبراهيمَ ابْنِي، وإنَّه مات في الثَّدْيِ، وإنَّ له لَظِئْرَيْنِ تُكَمِّلانِ رَضاعَهُ في الجنَّةِ ». عن المُغيرةِ بنِ شُعبةَ قال: كَسَفتِ الشَّمسُ على عَهدِ رسولِ الله صلَّى الله عليه وسلَّم يَومَ مات إبراهيمُ، فقال النَّاسُ: كَسَفتِ الشَّمسُ لِمَوتِ إبراهيمَ. فقال رسولُ الله صلى الله عليه وسلم: «إنَّ الشَّمسَ والقَمرَ لا يَنْكَسِفانِ لِمَوتِ أَحدٍ ولا لِحَياتِه، فإذا رَأيْتُم فصَلُّوا، وادْعوا الله ». عن أبي بَكرةَ قال: خَسَفتِ الشَّمسُ على عَهدِ رسولِ الله صلى الله عليه وسلم فخرَج يَجُرُّ رِداءَهُ حتَّى انْتَهى إلى المسجدِ، وَثابَ النَّاسُ إليه، فصلَّى بهم رَكعتينِ، فانْجَلتِ الشَّمسُ، فقال: «إنَّ الشَّمسَ والقَمرَ آيتانِ مِن آياتِ الله، وإنَّهما لا يَخْسِفانِ لِمَوتِ أَحدٍ، وإذا كان ذاك فصَلُّوا وادْعوا حتَّى يُكْشَفَ ما بكم». وذاك أنَّ ابْنًا للنَّبيِّ صلى الله عليه وسلم مات يُقالُ له: إبراهيمُ. فقال النَّاسُ في ذاك. وُلِدَ له إبراهيمُ بالمدينةِ مِن سُرِّيَّتِهِ مارِيَةَ القِبطيَّةِ، سَنَةَ ثَمانٍ مِن الهِجرةِ، وبَشَّرَهُ به أبو رافعٍ مَولاهُ، فوَهَبَ له عَبدًا، ومات طِفلًا قَبلَ الفِطامِ، واخْتُلِف هل صلَّى عليه أم لا؟ على قَولين."], "url": "https://dorar.net/history/event/142", "route": null, "stations": null, "title_en": "The Death of Ibraaheem, the Son of the Prophet ﷺ", "date_en": "10 AH (631 CE)", "place_en": "Madinah", "summary_en": "Ibrahim, the Prophet's ﷺ son by Mariyah al-Qibtiyyah, died in infancy, and the Prophet ﷺ grieved for him.", "people": ["ibrahim", "khadija"], "dorar": 142, "asbab": [], "body_en": ["Ibraaheem was the son of the Prophet ﷺ and his mother was Mariyyah the Coptic (may Allah be pleased with her). All the children of the Prophet ﷺ except Ibraaheem, were from his wife, Khadeejah (may Allah be pleased with her). Anas ibn Maalik (may Allah be pleased with him) reported: “I have never seen anyone more kind to one's family than Allah's Messenger ﷺ and Ibraaheem was sent to the suburb of Medina for suckling. He used to go there, and we accompanied him. He entered the house, and it was filled with smoke as his foster-father was a brick smith. He took him (his son Ibraaheem) and kissed him and then came back. 'Amr said that when Ibraaheem died. Allah's Messenger ﷺ said: Ibraaheem is my son, and he dies as a suckling babe. He has now two foster-mothers who would complete his suckling period in Paradise.”", "Al-Mugheerah ibn Shu’bah (may Allah be pleased with him) reported: “The sun eclipsed in the lifetime of Allah's Messenger ﷺ on the day when (his son) Ibraaheem died. So, the people said that the sun had eclipsed because of the death of Ibraaheem. Allah's Messenger ﷺ said, \"The sun and the moon do not eclipse because of the death or life (i.e., birth) of someone. When you see the eclipse pray and invoke Allah.\" Aboo Bakrah (may Allah be pleased with him) reported: \"The sun became eclipsed during the lifetime of the Messenger of Allah ﷺ so he ﷺwent out dragging his garment, until he came to the masjid, and the people gathered around him. He ﷺ led us in praying two units and when (the eclipse) ended he said: 'The sun and the moon are two of the signs of Allah by means of which Allah, the Mighty and Sublime, strikes fear into His slaves. They do not become eclipsed for the death or birth of anyone. If you see that, then pray until Allah relieves you of fear.' That was because his son, named Ibraaheem, had died, and the people suggested to him that (the eclipse) happened because of that.\"", "Ibraaheem was born in al-Madeenah in the 8th year after Hijrah from his slave-girl, Mariyyah the Coptic. It was Aboo Raafi’, the freed slaved of the Prophet ﷺ who delivered the good news of his birth to him; thus, he ﷺ granted him a slave. However, Ibraaheem died before he was weaned. The scholars differed on whether the Prophet ﷺ prayed over him or not."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 128, "stage": 11, "title": "حَجَّةُ الوَداعِ وتسمى حَجَّةُ الإسلامِ أو حَجَّةُ البَلاغِ", "date": "10 هـ، الموافق 631م", "place": "عرفة", "lat": 21.3549, "lng": 39.9842, "approx": false, "zoom": 11, "paras": ["سُمِّيَتْ حَجَّةَ الوَداعِ؛ لأنَّه عليه الصَّلاةُ والسَّلامُ وَدَّعَ النَّاسَ فيها، ولم يَحُجَّ بعدَها، وسُمِّيَتْ حَجَّةَ الإسلامِ؛ لأنَّه عليه السَّلامُ لم يَحُجَّ مِنَ المدينةِ غيرَها، وسُمِّيَتْ حَجَّةَ البَلاغِ؛ لأنَّه عليه السَّلامُ بلَّغَ النَّاسَ شَرْعَ الله في الحَجِّ قَولًا وفِعلًا، ولم يكنْ بَقِيَ مِن دَعائِمِ الإسلامِ وقَواعِدِهِ شيءٌ إلَّا وقد بيَّنَهُ عليه السَّلامُ، فلمَّا بيَّنَ لهم شَريعَةَ الحَجِّ ووَضَّحَهُ وشَرحَهُ أَنزلَ الله عزَّ وجلَّ عليه وهو واقِفٌ بِعَرفةَ: <span class=\"verse\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾</span> <span class=\"ref\">[المائدة: ٣]</span>.", "وعندما أَعلنَ الرَّسولُ صلى الله عليه وسلم عَزمَهُ على الحَجِّ في هذا العامِ قَدِمَ المدينةَ بَشَرٌ كَثيرٌ، كُلُّهُم يَلتَمِسُ أن يَأْتَمَّ بِرسولِ الله صلى الله عليه وسلم، ويَعملَ مِثلَ عَملِهِ. وخرَج مِنَ المدينةِ لِخمسٍ بَقِينَ مِن ذي القَعدةِ. وقد وقعَت للنَّبيِّ صلى الله عليه وسلم في مَسيرِهِ هذا ورُجوعِهِ أَحداثٌ كَثيرةٌ."], "url": "https://dorar.net/history/event/143", "route": [[24.4672, 39.6111], [24.413, 39.543], [23.5, 39.25], [22.35, 39.3], [21.4225, 39.8262], [21.4133, 39.8933], [21.3549, 39.9842]], "stations": [[24.413, 39.543, "ذو الحليفة", "Dhu al-Hulayfah"], [21.3549, 39.9842, "عرفة", "Arafah"]], "title_en": "The Farewell Pilgrimage, A.k.a. the Pilgrimage of Islam or the Pilgrimage of Announcement", "date_en": "10 AH (631 CE)", "place_en": "Arafah", "summary_en": "The Prophet ﷺ performed his only Hajj from Madinah, teaching the people its rites and bidding them farewell; he passed away a few months later.", "people": [], "dorar": 143, "asbab": [{"id": "ASB-057", "k": "d"}], "body_en": ["It was named the Farewell Pilgrimage because the Prophet ﷺ bid farewell to the Muslims and it was his last pilgrimage. It was also called the Pilgrimage of Islam because it was the only pilgrimage that he ﷺ performed from al-Madeenah. It is also called the Pilgrimage of Announcement because the Prophet ﷺ proclaimed and taught the people the rites of pilgrimage in actions and words. Before this, all other rulings pertaining to the pillars of Islam were explained; therefore, after he ﷺ clarified the rites and rulings of Hajj, Allah, Most High, revealed to him while he was on the mount of ‘Arafah: {Today I have perfected your faith for you, completed My favour upon you, and chosen Islam as your way.} [Quran 5:3].", "Large number of Muslims attended this Hajj because the Prophet ﷺ disclosed to the people that he is intending it. All of them wanted to attend, led by the Prophet, and learn the rites of Hajj from him directly in action. He ﷺ left al-Madeenah five nights from the end of the month of Dhoo al-Qa’dah. During this journey, from al-Madeenah to Makkah and vice versa, the Prophet ﷺ faced and witnessed many events."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 129, "stage": 11, "title": "خروج الأسود العنسي في اليمن وقتله على يد فيروز الديلمي", "date": "ذي الحجة 10 هـ، الموافق 632م", "place": "اليمن", "lat": 15.3694, "lng": 44.191, "approx": false, "zoom": 8, "paras": ["خرج الأسوَدُ العَنْسيُّ -واسمُه عَبهلةُ بنُ كَعبِ بنِ غَوثٍ- في آخِرِ حياةِ رَسولِ اللهِ صلَّى اللهُ عليه وسلَّم في سَبْعِمائةِ مقاتلٍ، فكَتَب إلى عمَّالِ النَّبيِّ صلَّى اللهُ عليه وسلَّم: أيُّها المتمَرِّدون علينا، أمسِكوا علينا ما أخَذْتُم مِن أرضِنا، ووفِّروا ما جمعتُم؛ فنحن أَولى به، وأنتم على ما أنتم عليه، ثمَّ توجَّه مع مقاتِلِيه إلى نجرانَ فأخَذَها، ثمَّ قَصَد صنعاءَ، فخرج إليه شَهرُ بنُ باذامَ فتقاتلا، فغَلَبه الأسوَدُ وقتَلَه وتزوَّج بامرأةِ شَهرِ بنِ باذامَ، وهي ابنةُ عَمِّ فيروز الدَّيلميِّ، واسمُه آزاذُ، وكانت مؤمنةً باللهِ ورَسولِه صلَّى اللهُ عليه وسلَّم، ومِن الصَّالحاتِ، واحتَلَّ العَنسيُّ صنعاءَ، فذهب معاذُ بنُ جبَلٍ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"abumusa\">وأبو موسى</span> الأشعريِّ إلى حَضرَموتَ، وانحاز عُمَّالُ رَسولِ الله صلَّى اللهُ عليه وسلَّم إلى الطَّاهِرِ، ورجَعَ عُمَرُ بنُ حرامٍ وخالِدُ بنُ سعيدِ بنِ العاصِ إلى المدينةِ، واستوثقَت اليمَنُ للأسودِ العَنسيِّ، وجَعَل أمرُه يستطيرُ استطارةَ الشَّرارةِ، واشتَدَّ مُلكُه، واستغلظ أمرُه، وارتَدَّ خَلقٌ مِن أهلِ اليَمَنِ، وعامَله المسلمون الذين هناك بالتَّقِيَّةِ فبعث رَسولُ اللهِ صلَّى اللهُ عليه وسلَّم حين بلغَه خَبَرُ الأسودِ العَنسيِّ كِتابَه مع قيسِ بنِ مكشوحٍ يأمرُ فيه المسلمين الذين هناك بمُقاتلةِ العَنْسيِّ ومُصاولتِه، فقام معاذُ بنُ جَبَلٍ بهذا الكتابِ أتمَّ قيامٍ، واتَّفَق معاذُ بنُ جبَلٍ ومَن التَفَّ حولَه مِن أهلِ اليَمَنِ، وقيسُ بنُ عبدِ يغوثَ أميرُ جندِ الأسوَدِ، وفَيروز الدَّيلميُّ؛ على الفتكِ بالأسوَدِ وقَتْلِه، وتعاقدوا عليه، فلمَّا كان الليلُ دَخَلوا عليه البيتَ؛ تقَدَّم إليه فيروز الدَّيلميُّ، وكان الأسوَدُ نائمًا على فراشٍ من حريرٍ، قد غَرِقَ رأسُه في جَسَدِه، وهو سَكْرانُ يَغطُّ، والمرأةُ جالسةٌ عنده، فعاجله وخالَطَه، وهو مِثلُ الجَمَلِ، فأخَذَ رأسَه، فدَقَّ عُنُقَه ووَضَع رُكبتَيه في ظَهْرِه حتى قَتَلَه، وجلس قيسٌ وداذويه وفيروز يأتمرونَ كيف يُعلِمونَ أشياعَهم، فاتَّفَقوا على أنَّه إذا كان الصَّباحُ ينادون بشِعارِهم الذي بينهم وبين المسلمين، فلمَّا كان الصَّباحُ قام أحَدُهم -وهو قيس- على سُورِ الحِصنِ، فنادى بشِعارِهم، فاجتمع المسلِمون والكافِرون حول الحِصنِ، فنادى قيسٌ: أشهَدُ أنَّ محمَّدًا رسولُ اللهِ، وأنَّ عَبهلةَ كذَّابٌ، وألقى إليهم رأسَه، فانهزم أصحابُه، وتَبِعَهم النَّاسُ يأخُذونهم ويرصُدونهم في كلِّ طريقٍ يأسِرونَهم، وظهر الإسلامُ وأهلُه، وتراجَعَ نوَّابُ رسولِ اللهِ صلَّى اللهُ عليه وسلَّم إلى أعمالِهم، واتَّفَقوا على معاذِ بنِ جَبَلٍ يصلِّي بالنَّاسِ، وكتبوا بالخَبَرِ إلى رَسولِ الله صلَّى اللهُ عليه وسلَّم، وكانت مُدَّةُ مُلكِه منذ ظهر إلى أن قُتِلَ ثلاثةُ أشهُرٍ أو أربعةُ أشهرٍ."], "url": "https://dorar.net/history/event/6103", "route": null, "stations": null, "title_en": "The Revolt of al-Aswad al-’Ansee to Yemen and His Death at the Hands of Fayrooz al-Daylamee", "date_en": "Dhu al-Hijjah 10 AH (632 CE)", "place_en": "Yemen", "summary_en": "Near the end of the Prophet's ﷺ life, al-Aswad al-Ansi claimed prophethood in Yemen and rebelled with seven hundred fighters, threatening the Prophet's ﷺ governors there.", "people": ["abumusa"], "dorar": 6103, "asbab": [], "body_en": ["Al-Aswad al-’Ansee, whose name is ‘Abhalah ibn Ka’ab ibn Ghawth, mounted a revolt towards the end of the life of the Messenger of Allah’s life, with a force of 700 fighters. He wrote a letter to the governors of the Prophet ﷺ (saying): O rebels! Keep for us the lands which you have taken from us and save what you have gathered. For we are more deserving of it, [especially since you have decided] to persist upon your current course of action!” He then headed towards Najraan, with his army of fighters, and took possession of it; then he made his way towards San’aa’ where he clashed with Shahr ibn Baadhaam.", "Aswad overcame him and killed him and then proceeded to marry Shahr’s widow who was the paternal cousin of Fayrooz al-Daylamee whose name was Aazaadh. She believed in Allah and His Messengerﷺ and was (considered to be from amongst) the righteous. As a result of the occupation of San’aa’ by al-‘Ansee, Mu’aadh ibn Jabal and Aboo Moosaa al-Ash’aree went to Hadramawt; the rest of the governors of the Prophet- Peace and Blessings be Upon Him-joined (forces) with al-Taahir; Omar ibn Haraam and Khaalid ibn Sa’eed ibn al-‘Aas returned to al-Madeenah.", "Yemen then began to trust al-Aswad al-‘Ansee and his affair began to spread like sparks from a blazing fire and intensified as his rule strengthened. Many people from Yemen denounced their Islam while those who remained Muslims had to hide their Islam from al-Aswad. Upon hearing the news and developments regarding al-Aswad al-‘Ansee, the Messenger of Allah- Peace and Blessings be Upon Him-sent a letter to Qays ibn Makshooh; and in it, he commanded the Muslims to fight al-Aswad al-‘Ansee and to overpower him. Mu’aadh ibn Jabal (may Allah be pleased with him) proceeded to obey that letter very intently.", "Some of the people of Yemen who were close to Mu’aadh ibn Jabal and allied to him, as well as Qays ibn ‘Abd Yaghawth-the commander of al-Aswad’s army-and Fayrooz al-Daylamee, all agreed and swore an oath they would kill him. At nightfall, they all entered his home with Fayrooz al-Daylamee at the forefront where they found al-Aswad sleeping deeply on a bed made of silk. He was drunk and snoring with the woman sitting nearby. (The group) quickly (surrounded him) and grabbed him and he was like a camel [waiting to be slaughtered].", "Someone took his head, smashed his neck, and pushed his knees into his back until they had killed him. Then Qays, Daadhwayhi, and Fayrooz discussed how they would next proceed to inform the people of their collective. They agreed that they would, in the morning, proclaim the sign by which they are known to the other Muslims. When the morning came, Qays stood on the walls of the fortress and yelled out their sign, causing the Muslims and the Disbelievers to gather round the walls. Qays yelled out: “I bear witness that Muhammad is the Messenger of Allah, and that ‘Abhalah is a liar!”", "And he threw the head (of al-Aswad) towards them, upon which the companions (al-Aswad) fled the scene, but they were watched, followed, apprehended, and shackled everywhere they could be found. Thereupon, Islam prevailed, and Muslim reattained the power, and the deputies of the Messenger of Allah ﷺ returned to their posts and the agreed that Mu’aadh ibn Jabal would lead the Muslims in prayer. The governors of the Messenger of Allah ﷺ wrote to the Prophet ﷺ informing him of what happened. The reign of (al-Aswad al-‘Ansee) lasted only 3 or 4 months from the time of his appearance to the time of his assassination."], "src_en": "https://dorar.net/en/history?page=10"}, {"seq": 130, "stage": 11, "title": "مُصيبَةُ المسلمين الكُبرى بِوَفاةِ رسولِ الله صلَّى الله عليه وسلَّم", "date": "ربيع الأول 11 هـ، الموافق 632م", "place": "المدينة", "lat": 24.4672, "lng": 39.6111, "approx": false, "zoom": 10, "paras": ["اشْتَكى رسولُ الله صلى الله عليه وسلم بعدَ عَودتِه مِن حَجَّةِ الوَداعِ، حتَّى اشْتَدَّ وَجَعُهُ وهو في بيت مَيمونَةَ رضي الله عنها، فدَعا نِساءَهُ فاسْتأذَنَهُنَّ في أن يُمَرَّضَ في بيتِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> رضي الله عنها، قالت <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span> رضي الله عنها: كان النَّبيُّ صلى الله عليه وسلم يقولُ في مَرضِهِ الذي مات فيه: «يا <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةُ</span> ما أَزالُ أَجِدُ أَلَمَ الطَّعامِ الذي أَكلتُ بِخَيبرَ، فهذا أَوانُ وَجَدْتُ انْقِطاعَ أَبْهَري مِن ذلك السُّمِّ ».", "واسْتغرَقَ مَرضُهُ عشرةَ أيَّامٍ، قال ابنُ حَجَرٍ: (واخْتُلِفَ في مُدَّةِ مَرضِه، فالأكثرُ على أنَّها ثلاثةَ عشرَ يومًا، وقِيلَ بزيادةِ يَومٍ، وقِيلَ بِنَقصِه، وقِيلَ: عشرةُ أيَّامٍ. وبه جزَم سُليمانُ التَّيميُّ في مَغازيهِ، وأَخرَجهُ البَيهقيُّ بإسنادٍ صَحيحٍ).", "ثمَّ تَوفَّاهُ الله تعالى يَومَ الاثنين في الثَّاني عشر من رَبيعٍ الأوَّلِ، وقد تَمَّ له مِنَ العُمُرِ ٦٣ سَنَةً، وكُفِّنَ عليه الصَّلاةُ والسَّلامُ في ثلاثةِ أَثوابٍ بِيضٍ سَحُولِيَّةٍ مِن كُرْسُفٍ، ليس فيها قَميصٌ ولا عِمامَةٌ، وصلَّى النَّاسُ عليه أَرْسالًا، ودُفِنَ في مكانِ مَوتِهِ في حُجرَةِ <span class=\"pname\" role=\"button\" tabindex=\"0\" data-p=\"aisha\">عائشةَ</span> رضي الله عنها، وجَزاهُ الله تعالى عن المسلمين خيرَ ما جَزَى نَبِيًّا عن أُمَّتِهِ."], "url": "https://dorar.net/history/event/145", "route": null, "stations": null, "title_en": "The Calamity of the Death of the Prophet ﷺ", "date_en": "Rabi al-Awwal 11 AH (632 CE)", "place_en": "Madinah", "summary_en": "After returning from the Farewell Pilgrimage the Prophet ﷺ fell ill. He asked to be nursed in Aishah's house, where he passed away in Rabi al-Awwal, 11 AH.", "people": ["aisha"], "dorar": 145, "asbab": [], "body_en": ["After his return from the farewell pilgrimage, the Prophet ﷺ fell ill. The illness began to take its toll on the Prophet, making him very frail and weak, and as the days passed, his sickness got worse and worse. At that time, he ﷺ was staying at the house of his wife, Maymoonah. He ﷺ called all his wives to come and then asked for their permission that he be treated at ‘Aishah’s house. Narrated ‘Aishah (may Allah be pleased with her): “The Prophet ﷺ in his ailment in which he died, used to say, \"O `Aishah! I still feel the pain caused by the food I ate at Khaybar, and at this time, I feel as if my aorta is being cut from that poison.\" His sickness lasted for ten days before he ﷺ departed this life. Ibn Hajar said: “The scholars differed on the length of his sickness. The majority hold the view that it was 13 days. It was said, it was 14 days, and others said less than 13 days. And it was said, it was 10 days, which is the view that Sulaymaan al-Taymee confirmed in his book about the battles of the Prophet ﷺ and al-Bayhaqee reported through an authentic chain of narrators.”", "He ﷺ died on Monday, the 12th of Rabee’ al-Awwal at the age of 63. He ﷺ was shrouded in three cotton garments of white Yemeni stuff from Sahool (This is said to have been the place where the cloth was woven, or the place from which it was exported), among which was neither a shirt nor a turban. The Muslims prayed over him ﷺ in successive groups due to their large numbers, and he ﷺ was buried in the same place where he died in the house of ‘Aishah (may Allah be pleased with her). May Allah reward him ﷺ on behalf of us with the best reward that was ever given to any Prophet on behalf of his people and any Messenger on behalf of his nation."], "src_en": "https://dorar.net/en/history?page=10"}], "people": {"khadija": {"name": "خديجة بنت خويلد", "hon": "رضي الله عنها", "group": "family", "desc": "أم المؤمنين، أولى زوجات النبي ﷺ، وأول من آمن به.", "f": true, "full": "خديجة بنت خويلد بن أسد القرشية", "laqab": "أم المؤمنين، الطاهرة", "islam": "أول من آمن بالنبي ﷺ", "death": "٣ ق.هـ في مكة", "bio": "كانت ذات شرف ومال وتجارة، وتزوجها النبي ﷺ قبل البعثة، فكانت أولى زوجاته، ولم يتزوج غيرها في حياتها. آمنت به أول ما نزل عليه الوحي، وثبّتته وواسته بنفسها ومالها، وولدت له أكثر أولاده. توفيت في مكة في العام الذي عُرف بعام الحزن.", "name_en": "Khadijah bint Khuwaylid", "hon_en": "may Allah be pleased with her", "desc_en": "Mother of the Believers, the Prophet's ﷺ first wife, and the first to believe in him.", "full_en": "Khadijah bint Khuwaylid ibn Asad of Quraysh", "laqab_en": "Mother of the Believers, al-Tahirah", "islam_en": "The first to believe in the Prophet ﷺ", "death_en": "3 BH, Makkah", "bio_en": "A noblewoman of means and trade, she married the Prophet ﷺ before his mission, and he took no other wife in her lifetime. She believed in him from the first revelation, supported him with herself and her wealth, and bore most of his children. She died in Makkah in the year known as the Year of Sorrow.", "cited": {"id": "SAH-005", "facts": [{"id": "SAH-005-F1", "ar": "كانت تاجرة ذات شرف ومال.", "en": "She was a merchant of standing and wealth.", "dorar": 10, "url": "https://dorar.net/history/event/10", "q": "وكانت خديجة بنت خويلد امرأة تاجرة ذات شرف ومال كثير", "ref": "سفر النبي صلَّى اللهُ عليه وسلَّم للمرة الثانية إلى الشام"}, {"id": "SAH-005-F2", "ar": "تزوجها النبي ﷺ قبل البعثة.", "en": "The Prophet ﷺ married her before his mission began.", "dorar": 9, "url": "https://dorar.net/history/event/9", "q": "وقد تزوجها النبي صلى الله عليه وسلم وهي ثيب", "ref": "زَواجُ النَّبيِّ صلَّى الله عَليهِ وسلَّم من خَديجةَ بنتِ خُويلدٍ رضِي الله عنها"}, {"id": "SAH-005-F3", "ar": "أول من آمن بالنبي ﷺ.", "en": "She was the first to believe in the Prophet ﷺ.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "كان أول من آمن بالله ورسوله خديجة بنت خويلد", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-005-F4", "ar": "بشّرها النبي ﷺ ببيت في الجنة.", "en": "The Prophet ﷺ gave her the glad tidings of a house in Paradise.", "dorar": 24, "url": "https://dorar.net/history/event/24", "q": "وبشرها ببيت في الجنة من قصب", "ref": "وَفاةُ أمِّ المؤمنين خَديجةَ بنتِ خويلدٍ رضِي الله عنها"}, {"id": "SAH-005-F5", "ar": "توفيت بمكة قبل الهجرة بثلاث سنين ودفنت بالحجون.", "en": "She died in Makkah three years before the Hijrah and was buried at al-Hajun.", "dorar": 24, "url": "https://dorar.net/history/event/24", "q": "ودفنت بالحجون", "ref": "وَفاةُ أمِّ المؤمنين خَديجةَ بنتِ خويلدٍ رضِي الله عنها"}], "death": {"ar": "3 ق هـ بمكة", "en": "3 BH, Makkah", "dorar": 24}}}, "abubakr": {"name": "أبو بكر الصديق", "hon": "رضي الله عنه", "group": "sahaba", "desc": "صاحب النبي ﷺ في الهجرة، وأول من أسلم من الرجال، وأول الخلفاء الراشدين.", "f": false, "full": "عبد الله بن عثمان بن عامر التيمي القرشي", "laqab": "الصديق، والعتيق", "islam": "أول من أسلم من الرجال", "death": "١٣ هـ في المدينة", "bio": "صاحب النبي ﷺ وصديقه قبل البعثة. أسلم في أول الدعوة، وأسلم على يديه عدد من كبار الصحابة، وأعتق بماله عددًا من المستضعفين، منهم بلال بن رباح. رافق النبي ﷺ في الهجرة، وهو صاحبه في الغار الذي ذكره القرآن في سورة التوبة، وشهد معه المشاهد كلها. تولى الخلافة بعد وفاة النبي ﷺ نحو سنتين، ودُفن بجواره.", "name_en": "Abu Bakr al-Siddiq", "hon_en": "may Allah be pleased with him", "desc_en": "The Prophet's ﷺ companion in the Hijrah, the first man to accept Islam, and the first caliph.", "full_en": "Abdullah ibn Uthman ibn Amir of Taym, Quraysh", "laqab_en": "al-Siddiq, al-Atiq", "islam_en": "The first man to accept Islam", "death_en": "13 AH, Madinah", "bio_en": "The Prophet's ﷺ close friend before the mission. He accepted Islam at once, several senior Companions accepted Islam through him, and he freed persecuted believers such as Bilal with his wealth. He accompanied the Prophet ﷺ in the Hijrah and is his companion in the cave mentioned in Surah At-Tawbah. He led the Muslims for about two years after the Prophet ﷺ and is buried beside him.", "cited": {"id": "SAH-001", "facts": [{"id": "SAH-001-F1", "ar": "من أول من آمن بالنبي ﷺ.", "en": "He was among the first to believe in the Prophet ﷺ.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "كان أول من آمن بالله ورسوله خديجة بنت خويلد زوجته صلى الله عليه وسلم، وأبو بكر الصديق", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-001-F2", "ar": "أسلم بدعوته عثمان والزبير وسعد بن أبي وقاص وطلحة وعبد الرحمن بن عوف.", "en": "Uthman, al-Zubayr, Sa'd ibn Abi Waqqas, Talhah and Abd al-Rahman ibn Awf accepted Islam through his invitation.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "وقد أسلم بدعاء أبي بكر الصديق عثمان بن عفان", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-001-F3", "ar": "صحب النبي ﷺ في الهجرة إلى المدينة.", "en": "He accompanied the Prophet ﷺ on the Hijrah to Madinah.", "dorar": 42, "url": "https://dorar.net/history/event/42", "q": "فحبس أبو بكر نفسه على رسول الله صلى الله عليه وسلم ليصحبه", "ref": "هِجرةُ الرَّسولِ صلَّى الله عليه وسلَّم وأبي بكرٍ رضِي الله عنه إلى المدينةِ"}, {"id": "SAH-001-F4", "ar": "كان مع النبي ﷺ في غار ثور ثلاث ليال.", "en": "He stayed with the Prophet ﷺ in the Cave of Thawr for three nights.", "dorar": 42, "url": "https://dorar.net/history/event/42", "q": "ثم لحق رسول الله صلى الله عليه وسلم وأبو بكر بغار في جبل ثور", "ref": "هِجرةُ الرَّسولِ صلَّى الله عليه وسلَّم وأبي بكرٍ رضِي الله عنه إلى المدينةِ"}, {"id": "SAH-001-F5", "ar": "أشار يوم بدر بفداء الأسرى.", "en": "At Badr, he advised accepting ransom for the prisoners.", "dorar": 59, "url": "https://dorar.net/history/event/59", "q": "وأشار أبو بكر بفدائهم", "ref": "غَزوةُ بدرٍ (الكُبرى) وانْتصارُ المُسلمين"}, {"id": "SAH-001-F6", "ar": "أمّره النبي ﷺ على سرية إلى بني فزارة.", "en": "The Prophet ﷺ made him commander of an expedition to Banu Fazarah.", "dorar": 98, "url": "https://dorar.net/history/event/98", "q": "سرية على رأسها: أبو بكر الصديق", "ref": "سرية أبي بكر الصديق رضي الله عنه إلى بني فزارة بوادي القرى"}, {"id": "SAH-001-F7", "ar": "أمّره النبي ﷺ على الحج سنة 9 هـ.", "en": "The Prophet ﷺ appointed him leader of the Hajj in 9 AH.", "dorar": 140, "url": "https://dorar.net/history/event/140", "q": "بعث النبي صلى الله عليه وسلم أبا بكر أميرا على الحج", "ref": "حَجَّةُ أبي بكرٍ الصِّدِّيقِ ونُزولُ سُورةِ بَراءَة"}], "death": null}}, "umar": {"name": "عمر بن الخطاب", "hon": "رضي الله عنه", "group": "sahaba", "desc": "أسلم في مكة فقوي به المسلمون، وهو ثاني الخلفاء الراشدين.", "f": false, "full": "عمر بن الخطاب بن نفيل العدوي القرشي", "laqab": "الفاروق، وكنيته أبو حفص", "islam": "في مكة، بعد إسلام حمزة على المشهور", "death": "٢٣ هـ في المدينة", "bio": "كان من أشداء قريش، فلما أسلم قوي به المسلمون وجهروا بعبادتهم. هاجر إلى المدينة، وشهد المشاهد كلها مع النبي ﷺ، ونزل القرآن موافقًا لرأيه في مواضع، منها أسرى بدر والحجاب. تولى الخلافة بعد أبي بكر نحو عشر سنين، اتسعت فيها رقعة الإسلام، ثم استشهد وهو يصلي الفجر، ودُفن بجوار النبي ﷺ وأبي بكر.", "name_en": "Umar ibn al-Khattab", "hon_en": "may Allah be pleased with him", "desc_en": "His acceptance of Islam in Makkah strengthened the Muslims; the second caliph.", "full_en": "Umar ibn al-Khattab ibn Nufayl of Adi, Quraysh", "laqab_en": "al-Faruq; Abu Hafs", "islam_en": "In Makkah, shortly after Hamzah", "death_en": "23 AH, Madinah", "bio_en": "A formidable man of Quraysh whose acceptance of Islam let the Muslims worship openly. He migrated to Madinah and took part in every campaign, and the Quran agreed with his view on several matters, such as the captives of Badr and the hijab. As caliph for about ten years he saw Islam spread widely, then was martyred while leading the dawn prayer and buried beside the Prophet ﷺ and Abu Bakr.", "cited": {"id": "SAH-002", "facts": [{"id": "SAH-002-F1", "ar": "دعا النبي ﷺ أن يعز الله الإسلام به.", "en": "The Prophet ﷺ prayed that Allah would strengthen Islam through him.", "dorar": 20, "url": "https://dorar.net/history/event/20", "q": "اللهم أعز الإسلام بأحب هذين الرجلين إليك", "ref": "إِسلامُ عُمَرَ رضِي الله عنهُ"}, {"id": "SAH-002-F2", "ar": "أسلم في مكة سنة 7 قبل الهجرة.", "en": "He accepted Islam in Makkah in 7 BH.", "dorar": 20, "url": "https://dorar.net/history/event/20", "q": "فأتى النبي صلى الله عليه وسلم فأسلم عنده", "ref": "إِسلامُ عُمَرَ رضِي الله عنهُ"}, {"id": "SAH-002-F3", "ar": "هاجر إلى المدينة في عشرين راكبًا.", "en": "He migrated to Madinah with twenty riders.", "dorar": 40, "url": "https://dorar.net/history/event/40", "q": "ثم خرج عمر بن الخطاب، وعياش بن أبي ربيعة في عشرين راكبا", "ref": "هِجرةُ الصَّحابةِ إلى المدينةِ"}, {"id": "SAH-002-F4", "ar": "نزل الوحي موافقًا لرأيه في أسرى بدر.", "en": "Revelation came in agreement with his view on the prisoners of Badr.", "dorar": 59, "url": "https://dorar.net/history/event/59", "q": "ولكن الوحي نزل موافقا لرأي عمر", "ref": "غَزوةُ بدرٍ (الكُبرى) وانْتصارُ المُسلمين"}, {"id": "SAH-002-F5", "ar": "كان سببًا في نزول آية الحجاب.", "en": "He was a reason for the revelation of the verse of hijab.", "dorar": 85, "url": "https://dorar.net/history/event/85", "q": "لو أمرت نساءك أن يحتجبن", "ref": "نُزولُ آيةِ الحِجابِ"}, {"id": "SAH-002-F6", "ar": "قاد سرية إلى تربة سنة 7 هـ.", "en": "He led an expedition to Turabah in 7 AH.", "dorar": 109, "url": "https://dorar.net/history/event/109", "q": "بعث رسول الله صلى الله عليه وسلم عمر بن الخطاب رضي الله تعالى عنه في ثلاثين رجلا", "ref": "سَرِيَّةُ عُمَرَ بنِ الخطَّابِ رضِي الله عنه إلى (تُرَبَةَ) طائفةٍ مِن هَوازِنَ"}], "death": null}}, "uthman": {"name": "عثمان بن عفان", "hon": "رضي الله عنه", "group": "sahaba", "desc": "تزوج ابنتي النبي ﷺ رقية ثم أم كلثوم، وهو ثالث الخلفاء الراشدين.", "f": false, "full": "عثمان بن عفان بن أبي العاص الأموي القرشي", "laqab": "ذو النورين، وكنيته أبو عبد الله", "islam": "من السابقين، أسلم على يد أبي بكر", "death": "٣٥ هـ في المدينة", "bio": "كان من أغنياء قريش وأكرمهم، وأنفق ماله في سبيل الله، فجهّز جيش العسرة في غزوة تبوك. تزوج رقية بنت النبي ﷺ وهاجر بها إلى الحبشة، ثم تزوج بعد وفاتها أختها أم كلثوم، فلُقّب بذي النورين. أرسله النبي ﷺ إلى قريش يوم الحديبية. تولى الخلافة بعد عمر، وجمع الناس على مصحف واحد، ثم استشهد في داره.", "name_en": "Uthman ibn Affan", "hon_en": "may Allah be pleased with him", "desc_en": "Married two of the Prophet's ﷺ daughters; the third caliph.", "full_en": "Uthman ibn Affan ibn Abi al-As of Umayyah, Quraysh", "laqab_en": "Dhu al-Nurayn; Abu Abdullah", "islam_en": "Among the earliest, through Abu Bakr", "death_en": "35 AH, Madinah", "bio_en": "A wealthy and generous man of Quraysh who spent his wealth for Allah's cause, equipping the army of Tabuk. He married Ruqayyah, the Prophet's ﷺ daughter, and migrated with her to Abyssinia, then after her death married her sister Umm Kulthum, earning the title 'possessor of two lights'. The Prophet ﷺ sent him as envoy to Quraysh at Hudaybiyyah. As caliph he united the Muslims on one copy of the Quran, and he was martyred in his home.", "cited": {"id": "SAH-003", "facts": [{"id": "SAH-003-F1", "ar": "أسلم بدعوة أبي بكر الصديق.", "en": "He accepted Islam through the invitation of Abu Bakr al-Siddiq.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "وقد أسلم بدعاء أبي بكر الصديق عثمان بن عفان", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-003-F2", "ar": "أول من هاجر إلى الحبشة ومعه زوجته رقية بنت النبي ﷺ.", "en": "He was the first to migrate to Abyssinia, together with his wife Ruqayyah, daughter of the Prophet ﷺ.", "dorar": 17, "url": "https://dorar.net/history/event/17", "q": "منهم عثمان بن عفان، وهو أول من خرج ومعه زوجته رقية بنت رسول الله", "ref": "الهِجرةُ الأُولى إلى الحَبشةِ"}, {"id": "SAH-003-F3", "ar": "تخلف عن بدر بأمر النبي ﷺ ليمرّض رقية، وأسهم له النبي ﷺ.", "en": "He stayed behind from Badr at the Prophet's ﷺ instruction to nurse Ruqayyah, and the Prophet ﷺ gave him a share.", "dorar": 60, "url": "https://dorar.net/history/event/60", "q": "أمر عثمان أن يبقى عند رقية يمرضها", "ref": "وفاةُ رُقَيَّةَ رضِي الله عنها"}, {"id": "SAH-003-F4", "ar": "بايع النبي ﷺ عنه بيده في بيعة الرضوان.", "en": "At the Pledge of al-Ridwan, the Prophet ﷺ pledged on his behalf with his own hand.", "dorar": 100, "url": "https://dorar.net/history/event/100", "q": "هذه يد عثمان", "ref": "بَيعةُ الرِّضْوانِ"}, {"id": "SAH-003-F5", "ar": "تزوج أم كلثوم بنت النبي ﷺ بعد وفاة رقية.", "en": "He married Umm Kulthum, daughter of the Prophet ﷺ, after Ruqayyah died.", "dorar": 134, "url": "https://dorar.net/history/event/134", "q": "فلما توفيت أختها رقية تزوج بها عثمان", "ref": "وَفاةُ أمِّ كُلثومٍ بنتِ رسولِ الله صلَّى الله عليه وسلَّم"}], "death": null}}, "ali": {"name": "علي بن أبي طالب", "hon": "رضي الله عنه", "group": "family", "desc": "ابن عم النبي ﷺ وزوج ابنته فاطمة، ومن أوائل من أسلم، ورابع الخلفاء الراشدين.", "f": false, "full": "علي بن أبي طالب بن عبد المطلب الهاشمي القرشي", "laqab": "أبو الحسن، وأبو تراب", "islam": "من أوائل من أسلم، وهو صبي", "death": "٤٠ هـ في الكوفة", "bio": "ابن عم النبي ﷺ، نشأ في بيته وأسلم صغيرًا. بات في فراش النبي ﷺ ليلة الهجرة، ثم لحق به إلى المدينة، وتزوج ابنته فاطمة رضي الله عنها. شهد المشاهد كلها إلا تبوك، إذ استخلفه النبي ﷺ على أهله، وأعطاه الراية يوم خيبر. تولى الخلافة بعد عثمان، واستشهد في الكوفة.", "name_en": "Ali ibn Abi Talib", "hon_en": "may Allah be pleased with him", "desc_en": "The Prophet's ﷺ cousin and son-in-law, among the first to accept Islam; the fourth caliph.", "full_en": "Ali ibn Abi Talib ibn Abd al-Muttalib of Hashim, Quraysh", "laqab_en": "Abu al-Hasan, Abu Turab", "islam_en": "Among the first, as a boy", "death_en": "40 AH, Kufa", "bio_en": "Raised in the Prophet's ﷺ household, he accepted Islam as a boy. He slept in the Prophet's ﷺ bed on the night of the Hijrah, then followed him to Madinah and married his daughter Fatimah. He took part in every campaign except Tabuk, when the Prophet ﷺ left him in charge of his family, and was given the banner at Khaybar. He became caliph after Uthman and was martyred in Kufa.", "cited": {"id": "SAH-004", "facts": [{"id": "SAH-004-F1", "ar": "من أول من آمن بالنبي ﷺ.", "en": "He was among the first to believe in the Prophet ﷺ.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "وأبو بكر الصديق، وعلي بن أبي طالب", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-004-F2", "ar": "حمل لواء النبي ﷺ في غزوة بدر الأولى.", "en": "He carried the Prophet's ﷺ banner in the First Campaign of Badr.", "dorar": 50, "url": "https://dorar.net/history/event/50", "q": "وحمل لواءه علي بن أبي طالب", "ref": "غزوة بدر الأولى (وادي سفوان)"}, {"id": "SAH-004-F3", "ar": "فتح الله خيبر على يده.", "en": "Allah granted the conquest of Khaybar at his hands.", "dorar": 102, "url": "https://dorar.net/history/event/102", "q": "وقد جعل الله تعالى فتح خيبر على يد علي بن أبي طالب", "ref": "غَزوةُ خَيبرَ"}, {"id": "SAH-004-F4", "ar": "بلّغ سورة براءة في موسم الحج سنة 9 هـ.", "en": "He proclaimed Surah Bara'ah during the Hajj season of 9 AH.", "dorar": 140, "url": "https://dorar.net/history/event/140", "q": "ويتولى علي بنفسه إبلاغ البراءة إلى المشركين", "ref": "حَجَّةُ أبي بكرٍ الصِّدِّيقِ ونُزولُ سُورةِ بَراءَة"}, {"id": "SAH-004-F5", "ar": "زوج فاطمة بنت النبي ﷺ.", "en": "He was the husband of Fatimah, daughter of the Prophet ﷺ.", "dorar": 116, "url": "https://dorar.net/history/event/116", "q": "أمامة التي تزوج بها علي بن أبي طالب بعد فاطمة", "ref": "وَفاةُ زَينبَ رضِي الله عنها بنتِ رسولِ الله صلَّى الله عليه وسلَّم"}], "death": null}}, "hamza": {"name": "حمزة بن عبد المطلب", "hon": "رضي الله عنه", "group": "family", "desc": "عم النبي ﷺ، أسلم في مكة، واستشهد في غزوة أحد.", "f": false, "full": "حمزة بن عبد المطلب بن هاشم القرشي", "laqab": "أسد الله، وسيد الشهداء", "islam": "في مكة، في السنة السادسة من البعثة", "death": "٣ هـ في غزوة أحد", "bio": "عم النبي ﷺ وأخوه من الرضاعة. أسلم غضبًا لابن أخيه حين آذاه أبو جهل، فعزّ به المسلمون. هاجر إلى المدينة، وعقد له النبي ﷺ أول لواء في الإسلام، وأبلى يوم بدر بلاءً عظيمًا، ثم استشهد في أحد، فحزن عليه النبي ﷺ حزنًا شديدًا.", "name_en": "Hamzah ibn Abd al-Muttalib", "hon_en": "may Allah be pleased with him", "desc_en": "The Prophet's ﷺ uncle; accepted Islam in Makkah and was martyred at Uhud.", "full_en": "Hamzah ibn Abd al-Muttalib ibn Hashim of Quraysh", "laqab_en": "Lion of Allah, Master of the Martyrs", "islam_en": "In Makkah, in the sixth year of the mission", "death_en": "3 AH, Uhud", "bio_en": "The Prophet's ﷺ uncle and foster brother. He accepted Islam in anger after Abu Jahl insulted his nephew, and the Muslims grew stronger through him. He migrated to Madinah, carried the first banner the Prophet ﷺ tied, fought bravely at Badr, and was martyred at Uhud, which grieved the Prophet ﷺ deeply.", "cited": {"id": "SAH-008", "facts": [{"id": "SAH-008-F1", "ar": "عم النبي ﷺ، أسلم في مكة.", "en": "The Prophet's ﷺ uncle; he accepted Islam in Makkah.", "dorar": 18, "url": "https://dorar.net/history/event/18", "q": "أسلم حمزة بن عبد المطلب رضي الله عنه", "ref": "إسلام حمزة بن عبد المطلب رَضي اللهُ عنه"}, {"id": "SAH-008-F2", "ar": "كان لواؤه أول لواء عقده النبي ﷺ.", "en": "His was the first banner the Prophet ﷺ tied.", "dorar": 47, "url": "https://dorar.net/history/event/47", "q": "وكان لواء حمزة أول لواء عقده رسول الله", "ref": "سرية حمزة إلى سيف البحر"}, {"id": "SAH-008-F3", "ar": "استشهد في غزوة أحد.", "en": "He was martyred at the Battle of Uhud.", "dorar": 69, "url": "https://dorar.net/history/event/69", "q": "منهم حمزة بن عبد المطلب", "ref": "غَزوةُ أُحُدٍ وسبب هزيمة المسلمين"}], "death": {"ar": "استشهد في أحد 3 هـ", "en": "Martyred at Uhud, 3 AH", "dorar": 69}}}, "abutalib": {"name": "أبو طالب", "hon": "", "group": "family", "desc": "عم النبي ﷺ، كفله صغيرًا وحماه من أذى قريش.", "f": false, "full": "عبد مناف بن عبد المطلب بن هاشم القرشي", "laqab": "أبو طالب", "islam": "", "death": "٣ ق.هـ في مكة", "bio": "عم النبي ﷺ ووالد علي وجعفر. كفل النبي ﷺ بعد وفاة جده عبد المطلب، وأحبه حبًا شديدًا، وخرج به في تجارته إلى الشام. ولما بُعث النبي ﷺ حماه من أذى قريش، وصبر معه في حصار الشِّعب، وتوفي قبل الهجرة بنحو ثلاث سنين، فحزن النبي ﷺ لوفاته.", "name_en": "Abu Talib", "hon_en": "", "desc_en": "The Prophet's ﷺ uncle, who raised him and protected him from Quraysh.", "full_en": "Abd Manaf ibn Abd al-Muttalib ibn Hashim of Quraysh", "laqab_en": "Abu Talib", "islam_en": "", "death_en": "3 BH, Makkah", "bio_en": "The Prophet's ﷺ uncle and the father of Ali and Ja'far. He took the Prophet ﷺ into his care after Abd al-Muttalib died, loved him dearly, and took him on a trading journey to Syria. After the mission began he protected him from Quraysh and endured the boycott with him. He died about three years before the Hijrah, and the Prophet ﷺ grieved for him."}, "zayd": {"name": "زيد بن حارثة", "hon": "رضي الله عنه", "group": "sahaba", "desc": "مولى النبي ﷺ ومن أوائل من أسلم، قاد عددًا من السرايا، واستشهد في مؤتة.", "f": false, "full": "زيد بن حارثة بن شراحيل الكلبي", "laqab": "حِبّ رسول الله ﷺ", "islam": "من أوائل من أسلم", "death": "٨ هـ في غزوة مؤتة", "bio": "سُبي صغيرًا وبيع في مكة، فصار إلى خديجة فوهبته للنبي ﷺ، فأعتقه وتبنّاه قبل تحريم التبني. وهو الصحابي الوحيد الذي ذُكر اسمه صريحًا في القرآن. رافق النبي ﷺ إلى الطائف، وأمّره على عدد من السرايا، ثم جعله أمير جيش مؤتة، فاستشهد فيها.", "name_en": "Zayd ibn Harithah", "hon_en": "may Allah be pleased with him", "desc_en": "Freed by the Prophet ﷺ and among the first to accept Islam; led many expeditions and was martyred at Mu'tah.", "full_en": "Zayd ibn Harithah ibn Sharahil of Kalb", "laqab_en": "Beloved of the Messenger of Allah ﷺ", "islam_en": "Among the first", "death_en": "8 AH, Mu'tah", "bio_en": "Captured as a child and sold in Makkah, he came to Khadijah, who gave him to the Prophet ﷺ. The Prophet ﷺ freed and adopted him before adoption was abolished. He is the only Companion named in the Quran. He accompanied the Prophet ﷺ to Taif, led many expeditions, and commanded the army at Mu'tah, where he was martyred.", "cited": {"id": "SAH-007", "facts": [{"id": "SAH-007-F1", "ar": "مولى النبي ﷺ، ومن أوائل من أسلم.", "en": "The freed servant of the Prophet ﷺ and one of the first to accept Islam.", "dorar": 14, "url": "https://dorar.net/history/event/14", "q": "ثم أسلم زيد بن حارثة مولى رسول الله", "ref": "أوَّلُ النَّاسِ إيمانًا بالله ورسولِه"}, {"id": "SAH-007-F2", "ar": "رافق النبي ﷺ إلى الطائف ووقاه بنفسه.", "en": "He went with the Prophet ﷺ to Ta'if and shielded him with his own body.", "dorar": 25, "url": "https://dorar.net/history/event/25", "q": "وكان زيد بن حارثة يقيه بنفسه", "ref": "خُروجُ رسولِ الله صلَّى الله عَليهِ وسلَّم إلى الطَّائفِ"}, {"id": "SAH-007-F3", "ar": "قاد عددًا من السرايا.", "en": "He led a number of expeditions.", "dorar": 68, "url": "https://dorar.net/history/event/68", "q": "فبعث زيد بن حارثة في مائة راكب", "ref": "سَرِيَّةُ زيدِ بنِ حارِثةَ"}, {"id": "SAH-007-F4", "ar": "كان أمير الجيش في غزوة مؤتة واستشهد فيها.", "en": "He commanded the army at Mu'tah and was martyred there.", "dorar": 122, "url": "https://dorar.net/history/event/122", "q": "فقتل زيد بن حارثة", "ref": "غَزوةُ مُؤْتَةَ"}], "death": {"ar": "استشهد في مؤتة 8 هـ", "en": "Martyred at Mu'tah, 8 AH", "dorar": 122}}}, "jafar": {"name": "جعفر بن أبي طالب", "hon": "رضي الله عنه", "group": "family", "desc": "ابن عم النبي ﷺ، من مهاجري الحبشة، واستشهد في مؤتة.", "f": false, "full": "جعفر بن أبي طالب بن عبد المطلب الهاشمي", "laqab": "ذو الجناحين، والطيار", "islam": "من السابقين إلى الإسلام", "death": "٨ هـ في غزوة مؤتة", "bio": "ابن عم النبي ﷺ وأخو علي. هاجر إلى الحبشة، وتكلم باسم المسلمين أمام النجاشي فبيّن له الإسلام، وقرأ عليه صدرًا من سورة مريم. قدم على النبي ﷺ في خيبر، ثم استشهد في مؤتة بعد أن حمل الراية بعد زيد بن حارثة.", "name_en": "Ja'far ibn Abi Talib", "hon_en": "may Allah be pleased with him", "desc_en": "The Prophet's ﷺ cousin, an emigrant to Abyssinia, martyred at Mu'tah.", "full_en": "Ja'far ibn Abi Talib ibn Abd al-Muttalib of Hashim", "laqab_en": "Dhu al-Janahayn, al-Tayyar", "islam_en": "Among the earliest", "death_en": "8 AH, Mu'tah", "bio_en": "The Prophet's ﷺ cousin and Ali's brother. He migrated to Abyssinia and spoke for the Muslims before the Negus, explaining Islam and reciting from Surah Maryam. He reached the Prophet ﷺ at Khaybar and was martyred at Mu'tah after taking the banner from Zayd ibn Harithah.", "cited": {"id": "SAH-009", "facts": [{"id": "SAH-009-F1", "ar": "تكلم عن المسلمين أمام النجاشي في الحبشة.", "en": "He spoke for the Muslims before the Negus in Abyssinia.", "dorar": 19, "url": "https://dorar.net/history/event/19", "q": "قال جعفر بن أبي طالب -وكان هو المتكلم عن المسلمين", "ref": "الهِجرةُ الثَّانيةُ إلى الحَبشةِ"}, {"id": "SAH-009-F2", "ar": "بقي في الحبشة حتى قدم عند فتح خيبر.", "en": "He remained in Abyssinia until he arrived at the time of the conquest of Khaybar.", "dorar": 104, "url": "https://dorar.net/history/event/104", "q": "ووافقنا جعفر بن أبي طالب وأصحابه عنده", "ref": "هجرة أبي موسى الأشعري وأصحابه رضي الله عنهم إلى المدينة مروراً بالحَبشةِ"}, {"id": "SAH-009-F3", "ar": "حمل الراية في مؤتة واستشهد فيها.", "en": "He carried the banner at Mu'tah and was martyred there.", "dorar": 122, "url": "https://dorar.net/history/event/122", "q": "فأخذ الراية جعفر بن أبي طالب، فقاتل حتى قطعت يمينه", "ref": "غَزوةُ مُؤْتَةَ"}], "death": {"ar": "استشهد في مؤتة 8 هـ", "en": "Martyred at Mu'tah, 8 AH", "dorar": 122}}}, "aisha": {"name": "عائشة بنت أبي بكر", "hon": "رضي الله عنها", "group": "family", "desc": "أم المؤمنين، وابنة أبي بكر الصديق، ومن أكثر الصحابة رواية للحديث.", "f": true, "full": "عائشة بنت أبي بكر الصديق التيمية", "laqab": "أم المؤمنين، الصديقة، وكنيتها أم عبد الله", "islam": "وُلدت في الإسلام", "death": "٥٧ هـ أو ٥٨ هـ في المدينة", "bio": "تزوجها النبي ﷺ في مكة، ودخل بها في المدينة، وكانت من أحب نسائه إليه. كانت من أعلم الناس بالقرآن والفقه، ومن أكثر الصحابة رواية للحديث، وكان كبار الصحابة يرجعون إليها فيما أشكل عليهم. برّأها الله في القرآن في حادثة الإفك، وتوفي النبي ﷺ في بيتها، ودُفن فيه.", "name_en": "Aishah bint Abi Bakr", "hon_en": "may Allah be pleased with her", "desc_en": "Mother of the Believers, daughter of Abu Bakr, and one of the greatest narrators of hadith.", "full_en": "Aishah bint Abi Bakr al-Siddiq of Taym", "laqab_en": "Mother of the Believers, al-Siddiqah; Umm Abdullah", "islam_en": "Born into Islam", "death_en": "57 or 58 AH, Madinah", "bio_en": "The Prophet ﷺ married her in Makkah and she joined his household in Madinah, where she was among the dearest of his wives to him. She was among the most learned in the Quran and law and one of the Companions who narrated the most hadith, and senior Companions consulted her. Allah declared her innocence in the Quran after the slander, and the Prophet ﷺ passed away and was buried in her house.", "cited": {"id": "SAH-006", "facts": [{"id": "SAH-006-F1", "ar": "أم المؤمنين، عقد عليها النبي ﷺ قبل الهجرة وبنى بها بالمدينة.", "en": "Mother of the Believers. The Prophet ﷺ contracted marriage with her before the Hijrah, and she joined his household in Madinah.", "dorar": 30, "url": "https://dorar.net/history/event/30", "q": "تزوج رسول الله صلى الله عليه وسلم عائشة الصديقة", "ref": "زَواجُ النَّبيِّ مِن عائشةَ بنتِ أبي بكرٍ الصِّدِّيقِ رضِي الله عنهُما"}, {"id": "SAH-006-F2", "ar": "نزلت براءتها في حادثة الإفك.", "en": "Her innocence was revealed in the incident of the slander (al-Ifk).", "dorar": 79, "url": "https://dorar.net/history/event/79", "q": "آيات تبرئ الطاهرة المطهرة مما افتراه المفترون", "ref": "حادِثةُ الإفْكِ"}, {"id": "SAH-006-F3", "ar": "مُرّض النبي ﷺ في بيتها، ودفن في حجرتها.", "en": "The Prophet ﷺ was nursed in her house in his final illness and was buried in her room.", "dorar": 145, "url": "https://dorar.net/history/event/145", "q": "فاستأذنهن في أن يمرض في بيت عائشة", "ref": "مُصيبَةُ المسلمين الكُبرى بِوَفاةِ رسولِ الله صلَّى الله عليه وسلَّم"}], "death": null}}, "sawda": {"name": "سودة بنت زمعة", "hon": "رضي الله عنها", "group": "family", "desc": "أم المؤمنين، تزوجها النبي ﷺ بعد وفاة خديجة.", "f": true, "full": "سودة بنت زمعة العامرية القرشية", "laqab": "أم المؤمنين", "islam": "من السابقين، وهاجرت إلى الحبشة", "death": "في آخر خلافة عمر على المشهور", "bio": "أسلمت قديمًا، وهاجرت مع زوجها السكران بن عمرو إلى الحبشة، فلما توفي زوجها تزوجها النبي ﷺ في مكة بعد وفاة خديجة، فكانت أول من تزوج بعدها. عُرفت بالكرم وطيب النفس.", "name_en": "Sawdah bint Zam'ah", "hon_en": "may Allah be pleased with her", "desc_en": "Mother of the Believers; the Prophet ﷺ married her after Khadijah's death.", "full_en": "Sawdah bint Zam'ah of Amir, Quraysh", "laqab_en": "Mother of the Believers", "islam_en": "Among the earliest; emigrated to Abyssinia", "death_en": "Late in Umar's caliphate, by the common view", "bio_en": "She accepted Islam early and migrated with her husband al-Sakran ibn Amr to Abyssinia. After he died, the Prophet ﷺ married her in Makkah following Khadijah's death. She was known for her generosity and good nature.", "cited": {"id": "SAH-035", "facts": [{"id": "SAH-035-F1", "ar": "أول من تزوجها النبي ﷺ بعد خديجة.", "en": "She was the first woman the Prophet ﷺ married after Khadijah.", "dorar": 28, "url": "https://dorar.net/history/event/28", "q": "وكانت أول امرأة تزوجها بعد وفاة خديجة", "ref": "زَواجُ النَّبيِّ صلَّى الله عَليهِ وسلَّم من سَوْدَةَ بنتِ زَمْعَةَ رضِي الله عنها"}], "death": null}}, "ummsalama": {"name": "أم سلمة", "hon": "رضي الله عنها", "group": "family", "desc": "أم المؤمنين، هاجرت إلى الحبشة ثم إلى المدينة.", "f": true, "full": "هند بنت أبي أمية المخزومية القرشية", "laqab": "أم المؤمنين، أم سلمة", "islam": "من السابقين، وهاجرت إلى الحبشة", "death": "نحو ٦١ هـ في المدينة", "bio": "هاجرت مع زوجها أبي سلمة إلى الحبشة، ثم إلى المدينة. فلما توفي أبو سلمة تزوجها النبي ﷺ. عُرفت برجاحة العقل، وأشارت على النبي ﷺ يوم الحديبية أن يخرج فيذبح هديه ويحلق، ففعل، فتبعه الناس. وكانت آخر أمهات المؤمنين وفاة.", "name_en": "Umm Salamah", "hon_en": "may Allah be pleased with her", "desc_en": "Mother of the Believers; migrated to Abyssinia and then to Madinah.", "full_en": "Hind bint Abi Umayyah of Makhzum, Quraysh", "laqab_en": "Mother of the Believers, Umm Salamah", "islam_en": "Among the earliest; emigrated to Abyssinia", "death_en": "About 61 AH, Madinah", "bio_en": "She migrated with her husband Abu Salamah to Abyssinia and then to Madinah. After Abu Salamah died, the Prophet ﷺ married her. She was known for her wisdom: at Hudaybiyyah she advised the Prophet ﷺ to sacrifice and shave his head first, and the people followed him. She was the last of the Mothers of the Believers to pass away.", "cited": {"id": "SAH-030", "facts": [{"id": "SAH-030-F1", "ar": "فُرّق بينها وبين زوجها وابنها عند الهجرة ثم لحقت بزوجها.", "en": "At the Hijrah she was separated from her husband and her son, then later joined her husband.", "dorar": 33, "url": "https://dorar.net/history/event/33", "q": "ففرق بيني وبين ابني وبين زوجي", "ref": "هِجرةُ أبي سَلمةَ وأمِّ سَلمةَ رضي الله عنهما"}, {"id": "SAH-030-F2", "ar": "أشارت على النبي ﷺ يوم الحديبية بأن ينحر ويحلق.", "en": "At al-Hudaybiyyah she advised the Prophet ﷺ to slaughter his sacrifice and shave his head.", "dorar": 101, "url": "https://dorar.net/history/event/101", "q": "حتى أشارت عليه أم سلمة رضي الله عنها", "ref": "صُلْحُ الحُدَيبيةِ"}], "death": null}}, "ruqayya": {"name": "رقية بنت النبي ﷺ", "hon": "رضي الله عنها", "group": "family", "desc": "ابنة النبي ﷺ وزوجة عثمان بن عفان، توفيت يوم بدر.", "f": true, "full": "رقية بنت محمد ﷺ", "laqab": "", "islam": "أسلمت مع أمها خديجة", "death": "٢ هـ في المدينة", "bio": "ابنة النبي ﷺ من خديجة رضي الله عنها. تزوجها عثمان بن عفان، وهاجرت معه إلى الحبشة ثم إلى المدينة. مرضت والنبي ﷺ يتجهز لبدر، فأمر عثمان أن يبقى معها، وتوفيت يوم جاء خبر النصر في بدر.", "name_en": "Ruqayyah, daughter of the Prophet ﷺ", "hon_en": "may Allah be pleased with her", "desc_en": "The Prophet's ﷺ daughter and Uthman's wife; died on the day of Badr.", "full_en": "Ruqayyah bint Muhammad ﷺ", "laqab_en": "", "islam_en": "With her mother Khadijah", "death_en": "2 AH, Madinah", "bio_en": "The Prophet's ﷺ daughter by Khadijah. She married Uthman ibn Affan and migrated with him to Abyssinia and then Madinah. She fell ill as the Prophet ﷺ prepared for Badr, so he told Uthman to stay with her, and she died on the day news of the victory arrived.", "cited": {"id": "SAH-031", "facts": [{"id": "SAH-031-F1", "ar": "بنت النبي ﷺ، هاجرت مع زوجها عثمان إلى الحبشة.", "en": "Daughter of the Prophet ﷺ; she migrated to Abyssinia with her husband Uthman.", "dorar": 17, "url": "https://dorar.net/history/event/17", "q": "ومعه زوجته رقية بنت رسول الله", "ref": "الهِجرةُ الأُولى إلى الحَبشةِ"}, {"id": "SAH-031-F2", "ar": "توفيت سنة 2 هـ أيام بدر.", "en": "She died in 2 AH, at the time of Badr.", "dorar": 60, "url": "https://dorar.net/history/event/60", "q": "ثم ما لبثت رقية في مرضها حتى توفيت", "ref": "وفاةُ رُقَيَّةَ رضِي الله عنها"}], "death": {"ar": "2 هـ", "en": "2 AH", "dorar": 60}}}, "zaynab": {"name": "زينب بنت النبي ﷺ", "hon": "رضي الله عنها", "group": "family", "desc": "كبرى بنات النبي ﷺ.", "f": true, "full": "زينب بنت محمد ﷺ", "laqab": "", "islam": "أسلمت مع أمها خديجة", "death": "٨ هـ في المدينة", "bio": "كبرى بنات النبي ﷺ من خديجة. تزوجها ابن خالتها أبو العاص بن الربيع قبل البعثة، فأسلمت وبقي زوجها على شركه، ثم هاجرت إلى المدينة بعد بدر. أسلم زوجها بعد ذلك فردّها النبي ﷺ إليه، وتوفيت في المدينة.", "name_en": "Zaynab, daughter of the Prophet ﷺ", "hon_en": "may Allah be pleased with her", "desc_en": "The Prophet's ﷺ eldest daughter.", "full_en": "Zaynab bint Muhammad ﷺ", "laqab_en": "", "islam_en": "With her mother Khadijah", "death_en": "8 AH, Madinah", "bio_en": "The Prophet's ﷺ eldest daughter by Khadijah. She married her cousin Abu al-As ibn al-Rabi before the mission; she accepted Islam while he did not, and she migrated to Madinah after Badr. When he later accepted Islam the Prophet ﷺ returned her to him. She died in Madinah.", "cited": {"id": "SAH-032", "facts": [{"id": "SAH-032-F1", "ar": "كبرى بنات النبي ﷺ، توفيت سنة 8 هـ.", "en": "The eldest daughter of the Prophet ﷺ; she died in 8 AH.", "dorar": 116, "url": "https://dorar.net/history/event/116", "q": "هي زينب بنت رسول الله صلى الله عليه وسلم، وأكبر أخواتها", "ref": "وَفاةُ زَينبَ رضِي الله عنها بنتِ رسولِ الله صلَّى الله عليه وسلَّم"}, {"id": "SAH-032-F2", "ar": "أجارت زوجها أبا العاص فأجاز النبي ﷺ جوارها.", "en": "She granted protection to her husband Abu al-As, and the Prophet ﷺ upheld her protection.", "dorar": 95, "url": "https://dorar.net/history/event/95", "q": "فاستجار بها فأجارته", "ref": "سرية زيد بن حارثة رضي الله عنه إلى العيص"}], "death": {"ar": "8 هـ", "en": "8 AH", "dorar": 116}}}, "ummkulthum": {"name": "أم كلثوم بنت النبي ﷺ", "hon": "رضي الله عنها", "group": "family", "desc": "ابنة النبي ﷺ، تزوجها عثمان بن عفان بعد وفاة أختها رقية.", "f": true, "full": "أم كلثوم بنت محمد ﷺ", "laqab": "", "islam": "أسلمت مع أمها خديجة", "death": "٩ هـ في المدينة", "bio": "ابنة النبي ﷺ من خديجة. هاجرت إلى المدينة، وتزوجها عثمان بن عفان بعد وفاة أختها رقية، فلُقّب بذي النورين. توفيت في حياة النبي ﷺ.", "name_en": "Umm Kulthum, daughter of the Prophet ﷺ", "hon_en": "may Allah be pleased with her", "desc_en": "The Prophet's ﷺ daughter; married Uthman after her sister Ruqayyah died.", "full_en": "Umm Kulthum bint Muhammad ﷺ", "laqab_en": "", "islam_en": "With her mother Khadijah", "death_en": "9 AH, Madinah", "bio_en": "The Prophet's ﷺ daughter by Khadijah. She migrated to Madinah and married Uthman ibn Affan after her sister Ruqayyah died, which earned him the title 'possessor of two lights'. She died during the Prophet's ﷺ lifetime.", "cited": {"id": "SAH-033", "facts": [{"id": "SAH-033-F1", "ar": "بنت النبي ﷺ، تزوجها عثمان بعد رقية، وتوفيت سنة 9 هـ.", "en": "Daughter of the Prophet ﷺ; Uthman married her after Ruqayyah, and she died in 9 AH.", "dorar": 134, "url": "https://dorar.net/history/event/134", "q": "هي أم كلثوم بنت رسول الله صلى الله عليه وسلم", "ref": "وَفاةُ أمِّ كُلثومٍ بنتِ رسولِ الله صلَّى الله عليه وسلَّم"}], "death": {"ar": "9 هـ", "en": "9 AH", "dorar": 134}}}, "ibrahim": {"name": "إبراهيم ابن النبي ﷺ", "hon": "", "group": "family", "desc": "ابن النبي ﷺ من مارية القبطية، توفي صغيرًا.", "f": false, "full": "إبراهيم بن محمد ﷺ", "laqab": "", "islam": "", "death": "١٠ هـ في المدينة", "bio": "ابن النبي ﷺ من مارية القبطية، وُلد في المدينة وتوفي صغيرًا، فحزن عليه النبي ﷺ وبكى، وبيّن أن العين تدمع والقلب يحزن، ولا يقول المؤمن إلا ما يرضي ربه. وكسفت الشمس يوم موته، فأخبر النبي ﷺ أنها لا تكسف لموت أحد ولا لحياته.", "name_en": "Ibrahim, son of the Prophet ﷺ", "hon_en": "", "desc_en": "The Prophet's ﷺ son by Mariyah al-Qibtiyyah; died in infancy.", "full_en": "Ibrahim ibn Muhammad ﷺ", "laqab_en": "", "islam_en": "", "death_en": "10 AH, Madinah", "bio_en": "The Prophet's ﷺ son by Mariyah al-Qibtiyyah, born in Madinah. He died as a small child and the Prophet ﷺ wept for him, teaching that the eye weeps and the heart grieves, but a believer says only what pleases his Lord. The sun was eclipsed on the day he died, and the Prophet ﷺ explained that it does not eclipse for anyone's death or life."}, "bilal": {"name": "بلال بن رباح", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من السابقين إلى الإسلام، عُذّب في مكة، وصار مؤذن النبي ﷺ.", "f": false, "full": "بلال بن رباح الحبشي", "laqab": "مؤذن رسول الله ﷺ", "islam": "من السابقين إلى الإسلام", "death": "نحو ٢٠ هـ في الشام", "bio": "كان عبدًا لأمية بن خلف، فلما أسلم عذّبه في رمضاء مكة، وكان يقول: أحدٌ أحد، حتى اشتراه أبو بكر وأعتقه. هاجر إلى المدينة، واختاره النبي ﷺ مؤذنًا، وشهد بدرًا وما بعدها، وأذّن على الكعبة يوم فتح مكة. خرج بعد وفاة النبي ﷺ إلى الشام مجاهدًا، وتوفي هناك.", "name_en": "Bilal ibn Rabah", "hon_en": "may Allah be pleased with him", "desc_en": "An early Muslim tortured in Makkah who became the Prophet's ﷺ muezzin.", "full_en": "Bilal ibn Rabah al-Habashi", "laqab_en": "Muezzin of the Messenger of Allah ﷺ", "islam_en": "Among the earliest", "death_en": "About 20 AH, Syria", "bio_en": "Enslaved to Umayyah ibn Khalaf, he was tortured on the burning sands of Makkah for his faith, repeating 'One, One', until Abu Bakr bought and freed him. In Madinah the Prophet ﷺ chose him to call the adhan; he took part in Badr and later campaigns and called the adhan from the Kaaba on the day of the Conquest. After the Prophet ﷺ passed away he went to Syria and died there.", "cited": {"id": "SAH-016", "facts": [{"id": "SAH-016-F1", "ar": "عُذّب في مكة فثبت على الإسلام.", "en": "He was tortured in Makkah and held firm to Islam.", "dorar": 15, "url": "https://dorar.net/history/event/15", "q": "إلا بلالا، فإنه هانت عليه نفسه في الله", "ref": "ما لقِي الصَّحابةُ من إيذاءِ قُريشٍ"}, {"id": "SAH-016-F2", "ar": "اشتراه أبو بكر وأعتقه.", "en": "Abu Bakr bought him and set him free.", "dorar": 15, "url": "https://dorar.net/history/event/15", "q": "فاشتراه وأعتقه", "ref": "ما لقِي الصَّحابةُ من إيذاءِ قُريشٍ"}, {"id": "SAH-016-F3", "ar": "أذّن بالأذان حين شُرع في المدينة.", "en": "He gave the call to prayer when the adhan was instituted in Madinah.", "dorar": 39, "url": "https://dorar.net/history/event/39", "q": "فقم مع بلال فألق عليه ما رأيت فليؤذن به", "ref": "مَشروعِيَّةُ الأَذانِ"}], "death": null}}, "ammar": {"name": "عمار بن ياسر", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من السابقين إلى الإسلام، عُذّب هو وأبواه في مكة.", "f": false, "full": "عمار بن ياسر العنسي", "laqab": "أبو اليقظان", "islam": "من السابقين إلى الإسلام", "death": "٣٧ هـ", "bio": "أسلم هو وأبوه ياسر وأمه سمية في أول الدعوة، فعذّبهم المشركون في مكة، وكان النبي ﷺ يمر بهم فيبشرهم بالجنة ويأمرهم بالصبر. واستشهدت أمه سمية، فكانت أول شهيدة في الإسلام. هاجر إلى المدينة، وشارك في بناء المسجد، وشهد المشاهد كلها.", "name_en": "Ammar ibn Yasir", "hon_en": "may Allah be pleased with him", "desc_en": "An early Muslim who, with his parents, was tortured in Makkah.", "full_en": "Ammar ibn Yasir al-Ansi", "laqab_en": "Abu al-Yaqzan", "islam_en": "Among the earliest", "death_en": "37 AH", "bio_en": "He accepted Islam with his father Yasir and mother Sumayyah at the start of the call, and the polytheists tortured them. The Prophet ﷺ would pass by and promise them Paradise for their patience. His mother Sumayyah was killed, the first martyr in Islam. He migrated to Madinah, helped build the mosque, and took part in every campaign.", "cited": {"id": "SAH-017", "facts": [{"id": "SAH-017-F1", "ar": "من أول من أظهر إسلامه بمكة، وعُذّب مع أمه سمية.", "en": "He was among the first to declare his Islam openly in Makkah, and was tortured along with his mother Sumayyah.", "dorar": 15, "url": "https://dorar.net/history/event/15", "q": "وأبو بكر، وعمار، وأمه سمية", "ref": "ما لقِي الصَّحابةُ من إيذاءِ قُريشٍ"}], "death": null}}, "musab": {"name": "مصعب بن عمير", "hon": "رضي الله عنه", "group": "sahaba", "desc": "بعثه النبي ﷺ إلى المدينة يعلّم أهلها القرآن، واستشهد في أحد.", "f": false, "full": "مصعب بن عمير العبدري القرشي", "laqab": "مصعب الخير", "islam": "من السابقين إلى الإسلام", "death": "٣ هـ في غزوة أحد", "bio": "كان من أنعم فتيان مكة عيشًا، فلما أسلم ترك ذلك كله. هاجر إلى الحبشة، ثم بعثه النبي ﷺ بعد بيعة العقبة الأولى إلى المدينة يعلّم أهلها القرآن، فأسلم على يديه كثير من الأنصار، منهم سعد بن معاذ. حمل لواء المسلمين يوم أحد فاستشهد." efore the Hijrah, through Mus'ab", "death_en": "5 AH, Madinah", "bio_en": "He accepted Islam through Mus'ab ibn Umayr, and his whole clan, Banu Abd al-Ashhal, followed him. Before Badr he declared the Ansar's full support for the Prophet ﷺ. Wounded by an arrow at the Trench, he was asked to judge Banu Qurayzah and then died of his wound; the Prophet ﷺ said the Throne of the Most Merciful shook at his death.", "cited": {"id": "SAH-039", "facts": [{"id": "SAH-039-F1", "ar": "سيد الأوس، أسلم على يد مصعب بن عمير.", "en": "Chief of the Aws; he accepted Islam through Mus'ab ibn Umayr.", "dorar": 34, "url": "https://dorar.net/history/event/34", "q": "سيدا الأوس سعد بن معاذ", "ref": "انتِشارُ الإسلامِ في يَثْرِبَ بعدَ العَقبةِ الأولى"}, {"id": "SAH-039-F2", "ar": "حكم في بني قريظة.", "en": "He gave the judgment concerning Banu Qurayzah.", "dorar": 86, "url": "https://dorar.net/history/event/86", "q": "فجعل الحكم فيهم إلى سعد بن معاذ", "ref": "غَزوةُ يَهودِ بني قُرَيْظَةَ"}], "death": null}}, "ubayda": {"name": "عبيدة بن الحارث", "hon": "رضي الله عنه", "group": "family", "desc": "ابن عم النبي ﷺ، قاد إحدى أولى السرايا.", "f": false, "full": "عبيدة بن الحارث بن المطلب القرشي", "laqab": "", "islam": "من السابقين إلى الإسلام", "death": "٢ هـ بعد غزوة بدر", "bio": "من بني المطلب أقارب النبي ﷺ، وكان أسنّ منه. عقد له النبي ﷺ لواء إحدى أولى السرايا إلى رابغ. بارز يوم بدر مع حمزة وعلي فجُرح، وتوفي في طريق العودة إلى المدينة.", "name_en": "Ubaydah ibn al-Harith", "hon_en": "may Allah be pleased with him", "desc_en": "A relative of the Prophet ﷺ who led one of the first expeditions.", "full_en": "Ubaydah ibn al-Harith ibn al-Muttalib of Quraysh", "laqab_en": "", "islam_en": "Among the earliest", "death_en": "2 AH, after Badr", "bio_en": "From Banu al-Muttalib, relatives of the Prophet ﷺ, and older than him. The Prophet ﷺ gave him the banner of one of the first expeditions, to Rabigh. He dueled at Badr alongside Hamzah and Ali, was wounded, and died on the way back to Madinah.", "cited": {"id": "SAH-047", "facts": [{"id": "SAH-047-F1", "ar": "قاد سرية بطن رابغ سنة 1 هـ.", "en": "He led the expedition to Batn Rabigh in 1 AH.", "dorar": 46, "url": "https://dorar.net/history/event/46", "q": "بعث النبي صلى الله عليه وسلم عبيدة بن الحارث بن عبد المطلب في سرية", "ref": "سرية عبيدة بن الحارث بن المطلب إلى بطن رابغ"}], "death": null}}, "abdjahsh": {"name": "عبد الله بن جحش", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من السابقين إلى الإسلام، قاد سرية نخلة.", "f": false, "full": "عبد الله بن جحش الأسدي", "laqab": "", "islam": "من السابقين إلى الإسلام", "death": "٣ هـ في غزوة أحد", "bio": "ابن عمة النبي ﷺ أميمة بنت عبد المطلب، وأخو أم المؤمنين زينب بنت جحش. هاجر إلى الحبشة ثم إلى المدينة، وقاد سرية نخلة، واستشهد في غزوة أحد.", "name_en": "Abdullah ibn Jahsh", "hon_en": "may Allah be pleased with him", "desc_en": "An early Muslim who led the expedition to Nakhlah.", "full_en": "Abdullah ibn Jahsh of Asad", "laqab_en": "", "islam_en": "Among the earliest", "death_en": "3 AH, Uhud", "bio_en": "The son of the Prophet's ﷺ aunt Umaymah and brother of the Mother of the Believers Zaynab bint Jahsh. He migrated to Abyssinia and then Madinah, led the expedition to Nakhlah, and was martyred at Uhud.", "cited": {"id": "SAH-046", "facts": [{"id": "SAH-046-F1", "ar": "أمير سرية نخلة سنة 2 هـ.", "en": "He commanded the expedition to Nakhlah in 2 AH.", "dorar": 54, "url": "https://dorar.net/history/event/54", "q": "وفي هذه السرية سمي عبد الله بن جحش أمير المؤمنين", "ref": "سرية عبد الله بن جحش الأسدي إلى نخلة"}], "death": null}}, "maslama": {"name": "محمد بن مسلمة", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من الأنصار، قاد عددًا من السرايا.", "f": false, "full": "محمد بن مسلمة الأوسي الأنصاري", "laqab": "", "islam": "في المدينة قبل الهجرة", "death": "نحو ٤٣ هـ في المدينة", "bio": "من الأنصار، شهد بدرًا والمشاهد بعدها، وقاد عددًا من السرايا. وكان عمر بن الخطاب يبعثه في خلافته لمحاسبة الولاة والتحقق من أحوالهم.", "name_en": "Muhammad ibn Maslamah", "hon_en": en": "Al-Tufayl ibn Amr al-Dawsi", "hon_en": "may Allah be pleased with him", "desc_en": "Chief of the Daws tribe; accepted Islam in Makkah and called his people.", "full_en": "Al-Tufayl ibn Amr al-Dawsi", "laqab_en": "", "islam_en": "In Makkah before the Hijrah", "death_en": "Martyred at al-Yamamah, by the common view", "bio_en": "A chief and poet of the Daws tribe. Quraysh warned him against listening to the Prophet ﷺ in Makkah, but he heard the Quran and accepted Islam. He returned to call his people and later brought those who had accepted Islam to the Prophet ﷺ at Khaybar.", "cited": {"id": "SAH-052", "facts": [{"id": "SAH-052-F1", "ar": "من أشراف دوس، أسلم بمكة ودعا قومه، واستشهد باليمامة.", "en": "A nobleman of Daws; he accepted Islam in Makkah, called his people to it, and was martyred at al-Yamamah.", "dorar": 21, "url": "https://dorar.net/history/event/21", "q": "ثم سار مع المسلمين إلى اليمامة، واستشهد فيها", "ref": "إسلام الطّفيل بن عمرو الدوسي رَضي اللهُ عنه"}], "death": {"ar": "استشهد باليمامة", "en": "Martyred at al-Yamamah", "dorar": 21}}}, "khalid": {"name": "خالد بن الوليد", "hon": "رضي الله عنه", "group": "sahaba", "desc": "أسلم قبل فتح مكة، ولقّبه النبي ﷺ سيف الله.", "f": false, "full": "خالد بن الوليد المخزومي القرشي", "laqab": "سيف الله", "islam": "٨ هـ، قبل فتح مكة", "death": "٢١ هـ في حمص", "bio": "كان من فرسان قريش، وكان له أثر في غزوة أحد قبل إسلامه. أسلم مع عمرو بن العاص قبل فتح مكة، وأخذ الراية في مؤتة بعد استشهاد الأمراء الثلاثة فانسحب بالجيش، فسمّاه النبي ﷺ سيف الله. وقاد جيوش المسلمين بعد ذلك في فتوح العراق والشام.", "name_en": "Khalid ibn al-Walid", "hon_en": "may Allah be pleased with him", "desc_en": "Accepted Islam before the Conquest of Makkah; the Prophet ﷺ called him the Sword of Allah.", "full_en": "Khalid ibn al-Walid of Makhzum, Quraysh", "laqab_en": "Sword of Allah", "islam_en": "8 AH, before the Conquest", "death_en": "21 AH, Homs", "bio_en": "A leading horseman of Quraysh who played a part at Uhud before his Islam. He accepted Islam with Amr ibn al-As before the Conquest of Makkah. At Mu'tah he took the banner after the three commanders were martyred and withdrew the army safely, and the Prophet ﷺ named him the Sword of Allah. He later led the Muslim armies in Iraq and Syria.", "cited": {"id": "SAH-019", "facts": [{"id": "SAH-019-F1", "ar": "كان على ميمنة خيل قريش يوم أحد قبل إسلامه.", "en": "Before accepting Islam, he commanded the right wing of Quraysh's cavalry at Uhud.", "dorar": 69, "url": "https://dorar.net/history/event/69", "q": "فجعلوا على ميمنة الخيل خالد بن الوليد", "ref": "غَزوةُ أُحُدٍ وسبب هزيمة المسلمين"}, {"id": "SAH-019-F2", "ar": "أسلم سنة 8 هـ مع عمرو بن العاص وعثمان بن طلحة.", "en": "He accepted Islam in 8 AH together with Amr ibn al-As and Uthman ibn Talhah.", "dorar": 118, "url": "https://dorar.net/history/event/118", "q": "قال خالد بن الوليد: لما أراد الله عز وجل ما أراد من الخير قذف في قلبي الإسلام", "ref": "إِسلامُ عَمرِو بنِ العاصِ وخالدِ بنِ الوليدِ وعُثمانَ بنِ طلحةَ رضِي الله عنهم"}, {"id": "SAH-019-F3", "ar": "تولى القيادة في مؤتة وانحاز بالمسلمين.", "en": "He took command at Mu'tah and withdrew with the Muslims.", "dorar": 122, "url": "https://dorar.net/history/event/122", "q": "فاصطلح الناس على خالد بن الوليد", "ref": "غَزوةُ مُؤْتَةَ"}, {"id": "SAH-019-F4", "ar": "بعثه النبي ﷺ فهدم العزى.", "en": "The Prophet ﷺ sent him to destroy al-Uzza.", "dorar": 128, "url": "https://dorar.net/history/event/128", "q": "بعث خالد بن الوليد إلى العزى", "ref": "سَرِيَّةُ خالدِ بنِ الوليدِ رضِي الله عنه إلى العُزَّى بنَخْلَةَ"}], "death": null}}, "amr": {"name": "عمرو بن العاص", "hon": "رضي الله عنه", "group": "sahaba", "desc": "أسلم قبل فتح مكة، وقاد سرية ذات السلاسل.", "f": false, "full": "عمرو بن العاص السهمي القرشي", "laqab": "أبو عبد الله", "islam": "٨ هـ، قبل فتح مكة", "death": "٤٣ هـ في مصر", "bio": "كان من دهاة قريش، وأرسلته إلى النجاشي ليرد المهاجرين فأبى. أسلم قبل فتح مكة، وأمّره النبي ﷺ على سرية ذات السلاسل، وبعثه إلى عُمان. وفتح مصر في خلافة عمر، وتولى إمارتها.", "name_en": "Amr ibn al-As", "hon_en": "may Allah be pleased with him", "desc_en": "Accepted Islam before the Conquest; led the expedition of Dhat al-Salasil.", "full_en": "Amr ibn al-As of Sahm, Quraysh", "laqab_en": "Abu Abdullah", "islam_en": "8 AH, before the Conquest", "death_en": "43 AH, Egypt", "bio_en": "A shrewd man of Quraysh, who once sent him to the Negus to bring back the emigrants, but the Negus refused. He accepted Islam before the Conquest, commanded the expedition of Dhat al-Salasil, and was sent by the Prophet ﷺ to Oman. He conquered Egypt in Umar's caliphate and governed it.", "cited": {"id": "SAH-020", "facts": [{"id": "SAH-020-F1", "ar": "أسلم سنة 8 هـ مع خالد بن الوليد وعثمان بن طلحة.", "en": "He accepted Islam in 8 AH together with Khalid ibn al-Walid and Uthman ibn Talhah.", "dorar": 118, "url": "https://dorar.net/history/event/118", "q": "فوجدنا عمرو بن العاص بها", "ref": "إِسلامُ عَمرِو بنِ العاصِ وخالدِ بنِ الوليدِ وعُثمانَ بنِ طلحةَ رضِي الله عنهم"}, {"id": "SAH-020-F2", "ar": "كان أمير غزوة ذات السلاسل.", "en": "He commanded the campaign of Dhat al-Salasil.", "dorar": 123, "url": "https://dorar.net/history/event/123", "q": "فكان أميرها عمرو بن العاص", "ref": "غَزوةُ ذاتِ السَّلاسِلِ"}, {"id": "SAH-020-F3", "ar": "بعثه النبي ﷺ فهدم صنم سواع.", "en": "The Prophet ﷺ sent him to destroy the idol Suwa'.", "dorar": 129, "url": "https://dorar.net/history/event/129", "q": "بعث رسول الله صلى الله عليه وسلم عمرو بن العاص إلى سواع", "ref": "سَرِيَّةُ عَمرِو بنِ العاصِ رضِي الله عنه إلى سُواعٍ، صَنَمِ هُذيلٍ"}, {"id": "SAH-020-F4", "ar": "حمل كتاب النبي ﷺ إلى ملكي عمان.", "en": "He carried the Prophet's ﷺ letter to the two kings of Oman.", "dorar": 106, "url": "https://dorar.net/history/event/106", "q": "وبعث عمرو بن العاص السهمي إلى جيفر", "ref": "مراسلة النبي صلى الله عليه وسلم إلى المُلوكِ يَدعوهُم إلى الإسلامِ"}], "death": null}}, "khubayb": {"name": "خبيب بن عدي", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من الأنصار، أُسر يوم الرجيع وقُتل في مكة صابرًا.", "f": false, "full": "خبيب بن عدي الأوسي الأنصاري", "laqab": "", "islam": "من الأنصار", "death": "٤ هـ في مكة", "bio": "شهد بدرًا، وكان في سرية الرجيع فغُدر بها، فأُسر وبيع لقريش في مكة، فصلّى ركعتين قبل قتله، فكان أول من سنّ الصلاة عند القتل.", "name_en": "Khubayb ibn Adi", "hon_en": "may Allah be pleased with him", "desc_en": "One of the Ansar, captured at al-Raji and killed in Makkah.", "full_en": "Khubayb ibn Adi of the Aws, Ansar", "laqab_en": "", "islam_en": "One of the Ansar", "death_en": "4 AH, Makkah", "bio_en": "He fought at Badr and was among the party betrayed at al-Raji. Captured and sold to Quraysh in Makkah, he prayed two units of prayer before he was killed, the first to establish this practice.", "cited": {"id": "SAH-041", "facts": [{"id": "SAH-041-F1", "ar": "أُسر يوم الرجيع وقُتل بمكة، وسنّ الركعتين لمن يُقتل صبرًا.", "en": "He was captured on the Day of al-Raji' and killed in Makkah, and he set the practice of praying two rak'ahs before being executed.", "dorar": 74, "url": "https://dorar.net/history/event/74", "q": "قال لهم خبيب: ذروني أركع ركعتين", "ref": "سرية يَوم الرَّجيعِ"}], "death": {"ar": "قُتل بمكة بعد يوم الرجيع 4 هـ", "en": "Killed in Makkah after the Day of al-Raji', 4 AH", "dorar": 74}}}, "asim": {"name": "عاصم بن ثابت", "hon": "رضي الله عنه", "group": "sahaba", "desc": "من الأنصار، أمير سرية الرجيع.", "f": false, "full": "عاصم بن ثابت الأوسي الأنصاري", "laqab": "", "islam": "من الأنصار", "death": "٤ هـ يوم الرجيع", "bio": "شهد بدرًا وأحدًا، وكان أمير سرية الرجيع، فقاتل حتى استشهد، وحمى الله جسده من أن يناله المشركون.", "name_en": "Asim ibn Thabit", "hon_en": "may Allah be pleased with him", "desc_en": "One of the Ansar; leader of the party at al-Raji.", "full_en": "Asim ibn Thabit of the Aws, Ansar", "laqab_en": "", "islam_en": "One of the Ansar", "death_en": "4 AH, al-Raji", "bio_en": "He fought at Badr and Uhud and led the party at al-Raji, fighting until he was martyred. Allah protected his body from the polytheists.", "cited": {"id": "SAH-042", "facts": [{"id": "SAH-042-F1", "ar": "أمير سرية الرجيع، استشهد فيها.", "en": "He commanded the expedition of al-Raji' and was martyred in it.", "dorar": 74, "url": "https://dorar.net/history/event/74", "q": "وأمر عليهم عاصم بن ثابت الأنصاري", "ref": "سرية يَوم الرَّجيعِ"}], "death": {"ar": "استشهد يوم الرجيع 4 هـ", "en": "Martyred on the Day of al-Raji', 4 AH", "dorar": 74}}}, "ghalib": {"name": "غالب بن عبد الله الليثي", "hon": "رضي الله عنه", "group": "sahaba", "desc": "قاد عددًا من السرايا.", "f": false, "full": "غالب بن عبد الله الليثي", "laqab": "", "islam": "", "death": "", "bio": "من بني ليث من كنانة، أمّره النبي ﷺ على عدة سرايا في السنتين السابعة والثامنة، منها سرية بني الملوح وسرية فدك.", "name_en": "Ghalib ibn Abdullah al-Laythi", "hon_en": "may Allah be pleased with him", "desc_en": "Led several expeditions.", "full_en": "Ghalib ibn Abdullah al-Laythi", "laqab_en": "", "islam_en": "", "death_en": "", "bio_en": "From Banu Layth of Kinanah, the Prophet ﷺ placed him in command of several expeditions in years 7 and 8, including those to Banu al-Mulawwah and Fadak."}, "dihya": {"name": "دحية الكلبي", "hon": "رضي الله عنه", "group": "sahaba", "desc": "حمل كتاب النبي ﷺ إلى قيصر الروم.", "f": false, "full": "دحية بن خليفة الكلبي", "laqab": "", "islam": "", "death": "في الشام", "bio": "من قبيلة كلب، وكان جبريل عليه السلام يأتي النبي ﷺ أحيانًا في صورته. حمل كتاب النبي ﷺ إلى هرقل قيصر الروم، وعاش بعد ذلك في الشام.", "name_en": "Dihyah al-Kalbi", "hon_en": "may Allah be pleased with him", "desc_en": "Carried the Prophet's ﷺ letter to Heraclius.", "full_en": "Dihyah ibn Khalifah al-Kalbi", "laqab_en": "", "islam_en": "", "death_en": "Syria", "bio_en": "From the tribe of Kalb. The Angel Jibril sometimes came to the Prophet ﷺ in his form. He carried the Prophet's ﷺ letter to Heraclius, the Byzantine emperor, and later lived in Syria."}, "abusufyan": {"name": "أبو سفيان بن حرب", "hon": "رضي الله عنه", "group": "others", "desc": "كان من قادة قريش في حربها على المسلمين، ثم أسلم عام الفتح.", "f": false, "full": "صخر بن حرب بن أمية القرشي", "laqab": "أبو سفيان", "islam": "ليلة فتح مكة، ٨ هـ", "death": "نحو ٣١ هـ في المدينة", "bio": "كان من سادة قريش وتجّارها، وقاد قافلتها التي كانت سببًا في غزوة بدر، ثم قاد قريشًا في أحد والأحزاب. أسلم ليلة فتح مكة، وجعل النبي ﷺ من دخل داره آمنًا. شهد حنينًا والطائف بعد إسلامه، وهو والد أم المؤمنين أم حبيبة.", "name_en": "Abu Sufyan ibn Harb", "hon_en": "may Allah be pleased with him", "desc_en": "Led Quraysh against the Muslims, then accepted Islam at the Conquest.", "full_en": "Sakhr ibn Harb ibn Umayyah of Quraysh", "laqab_en": "Abu Sufyan", "islam_en": "The night before the Conquest, 8 AH", "death_en": "About 31 AH, Madinah", "bio_en": "A leading merchant and chief of Quraysh. He led the caravan that led to Badr, then led Quraysh at Uhud and the Trench. He accepted Islam on the night before the Conquest, and the Prophet ﷺ declared that whoever entered his house would be safe. He fought at Hunayn and Taif after his Islam, and was the father of the Mother of the Believers Umm Habibah."}, "najashi": {"name": "النجاشي أصحمة", "hon": "رحمه الله", "group": "others", "desc": "ملك الحبشة، آوى المهاجرين المسلمين وأسلم، وصلى عليه النبي ﷺ صلاة الغائب.", "f": false, "full": "أصحمة بن أبجر، ملك الحبشة", "laqab": "النجاشي لقب ملوك الحبشة", "islam": "أسلم في ملكه", "death": "٩ هـ في الحبشة", "bio": "ملك الحبشة، عُرف بالعدل، فأذن النبي ﷺ لأصحابه بالهجرة إليه، فآواهم وأكرمهم، وأبى أن يسلّمهم لقريش. أسلم، ولما مات صلّى عليه النبي ﷺ صلاة الغائب في المدينة.", "name_en": "The Negus Ashama", "hon_en": "may Allah have mercy on him", "desc_en": "King of Abyssinia, who sheltered the Muslim emigrants and accepted Islam.", "full_en": "Ashama ibn Abjar, king of Abyssinia", "laqab_en": "al-Najashi, the title of Abyssinia's kings", "islam_en": "During his reign", "death_en": "9 AH, Abyssinia", "bio_en": "The king of Abyssinia, known for his justice, so the Prophet ﷺ allowed his Companions to migrate to him. He sheltered and honoured them and refused to hand them over to Quraysh. He accepted Islam, and when he died the Prophet ﷺ led the funeral prayer for him in absentia in Madinah."}, "abujahl": {"name": "أبو جهل", "hon": "", "group": "others", "desc": "من أشد زعماء قريش عداوة للإسلام، قُتل في غزوة بدر.", "f": false, "full": "عمرو بن هشام المخزومي", "laqab": "كان يُكنى أبا الحكم", "islam": "", "death": "٢ هـ في غزوة بدر", "bio": "من زعماء قريش، وكان من أشدهم أذى للنبي ﷺ والمسلمين، وهو صاحب الرأي بقتل النبي ﷺ في دار الندوة. قاد قريشًا إلى بدر، وقُتل فيها.", "name_en": "Abu Jahl", "hon_en": "", "desc_en": "A leader of Quraysh and one of Islam's fiercest enemies; killed at Badr.", "full_en": "Amr ibn Hisham of Makhzum", "laqab_en": "Known as Abu al-Hakam", "islam_en": "", "death_en": "2 AH, Badr", "bio_en": "A chief of Quraysh and among the harshest towards the Prophet ﷺ and the Muslims. He proposed the plan to kill the Prophet ﷺ at Dar al-Nadwah, led Quraysh to Badr, and was killed there."}, "abulahab": {"name": "أبو لهب", "hon": "", "group": "others", "desc": "عم النبي ﷺ، ومن أشد الناس عداوة له.", "f": false, "full": "عبد العزى بن عبد المطلب", "laqab": "أبو لهب", "islam": "", "death": "٢ هـ في مكة", "bio": "عم النبي ﷺ، وكان من أشد الناس عداوة له، يتبعه في المواسم يكذّبه ويصد الناس عنه، ونزلت فيه وفي امرأته سورة المسد.", "name_en": "Abu Lahab", "hon_en": "", "desc_en": "The Prophet's ﷺ uncle and one of his fiercest opponents.", "full_en": "Abd al-Uzza ibn Abd al-Muttalib", "laqab_en": "Abu Lahab", "islam_en": "", "death_en": "2 AH, Makkah", "bio_en": "The Prophet's ﷺ uncle and one of his fiercest enemies, following him through the pilgrimage gatherings to call him a liar and turn people away. Surah Al-Masad was revealed about him and his wife."}, "ubayy": {"name": "عبد الله بن أبي ابن سلول", "hon": "", "group": "others", "desc": "رأس المنافقين في المدينة.", "f": false, "full": "عبد الله بن أبي ابن سلول الخزرجي", "laqab": "", "islam": "", "death": "٩ هـ في المدينة", "bio": "كان من سادة الخزرج قبل الهجرة. أظهر الإسلام بعد بدر، وكان رأس المنافقين، فرجع بنحو ثلث الجيش يوم أحد، وكان ممن خاضوا في حادثة الإفك. ولما مات صلى عليه النبي ﷺ، ثم نزل القرآن بالنهي عن الصلاة على المنافقين.", "name_en": "Abdullah ibn Ubayy ibn Salul", "hon_en": "", "desc_en": "Leader of the hypocrites in Madinah.", "full_en": "Abdullah ibn Ubayy ibn Salul of the Khazraj", "laqab_en": "", "islam_en": "", "death_en": "9 AH, Madinah", "bio_en": "A chief of the Khazraj before the Hijrah. He professed Islam after Badr but led the hypocrites: he withdrew about a third of the army at Uhud and was among those who spread the slander. When he died the Prophet ﷺ prayed over him, and then verses were revealed forbidding prayer over hypocrites."}, "huyayy": {"name": "حيي بن أخطب", "hon": "", "group": "others", "desc": "من زعماء يهود بني النضير، حرّض الأحزاب على المسلمين.", "f": false, "full": "حيي بن أخطب النضري", "laqab": "", "islam": "", "death": "٥ هـ", "bio": "من زعماء يهود بني النضير، أُجلي مع قومه إلى خيبر، ثم سعى في جمع قريش والقبائل على المسلمين في غزوة الأحزاب، وحرّض بني قريظة على نقض عهدهم، فقُتل معهم.", "name_en": "Huyayy ibn Akhtab", "hon_en": "", "desc_en": "A leader of Banu al-Nadir who rallied the confederates against the Muslims.", "full_en": "Huyayy ibn Akhtab of Banu al-Nadir", "laqab_en": "", "islam_en": "", "death_en": "5 AH", "bio_en": "A leader of Banu al-Nadir, he was expelled with his people to Khaybar, then worked to rally Quraysh and the tribes against the Muslims at the Trench and urged Banu Qurayzah to break their covenant, and was executed with them."}}, "asbab": {"ASB-001": {"t": "بدء الوحي في غار حراء", "t_en": "The beginning of revelation in the Cave of Hira", "refs": [[96, "العلق", "Al-Alaq", "1-5"]], "ph": "هذا ما جرى عند نزولها", "ph_en": "What happened when it was revealed", "txt": "جاء جبريل عليه السلام إلى النبي ﷺ وهو يتعبد في غار حراء، فقال له: «اقرأ»، فنزلت الآيات الخمس الأولى من سورة العلق، وهي أول ما نزل من القرآن.", "bk": "3، 4953", "ms": "160", "type": "حادثة مقارنة للنزول", "whole": false, "ev": "", "ev_en": "", "tafs": []}, "ASB-002": {"t": "فترة الوحي ثم نزول صدر سورة المدثر", "t_en": "The pause in revelation, then the opening of Surat al-Muddaththir", "refs": [[74, "المدثر", "Al-Muddaththir", "1-5"]], "ph": "هذا ما جرى عند نزولها", "ph_en": "What happened when it was revealed", "txt": "بعد فترة انقطع فيها الوحي، رأى النبي ﷺ الملك الذي جاءه بحراء جالسًا على كرسي بين السماء والأرض، فرجع إلى أهله فقال: «زمّلوني»، فدثّروه، فأنزل الله: ﴿يَا أَيُّهَا الْمُدَّثِّرُ﴾.", "bk": "4، 4924", "ms": "161", "type": "حادثة مقارنة للنزول", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/74/1"]}, "ASB-003": {"t": "إسلام سعد بن أبي وقاص وموقف أمه", "t_en": "Sa'd ibn Abi Waqqas's Islam and his mother's stance", "refs": [[29, "العنكبوت", "Al-Ankabut", "8"], [31, "لقمان", "Luqman", "15"]], "ph": "نزلت هذه الآيات بسبب الواقعة المذكورة", "ph_en": "These verses were revealed because of the incident above", "txt": "حلفت أم سعد بن أبي وقاص رضي الله عنه ألا تكلمه أبدًا ولا تأكل ولا تشرب حتى يكفر بدينه، فأنزل الله الوصية بالوالدين، مع النهي عن طاعتهما في الشرك، ومصاحبتهما في الدنيا بالمعروف.", "bk": "", "ms": "1748", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/29/2"]}, "ASB-004": {"t": "النهي عن الجهر الشديد بالقراءة في الصلاة بمكة", "t_en": "Not raising the voice too loudly in prayer in Makkah", "refs": [[17, "الإسراء", "Al-Isra", "110"]], "ph": "نزلت هذه الآية بسبب الواقعة المذكورة", "ph_en": "This verse was revealed because of the incident above", "txt": "قال ابن عباس رضي الله عنهما: نزلت والنبي ﷺ مختفٍ بمكة، وكان إذا صلى بأصحابه رفع صوته بالقرآن، فإذا سمعه المشركون سبّوا القرآن ومن أنزله ومن جاء به، فأمره الله ألا يجهر بقراءته فيسمعها المشركون، ولا يخافت بها عن أصحابه.", "bk": "4722، 7490", "ms": "446", "type": "سبب نزول صريح", "whole": false, "ev": "", "ev_en": "", "tafs": ["https://dorar.net/tafseer/17/26"]},
